<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HCC3 Module 9 - Postpartum Nursing Care: NGN Mock Exam</title>
<script>try{var t=localStorage.getItem("hcc3-examA-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<style>:root{--bg:#f6f8fb;--card:#fff;--ink:#1d2433;--mut:#5b6476;--line:#dfe5ee;--blue:#2f6fd6;--blue2:#e8f0fc;--blue3:#c9dbf7;--ok:#16824f;--ok2:#e3f5eb;--no:#c23a4b;--no2:#fdebee;--part:#b27300;--part2:#fff4dc;--mark:#fff176;--r:12px}
[data-theme=dark]{--bg:#11151d;--card:#1a202b;--ink:#e5e9f1;--mut:#a2abbd;--line:#2c3443;--blue:#6ea2ff;--blue2:#1d2a40;--blue3:#2e4466;--ok:#4bd18c;--ok2:#163225;--no:#ff7385;--no2:#3a1d24;--part:#f0b44c;--part2:#33290f;--mark:#8a7a12;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--blue)}
h1{font-size:1.45rem;margin:.2em 0 .5em;line-height:1.25}
h2{font-size:1.15rem;margin:.1em 0 .6em}
h3{font-size:1rem;margin:1.1em 0 .4em}
.small{font-size:.9rem;color:var(--mut)}
.kick{font-size:.78rem;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.05em}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{font-weight:700;color:var(--ink);text-decoration:none;min-height:44px;display:flex;align-items:center;gap:8px}
.brand span{color:var(--blue);font-weight:600}
main{max-width:980px;margin:0 auto;padding:16px 14px 90px;outline:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:0 0 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:10px 18px;border-radius:10px;border:1px solid var(--blue);background:var(--blue);color:#fff;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;margin:4px 6px 4px 0}
[data-theme=dark] .btn{color:#0d1626}
.btn.ghost{background:var(--blue2);color:var(--blue);border-color:var(--blue3)}
.btn.quiet{background:transparent;color:var(--mut);border-color:var(--line)}
.btn.danger{background:var(--no);border-color:var(--no);color:#fff}
.btn.sm{min-height:36px;padding:4px 10px;font-size:.85rem;margin-left:6px}
.btn.big{min-height:52px;font-size:1.05rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.tbtn{min-height:40px;min-width:40px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.tbtn.on{background:var(--mark);border-color:#d6c400;color:#1d2433}
.chip{font-size:.85rem;color:var(--mut);padding:6px 10px;border:1px solid var(--line);border-radius:10px;min-height:40px;display:inline-flex;align-items:center}
.chip.low,#tmr.low{color:var(--no);border-color:var(--no)}
.hero p{color:var(--mut)}
.resume{margin-top:10px;padding:12px;border-radius:10px;background:var(--blue2)}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.mode{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px}
.mode p{margin:.3em 0 .5em;color:var(--mut);font-size:.92rem}
.mi{font-size:1.6rem}
.mode select{width:100%;min-height:44px;margin:4px 0;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:6px}
.tog{display:flex;align-items:center;gap:8px;font-size:.9rem;min-height:40px;cursor:pointer}
.tog input{width:18px;height:18px;accent-color:var(--blue)}
.hist{width:100%;border-collapse:collapse;font-size:.92rem}
.hist td,.hist th{padding:8px;border-bottom:1px solid var(--line);text-align:left}
/* question screen */
.qtop{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.qtools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:var(--blue)}
.scen{padding:10px 14px;border-left:4px solid var(--blue);background:var(--blue2);border-radius:8px;margin-bottom:10px}
.chart{background:var(--card);border:1px solid var(--blue3);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.cbar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 14px;background:var(--blue2);font-size:.92rem}
.banner{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
.banner span{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:.85rem}
.chart details{border-bottom:1px solid var(--line)}
.chart details:last-child{border-bottom:0}
.chart summary{padding:10px 14px;font-weight:700;cursor:pointer;min-height:44px}
.chart ul{margin:0;padding:0 14px 12px 34px;font-size:.92rem}
.tw{overflow-x:auto}
.flow{width:100%;border-collapse:collapse;font-size:.84rem}
.flow th,.flow td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.flow th{background:var(--bg);white-space:nowrap}
tr.new td,li.new{background:var(--part2)}
li.new::after,tr.new td:first-child::after{content:" NEW";font-size:.7rem;font-weight:800;color:var(--part)}
.notes{list-style:none;padding-left:14px!important}
.notes li{padding:6px 8px;border-radius:6px;margin:2px 0}
.lead{padding:12px 14px;border:1px solid var(--line);border-left:4px solid var(--part);border-radius:8px;background:var(--card);margin-bottom:12px}
.qtype{font-size:.8rem;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.04em}
.stem{font-size:1.04rem;font-weight:600;margin:6px 0 14px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;min-height:50px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--blue)}
.ol{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--blue3);display:inline-flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:700;color:var(--blue)}
.opt.sata .ol{border-radius:6px}
.opt.sel{border-color:var(--blue);background:var(--blue2)}
.opt.sel .ol{background:var(--blue);color:#fff;border-color:var(--blue)}
.right{border-color:var(--ok)!important;background:var(--ok2)!important}
.wrong{border-color:var(--no)!important;background:var(--no2)!important}
.missed{border:2px dashed var(--ok)!important}
.cloze{line-height:2.6;font-size:1.02rem}
.dd{min-height:42px;max-width:100%;padding:4px 8px;border-radius:8px;border:2px solid var(--blue3);background:var(--card);color:var(--ink);font:inherit;font-size:.95rem}
.fix{font-size:.85rem;color:var(--ok);font-weight:700;margin:0 6px}
.hlnote{padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);line-height:2}
.hlhelp{font-size:.82rem;color:var(--mut);line-height:1.4;margin-bottom:6px}
.cue{cursor:pointer;border-bottom:2px dotted var(--blue3);padding:2px 2px;border-radius:4px}
.cue:hover{background:var(--blue2)}
.cue.sel{background:var(--blue);color:#fff;border-bottom-color:var(--blue)}
[data-theme=dark] .cue.sel{color:#0d1626}
.cue.right,.cue.wrong,.cue.missed{color:var(--ink)}
.matrix{width:100%;border-collapse:collapse;font-size:.94rem}
.matrix th,.matrix td{border:1px solid var(--line);padding:8px;text-align:center}
.matrix td:first-child{text-align:left}
.matrix th{background:var(--blue2);font-size:.85rem}
.matrix label{display:flex;align-items:center;justify-content:center;min-height:40px;cursor:pointer}
.matrix input{width:20px;height:20px;accent-color:var(--blue)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.bowtie{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:start}
.bcol{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.bc{border-color:var(--blue);background:var(--blue2)}
.bh{font-weight:700;font-size:.9rem}
.bh small{font-weight:400;color:var(--mut)}
.bopt{min-height:46px;text-align:left;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.bopt.sel{border-color:var(--blue);background:var(--blue);color:#fff}
[data-theme=dark] .bopt.sel{color:#0d1626}
.bopt.right,.bopt.wrong,.bopt.missed{color:var(--ink)}
.ord{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.oi{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:grab}
.oi.drag{opacity:.5}
.on{flex:none;width:26px;height:26px;border-radius:50%;background:var(--blue2);color:var(--blue);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.ot{flex:1}
.oa{display:flex;gap:4px}
.oa button{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.ordhelp{font-size:.85rem;color:var(--mut);margin-bottom:8px}
.qnav{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:4px 0 12px}
mark.mine{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
body.hlmode .hlzone{cursor:text;outline:2px dashed #d6c400;outline-offset:2px}
.rat{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--card);margin-bottom:14px}
.verdict{font-weight:700;padding:8px 12px;border-radius:8px;margin-bottom:10px}
.verdict.ok{background:var(--ok2);color:var(--ok)}.verdict.no{background:var(--no2);color:var(--no)}.verdict.part{background:var(--part2);color:var(--part)}
.rgrid{display:grid;grid-template-columns:180px 1fr;gap:8px 14px;font-size:.94rem}
.rk{font-weight:700;color:var(--mut)}
.take{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--blue2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;margin:10px 0}
.gq{position:relative;min-height:46px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.gq.a{background:var(--blue2);border-color:var(--blue3)}
.gq.f{border-color:var(--part);border-width:2px}
.gq.l{opacity:.65}
.gq i{font-style:normal;font-size:.7rem;position:absolute;top:1px;right:3px}
.legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.85rem;color:var(--mut);margin-bottom:10px}
.legend .gq{min-height:30px;width:38px;display:inline-flex;align-items:center;justify-content:center;cursor:default}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:10px 0}
.kpis div{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.kpis b{display:block;font-size:1.3rem;color:var(--blue)}
.kpis span{font-size:.8rem;color:var(--mut)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(150px,260px) 1fr 52px;gap:10px;align-items:center;font-size:.92rem}
.bar small{color:var(--mut)}
.bt{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bt i{display:block;height:100%;border-radius:99px}
.bt i.g{background:var(--ok)}.bt i.y{background:var(--part)}.bt i.r{background:var(--no)}
.bv{font-weight:700;text-align:right}
.bar.dim{opacity:.55}
.rem ul,.rem ol{padding-left:1.2em}
.rem li{margin:6px 0}
.irv{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.irv summary{cursor:pointer;font-size:.94rem;min-height:30px}
.irq{margin:10px 0;pointer-events:none}
.pill{display:inline-block;min-width:46px;text-align:center;border-radius:99px;font-size:.8rem;font-weight:700;padding:1px 8px;margin-right:6px}
.pill.ok{background:var(--ok2);color:var(--ok)}.pill.part{background:var(--part2);color:var(--part)}.pill.no{background:var(--no2);color:var(--no)}
details>summary.btn{list-style:none}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1d2433;color:#fff;padding:12px 16px;border-radius:10px;z-index:60;max-width:92vw;font-size:.92rem}
@media (max-width:720px){
  .brand span{display:none}
  .bowtie{grid-template-columns:1fr}
  .bc{order:-1}
  .rgrid{grid-template-columns:1fr}
  .rk{margin-top:6px}
  .bar{grid-template-columns:1fr 90px 44px}
  .card{padding:14px}
  .matrix{font-size:.85rem}
}
</style>

<script>window.EXAM={"items":[{"id":"P01","topic":"physio","cj":"rc","stem":"A client is on <b>postpartum day 3</b> after an uncomplicated vaginal birth. Classify each finding.","t":"matrix","cols":["Expected","Unexpected — needs follow-up"],"rows":[{"r":"Fundus firm, midline, 3 cm below the umbilicus","a":0},{"r":"Pulse 58 beats/min at rest","a":0},{"r":"Fundus firm, 2 cm <b>above</b> the umbilicus, midline, after voiding","a":1},{"r":"Voids 600–800 mL at a time; woke soaked in sweat","a":0},{"r":"Temperature 100.8°F, rechecked 100.6°F one hour later","a":1},{"r":"Lochia rubra, light, fleshy odor","a":0}],"why":"By day 3 the fundus should have descended about 1–2 cm per day from its 12-hour position (~1 cm above U), so ~2–3 cm below the umbilicus is right on schedule. Puerperal bradycardia (50–90), diuresis, and night diaphoresis are normal. Rubra lasts days 1–3. <i>Pathophysiology:</i> Involution relies on contraction and autolysis; anything inside the cavity or inflaming the endometrium stalls descent.","wrong":"A fundus <i>above</i> the umbilicus on day 3 — with an empty bladder — is subinvolution until proven otherwise (retained fragments, infection). A fever ≥100.4°F after the first 24 h is not dehydration; it is a possible infection cue.","cues":"Day 3 + fundus above U after voiding; persistent fever after 24 h.","safety":"Report both unexpected findings; assess lochia odor, uterine tenderness, and temperature trend. <i>Anticipate / reassess:</i> Anticipate ultrasound for retained tissue and evaluation for endometritis.","take":"Day 3 fundus ≈ 2–3 cm below U. Above U after voiding = subinvolution. Fever after 24 h ≠ dehydration.","src":"Ch. 18, pp. 454, 458","hy":true,"cats":["assess"]},{"id":"P02","topic":"physio","cj":"ac","stem":"At a <b>2-week</b> postpartum visit, which finding is most consistent with <b>subinvolution</b>?","t":"mc","opts":["Fundus palpable 4 cm above the symphysis, soft, with persistent red-brown lochia","Fundus not palpable abdominally; whitish-yellow lochia","Breasts full and leaking milk between feedings","Brief increase in bright red bleeding last week that stopped within an hour"],"ans":0,"why":"By 2 weeks the uterus should no longer be palpable above the symphysis. A palpable, soft uterus with lochia that has not progressed to alba signals that involution has stalled. <i>Pathophysiology:</i> Most common causes of subinvolution: retained placental fragments and pelvic infection.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>Fundus not palpable abdominally; whitish-yellow lochia</b>: Exactly what is expected at 2 weeks.</li><li><b>Breasts full and leaking milk between feedings</b>: Normal lactation, unrelated to involution.</li><li><b>Brief increase in bright red bleeding last week that stopped within an hour</b>: Consistent with eschar sloughing (7–14 days) — expected if it subsides within 1–2 h.</li></ul>","cues":"Time point (2 weeks) + palpable fundus + soft + persistent colored lochia.","safety":"Report for evaluation (ultrasound, signs of infection). <i>Anticipate / reassess:</i> Anticipate methylergonovine 0.2 mg q3–4h for 24–48 h, D&C for fragments, or antibiotics for infection.","take":"Uterus nonpalpable abdominally by 2 weeks; subinvolution = retained fragments or infection.","src":"Ch. 18, p. 454; Ch. 21, p. 496","hy":false,"cats":["assess"]},{"id":"P03","topic":"physio","cj":"ac","stem":"A client on postpartum day 11 calls: “I suddenly had more bright red bleeding about 30 minutes ago, but it’s already slowing down.” Complete the nurse’s phone note.","t":"cloze","text":"This increase is most consistent with {0}. The client should be evaluated for {1} if the bleeding {2}.","drops":[{"opts":["sloughing of the eschar over the placental site","normal return of menstruation","lochia serosa"],"ans":0},{"opts":["retained placental fragments","preeclampsia","a urinary tract infection"],"ans":0},{"opts":["does not subside within 1–2 hours","turns pinkish-brown","occurs with breastfeeding"],"ans":0}],"why":"Between days 7 and 14, the eschar over the healing placental site can slough, causing a sudden but brief increase in bleeding. If it does not subside within 1–2 hours, retained placental fragments are suspected. <i>Pathophysiology:</i> The placental site heals by exfoliation; the overlying eschar sloughs as the endometrium regenerates.","wrong":"Menses rarely return this early, especially in breastfeeding women; lochia serosa is pink-brown, not a sudden bright-red increase.","cues":"Timing (day 11), brief and already slowing.","safety":"Teach the 1–2 hour threshold and when to seek care. <i>Anticipate / reassess:</i> If heavy (pad/hour) or persistent, same-day evaluation for late PPH.","take":"Eschar sloughs days 7–14; if bleeding doesn’t stop in 1–2 h → evaluate for retained fragments.","src":"Ch. 18, p. 455","hy":false,"cats":["assess"]},{"id":"P04","topic":"physio","cj":"ac","stem":"Which factors are expected to <b>intensify afterpains</b>?","t":"sata","opts":["Breastfeeding","Oxytocin infusion after birth","Birth of twins","Polyhydramnios during pregnancy","A full bladder that has displaced the uterus","Epidural anesthesia during labor"],"ans":[0,1,2,3],"why":"Afterpains are uterine contractions. Breastfeeding (endogenous oxytocin release) and exogenous oxytocics stimulate contractions; an overdistended uterus (multiple gestation, large infant, polyhydramnios) contracts more vigorously to involute. <i>Pathophysiology:</i> Intermittent contraction compresses intramyometrial vessels; ischemic cramping is felt as afterpains, resolving in 3–7 days.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>A full bladder that has displaced the uterus</b>: A full bladder causes a relaxed, boggy uterus — less contraction, not more afterpain.</li><li><b>Epidural anesthesia during labor</b>: Epidurals don’t intensify afterpains (they may mask early discomfort).</li></ul>","cues":"Anything that releases oxytocin or overstretched the uterus.","safety":"Plan analgesia around feedings. <i>Anticipate / reassess:</i> Expect afterpains to resolve within a week.","take":"Afterpains ↑ with breastfeeding, oxytocics, overdistended uterus; resolve in 3–7 days.","src":"Ch. 18, pp. 454–455","hy":false,"cats":["assess"]},{"id":"P05","topic":"physio","cj":"gs","stem":"A breastfeeding multipara on day 1 rates afterpains 7/10 “every time the baby nurses.” Ibuprofen 600 mg PO q6h PRN is ordered. Which plan is <b>best</b>?","t":"mc","opts":["Give ibuprofen about 30–60 minutes before the next feeding and suggest lying prone with a small pillow under the abdomen","Suggest she pump and bottle-feed for 24 hours until the cramping eases","Notify the provider because pain this strong suggests retained tissue","Apply a heating pad on high directly to the abdomen for an hour"],"ans":0,"why":"Afterpains are most severe during and after breastfeeding, so analgesia timed before feeding provides the most effective relief. Lying prone with a pillow keeps the uterus contracted and reduces cramping. <i>Pathophysiology:</i> Suckling → posterior pituitary oxytocin → strong uterine contractions.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>Suggest she pump and bottle-feed for 24 hours until the cramping eases</b>: Interrupting breastfeeding isn’t necessary and harms milk supply.</li><li><b>Notify the provider because pain this strong suggests retained tissue</b>: Afterpains linked to feeding in a multipara are expected; there are no other cues of retained tissue.</li><li><b>Apply a heating pad on high directly to the abdomen for an hour</b>: Warmth may help, but direct high heat risks burns; timing analgesia is the key intervention.</li></ul>","cues":"Pain tied to feeding in a multipara.","safety":"Timely, effective relief that preserves breastfeeding. <i>Anticipate / reassess:</i> Re-evaluate pain 30–60 min after the dose; confirm fundus firm and lochia normal.","take":"Time analgesia before breastfeeding for afterpains.","src":"Ch. 19, pp. 466–467","hy":true,"cats":["med","teach"]},{"id":"P06","topic":"physio","cj":"rc","stem":"Classify each lochia description.","t":"matrix","cols":["Expected","Report"],"rows":[{"r":"Hour 6: dark red gush when she first stands, then a light trickle","a":0},{"r":"Hour 2: steady trickle of bright red blood; fundus firm at U, midline","a":1},{"r":"Day 6: pinkish-brown, light, no odor","a":0},{"r":"Day 4: lochia rubra with a foul odor","a":1},{"r":"Day 13: whitish-yellow, scant","a":0},{"r":"Day 16: red lochia returns after alba, soaking a pad an hour","a":1}],"why":"A dark gush on standing is lochia pooled in the vagina. Serosa (days 4–10) and alba (from ~day 10, lasting 3–6 weeks) are on schedule. <i>Pathophysiology:</i> Lochia color reflects fresh blood from the placental site; bleeding from a tear doesn’t depend on uterine tone.","wrong":"A steady bright-red trickle with a firm fundus is non-lochial bleeding (cervical/vaginal laceration). Foul odor suggests endometritis. Return to heavy red bleeding after alba is late PPH (subinvolution/retained tissue).","cues":"Color vs day, odor, firm fundus with bright red flow, reversal of progression.","safety":"Bright red bleeding with firm fundus needs prompt provider notification. <i>Anticipate / reassess:</i> Inspect for lacerations; assess temp and uterine tenderness for infection.","take":"Firm fundus + bright red trickle = laceration. Foul odor = infection. Progression reversed = late PPH.","src":"Ch. 18, pp. 455–456 (Table 18.1, Box 18.1)","hy":true,"cats":["assess"]},{"id":"P07","topic":"physio","cj":"ac","stem":"A nursing student asks about cardiovascular and respiratory changes after birth. Which statements are accurate?","t":"sata","opts":["Cardiac output stays elevated for about 48 hours after birth","Clotting factors and fibrinogen remain elevated, increasing VTE risk","Orthostatic hypotension can occur in the first 48 hours from splanchnic engorgement","The diaphragm descends and chest-wall compliance improves","A resting heart rate of 105–110 is expected for the first day","Blood pressure normally falls 20 mm Hg below baseline"],"ans":[0,1,2,3],"why":"Blood returning from the uteroplacental bed keeps cardiac output high ~48 h; hypercoagulability persists; reduced intra-abdominal pressure lets blood pool in splanchnic vessels; the diaphragm returns to its normal position. <i>Pathophysiology:</i> Pregnancy hypervolemia (~1–2 L) protects against birth blood loss but also masks early hemorrhage.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>A resting heart rate of 105–110 is expected for the first day</b>: Expected is 50–90; tachycardia suggests pain, fever, dehydration, or hemorrhage.</li><li><b>Blood pressure normally falls 20 mm Hg below baseline</b>: BP stays near baseline (a slight transient rise can occur); a significant drop is a hemorrhage cue.</li></ul>","cues":"See the stem and chart findings.","safety":"Treat tachycardia and a falling BP as cues, not normal findings. <i>Anticipate / reassess:</i> Fall precautions for first ambulation; VTE prevention.","take":"CO ↑ ~48 h; hypercoagulable; orthostatic hypotension; HR 50–90 is normal.","src":"Ch. 18, p. 458","hy":false,"cats":["assess"]},{"id":"P08","topic":"physio","cj":"eo","stem":"Review the hemoglobin <b>trends</b> for three clients (vaginal births). Decide whether each trend is expected or concerning.<br><table class=\"mini\"><tr><th>Client</th><th>Prenatal</th><th>PP day 1</th><th>PP day 2–3</th></tr><tr><td>A (QBL 350 mL)</td><td>12.6</td><td>11.8</td><td>11.7 (day 3)</td></tr><tr><td>B (QBL 400 mL)</td><td>12.9</td><td>11.6</td><td>9.1 (day 2), HR 108</td></tr><tr><td>C (QBL 1,200 mL, transfused 2 units)</td><td>12.2</td><td>8.9 → 9.6 after transfusion</td><td>9.8 (day 3)</td></tr></table>","t":"matrix","cols":["Expected / appropriate response","Concerning — report"],"rows":[{"r":"Client A trend","a":0},{"r":"Client B trend","a":1},{"r":"Client C trend after transfusion","a":0}],"why":"H&H normally dip slightly in the first 24 h, plateau by days 3–4, then rise (nonpregnant levels by 4–8 weeks). Client A fits. Client C is improving appropriately after transfusion. <i>Pathophysiology:</i> After the day-1 dip, values should plateau; a continuing decline means continued loss.","wrong":"Client B’s continued fall from 11.6 to 9.1 after day 1, with tachycardia, does not match a 400-mL loss — suggests ongoing or concealed bleeding (e.g., hematoma).","cues":"Direction and size of change relative to QBL; HR.","safety":"Report Client B; assess fundus, lochia, perineum, VS. <i>Anticipate / reassess:</i> Anticipate repeat CBC, inspection for hematoma, possible transfusion.","take":"H&H dip day 1, plateau day 3–4, then rise. Continued fall = ongoing bleeding.","src":"Ch. 18, p. 458; Ch. 19, p. 463","hy":true,"cats":["eval"]},{"id":"P09","topic":"physio","cj":"ac","stem":"Postpartum day 1 (vaginal birth). Overnight: voided 650, 700, and 800 mL; woke drenched in sweat; weight down 2 kg; fundus firm at U−1 midline. What is the <b>best</b> interpretation?","t":"mc","opts":["Normal postpartum diuresis and diaphoresis mobilizing pregnancy fluid","Early diabetes insipidus from pituitary injury","Urinary retention with overflow","Postpartum thyroiditis causing heat intolerance"],"ans":0,"why":"Diuresis begins within 12 h of birth (up to 3000 mL/day) as estrogen and pressure effects reverse; night sweats for 2–3 days help eliminate fluid. Large voids with a firm, midline fundus show the bladder is emptying well. <i>Pathophysiology:</i> Falling estrogen + loss of venous pressure from the gravid uterus → mobilization of extracellular fluid.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>Early diabetes insipidus from pituitary injury</b>: No cues of hemorrhage-related pituitary injury; this volume pattern is expected.</li><li><b>Urinary retention with overflow</b>: Overflow = small, frequent voids with a high, deviated fundus — the opposite pattern.</li><li><b>Postpartum thyroiditis causing heat intolerance</b>: Not supported; sweating plus large voids fits diuresis.</li></ul>","cues":"Large volumes, firm midline fundus, weight loss, night sweats.","safety":"Reassure; encourage oral intake. <i>Anticipate / reassess:</i> Continue to monitor voids and fundal position.","take":"Diuresis within 12 h (up to 3 L/day) + night sweats = normal.","src":"Ch. 18, pp. 459–460","hy":false,"cats":["assess"]},{"id":"P10","topic":"physio","cj":"gs","stem":"Day 2 after a vaginal birth with a 2nd-degree laceration: no BM yet, painful hemorrhoids, and she says, “I’m scared to push.” Which action is <b>most</b> appropriate?","t":"mc","opts":["Encourage fluids, fiber, and ambulation; give the ordered stool softener; offer witch hazel pads or a sitz bath for hemorrhoids","Notify the provider for an enema because no BM by day 2 indicates ileus","Advise her to avoid eating until bowel sounds are hyperactive","Tell her to hold stool until the laceration heals"],"ans":0,"why":"Spontaneous BM may be delayed 2–3 days from decreased muscle tone, prelabor diarrhea/limited intake, dehydration, and fear of pain. Fluids, fiber, ambulation, and softeners make the first BM easier; hemorrhoid comfort measures reduce fear. <i>Pathophysiology:</i> Decreased intestinal tone and perineal pain promote constipation.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>Notify the provider for an enema because no BM by day 2 indicates ileus</b>: BM often doesn’t occur until day 2–3; enemas are not first-line.</li><li><b>Advise her to avoid eating until bowel sounds are hyperactive</b>: Restricting food worsens constipation and recovery.</li><li><b>Tell her to hold stool until the laceration heals</b>: Withholding stool causes harder stool and more straining.</li></ul>","cues":"Day 2 (still within the expected window), hemorrhoids, fear.","safety":"Prevent constipation and straining on the repair. <i>Anticipate / reassess:</i> Report no BM by day 3–4, absent bowel sounds, or abdominal distention.","take":"BM expected by day 2–3; softeners, fluids, fiber, ambulation.","src":"Ch. 18, p. 460; Ch. 19, p. 469","hy":false,"cats":["teach"]},{"id":"P11","topic":"physio","cj":"rc","stem":"At 3–6 weeks postpartum, clients report the following. Classify each.","t":"matrix","cols":["Expected change","Requires follow-up"],"rows":[{"r":"Hair shedding in clumps when brushing at 6 weeks","a":0},{"r":"Darker areolae and a fading linea nigra","a":0},{"r":"Severe headache on day 4 with BP 158/102 and seeing spots","a":1},{"r":"Abdominal muscles still feel loose with a separation (diastasis recti)","a":0},{"r":"Client with lupus reports new joint pain, rash, and fatigue at week 3","a":1},{"r":"Numbness of the hands from carpal tunnel resolving","a":0}],"why":"Hair loss, persistent pigmentation, abdominal wall laxity (returns over ~6 weeks), and resolution of carpal tunnel are expected integumentary/musculoskeletal/neurologic changes. <i>Pathophysiology:</i> Pregnancy immunosuppression reverses → flares; headache with HTN reflects cerebral vasospasm/edema.","wrong":"A severe headache with hypertension and visual changes suggests postpartum preeclampsia. Immune function rebounds after birth, so autoimmune disorders (lupus, MS) can flare.","cues":"Hypertension + neurologic symptoms; known autoimmune disease.","safety":"Escalate the headache with HTN urgently. <i>Anticipate / reassess:</i> BP recheck, provider notification; rheumatology follow-up for lupus.","take":"Integumentary/MSK changes are normal; HTN headache and autoimmune flares need follow-up.","src":"Ch. 18, p. 460","hy":false,"cats":["assess"]},{"id":"P12","topic":"physio","cj":"gs","stem":"At 6 weeks, an exclusively breastfeeding client reports vaginal dryness and painful intercourse. Complete the teaching note.","t":"cloze","text":"Dryness is caused by {0}, which is more pronounced in {1}. The nurse recommends {2}. Vaginal rugae reappear by about {3}, and the external cervical os remains {4}.","drops":[{"opts":["estrogen deficiency","excess progesterone","a vaginal infection"],"ans":0},{"opts":["lactating women","nonlactating women","women who had cesarean births"],"ans":0},{"opts":["a water-soluble lubricant","an oil-based lubricant","abstaining until weaning"],"ans":0},{"opts":["3 weeks","6 months","1 week"],"ans":0},{"opts":["a slit (“fish mouth”) instead of round","round as before pregnancy","closed and pinpoint"],"ans":0}],"why":"Postpartum estrogen deprivation thins the vaginal mucosa and reduces lubrication; elevated prolactin in lactating women delays ovarian function, prolonging dryness. Water-soluble lubricant is recommended. Rugae return by ~3 weeks (never as prominent); the external os becomes a permanent slit. <i>Pathophysiology:</i> Return of ovarian function thickens the mucosa.","wrong":"Each alternative either describes an expected finding or delays the priority action.","cues":"Exclusive breastfeeding → prolactin ↑ → estrogen ↓.","safety":"Comfort and sexual health teaching. <i>Anticipate / reassess:</i> Reassure that dryness typically improves when menses return.","take":"Lactation → low estrogen → dryness; use water-soluble lubricant.","src":"Ch. 18, p. 456","hy":false,"cats":["teach"]},{"id":"P13","topic":"physio","cj":"gs","stem":"A client has a repaired <b>4th-degree laceration</b>. Is each order indicated or contraindicated?","t":"matrix","cols":["Indicated","Contraindicated"],"rows":[{"r":"Ice packs to the perineum for the first 24 hours","a":0},{"r":"Rectal temperature every 4 hours","a":1},{"r":"Docusate 100 mg PO twice daily","a":0},{"r":"Glycerin suppository PRN constipation","a":1},{"r":"Warm sitz bath twice daily after 24 hours","a":0},{"r":"Fleet enema PRN no BM by day 3","a":1}],"why":"Ice reduces edema early; warm sitz baths later promote circulation; stool softeners prevent straining. <i>Pathophysiology:</i> Anything inserted into the rectum stresses the suture line.","wrong":"A 4th-degree laceration extends through the anal sphincter and rectal mucosa — rectal thermometers, suppositories, and enemas can disrupt the repair or cause infection/fistula.","cues":"4th degree = rectal mucosa involvement.","safety":"Clarify rectal orders with the provider. <i>Anticipate / reassess:</i> Monitor for infection, incontinence, and pain; oral bowel regimen.","take":"3rd/4th-degree lacerations: nothing per rectum.","src":"Ch. 21, p. 495 (Safety Alert); Box 19.1","hy":true,"cats":["med"]},{"id":"R01","topic":"routine","cj":"ta","stem":"You are working with a UAP. Which tasks can be delegated?","t":"matrix","cols":["Delegate to UAP","RN must perform"],"rows":[{"r":"Weigh perineal pads for a stable client and report the weights","a":0},{"r":"Assess the fundus of a client who arrived from L&D 30 minutes ago","a":1},{"r":"Assist a stable client who has ambulated several times to shower","a":0},{"r":"Teach a client to self-inject enoxaparin before discharge","a":1},{"r":"Measure and record intake and output","a":0},{"r":"Evaluate whether ibuprofen relieved a client’s perineal pain","a":1}],"why":"Routine, standardized tasks with predictable outcomes on stable clients (pad weights, hygiene/ambulation help, I&O) can go to a UAP, who reports data back.","wrong":"Assessment (especially of a newly transferred client), teaching, and evaluation of interventions require RN judgment and cannot be delegated.","cues":"Verbs: assess, teach, evaluate = RN.","safety":"Give the UAP clear reporting parameters (e.g., pad saturated in ≤1 h, HR >100). <i>Anticipate / reassess:</i> Follow up on reported data and interpret it.","take":"Delegate tasks on stable clients; RN keeps assess/teach/evaluate.","src":"Mod 9 study guide: appropriate delegation","hy":false,"cats":["prio"]},{"id":"R02","topic":"routine","cj":"ta","stem":"During her first walk to the bathroom 3 hours after birth, a client says, “I feel faint,” and her knees buckle while you are supporting her. What should the nurse do <b>first</b>?","t":"mc","opts":["Ease her down to the floor or onto a nearby chair while protecting her head, and call for help","Hold her upright and walk her quickly back to bed","Leave her leaning on the sink and get a wheelchair","Check her blood pressure while she stands"],"ans":0,"why":"Safety first: lowering her in a controlled way prevents injury; summon help, then assess VS, fundus, and bleeding once she is supine. <i>Pathophysiology:</i> Orthostatic hypotension from splanchnic engorgement, blood loss, and anesthesia effects.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>Hold her upright and walk her quickly back to bed</b>: Trying to keep a fainting client upright risks a fall for both of you.</li><li><b>Leave her leaning on the sink and get a wheelchair</b>: Never leave a client who is losing consciousness.</li><li><b>Check her blood pressure while she stands</b>: Assessment comes after she is safely down.</li></ul>","cues":"First ambulation, faintness, buckling knees.","safety":"Prevent a fall before anything else. <i>Anticipate / reassess:</i> Once safe: VS, fundus, lochia; reinforce calling for help before getting up.","take":"Staff present at first ambulation; if fainting, lower safely and call for help.","src":"Ch. 18, p. 458; Ch. 19, p. 468 (Safety Alert)","hy":true,"cats":["emerg","prio"]},{"id":"R03","topic":"routine","cj":"ta","stem":"Place the steps of a perineal assessment in order.","t":"order","items":["Explain the procedure, perform hand hygiene, and apply gloves","Position the client in the lateral (Sims) position with the upper buttock lifted","Use a good light source","Inspect the episiotomy/laceration for redness, edema, ecchymosis, drainage, and approximation","Inspect the anal area for hemorrhoids","Apply a clean pad front-to-back and document findings"],"why":"Most repairs are visible only with the client on her side with the upper buttock raised (or in lithotomy) and a good light source; then inspect systematically. <i>Pathophysiology:</i> Healing of a repair parallels any surgical incision; watch for infection and lack of approximation.","wrong":"Inspecting before positioning/lighting misses findings; documentation and a clean pad come last.","cues":"See the stem and chart findings.","safety":"Visualization before judgment. <i>Anticipate / reassess:</i> Report hematoma (severe pain, bulging mass) or infection signs.","take":"Sims position + good light to inspect perineum; assess REEDA + hemorrhoids.","src":"Ch. 18, p. 456; Table 19.1","hy":false,"cats":["prio"]},{"id":"R04","topic":"routine","cj":"gs","stem":"A breastfeeding client on day 4 has firm, warm, painful breasts; the baby is struggling to latch. Temp 99.6°F. What is the <b>best</b> advice?","t":"mc","opts":["Breastfeed every 2–3 hours, use warmth or hand expression to soften the areola before feeding, and cold packs after","Skip feedings on the fuller breast until it softens","Bind the breasts tightly and apply ice continuously","Start antibiotics for mastitis"],"ans":0,"why":"Engorgement (milk coming in, 72–96 h) is relieved by frequent, effective milk removal. Softening the areola helps the baby latch; cold after feedings reduces swelling. <i>Pathophysiology:</i> Vascular and lymphatic congestion plus milk filling.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>Skip feedings on the fuller breast until it softens</b>: Milk stasis worsens engorgement and increases mastitis risk.</li><li><b>Bind the breasts tightly and apply ice continuously</b>: This suppresses lactation — appropriate only for non-breastfeeding mothers.</li><li><b>Start antibiotics for mastitis</b>: No fever ≥100.4°F, localized red wedge, or flu-like symptoms — this is engorgement.</li></ul>","cues":"Day 4, bilateral firmness, latch difficulty, low-grade temp.","safety":"Effective milk removal. <i>Anticipate / reassess:</i> Report fever ≥100.4°F, a red tender wedge, or flu-like symptoms (mastitis).","take":"Breastfeeding engorgement = feed frequently; non-breastfeeding = support, cold, no stimulation.","src":"Ch. 18, pp. 456–457","hy":false,"cats":["teach"]},{"id":"D01","topic":"discharge","cj":"ac","stem":"Determine whether each client should receive Rh immune globulin before discharge.","t":"matrix","cols":["Give","Do not give"],"rows":[{"r":"Mother Rh-negative, indirect Coombs negative; newborn Rh-positive; 30 h after birth","a":0},{"r":"Mother Rh-negative; newborn Rh-negative","a":1},{"r":"Mother Rh-positive; newborn Rh-negative","a":1},{"r":"Mother Rh-negative with a <b>positive</b> indirect Coombs (anti-D present); newborn Rh-positive","a":1}],"why":"Rh immune globulin (300 mcg IM within 72 h) is for an Rh-negative, unsensitized mother who gave birth to an Rh-positive infant. <i>Pathophysiology:</i> RhoGAM destroys fetal Rh-positive cells in maternal circulation before her immune system forms antibodies.","wrong":"No Rh-positive fetal cells → no risk (Rh-negative baby). Rh-positive mothers can’t form anti-D. A positive indirect Coombs means she is already sensitized — RhoGAM can’t reverse that.","cues":"Maternal type, newborn type, maternal Coombs.","safety":"Verify all three conditions; give within 72 h. <i>Anticipate / reassess:</i> Document lot number; teach why it protects future pregnancies.","take":"RhoGAM: Rh− unsensitized mom + Rh+ baby → 300 mcg IM ≤72 h.","src":"Ch. 19, pp. 470–471","hy":true,"cats":["med","assess"]},{"id":"D02","topic":"discharge","cj":"eo","stem":"A rubella- and varicella-nonimmune client received MMR and the first varicella vaccine dose. Which statements show <b>correct understanding</b>?","t":"sata","opts":["“I need to avoid getting pregnant for at least 1 month.”","“I can keep breastfeeding.”","“I might get a mild fever, rash, or achy joints.”","“I need a second varicella dose in about 4 to 8 weeks.”","“My mother is on chemotherapy and lives with us, but that doesn’t matter.”","“I should stop breastfeeding for 3 days.”"],"ans":[0,1,2,3],"why":"Live attenuated vaccines are teratogenic — avoid pregnancy 1 month. Breastfeeding is fine. Side effects include fever, transient rash, arthralgia. Varicella is a 2-dose series (2nd at 4–8 weeks). <i>Pathophysiology:</i> Vaccine virus may be shed in body fluids → risk to immunocompromised contacts.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>“My mother is on chemotherapy and lives with us, but that doesn’t matter.”</b>: Live vaccines are not given when a household member is immunocompromised — this should have been caught before giving.</li><li><b>“I should stop breastfeeding for 3 days.”</b>: Breastfeeding is not a contraindication.</li></ul>","cues":"See the stem and chart findings.","safety":"Confirm contraception plan and household immune status before giving. <i>Anticipate / reassess:</i> Schedule the second varicella dose.","take":"MMR/varicella: avoid pregnancy 1 month; OK breastfeeding; not with immunocompromised household.","src":"Ch. 19, pp. 469–470","hy":true,"cats":["med","teach","eval"]},{"id":"D03","topic":"discharge","cj":"eo","stem":"Which statement by a breastfeeding client at discharge indicates a <b>need for further teaching</b> about sexual activity and contraception?","t":"mc","opts":["“Since I’m breastfeeding, I won’t need birth control until my period comes back.”","“If we haven’t chosen a method, we’ll use condoms with spermicide until my checkup.”","“A water-soluble lubricant can help if I’m dry.”","“A non-hormonal method is best because pills might affect my milk.”"],"ans":0,"why":"Ovulation can occur as soon as ~1 month after birth and before menses returns; breastfeeding is not reliable contraception. <i>Pathophysiology:</i> Prolactin suppression of ovulation varies with breastfeeding pattern.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>“If we haven’t chosen a method, we’ll use condoms with spermicide until my checkup.”</b>: Correct per textbook teaching.</li><li><b>“A water-soluble lubricant can help if I’m dry.”</b>: Correct — dryness is common with breastfeeding.</li><li><b>“A non-hormonal method is best because pills might affect my milk.”</b>: Correct — nonhormonal methods are preferred while breastfeeding.</li></ul>","cues":"Misconception about lactation and fertility.","safety":"Discuss contraception before discharge — the follow-up visit can be too late. <i>Anticipate / reassess:</i> Sex can generally resume by 2–4 weeks when bleeding has stopped and the perineum is healed.","take":"Breastfeeding ≠ contraception; nonhormonal preferred; condoms + spermicide if undecided.","src":"Ch. 19, pp. 472–473","hy":false,"cats":["teach","eval"]},{"id":"D04","topic":"discharge","cj":"ac","stem":"Complete the discharge-planning note.","t":"cloze","text":"The Newborns’ and Mothers’ Health Protection Act allows a stay of at least {0} after vaginal birth and {1} after cesarean birth. Length of stay depends on {2}. Because many complications appear after discharge, the nurse arranges {3}.","drops":[{"opts":["48 hours","24 hours","72 hours"],"ans":0},{"opts":["96 hours","48 hours","7 days"],"ans":0},{"opts":["the physical and emotional status of mother and baby, support at home, education needs, and finances","the infant’s weight only","the provider’s schedule"],"ans":0},{"opts":["follow-up such as a phone call, home visit, or early clinic visit","no follow-up until 6 weeks","daily lab draws"],"ans":0}],"why":"Federal law requires insurers to cover at least 48 h (vaginal) / 96 h (cesarean). Discharge depends on maternal and newborn physical and emotional status, support, teaching, and finances; follow-up (calls, home visits, warm lines, support groups) catches problems early.","wrong":"Each alternative either describes an expected finding or delays the priority action.","cues":"See the stem and chart findings.","safety":"Readiness, not the clock, drives discharge. <i>Anticipate / reassess:</i> Teach warning signs and confirm follow-up.","take":"48 h vaginal / 96 h cesarean minimums; readiness depends on mother, baby, support, teaching, finances.","src":"Ch. 19, pp. 461–462; Mod 9 slides","hy":false,"cats":["assess"]},{"id":"T01","topic":"parent","cj":"rc","stem":"You observe parents during the first 24 hours. Classify each behavior.","t":"matrix","cols":["Facilitates attachment","Inhibits attachment"],"rows":[{"r":"Father holds the baby en face and says, “Look, he’s watching me.”","a":0},{"r":"Mother touches only with fingertips on day 2 and says the baby “looks like my ex.”","a":1},{"r":"Mother answers each cry by picking the baby up and talking softly","a":0},{"r":"Mother repeatedly calls the baby “it” and asks for the nursery to keep him overnight every night","a":1},{"r":"Grandmother points out the baby has the family’s dimples","a":0}],"why":"En face contact, responsive caregiving, and claiming through family likeness are facilitating behaviors. <i>Pathophysiology:</i> Attachment develops through proximity, acquaintance, and reciprocal interaction.","wrong":"No progression beyond fingertip touch, identifying the baby with a disliked person, depersonalizing language, and avoiding contact are inhibiting behaviors.","cues":"Touch progression, naming, claiming, response to cues.","safety":"Explore inhibiting behaviors gently; promote contact. <i>Anticipate / reassess:</i> Assess for depression, support, and expectations; refer as needed.","take":"Facilitating: en face, progressive touch, claiming, responsiveness. Inhibiting: avoidance, negative identification.","src":"Ch. 20, pp. 477–478","hy":false,"cats":["assess"]},{"id":"T02","topic":"parent","cj":"gs","stem":"A first-time mother asks why the unit encourages skin-to-skin contact and rooming-in. Which explanations are accurate?","t":"sata","opts":["It helps you learn your baby’s cues sooner","It supports early and more successful breastfeeding","It promotes bonding and attachment through closeness","It helps stabilize the baby’s temperature and heart rate","It means nurses will no longer check on you and the baby","It is only for mothers who had vaginal births"],"ans":[0,1,2,3],"why":"Early, extended contact allows acquaintance and reciprocal interaction, supports breastfeeding, and helps the newborn transition physiologically. <i>Pathophysiology:</i> Proximity is the first condition for attachment.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>It means nurses will no longer check on you and the baby</b>: Couplet care continues with nursing assessment.</li><li><b>It is only for mothers who had vaginal births</b>: Skin-to-skin is encouraged after cesarean as soon as feasible.</li></ul>","cues":"See the stem and chart findings.","safety":"Facilitate contact unless mother or infant is unstable. <i>Anticipate / reassess:</i> Point out infant responses to reinforce parental confidence.","take":"Skin-to-skin + rooming-in → attachment, cue learning, breastfeeding, newborn stability.","src":"Ch. 20, pp. 477–481","hy":false,"cats":["teach"]},{"id":"T03","topic":"parent","cj":"ac","stem":"On postpartum day 2, a mother who slept and retold her birth story much of yesterday now says, “Can you show me how to bathe her? I want to do it myself.” What does this indicate?","t":"mc","opts":["She is moving into the dependent-independent (taking-hold) phase — an ideal time for teaching","She is in the dependent (taking-in) phase and needs rest before teaching","She is in the interdependent phase and ready for discharge","She has postpartum blues and needs reassurance"],"ans":0,"why":"Eagerness to master infant care marks the dependent-independent phase; teaching is most effective now.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>She is in the dependent (taking-in) phase and needs rest before teaching</b>: That described yesterday; her behavior has shifted.</li><li><b>She is in the interdependent phase and ready for discharge</b>: The interdependent phase comes later, as the family moves forward as a unit.</li><li><b>She has postpartum blues and needs reassurance</b>: Wanting to master care is not a mood symptom.</li></ul>","cues":"Shift from self-focus and storytelling to wanting to do care herself.","safety":"Hands-on teaching with praise. <i>Anticipate / reassess:</i> Watch for insecurity or blues that can appear in this phase.","take":"Dependent (taking-in) → dependent-independent (taking-hold, best teaching) → interdependent.","src":"Ch. 20, pp. 482–483; Mod 9 slides","hy":false,"cats":["teach","assess"]},{"id":"T04","topic":"parent","cj":"ph","stem":"At the 3-week follow-up call, a father says, “I can’t sleep, I don’t enjoy anything, and I feel like a failure. My wife seems to be doing great.” What is the <b>best</b> nursing response?","t":"mc","opts":["“Partners can experience depression after a baby too. Can you tell me more — and have you had any thoughts of harming yourself?”","“It’s normal for dads to feel left out; it will pass once the baby is older.”","“Focus on supporting your wife — she’s the one at risk.”","“Try taking over more night feedings so you feel useful.”"],"ans":0,"why":"Paternal (partner) postpartum depression is real and covered in your slides. Anhedonia, insomnia, and worthlessness need assessment, including a direct question about self-harm. <i>Pathophysiology:</i> Sleep deprivation, role strain, and stress contribute.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>“It’s normal for dads to feel left out; it will pass once the baby is older.”</b>: Dismisses symptoms consistent with depression.</li><li><b>“Focus on supporting your wife — she’s the one at risk.”</b>: Ignores paternal depression, which is recognized in your slides.</li><li><b>“Try taking over more night feedings so you feel useful.”</b>: Advice that may worsen sleep deprivation without assessing him.</li></ul>","cues":"Anhedonia, insomnia, worthlessness at 3 weeks.","safety":"Assess safety and refer. <i>Anticipate / reassess:</i> Encourage evaluation with his provider; share support resources.","take":"Partners can develop postpartum depression — assess and refer.","src":"Mod 9 slides (Paternal after-birth depression); Ch. 20","hy":false,"cats":["prio"]},{"id":"T05","topic":"parent","cj":"ta","stem":"A client’s mother tells you that in their culture the grandmother provides most infant care for the first 40 days so the new mother can rest. The client agrees. What should the nurse do?","t":"mc","opts":["Respect the plan, ask how the family would like to be involved in teaching, and include the mother in feeding and care so she learns her baby’s cues","Insist the mother provide all care herself to promote attachment","Teach only the grandmother since she will do the care","Document that attachment is impaired"],"ans":0,"why":"Culturally sensitive, family-centered care honors safe practices, involves the family, and ensures the mother still has opportunities for acquaintance and teaching.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>Insist the mother provide all care herself to promote attachment</b>: Culturally insensitive; attachment can develop within family-supported care.</li><li><b>Teach only the grandmother since she will do the care</b>: Excludes the mother from information she needs.</li><li><b>Document that attachment is impaired</b>: No evidence of impaired attachment; this is a cultural practice.</li></ul>","cues":"Shared family decision; no safety concern.","safety":"Respect + inclusion. <i>Anticipate / reassess:</i> Assess attachment behaviors and maternal mood at follow-up.","take":"Ask, respect, and include — don’t assume or override safe cultural practices.","src":"Ch. 20, pp. 490–491","hy":false,"cats":["prio"]},{"id":"T06","topic":"parent","cj":"gs","stem":"Which strategies are appropriate when teaching a 16-year-old first-time mother infant care?","t":"sata","opts":["Demonstrate, then have her return-demonstrate","Use concrete, specific information in short sessions","Praise her competent care behaviors","Include her chosen support person if she wishes","Give all the information in one long session the morning of discharge","Speak mainly to her mother because the teen is too young to understand"],"ans":[0,1,2,3],"why":"Adolescent parents must manage developmental tasks of adolescence along with parenting; concrete, hands-on, affirming teaching with her support system works best.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>Give all the information in one long session the morning of discharge</b>: Overload reduces retention.</li><li><b>Speak mainly to her mother because the teen is too young to understand</b>: Undermines her parental role.</li></ul>","cues":"Age, first child.","safety":"Build competence and confidence. <i>Anticipate / reassess:</i> Arrange community follow-up and support programs.","take":"Adolescent parents: concrete, hands-on, affirming, include support.","src":"Ch. 20, pp. 485–487","hy":false,"cats":["teach"]},{"id":"T07","topic":"parent","cj":"rc","stem":"Review the psychosocial note for a client on day 2. <b>Highlight the findings that should be reported</b> rather than treated as expected adjustment.","t":"hl","segs":[{"x":"Client "},{"x":"tearful at times today","k":0},{"x":" and "},{"x":"says she’s exhausted","k":0},{"x":". She "},{"x":"retells the birth story to each visitor","k":0},{"x":". When asked about the birth she "},{"x":"refuses to talk about it and turns away","k":1},{"x":". She "},{"x":"calls herself “ugly and useless”","k":1},{"x":". Partner "},{"x":"visits but says the baby “ruined everything”","k":1},{"x":". She "},{"x":"has no one to help at home","k":1},{"x":" after her partner returns to work tomorrow. She is "},{"x":"feeding the baby every 2–3 hours","k":0},{"x":"."}],"why":"Box 19.2 lists psychosocial concerns: unwillingness to discuss the birth, referring to oneself as ugly/useless, a partner’s negative reaction to the baby, and lack of support.","wrong":"Tearfulness and fatigue on day 2 fit expected adjustment/blues; retelling the birth story is normal integration; regular feeding is reassuring.","cues":"Self-devaluation, avoidance, partner rejection, isolation.","safety":"Report and plan social work/mental health follow-up. <i>Anticipate / reassess:</i> Screen for depression (EPDS) and arrange support before discharge.","take":"Report: can’t discuss birth, self-devaluing, partner rejection, no support, marked depression.","src":"Ch. 19, p. 471 (Box 19.2)","hy":false,"cats":["assess"]},{"id":"H01","topic":"pph","cj":"ac","stem":"Use the 4 T’s to identify the most likely cause of each bleeding presentation.","t":"matrix","cols":["Tone","Trauma","Tissue","Thrombin"],"rows":[{"r":"Boggy fundus 3 cm above U after a 10-lb baby; firms with massage, relaxes again","a":0},{"r":"Firm fundus at U; steady bright red bleeding after a rapid forceps birth","a":1},{"r":"Uterus will not stay firm; placenta delivered with a missing cotyledon","a":2},{"r":"Oozing from IV and incision sites, petechiae, platelets 68,000, fibrinogen 110","a":3},{"r":"Severe perineal pressure, tense purple vulvar mass, firm fundus","a":1}],"why":"Tone = atony (overdistension, fatigue). Trauma = lacerations and hematomas (bleeding with a firm fundus). Tissue = retained placental fragments. Thrombin = coagulopathy/DIC. <i>Pathophysiology:</i> Each “T” disrupts a different hemostatic mechanism: contraction, vessel integrity, cavity emptying, clotting.","wrong":"Each alternative either describes an expected finding or delays the priority action.","cues":"Fundal tone vs bleeding pattern; placental inspection; lab values.","safety":"Treatment follows cause: massage/uterotonics; repair; removal; blood products/factors. <i>Anticipate / reassess:</i> Reassess after each intervention; trend labs.","take":"4 T’s: Tone, Trauma, Tissue, Thrombin.","src":"Ch. 21, pp. 494–496","hy":true,"cats":["assess"]},{"id":"H02","topic":"pph","cj":"ta","stem":"An order reads: methylergonovine 0.2 mg IM now for uterine atony. Which assessments must the nurse complete <b>before</b> giving it?","t":"sata","opts":["Current blood pressure","History of preeclampsia or chronic hypertension","History of cardiovascular disease","Uterine tone and amount of bleeding","History of asthma","Deep tendon reflexes"],"ans":[0,1,2,3],"why":"Methylergonovine causes sustained vasoconstriction and can trigger severe hypertension; it is contraindicated with hypertension, preeclampsia, and cardiac disease. Hold if BP >140/90. Baseline tone and bleeding allow evaluation. <i>Pathophysiology:</i> Ergot alkaloid → smooth muscle (uterine and vascular) contraction.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>History of asthma</b>: Asthma is the key contraindication for carboprost, not methylergonovine.</li><li><b>Deep tendon reflexes</b>: Used to monitor magnesium sulfate.</li></ul>","cues":"See the stem and chart findings.","safety":"Check BP every time before giving. <i>Anticipate / reassess:</i> Reassess tone, bleeding, and BP after administration.","take":"Methergine: check BP; hold if >140/90 or HTN/preeclampsia/cardiac disease.","src":"Ch. 21, p. 498 (Medication Guide)","hy":true,"cats":["med","prio"]},{"id":"H03","topic":"pph","cj":"ac","stem":"Classify each hemorrhage as early (primary) or late (secondary) PPH.","t":"matrix","cols":["Early (≤24 h)","Late (24 h–12 wk)"],"rows":[{"r":"Hour 2: boggy uterus, 900 mL QBL, HR 118","a":0},{"r":"Day 9: heavy red bleeding with fever and a soft, enlarged uterus","a":1},{"r":"Week 5: hemorrhage from retained placental fragments","a":1},{"r":"Hour 6: expanding vaginal hematoma after a vacuum birth","a":0},{"r":"Day 3 (still inpatient): oozing and bleeding from DIC after severe preeclampsia","a":1}],"why":"Early PPH occurs within 24 h (atony, lacerations, hematoma, retained placenta, inversion). Late PPH occurs after 24 h up to 12 weeks (subinvolution, infection, retained fragments, coagulopathy).","wrong":"Each alternative either describes an expected finding or delays the priority action.","cues":"Timing relative to birth.","safety":"Late PPH often occurs at home — teach warning signs. <i>Anticipate / reassess:</i> Cause-specific treatment.","take":"Early ≤24 h; late 24 h–12 weeks.","src":"Ch. 21, p. 493; Mod 9 slides","hy":true,"cats":["assess"]},{"id":"H04","topic":"pph","cj":"ph","stem":"Four hours after a forceps-assisted birth, a client reports severe back and flank pain. Fundus firm at U, lochia scant. HR 124, BP 86/52, RR 26, skin pale and clammy. Perineum appears normal. What is the most likely problem and the priority action?","t":"mc","opts":["Concealed (retroperitoneal) hemorrhage — call the rapid response/provider immediately and start IV fluid resuscitation per protocol","Back pain from epidural — give analgesics and reassess in 1 hour","Uterine atony — massage the fundus","Normal postpartum fatigue — encourage rest"],"ans":0,"why":"Shock with a firm uterus and scant visible bleeding points to concealed bleeding; retroperitoneal hematomas may present only with shock signs and back/flank pain. <i>Pathophysiology:</i> Bleeding into the retroperitoneal space is hidden but can be massive.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>Back pain from epidural — give analgesics and reassess in 1 hour</b>: Shock signs make this an emergency; analgesia would delay care.</li><li><b>Uterine atony — massage the fundus</b>: The fundus is firm; massage won’t help.</li><li><b>Normal postpartum fatigue — encourage rest</b>: Tachycardia, hypotension, and clammy skin are not fatigue.</li></ul>","cues":"Forceps birth + firm fundus + scant lochia + shock.","safety":"Emergency escalation and volume resuscitation. <i>Anticipate / reassess:</i> Anticipate imaging, labs, type & crossmatch, surgery/embolization.","take":"Shock + firm fundus + little visible bleeding → concealed hemorrhage (hematoma).","src":"Ch. 21, p. 495; Ch. 19, p. 466","hy":true,"cats":["emerg","prio"]},{"id":"V01","topic":"vte","cj":"gs","stem":"A client with BMI 44 who is POD 1 after cesarean is at high risk for VTE. Which interventions are appropriate?","t":"sata","opts":["Early and frequent ambulation","Sequential compression devices while in bed","Prophylactic low-molecular-weight heparin as ordered","Teach her to avoid crossing her legs or sitting for long periods","Massage her calves each shift to improve circulation","Keep her on bed rest until POD 3 to protect the incision"],"ans":[0,1,2,3],"why":"Prevention is key: mobility, mechanical compression, and pharmacologic prophylaxis for high-risk clients counter venous stasis and hypercoagulability. <i>Pathophysiology:</i> Virchow’s triad: stasis, hypercoagulability, vessel injury.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>Massage her calves each shift to improve circulation</b>: Massage could dislodge an undetected clot.</li><li><b>Keep her on bed rest until POD 3 to protect the incision</b>: Immobility increases VTE risk.</li></ul>","cues":"Cesarean + obesity.","safety":"Mobility is the single most important routine measure. <i>Anticipate / reassess:</i> Assess legs every shift; watch for PE symptoms.","take":"VTE prevention: ambulate, SCDs, LMWH if ordered, avoid leg crossing; never massage.","src":"Ch. 19, p. 468; Ch. 21, p. 501","hy":false,"cats":["teach"]},{"id":"V02","topic":"vte","cj":"gs","stem":"On day 2, a client has a tender, warm, reddened, cord-like vein along the inner thigh. Legs are symmetric; no edema; breathing unlabored. Which plan does the nurse anticipate?","t":"mc","opts":["Analgesics, rest with elevation, warm packs, and compression stockings","Continuous IV heparin and strict bed rest","Emergency CT pulmonary angiography","Massage the vein to break up the clot"],"ans":0,"why":"Superficial venous thrombosis (local pain, tenderness, warmth, redness, palpable vein) is treated with analgesia, rest with elevation, local heat, and compression stockings. <i>Pathophysiology:</i> Inflammation and clot in the superficial (saphenous) system.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>Continuous IV heparin and strict bed rest</b>: This is DVT/PE treatment; findings indicate superficial thrombosis.</li><li><b>Emergency CT pulmonary angiography</b>: No respiratory symptoms suggest PE.</li><li><b>Massage the vein to break up the clot</b>: Never massage a thrombosed vessel.</li></ul>","cues":"Local vein findings without unilateral limb edema.","safety":"Comfort and monitoring for extension. <i>Anticipate / reassess:</i> Report if swelling spreads, the limb enlarges, or respiratory symptoms appear.","take":"Superficial: heat, stockings, analgesia, rest. DVT: IV anticoagulant. PE: IV heparin.","src":"Ch. 21, p. 501; Mod 9 slides","hy":true,"cats":["med"]},{"id":"I01","topic":"infect","cj":"ta","stem":"Day 2 after a vaginal birth with an indwelling catheter during labor: burning on urination, frequency, urgency, and suprapubic tenderness. Temp 99.9°F. What should the nurse do <b>first</b>?","t":"mc","opts":["Obtain a clean-catch urine specimen for urinalysis and culture as ordered and notify the provider","Reinsert an indwelling catheter to rest the bladder","Restrict fluids to reduce frequency","Reassure her that burning is expected after perineal stitches"],"ans":0,"why":"Classic UTI symptoms after catheterization call for a specimen and provider notification for antibiotics; encourage fluids. <i>Pathophysiology:</i> Catheterization, birth trauma, and reduced bladder sensation promote bacterial growth.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>Reinsert an indwelling catheter to rest the bladder</b>: Catheterization raises infection risk and isn’t indicated.</li><li><b>Restrict fluids to reduce frequency</b>: Fluids help flush bacteria.</li><li><b>Reassure her that burning is expected after perineal stitches</b>: Urgency, frequency, and suprapubic tenderness suggest UTI, not just perineal stinging.</li></ul>","cues":"Catheter exposure + dysuria, frequency, urgency, suprapubic pain.","safety":"Confirm with UA/culture and start treatment. <i>Anticipate / reassess:</i> Watch for flank pain, chills, high fever (pyelonephritis).","take":"UTI risks: catheter, epidural, exams, cesarean. Get UA/culture, fluids, antibiotics.","src":"Ch. 21, p. 504","hy":false,"cats":["prio"]},{"id":"I02","topic":"infect","cj":"ac","stem":"Classify each breast presentation in a breastfeeding mother.","t":"matrix","cols":["Engorgement","Mastitis"],"rows":[{"r":"Day 3–4: both breasts firm, warm, tender; temp 99.4°F","a":0},{"r":"Day 14: fever 102°F, chills, body aches; one hot, red, wedge-shaped tender area","a":1},{"r":"Difficulty latching because the areola is tense","a":0},{"r":"Unilateral pain with malaise after cracked nipples","a":1}],"why":"Engorgement is bilateral, early (milk coming in), with at most low-grade temperature. Mastitis is usually unilateral, later, with fever, malaise, flu-like symptoms, and a localized red tender area. <i>Pathophysiology:</i> Mastitis: milk stasis + bacterial entry (often via cracked nipples).","wrong":"Each alternative either describes an expected finding or delays the priority action.","cues":"Bilateral vs unilateral; timing; systemic symptoms.","safety":"Both: keep removing milk; mastitis also needs antibiotics. <i>Anticipate / reassess:</i> Watch for abscess (fluctuant mass) if symptoms persist.","take":"Engorgement = bilateral, early. Mastitis = unilateral, fever, flu-like; keep emptying the breast.","src":"Ch. 18, p. 457; Ch. 21, p. 502","hy":false,"cats":["assess"]},{"id":"S01","topic":"psych","cj":"rc","stem":"You are scanning findings for <b>maternal deterioration</b>. Which require immediate escalation (rapid response or provider at bedside) and which can be managed with routine care?","t":"matrix","cols":["Escalate now","Routine care / monitor"],"rows":[{"r":"RR 30, SpO₂ 90% on room air, new anxiety","a":0},{"r":"HR 126 and new confusion 3 hours after birth","a":0},{"r":"Urine output 20 mL/h for 2 hours after PPH","a":0},{"r":"Pain 4/10 afterpains, HR 76, BP 112/70","a":1},{"r":"BP 168/112 with severe headache","a":0},{"r":"Temp 99.8°F at 6 hours, otherwise normal findings","a":1}],"why":"Hypoxia/tachypnea, tachycardia with altered mentation, oliguria, and severe-range BP with neurologic symptoms are early warning signs of life-threatening deterioration (hemorrhage, PE, sepsis, hypertensive crisis). <i>Pathophysiology:</i> Leading causes of maternal death include hemorrhage, infection, PE, hypertension, and cardiomyopathy.","wrong":"Afterpains with normal VS and low-grade temperature in the first 24 h are expected.","cues":"Abnormal vital-sign patterns and mental status changes.","safety":"Escalate early — before decompensation. <i>Anticipate / reassess:</i> Stay with the client, continuous monitoring, SBAR to the team.","take":"Escalate: tachypnea/hypoxia, tachycardia + confusion, oliguria, severe-range BP with symptoms.","src":"Ch. 21, p. 509; Mod 9 slides (Maternal death)","hy":true,"cats":["emerg","assess"]},{"id":"C1Q1","topic":"routine","cj":"rc","stem":"Highlight the hand-off findings that require <b>nursing follow-up during this shift</b>.","t":"hl","segs":[{"x":"Fundus "},{"x":"firm at U+1, midline","k":0},{"x":". Lochia "},{"x":"rubra, moderate","k":0},{"x":". "},{"x":"Has not voided since the 0300 catheterization","k":1},{"x":". Mother "},{"x":"A-negative with an O-positive newborn","k":1},{"x":". "},{"x":"Prenatal Hgb 11.0 with QBL 550 mL","k":1},{"x":". Temp "},{"x":"99.4°F","k":0},{"x":". Pain "},{"x":"3/10","k":0},{"x":". Epidural "},{"x":"removed; able to lift both legs","k":0},{"x":"."}],"why":"Nearly 4 hours since catheterization with ongoing IV fluids and diuresis → high risk for bladder distention. Rh-negative mother with Rh-positive baby → evaluate for RhoGAM within 72 h. Starting anemic with a 550-mL loss → day-1 H&H, fatigue/orthostasis precautions, iron. <i>Pathophysiology:</i> Epidural + perineal trauma + diuresis → silent bladder filling.","wrong":"U+1 firm and midline in the first 12 h, moderate rubra, temp ≤100.4°F in the first 24 h, mild pain, and returned motor function are expected.","cues":"Time since void, blood types, baseline anemia.","safety":"Bladder first — it can cause atony within hours. <i>Anticipate / reassess:</i> Void within the ordered window; RhoGAM workup; day-1 CBC.","take":"At hand-off, flag: time since void, Rh status, baseline H&H.","src":"Ch. 19, pp. 461–465, 470","hy":false,"cats":["assess"],"case":"C1","lead":"<b>0700 — Hand-off from L&D.</b> L&D nurse: “Leah had a vacuum-assisted birth at 0545 with a 2nd-degree laceration. QBL 550 mL. Epidural out at 0610 — she can lift her legs. Fundus firm at U+1, lochia moderate. She was straight-cathed for 600 mL at 0300 and hasn’t voided since. She’s A-negative; baby is O-positive. Prenatal hemoglobin was 11.0. VS stable, temp 99.4°F. Breastfed once. Pain 3/10.”","flow":[],"notes":[],"orders":[],"labs":[],"mar":[]},{"id":"C1Q2","topic":"routine","cj":"ta","stem":"Place the nurse’s actions in the correct order.","t":"order","items":["Support the lower uterine segment and massage the fundus until firm","Assist her to the bathroom (or bedpan) with staff support to void","Measure the voided volume and scan the bladder for residual","Perform a straight catheterization if she cannot empty her bladder per the order","Reassess fundal height, position, tone, and lochia"],"why":"Massage first slows bleeding by contracting the uterus; emptying the bladder removes the cause; measuring tells you whether she emptied; catheterize per order if not; then reassess to evaluate. <i>Pathophysiology:</i> A distended bladder displaces the uterus and prevents contraction → bleeding.","wrong":"Catheterizing before trying to void exposes her to infection risk unnecessarily; reassessing before the bladder is empty gives misleading results.","cues":"High, right-deviated, soft fundus + palpable bladder + no urge.","safety":"Stop bleeding, then remove the cause. <i>Anticipate / reassess:</i> If the fundus stays high/deviated after voiding, suspect incomplete emptying.","take":"Boggy + high + deviated R → massage, void, measure, cath per order, reassess.","src":"Ch. 19, pp. 463–465","hy":true,"cats":["emerg","prio"],"case":"C1","lead":"<b>0745 — Fundal check.</b> Leah says she “doesn’t need to pee.” Fundus <b>2 cm above the umbilicus, displaced to the right, soft</b>. Lochia heavier — pad 50% saturated in 30 minutes. Rounded mass palpable above the symphysis. HR 94.","flow":[["0745","118/74","94","99.3","16 / 98%","3/10","U+2, R, Soft","Rubra, heavier; 50% pad in 30 min","Palpable above symphysis","Unchanged"]],"notes":[],"orders":[],"labs":[],"mar":[]},{"id":"C1Q3","topic":"routine","cj":"ac","stem":"What is the best interpretation and action?","t":"mc","opts":["Incomplete emptying with retention — perform a straight catheterization per the PRN order","Normal first void — recheck in 4 hours","Bladder scan error — repeat the scan tomorrow","Insert an indwelling catheter for 48 hours"],"ans":0,"why":"Small voids with a large residual show retention; the order’s threshold (PVR >400 mL) is met. <i>Pathophysiology:</i> Overdistention reduces detrusor tone; anesthesia and perineal swelling impair emptying.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>Normal first void — recheck in 4 hours</b>: A 460-mL residual is retention; the fundus is still displaced.</li><li><b>Bladder scan error — repeat the scan tomorrow</b>: Findings match her exam (fundus still deviated).</li><li><b>Insert an indwelling catheter for 48 hours</b>: Not ordered; straight cath per protocol is less invasive and lower infection risk.</li></ul>","cues":"150 mL void + PVR 460 mL + fundus still right of midline.","safety":"Empty the bladder before it relaxes the uterus again. <i>Anticipate / reassess:</i> Fundus/lochia after cath; schedule voids every 2–3 h; measure each void.","take":"Small voids + large residual = retention → cath per order.","src":"Ch. 18, p. 459; Ch. 19, p. 465","hy":false,"cats":["assess"],"case":"C1","lead":"<b>0805 — After voiding.</b> Leah voided <b>150 mL</b>. Bladder scan shows <b>460 mL</b> remaining. Fundus U+1, slightly right of midline, firm after massage.","flow":[],"notes":[],"orders":[],"labs":[],"mar":["I&O 0800: Out Voided 150 mL; PVR 460 mL by scan"]},{"id":"C1Q4","topic":"routine","cj":"gs","stem":"Which interventions are appropriate <b>now</b> (3 hours after birth)?","t":"sata","opts":["Apply an ice pack to the perineum","Give ibuprofen 600 mg PO as ordered","Apply the ordered benzocaine spray","Encourage side-lying to reduce pressure on the perineum","Start a hot (110°F) sitz bath now to decrease swelling","Withhold analgesics until she can describe the pain in more detail"],"ans":[0,1,2,3],"why":"Cold reduces edema in the first 24 h; NSAIDs treat inflammatory pain; topical anesthetics numb; side-lying reduces pressure. <i>Pathophysiology:</i> Tissue trauma → edema and inflammation.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>Start a hot (110°F) sitz bath now to decrease swelling</b>: Ice is used for the first 24 h to reduce edema; 110°F also exceeds the recommended 100.4–105.1°F.</li><li><b>Withhold analgesics until she can describe the pain in more detail</b>: Her description is adequate and the perineum was inspected; delaying relief is inappropriate.</li></ul>","cues":"Swelling without hematoma signs; 3 h after birth.","safety":"Relief that also reduces swelling. <i>Anticipate / reassess:</i> Reassess pain 30–60 min after ibuprofen; extreme pain unrelieved by analgesia → reinspect for hematoma.","take":"First 24 h: ice; then warmth/sitz 100.4–105.1°F.","src":"Ch. 19, pp. 465–466 (Box 19.1)","hy":true,"cats":["med"],"case":"C1","lead":"<b>0830 — Comfort.</b> Cath drained 480 mL; fundus firm at U, midline; lochia moderate. Leah now rates <b>perineal</b> pain 6/10 (“sore and swollen, like I’m sitting on stitches”). Perineum: moderate edema, no bulging mass, repair approximated. HR 82.","flow":[["0830","118/72","82","99.1","16 / 98%","6/10","U, Firm","Rubra, moderate","Cath 480 mL","Moderate edema; approximated; no hematoma"]],"notes":[],"orders":[],"labs":[],"mar":[]},{"id":"C1Q5","topic":"routine","cj":"eo","stem":"Evaluate the outcomes of your interventions today.","t":"matrix","cols":["Effective / expected","Needs follow-up"],"rows":[{"r":"Temperature 100.2°F → 99.4°F after oral fluids","a":0},{"r":"Spontaneous voids of 400 and 500 mL; fundus firm at U, midline","a":0},{"r":"Heart rate trending 94 → 82 → 76","a":0},{"r":"Perineal edema decreasing; pain 2/10","a":0}],"why":"Every finding shows the plan worked: low-grade fever in the first 24 h resolved with hydration (dehydration, not infection); the bladder is emptying and the uterus stays midline; HR is normalizing; comfort measures worked.","wrong":"Each alternative either describes an expected finding or delays the priority action.","cues":"Direction of each trend.","safety":"Recognizing effective care is as important as catching failure. <i>Anticipate / reassess:</i> Continue routine q4h assessments; plan day-1 labs.","take":"An evaluation item can be all “effective” — judge each trend on its own.","src":"Ch. 18, p. 458; Ch. 19, p. 465","hy":true,"cats":["eval"],"case":"C1","lead":"<b>1600 — Afternoon trend.</b> Review the vital-sign trend in the chart. Leah voided 400 mL at 1100 and 500 mL at 1430. At 1200 she had drunk little; temp was 100.2°F; you encouraged fluids (1,200 mL since).","flow":[["1200","116/72","84","100.2","16 / 98%","3/10","","","",""],["1600","114/70","76","99.4","16 / 99%","2/10","U, Firm","Rubra, light–moderate","Voiding well","Edema decreasing"]],"notes":[],"orders":[],"labs":[],"mar":["I&O 1100: Out Voided 400 mL","I&O 1430: Out Voided 500 mL","I&O 1200–1600: In PO 1,200 mL"]},{"id":"C1Q6","topic":"routine","cj":"gs","stem":"Based on today’s data, which actions are indicated?","t":"sata","opts":["Administer Rh immune globulin 300 mcg IM before 0545 on day 3","Teach her to change positions slowly and call for help if dizzy","Ask the provider about iron supplementation and teach iron-rich foods","Continue to assess fundus and lochia for ongoing bleeding","Hold breastfeeding until hemoglobin is above 10","Prepare to transfuse 2 units of PRBCs"],"ans":[0,1,2,3],"why":"She meets RhoGAM criteria (Rh-negative, Coombs negative, Rh-positive baby; within 72 h). Anemia increases orthostatic symptoms and fatigue; iron supplementation and diet support recovery; ongoing assessment confirms no continued loss. <i>Pathophysiology:</i> H&H dip on day 1 reflects blood loss; plateau expected by day 3–4.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>Hold breastfeeding until hemoglobin is above 10</b>: Anemia is not a reason to stop breastfeeding.</li><li><b>Prepare to transfuse 2 units of PRBCs</b>: An asymptomatic Hgb of 9.4 with stable VS does not usually require transfusion.</li></ul>","cues":"Hgb 9.4 from 11.0; lightheaded on standing; blood types.","safety":"Time-sensitive med + fall prevention. <i>Anticipate / reassess:</i> Recheck H&H if symptoms worsen; teach fatigue management at home.","take":"Day-1 anemia: fall precautions, iron, monitor; RhoGAM ≤72 h if criteria met.","src":"Ch. 19, pp. 463, 470–473","hy":true,"cats":["med","teach"],"case":"C1","lead":"<b>Day 1, 0800 — Morning labs.</b> Leah wants to go home tomorrow. VS normal. She feels “a little lightheaded” when she stands quickly.","flow":[],"notes":[],"orders":[],"labs":["Hgb (PP day 1): 9.4 g/dL (L) [ref 12–16]","Hct: 28% (L) [ref 37–47]","Platelets: 210,000 [ref 150,000–400,000]","Maternal indirect Coombs: Negative"],"mar":[]},{"id":"C2Q1","topic":"pph","cj":"ta","stem":"What should the nurse do <b>first</b>?","t":"mc","opts":["Support the lower uterine segment and massage the fundus firmly until it contracts, expressing clots","Leave the room to call the provider for orders","Catheterize to empty the bladder","Increase the o
