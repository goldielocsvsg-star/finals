}
function record(id, sc) { var h = S.hist[id] || []; h.push(pct(sc[0], sc[1])); if (h.length > 20) h.shift(); S.hist[id] = h; }

function review() {
  var ses = S.ses; if (!ses) return home();
  var h = '<section class="card"><h1>Final review</h1><p class="small">Select a question to return to it. Locked case questions cannot be changed. Flagged and unanswered questions are marked.</p><div class="grid">';
  var un = 0, fl = 0;
  ses.ids.forEach(function (id, k) {
    var it = BY[id], a = answered(it, ses.resp[id]); if (!a) un++; if (ses.flags[id]) fl++;
    h += '<button class="gq' + (a ? " a" : "") + (ses.flags[id] ? " f" : "") + (ses.locked[id] ? " l" : "") + '" data-k="' + k + '" title="' + (ses.locked[id] ? "Locked" : "") + '">' + (k + 1) + (ses.flags[id] ? "<i>&#9873;</i>" : "") + (ses.locked[id] ? "<i>&#128274;</i>" : "") + "</button>";
  });
  h += '</div><p><b>' + (ses.ids.length - un) + "</b> answered &middot; <b>" + un + "</b> unanswered &middot; <b>" + fl + '</b> flagged</p><div class="legend"><span class="gq a">1</span> answered <span class="gq">2</span> unanswered <span class="gq f">3<i>&#9873;</i></span> flagged <span class="gq l">4<i>&#128274;</i></span> locked</div><button class="btn big" id="fin">Submit exam for scoring</button> <button class="btn ghost" id="back">Back to question ' + Math.min(ses.i + 1, ses.ids.length) + "</button></section>";
  app.innerHTML = h;
  $$(".gq[data-k]").forEach(function (b) { b.addEventListener("click", function () { var k = +b.getAttribute("data-k"); if (ses.locked[ses.ids[k]]) { toast("That case question is locked"); return; } ses.i = k; save(); location.hash = "#q"; qScreen(); }); });
  $("#fin").addEventListener("click", function () { if (un && !confirm(un + " question(s) are unanswered and will score 0. Submit?")) return; finish(); });

// ---------------- results ----------------
function finish(timeUp) {
  var ses = S.ses; if (!ses) return;
  if (tick) { clearInterval(tick); tick = null; }
  var res = {};
  ses.ids.forEach(function (id) { var sc = score(BY[id], ses.resp[id]); res[id] = sc; if (!ses.fb) record(id, sc); });
  var att = { d: new Date().toISOString(), mode: ses.mode, label: ses.label, ids: ses.ids, res: res, resp: ses.resp, ord: ses.ord, time: Math.round(ses.el), timeUp: !!timeUp };
  S.attempts.push(att); if (S.attempts.length > 15) S.attempts.shift();
  S.ses = null; save(); location.hash = "#results"; results(S.attempts.length - 1);
}
function allResults() { var r = {}; for (var id in S.hist) { var h = S.hist[id]; if (h.length && BY[id]) r[id] = h[h.length - 1]; } return r; }
function stats(rp) {
  // rp: {id: pct} or {id:[e,m]}
  var acc = { topic: {}, cj: {}, cat: {}, type: {} };
  for (var id in rp) {
    var it = BY[id], v = rp[id], e, m; if (!it) continue;
    if (v instanceof Array) { e = v[0]; m = v[1]; } else { e = v / 100; m = 1; }
    var add = function (g, k) { var o = acc[g][k] = acc[g][k] || { key: k, e: 0, m: 0, n: 0 }; o.e += e; o.m += m; o.n++; };
    add("topic", it.topic); add("cj", it.cj); add("type", it.t); it.cats.forEach(function (c) { add("cat", c); });
  }
  var out = {};
  for (var g in acc) out[g] = Object.keys(acc[g]).map(function (k) { var o = acc[g][k]; o.p = o.m ? 100 * o.e / o.m : 0; return o; });
  return out;
}
function bars(list, names, order) {
  var h = '<div class="bars">';
  (order || Object.keys(names)).forEach(function (k) {
    var o = list.filter(function (x) { return x.key === k; })[0];
    if (!o) { h += '<div class="bar dim"><span class="bl">' + names[k] + '</span><span class="bt"></span><span class="bv">no items</span></div>'; return; }
    var p = Math.round(o.p);
    h += '<div class="bar"><span class="bl">' + names[k] + ' <small>(' + o.n + " item" + (o.n > 1 ? "s" : "") + ")</small></span><span class=\"bt\"><i class=\"" + (p >= 80 ? "g" : p >= 65 ? "y" : "r") + '" style="width:' + p + '%"></i></span><span class="bv">' + p + "%</span></div>";
  });
  return h + "</div>";
}
function results(ai) {
  var att = S.attempts[ai]; if (!att) return home();
  var ids = att.ids, E = 0, M = 0, full = 0, part = 0, zero = 0, ans = 0;
  ids.forEach(function (id) { var sc = att.res[id]; E += sc[0]; M += sc[1]; var p = pct(sc[0], sc[1]); if (p === 100) full++; else if (p > 0) part++; else zero++; if (answered(BY[id], att.resp[id])) ans++; });
  var st = stats(att.res);
  var TN = {}; Object.keys(TYPE).forEach(function (k) { TN[k] = TYPE[k]; });

  h += '<div class="kpis"><div><b>' + pct(E, M) + "%</b><span>Overall score</span></div><div><b>" + Math.round(E * 10) / 10 + " / " + M + "</b><span>Points earned / possible</span></div><div><b>" + ans + " / " + ids.length + "</b><span>Questions completed</span></div><div><b>" + full + "</b><span>Fully correct</span></div><div><b>" + part + "</b><span>Partial credit</span></div><div><b>" + zero + "</b><span>No credit</span></div><div><b>" + fmtT(att.time) + "</b><span>Time spent" + (att.timeUp ? " (time ran out)" : "") + "</span></div></div>";
  h += '<p class="small">Overall % = total points earned &divide; total points possible &times; 100. This is practice scoring modeled on NGN partial-credit rules, not the official NCLEX algorithm.</p></section>';
  h += '<section class="card"><h2>Clinical judgment (NCJMM) performance</h2>' + bars(st.cj, X.cj, ["rc", "ac", "ph", "gs", "ta", "eo"]) + "</section>";
  h += '<section class="card"><h2>Module 9 topic performance</h2>' + bars(st.topic, X.topics) + "</section>";
  h += '<section class="card"><h2>Additional categories</h2>' + bars(st.cat, X.cats) + '<h3>By question type</h3>' + bars(st.type, TN) + "</section>";
  // remediation

  var weakT = st.topic.filter(function (x) { return x.n >= MIN && x.p < 100; }).sort(function (a, b) { return a.p - b.p; }).slice(0, 3);
  var weakC = st.cj.filter(function (x) { return x.n >= MIN && x.p < 100; }).sort(function (a, b) { return a.p - b.p; }).slice(0, 3);
  var weakTy = st.type.filter(function (x) { return x.n >= 2 && x.p < 80; }).sort(function (a, b) { return a.p - b.p; }).slice(0, 3);

  h += "<h3>1. Weakest blueprint topics</h3>" + (weakT.length ? "<ul>" + weakT.map(function (x) { return "<li><b>" + X.topics[x.key] + "</b>: " + Math.round(x.p) + "% (" + x.n + ' items) <button class="btn sm ghost rt" data-topic="' + x.key + '">Retest this topic</button></li>'; }).join("") + "</ul>" : "<p>No weak topics with enough items. &#127881;</p>");
  h += "<h3>2. Weakest clinical judgment skills</h3>" + (weakC.length ? "<ul>" + weakC.map(function (x) { return "<li><b>" + X.cj[x.key] + "</b>: " + Math.round(x.p) + "% (" + x.n + ' items) <button class="btn sm ghost rt" data-cj="' + x.key + '">Retest this skill</button></li>'; }).join("") + "</ul>" : "<p>No weak skills with enough items.</p>");
  h += "<h3>3. Question types causing difficulty</h3>" + (weakTy.length ? "<ul>" + weakTy.map(function (x) { return "<li><b>" + TYPE[x.key] + "</b>: " + Math.round(x.p) + "% (" + x.n + " items)</li>"; }).join("") + "</ul>" : "<p>No question type below 80% with at least 2 items.</p>");

  h += "<h3>5. High-priority concepts to review</h3>" + (weakT.length ? "<ul>" + weakT.map(function (x) { var s = missed.filter(function (id) { return BY[id].topic === x.key; }).map(function (id) { return BY[id].src; }); return "<li><b>" + X.topics[x.key] + ":</b> review " + (s.length ? s.filter(function (v, i) { return s.indexOf(v) === i; }).slice(0, 3).join("; ") : "the related slides") + "</li>"; }).join("") + "</ul>" : "<p>Keep reviewing mixed practice.</p>");
  var steps = [];

  h += '<div class="btnrow"><button class="btn" id="rwk">Retest all missed questions</button> <a class="btn ghost" href="#home">Home</a></div></section>';
  // missed by weak topic
  if (missed.length) {
    h += '<section class="card"><h2>Missed questions with rationales</h2>';
    var groups = {}; missed.forEach(function (id) { (groups[BY[id].topic] = groups[BY[id].topic] || []).push(id); });
    Object.keys(groups).forEach(function (t) {
      h += "<h3>" + X.topics[t] + ' <button class="btn sm ghost rt" data-topic="' + t + '">Retest</button></h3>';
      groups[t].forEach(function (id) { h += itemReview(att, id); });
    });
    h += "</section>";
  }
  h += '<section class="card"><details><summary class="btn ghost">Show every question with rationale</summary>' + ids.map(function (id) { return itemReview(att, id); }).join("") + "</details></section>";
  app.innerHTML = h;
  $$(".rt").forEach(function (b) { b.addEventListener("click", function () {
    var t = b.getAttribute("data-topic"), c = b.getAttribute("data-cj");
    var list = ITEMS.filter(function (it) { return t ? it.topic === t : it.cj === c; }).map(function (it) { return it.id; });
    start("topic", orderCases(list), { label: "Retest: " + (t ? X.topics[t] : X.cj[c]) });
  }); });

  $$(".irv").forEach(function (d) { d.addEventListener("toggle", function () { if (d.open && !d.getAttribute("data-r")) { d.setAttribute("data-r", 1); var id = d.getAttribute("data-id"); renderItem($(".irq", d), BY[id], { resp: att.resp, ord: att.ord }, true); } }); });
}
function itemReview(att, id) {
  var it = BY[id], sc = att.res[id], p = pct(sc[0], sc[1]);
  return '<details class="irv" data-id="' + id + '"><summary><span class="pill ' + (p === 100 ? "ok" : p > 0 ? "part" : "no") + '">' + p + "%</span> " + (it.case ? "<small>Case: " + esc(CASEBY[it.case].title) + "</small> " : "") + strip(it.stem).slice(0, 140) + '</summary><div class="irq"></div>' + rationale(it, sc) + "</details>";
}
function strip(h) { var d = document.createElement("div"); d.innerHTML = h; return d.textContent; }

// ---------------- home ----------------
function home() {
  var ses = S.ses, last = S.attempts[S.attempts.length - 1];
  var h = '<section class="card hero"><div class="kick">HCC3 Module 9 - Postpartum Nursing Care</div><h1>NGN Clinical Judgment Mock Exam</h1><p>' + ITEMS.length + " questions built from your professor's Exam 3 study guide for Module 9 (Postpartum Nursing Care), your four Module 9 lecture decks and textbook Chapters 18&ndash;21. " + CASES.length + " unfolding EHR cases (" + ITEMS.filter(function (i) { return i.case; }).length + ' questions) and every NGN item type.</p>';
  if (ses) h += '<div class="resume"><b>In progress:</b> ' + esc(ses.label) + ", question " + (ses.i + 1) + " of " + ses.ids.length + ' <button class="btn" id="res">Resume</button> <button class="btn quiet" id="dis">Discard</button></div>';
  h += "</section>";
  h += '<section class="card"><h2>Choose a mode</h2><div class="modes">' +
    mode("full", "&#128221;", "Comprehensive Exam", "All " + ITEMS.length + " questions, one at a time. No answers until you submit. Flag and review before final submission.", '<label class="tog"><input type="checkbox" id="tm"> Timed (90 seconds per question)</label>') +
    mode("learn", "&#128218;", "Learn Mode", "Same exam, but answers, rationales, topic and NCJMM skill appear after each question.") +
    mode("case", "&#129658;", "NGN Case Study", "Pick one unfolding case and work through it with chart updates.", '<select id="cs">' + CASES.map(function (c, k) { return '<option value="' + c.id + '">Case ' + (k + 1) + ": " + esc(c.title) + "</option>"; }).join("") + '</select><label class="tog"><input type="checkbox" id="csfb" checked> Show rationale after each question</label>') +
    mode("hy", "&#9889;", "High-Yield", ITEMS.filter(function (i) { return i.hy; }).length + " questions on postpartum hemorrhage, shock, medication safety, abnormal findings and emergency priorities.") +
    mode("weak", "&#127919;", "Weak Areas", "Retests questions you missed plus items from your lowest topics and skills. Your history is kept.") + "</div></section>";
  if (last) {
    h += '<section class="card"><h2>Past attempts</h2><table class="hist"><thead><tr><th>Date</th><th>Mode</th><th>Score</th><th></th></tr></thead><tbody>';
    S.attempts.slice().reverse().forEach(function (a, k) {
      var E = 0, M = 0; a.ids.forEach(function (id) { E += a.res[id][0]; M += a.res[id][1]; });
      h += "<tr><td>" + new Date(a.d).toLocaleDateString() + "</td><td>" + esc(a.label) + "</td><td><b>" + pct(E, M) + '%</b></td><td><a href="#results/' + (S.attempts.length - 1 - k) + '">Report</a></td></tr>';
    });
    h += "</tbody></table></section>";
  }
  h += '<section class="card"><details><summary><b>How scoring works</b></summary><ul class="small">' +
    "<li><b>Multiple choice:</b> 1 point if correct, 0 if not.</li>" +
    "<li><b>Select all that apply:</b> +1 for each correct option chosen, &minus;1 for each incorrect option chosen, minimum 0. Maximum = number of correct options.</li>" +
    "<li><b>Drop-down (cloze):</b> 1 point for each correct drop-down.</li>" +
    "<li><b>Highlight:</b> +1 for each correct cue highlighted, &minus;1 for each incorrect cue highlighted, minimum 0. Your personal highlighter marks are never scored.</li>" +
    "<li><b>Matrix:</b> 1 point per row answered correctly; no points subtracted for a wrong row.</li>" +
    "<li><b>Bow-tie:</b> 5 points: 1 for the condition, 1 for each of the 2 correct actions and 1 for each of the 2 correct parameters.</li>" +
    "<li><b>Ordered response:</b> 1 point for each item in its correct position.</li>" +
    "<li><b>Overall:</b> total points earned &divide; total points possible &times; 100. This practice scoring is modeled on NGN partial-credit rules; it is not the official NCLEX algorithm.</li></ul></details></section>";
  h += '<section class="card"><details><summary><b>Sources and coverage notes</b></summary><div class="small"><p>Questions follow your professor&rsquo;s highlighted Module 9 study guide first, then your four Module 9 lecture decks (Postpartum Physiologic Changes, Nursing Care of the Family During the Postpartum Period, Transition to Parenthood, Postpartum Complications) and your uploaded textbook pages (Chapters 18&ndash;21). Each rationale cites the chapter and page or slide deck.</p><p><b>Distribution:</b> physiology 13, routine assessment and interventions 12, discharge and teaching 8, transition to parenthood 7, postpartum hemorrhage and shock 15, VTE and PE 7, infections 7, psychiatric complications and maternal safety 6. Seven unfolding cases (38 questions).</p><p><b>Course vs. textbook:</b> the Four T&rsquo;s (tone, trauma, tissue, thrombin) are not in your uploaded materials; they are included as the standard framework. Your slides give 4&ndash;6 weeks for complete perineal healing while the textbook says 4&ndash;6 months, so no question tests that number. Delegation and transfusion-reaction steps follow standard nursing practice because your materials list the topics without detail. All temperatures are in &deg;F.</p></div></details></section>' +
    '<section class="card"><button class="btn danger" id="rst">Reset all progress</button></section>';
  app.innerHTML = h;
  $$(".mode .go").forEach(function (b) { b.addEventListener("click", function () {
    var m = b.getAttribute("data-m");
    if (m === "full" || m === "learn") start(m, buildFull(), { timer: m === "full" && $("#tm").checked });
    else if (m === "case") { var c = $("#cs").value; start("case", caseItems(c).map(function (i) { return i.id; }), { label: "Case: " + CASEBY[c].title, fb: $("#csfb").checked }); }
    else if (m === "hy") start("hy", orderCases(ITEMS.filter(function (i) { return i.hy; }).map(function (i) { return i.id; })));
    else if (m === "weak") { var w = weakIds(); if (!w.length) toast("Answer some questions first. Weak Areas uses your history."); else start("weak", w); }
  }); });
  if (ses) { $("#res").addEventListener("click", function () { location.hash = "#q"; }); $("#dis").addEventListener("click", function () { if (confirm("Discard the exam in progress?")) { S.ses = null; save(); home(); } }); }
  $("#rst").addEventListener("click", function () { if (confirm("Erase all attempts, history and the exam in progress?")) { S = { hist: {}, attempts: [] }; save(); home(); } });
}
function mode(k, ic, t, d, extra) { return '<div class="mode"><div class="mi">' + ic + "</div><div><b>" + t + "</b><p>" + d + "</p>" + (extra || "") + '<button class="btn go" data-m="' + k + '">Start</button></div></div>'; }

// ---------------- theme + router ----------------
function setTheme(t) { document.documentElement.setAttribute("data-theme", t); try { localStorage.setItem("hcc3-examA-theme", t); } catch (e) {} $("#thm").innerHTML = t === "dark" ? "&#9728;" : "&#9790;"; }
$("#thm").addEventListener("click", function () { setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"); });
setTheme(document.documentElement.getAttribute("data-theme") || "light");
function route() {
  var h = (location.hash || "#home").slice(1).split("/");
  if (h[0] !== "q" && hlMode) setHL(false);
  if (h[0] === "q") qScreen();
  else if (h[0] === "results") results(h[1] !== undefined ? +h[1] : S.attempts.length - 1);
  else home();
  try { app.focus({ preventScroll: true }); } catch (e) {}
}
load();
window.addEventListener("hashchange", function () { route(); window.scrollTo(0, 0); });
route();
window.__exam = { score: score, BY: BY, S: function () { return S; } };
})();
</script>
</body>
</html>
