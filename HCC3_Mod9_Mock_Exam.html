xytocin infusion to a bolus rate"],"ans":0,"why":"A boggy, high, midline fundus with heavy bleeding = atony. Firm massage (with lower segment support) is the fastest way to stimulate contraction and expel clots that prevent it. <i>Pathophysiology:</i> Overdistended (4,300 g), grand multiparous, oxytocin-fatigued, infected myometrium contracts poorly.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>Leave the room to call the provider for orders</b>: Never leave a hemorrhaging patient — call for help with the call light while you treat.</li><li><b>Catheterize to empty the bladder</b>: She voided 20 minutes ago, the fundus is midline, and no bladder is palpable.</li><li><b>Increase the oxytocin infusion to a bolus rate</b>: Appropriate per protocol, but massage is the immediate hands-on action to contract the uterus.</li></ul>","cues":"Boggy + midline + recent void = atony not caused by bladder.","safety":"Hands-on hemostasis while help is summoned. <i>Anticipate / reassess:</i> Call for help, increase oxytocin per protocol, quantify blood loss.","take":"Boggy midline fundus + heavy bleeding → massage first (call for help while you do).","src":"Ch. 21, pp. 494, 497","hy":true,"cats":["emerg","prio"],"case":"C2","lead":"<b>1500 — “Something doesn’t feel right.”.</b> Teresa calls: “I feel a lot of blood.” Fundus <b>boggy, 2 cm above the umbilicus, midline</b>. Pad saturated in 20 minutes; dark clots. She voided 400 mL 20 minutes ago; no suprapubic fullness. HR 102 (was 80). BP 118/70.","flow":[["1500","118/70","102","99.2","20 / 98%","3/10","U+2, Boggy, midline","Heavy, dark clots; pad in 20 min","Voided 1440; not palpable","Intact"]],"notes":[],"orders":[],"labs":[],"mar":[]},{"id":"C2Q2","topic":"pph","cj":"ac","stem":"Complete the QBL documentation.","t":"cloze","text":"Blood loss since 1440 is {0}. With the L&D QBL of 450 mL, cumulative blood loss is {1}, which {2} the definition of postpartum hemorrhage.","drops":[{"opts":["645 mL","780 mL","335 mL"],"ans":0},{"opts":["1,095 mL","780 mL","1,230 mL"],"ans":0},{"opts":["meets","does not yet meet"],"ans":0}],"why":"Pads 410 − 75 = 335; underpad 260 − 60 = 200; clots 110 → 645 mL. 645 + 450 = 1,095 mL ≥1000 mL = PPH. <i>Pathophysiology:</i> Visual estimates underestimate by up to 50%.","wrong":"780 mL forgets to subtract the underpad’s dry weight or pad dry weights; 335 mL counts only pads.","cues":"1 g = 1 mL; subtract dry weights.","safety":"Accurate cumulative QBL guides resuscitation. <i>Anticipate / reassess:</i> Keep a running cumulative total for the team.","take":"QBL: wet − dry weight (1 g = 1 mL); PPH ≥1000 mL cumulative or hypovolemia.","src":"Ch. 19, p. 464; Ch. 21, pp. 493, 496–497","hy":true,"cats":["assess"],"case":"C2","lead":"<b>1508 — Quantifying blood loss.</b> The fundus firmed, then softened again. Help arrived; the hemorrhage protocol is activated. Weighed items since 1440:</p><table class=\"mini\"><tr><th>Item</th><th>Wet weight</th><th>Dry weight</th></tr><tr><td>3 peri-pads</td><td>410 g total</td><td>25 g each</td></tr><tr><td>Underpad</td><td>260 g</td><td>60 g</td></tr><tr><td>Expressed clots</td><td>110 g</td><td>—</td></tr></table>","flow":[],"notes":[],"orders":[],"labs":[],"mar":[]},{"id":"C2Q3","topic":"pph","cj":"gs","stem":"For each medication, decide whether to give it or clarify the order first.","t":"matrix","cols":["Give","Clarify first"],"rows":[{"r":"Oxytocin 40 units in 1,000 mL LR IV","a":0},{"r":"Methylergonovine 0.2 mg IM","a":0},{"r":"Carboprost 250 mcg IM","a":1},{"r":"Misoprostol 800 mcg rectally","a":0},{"r":"TXA 1 g IV over 10 min (no VTE history)","a":0}],"why":"Oxytocin is first-line. Her BP (116/70) and history allow methylergonovine. Misoprostol and TXA have no contraindication here. <i>Pathophysiology:</i> Prostaglandin F2α constricts bronchial smooth muscle.","wrong":"Carboprost (PGF2α) causes bronchospasm; it is contraindicated in asthma — clarify so the provider can choose an alternative.","cues":"Asthma in history; BP normal.","safety":"Give the safe agents without delay; clarify carboprost. <i>Anticipate / reassess:</i> Reassess tone and bleeding after each drug; lung sounds; BP before any repeat methylergonovine.","take":"Carboprost ✗ asthma. Methylergonovine ✗ HTN.","src":"Ch. 21, p. 498","hy":true,"cats":["med"],"case":"C2","lead":"<b>1512 — Provider orders.</b> The provider enters orders (see MAR). Teresa’s current BP is 116/70. Review her history before acting.","flow":[],"notes":[],"orders":[],"labs":[],"mar":["Oxytocin 40 units/1,000 mL LR IV Infuse per PPH protocol — Ordered","Methylergonovine 0.2 mg IM Now — Ordered","Carboprost tromethamine 250 mcg IM Now — Ordered","Misoprostol 800 mcg PR Once — Ordered","Tranexamic acid 1 g IV over 10 min If bleeding continues — Ordered"]},{"id":"C2Q4","topic":"pph","cj":"ph","stem":"Complete the bow-tie.","t":"bow","cond":{"opts":["Ongoing PPH from uterine atony","Cervical laceration","Retained placental tissue","Amniotic fluid embolism"],"ans":[0]},"acts":{"opts":["Give TXA 1 g IV over 10 minutes as ordered","Continue fundal massage and prepare for provider bimanual compression or procedures","Give carboprost now because other drugs failed","Give oral fluids and reassess in an hour","Wait for hypotension before transfusing"],"ans":[0,1]},"mons":{"opts":["Cumulative QBL and uterine tone","HR, BP, LOC, and hourly urine output","Deep tendon reflexes","Lochia odor","Breast fullness"],"ans":[0,1]},"why":"Persistent atony despite first- and second-line uterotonics → TXA (antifibrinolytic) and provider-level interventions (bimanual compression, balloon tamponade, surgery) while massage continues. <i>Pathophysiology:</i> Ongoing loss is moving her toward decompensated shock.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>Cervical laceration</b>: Provider exam found no lacerations, and the uterus is not staying firm.</li><li><b>Retained placental tissue</b>: Placenta documented intact — less likely, though the provider may still explore.</li><li><b>Amniotic fluid embolism</b>: Would present with sudden respiratory distress and collapse.</li><li><b>Give carboprost now because other drugs failed</b>: Still contraindicated with her asthma.</li><li><b>Give oral fluids and reassess in an hour</b>: Far too slow for ongoing hemorrhage with early shock signs.</li><li><b>Wait for hypotension before transfusing</b>: Hypotension is a late sign.</li><li><b>Deep tendon reflexes</b>: Magnesium monitoring.</li><li><b>Lochia odor</b>: Infection cue, not today’s priority.</li><li><b>Breast fullness</b>: Not relevant.</li></ul>","cues":"Tone keeps failing, QBL rising, HR ↑, BP ↓, restless, cool skin, low UO.","safety":"Stop the source + monitor perfusion. <i>Anticipate / reassess:</i> Anticipate blood products, labs (CBC, fibrinogen, coags), possible OR.","take":"Atony unresponsive to uterotonics → TXA, bimanual compression, tamponade/surgery.","src":"Ch. 21, pp. 497–498","hy":true,"cats":["emerg","prio"],"case":"C2","lead":"<b>1530 — Still bleeding.</b> After oxytocin, methylergonovine, and misoprostol, the uterus firms with massage but intermittently relaxes. Lochia remains heavy; cumulative QBL <b>1,380 mL</b>. HR <b>116</b>, BP <b>104/62</b>, RR 22, SpO₂ 97%. Restless, skin cool. Placenta was documented intact; perineum and vagina inspected by the provider: no lacerations.","flow":[["1515","110/66","110","98.8","20 / 98%","4/10","","","",""],["1530","104/62","116","98.6","22 / 97%","4/10","U+1, Firms with massage, then relaxes","Heavy; QBL 1,380 mL cumulative","Foley placed — 25 mL","No lacerations (provider exam)"]],"notes":[],"orders":[],"labs":[],"mar":[]},{"id":"C2Q5","topic":"pph","cj":"eo","stem":"Which finding <b>best</b> demonstrates that perfusion has been restored?","t":"mc","opts":["Urine output of 60 mL/h with warm skin and clear mentation","Hemoglobin of 8.9 g/dL","Blood pressure 112/68","She says she feels much better"],"ans":0,"why":"Urine output ≥30 (preferably ≥50) mL/h is the most objective, least invasive indicator of adequate organ perfusion; warm skin and alertness confirm it. <i>Pathophysiology:</i> Kidneys are among the first organs to lose perfusion in shock and among the best gauges of recovery.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>Hemoglobin of 8.9 g/dL</b>: Hgb lags behind acute changes and doesn’t measure perfusion.</li><li><b>Blood pressure 112/68</b>: BP alone is a late, insensitive marker.</li><li><b>She says she feels much better</b>: Subjective; supportive but not the best objective measure.</li></ul>","cues":"UO 60 mL/h, warm, alert.","safety":"Use objective perfusion data to judge resuscitation. <i>Anticipate / reassess:</i> Continue hourly UO, fundal checks around the balloon, repeat CBC.","take":"Best perfusion marker: UO ≥30 mL/h (preferably ≥50).","src":"Ch. 21, p. 500","hy":true,"cats":["eval"],"case":"C2","lead":"<b>1630 — One hour later.</b> After TXA, a balloon tamponade placed by the provider, 2 L LR, and 1 unit PRBCs: fundus firm at U; lochia light around the balloon; QBL total 1,520 mL. HR 92, BP 112/68, RR 18, SpO₂ 99%. Urine 60 mL in the last hour. Alert, skin warm. Labs at 1615: Hgb 8.9 g/dL, platelets 182,000, fibrinogen 340 mg/dL.","flow":[["1600","108/66","100","98.6","20 / 99%","4/10","","","",""],["1630","112/68","92","98.8","18 / 99%","3/10","","","",""]],"notes":[],"orders":[],"labs":["Hgb: 8.9 g/dL (L) [ref 12–16] — 1615","Platelets: 182,000 [ref 150,000–400,000] — 1615","Fibrinogen: 340 mg/dL [ref >200] — 1615"],"mar":["I&O 1530–1630: In LR 2,000 mL; PRBC 1 unit; Out Urine 60 mL"]},{"id":"C2Q6","topic":"pph","cj":"gs","stem":"Which points belong in Teresa’s teaching after her hemorrhage?","t":"sata","opts":["Take the prescribed iron and eat iron-rich foods","Get up slowly and sit if you feel dizzy","Accept help at home and rest when the baby sleeps","Call right away if you soak a pad in an hour or pass large clots","Milk supply may be slower; frequent feeding and lactation support can help","Limit fluids so you bleed less"],"ans":[0,1,2,3,4],"why":"Anemia after PPH causes fatigue and orthostasis; recovery takes weeks. Significant blood loss can delay lactogenesis. She needs to know late PPH warning signs. <i>Pathophysiology:</i> Reduced oxygen-carrying capacity; pituitary perfusion affects prolactin after severe hemorrhage.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>Limit fluids so you bleed less</b>: Hydration supports blood volume and milk production.</li></ul>","cues":"Hgb 8.6, dizziness, multiple children, breastfeeding concern.","safety":"Safety at home and early recognition of recurrence. <i>Anticipate / reassess:</i> Follow-up CBC; screen mood (traumatic birth raises PPD risk).","take":"After PPH: iron, slow position changes, help/rest, bleeding warning signs, lactation support.","src":"Ch. 21, pp. 497–499","hy":true,"cats":["teach"],"case":"C2","lead":"<b>Day 2 — Planning for home.</b> Balloon removed; bleeding light; Hgb 8.6 g/dL. Teresa is tired, mildly lightheaded on standing, and worried about her milk supply. She has four children at home.","flow":[],"notes":[],"orders":[],"labs":["Hgb (day 2): 8.6 g/dL (L) [ref 12–16]"],"mar":[]},{"id":"C3Q1","topic":"pph","cj":"rc","stem":"Highlight the findings that indicate <b>hypovolemic shock is developing</b>.","t":"hl","segs":[{"x":"HR "},{"x":"128, up from 96","k":1},{"x":". BP "},{"x":"98/58 — her baseline was 148/94","k":1},{"x":". RR "},{"x":"26","k":1},{"x":". SpO₂ "},{"x":"95%","k":0},{"x":". Temp "},{"x":"98.0°F","k":0},{"x":". Skin "},{"x":"cool, pale, and clammy","k":1},{"x":". Urine output "},{"x":"15 mL in the last hour","k":1},{"x":". She is "},{"x":"anxious, saying something terrible is happening","k":1},{"x":". Pain "},{"x":"4/10","k":0},{"x":"."}],"why":"Tachycardia, tachypnea, cool clammy skin, oliguria, and anxiety are compensatory shock signs. A BP of 98/58 looks “normal” but is a 50-point systolic drop from her preeclamptic baseline — relative hypotension. <i>Pathophysiology:</i> Catecholamines shunt blood from skin, kidneys, and gut to brain and heart.","wrong":"SpO₂ 95%, temperature, and moderate pain are not shock indicators here (pulse oximetry can also be inaccurate with poor perfusion).","cues":"Trend vs baseline matters more than a single number.","safety":"Escalate before frank hypotension. <i>Anticipate / reassess:</i> Massive transfusion protocol readiness, labs, Foley with urometer.","take":"Judge BP against baseline; early shock = ↑HR, ↑RR, cool skin, ↓UO, anxiety.","src":"Ch. 21, pp. 499–500","hy":true,"cats":["emerg","assess"],"case":"C3","lead":"<b>0500 — You take over the assignment.</b> Nadia has received massage, increased oxytocin, and misoprostol since 0415. Your first assessment: fundus <b>boggy</b> at U+2; continuous heavy flow; QBL <b>1,150 mL</b>. She says, “I feel like something terrible is happening.”","flow":[],"notes":[],"orders":[],"labs":[],"mar":[]},{"id":"C3Q2","topic":"pph","cj":"ta","stem":"Which actions should the nurse implement or anticipate now?","t":"sata","opts":["Insert a second large-bore IV and infuse crystalloid rapidly as ordered","Apply oxygen by nonrebreather mask at 10–12 L/min","Insert an indwelling catheter with a urometer for hourly output","Draw CBC, fibrinogen, PT/PTT, and type and crossmatch","Auscultate breath sounds before large-volume fluid replacement","Give methylergonovine 0.2 mg IM to improve tone","Give her 0600 labetalol early to protect against BP rebound"],"ans":[0,1,2,3,4],"why":"Shock management: large-bore access and rapid crystalloid (~3 mL per mL lost), high-flow O₂, hourly UO, labs to guide blood products, and baseline breath sounds to detect later fluid overload. <i>Pathophysiology:</i> Restore circulating volume and oxygen delivery while the cause is treated.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>Give methylergonovine 0.2 mg IM to improve tone</b>: Contraindicated with preeclampsia/hypertension, even though her BP is low now.</li><li><b>Give her 0600 labetalol early to protect against BP rebound</b>: Antihypertensives worsen hypotension in shock; the order says hold for SBP <110.</li></ul>","cues":"Shock + preeclampsia history.","safety":"Volume, oxygen, monitoring — and avoid harmful drugs. <i>Anticipate / reassess:</i> Blood products if bleeding continues without improvement; watch for DIC and overload.","take":"Shock: 2 large-bore IVs, crystalloid 3:1, O₂ NRB 10–12 L, Foley/urometer, labs; no methergine with preeclampsia.","src":"Ch. 21, pp. 498–500","hy":true,"cats":["med","emerg","prio"],"case":"C3","lead":"<b>0505 — Team arriving.</b> The rapid response and obstetric hemorrhage teams are on the way. Fundal massage is ongoing.","flow":[],"notes":[],"orders":[],"labs":[],"mar":[]},{"id":"C3Q3","topic":"pph","cj":"ph","stem":"Complete the bow-tie.","t":"bow","cond":{"opts":["Consumptive coagulopathy (DIC) complicating hemorrhage","Heparin overdose","Transfusion reaction","Isolated uterine atony"],"ans":[0]},"acts":{"opts":["Give FFP, cryoprecipitate, and platelets as ordered","Check each blood product with a second nurse per protocol, even in the emergency","Give an IM uterotonic in the deltoid","Hold all blood products until Hgb falls below 6","Restrict IV fluids to keep her “dry”"],"ans":[0,1]},"mons":{"opts":["Fibrinogen, platelets, PT/aPTT trends","Oozing from IV/incision sites, petechiae, ecchymosis","Deep tendon reflexes","Lochia odor","Fundal height only"],"ans":[0,1]},"why":"Massive hemorrhage consumes and dilutes clotting factors and platelets → DIC (bleeding from multiple sites with low fibrinogen/platelets, prolonged PT/PTT). Replace factors and platelets while verifying every unit. <i>Pathophysiology:</i> Consumptive coagulopathy after massive hemorrhage; preeclampsia adds endothelial injury.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>Heparin overdose</b>: She has received no heparin.</li><li><b>Transfusion reaction</b>: No fever, chills, or hemolysis signs.</li><li><b>Isolated uterine atony</b>: Atony doesn’t explain oozing from IV sites, petechiae, and abnormal coagulation labs.</li><li><b>Give an IM uterotonic in the deltoid</b>: IM injections in a coagulopathic patient risk hematoma; IV routes preferred.</li><li><b>Hold all blood products until Hgb falls below 6</b>: Active bleeding with coagulopathy needs replacement now.</li><li><b>Restrict IV fluids to keep her “dry”</b>: She is still hypovolemic.</li><li><b>Deep tendon reflexes</b>: Magnesium is off.</li><li><b>Lochia odor</b>: Not relevant to coagulopathy.</li><li><b>Fundal height only</b>: Insufficient alone; coagulation status drives this decision.</li></ul>","cues":"Oozing, petechiae, ↓fibrinogen, ↓platelets, ↑PT/PTT.","safety":"Correct clotting so bleeding can stop. <i>Anticipate / reassess:</i> Watch for transfusion reactions, overload, hypothermia; likely transfer to critical care.","take":"Oozing from sites + ↓fibrinogen/platelets + ↑PT/PTT = DIC → factor/platelet replacement.","src":"Ch. 21, pp. 496, 500","hy":true,"cats":["med","prio"],"case":"C3","lead":"<b>0540 — Labs result.</b> Massive transfusion protocol activated; 2 units PRBCs and 3 L LR infused; bimanual compression performed. Bleeding continues from the uterus, and now <b>oozing at both IV sites</b> and new petechiae on her chest. HR 118, BP 92/54, UO 20 mL/h.","flow":[["0540","92/54","118","97.8","24 / 97%","4/10","","","",""]],"notes":[],"orders":[],"labs":["Hgb: 7.1 g/dL (L) [ref 12–16] — 0530","Platelets: 74,000 (L) [ref 150,000–400,000] — 0530","Fibrinogen: 120 mg/dL (L) [ref >200] — 0530","PT: 17.4 s (H) [ref 11–13.5] — 0530","aPTT: 48 s (H) [ref 25–35] — 0530"],"mar":["I&O 0500–0540: In LR 3,000 mL; PRBC 2 units; Out Urine 20 mL; QBL 1,850 mL"]},{"id":"C3Q4","topic":"pph","cj":"ta","stem":"What is the nurse’s <b>first</b> action?","t":"mc","opts":["Stop the transfusion and infuse normal saline through new tubing to keep the IV open","Slow the transfusion rate and give acetaminophen","Finish the unit quickly because she needs the volume","Recheck the patient ID and blood label before doing anything else"],"ans":0,"why":"Fever, chills, back/flank pain, hypotension, tachycardia, and hemoglobinuria suggest an acute hemolytic reaction. Stop it immediately, keep IV access with NS via new tubing, then notify the provider and blood bank and recheck labels. <i>Pathophysiology:</i> Antibody-mediated destruction of donor RBCs → hemolysis, kidney injury, DIC worsening.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>Slow the transfusion rate and give acetaminophen</b>: Slowing still delivers incompatible blood.</li><li><b>Finish the unit quickly because she needs the volume</b>: Continuing worsens hemolysis and can be fatal.</li><li><b>Recheck the patient ID and blood label before doing anything else</b>: Important, but only after the transfusion is stopped.</li></ul>","cues":"Onset within minutes of a new unit; dark urine.","safety":"Stop exposure to the offending unit. <i>Anticipate / reassess:</i> Return the bag/tubing per protocol, send blood/urine samples, support BP and renal function.","take":"Transfusion reaction: stop, NS via new tubing, notify, verify, send samples.","src":"Ch. 21, p. 500","hy":true,"cats":["med","emerg","prio"],"case":"C3","lead":"<b>0610 — During unit 3.</b> Fifteen minutes into the third unit of PRBCs, Nadia develops chills and back pain. Temp <b>101.4°F</b> (was 97.8°F), HR 132, BP 84/50. Urine in the urometer is dark red-brown.","flow":[["0610","84/50","132","101.4","26 / 95%","6/10","","","",""]],"notes":[],"orders":[],"labs":[],"mar":[]},{"id":"C3Q5","topic":"pph","cj":"eo","stem":"Evaluate her response.","t":"matrix","cols":["Improving / effective","Needs follow-up now"],"rows":[{"r":"Urine output 55 mL/h","a":0},{"r":"HR 96, BP 112/70","a":0},{"r":"Fibrinogen 230, platelets 118,000, no new oozing","a":0},{"r":"New bilateral crackles, RR 26, SpO₂ 92%","a":1},{"r":"Alert and oriented","a":0}],"why":"Perfusion (UO, HR/BP, mentation) and coagulation are improving. <i>Pathophysiology:</i> Large-volume resuscitation + low oncotic pressure + capillary leak in preeclampsia → pulmonary edema.","wrong":"New crackles, rising RR, and falling SpO₂ after 6 L crystalloid plus blood products suggest circulatory overload (pulmonary edema) — preeclampsia raises this risk.","cues":"Compare with the baseline breath sounds you obtained.","safety":"Report immediately; HOB up, O₂, anticipate diuretic and fluid adjustment. <i>Anticipate / reassess:</i> Strict I&O, lung sounds q1h, SpO₂ continuous.","take":"After massive resuscitation, watch for fluid overload: crackles, ↑RR, ↓SpO₂.","src":"Ch. 21, p. 500","hy":true,"cats":["eval"],"case":"C3","lead":"<b>0900 — Critical care unit.</b> Bleeding was controlled with uterine artery embolization. Since 0500 she has received 6 L crystalloid, 5 units PRBCs (unit 3 stopped), 4 units FFP, 1 pool cryoprecipitate, 1 unit platelets. Current status below.","flow":[["0800","108/66","102","99.0","22 / 95%","3/10","","","",""],["0900","112/70","96","98.8","26 / 92%","3/10","","","",""]],"notes":[["0900","Crackles bilateral bases (new). Alert, oriented. No new oozing."]],"orders":[],"labs":["Hgb: 8.8 g/dL (L) [ref 12–16] — 0845","Platelets: 118,000 (L) [ref 150,000–400,000] — 0845","Fibrinogen: 230 mg/dL [ref >200] — 0845"],"mar":["I&O 0800–0900: Out Urine 55 mL"]},{"id":"C4Q1","topic":"infect","cj":"rc","stem":"Highlight the findings that point to an <b>infection and its source</b>.","t":"hl","segs":[{"x":"Temp "},{"x":"100.6°F on POD 2","k":1},{"x":" and "},{"x":"101.4°F on POD 3","k":1},{"x":". HR "},{"x":"110","k":1},{"x":". WBC "},{"x":"17,000 on POD 1","k":0},{"x":". Uterus "},{"x":"markedly tender to palpation","k":1},{"x":". Lochia "},{"x":"profuse, dark, and foul-smelling","k":1},{"x":". Incision "},{"x":"edges pink, approximated, no drainage","k":0},{"x":". Urinalysis "},{"x":"negative","k":0},{"x":". Lungs "},{"x":"clear","k":0},{"x":". Breasts "},{"x":"soft","k":0},{"x":". Calves "},{"x":"soft and nontender","k":0},{"x":"."}],"why":"Fever on two successive days after the first 24 h, tachycardia, uterine tenderness, and foul profuse lochia localize infection to the uterus (endometritis). <i>Pathophysiology:</i> Ascending polymicrobial infection of the decidua, most common after cesarean following long labor and prolonged ROM.","wrong":"A WBC of 17,000 on POD 1 can be normal postpartum leukocytosis. A pink, approximated, dry incision is normal healing. Negative UA, clear lungs, soft breasts, and normal calves help rule out other fever sources.","cues":"Fever pattern + uterine findings.","safety":"Report promptly. <i>Anticipate / reassess:</i> Anticipate IV broad-spectrum antibiotics.","take":"Uterine tenderness + foul lochia + fever after 24 h = endometritis. WBC alone isn’t diagnostic.","src":"Ch. 21, pp. 502–503","hy":false,"cats":["assess"],"case":"C4","lead":"<b>POD 3, 0800 — Morning assessment.</b> Brittany reports chills overnight and lower abdominal pain that feels “deeper” than her incision pain.","flow":[],"notes":[],"orders":[],"labs":[],"mar":[]},{"id":"C4Q2","topic":"infect","cj":"ac","stem":"Complete your SBAR and anticipated plan.","t":"cloze","text":"Brittany {0} the definition of postpartum infection. Her history of {1} increased her risk. The most likely diagnosis is {2}. I anticipate {3}, continued until she is {4}.","drops":[{"opts":["meets","does not meet"],"ans":0},{"opts":["prolonged labor and ROM with cesarean birth","breastfeeding","O-positive blood type"],"ans":0},{"opts":["endometritis","mastitis","pyelonephritis","wound dehiscence"],"ans":0},{"opts":["IV clindamycin plus gentamicin","oral amoxicillin for 3 days","no antibiotics until cultures result"],"ans":0},{"opts":["afebrile and asymptomatic for 24 hours","discharged","afebrile for 4 hours"],"ans":0}],"why":"Fever ≥100.4°F on two successive days of the first 10 days (excluding first 24 h). Cesarean after long labor/ROM, chorioamnionitis, multiple exams, obesity, anemia, and diabetes increase risk. Endometritis is treated with IV broad-spectrum antibiotics (e.g., clindamycin + gentamicin) until afebrile and asymptomatic ~24 h.","wrong":"Each alternative either describes an expected finding or delays the priority action.","cues":"POD 2 and POD 3 fevers; uterine findings.","safety":"Early IV therapy prevents spread to pelvic cellulitis, peritonitis, or sepsis. <i>Anticipate / reassess:</i> Monitor response within 48 h; gentamicin requires renal monitoring.","take":"Endometritis: IV clindamycin + gentamicin until afebrile/asymptomatic 24 h.","src":"Ch. 21, pp. 502–503; Mod 9 slides","hy":true,"cats":["med","assess"],"case":"C4","lead":"<b>POD 3, 0830 — SBAR to the provider.</b> You call the provider.","flow":[],"notes":[],"orders":[],"labs":[],"mar":[]},{"id":"C4Q3","topic":"infect","cj":"ta","stem":"Which nursing actions are appropriate?","t":"sata","opts":["Support continued breastfeeding and time with her baby","Encourage oral fluids and rest","Provide comfort measures for chills and pain","Reinforce hand hygiene and perineal care","Monitor temperature, HR, and uterine tenderness for response to treatment","Separate mother and baby until she is afebrile for 48 hours"],"ans":[0,1,2,3,4],"why":"Supportive care (hydration, rest, comfort), infection control, and monitoring response accompany antibiotics; breastfeeding and mother–infant interaction should be supported.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>Separate mother and baby until she is afebrile for 48 hours</b>: Not required; women may need extra support to MAINTAIN breastfeeding and interaction.</li></ul>","cues":"See the stem and chart findings.","safety":"Timely antibiotics + monitoring for worsening. <i>Anticipate / reassess:</i> Escalate if fever persists beyond 48–72 h (abscess, septic pelvic thrombophlebitis) or signs of sepsis.","take":"Endometritis care: hydration, rest, comfort, hygiene, support breastfeeding, monitor response.","src":"Ch. 21, p. 503","hy":false,"cats":["teach","prio"],"case":"C4","lead":"<b>POD 3, 1000 — Antibiotics started.</b> IV clindamycin and gentamicin started at 0930. Brittany asks whether she can keep breastfeeding and holding her baby.","flow":[],"notes":[],"orders":[],"labs":[],"mar":["Clindamycin 900 mg IV q8h — Started 0930","Gentamicin IV per weight q24h — Started 0930"]},{"id":"C4Q4","topic":"infect","cj":"ta","stem":"What is the most appropriate nursing action?","t":"mc","opts":["Cover the area with a sterile dressing and notify the provider promptly for evaluation (anticipate culture, opening/drainage)","Apply adhesive strips to pull the edges back together","Reassure her that this is normal incision healing","Apply a heating pad and reassess tomorrow"],"ans":0,"why":"A cesarean wound infection with partial separation needs prompt provider evaluation; protect it with a sterile dressing meanwhile. <i>Pathophysiology:</i> Obesity, diabetes, anemia, and chorioamnionitis impair healing and raise wound infection risk.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>Apply adhesive strips to pull the edges back together</b>: Closing an infected wound traps purulent material.</li><li><b>Reassure her that this is normal incision healing</b>: Erythema, induration, pus, and separation are infection.</li><li><b>Apply a heating pad and reassess tomorrow</b>: Delays treatment of a wound infection with dehiscence.</li></ul>","cues":"Localized REEDA-type signs + purulent drainage + separation.","safety":"Protect the wound and get definitive treatment. <i>Anticipate / reassess:</i> Anticipate culture, opening and irrigation, packing; healing by secondary intention; antibiotic adjustment.","take":"Wound infection: erythema, edema, warmth, purulent drainage, separation → sterile cover, notify.","src":"Ch. 21, p. 503","hy":true,"cats":["emerg","prio"],"case":"C4","lead":"<b>POD 4, 1400 — New finding.</b> Temp down to 99.6°F; uterine tenderness improving. During a dressing check you find the right end of the incision <b>red, warm, and indurated for 4 cm</b>, with <b>purulent drainage</b>, and the edges are <b>separated about 1.5 cm</b>. Pain 7/10 at the site.","flow":[["POD4 1400","118/72","96","99.6","18 / 98%","7/10","U−2, Firm, less tender","Rubra–serosa, less odor","Voiding","Incision R end: 4 cm erythema/induration, purulent drainage, 1.5-cm separation"]],"notes":[],"orders":[],"labs":[],"mar":[]},{"id":"C4Q5","topic":"infect","cj":"eo","stem":"Evaluate Brittany’s progress.","t":"matrix","cols":["Expected improvement","Needs follow-up"],"rows":[{"r":"Afebrile for 40 hours; HR 80","a":0},{"r":"WBC 21,800 → 11,200","a":0},{"r":"Lochia serosa without odor","a":0},{"r":"Beefy red wound bed with decreasing drainage","a":0},{"r":"“I feel like a failure,” declines to hold her baby","a":1}],"why":"Physical findings show the infections are responding: afebrile, falling WBC, normal lochia, healthy granulation tissue. <i>Pathophysiology:</i> Prolonged illness, separation, and fatigue increase PPD risk.","wrong":"Self-devaluation and withdrawal from the infant after a complicated recovery are psychosocial red flags that need assessment for depression and support for attachment.","cues":"Physical recovery can mask emotional distress.","safety":"Assess mood, ask about self-harm thoughts, facilitate contact with the baby. <i>Anticipate / reassess:</i> EPDS screening, social work, follow-up after discharge.","take":"Evaluate the whole person — complications raise PPD and attachment risk.","src":"Ch. 21, pp. 503–505; Ch. 19, p. 471","hy":false,"cats":["eval"],"case":"C4","lead":"<b>POD 6 — Progress.</b> The wound was opened, irrigated, and packed. Antibiotics continue.","flow":[["POD5 0800","116/70","88","99.0","16 / 98%","4/10","","","",""],["POD6 0800","114/70","80","98.6","16 / 99%","3/10","","","",""]],"notes":[["POD6","Afebrile 40 h. Lochia serosa, no odor. Wound bed beefy red; drainage decreasing. Pt says, “I feel like a failure — I can’t even take care of my own baby.” Declines to hold infant this morning."]],"orders":[],"labs":["WBC (POD6): 11,200/mm³"],"mar":[]},{"id":"C5Q1","topic":"vte","cj":"ac","stem":"Classify each finding.","t":"matrix","cols":["Supports DVT","Expected or not reliable for diagnosis"],"rows":[{"r":"Left calf circumference 3.5 cm larger than the right","a":0},{"r":"Left calf warm, reddened, and tender","a":0},{"r":"Mild bilateral ankle edema","a":1},{"r":"Pain in the left calf with dorsiflexion of the foot (Homans sign)","a":1},{"r":"Pedal pulses 2+ and equal","a":1}],"why":"Unilateral edema/enlargement, warmth, erythema, and tenderness are the hallmark DVT signs. <i>Pathophysiology:</i> Deep vein obstruction → impaired venous return and inflammation in one limb.","wrong":"Mild bilateral ankle edema is common after birth. Homans sign is unreliable (many women with DVT have none; many without do). Equal pulses don’t rule DVT in or out.","cues":"Asymmetry is the key.","safety":"Keep her in bed with the leg elevated; notify the provider. <i>Anticipate / reassess:</i> Anticipate compression ultrasound.","take":"DVT hallmark: unilateral swelling, warmth, redness, tenderness. Homans is unreliable.","src":"Ch. 21, p. 501","hy":false,"cats":["assess"],"case":"C5","lead":"<b>POD 2, 0815 — Leg assessment.</b> You assess both legs.","flow":[],"notes":[],"orders":[],"labs":[],"mar":[]},{"id":"C5Q2","topic":"vte","cj":"gs","stem":"Which diagnostic test is most frequently used to diagnose a postpartum DVT?","t":"mc","opts":["Compression ultrasonography with or without color Doppler","D-dimer level","Ventilation-perfusion scan","Contrast venography as first-line"],"ans":0,"why":"Compression ultrasonography (± Doppler) is the most frequently used test for DVT; physical exam alone isn’t sensitive enough. <i>Pathophysiology:</i> Noncompressible vein segment = thrombus.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>D-dimer level</b>: D-dimer is normally elevated in pregnancy/postpartum and isn’t validated for diagnosis here.</li><li><b>Ventilation-perfusion scan</b>: Used for suspected PE, not DVT.</li><li><b>Contrast venography as first-line</b>: Invasive; not first-line.</li></ul>","cues":"See the stem and chart findings.","safety":"Confirm before full anticoagulation. <i>Anticipate / reassess:</i> Bed rest with leg elevated until evaluated; no massage, no SCD on that leg.","take":"DVT diagnosis: compression ultrasound. PE: V/Q scan, spiral CT.","src":"Ch. 21, p. 501","hy":false,"cats":[],"case":"C5","lead":"<b>POD 2, 0830 — Provider call.</b> The provider asks what test you expect to confirm the diagnosis.","flow":[],"notes":[],"orders":[],"labs":[],"mar":[]},{"id":"C5Q3","topic":"vte","cj":"eo","stem":"Interpret the trend and complete the note.","t":"cloze","text":"The 0500 aPTT is {0}. With hematuria and increased bleeding, the nurse should {1}. The antidote to have available is {2}.","drops":[{"opts":["supratherapeutic","therapeutic","subtherapeutic"],"ans":0},{"opts":["hold/adjust the infusion per protocol and notify the provider","increase the rate per protocol","continue and recheck tomorrow"],"ans":0},{"opts":["protamine sulfate","vitamin K","naloxone"],"ans":0}],"why":"118 s exceeds the 60–90 s target; with new bleeding signs, follow the protocol to hold/adjust and notify. Protamine sulfate reverses heparin. <i>Pathophysiology:</i> Over-anticoagulation in a woman with a fresh surgical site and recent PPH.","wrong":"Vitamin K reverses warfarin; naloxone reverses opioids.","cues":"Trend from sub- to therapeutic to supratherapeutic + bleeding.","safety":"Bleeding risk now outweighs clot extension risk short-term. <i>Anticipate / reassess:</i> Recheck aPTT per protocol; assess lochia, incision, urine, H&H.","take":"Heparin: monitor aPTT; bleeding + high aPTT → hold per protocol, notify; antidote protamine.","src":"Ch. 21, p. 502","hy":true,"cats":["med","eval"],"case":"C5","lead":"<b>POD 2 → POD 3 — Heparin infusion.</b> DVT confirmed. Enoxaparin stopped; continuous IV heparin started per protocol (therapeutic aPTT 60–90 seconds).</p><table class=\"mini\"><tr><th>Time</th><th>aPTT</th><th>Notes</th></tr><tr><td>POD2 1700</td><td>46 s</td><td>Rate increased per protocol</td></tr><tr><td>POD2 2300</td><td>74 s</td><td>No change</td></tr><tr><td>POD3 0500</td><td>118 s</td><td>Pink urine; lochia heavier (pad in 2 h); oozing at IV site</td></tr></table>","flow":[],"notes":[],"orders":[],"labs":["aPTT: 46 s (L) [ref Therapeutic 60–90] — POD2 1700","aPTT: 74 s [ref Therapeutic 60–90] — POD2 2300","aPTT: 118 s (H) [ref Therapeutic 60–90] — POD3 0500"],"mar":["Heparin IV infusion per protocol Continuous — Running"]},{"id":"C5Q4","topic":"vte","cj":"ta","stem":"Place the nurse’s actions in priority order.","t":"order","items":["Stay with her and call for help — activate the rapid response team","Raise the head of the bed to high Fowler’s","Apply oxygen","Begin continuous SpO₂/cardiac monitoring and auscultate lung sounds","Prepare for diagnostics (CT/V/Q) and the provider’s anticoagulation orders"],"why":"Summon help without leaving, position to ease breathing, oxygenate, monitor, then prepare for definitive diagnosis and treatment. <i>Pathophysiology:</i> Embolized thrombus blocks pulmonary blood flow → V/Q mismatch → hypoxemia; massive PE → right heart failure.","wrong":"Leaving to get equipment or doing diagnostics before oxygenation delays life-saving care.","cues":"Sudden dyspnea, pleuritic chest pain, tachypnea, tachycardia, hypoxemia, hemoptysis, apprehension in a woman with DVT.","safety":"Airway/breathing and the emergency team. <i>Anticipate / reassess:</i> Continuous IV heparin; watch for syncope/hypotension (massive PE).","take":"PE: call for help, high Fowler’s, O₂, monitor, prepare for imaging + IV heparin.","src":"Ch. 21, pp. 501–502","hy":true,"cats":["emerg","prio"],"case":"C5","lead":"<b>POD 4, 0215 — Call light.</b> Danielle is sitting bolt upright: “I can’t catch my breath — it hurts when I breathe!” RR <b>34</b>, HR <b>132</b>, SpO₂ <b>87%</b> on room air, BP 104/66. She is coughing blood-streaked sputum and is very frightened.","flow":[["POD4 0215","104/66","132","99.8","34 / 87%","8/10","","","",""]],"notes":[],"orders":[],"labs":[],"mar":[]},{"id":"C5Q5","topic":"vte","cj":"eo","stem":"Which statements show <b>correct understanding</b>?","t":"sata","opts":["“I’ll keep the amount of green leafy vegetables I eat about the same each day.”","“I’ll use a soft toothbrush and an electric razor.”","“I need regular blood tests to check my INR.”","“I can keep breastfeeding on these medicines.”","“I’ll go back on my combination birth control pills.”","“If I miss a warfarin dose, I’ll take two the next day.”"],"ans":[0,1,2,3],"why":"Warfarin teaching: consistent vitamin K intake, bleeding precautions, INR monitoring; heparin, LMWH, and warfarin are compatible with breastfeeding. <i>Pathophysiology:</i> Warfarin antagonizes vitamin K–dependent clotting factors.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>“I’ll go back on my combination birth control pills.”</b>: Estrogen-containing contraceptives are contraindicated after VTE; warfarin is teratogenic — she needs reliable non-estrogen contraception.</li><li><b>“If I miss a warfarin dose, I’ll take two the next day.”</b>: Doubling doses risks bleeding; contact the provider.</li></ul>","cues":"See the stem and chart findings.","safety":"Prevent recurrence and bleeding; prevent pregnancy on warfarin. <i>Anticipate / reassess:</i> Report bleeding, new leg swelling, chest pain, or dyspnea immediately.","take":"Warfarin: consistent greens, soft brush/electric razor, INR checks, breastfeeding OK, no estrogen contraception.","src":"Ch. 21, p. 502","hy":true,"cats":["med","teach","eval"],"case":"C5","lead":"<b>POD 8 — Discharge on anticoagulation.</b> Danielle is stable and going home on enoxaparin bridging to warfarin. She is breastfeeding.","flow":[],"notes":[],"orders":[],"labs":[],"mar":[]},{"id":"C6Q1","topic":"psych","cj":"ac","stem":"What is the best interpretation and plan?","t":"mc","opts":["Consistent with postpartum blues; given her history, provide support, teach how blues differ from depression, screen before discharge, and arrange early follow-up","Postpartum depression — request an antidepressant before discharge","Postpartum psychosis — request an emergency psychiatric consult","Normal adjustment — no further action needed"],"ans":0,"why":"Labile, tearful mood with intact functioning in the first days fits blues (50–70% of mothers). Her history raises her risk for PPD and psychosis, so screening, teaching, and follow-up are essential. <i>Pathophysiology:</i> Rapid hormonal shifts + sleep deprivation.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>Postpartum depression — request an antidepressant before discharge</b>: Day 2, labile mood, intact function = blues; diagnosis of PPD needs persistence beyond 2 weeks.</li><li><b>Postpartum psychosis — request an emergency psychiatric consult</b>: No hallucinations, delusions, or disorganization.</li><li><b>Normal adjustment — no further action needed</b>: Ignores significant risk factors in her history.</li></ul>","cues":"Day 2, lability, intact care; history of depression; family history of bipolar disorder.","safety":"Support and risk-based follow-up. <i>Anticipate / reassess:</i> EPDS; teach warning signs to Sarah and her husband.","take":"Blues: labile, early, function intact — but risk factors call for screening and follow-up.","src":"Ch. 20, p. 483; Ch. 21, pp. 504–505","hy":false,"cats":["assess"],"case":"C6","lead":"<b>Day 2, 1000 — Discharge morning.</b> Sarah is tearful on and off: “I’m so tired and I keep crying over nothing — then I’m fine.” She is feeding and caring for Ava well and asks good questions.","flow":[],"notes":[],"orders":[],"labs":[],"mar":[]},{"id":"C6Q2","topic":"psych","cj":"rc","stem":"Which factors increase Sarah’s risk for a postpartum mood or psychotic disorder?","t":"sata","opts":["History of major depression","Stopped her antidepressant during pregnancy","Her mother has bipolar I disorder","Sleep deprivation","Husband deploying soon (reduced support)","Uncomplicated vaginal birth of a healthy baby"],"ans":[0,1,2,3,4],"why":"Personal history of depression, untreated illness, a family history of bipolar disorder (strongly linked to postpartum psychosis), sleep loss, and limited support all increase risk. <i>Pathophysiology:</i> Bipolar spectrum vulnerability + hormonal shifts + sleep loss can trigger psychosis.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>Uncomplicated vaginal birth of a healthy baby</b>: Not a risk factor.</li></ul>","cues":"History and social context.","safety":"Identify risk before discharge. <i>Anticipate / reassess:</i> Plan follow-up within 1–2 weeks; teach the family warning signs.","take":"Risk: prior depression, stopped meds, family bipolar history, sleep loss, low support.","src":"Ch. 21, pp. 504–507","hy":false,"cats":["assess"],"case":"C6","lead":"<b>Day 2, 1030 — Risk review.</b> You review Sarah’s history before discharge.","flow":[],"notes":[],"orders":[],"labs":[],"mar":[]},{"id":"C6Q3","topic":"psych","cj":"ph","stem":"What should the nurse do <b>first</b>?","t":"mc","opts":["Ask directly whether she is thinking about suicide, whether she has a plan and the means, and whether she is safe right now","Schedule an appointment with her provider next week","Tell her these feelings are common and will pass","Suggest she stop breastfeeding to get more sleep"],"ans":0,"why":"A positive self-harm item requires immediate, direct assessment of thoughts, frequency, plan, means, and current safety; this determines whether emergency services are needed now. <i>Pathophysiology:</i> Postpartum depression with suicidal ideation.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>Schedule an appointment with her provider next week</b>: Too slow for a positive self-harm item.</li><li><b>Tell her these feelings are common and will pass</b>: False reassurance with suicide risk present.</li><li><b>Suggest she stop breastfeeding to get more sleep</b>: Doesn’t address safety.</li></ul>","cues":"EPDS 17 (≥12 suggests depression), insomnia, anorexia, “better off without me,” item 10 positive.","safety":"Safety first. <i>Anticipate / reassess:</i> Same-day mental health evaluation or emergency services depending on risk; involve support persons.","take":"Positive EPDS item 10 → ask directly about plan/means/safety now.","src":"Ch. 21, pp. 505, 508","hy":true,"cats":["emerg","prio"],"case":"C6","lead":"<b>Day 12 — Follow-up call.</b> On the follow-up call Sarah says she “can’t sleep even when Ava sleeps,” isn’t eating, and feels “like everyone would be better off without me.” She completes the EPDS by phone: score <b>17</b>; on item 10 (thoughts of harming herself) she answers “sometimes.”","flow":[],"notes":[],"orders":[],"labs":[],"mar":[]},{"id":"C6Q4","topic":"psych","cj":"ph","stem":"Complete the bow-tie.","t":"bow","cond":{"opts":["Postpartum psychosis","Postpartum blues","Postpartum OCD with intrusive thoughts","Medication side effect"],"ans":[0]},"acts":{"opts":["Have her husband go to Sarah and Ava now and not leave Sarah alone with the baby","Call 911 for emergency psychiatric evaluation","Tell him to give her a sleep aid and call the clinic tomorrow","Advise a warm bath to help Sarah relax","Increase her antidepressant dose tonight"],"ans":[0,1]},"mons":{"opts":["Content of hallucinations/delusions, especially commands to harm","Suicidal or infanticidal statements and behavior","Lochia amount","Weekly EPDS scores","Breast milk supply"],"ans":[0,1]},"why":"Acute insomnia, grandiosity, command hallucinations, and delusions involving the infant = postpartum psychosis, a psychiatric emergency with risk of infanticide and suicide. <i>Pathophysiology:</i> Often a manifestation of bipolar disorder.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>Postpartum blues</b>: Blues never include hallucinations or delusions.</li><li><b>Postpartum OCD with intrusive thoughts</b>: OCD thoughts are unwanted and resisted; she believes the voice.</li><li><b>Medication side effect</b>: The picture is an acute psychiatric emergency regardless of cause.</li><li><b>Tell him to give her a sleep aid and call the clinic tomorrow</b>: Leaves the infant in danger overnight.</li><li><b>Advise a warm bath to help Sarah relax</b>: Dangerous given her command hallucination about the bathtub.</li><li><b>Increase her antidepressant dose tonight</b>: Not a nursing action and not the emergency response.</li><li><b>Lochia amount</b>: Not the priority.</li><li><b>Weekly EPDS scores</b>: Too slow for an acute emergency.</li><li><b>Breast milk supply</b>: Not the priority.</li></ul>","cues":"Family history of bipolar disorder; rapid onset in weeks 2–4.","safety":"Physical safety of the infant and mother, then emergency evaluation. <i>Anticipate / reassess:</i> Inpatient psychiatric care; antipsychotics/mood stabilizers; supervised contact with the infant.","take":"Postpartum psychosis = emergency; never leave mother alone with infant; call 911.","src":"Ch. 21, pp. 506–508","hy":true,"cats":["emerg","prio"],"case":"C6","lead":"<b>Day 16, 2300 — Husband calls.</b> Sarah began outpatient treatment on day 13. Tonight her husband calls: she hasn’t slept in 3 nights, is talking rapidly, says God chose her for a “mission,” and says a voice told her Ava “must be cleansed in the bathtub.” Sarah is in the nursery with Ava.","flow":[],"notes":[],"orders":[],"labs":[],"mar":[]},{"id":"C6Q5","topic":"psych","cj":"eo","stem":"Evaluate Sarah’s response and the family’s needs.","t":"matrix","cols":["Treatment effective","Needs follow-up"],"rows":[{"r":"Sleeping 6–7 hours a night","a":0},{"r":"No hallucinations reported or observed for 5 days","a":0},{"r":"Holds and feeds Ava calmly during supervised visits","a":0},{"r":"Says, “Sometimes I still think Ava has something evil inside her.”","a":1},{"r":"Husband: “I don’t know how I’ll manage alone when I leave.”","a":1}],"why":"Restored sleep, absence of hallucinations, and calm supervised interaction show improvement.","wrong":"A persisting delusion about the infant means she is not yet safe for unsupervised care. The family’s support plan (deployment) needs social work and community resources.","cues":"Residual delusion; caregiver strain.","safety":"Infant safety and family support before discharge. <i>Anticipate / reassess:</i> Continued treatment, supervised contact, family planning, relapse teaching (risk recurs in future pregnancies).","take":"Before unsupervised care: no delusions about the infant + a support plan.","src":"Ch. 21, pp. 507–508","hy":false,"cats":["eval"],"case":"C6","lead":"<b>Day 30 — Inpatient mother–baby psychiatric unit.</b> Sarah has been treated for 2 weeks with an antipsychotic and a mood stabilizer. Her husband’s deployment was postponed for 2 weeks; he is exhausted.","flow":[],"notes":[],"orders":[],"labs":[],"mar":[]},{"id":"C7Q1","topic":"routine","cj":"ta","stem":"What is the nurse’s <b>first</b> action?","t":"mc","opts":["Move the baby to a safe place (bassinet/partner), stimulate Keiko and coach deep breaths, and call for help to give naloxone per protocol","Document pruritus and give diphenhydramine","Let her sleep — she is finally comfortable","Recheck in 1 hour as ordered"],"ans":0,"why":"Intrathecal morphine plus an oral opioid has caused respiratory depression (RR <10, oversedation, pinpoint pupils, hypoxemia). Protect the infant from an oversedated mother, arouse and coach breathing, and reverse with naloxone per the order while summoning help. <i>Pathophysiology:</i> Opioid depression of the brainstem respiratory center; intrathecal morphine can peak hours after injection.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>Document pruritus and give diphenhydramine</b>: Diphenhydramine adds sedation; respiratory depression is the problem.</li><li><b>Let her sleep — she is finally comfortable</b>: RR 8 with sedation is opioid-induced respiratory depression.</li><li><b>Recheck in 1 hour as ordered</b>: Delays treatment of a life-threatening problem.</li></ul>","cues":"RR 8, sedation, SpO₂ 90%, pinpoint pupils, pruritus (morphine side effect).","safety":"Breathing + infant safety. <i>Anticipate / reassess:</i> Continuous SpO₂, RR/sedation q15 min, repeat naloxone as needed (short half-life).","take":"Opioid respiratory depression: protect infant, stimulate, naloxone per order, monitor closely.","src":"Ch. 19, p. 466 (Safety Alert: CNS depression)","hy":true,"cats":["med","emerg","prio"],"case":"C7","lead":"<b>1400 — Hourly check.</b> Keiko is difficult to keep awake — she drifts off mid-sentence. RR <b>8</b>, shallow. SpO₂ <b>90%</b>. Pupils pinpoint. She has been scratching her face. Her baby is skin-to-skin on her chest.","flow":[["1400","108/66","66","98.6","8 / 90%","1/10","","","",""]],"notes":[],"orders":[],"labs":[],"mar":[]},{"id":"C7Q2","topic":"routine","cj":"gs","stem":"Which interventions are appropriate?","t":"sata","opts":["Ambulate frequently in the hallway","Give simethicone if ordered","Avoid gas-producing foods such as beans and broccoli","Avoid carbonated drinks and drinking through straws","Stay in bed flat to rest the abdomen","Take an extra oxycodone dose for gas pain"],"ans":[0,1,2,3],"why":"Gas pains are more common after cesarean. Ambulation restores peristalsis; antiflatulents help; avoiding gas-forming foods and swallowed air reduces distention. <i>Pathophysiology:</i> Anesthesia, opioids, and bowel handling decrease motility.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>Stay in bed flat to rest the abdomen</b>: Immobility slows peristalsis and increases VTE risk.</li><li><b>Take an extra oxycodone dose for gas pain</b>: Opioids slow intestinal motility and worsen gas/constipation.</li></ul>","cues":"Hypoactive bowel sounds, no flatus, distention.","safety":"Non-opioid measures and mobility. <i>Anticipate / reassess:</i> Report absent bowel sounds, vomiting, or increasing distention (ileus).","take":"Cesarean gas pain: ambulate, antiflatulent, avoid gas foods/straws/carbonation; opioids worsen it.","src":"Ch. 19, p. 469","hy":false,"cats":["teach"],"case":"C7","lead":"<b>POD 1, 1000 — Gas pains.</b> Keiko is stable. Foley out; voided 450 mL. Bowel sounds hypoactive; no flatus yet; abdomen mildly distended. She rates “gas pains” 6/10.","flow":[["POD1 1000","116/72","78","99.0","16 / 98%","6/10","","","",""]],"notes":[],"orders":[],"labs":[],"mar":[]},{"id":"C7Q3","topic":"discharge","cj":"gs","stem":"Which actions are indicated before discharge?","t":"matrix","cols":["Indicated","Not indicated"],"rows":[{"r":"Rh immune globulin 300 mcg IM","a":0},{"r":"MMR vaccine subQ with teaching to avoid pregnancy for 1 month","a":0},{"r":"Repeat Tdap dose","a":1},{"r":"Transfusion of PRBCs for Hgb 10.1","a":1},{"r":"Verify an infant car seat is available and installed","a":0}],"why":"She is Rh-negative/unsensitized with an Rh-positive baby (RhoGAM within 72 h) and rubella nonimmune with no immunocompromised household members (MMR before discharge). Car seat is required for discharge.","wrong":"Tdap was already given in pregnancy. An asymptomatic Hgb of 10.1 does not need transfusion.","cues":"Blood types, Coombs, rubella status, vaccine history.","safety":"Time-sensitive RhoGAM. <i>Anticipate / reassess:</i> Document, teach, give written vaccine information.","take":"Pre-discharge: RhoGAM if indicated, MMR if nonimmune, Tdap if not given, car seat.","src":"Ch. 19, pp. 469–473","hy":true,"cats":["med"],"case":"C7","lead":"<b>POD 2 — Discharge planning.</b> Keiko hopes to leave tomorrow (POD 3). Labs: indirect Coombs negative; newborn A positive; rubella nonimmune; Hgb 10.1. Tdap given at 28 weeks.","flow":[],"notes":[],"orders":[],"labs":["Hgb (POD1): 10.1 g/dL (L)","Maternal indirect Coombs: Negative","Newborn blood type: A positive","Rubella IgG: Nonimmune (L)"],"mar":[]},{"id":"C7Q4","topic":"discharge","cj":"gs","stem":"Which teaching points are appropriate after her cesarean?","t":"sata","opts":["Splint your incision with a pillow when coughing or laughing","Avoid lifting anything heavier than the baby — including your toddler — for now","You may shower; keep the incision clean and dry","Don’t drive while taking oxycodone","Start abdominal crunches at 2 weeks to rebuild your core","Soak in a tub daily to soften the incision"],"ans":[0,1,2,3],"why":"Splinting protects the incision; lifting limits protect the fascia; showering keeps it clean; opioids impair reaction time. <i>Pathophysiology:</i> Fascial healing takes weeks.","wrong":"<ul style=\"margin:4px 0;padding-left:18px\"><li><b>Start abdominal crunches at 2 weeks to rebuild your core</b>: Abdominal exercises are postponed ~4–6 weeks.</li><li><b>Soak in a tub daily to soften the incision</b>: Tub soaking is usually avoided until the incision heals; showers are preferred.</li></ul>","cues":"Toddler at home; oxycodone.","safety":"Prevent dehiscence, infection, and injury. <i>Anticipate / reassess:</i> Teach-back and written instructions.","take":"Cesarean discharge: splint, no heavy lifting, shower, no driving on opioids, delay ab exercises.","src":"Ch. 19, pp. 468–473","hy":false,"cats":["teach"],"case":"C7","lead":"<b>POD 3, 0900 — Discharge teaching.</b> Keiko is ready for teaching. She will care for a newborn and a 2-year-old.","flow":[],"notes":[],"orders":[],"labs":[],"mar":[]},{"id":"C7Q5","topic":"discharge","cj":"rc","stem":"Highlight the findings that must be addressed <b>before</b> she is discharged.","t":"hl","segs":[{"x":"VS "},{"x":"T 98.8°F, HR 78, BP 116/72","k":0},{"x":". Fundus "},{"x":"firm, 2 cm below umbilicus","k":0},{"x":". Lochia "},{"x":"rubra, light","k":0},{"x":". Incision "},{"x":"approximated, dry","k":0}, with each question.","banner":["Sarah Mitchell, 29","G1 P1","Allergies: NKDA","B positive, rubella immune","Breastfeeding","Rm 440 → home"],"history":["Birth: Spontaneous vaginal birth","Newborn: Girl “Ava,” 3,250 g, healthy","History: Major depression at 24 (sertraline; stopped when pregnant). Mother has bipolar I disorder. Husband is in the military and deploys in 3 weeks."],"orders":[],"labs":[],"flow":[["Day 2 0800","112/70","74","98.4","16 / 99%","2/10","","","",""],["Day 2","","","","","","U−2, Firm","Rubra, light","Voiding","Intact"]],"notes":[["Day 2 0300","Awake most of night with visitors until 2300; baby cluster feeding."]],"mar":[]},{"id":"C7","title":"Cesarean recovery and discharge","scenario":"Keiko Tanaka, 34, G2 P2. Scheduled repeat cesarean at 0930, spinal anesthesia with intrathecal morphine. Tdap given at 28 weeks. Lives with husband and 2-year-old; no immunocompromised household members.. Follow her care as it unfolds; the chart updates with each question.","banner":["Keiko Tanaka, 34","G2 P2","Allergies: NKDA","O negative, rubella nonimmune","Breastfeeding","Rm 444"],"history":["Birth: Scheduled repeat cesarean at 0930, spinal anesthesia with intrathecal morphine","Newborn: Boy, 3,500 g — A positive","History: Tdap given at 28 weeks. Lives with husband and 2-year-old; no immunocompromised household members."],"orders":["Respiratory rate and sedation level q1h × 12 h, then q2h × 12 h (intrathecal morphine)","Naloxone 0.1 mg IV PRN RR <10 or sedation level 3–4","Oxycodone 5 mg PO q4h PRN; ibuprofen 600 mg q6h; acetaminophen 1,000 mg q6h","SCDs; ambulate POD1","Remove Foley POD1 0600"],"labs":[],"flow":[["1100","118/72","76","98.6","16 / 98%","2/10","","","",""],["1300","114/70","72","98.8","12 / 96%","2/10","U, Firm","Rubra, scant","Foley — 60 mL/h","Dressing dry and intact"]],"notes":[["1230","Oxycodone given for incisional pain 5/10."]],"mar":["Morphine (intrathecal) 0.15 mg Once in OR — Given 0915","Oxycodone 5 mg PO q4h PRN — Given 1230"]}],"topics":{"physio":"Postpartum physiologic changes","routine":"Routine postpartum assessments & interventions","discharge":"Discharge planning & patient education","parent":"Transition to parenthood","pph":"Postpartum hemorrhage & hypovolemic shock","vte":"Venous thromboembolism & pulmonary embolism","infect":"Postpartum infections","psych":"Psychiatric complications & maternal safety"},"cj":{"rc":"Recognize Cues","ac":"Analyze Cues","ph":"Prioritize Hypotheses","gs":"Generate Solutions","ta":"Take Action","eo":"Evaluate Outcomes"},"cats":{"prio":"Priority nursing interventions","assess":"Maternal assessment","med":"Medication safety","teach":"Patient teaching","eval":"Evaluation of interventions","emerg":"Emergency recognition"}};</script>
<script>(function () {
"use strict";
var X = window.EXAM, ITEMS = X.items, CASES = X.cases, KEY = "hcc3-mod9-examA-v1";
var app = document.getElementById("app");
var BY = {}; ITEMS.forEach(function (it) { BY[it.id] = it; });
var CASEBY = {}; CASES.forEach(function (c) { CASEBY[c.id] = c; });
var TYPE = { mc: "Multiple choice", sata: "Select all that apply", cloze: "Drop-down (cloze)", hl: "Highlight", matrix: "Matrix", bow: "Bow-tie", order: "Ordered response" };
var MODES = {
  full: { name: "Comprehensive Exam", fb: false },
  learn: { name: "Learn Mode", fb: true },
  case: { name: "NGN Case Study", fb: true },
  hy: { name: "High-Yield", fb: true },
  weak: { name: "Weak Areas", fb: true },
  topic: { name: "Topic Retest", fb: true }
};

// ---------------- state ----------------
var S;
function load() { try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { S = {}; } S.hist = S.hist || {}; S.attempts = S.attempts || []; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pct(e, m) { return m ? Math.round(100 * e / m) : 0; }
function fmtT(s) { s = Math.max(0, Math.round(s)); var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ":" + (m < 10 ? "0" : "") : "") + m + ":" + (x < 10 ? "0" : "") + x; }
function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function toast(t) { var o = $(".toast"); if (o) o.remove(); var d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 2400); }
function caseItems(cid) { return ITEMS.filter(function (it) { return it.case === cid; }); }
function standalone() { return ITEMS.filter(function (it) { return !it.case; }); }

// option orders are fixed per session so answers keep their positions when revisiting
function perm(n) { return shuffle(Array.apply(null, Array(n)).map(function (_, i) { return i; })); }
function makeOrders(ids) {
  var o = {};
  ids.forEach(function (id) {
    var it = BY[id], p = {};
    if (it.t === "mc" || it.t === "sata") p.o = perm(it.opts.length);
    if (it.t === "cloze") p.d = it.drops.map(function (d) { return perm(d.opts.length); });
    if (it.t === "bow") { p.c = perm(it.cond.opts.length); p.a = perm(it.acts.opts.length); p.m = perm(it.mons.opts.length); }
    if (it.t === "order") { var q; do { q = perm(it.items.length); } while (q.every(function (v, i) { return v === i; })); p.s = q; }
    o[id] = p;
  });
  return o;
}

// ---------------- scoring ----------------
function score(it, r) {
  var e = 0, m = 0;
  switch (it.t) {
    case "mc": m = 1; e = r === it.ans ? 1 : 0; break;
    case "sata": m = it.ans.length; if (r) { var h = 0, f = 0; r.forEach(function (i) { if (it.ans.indexOf(i) > -1) h++; else f++; }); e = Math.max(0, h - f); } break;
    case "cloze": m = it.drops.length; if (r) it.drops.forEach(function (d, i) { if (r[i] === d.ans) e++; }); break;
    case "hl": var tg = []; it.segs.forEach(function (s, i) { if (s.k === 1) tg.push(i); }); m = tg.length;
      if (r) { var h2 = 0, f2 = 0; r.forEach(function (i) { if (tg.indexOf(i) > -1) h2++; else f2++; }); e = Math.max(0, h2 - f2); } break;
    case "matrix": m = it.rows.length; if (r) it.rows.forEach(function (row, i) { if (r[i] === row.a) e++; }); break;
    case "bow": m = 5; if (r) { if (r.c && r.c[0] === it.cond.ans[0]) e++; (r.a || []).forEach(function (i) { if (it.acts.ans.indexOf(i) > -1) e++; }); (r.m || []).forEach(function (i) { if (it.mons.ans.indexOf(i) > -1) e++; }); } break;
    case "order": m = it.items.length; if (r && r.list) r.list.forEach(function (v, i) { if (v === i) e++; }); break;
  }
  return [e, m];
}
function answered(it, r) {
  if (r === undefined || r === null) return false;
  if (it.t === "mc") return true;
  if (it.t === "sata" || it.t === "hl") return r.length > 0;
  if (it.t === "cloze") return r.some(function (v) { return v > -1; });
  if (it.t === "matrix") return r.some(function (v) { return v > -1; });
  if (it.t === "bow") return (r.c && r.c.length) || (r.a && r.a.length) || (r.m && r.m.length);
  if (it.t === "order") return !!(r && r.touched);
  return false;
}
function complete(it, r) {
  if (it.t === "order") return !!(r && r.list);
  if (!answered(it, r)) return false;
  if (it.t === "cloze" || it.t === "matrix") return r.every(function (v) { return v > -1; });
  if (it.t === "bow") return r.c && r.c.length === 1 && r.a.length === 2 && r.m.length === 2;
  return true;
}

// ---------------- sessions ----------------
function buildFull() {
  var sa = shuffle(standalone().map(function (i) { return i.id; })), out = [], per = Math.ceil(sa.length / CASES.length);
  CASES.forEach(function (c, k) { out = out.concat(sa.slice(k * per, (k + 1) * per)); out = out.concat(caseItems(c.id).map(function (i) { return i.id; })); });
  return out;
}
function weakIds() {
  var miss = ITEMS.filter(function (it) { var h = S.hist[it.id]; return h && h.length && h[h.length - 1] < 100; });
  var st = stats(allResults());
  var low = [];
  ["topic", "cj"].forEach(function (k) {
    st[k].filter(function (x) { return x.n >= 3; }).sort(function (a, b) { return a.p - b.p; }).slice(0, 2).forEach(function (x) { low.push([k, x.key]); });
  });
  var extra = ITEMS.filter(function (it) { return miss.indexOf(it) < 0 && low.some(function (l) { return it[l[0]] === l[1]; }) && !(S.hist[it.id] && S.hist[it.id].slice(-1)[0] === 100); });
  return orderCases(miss.concat(shuffle(extra).slice(0, Math.max(0, 20 - miss.length))).map(function (i) { return i.id; }));
}
function orderCases(ids) {
  // keep case items together and in case order
  var sa = ids.filter(function (id) { return !BY[id].case; }), cs = {};
  ids.forEach(function (id) { var c = BY[id].case; if (c) (cs[c] = cs[c] || []).push(id); });
  var out = shuffle(sa);
  CASES.forEach(function (c) { if (cs[c.id]) out = out.concat(caseItems(c.id).map(function (i) { return i.id; }).filter(function (id) { return cs[c.id].indexOf(id) > -1; })); });
  return out;
}
function start(mode, ids, opt) {
  opt = opt || {};
  if (!ids.length) { toast("No questions available for that yet"); return; }
  S.ses = { mode: mode, ids: ids, i: 0, resp: {}, flags: {}, locked: {}, done: {}, ord: makeOrders(ids), t0: Date.now(), el: 0, limit: opt.timer ? Math.round(ids.length * 90) : 0, label: opt.label || MODES[mode].name, fb: opt.fb !== undefined ? opt.fb : MODES[mode].fb };
  save(); location.hash = "#q"; route();
}

// ---------------- timer ----------------
var tick = null, lastTick = 0;
function runTimer() {
  if (tick) clearInterval(tick);
  lastTick = Date.now();
  tick = setInterval(function () {
    if (!S.ses || location.hash !== "#q") { clearInterval(tick); tick = null; return; }
    var now = Date.now(); S.ses.el += (now - lastTick) / 1000; lastTick = now;
    var el = $("#tmr"); if (el) { if (S.ses.limit) { var left = S.ses.limit - S.ses.el; el.textContent = "Time left " + fmtT(left); el.classList.toggle("low", left < 300); if (left <= 0) { save(); finish(true); } } else el.textContent = "Time " + fmtT(S.ses.el); }
    if (Math.round(S.ses.el) % 10 === 0) save();
  }, 1000);
}

// ---------------- chart ----------------
function chartHTML(it) {
  var c = CASEBY[it.case], items = caseItems(c.id), idx = items.indexOf(it);
  var flow = c.flow.map(function (r) { return [r, false]; }), notes = c.notes.map(function (r) { return [r, false]; }), orders = c.orders.map(function (r) { return [r, false]; }), labs = c.labs.map(function (r) { return [r, false]; }), mar = (c.mar || []).map(function (r) { return [r, false]; });
  for (var k = 0; k <= idx; k++) {
    var s = items[k], isNew = k === idx;
    s.flow.forEach(function (r) { flow.push([r, isNew]); }); s.notes.forEach(function (r) { notes.push([r, isNew]); });
    s.orders.forEach(function (r) { orders.push([r, isNew]); }); s.labs.forEach(function (r) { labs.push([r, isNew]); }); (s.mar || []).forEach(function (r) { mar.push([r, isNew]); });
  }
  var nw = function (n) { return n ? ' class="new"' : ""; };
  var h = '<section class="chart hlzone"><div class="cbar"><b>&#128203; EHR: ' + esc(c.title) + '</b><span>Question ' + (idx + 1) + " of " + items.length + " in this case</span></div>";
  h += '<div class="banner">' + c.banner.map(function (b) { return "<span>" + b + "</span>"; }).join("") + "</div>";
  h += '<details open><summary>Flowsheet</summary><div class="tw"><table class="flow"><thead><tr><th>Time</th><th>BP</th><th>HR</th><th>Temp &deg;F</th><th>RR / SpO2</th><th>Pain</th><th>Fundus</th><th>Lochia</th><th>Bladder / voiding</th><th>Perineum / incision</th></tr></thead><tbody>';
  flow.forEach(function (f) { h += "<tr" + nw(f[1]) + ">" + f[0].map(function (v) { return "<td>" + (v || "&ndash;") + "</td>"; }).join("") + "</tr>"; });
  h += "</tbody></table></div></details>";
  h += '<details open><summary>Nursing notes</summary><ul class="notes">';
  notes.forEach(function (n) { h += "<li" + nw(n[1]) + "><b>" + n[0][0] + "</b> " + n[0][1] + "</li>"; });
  h += "</ul></details>";
  h += "<details><summary>History and medications</summary><ul>" + c.history.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ul></details>";
  h += "<details" + (orders.some(function (o) { return o[1]; }) ? " open" : "") + "><summary>Provider orders</summary><ul>" + orders.map(function (o) { return "<li" + nw(o[1]) + ">" + o[0] + "</li>"; }).join("") + "</ul></details>";
  h += "<details" + (mar.some(function (o) { return o[1]; }) ? " open" : "") + "><summary>Medication administration (MAR) and I&amp;O</summary><ul>" + (mar.length ? mar.map(function (o) { return "<li" + nw(o[1]) + ">" + o[0] + "</li>"; }).join("") : "<li>No entries</li>") + "</ul></details>";
  h += "<details" + (labs.some(function (o) { return o[1]; }) ? " open" : "") + "><summary>Labs</summary><ul>" + (labs.length ? labs.map(function (o) { return "<li" + nw(o[1]) + ">" + o[0] + "</li>"; }).join("") : "<li>No results</li>") + "</ul></details></section>";
  return h;
}

// ---------------- question rendering ----------------
function renderItem(host, it, ses, show) {
  var r = ses.resp[it.id], ord = ses.ord[it.id] || makeOrders([it.id])[it.id], dis = show ? " disabled" : "";
  var h = '<div class="qbody"><div class="qtype">' + TYPE[it.t] + (it.t === "sata" ? " &middot; select every option that applies" : "") + '</div><div class="stem hlzone">' + it.stem + "</div>";
  if (it.t === "mc" || it.t === "sata") {
    h += '<div class="opts">';
    ord.o.forEach(function (i, n) {
      var sel = it.t === "mc" ? r === i : (r || []).indexOf(i) > -1, cls = "";
      if (show) { var ok = it.t === "mc" ? i === it.ans : it.ans.indexOf(i) > -1; cls = ok ? (sel ? " right" : " missed") : (sel ? " wrong" : ""); }
      h += '<button class="opt ' + it.t + (sel ? " sel" : "") + cls + '" data-i="' + i + '"' + dis + '><span class="ol">' + (it.t === "sata" ? (sel ? "&#10003;" : "") : String.fromCharCode(65 + n)) + "</span><span>" + it.opts[i] + "</span></button>";
    });
    h += "</div>";
  } else if (it.t === "cloze") {
    var k = 0;
    h += '<div class="cloze">' + it.text.replace(/\{(\d+)\}/g, function (_, d) {
      d = +d; var v = r ? r[d] : -1, cls = show ? (v === it.drops[d].ans ? " right" : " wrong") : "";
      var s = '<select class="dd' + cls + '" data-d="' + d + '"' + dis + '><option value="-1">Select&hellip;</option>';
      ord.d[d].forEach(function (i) { s += '<option value="' + i + '"' + (v === i ? " selected" : "") + ">" + it.drops[d].opts[i] + "</option>"; });
      return s + "</select>" + (show && v !== it.drops[d].ans ? '<span class="fix">&#10132; ' + it.drops[d].opts[it.drops[d].ans] + "</span>" : "");
    }) + "</div>";
  } else if (it.t === "hl") {
    h += '<div class="hlnote"><div class="hlhelp">Tap or click a phrase to select it as an answer. Tap again to clear.</div>';
    it.segs.forEach(function (s, i) {
      if (s.k === undefined) { h += s.x; return; }
      var sel = (r || []).indexOf(i) > -1, cls = show ? (s.k === 1 ? (sel ? " right" : " missed") : (sel ? " wrong" : "")) : "";
      h += '<span class="cue' + (sel ? " sel" : "") + cls + '" data-i="' + i + '" role="button" tabindex="0">' + s.x + "</span>";
    });
    h += "</div>";
  } else if (it.t === "matrix") {
    h += '<div class="tw"><table class="matrix"><thead><tr><th></th>' + it.cols.map(function (c) { return "<th>" + c + "</th>"; }).join("") + "</tr></thead><tbody>";
    it.rows.forEach(function (row, ri) {
      h += "<tr><td>" + row.r + "</td>";
      it.cols.forEach(function (c, ci) {
        var sel = r && r[ri] === ci, cls = show ? (ci === row.a ? (sel ? " right" : " missed") : (sel ? " wrong" : "")) : "";
        h += '<td class="mc' + cls + '"><label><input type="radio" name="m' + it.id + "_" + ri + '" data-r="' + ri + '" data-c="' + ci + '"' + (sel ? " checked" : "") + dis + '><span class="sr">' + c + "</span></label></td>";
      });
      h += "</tr>";
    });
    h += "</tbody></table></div>";
  } else if (it.t === "bow") {
    var rv = r || { c: [], a: [], m: [] };
    var col = function (key, part, title, max) {
      var s = '<div class="bcol b' + key + '"><div class="bh">' + title + ' <small>(choose ' + max + ")</small></div>";
      ord[key].forEach(function (i) {
        var sel = rv[key].indexOf(i) > -1, cls = show ? (part.ans.indexOf(i) > -1 ? (sel ? " right" : " missed") : (sel ? " wrong" : "")) : "";
        s += '<button class="bopt' + (sel ? " sel" : "") + cls + '" data-k="' + key + '" data-i="' + i + '" data-max="' + max + '"' + dis + ">" + part.opts[i] + "</button>";
      });
      return s + "</div>";
    };
    h += '<div class="bowtie">' + col("a", it.acts, "Actions to take", 2) + col("c", it.cond, "Condition most likely experiencing", 1) + col("m", it.mons, "Parameters to monitor", 2) + "</div>";
  } else if (it.t === "order") {
    if (!r && !show) { r = ses.resp[it.id] = { list: ord.s.slice() }; }
    var cur = r && r.list ? r.list : ord.s;
    h += '<div class="ordhelp">Use the arrows (or drag on a computer) to put the items in order, first at the top.</div><ol class="ord">';
    cur.forEach(function (i, pos) {
      var cls = show ? (i === pos ? " right" : " wrong") : "";
      h += '<li class="oi' + cls + '" draggable="' + (!show) + '" data-i="' + i + '"><span class="on">' + (pos + 1) + "</span><span class=\"ot\">" + it.items[i] + "</span>" + (show ? (i !== pos ? '<span class="fix">correct: #' + (i + 1) + "</span>" : "") : '<span class="oa"><button class="up" aria-label="Move up">&#9650;</button><button class="dn" aria-label="Move down">&#9660;</button></span>') + "</li>";
    });
    h += "</ol>";
  }
  h += "</div>";
  host.innerHTML = h;
  if (!show) wire(host, it, ses);
}
function setR(ses, it, v) { ses.resp[it.id] = v; save(); var b = $("#sub"); if (b) b.disabled = !(answered(it, v) || it.t === "order"); }
function wire(host, it, ses) {
  var r = ses.resp[it.id];
  if (it.t === "mc") $$(".opt", host).forEach(function (b) { b.addEventListener("click", function () { if (hlMode) return; $$(".opt", host).forEach(function (x) { x.classList.remove("sel"); }); b.classList.add("sel"); setR(ses, it, +b.getAttribute("data-i")); }); });

  if (it.t === "hl") $$(".cue", host).forEach(function (c) {

    c.addEventListener("click", f); c.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); f(); } });
  });
  if (it.t === "matrix") $$("input[type=radio]", host).forEach(function (x) { x.addEventListener("change", function () { var a = (ses.resp[it.id] || it.rows.map(function () { return -1; })).slice(); a[+x.getAttribute("data-r")] = +x.getAttribute("data-c"); setR(ses, it, a); }); });
  if (it.t === "bow") $$(".bopt", host).forEach(function (b) { b.addEventListener("click", function () {
    var v = ses.resp[it.id] || { c: [], a: [], m: [] }; v = { c: v.c.slice(), a: v.a.slice(), m: v.m.slice() };
    var k = b.getAttribute("data-k"), i = +b.getAttribute("data-i"), max = +b.getAttribute("data-max"), p = v[k].indexOf(i);
    if (p > -1) v[k].splice(p, 1); else { if (v[k].length >= max) { if (max === 1) v[k] = []; else { toast("You can choose " + max + " here. Tap a selected one to clear it."); return; } } v[k].push(i); }
    $$('.bopt[data-k="' + k + '"]', host).forEach(function (x) { x.classList.toggle("sel", v[k].indexOf(+x.getAttribute("data-i")) > -1); });
    setR(ses, it, v);
  }); });
  if (it.t === "order") {
    var list = $(".ord", host);
    var commit = function () { var a = $$(".oi", list).map(function (li) { return +li.getAttribute("data-i"); }); $$(".oi", list).forEach(function (li, p) { $(".on", li).textContent = p + 1; }); setR(ses, it, { list: a, touched: 1 }); };
    $$(".oi", list).forEach(function (li) {
      $(".up", li).addEventListener("click", function () { if (li.previousElementSibling) { list.insertBefore(li, li.previousElementSibling); commit(); } });
      $(".dn", li).addEventListener("click", function () { if (li.nextElementSibling) { list.insertBefore(li.nextElementSibling, li); commit(); } });
      li.addEventListener("dragstart", function (e) { li.classList.add("drag"); try { e.dataTransfer.setData("text/plain", "x"); } catch (er) {} });
      li.addEventListener("dragend", function () { li.classList.remove("drag"); commit(); });
      li.addEventListener("dragover", function (e) { e.preventDefault(); var d = $(".drag", list); if (!d || d === li) return; var rct = li.getBoundingClientRect(); list.insertBefore(d, e.clientY < rct.top + rct.height / 2 ? li : li.nextSibling); });
    });

}

function answerText(it) {
  switch (it.t) {
    case "mc": return it.opts[it.ans];
    case "sata": return it.ans.map(function (i) { return it.opts[i]; }).join("; ");
    case "cloze": return it.drops.map(function (d, i) { return "(" + (i + 1) + ") " + d.opts[d.ans]; }).join(" &nbsp; ");
    case "hl": return it.segs.filter(function (s) { return s.k === 1; }).map(function (s) { return s.x; }).join(" | ");
    case "matrix": return it.rows.map(function (r) { return r.r + ": <b>" + it.cols[r.a] + "</b>"; }).join("<br>");
    case "bow": return "<b>Condition:</b> " + it.cond.opts[it.cond.ans[0]] + "<br><b>Actions:</b> " + it.acts.ans.map(function (i) { return it.acts.opts[i]; }).join("; ") + "<br><b>Monitor:</b> " + it.mons.ans.map(function (i) { return it.mons.opts[i]; }).join("; ");
    case "order": return it.items.map(function (x, i) { return (i + 1) + ". " + x; }).join("<br>");
  }
}
function rationale(it, sc) {
  var p = pct(sc[0], sc[1]);
  return '<div class="rat"><div class="verdict ' + (p === 100 ? "ok" : p > 0 ? "part" : "no") + '">' + (p === 100 ? "Full credit" : p > 0 ? "Partial credit" : "No credit") + " &middot; " + sc[0] + " / " + sc[1] + " points</div>" +
    '<div class="rgrid"><div class="rk">Correct answer</div><div>' + answerText(it) + "</div>" +
    '<div class="rk">Why</div><div>' + it.why + "</div>" +
    '<div class="rk">Why the others are wrong</div><div>' + it.wrong + "</div>" +
    '<div class="rk">Key cues</div><div>' + it.cues + "</div>" +
    '<div class="rk">Priority and safety</div><div>' + it.safety + "</div>" +
    '<div class="rk">Blueprint topic</div><div>' + X.topics[it.topic] + "</div>" +
    '<div class="rk">NCJMM skill</div><div>' + X.cj[it.cj] + "</div>" +
    '<div class="rk">Source</div><div>' + it.src + "</div></div>" +
    '<div class="take">&#128161; <b>NCLEX takeaway:</b> ' + it.take + "</div></div>";
}

// ---------------- personal highlighter ----------------

  var b = $("#hlb"); if (b) { b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); }

}
document.addEventListener("mouseup", markSel); document.addEventListener("touchend", function () { setTimeout(markSel, 30); });
function markSel() {
  if (!hlMode) return;
  var sel = window.getSelection ? window.getSelection() : null; if (!sel || sel.isCollapsed || !sel.rangeCount) return;
  var rg = sel.getRangeAt(0), anc = rg.commonAncestorContainer; anc = anc.nodeType === 3 ? anc.parentNode : anc;
  if (!anc.closest || !anc.closest(".hlzone")) return;
  try { var mk = document.createElement("mark"); mk.className = "mine"; rg.surroundContents(mk); } catch (e) { toast("Highlight within one line or cell at a time."); }
  sel.removeAllRanges();
}
document.addEventListener("click", function (e) { if (hlMode && e.target.classList && e.target.classList.contains("mine")) { var m = e.target; m.replaceWith.apply(m, Array.prototype.slice.call(m.childNodes)); } });

// ---------------- question screen ----------------
function qScreen() {

    '<button class="tbtn' + (ses.flags[it.id] ? " on" : "") + '" id="flag" aria-pressed="' + !!ses.flags[it.id] + '">&#9873; ' + (ses.flags[it.id] ? "Flagged" : "Flag") + "</button>" +

  if (!fb) {
    nav += '<button class="btn ghost" id="prev"' + (prevOK ? "" : " disabled") + ">&larr; Previous</button>";
    nav += '<button class="btn ghost" id="rev">Review screen</button>';
    nav += '<button class="btn" id="next">' + (ses.i + 1 < n ? "Next &rarr;" : "Go to final review") + "</button>";

  }

  $("#quit").addEventListener("click", function () { save(); location.hash = "#home"; });
  var nx = $("#next"), pv = $("#prev"), sb = $("#sub"), rv = $("#rev");

    ses.done[it.id] = true; ses.locked[it.id] = true; record(it.id, score(it, ses.resp[it.id])); save(); qScreen();
    var rb = $("#ratbox"); if (rb && rb.scrollIntoView) rb.scrollIntoView({ behavior: "auto", block: "start" });
  });

    if (it.case && !fb) ses.locked[it.id] = true;
    ses.i++; save(); if (ses.i >= n) { if (fb) finish(); else review(); } else { qScreen(); window.scrollTo(0, 0); }
  });
