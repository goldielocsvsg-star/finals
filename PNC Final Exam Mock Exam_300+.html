ocacy and assertion, two-challenge rule, CUS, DESC) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"M6-07","m":6,"lo":"6.3","t":"Brief, huddle, debrief","cj":"Analyze Cues","d":1,"type":"mc","s":"Midway through a shift, three admissions arrive simultaneously and a patient is transferred to the ICU. The charge nurse gathers the team for 3 minutes to reassign patients and confirm who is covering the ICU transfer. Which team event is this?","r":"A huddle is an ad hoc meeting to re-establish situational awareness, reinforce or adjust the plan, and progress toward goals during care. A brief happens before care starts; a debrief reviews performance afterward.","o":["Debrief","Huddle","Handoff","Brief"],"a":[1],"w":["A debrief occurs after an event to review it.","Correct — an ad hoc mid-shift plan adjustment.","A handoff transfers care responsibility between providers.","A brief occurs at the start to share the plan."],"src":"Module 6 slides — Brief/Huddle/Debrief; Situation Monitoring (STEP, I’M SAFE, cross-monitoring) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"M4-19","m":4,"lo":"4.5","t":"Productivity & safety","cj":"Prioritize Hypotheses","d":3,"type":"mc","s":"Administration praises a unit for having the highest productivity in the hospital: high census with the lowest nursing hours per patient day. Falls and pressure injuries on the unit have increased. What is the best analysis?","r":"The budgeting chapter notes that high productivity (high census, low nursing hours) means fewer staff caring for more patients, and the unit may not be able to provide safe, quality care. Rising nurse-sensitive adverse outcomes signal that efficiency is being pursued at the expense of effectiveness.","o":["Too few staff for the acuity may be compromising safety","Productivity is unrelated to patient outcomes","High productivity indicates efficient care, so the unit’s staffing model should be used hospital-wide","Add UAPs only, because RN hours drive cost but not patient outcomes"],"a":[0],"w":["Correct — balances productivity with safety.","Nurse staffing is linked to outcomes.","Efficiency is not the same as quality.","Falls and pressure injuries are nurse-sensitive outcomes linked to RN staffing."],"src":"PCAP Module 4 — Budgeting chapter (Box 18.1 operating, labor, and capital budgets; FTE = 2,080 hours; favorable vs. unfavorable variance; productivity) · Final Exam Study Guide, Module 4 (Medicare A–D, Medicaid, HMO/PPO/EPO, stewardship, value-based care)"},{"id":"M7-26","m":7,"lo":"7.8","t":"ANA Code — provision application","cj":"Prioritize Hypotheses","d":3,"type":"mc","s":"Nurses at a regional health system join an international coalition to reduce health care’s carbon footprint and advocate for climate-resilient health infrastructure. Which ANA Code of Ethics provision (2025) does this most directly reflect?","r":"The new Provision 10 (2025) addresses nursing’s participation, through organizations and associations, in the global nursing and health community to promote human and environmental health, well-being, and flourishing.","o":["Provision 8 — nurses build collaborative networks with other disciplines and the public to achieve greater ends","Provision 10 — global and environmental health","Provision 3 — advocating for the rights, health, and safety of recipients of care","Provision 5 — duties to self"],"a":[1],"w":["Collaboration is involved, but the global and environmental focus is Provision 10.","Correct — global and environmental health.","Focuses on patient advocacy and trust.","Focuses on the nurse’s duties to self."],"src":"ANA Code of Ethics (2025) — Provision 10 (new in 2025) · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"M8-08","m":8,"lo":"8.2","t":"CDS conflicts with assessment","cj":"Take Action","d":3,"type":"mc","s":"An EHR alert recommends holding a patient’s scheduled enoxaparin because the latest creatinine clearance is low. The nurse notes that the lab value is from 9 days ago and the patient has had normal creatinine values since. What is the best action?","r":"CDS supports but does not replace judgment. When an alert conflicts with current data, the nurse verifies source data and clarifies with the prescriber or pharmacist—neither blindly following nor dismissing the alert—and reports the data-quality issue so the rule can be improved.","o":["Hold the enoxaparin, because the clinical decision support system is programmed with current guidelines","Give the dose and turn off the alert for the remainder of the stay","Give the dose because the most recent creatinine values are normal","Verify current labs and clarify with the provider or pharmacist first"],"a":[3],"w":["Following an alert based on stale data may harm the patient.","Dismissing and disabling alerts removes a safety layer.","Probably right clinically, but verify current values and clarify with the provider or pharmacist first.","Correct — verify, clarify, and report the data issue."],"src":"PNC Modules 8–9 — Information Technology in the Clinical Setting: Clinical Decision Support (alert fatigue), CPOE, EHR data management · Final Exam Study Guide, Module 8 (HIT, AI applications, benefits/risks, ethical and legal concerns)"},{"id":"M2-04","m":2,"lo":"2.2","t":"Situational leadership","cj":"Generate Solutions","d":2,"type":"mc","s":"A charge nurse is working with two nurses: a new graduate in week 3 of orientation who is anxious about admissions, and a 12-year veteran who is highly competent and motivated. Which approach reflects situational leadership?","r":"Situational leadership matches the amount of direction and support to the follower’s competence and commitment. The novice needs directive coaching; the veteran benefits from delegation and autonomy. Over time, the novice’s autonomy increases as competence grows.","o":["Delegate the admissions to the veteran only and keep the new graduate on discharges indefinitely","Allow both nurses to self-direct because adult learners prefer autonomy","Coach the new graduate step by step on admissions while giving the veteran autonomy","Give both nurses the same detailed, step-by-step instructions so that the assignment process is fair and consistent"],"a":[2],"w":["Avoids developing the new graduate.","Laissez-faire toward a novice is unsafe.","Correct — style matched to readiness.","Over-directs the expert and may still under-support the novice."],"src":"PCAP Module 2 — Box 17.1 (transformational vs. transactional) and Management Styles table (autocratic, democratic, laissez-faire); Giddens Leadership concept (leadership styles) · Final Exam Study Guide, Module 2 (leader vs. manager, leadership theories, prioritization, 5 rights, EAT)"},{"id":"M1-18","m":1,"lo":"1.6","t":"Crisis standards of care","cj":"Prioritize Hypotheses","d":3,"type":"mc","s":"A state governor formally declares crisis standards of care during a regional pandemic surge. Ventilators are allocated using a published scoring protocol. A nurse is distressed that a 76-year-old patient with poor prognostic indicators is not receiving a ventilator. Which statement best explains this situation?","r":"A crisis standard of care is a substantial change in usual operations, justified by circumstances and formally declared by state government. Allocation becomes population-focused (utilitarian) using consistent, transparent criteria. The nurse’s moral distress is valid and should be addressed with support—but the framework itself is lawful and ethically grounded.","o":["Crisis standards apply only to hospitals that have lost power or structural integrity","The patient’s age alone excludes him from ventilator allocation under crisis standards","Under declared crisis standards, allocation shifts from individual-focused to population-focused care to save the most lives","Crisis standards let each clinician decide personally what is fair at the bedside"],"a":[2],"w":["Crisis standards can be declared whenever demand overwhelms resources, not only after structural damage.","Crisis protocols use clinical prognostic criteria, not categorical age exclusions.","Correct — a population focus under formal declaration.","Allocation follows the declared protocol, not individual opinion."],"src":"PCAP Module 1 — Emergency Preparedness chapter (mitigation, preparedness, response, recovery; crisis standards of care; MCI triage; incident command; biologic agents); Module 1 Study Guide §IX · Final Exam Study Guide, Module 1 (SDOH, equity, prevention, HBM, care coordination, emergency response)"},{"id":"M1-26","m":1,"lo":"1.2","t":"DEI — inclusion","cj":"Take Action","d":2,"type":"sata","s":"A nurse manager wants the unit to move beyond diversity in hiring toward genuine inclusion. Which strategies support inclusion? Select all that apply.","r":"Diversity is the presence of difference; inclusion means people feel respected, valued, and heard. Shared voice in decisions, prompt nonpunitive handling of microaggressions, and asking staff what helps them feel respected build inclusion. Using bilingual staff as default interpreters without verified competence is unsafe and burdensome, and a one-time training does not create an inclusive culture.","o":["Ask each new hire about workplace practices that would help them feel respected and valued","Rely on bilingual staff as interpreters for all patients to strengthen team diversity","Address microaggressions promptly using a clear, nonpunitive process","Ensure staff from all backgrounds have a real voice on unit councils and decision-making","Hold a one-time diversity training and consider the inclusion goal met"],"a":[0,2,3],"w":["Correct — individualizes belonging.","CLAS requires verified interpreter competence; this burdens staff and risks errors.","Correct — protects psychological safety.","Correct — shared decision-making voice.","Inclusion is ongoing practice, not a single training event."],"src":"Module 1 Study Guide §II–III (equality vs. equity; disparities = the problem, equity = the goal; SDOH); PCAP Module 1 — Giddens Health Disparities concept (unavoidable/avoidable × acceptable/unacceptable) · Final Exam Study Guide, Module 1 (SDOH, equity, prevention, HBM, care coordination, emergency response)"},{"id":"Z9-01","m":9,"lo":"9.2","t":"Regulation of nursing practice","cj":"Analyze Cues","d":2,"type":"cloze","s":"Case: A new graduate passes the NCLEX-RN and receives her Georgia license. A year later she earns CMSRN certification.","r":"State Boards of Nursing protect the public by enforcing the Nurse Practice Act, issuing licenses, and disciplining unsafe practitioners. The NCLEX measures entry-level competence; certifications such as CCRN, CEN, and CMSRN recognize specialty expertise.","tpl":"The NCLEX-RN is developed by {0}. Her legal scope of practice is defined by {1}. The CMSRN credential is {2}.","bl":[{"o":["the NCSBN","the ANA","The Joint Commission","her hospital"],"a":0,"w":"NCSBN develops the NCLEX; licensure is granted by the state."},{"o":["the Nurse Practice Act, enforced by the state BON","her employer’s job description and policies","the ANA Code of Ethics and its provisions","The Joint Commission’s National Patient Safety Goals"],"a":0,"w":"Each state’s NPA and BON define and regulate scope of practice."},{"o":["a voluntary credential showing specialty expertise","a multistate license under the compact","a credential that replaces her RN license in her specialty","required for all med-surg nurses by law"],"a":0,"w":"Certification is voluntary and does not replace licensure."}],"src":"PNC Modules 8–9 — Giddens Professional Identity concept; PNC Module 7 — Sources of Law and State Nurse Practice Act; Georgia Rule 410-12 · Final Exam Study Guide, Module 9 (licensure, BON/NPA, NCLEX/NLC, certification, ANA Code, Benner, lifelong learning)"},{"id":"M1-04","m":1,"lo":"1.2","t":"Equity vs. equality","cj":"Generate Solutions","d":1,"type":"mc","s":"A clinic has $12,000 to improve colorectal screening completion. Uptake is 72% in one ZIP code and 31% in a neighboring ZIP code with limited bus service and high uninsured rates. Which allocation best reflects health equity?","r":"Equity means matching resources to need so that outcomes become fair; equality gives everyone the same thing regardless of need. The lower-uptake community has identifiable access barriers (transport, insurance), so targeted resources address the cause of the disparity.","o":["Direct most funds to mobile screening, transportation vouchers, and navigation in the lower-uptake ZIP code","Spend the funds on a single advertising campaign covering both ZIP codes equally","Split the funds evenly between both ZIP codes so each community receives identical resources","Invest in the higher-uptake ZIP code because its programs have proven success"],"a":[0],"w":["Correct — resources matched to need and to the specific barriers.","An equal campaign ignores transportation and cost barriers.","Equal distribution is equality, not equity.","Rewards the advantaged community and widens the gap."],"src":"Module 1 Study Guide §II–III (equality vs. equity; disparities = the problem, equity = the goal; SDOH); PCAP Module 1 — Giddens Health Disparities concept (unavoidable/avoidable × acceptable/unacceptable) · Final Exam Study Guide, Module 1 (SDOH, equity, prevention, HBM, care coordination, emergency response)"},{"id":"M2-15","m":2,"lo":"2.3","t":"Staffing function — retention","cj":"Generate Solutions","d":3,"type":"sata","s":"A nurse manager’s unit has 28% first-year turnover. Exit interviews cite feeling unsupported, unpredictable schedules, and no voice in decisions. Which strategies are most likely to improve retention? Select all that apply.","r":"A structured transition-to-practice program and schedule control address the dissatisfiers named in exit interviews (feeling unsupported, unpredictable schedules). A real voice in decisions requires shared governance—not a suggestion box reviewed once a year. Repayable bonuses and extra overtime may keep people briefly but increase fatigue and burnout.","o":["Schedule new graduates for extra overtime so they gain experience faster","Install a suggestion box but review entries only at the annual retreat","Offer self-scheduling within unit guidelines","Offer sign-on bonuses that are repaid if a nurse leaves within 3 years","Establish a structured preceptor and nurse-residency program with protected time"],"a":[2,4],"w":["Fatigue worsens burnout, turnover, and safety.","Input that is never reviewed does not give staff a real voice.","Correct — gives control over schedules.","Retains people temporarily but does not fix the dissatisfiers named in exit interviews.","Correct — supports transition to practice."],"src":"PCAP Module 2 — Management Functions (planning, organizing, staffing, directing, controlling); Change Agent (Lewin’s rules and stages) · Final Exam Study Guide, Module 2 (leader vs. manager, leadership theories, prioritization, 5 rights, EAT)"},{"id":"G-41","m":8,"lo":"8.6","t":"AI recommendation outside scope","cj":"Take Action","d":3,"type":"mc","s":"An AI tool in the EHR recommends doubling a patient’s scheduled metoprolol because of a rising heart rate trend. There is no new order. What should the nurse do?","r":"AI is a decision-support tool, not a prescriber. A nurse who follows an AI suggestion to change a medication without an order acts outside the scope of practice and could be practicing medicine without a license—the licensed clinician remains accountable. The safe path is assess, follow the existing order, and communicate the trend to the provider (SBAR).","o":["Give the ordered dose and document that the AI suggested more","Assess, give only the ordered dose, and call the provider","Hold all doses until the AI recommendation is reviewed","Give the doubled dose, because the AI used current vital-sign data"],"a":[1],"w":["Ignores the concerning trend; it still needs assessment and escalation.","Correct — AI informs judgment; it cannot create an order.","Holding without assessment or an order may cause harm.","Changing a dose without an order is practicing outside nursing scope."],"src":"PNC Modules 8–9 — Health IT concept and IT in the Clinical Setting (clinical decision support, technology and judgment) · Final Exam Study Guide, Module 8 (HIT, AI applications, benefits/risks, ethical and legal concerns)"},{"id":"G-17","m":7,"lo":"7.5","t":"EMTALA screening","cj":"Take Action","d":1,"type":"mc","s":"A patient arrives at a Medicare-participating hospital’s emergency department requesting evaluation and says he cannot pay. Which action does EMTALA require?","r":"EMTALA (the “anti-dumping” law) applies to Medicare-participating hospitals with EDs: anyone who requests emergency evaluation gets an appropriate medical screening exam; if an emergency medical condition (including active labor) exists, the hospital stabilizes it within its capability or makes an appropriate transfer. Payment questions can never delay screening or stabilization.","sg":"Final Study Guide & Practice — practice Q17","o":["Refer him to the free clinic if his vital signs are stable","Transfer him to the county hospital once triage confirms he is uninsured","Verify insurance at registration, then begin the screening exam","Provide a medical screening exam without delaying for payment questions"],"a":[3],"w":["Skipping the screening exam violates EMTALA.","Transfer for financial reasons is patient dumping.","Payment inquiry cannot delay screening.","Correct — screening first, regardless of ability to pay."],"src":"Final Study Guide & Practice — practice Q17 · PNC Module 7 — HIPAA and social media, EMTALA, ADA, CLAS language-access standards; Health Care Law Worksheet and Answer Sheet · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"M5-04","m":5,"lo":"5.2","t":"Swiss Cheese Model","cj":"Analyze Cues","d":2,"type":"mc","s":"A wrong-site surgery occurred after a first-day circulating nurse, a consent form listing the incorrect site, a wristband used instead of site marking, a broken video interpreter, and an unverified health record. What does the Swiss Cheese Model teach about this event?","r":"The Swiss Cheese Model shows that each layer (education, training, policy, technology, communication, checklist) has holes. Harm occurs when holes align. The lesson is redundancy, identifying weaknesses, understanding human factors, and a systemic approach—not single-person blame.","o":["Weaknesses in several defensive layers aligned, allowing the hazard through","Adding one more checklist step will reliably prevent recurrence","The first-day circulating nurse is the root cause and should be retrained","The surgeon is solely responsible, because he made the incision and has final authority in the OR"],"a":[0],"w":["Correct — aligned holes in multiple layers.","A single added layer can also fail; the model calls for strengthening multiple redundant layers.","Inexperience was one hole; blaming one person ignores the other failed layers.","Ignores the system failures that allowed the error."],"src":"Module 5 slides — Swiss Cheese Model wrong-site surgery example (first day on the job, consent error, wristband instead of site marking, interpreter down) · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"M2-18","m":2,"lo":"2.6","t":"Priority setting under constraints","cj":"Take Action","d":3,"type":"sata","s":"A charge nurse learns a UAP called out, leaving one UAP for 24 patients. Which actions should the charge nurse take to maintain safety? Select all that apply.","r":"The charge nurse escalates resource needs through the chain of command, reprioritizes UAP tasks by risk, and communicates the revised plan in a huddle so the team shares a mental model. Blanket reductions in assessment frequency compromise safety, and documentation must reflect who actually performed care.","o":["Reprioritize UAP tasks toward high-fall-risk patients and essential hygiene","Allow UAPs to chart care given by other staff to save time","Brief the team in a quick huddle on revised assignments and who to ask for help","Ask RNs to extend reassessments from every 4 hours to every 8 hours for all patients","Notify the house supervisor to request additional staff or reallocation"],"a":[0,2,4],"w":["Correct — risk-based prioritization.","Documentation must reflect who actually performed care.","Correct — shared mental model of the new plan.","Blanket reduction in assessments compromises safety; prioritize by risk instead.","Correct — escalates through the chain of command."],"src":"Module 1 Study Guide — NGN Clinical Judgment Framework (six CJMM steps); PCAP Module 2 learning outcome 5 (clinical judgment model) · Final Exam Study Guide, Module 2 (leader vs. manager, leadership theories, prioritization, 5 rights, EAT)"},{"id":"N5-01","m":5,"lo":"5.6","t":"PDSA cycle","cj":"Evaluate Outcomes","d":1,"type":"mc","s":"A unit tested a new bedside “call, don’t fall” sign on 10 high-risk patients for 2 weeks. The team is now comparing fall and near-fall counts with the prior month and interviewing patients about the sign. Which PDSA phase are they in?","r":"PDSA = Plan (identify the change and prediction), Do (test it on a small scale), Study (analyze data and compare results with predictions), Act (adopt, adapt, or abandon the change). Comparing results and gathering feedback after the test is the Study phase.","o":["Plan","Do","Act","Study"],"a":[3],"w":["Planning occurred before the test.","The 2-week test was the Do phase.","Act comes next: adopt, adapt, or abandon.","Correct — analyzing results of the test."],"src":"Econ/Quality Answer Key (STEEEP; Triple Aim; Donabedian; QSEN safety); PCAP Module 3 — NDNQI, QSEN, High Reliability Organizations · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"G-40","m":6,"lo":"6.6","t":"Workplace violence — de-escalation","cj":"Take Action","d":2,"type":"mc","s":"A visitor in a patient room is shouting, pacing, and clenching his fists while blocking the doorway. What is the nurse’s priority action?","r":"Warning signs of violence include shouting, pacing, clenched fists, and blocking exits. Priorities: keep an exit route and a safe distance, call for help (security per policy), and use calm, nonthreatening de-escalation only when it is safe. Afterward, report the event and support affected staff. Violence is never “part of the job”—zero tolerance and immediate reporting.","o":["Step closer and calmly explain the hospital’s visitor rules","Keep an exit path, stay out of reach, and call for security","Leave the room and finish documentation before calling anyone","Ask the visitor to sit and fill out a complaint form"],"a":[1],"w":["Moving closer reduces safe distance and may escalate him.","Correct — personal safety and help first, then de-escalation.","Leaves the patient at risk and delays help.","Paperwork does not address an immediate threat."],"src":"PCAP Module 3 — Workforce Advocacy: Safe Staffing, Box 13.3 (questions before employment), Box 13.5 (questions before accepting an assignment), Floating and Mandatory Overtime; PNC Module 7 — Floating and Cross-Training (Winkelman; Francis); PCAP Module 3 — Workplace Safety (violence, fatigue) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"M6-18","m":6,"lo":"6.2","t":"Closed-loop critical results","cj":"Take Action","d":2,"type":"mc","s":"The lab calls a nurse with a critical potassium of 6.8 mEq/L. Which action best reflects safe closed-loop communication?","r":"Critical results require read-back to the caller to confirm accuracy, immediate notification of the provider, and read-back of verbal orders—closing every loop. Delays or indirect relay increase the risk of a lethal dysrhythmia.","o":["Assume the provider will see the critical value in the EHR, since results post automatically","Document the value and recheck it with the morning labs","Read back, then notify the provider using SBAR","Ask the unit secretary to page the provider"],"a":[2],"w":["Passive; the result may not be seen in time.","Delays treatment of a life-threatening value.","Correct — closed loop at every step.","Indirect relay creates loss of information."],"src":"Module 6 slides — SBAR, Call-Out, Check-Back, Teach-Back, Handoff; Boot Camp §11 (read-back for critical messages) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"M1-23","m":1,"lo":"1.5","t":"Population health data","cj":"Recognize Cues","d":3,"type":"sata","s":"A nurse coalition reviews county data to choose its next population health priority. Which findings indicate a population-level problem amenable to a community intervention? Select all that apply.","r":"Population health looks at outcomes and their distribution across groups. Low immunization in one district, clustered asthma ED use near a pollution source, and pedestrian deaths concentrated at specific intersections are group-level patterns that community interventions (school clinics, environmental advocacy, infrastructure policy) can change.","o":["One patient in the clinic had an allergic reaction to a new antihypertensive","Pedestrian fatalities have tripled at three intersections lacking crosswalks","Childhood immunization completion is 61% in one school district versus 92% statewide","Emergency department visits for asthma are 3 times higher in census tracts next to the interstate","The hospital’s inpatient census rose 4% this quarter"],"a":[1,2,3],"w":["An individual adverse drug event.","Correct — a built-environment problem suited to policy advocacy.","Correct — a population gap suited to a school-based campaign.","Correct — geographic clustering suggests an environmental determinant.","A utilization trend, not a population health problem suited to community intervention."],"src":"Module 1 Study Guide §VII–VIII (population vs. individual focus; public health campaigns and indicators of success) · Final Exam Study Guide, Module 1 (SDOH, equity, prevention, HBM, care coordination, emergency response)"},{"id":"M6-12","m":6,"lo":"6.4","t":"Two-challenge rule","cj":"Take Action","d":3,"type":"mc","s":"During a central line insertion, a nurse sees the physician’s glove touch a nonsterile surface. She states her concern; the physician ignores it. She repeats it a second time and is again ignored. What should the nurse do next according to the two-challenge rule?","r":"The two-challenge rule empowers any team member to “stop the line” when an essential safety breach exists. Voice the concern at least twice; if it is still ignored, take stronger action and escalate through the chain of command.","o":["Document the break in sterile technique in the chart after the procedure is completed","Allow the procedure to continue to avoid conflict","Stop the line and escalate","Complete an incident report immediately and let the procedure continue"],"a":[2],"w":["Too late to prevent a CLABSI risk.","Allows a known safety breach to continue.","Correct — stop the line and escalate.","Reporting comes later; the two-challenge rule calls for stopping the line now."],"src":"Module 6 slides — Mutual Support (task assistance, formative feedback, advocacy and assertion, two-challenge rule, CUS, DESC) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"N2-02","m":2,"lo":"2.6","t":"Maslow prioritization","cj":"Prioritize Hypotheses","d":3,"type":"mc","s":"A nurse is caring for a stable patient with newly diagnosed diabetes. During the shift the patient (1) requests a chaplain visit, (2) says she feels lonely, (3) is anxious about losing her job, and (4) has not urinated in 9 hours and has a distended lower abdomen. Using Maslow’s hierarchy, which need should the nurse address first?","r":"Maslow’s hierarchy places physiological needs (elimination, oxygenation, nutrition) before safety, love/belonging, esteem, and self-actualization. Possible urinary retention is a physiological problem that needs assessment and intervention first; the others are important and should be addressed afterward.","o":["The chaplain request, because spiritual needs affect coping","The urinary retention, because it is a physiological need","The job anxiety, because financial stress can prevent adherence","The loneliness, because belonging supports recovery"],"a":[1],"w":["Spiritual needs are important but not first.","Correct — a physiological need comes first.","Safety/security needs come after physiological needs.","Love/belonging comes after physiological needs."],"src":"Module 1 Study Guide — NGN Clinical Judgment Framework (six CJMM steps); PCAP Module 2 learning outcome 5 (clinical judgment model) · Final Exam Study Guide, Module 2 (leader vs. manager, leadership theories, prioritization, 5 rights, EAT)"},{"id":"M7-03","m":7,"lo":"7.2","t":"Negligence analysis","cj":"Evaluate Outcomes","d":3,"type":"mc","s":"A nurse gives a patient acetaminophen 1,000 mg instead of the ordered 650 mg. The patient has normal liver function, the daily total remains within safe limits, and no harm occurs. The patient later learns of the error and wants to sue for malpractice. Which statement is most accurate?","r":"All five elements of malpractice—duty, breach of duty, foreseeability, causation, and damages—must be proven. Without injury there are no damages, so a malpractice claim is unlikely to succeed. Ethically and per policy, the error must still be reported for system learning and disclosed to the patient.","o":["Unlikely to succeed without damages, though the error must still be disclosed","The claim depends only on whether the nurse followed hospital policy","The claim will likely succeed, because a breach of the standard of care clearly occurred here","The claim will succeed because the nurse admitted the error"],"a":[0],"w":["Correct — no damages; still report and disclose.","Policy relates to breach; all five elements, including damages, are required.","A breach alone is insufficient without damages.","An admission does not supply the missing damages element."],"src":"PNC Module 7 legal chapter — elements of negligence/malpractice, res ipsa loquitur, gross and criminal negligence, Good Samaritan immunity, vicarious liability (respondeat superior); Health Care Law Worksheet · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"Z7-03","m":7,"lo":"7.5","t":"EMTALA obligations","cj":"Take Action","d":2,"type":"cloze","s":"Case: An uninsured woman in active labor arrives at a Medicare-participating hospital’s ED. Registration asks whether she should be sent to the county hospital 15 miles away.","r":"EMTALA (the anti-dumping law) applies to Medicare-participating hospitals with EDs: provide a medical screening exam and stabilizing treatment for emergency conditions, including active labor, regardless of insurance, and transfer only when appropriate. Payment inquiries cannot delay screening.","tpl":"Under EMTALA, the hospital must provide {0}, and it must {1}. Transferring her before stabilization solely because she is uninsured would be {2}.","bl":[{"o":["a medical screening examination","a financial screening interview","a referral to a free clinic","a payment plan"],"a":0,"w":"EMTALA requires a medical screening exam for anyone requesting emergency evaluation."},{"o":["transfer her as soon as insurance is verified","stabilize her condition regardless of ability to pay","discharge her home if labor is in an early stage","collect a deposit before providing stabilizing care"],"a":1,"w":"Stabilization cannot be conditioned on payment; active labor is an emergency condition."},{"o":["a HIPAA violation","an advance directive","appropriate transfer","patient dumping"],"a":3,"w":"Transfer for financial reasons before stabilization is patient dumping."}],"src":"PNC Module 7 — HIPAA and social media, EMTALA, ADA, CLAS language-access standards; Health Care Law Worksheet and Answer Sheet · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"N3-03","m":3,"lo":"3.6","t":"Political action committees","cj":"Analyze Cues","d":2,"type":"mc","s":"A nurse says she is too busy to meet legislators but wants her profession to have more influence on which candidates are elected. Which option best matches her goal?","r":"Political action committees pool member contributions to support candidates who back the profession’s policy goals—one of the macro-level advocacy options in the course guide, alongside voting, contacting legislators, testimony, and joining professional organizations. Incident reports are internal tools, and health fairs are health promotion, not political advocacy.","o":["Filing an incident report each time her unit is short-staffed","Posting her opinions about candidates on the hospital’s internal message board","Volunteering at a community blood-pressure screening event","Contributing to her professional association’s political action committee (PAC)"],"a":[3],"w":["An internal safety tool, not political advocacy.","Using employer channels for campaign opinions is inappropriate and not effective advocacy.","Community health promotion rather than political advocacy.","Correct — collective political influence through a PAC."],"src":"PCAP Module 3 — Grassroots Political Strategies (visit policymakers; join professional organizations; how to address legislators) · Final Exam Study Guide, Module 3 (health policy, micro vs. macro advocacy, evidence-informed recommendations)"},{"id":"G-27","m":5,"lo":"5.5","t":"Purpose of RCA","cj":"Evaluate Outcomes","d":1,"type":"mc","s":"During an RCA after a wrong-site procedure, the team learns the time-out was rushed because two emergencies arrived at once and the site marking faded during skin prep. What is the primary purpose of this RCA?","r":"An RCA is a structured, retrospective, non-punitive investigation after a sentinel or adverse event. It asks “why” repeatedly to reach system causes (here: competing emergencies, fading marker, rushed time-out) and produces countermeasures that are tracked over time. It is never a search for someone to blame.","sg":"PCAP Study Guide — practice Q7","o":["Find system weaknesses and redesign processes to prevent recurrence","Determine which team member’s license should be reported to the Board","Calculate the CMS payment penalty for the never event","Document findings in the patient’s chart to protect the hospital in litigation"],"a":[0],"w":["Correct — a non-punitive search for system causes.","RCA is not a disciplinary process.","Finance is not the purpose of an RCA.","RCA work products are confidential quality documents, not chart entries."],"src":"PCAP Study Guide — practice Q7 · Module 5 slides — Root Cause Analysis (common mistakes; “human error is rarely the root cause”), 5 Whys fall example, Fishbone categories, Countermeasures vs. Solutions · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"M2-19","m":2,"lo":"2.3","t":"Resource manager role","cj":"Generate Solutions","d":2,"type":"mc","s":"Supply costs on a surgical unit are 18% over budget. A staff nurse notices that full dressing kits are opened when only gauze is needed. Which action best reflects the staff nurse’s role as resource manager?","r":"Staff nurses manage resources by minimizing waste while maintaining quality. Bringing a specific observation and a practical solution to shared governance balances stewardship and safety.","o":["Keep using full kits, because standardized kits reduce infection risk regardless of need","Stop using dressing kits altogether on the unit, even for complex surgical wounds, until supply spending is back within budget","Ask central supply to restock kits more often so the unit never runs short","Share the observation at the unit council and propose stocking individual gauze packs at the bedside"],"a":[3],"w":["Standardization has value, but opening full kits when only gauze is needed is waste without a safety benefit.","Compromises care for complex wounds.","Addresses availability, not waste; spending rises further.","Correct — practical, staff-driven waste reduction."],"src":"PCAP Module 2 — Management Functions (planning, organizing, staffing, directing, controlling); Change Agent (Lewin’s rules and stages) · Final Exam Study Guide, Module 2 (leader vs. manager, leadership theories, prioritization, 5 rights, EAT)"},{"id":"G-39","m":6,"lo":"6.6","t":"LPN scope","cj":"Take Action","d":2,"type":"sata","s":"An RN is assigning an LPN to stable patients. Which tasks are generally within LPN scope? Select all that apply.","r":"LPNs care for stable patients with predictable outcomes: oral, IM, and subcut medications; sterile dressing changes; urinary catheterization; data collection; and reinforcing teaching. Generally excluded (varies by state): IV push, blood products, initial or comprehensive assessment, care planning, initial teaching, evaluation, and unstable patients.","o":["Reinforcing the RN’s teaching about a low-sodium diet","A sterile dressing change on a healing surgical wound","Hanging the first unit of packed red blood cells","Completing the admission assessment and care plan","Giving IV push furosemide","Inserting an indwelling urinary catheter"],"a":[0,1,5],"w":["Correct — LPNs reinforce teaching; the RN does initial teaching.","Correct — sterile dressings are within LPN scope.","Blood products are generally not LPN tasks.","Initial assessment and care planning are RN functions.","IV push medications are generally outside LPN scope.","Correct — urinary catheterization is an LPN skill."],"src":"PCAP Module 3 — Workforce Advocacy: Safe Staffing, Box 13.3 (questions before employment), Box 13.5 (questions before accepting an assignment), Floating and Mandatory Overtime; PNC Module 7 — Floating and Cross-Training (Winkelman; Francis); PCAP Module 3 — Workplace Safety (violence, fatigue) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"M1-17","m":1,"lo":"1.6","t":"Disaster triage","cj":"Prioritize Hypotheses","d":3,"type":"mc","s":"During a mass-casualty incident that has overwhelmed local resources, four victims arrive at the casualty collection point. Using disaster triage principles, which victim should receive treatment first?","r":"Disaster triage aims to do the greatest good for the greatest number. The victim with tachypnea, poor perfusion, and altered mental status has a life-threatening but potentially survivable injury (immediate/red). The femur fracture is delayed (yellow), the walking victim is minor (green), and the 90% burn with agonal breathing is expectant given scarce resources.","o":["A victim with a laceration to the forearm who is walking and assisting others","A victim with RR 34, delayed capillary refill, and confusion after a chest wound","A victim with burns over 90% of the body surface area, agonal respirations, and no radial pulse","A victim with an open femur fracture, RR 24, and a strong radial pulse, who follows commands but is in severe pain"],"a":[1],"w":["Walking wounded = minor (green).","Correct — immediate (red): salvageable with prompt intervention.","Unsurvivable with current resources = expectant; routine triage would treat this patient first, disaster triage does not.","Serious, but stable vitals and following commands make this delayed (yellow)."],"src":"PCAP Module 1 — Emergency Preparedness (disaster triage differs from routine triage); Module 1 Study Guide §IX (greatest good for the greatest number) · Final Exam Study Guide, Module 1 (SDOH, equity, prevention, HBM, care coordination, emergency response)"},{"id":"K-10","m":7,"lo":"7.6","t":"Georgia Board reporting duty","cj":"Analyze Cues","d":3,"type":"mc","s":"A Georgia hospital removes an RN from patient care after an investigation supports impairment and opioid diversion. The RN, Jordan, resigns before the hospital can terminate him. Reed, the coworker who first raised the concern, asks whether she must also report. Under Georgia Rule 410-12, which statement is accurate?","r":"Employers must report nurses terminated, or who resign to avoid termination, for reportable grounds such as impairment. Individual nurses must report with reasonable cause but are not required to duplicate a report already made. Impairment affecting practice is not a minor incident.","o":["Reporting is optional because this was a minor incident","Reed must file her own report regardless of the employer’s report","The employer must report; Reed need not duplicate it","No Board report is required, because Jordan resigned voluntarily before the hospital could terminate him"],"a":[2],"w":["Impairment is a listed ground and poses ongoing risk.","No duplicate report is required when she has reasonable cause to believe one was made.","Correct — employer duty and the no-duplication provision.","Resignation to avoid termination is specifically reportable."],"src":"Georgia Rule 410-12-.01(1)(a) and (2) (employer reporting of termination or resignation to avoid termination; no duplicate reports) · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"M5-22","m":5,"lo":"5.7","t":"Patient engagement","cj":"Generate Solutions","d":2,"type":"sata","s":"Which strategies engage patients and families as partners in safety? Select all that apply.","r":"Patient engagement includes speak-up programs (hand hygiene), bedside shift report that includes the patient, family-activated escalation, and medication education. The Mayo Clinic survey cited in class showed most discharged patients could not list their medications—so withholding the list until discharge or holding report away from the bedside works against engagement.","o":["Conducting bedside shift report that includes the patient","Giving patients a medication list only at discharge to avoid confusion during the stay","Conducting shift report at the nurses’ station so patients can rest","Inviting patients to ask staff whether they have cleaned their hands","Encouraging family to speak up if they notice a change in the patient’s condition"],"a":[0,3,4],"w":["Correct — the patient can correct information.","Patients should know their medications throughout the stay to help catch errors.","Bedside report that includes the patient engages them in safety.","Correct — empowers patients to speak up.","Correct — family-activated escalation."],"src":"Module 5 slides — Most Common Medication Errors; Common Preventable In-Patient Safety Risks (HAIs, falls, failure to rescue); Patient Engagement; Comprehensive Guide to Healthcare Quality & Patient Safety · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"Z1-01","m":1,"lo":"1.2","t":"SDOH — Healthy People 2030 domains","cj":"Analyze Cues","d":2,"type":"cloze","s":"Case: A 58-year-old with type 2 diabetes misses clinic visits. He was evicted last month and is staying with a cousin, the nearest grocery store is 6 miles away with no sidewalks or bus line, and he lost his insurance when his hours were cut.","r":"Healthy People 2030 groups SDOH into five domains: Economic Stability, Education Access and Quality, Health Care Access and Quality, Neighborhood and Built Environment, and Social and Community Context. Naming the domain helps match the intervention—housing and income resources, transportation or mobile services, and coverage enrollment.","tpl":"The eviction and lost work hours fall under the {0} domain; the lack of sidewalks, transit, and nearby groceries falls under {1}; and the loss of insurance falls under {2}.","bl":[{"o":["Social and Community Context","Education Access and Quality","Economic Stability","Health Care Access and Quality"],"a":2,"w":"Housing instability and income loss are Economic Stability factors."},{"o":["Health Care Access and Quality","Neighborhood and Built Environment","Economic Stability","Social and Community Context"],"a":1,"w":"Transportation, walkability, and food access are Neighborhood and Built Environment factors."},{"o":["Economic Stability","Education Access and Quality","Neighborhood and Built Environment","Health Care Access and Quality"],"a":3,"w":"Insurance coverage is part of Health Care Access and Quality."}],"src":"Module 1 Study Guide §II–III (equality vs. equity; disparities = the problem, equity = the goal; SDOH); PCAP Module 1 — Giddens Health Disparities concept (unavoidable/avoidable × acceptable/unacceptable) · Final Exam Study Guide, Module 1 (SDOH, equity, prevention, HBM, care coordination, emergency response)"},{"id":"K-07","m":5,"lo":"5.1","t":"Classifying a fall with serious injury","cj":"Analyze Cues","d":2,"type":"mc","s":"An 82-year-old, post-op day 2 after hip hemiarthroplasty with a Morse Fall Scale score of 65, is found on her bathroom floor at 0310. Her bed alarm was off and the call light was out of reach. CT later shows a subdural hematoma requiring emergency neurosurgery. How should this event be classified?","r":"A sentinel event is an unexpected event leading to death or severe physical or psychological harm and requires immediate investigation. A fall resulting in an injury that requires neurosurgery meets this threshold.","o":["Adverse event that does not meet sentinel criteria","Near miss","Sentinel event requiring immediate investigation","Not reportable, because falls are expected in high-risk patients"],"a":[2],"w":["The severity exceeds a general adverse event.","The event reached the patient and caused harm.","Correct — severe harm requiring immediate investigation.","High risk does not make injurious falls acceptable or unreportable."],"src":"Module 5 Quality & Safety slides — “Terms to Know” (near miss, adverse, sentinel, never event); Healthcare Quality & Safety Review Worksheet and Answer Key · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"Z8-03","m":8,"lo":"8.4","t":"HIPAA and technology","cj":"Take Action","d":3,"type":"cloze","s":"Case: A nurse on the cardiac unit learns that a local celebrity was admitted to oncology. Later, a coworker asks her to log in under her own credentials so he can chart quickly.","r":"HIPAA protects PHI: access only on a need-to-know basis, use the minimum necessary, never discuss patients in public spaces, and never access charts of patients outside your care. Technical access is not permission, and shared logins undermine safeguards.","tpl":"Looking up the celebrity’s chart would violate the {0} standard, and EHR {1} would record the access. Sharing her login is unsafe because it {2}.","bl":[{"o":["need-to-know/minimum necessary","EMTALA screening requirement","fidelity principle","informed consent requirement"],"a":0,"w":"PHI is accessed only for direct care, billing, or operations."},{"o":["audit trails","clinical decision support","CPOE","portals"],"a":0,"w":"Audit trails log who accessed which record and when."},{"o":["keeps the data encrypted in transit","speeds up documentation safely","defeats access control and accountability","is allowed during staffing shortages"],"a":2,"w":"Unique credentials are a core HIPAA safeguard."}],"src":"PNC Modules 8–9 — EHR Security (access control, encryption, audit trails, breach notification >500); EHRs and HIPAA · Final Exam Study Guide, Module 8 (HIT, AI applications, benefits/risks, ethical and legal concerns)"},{"id":"G-46","m":2,"lo":"2.1","t":"Manager vs. leader","cj":"Analyze Cues","d":1,"type":"mc","s":"Which description best fits the leader role rather than the manager role?","r":"Managers hold an assigned position and focus on systems, budgets, staffing, policies, and stability—“doing things right.” Leaders may or may not have a title and focus on vision, inspiration, empowerment, and change—“doing the right things.” Effective nurses use both.","o":["Inspires peers to adopt a safety practice without a formal title","Builds the schedule, approves time-off requests, and monitors the budget","Enforces policies to keep daily operations stable","Is assigned to the position by the organization and holds formal authority"],"a":[0],"w":["Correct — influence and vision; no title required.","Coordinating staffing and budgets is management.","Maintaining stability and compliance is management.","Formal, assigned authority defines a manager."],"src":"PCAP Module 2 — Nursing Leadership and Management: Leadership vs. Management; Power and Authority; Formal and Informal Leadership · Final Exam Study Guide, Module 2 (leader vs. manager, leadership theories, prioritization, 5 rights, EAT)"},{"id":"M8-01","m":9,"lo":"9.1","t":"Professional identity domains","cj":"Recognize Cues","d":2,"type":"mc","s":"A new nurse tells her patient she will return in 30 minutes with pain medication. When a rapid response delays her, she asks a colleague to tell the patient, then returns as soon as she can and apologizes. Which professional-identity value does this most clearly demonstrate?","r":"In the Giddens professional identity concept, integrity is demonstrated by actions such as returning to check on a patient when you said you would—aligning actions with commitments. This falls within the values-and-ethics domain.","o":["Humility","Courage","Advocacy","Integrity"],"a":[3],"w":["Humility involves acknowledging limits and learning from others.","Courage involves acting despite risk or fear.","Advocacy involves speaking up for patient rights or needs.","Correct — keeping one’s word aligns action with values."],"src":"PNC Modules 8–9 — Giddens Professional Identity concept (four domains; integrity, courage, humility, advocacy exemplars) · Final Exam Study Guide, Module 9 (licensure, BON/NPA, NCLEX/NLC, certification, ANA Code, Benner, lifelong learning)"},{"id":"M4-06","m":4,"lo":"4.2","t":"Medicaid","cj":"Take Action","d":2,"type":"mc","s":"A 3-year-old covered by Medicaid is discharged after an asthma exacerbation with a new controller inhaler and a spacer. Which nursing action best supports affordable access to the new regimen?","r":"Medicaid is jointly funded and administered by each state, so coverage and formularies vary. The nurse’s role is to ensure the family can access the medication by confirming formulary status to avoid unexpected costs or a gap in therapy.","o":["Ask the provider to switch to a cheaper over-the-counter inhaler before discharge","Verify that the inhaler is on the state Medicaid formulary before discharge","Tell the parent that Medicaid always pays for any medication a provider prescribes, including brand-name drugs","Tell the parent to call Medicaid if the pharmacy rejects the prescription after discharge"],"a":[1],"w":["No OTC controller is equivalent; confirm formulary coverage rather than changing therapy.","Correct — prevents a coverage gap at discharge.","Coverage varies by state formulary.","Reactive; a rejected claim delays a controller medication for a child just treated for an exacerbation."],"src":"Module 4 slides — Medicare Parts A–D and Medigap, Medicaid/CHIP, ACA provisions, Case Studies 1, 2 & 5; Health Care Law Worksheet — EMTALA and ACA · Final Exam Study Guide, Module 4 (Medicare A–D, Medicaid, HMO/PPO/EPO, stewardship, value-based care)"},{"id":"M8-20","m":8,"lo":"8.2","t":"EHR documentation integrity","cj":"Evaluate Outcomes","d":3,"type":"mc","s":"A nurse copies forward yesterday’s neuro assessment into today’s note to save time. Today the patient has new left-arm weakness that is not reflected in the note. What is the primary concern?","r":"EHR data integrity depends on accurate, current entries. Copy-forward without verification creates false records, impairs communication across the team, can delay recognition of deterioration, and has legal implications. Documentation must reflect the actual assessment.","o":["It is acceptable if the nurse adds an addendum about the weakness at shift end","It is acceptable, because the copy-forward template was approved by the informatics committee","Inaccurate data could delay stroke recognition","The concern is only with billing compliance"],"a":[2],"w":["Delayed correction leaves inaccurate data in the record during a time-sensitive stroke window.","Template approval does not make inaccurate data acceptable.","Correct — patient safety and record accuracy.","The primary concern is patient safety and accuracy."],"src":"PNC Modules 8–9 — Information Technology in the Clinical Setting: Clinical Decision Support (alert fatigue), CPOE, EHR data management · Final Exam Study Guide, Module 8 (HIT, AI applications, benefits/risks, ethical and legal concerns)"},{"id":"G-37","m":5,"lo":"5.6","t":"Nurse-sensitive indicators (NDNQI)","cj":"Recognize Cues","d":2,"type":"sata","s":"A quality nurse is building a unit dashboard of nurse-sensitive indicators tracked by NDNQI. Which measures belong on it? Select all that apply.","r":"Nurse-sensitive indicators reflect the structure, process, and outcomes of nursing care. NDNQI tracks measures such as falls and falls with injury, pressure injuries, CAUTI, CLABSI, VAP, restraint use, nursing hours per patient day, skill mix, and RN satisfaction. Many are also hospital-acquired conditions that CMS will not pay extra for—so they affect both safety and reimbursement.","o":["Surgeon-specific wound infection rates","Average hospital charges per admission","CAUTI and CLABSI rates","Hospital-acquired pressure injuries","Patient falls with injury","Nursing hours per patient day"],"a":[2,3,4,5],"w":["Driven mainly by surgical, not nursing, care.","A financial measure, not nurse-sensitive quality.","Correct — nurse-sensitive infections tied to device care.","Correct — strongly influenced by nursing care.","Correct — a classic nurse-sensitive outcome.","Correct — a structure measure of nurse staffing."],"src":"Econ/Quality Answer Key (STEEEP; Triple Aim; Donabedian; QSEN safety); PCAP Module 3 — NDNQI, QSEN, High Reliability Organizations · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"M1-01","m":1,"lo":"1.1","t":"Interpreters & language access","cj":"Take Action","d":2,"type":"mc","s":"A nurse is preparing to discuss a new insulin regimen with a 58-year-old Haitian Creole–speaking patient. The patient’s 15-year-old grandson, who speaks English fluently, offers to translate so the session can start right away. The video interpreter service has a 20-minute wait. Which action is most appropriate?","r":"Consequential teaching such as insulin dosing requires a qualified medical interpreter. Family members—especially minors—may omit, filter, or mistranslate clinical terms, and CLAS standards say family should interpret only at the patient’s own request. A 20-minute delay is a safer trade-off than a dosing error.","o":["Wait for the qualified medical interpreter, using the 20 minutes to gather supplies and prepare the teaching plan","Accept the grandson’s offer, since he is fluent in both languages, the patient appears comfortable with him, and teaching can begin without delay","Provide a printed insulin guide in Haitian Creole and ask the patient to call with questions after discharge","Teach the regimen in English using demonstration and gestures, then ask the patient to nod to confirm understanding"],"a":[0],"w":["Correct — uses a qualified interpreter and productively uses the wait.","Convenience does not outweigh accuracy; a minor is not a qualified medical interpreter for high-risk teaching.","Written material alone does not verify understanding and shifts the burden to the patient after discharge.","Nodding is not evidence of comprehension; teach-back through an interpreter is required."],"src":"PCAP Module 1 Book Chapters — Cultural Competence chapter (Giger & Haddad’s six cultural phenomena; skilled interpreter mandatory); Module 1 Study Guide §I (cultural humility; professional interpreters over family) · Final Exam Study Guide, Module 1 (SDOH, equity, prevention, HBM, care coordination, emergency response)"},{"id":"M4-09","m":4,"lo":"4.3","t":"DRG incentives","cj":"Analyze Cues","d":2,"type":"mc","s":"A hospital receives a fixed DRG payment of $9,800 for a patient with uncomplicated pneumonia. The patient develops a catheter-associated UTI and stays 3 extra days. How does this affect the hospital financially?","r":"Under DRG prospective payment, the hospital receives a predetermined amount per diagnosis regardless of actual resource use. CAUTI is a hospital-acquired condition that Medicare will not pay extra for, so the hospital absorbs the cost—creating an incentive to prevent complications.","o":["The hospital receives more money because the length of stay increased","Payment is unchanged, so the hospital absorbs the cost of the extra days","Payment increases only if the physician documents the CAUTI as a secondary diagnosis","Medicare pays an additional per diem amount for each extra day the patient remains hospitalized"],"a":[1],"w":["Under DRGs, longer stays do not increase payment.","Correct — fixed payment; the HAC is not reimbursed.","HACs such as CAUTI do not raise the DRG payment even when documented.","Per diem is a different methodology; HACs are not paid."],"src":"Module 4 slides — DRG reimbursement, per diem rates, value-based purchasing, HACs and readmission penalties; PCAP Module 4 — Paying for Health Care (DRGs, managed care, capitation) · Final Exam Study Guide, Module 4 (Medicare A–D, Medicaid, HMO/PPO/EPO, stewardship, value-based care)"},{"id":"G-08","m":5,"lo":"5.3","t":"Error reaches patient — first action","cj":"Take Action","d":2,"type":"mc","s":"A medication error reaches a patient but causes no apparent harm. What should the nurse do first?","r":"Sequence after any error: (1) assess and protect the patient; (2) notify the provider; (3) document objective clinical facts and the patient’s response in the record; (4) file an incident report through the safety system. The incident report is a confidential quality document—it is never mentioned in the chart. No-harm events are still reported because they reveal system weaknesses.","sg":"Final Study Guide & Practice — practice Q8","o":["Monitor the patient closely for an hour and file a report only if symptoms develop","Complete the incident report immediately while the details are fresh","Document in the progress note that an incident report was filed","Assess the patient, take any needed safety actions, and notify the provider"],"a":[3],"w":["No-harm errors must still be reported; delay risks missing harm.","Reporting is required, but the patient’s condition comes first.","Never chart that an incident report was filed.","Correct — patient safety first, then notification and reporting per policy."],"src":"Final Study Guide & Practice — practice Q8 · Module 5 slides — Incident Reporting (purpose; what to include; objective facts only; do not document the report in the chart) · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"M4-08","m":4,"lo":"4.2","t":"ACA provisions","cj":"Analyze Cues","d":3,"type":"sata","s":"Which provisions are part of the Affordable Care Act, as presented in the course materials? Select all that apply.","r":"The ACA bans preexisting-condition exclusions, extends dependent coverage to age 26, requires Essential Health Benefits without annual or lifetime limits, created the Hospital Readmissions Reduction Program, and stopped Medicare payment for hospital-acquired conditions. Rescission upon illness is prohibited.","o":["Hospitals receive additional payment for treating hospital-acquired conditions","Dependent children may remain on a parent’s plan until age 30","Marketplace plans must cover Essential Health Benefits without annual or lifetime dollar limits","Insurers cannot deny coverage or charge higher premiums because of preexisting conditions","Medicare reduces payments to hospitals for excess preventable readmissions","Insurers may cancel coverage once an enrollee becomes seriously ill"],"a":[2,3,4],"w":["The opposite: Medicare no longer pays for HACs.","Dependent coverage extends to age 26, not 30.","Correct — Essential Health Benefits without dollar limits.","Correct — preexisting-condition protection.","Correct — readmission penalties.","Rescission upon illness is prohibited."],"src":"Module 4 slides — Medicare Parts A–D and Medigap, Medicaid/CHIP, ACA provisions, Case Studies 1, 2 & 5; Health Care Law Worksheet — EMTALA and ACA · Final Exam Study Guide, Module 4 (Medicare A–D, Medicaid, HMO/PPO/EPO, stewardship, value-based care)"},{"id":"M4-11","m":4,"lo":"4.3","t":"Value-based purchasing","cj":"Generate Solutions","d":3,"type":"sata","s":"A hospital’s value-based purchasing score fell because of low patient-experience scores, high CLABSI rates, and readmissions above the national benchmark. Which nursing-led initiatives would most directly improve these measures? Select all that apply.","r":"Value-based purchasing ties payment to quality measures, including patient experience, HAIs, and readmissions. A CLABSI bundle reduces a measured HAI, purposeful rounding and bedside report improve patient experience, and teach-back plus follow-up calls reduce readmissions. Extra labs add cost without targeting measures, and weaker discharge teaching increases readmissions.","o":["Order additional daily labs to detect complications earlier for all patients","Implement a CLABSI prevention bundle with daily line-necessity review","Move discharge teaching to a printed packet so nurses have more time for rounding","Conduct teach-back and post-discharge follow-up phone calls for heart failure patients","Use hourly purposeful rounding and bedside shift report that includes the patient"],"a":[1,3,4],"w":["Adds cost without targeting the measured domains.","Correct — reduces a measured HAI.","Reduced teaching quality increases readmissions.","Correct — reduces readmissions.","Correct — improves patient-experience measures."],"src":"Module 4 slides — DRG reimbursement, per diem rates, value-based purchasing, HACs and readmission penalties; PCAP Module 4 — Paying for Health Care (DRGs, managed care, capitation) · Final Exam Study Guide, Module 4 (Medicare A–D, Medicaid, HMO/PPO/EPO, stewardship, value-based care)"},{"id":"G-35","m":5,"lo":"5.3","t":"Incident report and the chart","cj":"Take Action","d":2,"type":"mc","s":"After stabilizing the patient, the RN plans to write “Incident report completed and sent to risk management” in the EHR progress note. What is the best guidance?","r":"Incident reports are confidential quality/risk-management documents. Referring to one in the chart can make it discoverable in a lawsuit and turns a learning tool into legal evidence. The chart documents objective clinical facts: what was given, assessment findings, notifications, interventions, and the patient’s response.","sg":"PCAP Study Guide — worksheet Activity B (3)","o":["Write it only if the provider agrees","Copy the incident report text into the progress note","Write it, so the legal record shows the error was properly reported","Chart only objective clinical facts and the patient’s response"],"a":[3],"w":["Provider agreement does not change the rule.","Moves the confidential report into the legal record.","Mentioning the report in the chart is never done.","Correct — the record holds clinical facts; the report stays confidential."],"src":"PCAP Study Guide — worksheet Activity B (3) · Module 5 slides — Incident Reporting (purpose; what to include; objective facts only; do not document the report in the chart) · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"G-10","m":5,"lo":"5.1","t":"Near miss","cj":"Recognize Cues","d":1,"type":"mc","s":"A nurse catches an incorrect dose before administering it. How should this event be classified?","r":"Ladder of safety events: near miss (caught before reaching the patient) → no-harm event (reached the patient, no harm) → adverse event (harm caused by care rather than the illness) → sentinel event (death or severe temporary/permanent harm; requires immediate investigation). All of them—including near misses—are reported, because they show where the defenses are weak.","sg":"Final Study Guide & Practice — practice Q10","o":["Near miss","Adverse event","No-harm event","Sentinel event"],"a":[0],"w":["Correct — intercepted before reaching the patient.","No harm from care occurred.","A no-harm event reached the patient; this one did not.","No death or severe harm occurred."],"src":"Final Study Guide & Practice — practice Q10 · Module 5 Quality & Safety slides — “Terms to Know” (near miss, adverse, sentinel, never event); Healthcare Quality & Safety Review Worksheet and Answer Key · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"N3-05","m":3,"lo":"3.7","t":"Bedside advocacy","cj":"Take Action","d":3,"type":"mc","s":"A post-operative patient who speaks limited English rates his pain 8/10 on a picture scale, but his order is for acetaminophen only. The surgeon says, “He’s probably exaggerating.” What is the nurse’s best advocacy action?","r":"Bedside advocacy protects patient rights and safety: accurate assessment (with a qualified interpreter), objective documentation, a clear request to the provider, and escalation if the concern is unresolved. This also counters the documented disparity in pain treatment for patients with limited English proficiency.","o":["Ask the patient’s son to tell the surgeon that his father is in pain","Reassess with a qualified interpreter, document findings, and request an order change","Give the acetaminophen and reassess in 4 hours as ordered","Tell the patient that the surgeon does not believe him so he can request a new surgeon"],"a":[1],"w":["Shifts the nurse’s advocacy role to family.","Correct — accurate assessment, documentation, a clear request, and escalation.","Accepts undertreatment of severe pain without advocacy.","Undermines trust and is unprofessional."],"src":"PCAP Module 3 — Health Policy and Politics; Grassroots Political Strategies · Final Exam Study Guide, Module 3 (health policy, micro vs. macro advocacy, evidence-informed recommendations)"},{"id":"Z8-02","m":8,"lo":"8.6","t":"Benefits and risks of AI","cj":"Analyze Cues","d":2,"type":"cloze","s":"Case: A nursing informatics committee is reviewing three AI problems: a readmission model trained mostly on data from insured, English-speaking patients; a chatbot that invents a nonexistent discharge medication; and nurses who stop assessing because “the score is always right.”","r":"AI benefits include earlier detection, efficiency, and reduced documentation burden. Risks include algorithmic bias, hallucinations, automation bias, alert fatigue, privacy and security exposure, and unclear accountability. The licensed clinician remains accountable.","tpl":"The readmission model illustrates {0}. The chatbot error is a {1}. The nurses’ behavior is {2}.","bl":[{"o":["interoperability","information blocking","alert fatigue","algorithmic bias"],"a":3,"w":"Non-diverse training data can produce biased outputs that worsen disparities."},{"o":["valid prediction","feature of ambient scribing","cybersecurity breach","hallucination"],"a":3,"w":"AI-generated content that is fabricated or inaccurate is a hallucination."},{"o":["professional comportment","automation bias","alert fatigue","shared governance"],"a":1,"w":"Over-reliance on automated output is automation bias."}],"src":"PNC Modules 8–9 — Health IT concept and IT in the Clinical Setting (clinical decision support, technology and judgment) · Final Exam Study Guide, Module 8 (HIT, AI applications, benefits/risks, ethical and legal concerns)"},{"id":"Z1-03","m":1,"lo":"1.5","t":"Population vs. community health; equity","cj":"Analyze Cues","d":3,"type":"cloze","s":"Case: A health system’s nurse analyst tracks A1C outcomes for all 4,200 of its patients with diabetes and finds that Spanish-speaking patients have far worse control. A county nurse separately surveys health needs in one rural town.","r":"The course defines population health as outcomes of a group of individuals and their distribution, integrating clinical care with public health and policy, and community health as the health of a defined geographic area or group. Tailoring language and timing to the group with worse outcomes is equity, not equality.","tpl":"The analyst’s work is an example of {0} health, while the county survey is {1} health. Providing Spanish-language diabetes classes with bilingual educators and evening hours reflects {2}.","bl":[{"o":["public","environmental","population","community"],"a":2,"w":"Population health examines outcomes of a defined group and how those outcomes are distributed within it."},{"o":["acute-care","community","population","occupational"],"a":1,"w":"Community health focuses on the health of a geographic area or shared community."},{"o":["health equity","cultural assimilation","health equality","risk pooling"],"a":0,"w":"Equity means resources tailored to need so everyone has a fair chance at health; equality gives everyone the same thing."}],"src":"Module 1 Study Guide §VII–VIII (population vs. individual focus; public health campaigns and indicators of success) · Final Exam Study Guide, Module 1 (SDOH, equity, prevention, HBM, care coordination, emergency response)"},{"id":"N8-01","m":8,"lo":"8.6","t":"Ambient AI scribe accuracy","cj":"Take Action","d":3,"type":"mc","s":"A hospital uses an ambient AI scribe that listens to nurse–patient conversations and drafts notes. The patient consented to its use. Reviewing the draft, the nurse sees that it states the patient “takes warfarin daily,” although the patient said he stopped warfarin last year. What should the nurse do?","r":"Generative AI can produce inaccurate or fabricated content (“hallucinations”). The licensed nurse remains accountable for documentation and must verify and correct AI-generated text before signing. Reporting the error supports monitoring of the tool. An inaccurate anticoagulant history can drive dangerous decisions if left in the record.","o":["Delete the entire AI note and stop using ambient documentation for this patient","Add an addendum later in the shift explaining the warfarin discrepancy","Correct the entry before signing, then report the AI error","Sign the note, because the AI transcribed the conversation directly"],"a":[2],"w":["Overcorrects; the tool can still be used with verification.","Leaves dangerous inaccurate data in the signed record in the meantime.","Correct — verify, correct, then sign; report the error.","The nurse, not the tool, is accountable for the signed note."],"src":"PNC Modules 8–9 — Health IT concept and IT in the Clinical Setting (clinical decision support, technology and judgment) · Final Exam Study Guide, Module 8 (HIT, AI applications, benefits/risks, ethical and legal concerns)"},{"id":"M7-08","m":7,"lo":"7.3","t":"Tort classification","cj":"Analyze Cues","d":3,"type":"sata","s":"Which tort classifications are correct? Select all that apply.","r":"Matching the course worksheet: forgetting side rails = negligence (unintentional); disclosing HIV status = breach of confidentiality (quasi-intentional); threatening restraint = assault (intentional). Touching a competent patient against a clear refusal is battery, an intentional tort. Defamatory written statements (libel) are classified with quasi-intentional torts.","o":["A nurse inserts a Foley catheter after a competent patient clearly refused — unintentional tort","A nurse forgets to raise the side rails per policy and the patient falls — unintentional tort (negligence)","A nurse writes on a whiteboard that a patient is “a drug-seeking manipulator” — quasi-intentional tort (defamation)","A nurse discloses a patient’s HIV status to a visitor — quasi-intentional tort (breach of confidentiality)","A nurse threatens to restrain a patient who refuses medication — intentional tort (assault)"],"a":[1,2,3,4],"w":["Incorrect — this is battery, an intentional tort.","Correct — negligence.","Correct — defamation (libel) is quasi-intentional.","Correct — quasi-intentional.","Correct — assault."],"src":"PNC Module 7 — Intentional Torts in Nursing Practice (assault, battery, false imprisonment, defamation); Health Care Law Worksheet Activity 4 and Answer Sheet · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"G-28","m":7,"lo":"7.3","t":"Intentional torts","cj":"Analyze Cues","d":2,"type":"sata","s":"A competent adult client hospitalized for dehydration says, “I’m tired of needles. I want to leave right now.” There is no discharge order. The nurse replies, “If you try to walk out, I’ll have security lock you in your room and sedate you.” Which intentional torts has the nurse committed? Select all that apply.","r":"A threat of unwanted contact is assault; threatening to lock in or sedate a competent adult to prevent leaving is false imprisonment. Battery would occur only if the sedation were actually given. A competent adult may leave against medical advice: the nurse explains risks, notifies the provider, requests an AMA form, and documents—never detains.","sg":"PCAP Study Guide — practice Q8","o":["False imprisonment","Negligence","Defamation","Assault","Battery"],"a":[0,3],"w":["Correct — threatening to confine a competent adult who may legally leave AMA.","Negligence is unintentional; this conduct is intentional.","No false statement about the client’s reputation was made.","Correct — the threat creates fear of imminent unwanted contact.","No physical contact has occurred yet."],"src":"PCAP Study Guide — practice Q8 · PNC Module 7 — Intentional Torts in Nursing Practice (assault, battery, false imprisonment, defamation); Health Care Law Worksheet Activity 4 and Answer Sheet · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"M3-18","m":3,"lo":"3.6","t":"Grassroots advocacy","cj":"Take Action","d":2,"type":"sata","s":"A group of nursing students wants to influence a pending state bill on workplace violence protections for health care workers. Which grassroots strategies are effective? Select all that apply.","r":"Face-to-face meetings by informed constituents are among the most effective advocacy methods; professional organizations amplify nurses’ voices; proper, respectful address (“Senator [last name]”) builds credibility. Generic form letters from outside the district have little impact, and threats damage relationships.","o":["Address the legislator properly, for example as “Senator (last name)”","Schedule a face-to-face meeting with their state legislator or staff to share concise patient and nurse stories","Send a widely circulated form letter signed by nurses from across the state","Join the state nurses association’s legislative day","Tell the legislator the association will campaign against him unless he supports the bill"],"a":[0,1,3],"w":["Correct — professional etiquette.","Correct — the most effective personal contact.","Generic, out-of-district messages have little impact compared with constituent contact.","Correct — collective voice through an organization.","Threats damage relationships and credibility."],"src":"PCAP Module 3 — Grassroots Political Strategies (visit policymakers; join professional organizations; how to address legislators) · Final Exam Study Guide, Module 3 (health policy, micro vs. macro advocacy, evidence-informed recommendations)"},{"id":"M6-02","m":6,"lo":"6.1","t":"TeamSTEPPS outcomes","cj":"Evaluate Outcomes","d":2,"type":"mc","s":"After a TeamSTEPPS rollout, nurses, physicians, and respiratory therapists consistently describe the same plan of care for each ventilated patient during rounds. Which TeamSTEPPS knowledge outcome does this demonstrate?","r":"In the TeamSTEPPS framework, knowledge outcomes = shared mental model; attitudes = mutual trust and team orientation; performance = adaptability, accuracy, productivity, efficiency, and safety. Everyone being “on the same page” is a shared mental model.","o":["Team orientation","Shared mental model","Adaptability","Mutual trust"],"a":[1],"w":["An attitude outcome.","Correct — the team shares an understanding of the plan.","A performance outcome.","An attitude outcome."],"src":"Module 6 Communication & Collaboration slides — TeamSTEPPS framework (four skills; knowledge/attitude/performance outcomes; multi-team systems) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"M3-02","m":6,"lo":"6.6","t":"Floating — case law","cj":"Analyze Cues","d":3,"type":"mc","s":"A critical-care nurse refuses to float to an orthopedic unit, saying he is not qualified. The hospital offers orientation to the unit, which he also refuses, and he is terminated. Based on Francis v. Memorial General Hospital, what is the most likely legal outcome?","r":"In Francis, the court upheld the discharge of a nurse who refused both to float and to accept orientation. Contrast with Winkelman, in which the nurse was protected because she was not qualified and was given no reasonable accommodation. Nurses must articulate limitations, but courts support reasonable employer efforts to train and redeploy staff.","o":["The case will be dismissed because floating policies are not enforceable","The hospital will be found negligent for offering orientation","The termination will likely be upheld because the employer made a reasonable offer of training that the nurse refused","The nurse will win because nurses have an absolute right to refuse floating"],"a":[2],"w":["Floating policies are generally enforceable when reasonable.","Offering orientation is a reasonable employer action.","Correct — refusal of reasonable training undermined his claim.","No absolute right to refuse exists; it depends on competence and accommodation."],"src":"PNC Module 7 legal chapter — Personal Liability with Floating (Francis v. Memorial General Hospital; Winkelman v. Beloit Memorial Hospital) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"M2-08","m":2,"lo":"2.4","t":"Team building & civility","cj":"Generate Solutions","d":2,"type":"sata","s":"A nurse manager’s engagement survey shows low trust, frequent gossip, and staff reluctance to ask for help. Which actions should the manager take to build a healthy, civil team? Select all that apply.","r":"Employers must implement and enforce zero-tolerance policies, provide training, create an environment where staff can raise incivility, and promote a cultur
