interpret laws after the fact; they do not pre-approve rules.","Correct — administrative rules carry the force of law.","Agencies must consider comments and may revise rules.","Boards implement statutes; they do not enact them."],"src":"PCAP Module 3 — Health Policy and Politics chapter (policy vs. politics; three branches; local/state/federal roles; Health Policy Through Regulation and the Federal Register) · Final Exam Study Guide, Module 3 (health policy, micro vs. macro advocacy, evidence-informed recommendations)"},{"id":"M2-07","m":2,"lo":"2.4","t":"Bullying & incivility","cj":"Take Action","d":2,"type":"mc","s":"A new graduate tells her preceptor that an experienced nurse repeatedly rolls her eyes during report, criticizes her in front of patients, and refuses to help with heavy patients. Which response by the preceptor is most appropriate?","r":"Bullying is repeated, unreasonable behavior intended to intimidate or undermine, and it affects patient safety. Individual steps include recognizing it, understanding the victim is not the source, documenting specifics, and following organizational policy. Ignoring it perpetuates the behavior.","o":["“Try talking with her privately first; if it keeps happening, we’ll involve the manager.”","“Let’s confront her together in the hallway right now.”","“She treats every new nurse that way. If you ignore it and keep your head down, it usually stops within a few months.”","“That isn’t acceptable—keep a dated record, and let’s report it under the bullying policy.”"],"a":[3],"w":["Private dialogue can help one-time incivility, but repeated bullying that affects patients should be documented and reported per policy now.","Public confrontation can escalate and bypasses policy.","Ignoring bullying perpetuates it.","Correct — validates, documents, follows policy."],"src":"PCAP Module 2 — Addressing and Preventing Bullying and Incivility (individual steps; employer responsibilities) · Final Exam Study Guide, Module 2 (leader vs. manager, leadership theories, prioritization, 5 rights, EAT)"},{"id":"M1-19","m":1,"lo":"1.6","t":"Incident command & EOP","cj":"Take Action","d":2,"type":"sata","s":"A hospital activates its Emergency Operations Plan after a chemical spill on a nearby highway. Which actions by the nursing staff are appropriate? Select all that apply.","r":"In an incident-command structure, staff work within assigned roles, and communication with the media flows through the public information officer. Surge capacity is created by discharging or transferring stable patients. Contaminated victims must be decontaminated before hands-on care or entry to protect staff, patients, and the facility.","o":["Call the local news station to share accurate patient counts and reassure the public","Begin assessing contaminated victims at the ED entrance before decontamination to save time","Use the decontamination area and PPE designated by the plan before providing hands-on care","Report to the labor pool or assigned role as directed through the incident command structure","Expedite safe discharges or transfers of stable inpatients to create surge capacity"],"a":[2,3,4],"w":["Media communication goes through the public information officer under incident command.","Hands-on care before decontamination contaminates staff and the facility.","Correct — protects staff and the facility.","Correct — role clarity under incident command.","Correct — creates surge capacity."],"src":"PCAP Module 1 — Emergency Preparedness chapter (mitigation, preparedness, response, recovery; crisis standards of care; MCI triage; incident command; biologic agents); Module 1 Study Guide §IX · Final Exam Study Guide, Module 1 (SDOH, equity, prevention, HBM, care coordination, emergency response)"},{"id":"Z7-02","m":7,"lo":"7.2","t":"Five elements of malpractice","cj":"Evaluate Outcomes","d":3,"type":"cloze","s":"Case: A nurse gives regular insulin IV instead of subcutaneous insulin glargine. The patient’s glucose drops to 38 mg/dL; the nurse gives IV dextrose per protocol, and the patient recovers fully with no lasting harm.","r":"The course teaches five elements of malpractice, all of which must be proven: duty, breach of duty, foreseeability, causation, and damages/injury. Here duty, breach, foreseeability, and causation exist, but rapid intervention prevented lasting damages. The error must still be reported, and the chart should contain objective facts only—never a note that an incident report was filed.","tpl":"The nurse–patient relationship establishes {0}. Giving the wrong insulin by the wrong route is {1}. A malpractice suit is unlikely to succeed because the element of {2} is missing.","bl":[{"o":["causation","duty","foreseeability","damages"],"a":1,"w":"Duty arises from the nurse–patient relationship."},{"o":["damages","consent","breach of duty","foreseeability"],"a":2,"w":"Failing to meet the standard of care is the breach."},{"o":["duty","damages/injury","causation","foreseeability"],"a":1,"w":"Without actual lasting harm, the damages element is not met."}],"src":"PNC Module 7 legal chapter — elements of negligence/malpractice, res ipsa loquitur, gross and criminal negligence, Good Samaritan immunity, vicarious liability (respondeat superior); Health Care Law Worksheet · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"M2-14","m":2,"lo":"2.1","t":"Power & authority","cj":"Analyze Cues","d":2,"type":"mc","s":"A newly hired nurse manager discovers that a long-tenured night-shift nurse is the person most staff follow when deciding whether to support unit changes. What is the manager’s best strategy?","r":"Informal leaders can significantly affect workflow and the adoption of change. Managers are advised to identify and work with informal leaders—soliciting input and enlisting them as champions—rather than competing with them.","o":["Meet one-on-one with each staff member so the informal leader’s views do not dominate","Engage the informal leader early, seek her input, and invite her to help lead the change","Ask staff to bring all questions and concerns directly to the manager instead of consulting their peers","Ignore informal dynamics and rely on formal authority"],"a":[1],"w":["Works around rather than with the informal leader; managers are advised to engage informal leaders.","Correct — leverages informal leadership.","Unrealistic; undermines collegial consultation.","Underestimates informal influence."],"src":"PCAP Module 2 — Nursing Leadership and Management: Leadership vs. Management; Power and Authority; Formal and Informal Leadership · Final Exam Study Guide, Module 2 (leader vs. manager, leadership theories, prioritization, 5 rights, EAT)"},{"id":"M4-16","m":4,"lo":"4.5","t":"Budget types","cj":"Analyze Cues","d":1,"type":"mc","s":"A nurse manager is preparing next year’s budget requests. Which item belongs in the capital budget?","r":"Capital budgets fund long-life equipment and construction—items with a useful life over 1 year that exceed an organization’s dollar threshold (often $500–$2,000). Overtime and education are labor/operating expenses; supplies are operating expenses.","o":["IV start kits and dressings","Annual BLS recertification and education hours for all unit staff","A $180,000 cardiac monitoring system (7-year life)","Overtime pay for nurses during flu season"],"a":[2],"w":["Operating budget supplies.","Labor/staff development within the operating budget.","Correct — long-life, high-cost equipment.","Labor budget (a subset of operating)."],"src":"PCAP Module 4 — Budgeting chapter (Box 18.1 operating, labor, and capital budgets; FTE = 2,080 hours; favorable vs. unfavorable variance; productivity) · Final Exam Study Guide, Module 4 (Medicare A–D, Medicaid, HMO/PPO/EPO, stewardship, value-based care)"},{"id":"G-01","m":1,"lo":"1.5","t":"Population-level intervention","cj":"Generate Solutions","d":2,"type":"mc","s":"A community nurse finds that adults in a rural area have low colorectal cancer screening rates. Residents report long travel distances, no paid leave, and limited transportation. Which action best addresses the population-level problem?","r":"Population health interventions change conditions for a whole group and then measure the group’s outcome. The barriers named here are structural social determinants (transportation, distance, no paid leave), so the fix must bring services to people and remove those barriers, then evaluate uptake. Brochures, seminars, and reminders treat a knowledge or motivation problem the residents do not have.","sg":"Final Study Guide & Practice — practice Q1","o":["Partner locally for mobile screening and rides, then track uptake","Mail reminder letters to every resident who is overdue for screening","Hold an evening seminar at the library explaining how screening saves lives","Focus outreach on residents who already have a primary care provider"],"a":[0],"w":["Correct — removes the structural barriers and evaluates the population outcome.","Reminders are a cue to action; they do not remove travel, time, or transportation barriers.","Education targets knowledge, but residents’ barriers are structural (travel, leave, transport).","Excludes the residents with the greatest access barriers and widens the gap."],"src":"Final Study Guide & Practice — practice Q1 · Module 1 Study Guide §VII–VIII (population vs. individual focus; public health campaigns and indicators of success) · Final Exam Study Guide, Module 1 (SDOH, equity, prevention, HBM, care coordination, emergency response)"},{"id":"G-29","m":8,"lo":"8.6","t":"Ambient AI scribe ethics","cj":"Take Action","d":2,"type":"mc","s":"A hospital implements an ambient AI scribe that records nurse–patient conversations to draft notes. Which nursing action best addresses the ethical and legal responsibilities of this technology?","r":"Patients should know when AI is used in their care (autonomy and informed consent). Ambient scribes can produce errors and “hallucinations,” so the nurse verifies every draft before signing—the licensed clinician remains legally accountable. Only approved, secure devices and workflows may handle PHI.","sg":"PCAP Study Guide — practice Q9","o":["Run the scribe app on a personal smartphone for a faster connection","Tell the patient, get consent, and review each draft before signing","Let the scribe finalize and sign routine notes to reduce documentation time","Rely on the scribe’s summary instead of repeating a physical assessment"],"a":[1],"w":["Personal devices are not approved or secure for PHI.","Correct — transparency, consent, and verification.","The licensed nurse is accountable and must review before signing.","AI drafts documentation; it never replaces assessment."],"src":"PCAP Study Guide — practice Q9 · PNC Modules 8–9 — Health IT concept and IT in the Clinical Setting (clinical decision support, technology and judgment) · Final Exam Study Guide, Module 8 (HIT, AI applications, benefits/risks, ethical and legal concerns)"},{"id":"M3-03","m":6,"lo":"6.6","t":"Safe staffing approaches","cj":"Analyze Cues","d":2,"type":"mc","s":"A state nurses association is choosing which staffing legislation to support. Its members want flexibility to adjust staffing for acuity, admissions/discharges, staff experience, and unit layout. Which approach does the ANA endorse that best meets this goal?","r":"The ANA endorses nurse-driven staffing committees (Principles for Nurse Staffing) because they allow flexible staffing that accounts for acuity, admissions/discharges/transfers, staff experience, unit layout, and resources. Fixed ratios (California) are less flexible; disclosure alone does not set staffing.","o":["Hospital acuity software that sets staffing levels without direct-care nurse input","Public disclosure of staffing levels only","Fixed, legislated nurse-to-patient ratios for every hospital unit, similar to the California model","Nurse-led staffing committees"],"a":[3],"w":["Acuity tools help, but the ANA model requires nurses to be integral to staffing decisions.","Disclosure improves transparency but does not set staffing.","Ratios are rigid; the scenario seeks flexibility.","Correct — the ANA-endorsed, flexible, nurse-driven model."],"src":"PCAP Module 3 — Workforce Advocacy: Safe Staffing, Box 13.3 (questions before employment), Box 13.5 (questions before accepting an assignment), Floating and Mandatory Overtime; PNC Module 7 — Floating and Cross-Training (Winkelman; Francis); PCAP Module 3 — Workplace Safety (violence, fatigue) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"M7-01","m":7,"lo":"7.1","t":"Duty to clarify orders","cj":"Take Action","d":2,"type":"mc","s":"A provider orders metoprolol 50 mg PO for a patient whose current heart rate is 48 and BP 88/52. The provider is in surgery for the next 2 hours. What is the nurse’s legal obligation?","r":"Nurse Practice Acts and Board rules (for example, Ohio’s rule cited in the text) require the RN to clarify any order believed to be inaccurate, harmful, or contraindicated before implementing it. The nurse has an independent, affirmative duty to prevent harm—“following orders” is not a defense.","o":["Hold the dose and leave a note for the surgeon to review after the case","Give the medication but recheck vital signs in 30 minutes","Hold the dose, document findings, and clarify the order with a provider, using the chain of command","Give the medication because the order is valid"],"a":[2],"w":["A covering provider must be reached now; a note leaves the order unresolved.","Giving a contraindicated dose and monitoring afterward does not prevent harm.","Correct — the nurse has an independent duty to clarify a potentially harmful order before giving it.","The nurse has an independent duty not to implement a harmful order."],"src":"PNC Module 7 legal chapter — Sources of Law; State Nurse Practice Act and Board rules (Ohio rule requiring clarification of questionable orders); affirmative duty · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"M3-17","m":3,"lo":"3.5","t":"Levels of government","cj":"Analyze Cues","d":2,"type":"mc","s":"A nurse wants to change the scope of practice for RNs to allow independent administration of certain vaccines in schools. At which level of government should advocacy primarily be focused?","r":"States define practice authority through the Nurse Practice Act and Board of Nursing rules. Federal policy affects payment (Medicare/Medicaid) and other programs but does not license nurses.","o":["The state level","The federal level, through CMS, which reimburses school-based services","The local city council, because it regulates schools","Federal Congress, because it sets national licensure standards for registered nurses"],"a":[0],"w":["Correct — scope of practice is a state matter.","CMS influences payment, not RN scope of practice.","Local councils do not set professional scope.","Congress does not license nurses."],"src":"PCAP Module 3 — Health Policy and Politics chapter (policy vs. politics; three branches; local/state/federal roles; Health Policy Through Regulation and the Federal Register) · Final Exam Study Guide, Module 3 (health policy, micro vs. macro advocacy, evidence-informed recommendations)"},{"id":"G-11","m":5,"lo":"5.2","t":"Swiss cheese model","cj":"Analyze Cues","d":1,"type":"mc","s":"Which statement best describes the Swiss cheese model?","r":"James Reason’s model: each defensive layer (policy, technology, staffing, training, communication) has holes. Latent conditions are hidden system weaknesses; active failures are unsafe acts by people at the point of care. Harm happens when the holes line up. The fix is stronger, independent, redundant layers—not more reliance on one person’s vigilance.","sg":"Final Study Guide & Practice — practice Q11","o":["Latent conditions cause harm on their own, without any active failure","Defenses have weaknesses; harm occurs when those weaknesses align","Adding one strong safeguard removes the need for other layers","Harm results mainly from the active failure of the person at the sharp end"],"a":[1],"w":["Latent conditions usually combine with an active failure to cause harm.","Correct — aligned holes across layers let the hazard through.","Any single layer can fail; redundancy is the point.","Blames one person and ignores the latent layers that also failed."],"src":"Final Study Guide & Practice — practice Q11 · Module 5 slides — Systems Thinking and the Swiss Cheese Model (active vs. latent failures; wrong-site surgery example); Econ/Quality Worksheet §4 (KCl scenario) · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"M5-19","m":5,"lo":"5.7","t":"Failure to rescue","cj":"Recognize Cues","d":3,"type":"mc","s":"A postoperative patient’s respiratory rate trends from 16 to 26 over 6 hours, heart rate from 84 to 118, and the patient becomes newly anxious. Each value was documented, but no one escalated. Which safety concept does this illustrate, and what should the nurse do now?","r":"Failure to rescue is the failure to identify or respond promptly to patient decline. The trend shows early deterioration (possible sepsis, PE, or bleeding). The priority is immediate escalation; reporting and system review follow after the patient is safe.","o":["Failure to rescue; recognize the deterioration pattern and activate the rapid response team now","Expected postoperative recovery; reassess in 4 hours","Near miss; complete an incident report before acting","Alarm fatigue; widen alarm limits so the trend stops triggering"],"a":[0],"w":["Correct — recognize and escalate immediately.","These trends are not expected and need action now.","Patient care comes before paperwork, and harm is still evolving.","Widening limits hides a true deterioration trend."],"src":"Module 5 slides — Most Common Medication Errors; Common Preventable In-Patient Safety Risks (HAIs, falls, failure to rescue); Patient Engagement; Comprehensive Guide to Healthcare Quality & Patient Safety · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"M1-07","m":1,"lo":"1.3","t":"Discharge planning","cj":"Prioritize Hypotheses","d":3,"type":"mc","s":"A charge nurse reviews four patients scheduled for discharge tomorrow. Which patient has the highest risk for readmission and should receive a transitional-care referral first?","r":"The professor’s high-risk readmission indicators include chronic disease, polypharmacy, lack of caregiver support, transportation barriers, and limited health literacy. The 79-year-old has nearly every indicator stacked together, so transitional-care resources (for example, the nurse-led Transitional Care Model) have the greatest impact here.","o":["A 45-year-old after laparoscopic appendectomy who lives with a spouse and has two new prescriptions","A 66-year-old after elective knee replacement going to a skilled nursing facility for rehabilitation","A 79-year-old with COPD and heart failure who takes 11 medications, lives alone, and cancelled the last two clinic visits for lack of a ride","A 52-year-old with new type 2 diabetes who completed glucometer teach-back and has follow-up booked"],"a":[2],"w":["Acute, resolved problem with a support person.","Has a supervised post-acute setting.","Correct — multiple chronic conditions, polypharmacy, isolation, and access barriers.","Has demonstrated competence and has follow-up arranged."],"src":"Module 1 Study Guide §IV–V (discharge planning begins at admission; high-risk readmission indicators; care coordination); PCAP Module 1 — Giddens Care Coordination (Transitional Care Model, PCMH, PACE, ACOs) · Final Exam Study Guide, Module 1 (SDOH, equity, prevention, HBM, care coordination, emergency response)"},{"id":"G-36","m":6,"lo":"6.4","t":"CUS with AI sepsis alert","cj":"Take Action","d":3,"type":"mc","s":"An AI sepsis model alerts on a post-op patient (HR 108, RR 22, T 38.1°C). The nurse finds new mild confusion and urine output of 20 mL/hr. The resident says, “It’s post-op inflammation; I’ll check on rounds.” Which statement best completes the “Uncomfortable” step of CUS?","r":"CUS for this case: Concerned (“I’m concerned about Mr. X in 402”), Uncomfortable (“I’m uncomfortable waiting until morning—new confusion and urine output of 20 mL/hr”), Safety issue (“This is a safety issue; he may be developing sepsis. Please evaluate now and consider lactate, cultures, and a fluid bolus”). The AI alert prompts the assessment; the assessment drives the escalation.","sg":"PCAP Study Guide — worksheet Activity C","o":["“I’m uncomfortable, but I’ll recheck him in an hour and call you back.”","“I’m uncomfortable—the computer alert went off, so we have to act.”","“I’m uncomfortable with your decision, and I’ll be documenting this call.”","“I’m uncomfortable waiting until rounds—he’s newly confused and his urine output is 20 mL/hr.”"],"a":[3],"w":["Undercuts the escalation and delays evaluation.","Relies on the alert alone instead of the nurse’s assessment data.","Sounds like a threat rather than a request.","Correct — names the discomfort and the objective findings behind it."],"src":"PCAP Study Guide — worksheet Activity C · Module 6 slides — Mutual Support (task assistance, formative feedback, advocacy and assertion, two-challenge rule, CUS, DESC) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"M5-26","m":5,"lo":"5.4","t":"Second victim support","cj":"Take Action","d":2,"type":"mc","s":"A nurse involved in a medication error that caused temporary harm is tearful, cannot sleep, and says she is thinking of leaving nursing. Within a Just Culture, which response by the manager is most appropriate?","r":"The professor’s slides note the psychological effects of errors on health care professionals. Just Culture supports staff involved in errors (the “second victim”) while examining systems. Involving the nurse in learning promotes recovery and improvement.","o":["Reassign her to non-medication duties until the RCA is complete","Offer peer support and EAP resources and involve her in the learning review","Suspend the nurse with pay pending the investigation to protect patients and the unit’s reputation","Remind the nurse that she should have been more careful"],"a":[1],"w":["Can feel punitive before review; support and involvement promote recovery and learning.","Correct — support plus system learning.","Punitive action before review contradicts Just Culture.","Blame worsens distress and discourages reporting."],"src":"Module 5 slides — “Just Culture” (shared accountability, psychological safety); Boot Camp §10 (human error vs. at-risk vs. reckless behavior) · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"G-42","m":8,"lo":"8.6","t":"Patient-facing chatbot","cj":"Take Action","d":2,"type":"mc","s":"A post-discharge chatbot flags that a patient typed, “Chest feels tight and I’m short of breath.” The nurse reviewing the queue sees the bot replied with general heart-health tips. What should the nurse do?","r":"Chatbots can schedule, answer routine questions, and monitor symptoms, but they cannot replace clinician assessment or emergency triage. When a bot misses a red-flag symptom, the nurse acts immediately (call, assess, direct to 911 or the ED as indicated), then reports the unsafe output through AI governance so the tool can be fixed.","o":["Let the chatbot handle it, since it already replied","Send a portal message asking for more details within 24 hours","Mark the message as reviewed and add it to the weekly AI-quality report","Call the patient now to assess and direct care; report the bot’s reply"],"a":[3],"w":["Chatbots cannot assess or triage emergencies safely.","Too slow for possible cardiac or respiratory symptoms.","Reporting matters, but the patient needs help now.","Correct — the clinician acts; the AI failure is reported."],"src":"PNC Modules 8–9 — Health IT concept and IT in the Clinical Setting (clinical decision support, technology and judgment) · Final Exam Study Guide, Module 8 (HIT, AI applications, benefits/risks, ethical and legal concerns)"},{"id":"Z3-03","m":3,"lo":"3.5","t":"Policy process — branches and regulation","cj":"Analyze Cues","d":3,"type":"cloze","s":"Case: A state staffing-committee bill passes the legislature and is signed by the governor. The Department of Public Health then publishes draft rules describing how committees must operate.","r":"Policy moves from statute (legislative) to regulation (executive agencies), and courts interpret laws (judicial). Adopted regulations carry the force of law, so the comment period is a critical opportunity for nursing input.","tpl":"Passing the bill was an action of the {0} branch. The draft rules come from the {1} branch, and nurses can influence them by {2}.","bl":[{"o":["executive","administrative-judicial","legislative","judicial"],"a":2,"w":"Legislatures enact statutes."},{"o":["legislative","federal","executive","judicial"],"a":2,"w":"Executive-branch agencies implement statutes through regulations."},{"o":["waiting a year to see how the final rules work in practice","submitting evidence-based public comments on the draft rules","asking legislators to re-vote on the bill with new language","filing a lawsuit to block the rules before they are final"],"a":1,"w":"Agencies must consider public comments before finalizing rules—a key advocacy window."}],"src":"PCAP Module 3 — Health Policy and Politics chapter (policy vs. politics; three branches; local/state/federal roles; Health Policy Through Regulation and the Federal Register) · Final Exam Study Guide, Module 3 (health policy, micro vs. macro advocacy, evidence-informed recommendations)"},{"id":"N9-04","m":9,"lo":"9.3","t":"Benner’s novice to expert","cj":"Analyze Cues","d":3,"type":"mc","s":"A nurse 4 months into her first job follows protocols well and recognizes recurring situations, such as a typical post-op day 1 course, but she still struggles to tell which of several abnormal findings matters most. According to Benner’s model, which stage best describes her, and what support fits best?","r":"Benner’s advanced beginners demonstrate marginally acceptable performance, recognize recurring meaningful aspects of situations, but have difficulty prioritizing—typical of new graduates in their first months. Mentorship and residency programs that coach prioritization in real situations support progression. Competent nurses (about 2–3 years) plan deliberately; proficient nurses see situations as wholes.","o":["Advanced beginner; she needs mentoring to prioritize in real situations","Proficient; she needs a charge-nurse role to develop holistic judgment","Novice; she needs rules-based checklists for every task","Competent; she needs independent assignments to build long-range planning"],"a":[0],"w":["Correct — recognizes patterns but struggles to prioritize.","Proficient nurses perceive situations holistically, which she cannot yet do.","Novices lack experience with situations and rely on context-free rules; she recognizes recurring patterns.","Competent nurses already plan deliberately and prioritize."],"src":"PNC Modules 8–9 — Giddens Professional Identity concept (formation through experience, reflection, mentorship) · Final Exam Study Guide, Module 9 (licensure, BON/NPA, NCLEX/NLC, certification, ANA Code, Benner, lifelong learning)"},{"id":"M2-09","m":2,"lo":"2.5","t":"Delegation to UAP","cj":"Take Action","d":2,"type":"sata","s":"An RN is caring for five patients on a medical unit with one UAP. Which tasks can the RN appropriately delegate to the UAP? Select all that apply.","r":"Delegable tasks are routine, have predictable outcomes, and involve stable patients. Assessment, evaluation, teaching, and care of unstable patients require RN judgment and cannot be delegated. The RN still supervises and interprets the data the UAP collects.","o":["Evaluating whether a patient’s pain improved after IV morphine","Obtaining vital signs on a patient admitted 3 days ago with stable pneumonia","Assisting a stable post-stroke patient with a bed bath and repositioning","Teaching a newly diagnosed diabetic how to use an insulin pen","Assessing a patient who reports new chest pressure","Measuring and recording intake and output for a patient on a fluid restriction"],"a":[1,2,5],"w":["Evaluation requires RN judgment.","Correct — routine data collection on a stable patient.","Correct — routine care with predictable outcome.","Teaching is an RN responsibility.","New chest pressure needs immediate RN assessment.","Correct — routine measurement; the RN interprets it."],"src":"Boot Camp §05 (five rights of delegation; RN keeps assessment, evaluation, teaching); PNC Module 7 legal chapter — Personal Liability in Delegation and Supervision · Final Exam Study Guide, Module 2 (leader vs. manager, leadership theories, prioritization, 5 rights, EAT)"},{"id":"M6-11","m":6,"lo":"6.4","t":"Advocacy & assertion","cj":"Take Action","d":3,"type":"mc","s":"A nurse believes a patient’s new confusion and SpO2 of 86% need evaluation, but the hospitalist says by phone, “He’s just sundowning.” Using the advocacy-and-assertion steps, which statement is best?","r":"Advocacy and assertion: make an opening (address the person), state the concern, state the problem, offer a solution, and reach agreement on next steps—firmly and respectfully. Accepting dismissal, blaming, and threatening are ineffective or uncivil.","o":["“Okay, I’ll keep watching him.”","“You always ignore my calls when it’s busy, so I’ll just document that you refused to come in.”","“Dr. Shah, I’m concerned: Mr. Lin’s SpO2 fell from 95% to 86% and he’s newly confused. Please evaluate him in the next 15 minutes.”","“Fine, but if something happens to him tonight, it’s on you, and I’m documenting this conversation.”"],"a":[2],"w":["Accepts a dismissal despite objective decline.","Accusatory and nonspecific.","Correct — opening, concern, problem, solution, agreement.","A threat, not assertion."],"src":"Module 6 slides — Mutual Support (task assistance, formative feedback, advocacy and assertion, two-challenge rule, CUS, DESC) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"M7-10","m":7,"lo":"7.4","t":"Informed consent — nurse’s role","cj":"Take Action","d":3,"type":"mc","s":"While a nurse is witnessing a consent signature for a colectomy, the patient asks, “Will I have a bag afterward? Nobody told me that.” What should the nurse do?","r":"The duty to disclose the nature, benefits, risks, alternatives, and risks of no treatment rests with the provider and cannot be delegated to the RN. When consent may not be informed, the nurse notifies the provider, defers witnessing, and documents the questions and the reason for the delay.","o":["Explain colostomy care and the reasons for it so the patient feels informed and can sign today","Defer witnessing, notify the surgeon, and document the patient’s questions","Witness the signature because the surgeon already discussed the procedure","Witness the signature and tell the surgeon about the question before surgery"],"a":[1],"w":["Disclosure is the provider’s duty; the nurse cannot substitute.","Correct — stop, notify, document.","The patient’s statement shows consent is not informed.","Witnessing should be deferred until the provider answers the questions."],"src":"PNC Module 7 — Informed Consent (duty to disclose rests with provider; defer witnessing; document questions) · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"N3-04","m":3,"lo":"3.5","t":"Levels of health policy","cj":"Analyze Cues","d":3,"type":"mc","s":"A nurse lists three changes: her hospital’s new rule requiring two RN signatures for insulin drips, a county ordinance banning smoking in parks, and a federal rule changing Medicare home health payments. Which statement best describes these changes?","r":"Health policy includes decisions, plans, and actions to achieve health goals at every level—institutional (organizational) policies, local and state laws, and federal regulations. Politics is the process of influencing those decisions.","o":["Only the federal rule is health policy, because policy refers to laws and regulations","None are health policy until they are evaluated for outcomes","All three are health policy at different levels: institutional, local, and federal","The hospital rule and the federal rule are policy; the county ordinance is politics"],"a":[2],"w":["Organizational rules are also health policy.","Policies exist once adopted; evaluation comes later.","Correct — institutional, local, and federal policy.","An enacted ordinance is policy; politics is the influence process."],"src":"PCAP Module 3 — Health Policy and Politics chapter (policy vs. politics; three branches; local/state/federal roles; Health Policy Through Regulation and the Federal Register) · Final Exam Study Guide, Module 3 (health policy, micro vs. macro advocacy, evidence-informed recommendations)"},{"id":"G-13","m":6,"lo":"6.2","t":"SBAR","cj":"Take Action","d":1,"type":"mc","s":"During a phone call to the provider, which statement best demonstrates SBAR?","r":"SBAR: Situation (what is happening now), Background (relevant history), Assessment (objective data and your interpretation), Recommendation (a specific request and time frame). The Recommendation is the step most often skipped—always state what you need and how soon.","sg":"Final Study Guide & Practice — practice Q13","o":["“New O2 need; pneumonia; SpO2 88%, labored breathing; please assess now.”","“Mr. Diaz, 72, admitted with pneumonia, day 2, SpO2 88% on 2 L, RR 28, HR 110.”","“I’m worried about Mr. Diaz, and I don’t agree with the current plan.”","“Mr. Diaz seems worse—can you come look at him when you’re free?”"],"a":[0],"w":["Correct — Situation, Background, Assessment, Recommendation.","Gives data but no assessment or recommendation.","Concern without data or a specific request.","Vague, with no data and no time frame."],"src":"Final Study Guide & Practice — practice Q13 · Module 6 slides — SBAR, Call-Out, Check-Back, Teach-Back, Handoff; Boot Camp §11 (read-back for critical messages) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"M5-07","m":5,"lo":"5.3","t":"Purpose of incident reporting","cj":"Analyze Cues","d":1,"type":"mc","s":"A nurse says, “I won’t file an incident report for the near miss because nobody got hurt and I don’t want to get anyone in trouble.” Which response best explains the purpose of incident reporting?","r":"Incident reports serve risk management, quality control, training, and legal evidence. They are about improving systems through learning, not assigning blame. Near misses, equipment failures, security breaches, and safety hazards such as unsafe staffing should all be reported.","o":["“Reports are mainly used to decide who should be disciplined.”","“Reports mainly protect individual nurses from liability if the patient or family later files a lawsuit.”","“Reports are only required when a patient is harmed.”","“They help the organization find and fix system weaknesses before harm recurs.”"],"a":[3],"w":["Punitive framing contradicts a Just Culture.","Their primary purpose is system improvement.","Near misses should be reported.","Correct — learning and improvement."],"src":"Module 5 slides — Incident Reporting (purpose; what to include; objective facts only; do not document the report in the chart) · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"M6-15","m":6,"lo":"6.4","t":"Formative feedback","cj":"Take Action","d":2,"type":"sata","s":"A preceptor wants to give formative feedback to an orientee who did not reassess a patient’s pain after an opioid. Which characteristics should the feedback include? Select all that apply.","r":"Formative feedback should be appreciative, timely, respectful (focused on behavior), specific, directed toward improvement, considerate, and patient focused. Feedback delivered publicly, aimed at personality, kept vague, or saved for an annual review fails these criteria.","o":["Focused on the orientee’s personality and attitude","Delivered at the next staff meeting so others can learn from it","Saved for the annual performance review","General — reminding her to “work on her time management”","Timely — shortly after the event","Specific — focused on the missed reassessment"],"a":[4,5],"w":["Feedback should address behavior, not personality.","Public correction is not considerate or respectful.","Not timely.","Vague feedback is not specific or actionable.","Correct — timely.","Correct — specific."],"src":"Module 6 slides — Mutual Support (task assistance, formative feedback, advocacy and assertion, two-challenge rule, CUS, DESC) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"}]}</script>

 "Recognize Cues":"Before reading options, list the abnormal or unexpected findings in the stem and identify which ones are new, trending, or safety-critical.",

function ident(n){ return Array.from({length:n},(_,i)=>i); }
function makePerms(ids){
  const perms={}, cnt=[0,0,0,0]; let h1=-1,h2=-2;
  ids.forEach(id=>{ const q=QBY[id];
    if(q.type==="cloze"){ perms[id]=q.bl.map(b=>shuffleArr(ident(b.o.length))); return; }
    const n=q.o.length;
    if(q.type==="mc"){
      let c=[0,1,2,3]; if(h1===h2) c=c.filter(p=>p!==h1);
      const m=Math.min(...c.map(p=>cnt[p])); c=c.filter(p=>cnt[p]===m);
      const t=c[Math.floor(Math.random()*c.length)]; cnt[t]++; h2=h1; h1=t;
      const others=[0,1,2,3].filter(i=>i!==q.a[0]); shuffleArr(others);
      const p=[]; let k=0; for(let i=0;i<4;i++) p[i]= i===t ? q.a[0] : others[k++];
      perms[id]=p;
    } else { const p=ident(n); shuffleArr(p); perms[id]=p; }
  });
  return perms;
}
function shuffleArr(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function permOf(q,P){ return (P&&P[q.id]) || (q.type==="cloze"? q.bl.map(b=>ident(b.o.length)) : ident(q.o.length)); }
function maxPts(q){ return q.type==="mc"?1:(q.type==="cloze"?q.bl.length:q.a.length); }
function isAns(q,sel){ sel=sel||[]; return q.type==="cloze"? sel.some(x=>x!=null) : sel.length>0; }
const TYPE_LABEL={mc:"Multiple choice",sata:"Select all that apply",cloze:"Drop-down cloze"};
function scoreQ(q, sel){
  sel = sel||[];
  if(q.type==="cloze") return q.bl.reduce((s,b,i)=>s+(sel[i]===b.a?1:0),0);
  if(q.type==="mc") return (sel.length===1 && sel[0]===q.a[0])?1:0;
  let s=0; sel.forEach(i=>{ s += q.a.includes(i)?1:-1; }); return Math.max(0,s);
}

/* ---------- timer ---------- */
let tick=null;
function startTimer(){
  stopTimer(); const S=store.session; if(!S||!S.timerOn||S.submitted) { renderTimer(); return; }
  S.lastTick=Date.now();
  tick=setInterval(()=>{ const S=store.session; if(!S){stopTimer();return;} const now=Date.now(); S.remaining=Math.max(0,S.remaining-(now-S.lastTick)/1000); S.lastTick=now; renderTimer(); if(S.remaining<=0){ stopTimer(); save(); alert("Time is up. Your exam will be submitted now."); submitSession(); } else if(Math.floor(S.remaining)%15===0) save(); },1000);
  renderTimer();
}
function stopTimer(){ if(tick){clearInterval(tick); tick=null;} }
function fmt(s){ s=Math.max(0,Math.round(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+":":"")+String(m).padStart(h?2:1,"0")+":"+String(x).padStart(2,"0"); }
function renderTimer(){

}

/* ---------- views ---------- */

function stableRender(){

  );

      el("div",{class:"row"},

  Object.keys(META.modules).forEach(k=>{ const n=Q.filter(q=>String(q.m)===k).length; mg.appendChild(el("label",{class:"choice"},el("input",{type:"checkbox",name:"mod",value:k,checked:true}),` ${META.modules[k]} (${n})`)); });
  modBox.appendChild(mg); f.appendChild(modBox);
  const opts=el("fieldset",{},el("legend",{text:"Options"}));
  const og=el("div",{class:"opt-group"});

  const tchk=el("input",{type:"checkbox",name:"timer"});
  og.appendChild(el("label",{class:"choice"},tchk," Timer"));
  const tmin=el("input",{type:"number",name:"tmin",min:"5",max:"600",value:"",placeholder:"auto",style:"width:80px;border:1px solid var(--line);border-radius:8px;padding:4px 6px","aria-label":"Timer minutes"});
  og.appendChild(el("label",{class:"choice"},"Minutes: ",tmin));
  og.appendChild(el("label",{class:"choice"},el("input",{type:"checkbox",name:"shuffleQ",checked:true})," Shuffle question order"));
  og.appendChild(el("label",{class:"choice"},el("input",{type:"checkbox",name:"shuffleA",checked:true})," Shuffle answer choices each attempt"));
  opts.appendChild(og); f.appendChild(opts);
  f.appendChild(el("p",{class:"small muted",text:`Timer: leave minutes blank for automatic pacing (72 seconds per item—${Math.round(Q.length*1.2)} minutes for all ${Q.length}). Keyboard:`+" A–F or 1–6 to select, Enter to check/next, F to flag, ← → to move."}));
  f.appendChild(el("div",{class:"row"},el("button",{class:"btn",type:"submit"},"Start")));
  app.appendChild(f);
  const syncMods=()=>{ const v=(f.querySelector("input[name=set]:checked")||{}).value; modBox.style.display=v==="modules"?"":"none"; };
  f.addEventListener("change",syncMods); syncMods();
  f.querySelectorAll(".choice input").forEach(i=>{ const upd=()=>{ f.querySelectorAll(".choice").forEach(c=>{const x=c.querySelector("input"); if(x&&x.type!=="number") c.classList.toggle("on",x.checked);}); }; i.addEventListener("change",upd); upd(); });

  if(store.last){
    const L=store.last;
    app.appendChild(el("div",{class:"card"},
      el("h3",{text:"Last result"}),
      el("p",{text:`${L.label} · ${L.mode==="study"?"Study":"Exam"} mode · ${L.pct}% (${L.earned}/${L.max} points) · ${new Date(L.when).toLocaleString()}`}),
      el("div",{class:"row"},el("button",{class:"btn secondary",onclick:()=>go("results")},"Open score report"),el("button",{class:"btn secondary",onclick:()=>{reviewFilter="missed";reviewIdx=0;go("review");}},"Review missed items"))
    ));
  }
  if(store.history && store.history.length>1){
    const t=el("table",{class:"bd"},el("tr",{},el("th",{text:"Date"}),el("th",{text:"Set"}),el("th",{text:"Mode"}),el("th",{text:"Score"})));
    store.history.slice(-8).reverse().forEach(h=>t.appendChild(el("tr",{},el("td",{text:new Date(h.when).toLocaleDateString()}),el("td",{text:h.label}),el("td",{text:h.mode}),el("td",{class:"num",text:h.pct+"%"}))));
    app.appendChild(el("div",{class:"card"},el("h3",{text:"Attempt history"}),t));
  }
  app.appendChild(el("div",{class:"card small muted"},
    el("div",{text:"Scoring: MC = 1 point if correct. SATA = +1 per correct option selected, −1 per incorrect option selected, floor of 0, maximum = number of correct options. Cloze = 1 point per correct drop-down. Overall % = total points earned ÷ total points possible."}),
    el("div",{class:"row",style:"margin-top:10px"},el("button",{class:"btn ghost small",onclick:()=>{ if(confirm("Erase all saved progress, results, and history in this browser?")){ store={session:null,last:null,history:[]}; save(); render(); } }},"Reset all saved data"))
  ));
}
function kpi(v,l){ return el("div",{class:"kpi"},el("div",{class:"v",text:v}),el("div",{class:"l",text:l})); }
function radioGroup(name,label,items){
  const fs=el("fieldset",{},el("legend",{text:label})); const g=el("div",{class:"opt-group"});
  items.forEach(([v,t,c])=>g.appendChild(el("label",{class:"choice"},el("input",{type:"radio",name,value:v,checked:!!c})," "+t)));
  fs.appendChild(g); return fs;
}
function startFromForm(f){
  const fd=new FormData(f); const mode=fd.get("mode"), set=fd.get("set");
  let ids=Q.map(q=>q.id), label=`Full exam (${Q.length})`;
  if(set==="guide"){ ids=Q.filter(q=>q.sg).map(q=>q.id); label=`Study-guide practice (${ids.length})`; }
  if(set==="modules"){ const mods=fd.getAll("mod"); if(!mods.length){alert("Choose at least one module.");return;} ids=Q.filter(q=>mods.includes(String(q.m))).map(q=>q.id); label="Modules "+mods.join(", ")+` (${ids.length})`; }
  if(set==="missed"){ ids=store.last.missed.filter(id=>QBY[id]); ids.sort((a,b)=>QBY[a]._n-QBY[b]._n); label=`Missed-item retake (${ids.length})`; }
  if(set==="flagged"){ ids=store.last.flagged.filter(id=>QBY[id]); ids.sort((a,b)=>QBY[a]._n-QBY[b]._n); label=`Flagged-item review (${ids.length})`; }
  if(fd.get("shuffleQ")){ ids=shuffleKeepCases(ids); }
  if(store.session && !store.session.submitted && !confirm("Starting a new session will replace your saved in-progress session. Continue?")) return;
  const timerOn=!!fd.get("timer"); const auto=Math.max(5,Math.round(ids.length*1.2)); const mins=Math.max(5,Math.min(600,parseInt(fd.get("tmin")||"",10)||auto));
  store.session={label,mode,forwardOnly:!!fd.get("fwd"),timerOn,remaining:mins*60,qids:ids,perm:fd.get("shuffleA")?makePerms(ids):null,idx:0,answers:{},checked:{},flags:{},submitted:false,started:Date.now()};
  save(); go("q"); startTimer();
}
function shuffleKeepCases(ids){
  const blocks=[]; const seen={};
  ids.forEach(id=>{ const q=QBY[id]; if(q.c){ if(!seen[q.c]){ seen[q.c]=[]; blocks.push(seen[q.c]); } seen[q.c].push(id);} else blocks.push([id]); });
  for(let i=blocks.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [blocks[i],blocks[j]]=[blocks[j],blocks[i]]; }
  return blocks.flat();
}

/* ---------- question view ---------- */
function casePanel(q, revealAll){
  const C=CASES[q.c]; const ids=CASEQ[q.c]; const pos=ids.indexOf(q.id);
  const box=el("div",{class:"case"},el("div",{class:"ttl",text:C.title+` — part ${pos+1} of ${ids.length}`}),el("div",{text:C.intro}));
  const prior=ids.slice(0,pos).map(id=>QBY[id]);
  if(prior.length){
    const d=el("details",{open:true},el("summary",{text:`Case progression so far (${prior.length} earlier update${prior.length>1?"s":""})`}));
    prior.forEach((p,i)=>d.appendChild(el("div",{class:"upd"},el("div",{class:"lbl",text:"Update "+(i+1)}),el("div",{text:p.u}))));
    box.appendChild(d);
  }
  box.appendChild(el("div",{class:"upd new"},el("div",{class:"lbl",text:"New information"}),el("div",{text:q.u})));
  return box;
}
function metaTags(q,full){
  const t=el("div",{class:"qmeta"});
  t.appendChild(el("span",{class:"tag"+(q.type==="sata"?" sata":"")+(q.type==="cloze"?" cloze":""),text:TYPE_LABEL[q.type]}));
  if(q.sg) t.appendChild(el("span",{class:"tag sg",text:"📝 From your study guide"}));
  if(full){
    t.appendChild(el("span",{class:"tag",text:META.modules[q.m]}));
    t.appendChild(el("span",{class:"tag",text:"LO "+q.lo}));
    t.appendChild(el("span",{class:"tag",text:q.t}));
    t.appendChild(el("span",{class:"tag",text:"CJMM: "+q.cj}));
    t.appendChild(el("span",{class:"tag",text:DIFF[q.d]}));
  }
  return t;
}
function renderQuestion(){
  const S=store.session; if(!S){go("home");return;}
  const q=QBY[S.qids[S.idx]]; const sel=S.answers[q.id]||[];
  const locked = S.mode==="study" && S.checked[q.id];
  const card=el("div",{class:"card"});
  const done=S.qids.filter(id=>isAns(QBY[id],S.answers[id])).length;
  card.appendChild(el("div",{class:"row",style:"justify-content:space-between"},
    el("div",{class:"small muted",text:`Question ${S.idx+1} of ${S.qids.length}`+(S.qids.length!==Q.length?` · exam item #${q._n}`:"")}),
    el("button",{class:"btn secondary small flagbtn"+(S.flags[q.id]?" on":""),"aria-pressed":S.flags[q.id]?"true":"false",onclick:()=>{toggleFlag(q.id);}},S.flags[q.id]?"⚑ Flagged":"⚐ Flag for review")));
  card.appendChild(el("div",{class:"progress","aria-hidden":"true"},el("i",{style:`width:${100*done/S.qids.length}%`})));
  if(q.c) card.appendChild(casePanel(q));
  card.appendChild(metaTags(q, locked));

  card.appendChild(ul);
  if(!isAns(q,p.sel)) card.appendChild(el("div",{class:"notice",text:"Not answered."}));
  card.appendChild(feedbackBox(q,p.sel,PM));
  card.appendChild(el("div",{class:"navbar"},
    el("button",{class:"btn secondary",disabled:reviewIdx===0,onclick:()=>{reviewIdx--;go("review");}},"← Previous"),
    el("button",{class:"btn",disabled:reviewIdx===list.length-1,onclick:()=>{reviewIdx++;go("review");}},"Next →")));
  app.appendChild(card);
  const g=el("div",{class:"palette"});
  list.forEach((qid,i)=>{ const pp=R.per[qid]; const c="pi "+(pp.e===pp.m?"r-ok":(pp.e>0?"r-part":"r-bad"))+(i===reviewIdx?" cur":""); g.appendChild(el("button",{class:c,onclick:()=>{reviewIdx=i;go("review");},"aria-label":"Item "+(R.qids.indexOf(qid)+1)},String(R.qids.indexOf(qid)+1))); });
  app.appendChild(el("div",{class:"card"},el("h3",{text:"Items in this view",style:"margin-top:0"}),el("p",{class:"small muted",text:"Green = full credit · amber = partial · red = no credit"}),g));
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  if(e.target && (e.target.tagName==="INPUT"||e.target.tagName==="SELECT"||e.target.tagName==="TEXTAREA"||e.target.id==="themeBtn")) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(view==="q"){
    const S=store.session; if(!S) return; const q=QBY[S.qids[S.idx]]; const locked=S.mode==="study"&&S.checked[q.id];
    const k=e.key.toUpperCase();
    let i=LETTERS.indexOf(k); if(i<0 && /^[1-6]$/.test(e.key)) i=parseInt(e.key,10)-1;
    if(q.type!=="cloze" && i>=0 && i<q.o.length && !locked){ e.preventDefault(); choose(q,permOf(q,S.perm)[i]); return; }
    if(k==="F"){ e.preventDefault(); toggleFlag(q.id); return; }
    if(e.key==="ArrowRight"){ if(S.idx<S.qids.length-1){ e.preventDefault(); move(1);} return; }
    if(e.key==="ArrowLeft"){ if(!S.forwardOnly){ e.preventDefault(); move(-1);} return; }
    if(e.key==="Enter" && !(e.target&&e.target.classList&&e.target.classList.contains("opt"))){
      if(e.target && e.target.tagName==="BUTTON") return;
      e.preventDefault();
      if(S.mode==="study" && !locked && isAns(q,S.answers[q.id])){ checkAnswer(q); return; }
      if(S.idx<S.qids.length-1) move(1); else go("submit");
    }
  } else if(view==="review"){
    if(e.key==="ArrowRight"){ reviewIdx++; go("review"); }
    if(e.key==="ArrowLeft"){ reviewIdx=Math.max(0,reviewIdx-1); go("review"); }
  }
});
window.addEventListener("beforeunload",()=>{ const S=store.session; if(S&&S.timerOn&&tick){ const now=Date.now(); S.remaining=Math.max(0,S.remaining-(now-S.lastTick)/1000); S.lastTick=now; } save(); });
document.addEventListener("visibilitychange",()=>{ if(document.hidden) save(); });

render();
})();
</script>
</body>
