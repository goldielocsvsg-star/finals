N safety means never making a mistake.” Which response is most accurate?","r":"The course answer key marks “QSEN defines safety as avoiding errors at all costs” as false. QSEN safety means minimizing risk of harm through both system effectiveness and individual performance, recognizing that humans make errors and systems must be designed to catch them.","o":["“QSEN focuses on cost reduction rather than safety.”","“QSEN defines safety as minimizing risk of harm through both systems and individual performance.”","“QSEN safety applies only to medication administration.”","“That’s correct; competent nurses never make errors.”"],"a":[1],"w":["QSEN focuses on quality and safety competencies.","Correct — minimizing risk of harm.","Safety spans all care.","Unrealistic and contradicts systems thinking."],"src":"Econ/Quality Answer Key (STEEEP; Triple Aim; Donabedian; QSEN safety); PCAP Module 3 — NDNQI, QSEN, High Reliability Organizations · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"M5-08","m":5,"lo":"5.4","t":"Just Culture — behavior types","cj":"Prioritize Hypotheses","d":3,"type":"mc","s":"Three nurses are involved in separate events: Nurse A transposed digits on a pump despite following every step; Nurse B routinely skips barcode scanning when busy because “everyone does”; Nurse C knowingly gave a double dose to “get the patient to sleep” against orders. Which response is consistent with Just Culture?","r":"Just Culture distinguishes human error (console), at-risk behavior—drifting from safe practice when the risk isn’t recognized or is believed justified (coach and remove the system incentives)—and reckless behavior—conscious disregard of substantial risk (sanction). It is not blame-free; it balances learning and accountability.","o":["Discipline all three nurses equally to show errors are not tolerated","Take no action for any of them because Just Culture is blame-free","Console Nurse A, coach Nurse B and fix the system drift, and consider disciplinary action for Nurse C","Coach Nurse A, console Nurse B, and console Nurse C"],"a":[2],"w":["Punitive culture suppresses reporting.","Just Culture is not blame-free; reckless acts are held accountable.","Correct — the response matches the behavior type.","Mismatches the behavior types."],"src":"Module 5 slides — “Just Culture” (shared accountability, psychological safety); Boot Camp §10 (human error vs. at-risk vs. reckless behavior) · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"M6-25","m":6,"lo":"6.1","t":"Team leadership","cj":"Take Action","d":3,"type":"sata","s":"A charge nurse is the team leader during a busy shift with two new admissions and a deteriorating patient. Which actions reflect TeamSTEPPS team leadership? Select all that apply.","r":"Team leadership maximizes team effectiveness by holding a brief so actions are understood, sharing changes in information promptly, ensuring resources, and rebalancing workload when a patient deteriorates. Skipping the brief or personally taking over every task overloads the leader and reduces situational awareness.","o":["Ensure team members have the resources they need, such as an extra monitor","Reallocate assignments when the deteriorating patient needs one-to-one care","Personally take over the deteriorating patient’s care and the two admissions","Skip the start-of-shift brief to save time for the admissions","Share changes in information, such as a new isolation patient, with the whole team promptly"],"a":[0,1,4],"w":["Correct — resource management.","Correct — workload balancing.","Overloads the leader and reduces situational awareness.","Skipping the brief prevents a shared understanding of the plan.","Correct — information sharing."],"src":"Module 6 Communication & Collaboration slides — TeamSTEPPS framework (four skills; knowledge/attitude/performance outcomes; multi-team systems) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"M2-20","m":2,"lo":"2.4","t":"Conflict on the team","cj":"Take Action","d":2,"type":"mc","s":"Two nurses on the same team argue loudly at the nurses’ station about who should take a new admission. Patients’ family members can hear them. What should the charge nurse do first?","r":"The immediate priorities are to protect patient privacy and dignity and to ensure the admission is not delayed. The charge nurse makes a fair assignment decision now and addresses the underlying conflict later in a constructive, private conversation.","o":["Wait until the end of the shift to discuss the issue","Report both nurses to human resources","Take the admission herself so the argument ends immediately and neither nurse feels the assignment was unfair","Move the discussion to a private area, assign the admission based on acuity, and follow up later"],"a":[3],"w":["The admission and the public disruption need action now.","Premature escalation before addressing the behavior directly.","Avoids the conflict and overloads the charge nurse.","Correct — protects privacy, resolves the immediate need, plans follow-up."],"src":"PCAP Module 2 — Addressing and Preventing Bullying and Incivility (individual steps; employer responsibilities) · Final Exam Study Guide, Module 2 (leader vs. manager, leadership theories, prioritization, 5 rights, EAT)"},{"id":"M3-19","m":3,"lo":"3.6","t":"Regulatory comment","cj":"Generate Solutions","d":3,"type":"mc","s":"A federal agency has published a proposed rule that would reduce reimbursement for nurse-led transitional-care visits. The bill authorizing the program passed last year. Where can nurses most effectively influence the outcome now?","r":"After a bill becomes law, the implementing agency writes regulations. Proposed rules are published in the Federal Register with a comment period, and each comment must be considered before final rules are issued. This is a critical, often overlooked advocacy window.","o":["By filing a lawsuit before the rule is final","By asking Congress to re-vote on the original bill","By submitting evidence-based comments during the public comment period listed in the Federal Register","By testifying at the next congressional hearing on the original legislation"],"a":[2],"w":["Premature; there is no final rule to challenge.","Congress already acted; re-votes are unlikely.","Correct — the regulatory comment period is the active window.","The statute is already law; influence now lies in the rulemaking comment period."],"src":"PCAP Module 3 — Grassroots Political Strategies (visit policymakers; join professional organizations; how to address legislators) · Final Exam Study Guide, Module 3 (health policy, micro vs. macro advocacy, evidence-informed recommendations)"},{"id":"M2-10","m":2,"lo":"2.5","t":"Five rights of delegation","cj":"Prioritize Hypotheses","d":3,"type":"mc","s":"An RN asks a UAP to “check on Mr. P in 12 every so often.” Two hours later, Mr. P is found hypoglycemic and diaphoretic; the UAP says she checked on him and he “seemed sleepy.” Which right of delegation was most clearly violated?","r":"Direction must be clear and specific: what to do, when, what to report, and the limits of the role. “Check on him every so often” gave no parameters, so the UAP could not recognize that sleepiness was a change to report. The RN retains accountability for clear communication and supervision.","o":["Right direction/communication","Right circumstance","Right person","Right task"],"a":[0],"w":["Correct — vague instructions with no reporting parameters.","Nothing indicates the patient was unstable at the time of delegation.","Nothing suggests the UAP was unqualified.","Observing a patient is an appropriate UAP task."],"src":"Boot Camp §05 (five rights of delegation; RN keeps assessment, evaluation, teaching); PNC Module 7 legal chapter — Personal Liability in Delegation and Supervision · Final Exam Study Guide, Module 2 (leader vs. manager, leadership theories, prioritization, 5 rights, EAT)"},{"id":"G-56","m":6,"lo":"6.6","t":"Assigning a float nurse","cj":"Generate Solutions","d":2,"type":"sata","s":"Before assigning a float nurse from the orthopedic unit, what should the charge nurse consider? Select all that apply.","r":"Assign float nurses patients who need general skills similar to their home unit, at a stable level of acuity, with orientation to unfamiliar equipment and a resource nurse. Avoid specialized, unit-specific procedures they are not checked off on. Escalate if no safe assignment is possible.","sg":"PCAP Study Guide — worksheet Module 6 (19)","o":["The float nurse’s demonstrated competencies and home-unit skills","Familiarity with unit-specific equipment and policies, with orientation if needed","Giving the float nurse the heaviest assignment because she is new to the unit’s patients","Available support, such as a resource or buddy nurse","Patient acuity and stability"],"a":[0,1,3,4],"w":["Correct — match the assignment to proven competence.","Correct — avoid unfamiliar specialty equipment.","Overloads the nurse least familiar with the unit.","Correct — someone to ask improves safety.","Correct — stable patients are better matches."],"src":"PCAP Study Guide — worksheet Module 6 (19) · PCAP Module 3 — Workforce Advocacy: Safe Staffing, Box 13.3 (questions before employment), Box 13.5 (questions before accepting an assignment), Floating and Mandatory Overtime; PNC Module 7 — Floating and Cross-Training (Winkelman; Francis); PCAP Module 3 — Workplace Safety (violence, fatigue) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"Z3-04","m":3,"lo":"3.7","t":"Evidence-informed policy recommendation","cj":"Generate Solutions","d":3,"type":"cloze","s":"Case: A nurse is preparing a recommendation to the hospital’s board to fund a nurse-led heart failure transitions clinic.","r":"Per the course guide, an evidence-informed policy recommendation defines the problem and affected population, describes the evidence and inequities, compares options (feasibility, cost, unintended consequences, implementation), and states a specific recommendation with measurable outcomes.","tpl":"She should first {0}, then {1}, and conclude with {2}.","bl":[{"o":["list the staff members who have endorsed the idea","state the total budget amount she will request","define the problem and affected population with local data","open with her personal preference for the clinic model"],"a":2,"w":"Defining the problem and affected population is the starting point."},{"o":["avoid costs so the board focuses on patient benefit","compare options on evidence, cost, and feasibility","describe only the option she prefers in detail","cite colleagues’ opinions gathered on social media"],"a":1,"w":"Decision-makers need options compared on evidence, cost, and feasibility."},{"o":["a specific recommendation with measurable outcomes","a list of complaints about current discharge care","a general call for better heart failure care","a request to revisit the topic next year"],"a":0,"w":"A specific recommendation with measurable outcomes allows evaluation."}],"src":"PCAP Module 3 — Health Policy and Politics; Grassroots Political Strategies · Final Exam Study Guide, Module 3 (health policy, micro vs. macro advocacy, evidence-informed recommendations)"},{"id":"M4-21","m":4,"lo":"4.2","t":"Uninsured patient financial support","cj":"Generate Solutions","d":2,"type":"sata","s":"An uninsured patient who recently lost his job receives a $50,000 bill after a myocardial infarction and stent. Which resources should the nurse and case manager explore? Select all that apply.","r":"Options for an uninsured patient include hospital charity care, bill negotiation or payment plans, and screening for Medicaid or state programs. Losing job-based coverage also qualifies a person for a Marketplace special enrollment period. Delaying or skipping cardiac rehabilitation increases readmission risk and long-term cost.","o":["Hospital charity care or financial-assistance programs","Advising him to delay cardiac rehabilitation until he has coverage","Negotiating a reduced bill or setting up a payment plan","Marketplace enrollment through a special enrollment period after job loss","Screening for Medicaid or state-based programs given his new income"],"a":[0,2,3,4],"w":["Correct — charity care.","Delaying tertiary prevention increases readmission risk and long-term cost.","Correct — bill reduction or a payment plan.","Correct — job loss is a qualifying event.","Correct — eligibility may have changed."],"src":"Module 4 slides — Medicare Parts A–D and Medigap, Medicaid/CHIP, ACA provisions, Case Studies 1, 2 & 5; Health Care Law Worksheet — EMTALA and ACA · Final Exam Study Guide, Module 4 (Medicare A–D, Medicaid, HMO/PPO/EPO, stewardship, value-based care)"},{"id":"M6-26","m":6,"lo":"6.5","t":"Interprofessional communication failure","cj":"Prioritize Hypotheses","d":3,"type":"mc","s":"During ED-to-floor transfer, the ED provider tells the hospitalist that the patient “seems confused,” but the nurse-to-nurse handoff omits this. Which failure category does this best represent, and what is the most important consequence?","r":"Information shared on one communication channel (provider to provider) but not transmitted through the nursing handoff is a handoff/communication-process failure. The receiving nurse lacks a key baseline—new confusion—affecting fall precautions, delirium detection, medication teaching, and capacity for consent.","o":["Escalation culture; the provider may be reported","Handoff failure; missed delirium and fall risk","Language barrier; the patient will need an interpreter","Role clarity; the patient may receive duplicate medications because two providers are giving orders"],"a":[1],"w":["Not about escalation.","Correct — a handoff gap with significant safety consequences.","Language is a separate issue from the omitted cognitive change.","Not primarily role confusion."],"src":"Module 6 slides — opening case (ED provider’s “seems confused” not communicated in nursing handoff) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"M3-06","m":6,"lo":"6.6","t":"Nurse fatigue","cj":"Take Action","d":2,"type":"mc","s":"At the end of a 12-hour night shift, a nurse is asked by the manager to stay another 8 hours because of call-outs. She has worked 48 hours this week and feels drowsy. Which response aligns with the ANA position on nurse fatigue?","r":"The ANA recommends limiting work to no more than 12 hours in 24 and 40 hours in a week and eliminating mandatory overtime. The nurse has an ethical duty to recognize fatigue that impairs safe practice and to decline while supporting alternatives. Leaving without communication is unprofessional.","o":["Agree to stay 4 more hours as a compromise while the supervisor finds coverage","Agree to stay because refusing would be unprofessional","Stay for the extra 8 hours but use caffeine, take a short nap at break, and avoid high-risk tasks like IV pushes","Decline the extra shift, explain the fatigue risk to patients, and help find coverage"],"a":[3],"w":["Still extends a fatigued nurse past safe limits (more than 12 hours in 24).","Fatigue increases errors; declining here is professional.","Caffeine does not reverse fatigue-related impairment.","Correct — protects patients and communicates appropriately."],"src":"PCAP Module 3 — Workforce Advocacy: Safe Staffing, Box 13.3 (questions before employment), Box 13.5 (questions before accepting an assignment), Floating and Mandatory Overtime; PNC Module 7 — Floating and Cross-Training (Winkelman; Francis); PCAP Module 3 — Workplace Safety (violence, fatigue) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"Z7-04","m":7,"lo":"7.7","t":"Ethical principles","cj":"Analyze Cues","d":2,"type":"cloze","s":"Case: A competent patient declines a recommended blood transfusion after the provider explains risks and alternatives. Later, she asks the nurse whether her test results are back, and the nurse answers honestly. During a staffing shortage, the charge nurse distributes assignments based on patient acuity rather than seniority.","r":"Core principles: autonomy (self-determination), beneficence (do good), nonmaleficence (do no harm), justice (fairness), veracity (truthfulness), and fidelity (keeping commitments).","tpl":"Honoring the transfusion refusal reflects {0}. Answering the question honestly reflects {1}. Assigning patients by acuity reflects {2}.","bl":[{"o":["autonomy","nonmaleficence","beneficence","fidelity"],"a":0,"w":"Autonomy respects a competent patient’s informed choices, including refusal."},{"o":["fidelity","justice","beneficence","veracity"],"a":3,"w":"Veracity is truth-telling."},{"o":["autonomy","fidelity","justice","veracity"],"a":2,"w":"Justice is fair, equitable distribution of resources and care."}],"src":"PNC Module 7 ethics chapter — Ethical Theory (utilitarianism, deontology), Ethical Principles (autonomy, beneficence/nonmaleficence, veracity), Box 9.3 Situation Assessment Procedure · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"M1-05","m":1,"lo":"1.2","t":"Health disparities classification","cj":"Prioritize Hypotheses","d":3,"type":"mc","s":"A quality nurse reviews pain data and finds that patients with limited English proficiency receive opioid analgesia after major surgery 40% less often than English-speaking patients with identical procedures and pain scores. Based on the Giddens disparity framework, how should this finding be classified and what is the priority response?","r":"A disparity that is preventable with existing strategies and that imposes unnecessary suffering is avoidable and unacceptable—the category that should be the target of intervention. Language barriers and biased clinical decision-making are named contributors, so the fix is system-level: interpreter-supported assessment and practice audits.","o":["Avoidable and unacceptable; target it with interpreter-supported assessment and a prescribing audit","Unavoidable and unacceptable; refer the finding to the ethics committee, which is responsible for reviewing inequities in care","Unavoidable and acceptable; differences in pain expression across cultures explain the gap","Avoidable and acceptable; language differences make some variation in analgesic use expected"],"a":[0],"w":["Correct — classifies accurately and intervenes at the system level.","The disparity is avoidable; discussion alone is not an intervention.","Explaining the gap away as culture ignores language access and bias as causes.","An avoidable disparity that imposes needless suffering is not acceptable."],"src":"Module 1 Study Guide §II–III (equality vs. equity; disparities = the problem, equity = the goal; SDOH); PCAP Module 1 — Giddens Health Disparities concept (unavoidable/avoidable × acceptable/unacceptable) · Final Exam Study Guide, Module 1 (SDOH, equity, prevention, HBM, care coordination, emergency response)"},{"id":"M6-19","m":6,"lo":"6.1","t":"Multi-team systems","cj":"Generate Solutions","d":3,"type":"mc","s":"A patient with diabetes, heart failure, and depression receives care from a PCP, a cardiologist, a home health nurse, and a community mental health counselor in different organizations. Which strategy best supports the multi-team system?","r":"Multi-team systems, especially outside hospitals, often lack a single core team and include multiple leaders and virtual teams. Team leadership in this context means coordinating across teams with a shared plan, clear points of contact, and structured communication.","o":["Ask the patient to relay information between providers","Have the PCP mail a summary letter after each specialist visit","A care coordinator and a shared care plan","Let each team manage its own goals independently so that every specialist can focus on their area"],"a":[2],"w":["Places a communication burden on the patient.","One-way, delayed communication does not create a shared plan.","Correct — a shared plan with a single point of contact links the separate teams.","Fragmentation risks conflicting plans."],"src":"Module 6 Communication & Collaboration slides — TeamSTEPPS framework (four skills; knowledge/attitude/performance outcomes; multi-team systems) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"M6-05","m":6,"lo":"6.2","t":"Teach-back","cj":"Take Action","d":1,"type":"mc","s":"A nurse finished teaching a patient how to use a new inhaler. Which statement uses the teach-back method correctly?","r":"Teach-back confirms that the sender explained the information clearly by asking the patient to explain or demonstrate in their own words. It puts the responsibility on the teacher, not the learner. Yes/no and leading questions do not verify understanding.","o":["“Do you understand how to use your inhaler?”","“Can you show me how you’ll use it at home?”","“Call us if you have any questions after you get home.”","“You know to shake it first, right?”"],"a":[1],"w":["A yes/no question does not verify understanding.","Correct — the patient demonstrates in their own way.","Does not assess current understanding.","A leading question."],"src":"Module 6 slides — SBAR, Call-Out, Check-Back, Teach-Back, Handoff; Boot Camp §11 (read-back for critical messages) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"Z5-01","m":5,"lo":"5.1","t":"Classifying safety events","cj":"Analyze Cues","d":3,"type":"cloze","s":"Case: Nurse A scans a vial and realizes it is the wrong dose before giving it. Nurse B gives an extra dose of a stool softener with no effect on the patient. Nurse C’s patient dies after a surgical sponge is left inside.","r":"Errors include near misses (caught before reaching the patient), no-harm events, adverse events (harm from care), and sentinel events (death or serious physical/psychological harm). All should be reported through the safety system; incident reports are never referenced in the medical record.","tpl":"Nurse A’s event is a {0}. Nurse B’s event is an error that reached the patient {1}. Nurse C’s event is a {2}.","bl":[{"o":["sentinel event","never event only","near miss","adverse event"],"a":2,"w":"An error caught before reaching the patient is a near miss."},{"o":["but caused no harm","and caused permanent harm","and must be reported to the Board","and meets sentinel criteria"],"a":0,"w":"A no-harm event still must be reported for learning."},{"o":["minor incident","near miss","sentinel event","no-harm event"],"a":2,"w":"Death or serious harm (e.g., retained foreign object) is a sentinel event requiring immediate investigation."}],"src":"Module 5 Quality & Safety slides — “Terms to Know” (near miss, adverse, sentinel, never event); Healthcare Quality & Safety Review Worksheet and Answer Key · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"N9-06","m":9,"lo":"9.3","t":"Lifelong learning & professional development","cj":"Generate Solutions","d":2,"type":"mc","s":"Six months after graduation, a nurse feels overwhelmed and says, “I passed the NCLEX, so I should know everything by now.” Her residency coordinator wants to support her professional development. Which plan is most appropriate?","r":"Professional identity and competence develop through mentorship, reflection, feedback, continuing education, evidence-based practice, and residency programs. Passing the NCLEX establishes entry-level competence, not lifelong expertise. Certification usually requires experience and does not replace ongoing development; avoiding questions undermines safety.","o":["Recommend she pursue specialty certification now to prove her competence","Advise her to avoid asking questions so she builds confidence independently","Pair her with a mentor, schedule guided reflection, and set targeted CE goals","Move her to a less acute unit until she feels like an expert"],"a":[2],"w":["Certification typically requires specialty experience and does not address her transition needs.","Avoiding questions creates safety risks and slows growth.","Correct — mentorship, reflection, and targeted continuing education.","Transfer does not build the skills she needs; expertise develops over time with support."],"src":"PNC Modules 8–9 — Giddens Professional Identity concept (formation through experience, reflection, mentorship) · Final Exam Study Guide, Module 9 (licensure, BON/NPA, NCLEX/NLC, certification, ANA Code, Benner, lifelong learning)"},{"id":"M7-07","m":7,"lo":"7.2","t":"Criminal negligence","cj":"Prioritize Hypotheses","d":3,"type":"mc","s":"Which situation is most likely to expose a nurse to a charge of criminal negligence?","r":"Criminal negligence applies when negligent acts are so reckless that they result in serious harm or death—conduct showing conscious disregard of substantial risk. The textbook’s examples (for example, the Wisconsin epidural-via-IV case) involved bypassing available safeguards and caused death.","o":["A patient falls despite all fall precautions being in place","Overriding safety alerts and causing death by wrong route","A nurse documents a pain reassessment she did not perform; no harm results","A nurse makes a tenfold calculation error on a heparin dose that is caught by the pharmacist before it is given"],"a":[1],"w":["No breach of the standard of care.","Correct — reckless disregard of safeguards causing death.","Falsification is a Board and ethics issue, but criminal negligence requires reckless conduct causing serious harm or death.","A near miss caught by the system."],"src":"PNC Module 7 legal chapter — Criminal Negligence (Colorado penicillin case; Wisconsin epidural-via-IV case) · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"M6-06","m":6,"lo":"6.2","t":"Handoff essentials","cj":"Recognize Cues","d":3,"type":"sata","s":"A nurse is receiving a transfer handoff for an older adult admitted with heart failure. Which items are safety-critical and must be included in the handoff? Select all that apply.","r":"Handoffs transfer information, authority, and responsibility. Safety-critical content includes changes in cognition, recent medications with fall risk (diuretic plus fall history), pending tasks such as incomplete reconciliation, and communication needs. A vague “stable, probably going home” is an opinion that can create false reassurance.","o":["Medication reconciliation incomplete","Received IV furosemide 2 hours ago, with a history of falls","Primary language is Spanish; the patient needs an interpreter","“Stable and probably going home tomorrow”","The patient’s home address and emergency contact","New-onset confusion noted by the ED provider"],"a":[0,1,2,5],"w":["Correct — a pending safety task.","Correct — fall risk from diuresis and history.","Correct — communication need.","A subjective impression, not essential safety data.","Available in the chart; not safety-critical handoff content.","Correct — a cognition change."],"src":"Module 6 slides — SBAR, Call-Out, Check-Back, Teach-Back, Handoff; Boot Camp §11 (read-back for critical messages) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"M8-18","m":8,"lo":"8.5","t":"Wearables & remote data","cj":"Take Action","d":3,"type":"mc","s":"A patient’s smartwatch sends a notification of possible atrial fibrillation during a telehealth visit. The patient feels fine. What is the best nursing response?","r":"Wearables (for example, watches with ECG features) provide useful data but require clinical verification. The nurse neither dismisses nor over-relies on device data: assess, then confirm with a standard diagnostic test.","o":["Dismiss the alert because consumer wearables cannot detect rhythms","Reassure the patient that consumer devices are highly accurate and begin anticoagulation teaching","Advise him to go directly to the ED for cardioversion","Assess, then confirm with a 12-lead ECG"],"a":[3],"w":["Some wearables are FDA-cleared for rhythm detection; dismissing them misses a risk.","Over-relies on unconfirmed data.","He is asymptomatic and stable; confirm the rhythm with an ECG first.","Correct — integrate device data with clinical verification."],"src":"PNC Modules 8–9 — Point-of-Care Technology, Wearables, Telehealth (synchronous vs. asynchronous), Consumer Health IT; Module 5 slides — Technology and Patient Safety · Final Exam Study Guide, Module 8 (HIT, AI applications, benefits/risks, ethical and legal concerns)"},{"id":"N8-03","m":8,"lo":"8.6","t":"Algorithmic bias","cj":"Recognize Cues","d":3,"type":"mc","s":"A unit’s quality nurse finds that an AI pressure-injury risk model flags far fewer high-risk patients with darker skin tones than nurse assessments do, and stage 2 injuries in this group are rising. What is the most likely explanation and best response?","r":"AI models trained on non-diverse data can systematically underperform for some groups (algorithmic bias), worsening disparities—early erythema is harder to detect on darker skin, so missed risk is plausible. Nurses should escalate unsafe or biased outputs through governance and use their own assessment rather than defer to the score.","o":["Possible algorithmic bias; report it to AI governance and rely on full skin assessment","The model is accurate, and nurses are over-assessing risk in this group","The difference is random variation and should simply be monitored for another full year","Darker skin heals faster, so the lower risk scores are clinically appropriate"],"a":[0],"w":["Correct — recognize bias, escalate, and rely on assessment.","Rising injuries contradict the model’s lower risk estimates.","Waiting allows preventable harm to continue.","Inaccurate and itself a biased assumption."],"src":"PNC Modules 8–9 — Health IT concept and IT in the Clinical Setting (clinical decision support, technology and judgment) · Final Exam Study Guide, Module 8 (HIT, AI applications, benefits/risks, ethical and legal concerns)"},{"id":"G-51","m":4,"lo":"4.2","t":"Medicare eligibility","cj":"Analyze Cues","d":2,"type":"mc","s":"A 48-year-old patient on hemodialysis for end-stage renal disease says, “I can’t get Medicare until I’m 65.” Which response is accurate?","r":"Medicare is a federal program for adults 65 and older, certain people with qualifying disabilities, and people with end-stage renal disease. Medicaid is a separate joint federal–state program for low-income groups, with eligibility varying by state; some people qualify for both.","o":["“Only people receiving Social Security retirement benefits can get Medicare.”","“You may qualify now, because Medicare also covers people with ESRD.”","“You’ll need to enroll in Medicaid, because Medicare excludes dialysis.”","“That’s right—Medicare starts only at age 65.”"],"a":[1],"w":["Eligibility also includes disability and ESRD.","Correct — ESRD is a qualifying condition.","Medicare covers dialysis for eligible ESRD patients.","Certain younger people qualify."],"src":"Module 4 slides — Medicare Parts A–D and Medigap, Medicaid/CHIP, ACA provisions, Case Studies 1, 2 & 5; Health Care Law Worksheet — EMTALA and ACA · Final Exam Study Guide, Module 4 (Medicare A–D, Medicaid, HMO/PPO/EPO, stewardship, value-based care)"},{"id":"M8-05","m":8,"lo":"8.1","t":"Health IT vs. informatics","cj":"Analyze Cues","d":2,"type":"mc","s":"A hospital installs new bedside computers and wireless infrastructure. A nurse informaticist then analyzes fall-risk data entered into the EHR to redesign the documentation workflow and build a predictive alert. Which statement best distinguishes these activities?","r":"Health IT is the hardware, software, and infrastructure for storing and exchanging health information. Informatics is the science of transforming data into information, knowledge, and wisdom to support decision-making. Health IT is an antecedent to informatics.","o":["Hardware is health IT; data analysis is informatics","Both activities are informatics, because any use of computers to manage health data is informatics","Installing hardware is informatics; data analysis is health IT","Both activities are health IT because they occur in a hospital"],"a":[0],"w":["Correct — infrastructure vs. knowledge generation.","Computers alone do not make an activity informatics.","Reverses the definitions.","Data analysis for decisions is informatics."],"src":"PNC Modules 8–9 — Giddens Health IT/Informatics concept (health IT vs. informatics; standardized terminology; data → wisdom) · Final Exam Study Guide, Module 8 (HIT, AI applications, benefits/risks, ethical and legal concerns)"},{"id":"M4-12","m":4,"lo":"4.4","t":"Cost vs. charge","cj":"Analyze Cues","d":3,"type":"mc","s":"A patient is shocked that a pair of non-slip socks costing the hospital about $1.25 appears on her bill at $28. Which explanation from the course best accounts for this difference?","r":"Charges differ from costs because of procurement, overhead (facility, staff, sterilization), chargemaster markup that anticipates negotiated discounts, and cost-shifting when public payers reimburse below cost. Uninsured patients are often billed full chargemaster prices.","o":["The price reflects a sterile, single-patient product required by infection-control rules","Medicare sets hospital charges and requires all patients to be billed the same rate","The patient was billed in error because charges must equal costs","Chargemaster markup covers overhead and payer discounts, and costs are shifted from lower public payments"],"a":[3],"w":["Regulations do not explain a ~22-fold difference; markup, overhead, and cost-shifting do.","Medicare sets its own payment rates; it does not set a hospital’s chargemaster.","Charges routinely exceed costs.","Correct — markup, overhead, and cost-shifting."],"src":"Module 4 slides — Hospital non-slip socks example and How Cost vs. Charge Differences Arise · Final Exam Study Guide, Module 4 (Medicare A–D, Medicaid, HMO/PPO/EPO, stewardship, value-based care)"},{"id":"M8-09","m":8,"lo":"8.2","t":"CPOE benefits","cj":"Evaluate Outcomes","d":2,"type":"sata","s":"Six months after implementing CPOE, which outcomes would demonstrate expected benefits? Select all that apply.","r":"CPOE eliminates illegible handwriting and lost orders, automatically generates related orders, and checks for duplicate or contradictory orders, improving efficiency. It reduces—but does not eliminate—medication errors, and it does not replace pharmacist verification or nursing assessment before administration.","o":["Elimination of the need for pharmacist verification of orders","Elimination of transcription errors caused by illegible handwriting","Automatic generation of a monitoring lab order when a high-risk drug is ordered","Fewer bedside assessments needed before medication administration","Elimination of all medication errors on the unit"],"a":[1,2],"w":["Pharmacist verification remains an essential safety layer.","Correct — legibility.","Correct — related order generation.","CPOE does not replace nursing assessment.","CPOE reduces certain errors but cannot eliminate all of them."],"src":"PNC Modules 8–9 — Information Technology in the Clinical Setting: Clinical Decision Support (alert fatigue), CPOE, EHR data management · Final Exam Study Guide, Module 8 (HIT, AI applications, benefits/risks, ethical and legal concerns)"},{"id":"G-16","m":7,"lo":"7.2","t":"Elements of malpractice","cj":"Recognize Cues","d":2,"type":"mc","s":"Which set lists elements that must be proven in a professional malpractice claim?","r":"Malpractice is professional negligence. The common four-element version is duty, breach, causation, and damages. Your PCAP guide teaches five—duty, breach, foreseeability, causation, and damages—with foreseeability meaning the nurse could reasonably anticipate that the breach might cause harm. Every element must be proven: no damages, no successful claim. If an exam answer lists five elements, choose the one with foreseeability.","sg":"Final Study Guide & Practice — practice Q16","o":["Duty, intent, causation, and damages","Breach, consent, causation, and compensation","Duty, breach of duty, causation, and damages","Standard of care, policy violation, harm, and reimbursement"],"a":[2],"w":["Intent belongs to intentional torts, not malpractice.","Consent and compensation are not malpractice elements.","Correct — the core elements (your course adds foreseeability as a fifth).","Mixes terms; policy and reimbursement are not elements."],"src":"Final Study Guide & Practice — practice Q16 · PNC Module 7 legal chapter — elements of negligence/malpractice, res ipsa loquitur, gross and criminal negligence, Good Samaritan immunity, vicarious liability (respondeat superior); Health Care Law Worksheet · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"Z5-02","m":5,"lo":"5.4","t":"Just Culture response","cj":"Take Action","d":3,"type":"cloze","s":"Case: Because the unit’s only barcode scanner has a dead battery and the spare charger is broken, a nurse overrides scanning and gives a medication to the wrong patient. Several nurses admit they do the same when equipment fails.","r":"Just Culture balances accountability and learning: human error (inadvertent slip) → console and fix the system; at-risk behavior (shortcuts or drift) → coach and remove incentives for shortcuts; reckless behavior (conscious disregard of substantial risk) → disciplinary action.","tpl":"This nurse’s behavior is best classified as {0}. The manager should {1}, and the system fix is to {2}.","bl":[{"o":["criminal negligence","at-risk behavior","reckless behavior","human error"],"a":1,"w":"A shortcut taken while believing the risk is justified—a drift common on the unit—is at-risk behavior."},{"o":["coach the nurse on the risks of workarounds","terminate the nurse","report the nurse to the Board","console the nurse and take no other action"],"a":0,"w":"At-risk behavior calls for coaching."},{"o":["ban overrides without addressing equipment","require a written apology from the involved nurse","repair equipment and stock working backup scanners","post signs reminding nurses to always scan every dose"],"a":2,"w":"Removing the conditions that drive workarounds prevents recurrence."}],"src":"Module 5 slides — “Just Culture” (shared accountability, psychological safety); Boot Camp §10 (human error vs. at-risk vs. reckless behavior) · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"M1-15","m":1,"lo":"1.5","t":"Public health campaign evaluation","cj":"Evaluate Outcomes","d":2,"type":"sata","s":"Six months after launching a county smoking-cessation campaign, the nurse coalition is evaluating effectiveness. Which data are valid indicators of campaign success? Select all that apply.","r":"Public health campaigns should have measurable outcomes: behavior change (quitline use) and reduced risk prevalence. Outputs such as posters printed, press releases issued, or online “likes” measure activity, not health impact.","o":["Increase in the number of campaign press releases issued","Increase in quitline enrollment among county residents","Number of posters printed and distributed","Decline in self-reported adult smoking prevalence on the county health survey","Positive comments on the campaign’s social media page"],"a":[1,3],"w":["An output (activity), not a health outcome.","Correct — measurable behavior change.","An output (activity), not an outcome.","Correct — a population outcome.","Engagement does not demonstrate health behavior change."],"src":"Module 1 Study Guide §VII–VIII (population vs. individual focus; public health campaigns and indicators of success) · Final Exam Study Guide, Module 1 (SDOH, equity, prevention, HBM, care coordination, emergency response)"},{"id":"M3-14","m":3,"lo":"3.4","t":"Professionalism vs. unionization","cj":"Evaluate Outcomes","d":3,"type":"sata","s":"A nurse is deciding whether to support a union drive in a right-to-work state. Which statements are accurate considerations? Select all that apply.","r":"Collective bargaining equalizes power between employees and employers; members typically pay dues that fund union activities; right-to-work laws prevent compulsory membership. During organizing, management may not threaten, interrogate, promise benefits, or spy. The Nurse Practice Act applies to every licensed nurse—union contracts never replace it.","o":["Union members typically pay dues that may support organizing and political activity","In a right-to-work state, nurses cannot be compelled to join the union as a condition of employment","Union contracts replace the Nurse Practice Act for members","Managers may promise raises to nurses who vote against the union","Collective bargaining is a method to equalize power between employees and employers"],"a":[0,1,4],"w":["Correct — the financial reality of membership.","Correct — the right-to-work provision.","The NPA applies to every licensed nurse regardless of union status.","Promising benefits to influence the vote is an unfair labor practice.","Correct — the central purpose of collective bargaining."],"src":"PCAP Module 3 — Collective Bargaining chapter (30% authorization cards; 50% + 1 election; right-to-work laws; management conduct during organizing) · Final Exam Study Guide, Module 3 (health policy, micro vs. macro advocacy, evidence-informed recommendations)"},{"id":"M6-21","m":6,"lo":"6.2","t":"I-PASS / structured handoff","cj":"Recognize Cues","d":2,"type":"mc","s":"A unit adopts a standardized bedside handoff tool after several missed lab follow-ups. Which outcome would best show that the handoff process is improving communication?","r":"Standardized handoffs aim to transfer information, authority, and responsibility completely. Fewer lost tasks and patient participation in correcting information show improved communication and safety.","o":["Fewer tasks lost between shifts","Handoff takes longer on average, showing that nurses are sharing more information with each other","More tasks are left for the next shift","Nurses report they prefer the old method"],"a":[0],"w":["Correct — outcome and process evidence of improvement.","Length alone is not a quality indicator.","Leaving more tasks is not the goal.","Preference is not an outcome measure."],"src":"Module 6 slides — SBAR, Call-Out, Check-Back, Teach-Back, Handoff; Boot Camp §11 (read-back for critical messages) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"K-05","m":5,"lo":"5.2","t":"Identifying latent conditions","cj":"Recognize Cues","d":3,"type":"sata","s":"A patient on a weight-based heparin infusion develops bleeding gums and an aPTT above 150 seconds. Review shows a 25,000 units/250 mL bag (100 units/mL) was taken from an override drawer, although the standard bag is 25,000 units/500 mL. The pump was run in “basic mode” programmed for 50 units/mL. The nurse says, “Everyone uses basic mode for heparin because the library is slow to load, and the override drawer always has the 100 units/mL bags.” Which findings are latent conditions that contributed to this event? Select all that apply.","r":"Latent conditions are system weaknesses: nonstandard concentrations in accessible stock, equipment design that drives workarounds, absent double-check policies, and a normalized unsafe practice (cultural drift). Misprogramming without reading the label is the active failure; the diagnosis is not a cause.","o":["The nurse programming 50 units/mL without reading the bag label","The patient’s DVT diagnosis","A nonstandard heparin concentration stocked in an override drawer on a med-surg unit","A unit norm in which bypassing the drug library is common","A pump drug library that loads slowly, encouraging basic-mode use","No independent double-check required for high-alert infusions on this unit"],"a":[2,3,4,5],"w":["Active failure at the sharp end.","The patient’s condition is not a system cause.","Correct — stocking/storage weakness.","Correct — cultural/normalized deviance.","Correct — technology design driving a workaround.","Correct — policy gap."],"src":"Module 5 slides — Systems Thinking and the Swiss Cheese Model (active vs. latent failures; wrong-site surgery example); Econ/Quality Worksheet §4 (KCl scenario) · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"G-55","m":7,"lo":"7.4","t":"Competent patient refuses a procedure","cj":"Take Action","d":2,"type":"sata","s":"A competent patient refuses a scheduled paracentesis after the provider explained it. Which nursing actions are appropriate? Select all that apply.","r":"A competent adult can refuse any treatment. The nurse makes sure the refusal is informed and voluntary, notifies the provider, answers questions within scope, documents objectively (often with a refusal form), and continues other care. The nurse never coerces, deceives, or performs the procedure without valid consent.","sg":"PCAP Study Guide — worksheet Module 7 (22)","o":["Notify the provider so the refusal and any questions can be addressed","Respect the decision and continue other care","Tell the patient the procedure will be done anyway because it is medically necessary","Ask family members to persuade the patient to sign","Confirm the patient understands the risks of refusing and that the choice is voluntary","Document the refusal and the discussion objectively"],"a":[0,1,4,5],"w":["Correct — the provider must know.","Correct — refusal of one procedure does not end care.","Coercion; doing it would be battery.","Pressuring a competent adult undermines voluntary choice.","Correct — informed refusal.","Correct — objective documentation."],"src":"PCAP Study Guide — worksheet Module 7 (22) · PNC Module 7 — The Law and Patient Rights (informed consent, leaving AMA, physical restraints); Patient Self-Determination Act; Health Care Law Worksheet · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"M5-11","m":5,"lo":"5.5","t":"5 Whys","cj":"Prioritize Hypotheses","d":3,"type":"mc","s":"A 5 Whys analysis of a patient fall proceeds: the patient got up alone → no one answered the call light → the RN had delegated toileting to the UAP → the only UAP was busy with another patient → the UAP accepted the task without saying she was unavailable because of tension between RNs and UAPs. What is the root cause and the best countermeasure?","r":"In the professor’s 5 Whys example, the deepest cause was a negative unit culture between nurses and UAPs. Countermeasures are systemic actions that prevent recurrence (team training, closed-loop communication, huddles), unlike solutions that only treat a symptom.","o":["The RN’s delegation; prohibit RNs from delegating toileting","Negative RN–UAP culture; team training and huddles","The busy UAP; discipline the UAP for not answering the call light while assigned","No bed alarm; add bed alarms for all high-fall-risk patients"],"a":[1],"w":["Stops too early; delegation itself was appropriate.","Correct — the deepest cause with a systemic countermeasure.","Blames an individual at the third why.","Stops at an early “why”; an alarm alone does not fix the unanswered call light."],"src":"Module 5 slides — “How to Use 5 Why Analysis” (patient fall → unanswered call → delegated UAP → busy UAP → negative RN–UAP culture) · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"M4-10","m":4,"lo":"4.3","t":"Reimbursement incentives","cj":"Analyze Cues","d":1,"type":"mc","s":"A home health agency’s finance office notices that some clinicians schedule extra, low-value visits. Under which payment arrangement would those extra visits generate the most additional revenue for the agency?","r":"Fee-for-service pays for each service, so volume increases revenue—historically encouraging more care with no financial risk. Capitation and episode (bundled) payments are fixed, so extra visits add cost without revenue, and value-based contracts reward quality outcomes rather than volume.","o":["A capitated contract paying a fixed monthly amount per enrollee","A value-based contract with bonuses tied to readmission rates","A fee-for-service contract paying for each visit provided","A single payment covering all visits in a 60-day episode of care"],"a":[2],"w":["Fixed per-member payment; extra visits add only cost.","Rewards outcomes, not volume.","Correct — each visit is paid.","A fixed episode payment; extra visits reduce margin."],"src":"Module 4 slides — DRG reimbursement, per diem rates, value-based purchasing, HACs and readmission penalties; PCAP Module 4 — Paying for Health Care (DRGs, managed care, capitation) · Final Exam Study Guide, Module 4 (Medicare A–D, Medicaid, HMO/PPO/EPO, stewardship, value-based care)"},{"id":"M5-23","m":5,"lo":"5.1","t":"Sentinel event response","cj":"Take Action","d":3,"type":"mc","s":"A patient dies after receiving a 10-fold overdose of insulin from an infusion pump. After the immediate clinical response, which organizational action is required?","r":"A sentinel event—unexpected death or severe harm—requires immediate investigation, typically through a comprehensive RCA with an action plan. The focus is on systems (pump library, double-checks, concentrations), not just the individual.","o":["An incident report and peer review of the nurse’s competency","Reporting the nurse to the Board of Nursing before any review","Waiting to see whether the family files a lawsuit before beginning any formal investigation","Immediate investigation through a comprehensive root cause analysis and action plan"],"a":[3],"w":["Peer review alone focuses on the individual; a sentinel event requires comprehensive RCA.","May be required later, but the required organizational action is an immediate systems RCA.","Investigation is required regardless of litigation.","Correct — immediate investigation with RCA."],"src":"Module 5 Quality & Safety slides — “Terms to Know” (near miss, adverse, sentinel, never event); Healthcare Quality & Safety Review Worksheet and Answer Key · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"G-03","m":2,"lo":"2.5","t":"Delegation to UAP","cj":"Take Action","d":1,"type":"mc","s":"The RN is assigning tasks on a medical unit. Which task is most appropriate to delegate to trained UAP?","r":"Use the EAT rule: the RN cannot delegate Evaluation, Assessment, or Teaching, or the care of unstable patients. Routine, predictable data collection on a stable patient can go to trained UAP when the RN gives the five rights—especially Right Direction (what to report and when). The RN still interprets the data.","sg":"Final Study Guide & Practice — practice Q3","o":["Obtain routine vital signs on a stable patient and report values outside set parameters","Evaluate whether a patient’s pain medication was effective","Assess a patient who reports a new episode of chest pain and diaphoresis","Reinforce the incentive-spirometer teaching the RN gave this morning"],"a":[0],"w":["Correct — routine data collection on a stable patient with clear reporting parameters.","Evaluation requires RN judgment.","Assessment—especially of a new symptom—stays with the RN.","Per the course, UAP do not teach or reinforce teaching; LPNs may reinforce."],"src":"Final Study Guide & Practice — practice Q3 · Boot Camp §05 (five rights of delegation; RN keeps assessment, evaluation, teaching); PNC Module 7 legal chapter — Personal Liability in Delegation and Supervision · Final Exam Study Guide, Module 2 (leader vs. manager, leadership theories, prioritization, 5 rights, EAT)"},{"id":"Z3-01","m":3,"lo":"3.7","t":"Levels of advocacy","cj":"Analyze Cues","d":2,"type":"cloze","s":"Case: A nurse helps a patient obtain free medications before discharge. Later she gives expert testimony at a state hearing on drug-cost legislation and donates to the state nurses association’s PAC.","r":"The course guide describes advocacy at two levels: micro/bedside (safe staffing, pain management, discharge resources for an individual) and macro/systems and legislative (voting, contacting legislators, testimony, professional organizations, committees, PACs).","tpl":"Obtaining free medications for the patient is {0} advocacy; testifying at the hearing is {1} advocacy; donating to the PAC supports {2}.","bl":[{"o":["community health","institutional policy","micro/bedside","macro/legislative"],"a":2,"w":"Acting for one patient’s immediate needs is micro (bedside) advocacy."},{"o":["community health promotion","micro/bedside","institutional/internal","macro/legislative"],"a":3,"w":"Expert testimony engages the policymaking process directly."},{"o":["nursing research grants at universities","the Board of Nursing’s licensing and exam fees","candidates who support nursing’s policy goals","the hospital’s annual operating budget"],"a":2,"w":"PACs pool member contributions to support candidates who back the profession’s policy goals."}],"src":"PCAP Module 3 — Health Policy and Politics; Grassroots Political Strategies · Final Exam Study Guide, Module 3 (health policy, micro vs. macro advocacy, evidence-informed recommendations)"},{"id":"M3-21","m":3,"lo":"3.3","t":"Conflict-resolution channels","cj":"Generate Solutions","d":2,"type":"mc","s":"A nurse disagrees with a new hospital policy requiring RNs to transport patients to radiology, leaving units short. Her manager dismisses the concern. Which next step is most appropriate?","r":"Organizations should provide conflict-resolution procedures such as open-door policies, ombudsman programs, and dispute resolution. Bringing objective data through formal channels is professional and effective. Public complaints risk reputational harm and confidentiality issues.","o":["Refuse to transport patients until the policy is changed, since it directly affects unit staffing","Use the formal dispute-resolution process and bring data on the staffing effects","Complain about the policy on a public social media page","Follow the policy but email the CNO directly, bypassing her manager and the dispute process"],"a":[1],"w":["Unilateral refusal may be insubordination when patient safety is not immediately at stake.","Correct — a formal channel with supporting data.","Public airing risks professional and legal consequences.","Bypassing established channels is less effective than the formal process with data."],"src":"PCAP Module 3 — Whistle-Blower Protection (“Things to Know About Whistle-Blowing”); Magnet Recognition Program; Shared Governance (Box 13.7); Conflict Resolution · Final Exam Study Guide, Module 3 (health policy, micro vs. macro advocacy, evidence-informed recommendations)"},{"id":"M5-05","m":5,"lo":"5.3","t":"Incident report documentation","cj":"Take Action","d":2,"type":"mc","s":"A nurse enters a room and finds a patient sitting on the floor beside the bed. After assessing the patient, helping her safely back to bed, and notifying the provider, the nurse completes the incident report. Which entry is most appropriate?","r":"Incident reports should contain only objective facts witnessed or known for certain, direct quotes in quotation marks, the timeline, the condition of the person, and actions taken. “Fell” is an assumption if the fall was not witnessed; blame and speculation do not belong.","o":["“Patient fell out of bed because the UAP left the bed rail down.”","“Probably slipped—nonskid socks were likely not on. Will make sure this doesn’t happen again.”","“Patient fell while trying to go to the bathroom alone.”","“Patient found sitting on floor next to bed at 0215. Stated, ‘I was trying to get to the bathroom.’ No visible injury; VS stable; Dr. Lee notified at 0220.”"],"a":[3],"w":["Assigns blame and assumes causation.","Speculation and opinion.","Assumes a fall that was not witnessed.","Correct — objective, quoted, timed, actions documented."],"src":"Module 5 slides — Incident Reports (“The patient was found on the floor next to his bed,” NOT “The patient fell out of bed”) · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"G-44","m":6,"lo":"6.2","t":"Interprofessional collaboration","cj":"Generate Solutions","d":2,"type":"sata","s":"A patient recovering from a stroke is going home with new dysphagia, impaired mobility, and limited income. Which actions reflect effective interprofessional collaboration for a safe transition? Select all that apply.","r":"Interprofessional collaboration means clarifying roles, sharing information, coordinating one plan, and building it around the patient’s goals. Bring the right disciplines (MD, PT/OT, SLP, RD, SW, PharmD) and communicate across them. Fragmented instructions are a common cause of readmission.","o":["Have each discipline give the patient separate instructions without comparing plans","Consult speech-language pathology and a dietitian about safe swallowing and diet","Include PT/OT in a home-safety and equipment plan","Include the patient’s and caregiver’s goals in the shared plan","Involve social work for cost and community resources"],"a":[1,2,3,4],"w":["Uncoordinated messages confuse patients and miss conflicts.","Correct — the right expertise for dysphagia.","Correct — mobility and ADL needs.","Correct — shared decision-making includes the patient.","Correct — addresses financial barriers."],"src":"Module 6 slides — SBAR, Call-Out, Check-Back, Teach-Back, Handoff; Boot Camp §11 (read-back for critical messages) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"Z6-01","m":6,"lo":"6.2","t":"Building an SBAR","cj":"Take Action","d":2,"type":"cloze","s":"Case: A patient admitted 2 days ago with pneumonia is suddenly more short of breath; SpO2 has fallen from 94% to 88% on 2 L, RR is 30, and he is newly confused.","r":"SBAR standardizes escalation: Situation (what is happening now), Background (relevant history), Assessment (objective data and interpretation), Recommendation (a specific request with a time frame). Vague requests delay rescue.","tpl":"In SBAR, “SpO2 is 88% on 2 L, RR 30, and he is newly confused” is the {0}. “Admitted 2 days ago with pneumonia” is the {1}. The best Recommendation is {2}.","bl":[{"o":["Situation","Assessment","Background","Recommendation"],"a":1,"w":"Objective findings and the nurse’s interpretation form the Assessment."},{"o":["Situation","Background","Assessment","Recommendation"],"a":1,"w":"Relevant history is Background."},{"o":["“I don’t like how he looks, and his family is worried too.”","“I’ll keep monitoring him and call back if he gets worse.”","“Can you look at him sometime today when you have a chance?”","“Please come now; consider an ABG and chest x-ray.”"],"a":3,"w":"A Recommendation states a specific request and time frame."}],"src":"Module 6 slides — SBAR, Call-Out, Check-Back, Teach-Back, Handoff; Boot Camp §11 (read-back for critical messages) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"M4-22","m":4,"lo":"4.3","t":"Capitation","cj":"Analyze Cues","d":3,"type":"mc","s":"A primary care group receives $45 per member per month for 3,000 enrolled HMO members, regardless of how many visits members make. Which strategy best aligns with this payment model while maintaining quality?","r":"Under capitation, revenue is fixed per member, so extra visits add cost but no revenue. Keeping the population healthy through prevention and chronic disease management controls costs and improves outcomes. Refusing care or overusing specialists undermines quality and raises total cost.","o":["Shift chronic-disease follow-up to the ED, where specialists are available 24/7","Refer all members to specialists to reduce primary care workload","Invest in nurse-led prevention and chronic disease management to keep members healthy","Expand same-day visits so members can be seen for every minor complaint"],"a":[2],"w":["ED use raises total cost and fragments care.","Increases total cost of care.","Correct — prevention aligns quality and financial incentives.","Access matters, but under capitation extra visits add cost without revenue; prevention lowers total cost."],"src":"Module 4 slides — DRG reimbursement, per diem rates, value-based purchasing, HACs and readmission penalties; PCAP Module 4 — Paying for Health Care (DRGs, managed care, capitation) · Final Exam Study Guide, Module 4 (Medicare A–D, Medicaid, HMO/PPO/EPO, stewardship, value-based care)"},{"id":"M8-03","m":9,"lo":"9.1","t":"Professional identity formation","cj":"Generate Solutions","d":3,"type":"mc","s":"A capstone student says she feels like she is “just doing tasks” and not yet thinking like a nurse. According to the professional identity literature, which strategy is most likely to strengthen her professional identity?","r":"Professional identity—thinking, acting, and feeling like a nurse—develops through real and simulated experiences, reflection, and role modeling. Immersion experiences with a preceptor plus guided reflection are the most meaningful strategies.","o":["Memorizing additional pharmacology and pathophysiology facts to strengthen her knowledge base","Guided reflection with a role-model preceptor","Completing extra simulation check-offs to master technical skills","Shadowing several specialties to decide where she wants to work"],"a":[1],"w":["Knowledge alone does not form identity.","Correct — experience, reflection, and role modeling.","Skill mastery alone does not form identity without reflection.","Exposure helps career choice but lacks guided reflection and role modeling."],"src":"PNC Modules 8–9 — Giddens Professional Identity concept (four domains; integrity, courage, humility, advocacy exemplars) · Final Exam Study Guide, Module 9 (licensure, BON/NPA, NCLEX/NLC, certification, ANA Code, Benner, lifelong learning)"},{"id":"M7-19","m":7,"lo":"7.6","t":"Georgia Rule 410-12 — minor incidents","cj":"Prioritize Hypotheses","d":3,"type":"mc","s":"A Georgia RN with an otherwise excellent record gives a scheduled antibiotic 90 minutes late because of a pharmacy delay; there is no harm. The unit has a peer-review process. According to Georgia Rule 410-12-.02, what is the most appropriate response?","r":"The Georgia Board states that protection of the public is not enhanced by reporting every minor incident, particularly when the practice setting has mechanisms to identify and remediate errors. A minor incident need not be reported unless it shows ignored substantial risk, lack of accountability, non-remediable deficits, or a pattern. Systems issues are mitigating factors.","o":["Handle it internally as a minor incident, considering system factors","Report to the Board only if the patient or family files a complaint","Report to the Board, because any late medication is a medication error","Report the nurse to the Board immediately, because every violation of the Nurse Practice Act must be reported"],"a":[0],"w":["Correct — internal process with consideration of system factors.","Reporting depends on the rule’s risk criteria, not on complaints.","Minor incidents need not be reported unless the rule’s criteria are met.","Not every minor incident requires a Board report."],"src":"Georgia Rule 410-12-.02 (Reporting of Minor Incidents, factors (3)(a)1–4 and (4)) · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"M6-01","m":6,"lo":"6.1","t":"TeamSTEPPS skills","cj":"Analyze Cues","d":1,"type":"mc","s":"During a busy shift, a nurse notices a colleague has three call lights on and a patient going to surgery. She says, “I have 10 minutes—how can I help?” Which TeamSTEPPS skill is she demonstrating?","r":"Mutual support is the ability to anticipate and support team members’ needs through accurate knowledge of their responsibilities and workload. Task assistance (“I have 10 minutes—how can I help?”) is a core mutual-support strategy that protects teammates from overload.","o":["Team leadership","Situation monitoring","Communication","Mutual support"],"a":[3],"w":["She is not directing the team.","She noticed the workload (monitoring), but the action is support.","The phrase supports workload, not information exchange.","Correct — task assistance."],"src":"Module 6 Communication & Collaboration slides — TeamSTEPPS framework (four skills; knowledge/attitude/performance outcomes; multi-team systems) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"M8-17","m":8,"lo":"8.5","t":"Telehealth modalities","cj":"Analyze Cues","d":2,"type":"sata","s":"A rural health system is expanding telehealth. Which scenarios are examples of asynchronous (store-and-forward) telehealth? Select all that apply.","r":"Asynchronous (store-and-forward) telehealth collects images, data, or messages at one time for interpretation later; patient portals facilitate it. Synchronous telehealth is real-time audio or video interaction, including live exams with peripheral devices operated by a clinician at the patient’s side.","o":["A dermatologist reviews images of a rash sent by a primary care clinic and replies with recommendations the next day","A patient uploads photos of a surgical wound through the portal, and a wound nurse reviews them the next morning","A specialist examines a patient live through a digital stethoscope operated by a clinic nurse","A psychiatrist conducts a live video visit with a patient at home","A nurse calls a patient to review heart failure symptoms in real time","A patient sends a secure portal message with home BP readings, and the nurse answers later that afternoon"],"a":[0,1,5],"w":["Correct — a store-and-forward e-consult.","Correct — stored images reviewed later.","Synchronous with peripheral devices.","Synchronous (real-time video).","Synchronous (real-time telephone).","Correct — a secure message answered later."],"src":"PNC Modules 8–9 — Point-of-Care Technology, Wearables, Telehealth (synchronous vs. asynchronous), Consumer Health IT; Module 5 slides — Technology and Patient Safety · Final Exam Study Guide, Module 8 (HIT, AI applications, benefits/risks, ethical and legal concerns)"},{"id":"K-06","m":5,"lo":"5.4","t":"Just Culture — at-risk behavior","cj":"Prioritize Hypotheses","d":3,"type":"mc","s":"After a heparin overdose, a review finds that the nurse who hung the bag bypassed the pump’s drug library (basic mode). Most nurses on the unit routinely do this because the library is slow to load, and managers knew staff had complained about the pump. Using Just Culture, how should this nurse’s behavior be classified, and what is the appropriate response?","r":"At-risk behavior is a choice that increases risk where the risk is not recognized or is believed to be justified—often a normalized workaround. Just Culture coaches the individual and removes the system drivers. Reckless behavior (conscious disregard of a substantial risk) would warrant sanction, but a widespread norm known to management points to system drift.","o":["Not the nurse’s responsibility; take no action with the individual","Human error only; no further action needed","At-risk; coach and fix the system","Reckless behavior; terminate employment because she knowingly bypassed a safety system"],"a":[2],"w":["Individuals remain accountable for their choices and reporting.","She made a choice (basic mode), not only a slip.","Correct — coach and fix the system.","Overly punitive for normalized drift."],"src":"Module 5 slides — “Just Culture” (shared accountability, psychological safety); Boot Camp §10 (human error vs. at-risk vs. reckless behavior) · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"G-23","m":2,"lo":"2.6","t":"Prioritization — ABCs","cj":"Prioritize Hypotheses","d":2,"type":"mc","s":"A nurse is caring for four clients on a medical-surgical unit. Which client should the nurse assess first?","r":"Prioritize with ABCs first, then acute/unexpected over chronic/expected, then Maslow. New restlessness is an early sign of cerebral hypoxia, and an SpO2 of 88% is a new breathing threat in a pneumonia patient. The others are expected findings with a plan already in place.","sg":"PCAP Study Guide — practice Q3","o":["Day 1 after hip arthroplasty, incisional pain 6/10, requesting pain medication","Chronic kidney disease, potassium 5.1 mEq/L, hemodialysis scheduled in 1 hour","Type 1 diabetes, pre-lunch glucose 184 mg/dL, sliding-scale insulin due","Pneumonia with new restlessness and SpO2 88% on 2 L nasal cannula"],"a":[3],"w":["Expected post-op pain; important but not life-threatening.","Mildly high potassium with a treatment plan in place—chronic and expected.","Mild hyperglycemia with a plan; stable.","Correct — an acute breathing problem with an early sign of hypoxia."],"src":"PCAP Study Guide — practice Q3 · Module 1 Study Guide — NGN Clinical Judgment Framework (six CJMM steps); PCAP Module 2 learning outcome 5 (clinical judgment model) · Final Exam Study Guide, Module 2 (leader vs. manager, leadership theories, prioritization, 5 rights, EAT)"},{"id":"Z9-02","m":9,"lo":"9.3","t":"Benner’s stages","cj":"Analyze Cues","d":2,"type":"cloze","s":"Case: Three nurses on a unit: a student in her first clinical rotation who follows checklists rigidly; a 3-year nurse who plans her shift deliberately and manages several complex patients; and a 15-year nurse who senses a patient is “going bad” before vital signs change.","r":"Benner’s model describes progression from novice to advanced beginner, competent, proficient, and expert through experience, reflection, mentorship, and continuing education—supported by nurse residency programs and lifelong learning.","tpl":"The student is at the {0} stage, the 3-year nurse is {1}, and the 15-year nurse is {2}.","bl":[{"o":["competent","advanced beginner","proficient","novice"],"a":3,"w":"Novices rely on rules and checklists without situational experience."},{"o":["advanced beginner","novice","expert","competent"],"a":3,"w":"Competent nurses (about 2–3 years) plan deliberately and manage contingencies."},{"o":["advanced beginner","proficient","expert","competent"],"a":2,"w":"Experts have an intuitive grasp of situations."}],"src":"PNC Modules 8–9 — Giddens Professional Identity concept (formation through experience, reflection, mentorship) · Final Exam Study Guide, Module 9 (licensure, BON/NPA, NCLEX/NLC, certification, ANA Code, Benner, lifelong learning)"},{"id":"G-45","m":1,"lo":"1.6","t":"Risk communication","cj":"Take Action","d":2,"type":"mc","s":"During a measles outbreak, parents at a community meeting repeat a social media claim that the MMR vaccine causes autism. What is the public health nurse’s best response?","r":"In public health emergencies nurses support surveillance, vaccination, triage, and risk communication. Good risk communication is timely, accurate, respectful, and actionable: acknowledge fears, correct misinformation with plain-language evidence from trusted sources, and tell people exactly what to do and where to go.","o":["Avoid the topic so the meeting stays positive","Acknowledge the concern and share accurate evidence and next steps","Hand out a journal article and ask them to read it at home","Tell them the claim is ridiculous and move on to the vaccine schedule"],"a":[1],"w":["Unaddressed misinformation spreads.","Correct — respectful, accurate risk communication with a clear action.","Dense literature without discussion rarely changes beliefs.","Dismissing concerns damages trust."],"src":"PCAP Module 1 — Emergency Preparedness chapter (mitigation, preparedness, response, recovery; crisis standards of care; MCI triage; incident command; biologic agents); Module 1 Study Guide §IX · Final Exam Study Guide, Module 1 (SDOH, equity, prevention, HBM, care coordination, emergency response)"},{"id":"M3-04","m":6,"lo":"6.6","t":"Ongoing unsafe staffing","cj":"Generate Solutions","d":3,"type":"sata","s":"For six consecutive weeks, a step-down unit has been staffed at 1:5 instead of the planned 1:3, and two patients had delayed responses to deterioration. Which actions are appropriate for staff nurses to take? Select all that apply.","r":"When understaffing is an ongoing pattern rather than a one-time crisis, nurses must identify unmet standards of care, document objectively, escalate through the chain of command and staffing committee, and use mechanisms such as safe harbor and peer review. Unilateral refusals, sick-outs, and public social media posts are not professional or protected channels and can harm patients.","o":["Request peer review or safe harbor as permitted by state law when asked to accept an assignment believed unsafe","Refuse all new admissions until staffing improves","Report through the chain of command and request review by the staffing committee","Document objective data on staffing, acuity, and missed or delayed care","Post the unit’s staffing numbers on social media to alert the public"],"a":[0,2,3],"w":["Correct — protective mechanisms for ongoing unsafe patterns.","Unilateral refusal can harm patients; use formal escalation and safe-harbor processes.","Correct — appropriate channels.","Correct — objective evidence supports advocacy.","Public posting can breach confidentiality and is not a protected reporting channel."],"src":"PCAP Module 3 — Workforce Advocacy: Safe Staffing, Box 13.3 (questions before employment), Box 13.5 (questions before accepting an assignment), Floating and Mandatory Overtime; PNC Module 7 — Floating and Cross-Training (Winkelman; Francis); PCAP Module 3 — Workplace Safety (violence, fatigue) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"M6-16","m":6,"lo":"6.5","t":"Hierarchy & speaking up","cj":"Prioritize Hypotheses","d":3,"type":"mc","s":"A new nurse hesitates to tell a senior surgeon that the sponge count is off by one because “he hates being questioned.” Which statement best explains the risk and the correct response?","r":"Steep hierarchies are a known cause of communication failure and retained foreign objects (a never event). TeamSTEPPS empowers every member to speak up; a count discrepancy requires a recount and imaging before closing, with escalation if ignored.","o":["Ask the anesthesiologist to tell the surgeon on her behalf","Hierarchy is appropriate; she should defer to the surgeon’s judgment","Steep hierarchy suppresses speaking up; she should state the discrepancy and request a recount","She should quietly document the discrepancy and let the surgeon decide"],"a":[2],"w":["Indirect and delays action.","Deference to hierarchy enables a never event.","Correct — assertive, protocol-driven escalation.","Documentation does not prevent harm; the count discrepancy must be resolved before closing."],"src":"Module 6 slides — opening case (communication-failure categories: language/literacy/inclusion, hierarchy, handoff, escalation); PNC Module 7 — ADA and CLAS standards · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"M5-02","m":5,"lo":"5.1","t":"Never vs. sentinel events","cj":"Analyze Cues","d":2,"type":"sata","s":"Which events meet the definition of a never event? Select all that apply.","r":"Never events are errors that are clearly identifiable, preventable, and serious—for example, wrong-site surgery, retained foreign objects, and infant discharge to the wrong person. A stage 2 pressure injury in a high-risk patient and a fall without injury are adverse or reportable events but not never events.","o":["Discharge of an infant to the wrong family","Surgery performed on the wrong knee","A stage 2 pressure injury in a high-risk ICU patient on day 10","A fall without injury in an older adult with Parkinson’s disease","A retained surgical sponge discovered on postoperative imaging"],"a":[0,1,4],"w":["Correct — infant discharged to the wrong person.","Correct — wrong-site surgery.","An adverse event, but not a never event.","Reportable, but not a never event.","Correct — retained foreign object."],"src":"Module 5 Quality & Safety slides — “Terms to Know” (near miss, adverse, sentinel, never event); Healthcare Quality & Safety Review Worksheet and Answer Key · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"M5-24","m":5,"lo":"5.2","t":"Latent condition — technology","cj":"Recognize Cues","d":2,"type":"mc","s":"Which of the following is the best example of a latent error?","r":"Latent errors are hidden system design flaws—such as a poorly designed EHR interface—that set the stage for active errors. Giving an expired drug, misdiagnosing, and wrong-patient administration are active failures by individuals at the point of care.","o":["An EHR display with no look-alike name warning","A nurse administers a medication to the wrong patient","A physician misdiagnoses a patient after reviewing incomplete laboratory results during a busy shift","A nurse gives a patient an expired medication"],"a":[0],"w":["Correct — a system design flaw.","An active failure.","An active failure.","An active failure."],"src":"Module 5 slides — Systems Thinking and the Swiss Cheese Model (active vs. latent failures; wrong-site surgery example); Econ/Quality Worksheet §4 (KCl scenario) · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"N8-02","m":8,"lo":"8.6","t":"Public AI tools and PHI","cj":"Take Action","d":2,"type":"mc","s":"A nurse wants to translate discharge instructions into Spanish quickly. She plans to paste the instructions, including the patient’s name, medications, and diagnosis, into a free public chatbot on her phone. What is the best action?","r":"Identifiable patient information must not be entered into unapproved public AI tools; de-identification alone does not make an unapproved tool appropriate for clinical use. Organization-approved resources and qualified interpreters protect privacy and ensure accurate teaching.","o":["Proceed if she removes the patient’s name but keeps the diagnosis and medications","Proceed, because translation improves patient safety and outweighs privacy concerns","Use approved translations and a qualified interpreter instead","Ask the patient for verbal p
