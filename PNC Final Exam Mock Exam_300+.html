ermission to use the chatbot and then proceed"],"a":[2],"w":["Partial de-identification does not make an unapproved tool appropriate.","Safety goals don’t override HIPAA; approved alternatives exist.","Correct — approved tools and qualified interpreters.","Patient permission doesn’t make an unapproved, unsecured tool compliant with policy."],"src":"PNC Modules 8–9 — Health IT concept and IT in the Clinical Setting (clinical decision support, technology and judgment) · Final Exam Study Guide, Module 8 (HIT, AI applications, benefits/risks, ethical and legal concerns)"},{"id":"M7-14","m":7,"lo":"7.4","t":"Restraints","cj":"Take Action","d":3,"type":"sata","s":"A confused postoperative patient is repeatedly pulling at his endotracheal tube despite redirection, a sitter, and covering the tube. The nurse applies soft wrist restraints in an emergency. Which actions are legally and ethically required? Select all that apply.","r":"Nurses may apply restraints in an emergency when no other strategy protects the patient, but must promptly contact the provider for a timed and dated order and reassess and document at required intervals. Restraints must be the least restrictive option and removed as soon as possible; PRN restraint orders are not permitted, and restraints may never be used for staffing convenience or prophylactically.","o":["Keep the restraints on until morning rounds, even if the patient becomes calm","Obtain a PRN restraint order so restraints can be reapplied whenever he seems agitated","Contact the provider promptly to obtain a timed and dated order","Assess and document neurovascular status, skin, and mental status at the intervals required by policy","Apply restraints to other confused patients prophylactically when staffing is short"],"a":[2,3],"w":["Restraints must be removed as soon as they are no longer needed.","PRN restraint orders are not permitted; each use requires a current order and reassessment.","Correct — a prompt order after emergency application.","Correct — required monitoring and documentation.","Restraints may never be used for staff convenience or prevention without indication."],"src":"PNC Module 7 — The Law and Patient Rights (informed consent, leaving AMA, physical restraints); Patient Self-Determination Act; Health Care Law Worksheet · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"Z3-02","m":3,"lo":"3.7","t":"Writing to a legislator","cj":"Generate Solutions","d":2,"type":"cloze","s":"Case: A nurse drafts an email to her state representative about a bill funding school nurses.","r":"Effective political advocacy uses respectful, evidence-based messages from constituents, distinguishes evidence from opinion, and ends with a specific request. Threats and vague messages reduce credibility.","tpl":"The most effective message opens by identifying herself as {0}, includes {1}, and ends with {2}.","bl":[{"o":["a representative of her hospital’s administration","a constituent and registered nurse","a member of the opposing party","an anonymous concerned citizen"],"a":1,"w":"Legislators respond most to informed constituents; her professional role adds credibility."},{"o":["her personal opinion of the representative’s past votes","a long list of every published study on school nursing","copies of her hospital’s internal staffing reports","local student health data and one brief de-identified story"],"a":3,"w":"Concise local evidence plus a brief story is persuasive and protects privacy."},{"o":["a general thank-you for public service","a warning about the next election","a clear request to vote yes on the specific bill","an invitation to follow her on social media"],"a":2,"w":"A specific request tells the decision-maker exactly what action to take."}],"src":"PCAP Module 3 — Health Policy and Politics; Grassroots Political Strategies · Final Exam Study Guide, Module 3 (health policy, micro vs. macro advocacy, evidence-informed recommendations)"},{"id":"M4-23","m":4,"lo":"4.1","t":"Risk pooling","cj":"Analyze Cues","d":2,"type":"mc","s":"A small business with 12 employees faces very high premiums after one employee develops cancer. The owner asks why joining a larger purchasing group could lower costs. Which concept explains this?","r":"Insurance works by risk pooling—spreading the financial risk of individuals across larger groups, so a few high-cost claims are offset by many lower-cost members. Larger pools produce more predictable costs.","o":["Insurers must discount premiums for groups over 100 by law","Risk pooling spreads the financial risk of high-cost claims across a larger group of policyholders","Larger groups can select plans with higher out-of-pocket maximums","Larger groups pay less mainly because insurers’ administrative costs are lower"],"a":[1],"w":["No such mandated discount exists.","Correct — spreading risk across more people.","Plan design shifts cost-sharing; it does not spread risk.","Administrative savings help modestly, but the core concept is risk pooling."],"src":"Module 4 Healthcare Economics slides — Health Insurance Plan Comparison table (HMO/PPO/EPO/POS), HDHP/HSA and catastrophic plans, Case Studies 3, 4 & 6; Comprehensive Guide to Healthcare Quality, Safety & Economics — Types of Plans · Final Exam Study Guide, Module 4 (Medicare A–D, Medicaid, HMO/PPO/EPO, stewardship, value-based care)"},{"id":"M2-05","m":2,"lo":"2.3","t":"Lewin change theory","cj":"Take Action","d":2,"type":"mc","s":"A unit is converting from paper whiteboards to an electronic patient-status display. Several experienced nurses openly resist, saying, “The old way works fine.” According to Lewin, which action by the nurse leader during the unfreezing stage is most effective?","r":"Unfreezing creates readiness by showing why change is needed. Lewin’s rules: change for good reason, plan it gradually, avoid abrupt change, and involve those affected. Resistance is natural; effective change agents use strategies to overcome it rather than eliminating or punishing it.","o":["Share near-miss data tied to the whiteboards and involve the resisting nurses in planning","Explain that the change is mandated by administration and is not open for discussion or modification","Implement the change immediately and all at once to minimize the time staff spend resisting it","Pilot the display on one shift without the resisting nurses, then show them the results"],"a":[0],"w":["Correct — creates a felt need and involvement.","Coercion entrenches resistance.","Abrupt change violates Lewin’s principles.","Excluding resisters from planning breeds distrust; Lewin calls for involving those affected."],"src":"PCAP Module 2 — Management Functions (planning, organizing, staffing, directing, controlling); Change Agent (Lewin’s rules and stages) · Final Exam Study Guide, Module 2 (leader vs. manager, leadership theories, prioritization, 5 rights, EAT)"},{"id":"M1-09","m":1,"lo":"1.3","t":"Community resources","cj":"Take Action","d":2,"type":"sata","s":"A nurse is planning the discharge of an 84-year-old recovering from hip fracture repair. She lives alone in a two-story home with the bedroom upstairs, has a fixed income, and her son lives 3 hours away. Which actions are appropriate during discharge planning? Select all that apply.","r":"Discharge planning begins at admission and includes medication reconciliation, home-safety assessment, education, follow-up, and community referrals. Where to live is the competent patient’s decision; living alone calls for support services and rehabilitation, not hospice or placement she has not chosen, and referrals should not wait for the discharge order.","o":["Arrange a short-term skilled nursing stay without first asking about her goals","Request a hospice referral because she lives alone and is over 80","Begin discussing discharge needs today rather than waiting for the discharge order","Wait to make referrals until the discharge order is written so services match final orders","Request a physical/occupational therapy home-safety evaluation and equipment assessment","Reconcile all home medications with the new post-operative prescriptions"],"a":[2,4,5],"w":["Placement may be an option, but the competent patient decides after hearing choices.","Living alone is not an indication for hospice; she needs rehabilitation and support services.","Correct — discharge planning starts at admission, not on discharge day.","Discharge planning begins at admission; waiting delays services.","Correct — home safety and equipment needs (stairs).","Correct — reconciliation prevents duplication and omission."],"src":"Module 1 Study Guide §IV–V (discharge planning begins at admission; high-risk readmission indicators; care coordination); PCAP Module 1 — Giddens Care Coordination (Transitional Care Model, PCMH, PACE, ACOs) · Final Exam Study Guide, Module 1 (SDOH, equity, prevention, HBM, care coordination, emergency response)"},{"id":"G-54","m":4,"lo":"4.1","t":"Out-of-network flexibility","cj":"Analyze Cues","d":1,"type":"mc","s":"A patient wants to keep seeing an out-of-network specialist without needing referrals. Which plan type generally offers the most flexibility, and what is the trade-off?","r":"PPOs offer the most flexibility—no PCP or referrals, and coverage both in and out of network—but premiums and out-of-network costs are higher. HMOs are the most restrictive and usually the least expensive. EPOs need no referrals but stay in network except emergencies. Always verify the specific plan.","sg":"PCAP Study Guide — worksheet Module 4 (11)","o":["HMO—lowest premiums, with referrals for any specialist","EPO—no referrals, with out-of-network care at slightly higher cost","Catastrophic plan—any provider covered once the deductible is met","PPO—out-of-network coverage, but higher premiums"],"a":[3],"w":["HMOs do not cover out-of-network care except emergencies.","EPOs do not cover out-of-network care except emergencies.","Catastrophic plans still use networks and have very high deductibles.","Correct — most flexibility, at higher cost."],"src":"PCAP Study Guide — worksheet Module 4 (11) · Module 4 Healthcare Economics slides — Health Insurance Plan Comparison table (HMO/PPO/EPO/POS), HDHP/HSA and catastrophic plans, Case Studies 3, 4 & 6; Comprehensive Guide to Healthcare Quality, Safety & Economics — Types of Plans · Final Exam Study Guide, Module 4 (Medicare A–D, Medicaid, HMO/PPO/EPO, stewardship, value-based care)"},{"id":"M5-12","m":5,"lo":"5.5","t":"Fishbone diagram","cj":"Generate Solutions","d":2,"type":"sata","s":"A team builds a fishbone diagram for rising CAUTI rates. Which causes are correctly placed in their categories? Select all that apply.","r":"Fishbone categories include Machines/Equipment, Methods/Process, Materials/Supplies, People, Policies, Procedures, Environment, Technology, and Measurement. Broken scanners are equipment and a missing protocol is policy. Missing kit components are Materials, a training gap is People, and a denominator error is Measurement.","o":["Bladder scanners frequently broken — Machines/Equipment","Float staff not trained in catheter insertion technique — Machines/Equipment","Catheter kits missing the securement device — Methods/Process","No nurse-driven catheter-removal protocol — Policies","CAUTI rates calculated using the wrong denominator — Environment"],"a":[0,3],"w":["Correct — equipment.","Misplaced — a training gap is a People (or Methods) cause.","Misplaced — missing kit components are Materials/Supplies.","Correct — policy.","Misplaced — this belongs under Measurement/Metrics."],"src":"Module 5 slides — Root Cause Analysis (common mistakes; “human error is rarely the root cause”), 5 Whys fall example, Fishbone categories, Countermeasures vs. Solutions · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"K-04","m":2,"lo":"2.5","t":"Delegation to LPN and UAP","cj":"Take Action","d":3,"type":"sata","s":"A charge nurse on a busy med-surg night shift is reviewing tasks for the unit’s LPN and two UAPs. Which delegations are appropriate? Select all that apply.","r":"LPNs can give medications to stable patients and reinforce teaching; UAPs can perform routine vital signs (with clear reporting parameters) and basic care. Admission assessment, care planning, and evaluating the effectiveness of interventions require RN judgment.","o":["LPN: reinforce previously taught incentive-spirometer use with a stable post-op patient","UAP: reposition and provide incontinence care for a patient with a stage 2 pressure injury","UAP: obtain 0000 vital signs on stable patients and report any SBP <100 or HR >110 to the assigned RN","LPN: complete the admission assessment and care plan for the pending ED admission","LPN: administer scheduled oral medications to stable patients on Hall B","UAP: evaluate whether a patient’s IV pain medication was effective"],"a":[0,1,2,4],"w":["Correct — LPNs may reinforce teaching an RN has provided.","Correct — basic care with predictable outcomes.","Correct — routine task with specific reporting parameters.","Initial assessment and care planning are RN functions.","Correct — within LPN scope for stable patients.","Evaluation requires RN judgment."],"src":"Boot Camp §05 (five rights of delegation; RN keeps assessment, evaluation, teaching); PNC Module 7 legal chapter — Personal Liability in Delegation and Supervision · Final Exam Study Guide, Module 2 (leader vs. manager, leadership theories, prioritization, 5 rights, EAT)"},{"id":"M1-13","m":1,"lo":"1.4","t":"Health Belief Model","cj":"Take Action","d":3,"type":"mc","s":"A community nurse runs a free mammography event in a rural county. Attendance is low. Follow-up interviews reveal that women believe mammograms save lives and know their risk, but most work hourly jobs without paid leave and the event ran 9 a.m.–3 p.m. on a Tuesday. What is the best revision for the next event?","r":"The data point to a perceived (and actual) barrier: lost wages and inconvenient hours. Repeating benefit or severity messages or adding cues does not remove the barrier. Matching the intervention to the reason for inaction is the key HBM principle.","o":["Hold evening and Saturday hours, with mobile units near major worksites","Add a breast-cancer survivor as a speaker to reinforce how serious the disease can become","Distribute brochures describing the benefits of early detection","Increase radio advertisements and social media reminders during the week before the next event"],"a":[0],"w":["Correct — directly removes the time and wage barrier.","Targets severity and benefits, which are already present.","Benefits are already believed.","More cues do not fix scheduling and lost-wage barriers."],"src":"Module 1 Study Guide §VI (Primary = Prevent, Secondary = Screen, Tertiary = Treat) and §X (Health Belief Model constructs; SDOH → perceived barriers) · Final Exam Study Guide, Module 1 (SDOH, equity, prevention, HBM, care coordination, emergency response)"},{"id":"Z3-05","m":3,"lo":"3.3","t":"Whistle-blowing steps","cj":"Take Action","d":3,"type":"cloze","s":"Case: A home health nurse has evidence that her agency bills Medicare for visits that never happened. Her internal reports have been ignored.","r":"ANA whistle-blowing guidance: document objectively, consult counsel or the state nurses association, report to the appropriate state or federal regulator, and stay calm and professional. Private accreditors and public media do not provide whistle-blower protection.","tpl":"She should keep {0}, seek guidance from {1}, and report in writing to {2}.","bl":[{"o":["screenshots to post online","objective, dated documentation of the evidence","a personal journal of her feelings about the owner","copies of patient records at home"],"a":1,"w":"Objective, dated documentation supports a credible report."},{"o":["the agency’s office manager","coworkers in a private social media group","the families of affected Medicare patients","the state nurses association or an attorney"],"a":3,"w":"The ANA advises consulting the state nurses association or an attorney before acting."},{"o":["the appropriate state or federal regulator","the agency’s billing department","a local newspaper’s investigative reporter","The Joint Commission’s complaint hotline"],"a":0,"w":"Protection comes from reporting to a regulator; private accreditors do not confer it."}],"src":"PCAP Module 3 — Whistle-Blower Protection (“Things to Know About Whistle-Blowing”); Magnet Recognition Program; Shared Governance (Box 13.7); Conflict Resolution · Final Exam Study Guide, Module 3 (health policy, micro vs. macro advocacy, evidence-informed recommendations)"},{"id":"N2-01","m":2,"lo":"2.2","t":"Servant leadership","cj":"Analyze Cues","d":1,"type":"mc","s":"A charge nurse routinely asks staff what they need to do their best work, covers patients so nurses can attend education sessions, and credits the team for unit improvements. Which leadership style does this best describe?","r":"Servant leaders prioritize the growth, well-being, and needs of team members and patients above their own interests. Transactional leaders use rewards and corrective actions tied to performance; laissez-faire leaders are hands-off; autocratic leaders make top-down decisions.","o":["Laissez-faire","Autocratic","Servant","Transactional"],"a":[2],"w":["Hands-off; this leader is actively supporting staff.","Top-down decision-making.","Correct — puts others’ growth and needs first.","Focuses on exchanges—rewards and corrective action."],"src":"PCAP Module 2 — Box 17.1 (transformational vs. transactional) and Management Styles table (autocratic, democratic, laissez-faire); Giddens Leadership concept (leadership styles) · Final Exam Study Guide, Module 2 (leader vs. manager, leadership theories, prioritization, 5 rights, EAT)"},{"id":"M4-15","m":4,"lo":"4.4","t":"Economic stewardship","cj":"Take Action","d":2,"type":"sata","s":"Which actions demonstrate a staff nurse’s role as an economic steward and patient advocate? Select all that apply.","r":"The professor lists accurate documentation, minimizing waste, patient education on costs and assistance, participating in cost-saving and QI initiatives, supporting price transparency, and raising cost awareness. Opening supplies in advance creates waste; choosing products regardless of clinical need and withholding cost information undermine quality and transparency.","o":["Choosing the least expensive dressing regardless of wound type","Documenting care accurately and completely to support appropriate reimbursement","Withholding information about costs to avoid upsetting patients","Participating in a unit cost-saving and quality-improvement project","Opening supply kits in advance so they are ready for every patient","Educating patients about financial-assistance programs and potential costs"],"a":[1,3,5],"w":["Cost must not override clinical effectiveness.","Correct — supports proper reimbursement.","Contradicts transparency and advocacy.","Correct — unit-level stewardship.","Opening kits in advance increases waste and cost.","Correct — transparency and access."],"src":"Module 4 slides — How Cost vs. Charge Differences Arise; Cost Matrix Worksheet (direct medical, direct non-medical, indirect, intangible; preventing/reducing/managing cost); nurses as economic stewards · Final Exam Study Guide, Module 4 (Medicare A–D, Medicaid, HMO/PPO/EPO, stewardship, value-based care)"},{"id":"M5-06","m":5,"lo":"5.3","t":"Incident reports — what not to do","cj":"Evaluate Outcomes","d":3,"type":"sata","s":"A charge nurse is reviewing an orientee’s handling of a medication-error incident report. Which actions by the orientee need correction? Select all that apply.","r":"Per the course slides, nurses should not document in the health record that an incident report was completed, should avoid abbreviations that are not readily understood, and should not include opinions or blame. Timely completion after ensuring safety and listing who was notified are correct.","o":["Writing in the patient’s medical record, “Incident report completed for wrong dose.”","Adding a sentence suggesting the pharmacy should be disciplined","Listing the names of the people notified and their response times","Using the abbreviation “PPx” without spelling it out","Completing the report as soon as possible after ensuring the patient was safe"],"a":[0,1,3],"w":["Needs correction — the chart reflects care and facts, not the incident report.","Needs correction — opinions and blame do not belong.","Correct practice.","Needs correction — avoid unclear abbreviations.","Correct practice."],"src":"Module 5 slides — Incident Reports do’s and don’ts (do not document the report in the chart; avoid unclear abbreviations; no opinions) · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"M8-04","m":9,"lo":"9.1","t":"Courage & advocacy","cj":"Take Action","d":3,"type":"mc","s":"A nurse notices that a respected surgeon is repeatedly skipping hand hygiene before dressing changes. Other staff say, “That’s just how he is.” Which action best demonstrates the professional-identity exemplar of moral courage?","r":"Moral courage is acting on ethical convictions despite risk or discomfort. A direct, respectful prompt followed by escalation through proper channels protects patients while maintaining professionalism.","o":["Report the surgeon anonymously on social media","Hand the surgeon sanitizer without saying anything","Tell the infection-prevention nurse privately and let her handle it","Remind the surgeon respectfully in the moment, then escalate through proper channels if it continues"],"a":[3],"w":["Inappropriate channel and a privacy risk.","A nonverbal prompt may be ignored and avoids clear communication.","Reporting is appropriate, but moral courage includes speaking up in the moment to protect this patient.","Correct — courage plus appropriate channels."],"src":"PNC Modules 8–9 — Giddens Professional Identity concept (four domains; integrity, courage, humility, advocacy exemplars) · Final Exam Study Guide, Module 9 (licensure, BON/NPA, NCLEX/NLC, certification, ANA Code, Benner, lifelong learning)"},{"id":"K-02","m":1,"lo":"1.6","t":"Disaster triage categories","cj":"Recognize Cues","d":3,"type":"sata","s":"An EF-3 tornado strikes a high school gym, and a 148-bed community hospital activates its Emergency Operations Plan. Resources are overwhelmed. Using the mass-casualty triage categories (immediate/red, delayed/yellow, minor/green, expectant/black), which arriving victims should the triage nurse categorize as IMMEDIATE (red)? Select all that apply.","r":"Immediate victims have life-threatening but salvageable conditions (likely tension pneumothorax; shock with altered mental status). The walking patient is minor; the controlled hemorrhage with stable signs is delayed; the open skull fracture with agonal breathing is expectant when resources are scarce—greatest good for the greatest number.","o":["A 15-year-old with a bleeding thigh wound controlled by a tourniquet, RR 22, alert, radial pulse present","A 70-year-old with an open skull fracture, exposed brain matter, and agonal respirations","A 16-year-old with RR 36, absent breath sounds on the left, and tracheal deviation","A 17-year-old who is confused, cannot follow commands, with capillary refill of 4 seconds and a distended abdomen","A 44-year-old with a closed forearm deformity who is walking and talking"],"a":[2,3],"w":["Delayed (yellow) — bleeding controlled, stable.","Expectant — unsurvivable with current resources.","Correct — immediate (salvageable airway/breathing threat).","Correct — immediate (shock with altered mentation).","Minor (green) — ambulatory."],"src":"PCAP Module 1 — Emergency Preparedness chapter (mitigation, preparedness, response, recovery; crisis standards of care; MCI triage; incident command; biologic agents); Module 1 Study Guide §IX · Final Exam Study Guide, Module 1 (SDOH, equity, prevention, HBM, care coordination, emergency response)"},{"id":"N3-02","m":3,"lo":"3.7","t":"Evidence-informed policy recommendations","cj":"Generate Solutions","d":3,"type":"mc","s":"A nurse is drafting a policy brief for county commissioners proposing school-based asthma services. Which brief is most likely to persuade decision-makers?","r":"The course guide describes evidence-informed policy recommendations: define the problem and affected population, describe the evidence and inequities, compare options (feasibility, cost, unintended consequences), state a specific recommendation, and identify measurable outcomes. Stories can support a brief but cannot replace evidence and a clear request.","o":["A request that commissioners “do something about asthma,” signed by 200 nurses","Local ED data, two options compared on cost, one recommendation, and outcome measures","A list of every asthma study published in the past decade, with no recommendation","A moving personal story about one child’s asthma attack and an appeal to protect children"],"a":[1],"w":["A vague request gives decision-makers nothing actionable.","Correct — problem, evidence, options, a specific recommendation, and outcomes.","Evidence without synthesis or a recommendation does not guide a decision.","Stories help but lack data, options, and a specific request."],"src":"PCAP Module 3 — Health Policy and Politics; Grassroots Political Strategies · Final Exam Study Guide, Module 3 (health policy, micro vs. macro advocacy, evidence-informed recommendations)"},{"id":"M4-13","m":4,"lo":"4.4","t":"Cost matrix","cj":"Analyze Cues","d":2,"type":"sata","s":"A 45-year-old construction worker with acute back pain has no paid sick leave, a disputed workers’ compensation claim, and pays a neighbor to drive him to physical therapy. Which items are correctly classified on the cost matrix? Select all that apply.","r":"Direct medical costs are health services and drugs; direct non-medical costs are expenses caused by illness such as transportation and special diets; indirect costs are lost productivity and wages; intangible costs are pain, suffering, and reduced quality of life. Rides are direct non-medical, anxiety is intangible, and a prescription is direct medical.","o":["Anxiety about supporting his family — indirect costs","Muscle relaxant prescription — indirect costs","Lost wages from missed work — indirect costs","Payment to the neighbor for rides to therapy — indirect costs","Physical therapy sessions and the MRI — direct medical costs"],"a":[2,4],"w":["Misclassified — emotional distress is an intangible cost.","A prescription is a direct medical cost.","Correct — indirect.","Misclassified — transportation is a direct non-medical cost.","Correct — direct medical."],"src":"Module 4 slides — How Cost vs. Charge Differences Arise; Cost Matrix Worksheet (direct medical, direct non-medical, indirect, intangible; preventing/reducing/managing cost); nurses as economic stewards · Final Exam Study Guide, Module 4 (Medicare A–D, Medicaid, HMO/PPO/EPO, stewardship, value-based care)"},{"id":"K-08","m":4,"lo":"4.2","t":"Coverage options after job loss","cj":"Analyze Cues","d":3,"type":"mc","s":"Mr. Price, 62, is hospitalized with new heart failure. He lost his employer coverage when he was laid off 5 weeks ago and is now uninsured. He asks, “I’m 62—can’t I just get Medicare now?” Which response is most accurate?","r":"Medicare eligibility is typically age 65 or certain disabilities (such as ESRD). Losing employer coverage is a qualifying event for a Marketplace special enrollment period, and Medicaid eligibility depends on income and state rules, so screening is appropriate.","o":["“Medicaid is only for children and pregnant women.”","“You’ll need to wait until 65 for any coverage.”","“Medicare usually starts at 65 unless you qualify through disability. Losing job coverage may let you enroll in a Marketplace plan now, and we can screen you for Medicaid.”","“Yes—Medicare covers anyone over 60 who loses employer coverage, so we can enroll you before discharge.”"],"a":[2],"w":["Medicaid also covers low-income adults, older adults, and people with disabilities, depending on the state.","Ignores available pathways.","Correct — accurate eligibility and options.","Inaccurate age threshold."],"src":"Module 4 slides — Medicare Parts A–D and Medigap, Medicaid/CHIP, ACA provisions, Case Studies 1, 2 & 5; Health Care Law Worksheet — EMTALA and ACA · Final Exam Study Guide, Module 4 (Medicare A–D, Medicaid, HMO/PPO/EPO, stewardship, value-based care)"},{"id":"M7-15","m":7,"lo":"7.5","t":"HIPAA — need to know","cj":"Take Action","d":2,"type":"mc","s":"A local news anchor is admitted to the cardiac unit. A nurse on the oncology unit, who has system access, is curious and wants to look at the chart. Which statement is correct?","r":"Technical access does not equal permission. HIPAA restricts access to the minimum necessary for legitimate job duties (need to know). EHR audit trails record who accessed each record, and violations can lead to termination, fines, and Board action.","o":["Accessing the chart is allowed because the nurse has system credentials","Allowed, as long as the nurse keeps what she reads confidential and does not print anything","Allowed if she later documents a reason for access in the chart","A HIPAA violation; she has no need to know"],"a":[3],"w":["Credentials do not grant permission.","Viewing without need is itself the violation.","Retroactive justification does not create a need to know.","Correct — no legitimate need, and audit trails detect it."],"src":"PNC Module 7 — HIPAA and social media, EMTALA, ADA, CLAS language-access standards; Health Care Law Worksheet and Answer Sheet · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"M6-24","m":6,"lo":"6.5","t":"Inclusive communication","cj":"Take Action","d":2,"type":"mc","s":"A deaf patient who uses American Sign Language is admitted for surgery. The surgeon suggests writing notes to explain the procedure to save time. What is the nurse’s best action?","r":"The ADA requires hospitals to provide effective communication aids, including qualified sign-language interpreters, for patients with hearing impairment. Written notes may not convey complex information to someone whose primary language is ASL, and minors should not interpret.","o":["Use a staff member who learned some sign language in a class","Arrange a qualified ASL interpreter, in person or by video, for consent","Ask the patient’s 10-year-old child to sign for the parent","Agree, because written English notes are an acceptable communication method for deaf patients"],"a":[1],"w":["Competence is unverified; a qualified interpreter is required.","Correct — a qualified interpreter meets legal and ethical duties.","Minors are not qualified interpreters.","ASL is a distinct language; written English may not be effective."],"src":"Module 6 slides — opening case (communication-failure categories: language/literacy/inclusion, hierarchy, handoff, escalation); PNC Module 7 — ADA and CLAS standards · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"M1-12","m":1,"lo":"1.4","t":"Health Belief Model","cj":"Analyze Cues","d":3,"type":"sata","s":"A county health department is designing a flu-vaccination campaign. Which campaign elements are correctly matched to their Health Belief Model construct? Select all that apply.","r":"Free, convenient clinics reduce barriers; hospitalization data address severity; reminders are cues to action. “Anyone can get it” addresses susceptibility (not severity), showing how easy the process is builds self-efficacy, and evidence that the vaccine works addresses perceived benefits.","o":["“Anyone can catch the flu” messaging — perceived severity","Testimonials stating the vaccine reduced illness in a community — self-efficacy","Free walk-in clinics at grocery stores — reducing perceived barriers","Text reminders the week clinics open — cues to action","A demonstration showing how quickly the walk-in process works — perceived susceptibility","Bus-stop posters showing hospitalization rates among older adults — perceived severity"],"a":[2,3,5],"w":["Mismatched — “anyone can catch it” addresses susceptibility, not severity.","Mismatched — evidence the vaccine works addresses perceived benefits.","Correct — removes cost and access barriers.","Correct — an external trigger to act.","Mismatched — an easy process builds self-efficacy.","Correct — seriousness of consequences."],"src":"Module 1 Study Guide §VI (Primary = Prevent, Secondary = Screen, Tertiary = Treat) and §X (Health Belief Model constructs; SDOH → perceived barriers) · Final Exam Study Guide, Module 1 (SDOH, equity, prevention, HBM, care coordination, emergency response)"},{"id":"M4-14","m":4,"lo":"4.4","t":"Nursing impact — preventing cost","cj":"Generate Solutions","d":2,"type":"mc","s":"Using the professor’s Nursing Impact framework, which nursing action is best classified as PREVENTING cost for a 65-year-old with new type 2 diabetes and a foot ulcer?","r":"In the cost matrix worksheet, preventing cost means averting future expensive complications (foot-care teaching to prevent amputation). Reducing cost lowers costs from current problems (correct insulin technique to avoid an ED visit for hypoglycemia). Managing cost connects patients to resources (social work, transport, medication assistance).","o":["Teaching diabetic foot care to prevent a future amputation","Connecting him with a social worker for medication-assistance programs","Coordinating subsidized transportation to clinic visits","Negotiating a payment plan for his hospital bill"],"a":[0],"w":["Correct — prevents a costly future complication.","Managing cost.","Managing cost.","Managing cost."],"src":"Module 4 slides — Cost Matrix Worksheet, Mr. Jones example (preventing vs. reducing vs. managing cost) · Final Exam Study Guide, Module 4 (Medicare A–D, Medicaid, HMO/PPO/EPO, stewardship, value-based care)"},{"id":"M6-22","m":6,"lo":"6.4","t":"Mutual support — psychological safety","cj":"Generate Solutions","d":2,"type":"sata","s":"A nurse manager wants to strengthen mutual support on a unit where nurses rarely ask for help. Which strategies align with TeamSTEPPS task assistance? Select all that apply.","r":"TeamSTEPPS task-assistance strategies: foster psychological safety and protect each other from overload, frame requests and offers in the context of patient safety, create a climate in which help is expected, and extend assistance to patients and caregivers. Rewarding people who never ask for help, or keeping requests private, discourages help-seeking.","o":["Set the expectation that assistance will be actively sought and offered","Keep requests for help private so no one appears unable to cope","Protect teammates from work overload during peaks","Recognize nurses who complete their assignments without asking for help","Frame requests and offers of help in terms of patient safety"],"a":[0,2,4],"w":["Correct — expectation of help.","Secrecy discourages help-seeking and undermines psychological safety.","Correct — protects from overload.","Rewards not asking for help, which discourages mutual support.","Correct — patient-safety framing."],"src":"Module 6 slides — Mutual Support (task assistance, formative feedback, advocacy and assertion, two-challenge rule, CUS, DESC) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"Z4-01","m":4,"lo":"4.2","t":"Medicare parts","cj":"Analyze Cues","d":1,"type":"cloze","s":"Case: A 70-year-old with Original Medicare is admitted for 3 days with heart failure, sees her cardiologist in the office a week later, and starts a new oral medication from her retail pharmacy.","r":"Medicare is federal coverage for adults 65 and older, people with qualifying disabilities, or ESRD. Part A = inpatient/SNF/hospice; Part B = outpatient and provider services; Part C = Medicare Advantage (private plans combining A and B, often D); Part D = prescription drugs.","tpl":"The hospital stay is covered under Medicare Part {0}, the office visit under Part {1}, and the new prescription under Part {2}.","bl":[{"o":["B","C","A","D"],"a":2,"w":"Part A covers inpatient hospital stays, SNF care, and hospice."},{"o":["B","C","D","A"],"a":0,"w":"Part B covers outpatient care, provider visits, and preventive services."},{"o":["D","A","B","C"],"a":0,"w":"Part D covers outpatient prescription drugs. Part C is Medicare Advantage."}],"src":"Module 4 slides — Medicare Parts A–D and Medigap, Medicaid/CHIP, ACA provisions, Case Studies 1, 2 & 5; Health Care Law Worksheet — EMTALA and ACA · Final Exam Study Guide, Module 4 (Medicare A–D, Medicaid, HMO/PPO/EPO, stewardship, value-based care)"},{"id":"M2-12","m":2,"lo":"2.6","t":"Prioritization","cj":"Prioritize Hypotheses","d":3,"type":"mc","s":"After receiving handoff, an RN has four patients. Which patient should the RN assess first?","r":"A new, unexpected change—restlessness and a 46-point systolic drop after femoral access—suggests bleeding or hypovolemia, which is a potentially life-threatening, unstable finding. The others are expected, baseline, or non-urgent issues that can be addressed afterward.","o":["A patient 1 day post-hysterectomy with incisional pain of 6/10, due for analgesia in 15 minutes","A patient with a new restlessness and a BP of 92/58 who was 138/80 two hours ago after a femoral cardiac catheterization","A patient with COPD whose SpO2 is 89% on 2 L nasal cannula, at baseline per the handoff report","A patient with type 2 diabetes whose pre-lunch glucose is 212 mg/dL"],"a":[1],"w":["Expected postoperative pain with a scheduled plan.","Correct — acute, unexpected change suggesting hemorrhage.","An SpO2 of 88–92% is often the target for COPD and is baseline here.","Hyperglycemia that needs treatment but is not immediately life-threatening."],"src":"Module 1 Study Guide — NGN Clinical Judgment Framework (six CJMM steps); PCAP Module 2 learning outcome 5 (clinical judgment model) · Final Exam Study Guide, Module 2 (leader vs. manager, leadership theories, prioritization, 5 rights, EAT)"},{"id":"G-09","m":5,"lo":"5.5","t":"RCA — systems recommendation","cj":"Generate Solutions","d":2,"type":"mc","s":"Several medication errors have occurred at shift change. An RCA finds interruptions, confusing medication storage, and an incomplete handoff process. Which recommendation best reflects systems thinking?","r":"An RCA looks for system contributors, not someone to blame. Strong actions redesign the process (standardized handoff, protected time, separated look-alike storage) and are monitored with data. Weak actions—education, reminders, “be more careful”—depend on human vigilance, which is exactly what failed. Matching each action to an identified cause is the hallmark of a good action plan.","sg":"Final Study Guide & Practice — practice Q9","o":["Post reminders asking nurses to double-check medications at shift change","Require the involved nurses to complete a medication-safety module","Standardize handoff, cut interruptions, and redesign storage, then track error rates","Require a second RN signature for every medication given during the shift-change window"],"a":[2],"w":["Reminders are a weak, vigilance-based fix.","Education alone relies on individual vigilance and leaves the system causes in place.","Correct — targets each system cause and measures the result.","Adds workload without fixing interruptions, storage, or handoff."],"src":"Final Study Guide & Practice — practice Q9 · Module 5 slides — Root Cause Analysis (common mistakes; “human error is rarely the root cause”), 5 Whys fall example, Fishbone categories, Countermeasures vs. Solutions · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"G-32","m":2,"lo":"2.5","t":"Delegating VS and I&O","cj":"Take Action","d":2,"type":"sata","s":"Using the same four patients—A (new heart failure admission on titratable nitroglycerin), B (stable post-op day 2, going home), C (stable chronic COPD with a pressure injury), and D (stable cellulitis on IV antibiotics)—for which patients may the charge nurse delegate routine vital signs and intake and output to the UAP? Select all that apply.","r":"Routine vital signs and I&O are delegable only for stable patients with predictable outcomes. When vital signs are used to titrate a drug or the patient is unstable, the measurement is part of RN assessment. Always give the UAP clear reporting parameters (Right Direction) and follow up on the results (Right Supervision).","sg":"PCAP Study Guide — worksheet Activity A (5)","o":["Patient D","Patient A","None, because telemetry units require licensed staff for all vital signs","Patient C","Patient B"],"a":[0,3,4],"w":["Correct — stable and ambulating.","Unstable and on a titratable drip—vital signs drive titration and need RN assessment.","UAP may take routine vital signs on stable telemetry patients.","Correct — stable for 48 hours.","Correct — stable and predictable."],"src":"PCAP Study Guide — worksheet Activity A (5) · Boot Camp §05 (five rights of delegation; RN keeps assessment, evaluation, teaching); PNC Module 7 legal chapter — Personal Liability in Delegation and Supervision · Final Exam Study Guide, Module 2 (leader vs. manager, leadership theories, prioritization, 5 rights, EAT)"},{"id":"N9-07","m":9,"lo":"9.1","t":"Professional identity behaviors","cj":"Evaluate Outcomes","d":2,"type":"sata","s":"A nurse manager is evaluating new graduates at the end of residency. Which behaviors demonstrate developing professional identity? Select all that apply.","r":"Professional identity integrates values, knowledge, and ethics into how a nurse thinks and acts: accountability for one’s own errors, reflection and feedback, evidence-based shared governance, and person-centered care grounded in cultural humility. Deferring patient goals entirely and silently accepting unsafe assignments abandon advocacy and accountability.","o":["Asks for feedback after a rapid response and reflects on what she would change","Accepts an assignment outside her competence without comment to show she is a team player","Defers all questions about patient goals to the provider to avoid overstepping","Reports her own near-miss medication error through the safety system","Asks a patient what matters most to her before planning discharge teaching","Joins the unit practice council and brings a recent evidence summary on CAUTI"],"a":[0,3,4,5],"w":["Correct — reflection and feedback.","Accepting an assignment outside one’s competence is unsafe; nurses must articulate limits.","Patient advocacy and shared decision-making are part of the nurse’s role.","Correct — accountability and transparency.","Correct — person-centered care and cultural humility.","Correct — evidence-based practice and shared governance."],"src":"PNC Modules 8–9 — Giddens Professional Identity concept (four domains; integrity, courage, humility, advocacy exemplars) · Final Exam Study Guide, Module 9 (licensure, BON/NPA, NCLEX/NLC, certification, ANA Code, Benner, lifelong learning)"},{"id":"G-14","m":7,"lo":"7.7","t":"Autonomy","cj":"Analyze Cues","d":1,"type":"mc","s":"An alert, competent adult refuses a recommended blood transfusion after discussing risks and alternatives with the provider. Which ethical principle most directly supports respecting the decision?","r":"Autonomy is the right of a competent, informed person to make their own health decisions—including refusing recommended care. When autonomy and beneficence conflict, a competent patient’s informed refusal is honored. The nurse confirms understanding, notifies the provider, documents objectively, and never coerces.","sg":"Final Study Guide & Practice — practice Q14","o":["Autonomy","Fidelity","Beneficence","Nonmaleficence"],"a":[0],"w":["Correct — a competent adult’s informed choice, including refusal.","Fidelity is keeping promises and commitments.","Beneficence is acting for the patient’s good—here it would push toward the transfusion.","Nonmaleficence is avoiding harm; it does not by itself support honoring refusal."],"src":"Final Study Guide & Practice — practice Q14 · PNC Module 7 ethics chapter — Ethical Theory (utilitarianism, deontology), Ethical Principles (autonomy, beneficence/nonmaleficence, veracity), Box 9.3 Situation Assessment Procedure · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"N8-04","m":8,"lo":"8.6","t":"Automation bias","cj":"Prioritize Hypotheses","d":3,"type":"mc","s":"An AI falls-risk model rates a patient “low risk.” The nurse notes the patient received a new sedating medication 1 hour ago, is impulsive, and has tried to stand without help twice. What should guide the nurse’s next action?","r":"AI is a decision-support tool, not a replacement for clinical judgment. Deferring to the output despite contradictory findings is automation bias. The nurse acts on the assessment, implements safety measures, documents the reasoning, and may report the discrepancy.","o":["The charge nurse’s opinion, since the score and assessment conflict","The model, because it analyzes more data points than a single nurse assessment","The model, but she should recheck the score in 4 hours after the sedative wears off","Her assessment—start fall precautions now and document her reasoning"],"a":[3],"w":["The nurse can act within her own scope now; consultation is optional, not a prerequisite.","Data volume doesn’t override direct observation of new risk factors.","Delays protection during the highest-risk window.","Correct — clinical judgment guides action."],"src":"PNC Modules 8–9 — Health IT concept and IT in the Clinical Setting (clinical decision support, technology and judgment) · Final Exam Study Guide, Module 8 (HIT, AI applications, benefits/risks, ethical and legal concerns)"},{"id":"N9-02","m":9,"lo":"9.2","t":"Nurse Licensure Compact","cj":"Analyze Cues","d":3,"type":"mc","s":"A nurse whose primary residence is in Georgia holds a multistate license through the Nurse Licensure Compact (NLC). She is offered a telehealth role providing follow-up calls to patients located in Florida (a compact state) and California (not a compact state). Which statement is accurate?","r":"Nursing practice occurs where the patient is located. The NLC lets a nurse with a multistate license from her home (primary residence) state practice in other compact states, including by telehealth. Non-compact states such as California require their own license. Licensure remains a state function, not federal.","o":["She needs separate Florida and California licenses, because the compact does not cover telehealth","She may see Florida patients under her multistate license but needs a California license","Her Georgia license allows practice with patients in any state, because telehealth is regulated federally","She may care for California patients if a California-licensed nurse co-signs her documentation"],"a":[1],"w":["The compact covers telehealth practice in compact states.","Correct — the multistate privilege covers compact states only.","Licensure is state-based; there is no federal telehealth nursing license.","Co-signature does not authorize practice without a license in that state."],"src":"PNC Modules 8–9 — Giddens Professional Identity concept; PNC Module 7 — Sources of Law and State Nurse Practice Act; Georgia Rule 410-12 · Final Exam Study Guide, Module 9 (licensure, BON/NPA, NCLEX/NLC, certification, ANA Code, Benner, lifelong learning)"},{"id":"M4-03","m":4,"lo":"4.1","t":"HDHP / HSA arithmetic","cj":"Analyze Cues","d":3,"type":"mc","s":"A 29-year-old with an HDHP ($4,500 deductible) has $1,200 in her HSA. She has an urgent care visit costing $400 and an MRI costing $1,600. She uses her HSA to pay as much as possible. How much will she still owe out of pocket for these two services, and how much of her deductible remains unmet afterward?","r":"Total charges = $400 + $1,600 = $2,000, all of which fall under the deductible. The HSA covers $1,200, leaving $800 out of pocket. Amounts paid from an HSA still count toward the deductible, so $4,500 − $2,000 = $2,500 remains unmet.","o":["$0 owed; $4,500 remains because HSA payments do not count toward the deductible","$2,000 owed; $2,500 of the deductible remains","$800 owed; $2,500 of the deductible remains","$800 owed; $3,300 of the deductible remains"],"a":[2],"w":["HSA dollars are the patient’s own money and count toward the deductible.","Ignores the HSA funds.","Correct — $2,000 − $1,200 = $800; $4,500 − $2,000 = $2,500.","Subtracts only the HSA amount from the deductible rather than the total paid."],"src":"Module 4 slides — Case Study 4: The HDHP Patient (deductible and HSA arithmetic) · Final Exam Study Guide, Module 4 (Medicare A–D, Medicaid, HMO/PPO/EPO, stewardship, value-based care)"},{"id":"M5-14","m":5,"lo":"5.6","t":"STEEEP aims","cj":"Analyze Cues","d":1,"type":"mc","s":"An ED implements a protocol so that patients presenting with stroke symptoms receive CT imaging within 25 minutes of arrival. Which STEEEP aim is most directly targeted?","r":"STEEEP = Safe, Timely, Effective, Efficient, Equitable, Patient-centered. Timely care reduces harmful delays. Efficiency concerns reducing waste of resources; equity concerns consistent quality regardless of personal characteristics.","o":["Equitable","Patient-centered","Efficient","Timely"],"a":[3],"w":["Equity concerns differences across groups.","Patient-centeredness concerns respecting preferences and values.","Efficiency is about avoiding waste.","Correct — reducing harmful delays."],"src":"Econ/Quality Answer Key (STEEEP; Triple Aim; Donabedian; QSEN safety); PCAP Module 3 — NDNQI, QSEN, High Reliability Organizations · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"Z2-02","m":2,"lo":"2.5","t":"Delegation — EAT rule","cj":"Take Action","d":2,"type":"cloze","s":"Case: An RN is working with a UAP who has 2 years of experience. A stable patient 2 days after a stroke needs ambulation, and a patient on a new clear-liquid diet after bowel surgery needs evaluation of tolerance.","r":"Delegation transfers performance of a task, not accountability. The five rights—right task, circumstance, person, direction/communication, supervision/evaluation—apply. RNs keep the nursing process functions (EAT) and care of unstable patients.","tpl":"The RN may delegate {0} to the UAP, but must personally {1}, because the RN cannot delegate {2}.","bl":[{"o":["evaluating the bowel-surgery patient’s diet tolerance","assessing new abdominal pain in the bowel-surgery patient","ambulating the stroke patient with a gait belt","providing the stroke patient’s initial discharge teaching"],"a":2,"w":"Ambulation of a stable patient is a routine task with a predictable outcome."},{"o":["recheck every set of vital signs the UAP obtains","feed the bowel-surgery patient the clear-liquid lunch","document the UAP’s ambulation note under her own name","evaluate the patient’s tolerance of the clear liquids"],"a":3,"w":"Evaluation requires nursing judgment."},{"o":["tasks for patients older than 65 years","any care for patients with diabetes","any task that involves touching the patient","Evaluation, Assessment, or Teaching (EAT)"],"a":3,"w":"The course’s golden rule: RNs cannot delegate Evaluation, Assessment, Teaching, or care of unstable patients."}],"src":"Boot Camp §05 (five rights of delegation; RN keeps assessment, evaluation, teaching); PNC Module 7 legal chapter — Personal Liability in Delegation and Supervision · Final Exam Study Guide, Module 2 (leader vs. manager, leadership theories, prioritization, 5 rights, EAT)"},{"id":"M1-16","m":1,"lo":"1.6","t":"Emergency management phases","cj":"Analyze Cues","d":1,"type":"mc","s":"Hospital leaders install backflow valves and relocate the emergency generator above the 100-year floodplain after a regional flood risk assessment. Which emergency-management phase does this represent?","r":"Mitigation includes long-term activities that reduce or eliminate the adverse effects of future disasters (structural changes, relocation). Preparedness builds capability—plans, drills, training, and stockpiles. Response occurs during the event; recovery restores normal operations afterward.","o":["Mitigation","Recovery","Preparedness","Response"],"a":[0],"w":["Correct — reduces the effects of a future flood.","Recovery restores operations after an event.","Preparedness is planning and training, not structural risk reduction.","Response occurs during the event."],"src":"PCAP Module 1 — Emergency Preparedness chapter (mitigation, preparedness, response, recovery; crisis standards of care; MCI triage; incident command; biologic agents); Module 1 Study Guide §IX · Final Exam Study Guide, Module 1 (SDOH, equity, prevention, HBM, care coordination, emergency response)"},{"id":"G-48","m":9,"lo":"9.1","t":"Leadership philosophy","cj":"Evaluate Outcomes","d":2,"type":"mc","s":"A graduating nurse is drafting a personal leadership statement. Which statement best reflects the professional identity described in the course?","r":"A strong leadership philosophy is specific and grounded in patient advocacy, accountability, interprofessional collaboration, cultural humility, evidence-based practice, systems thinking, and continued development. Professional identity means thinking, acting, and feeling like a nurse—it is shown through behavior, not titles.","o":["“I will lead by following every policy exactly and avoiding conflict with providers.”","“I will rely on my clinical experience rather than research to guide care.”","“I will advocate for patients, own my practice, collaborate across disciplines, and keep learning.”","“I will become a charge nurse within one year to show leadership.”"],"a":[2],"w":["Compliance alone ignores advocacy and speaking up for safety.","Rejects evidence-based practice.","Correct — advocacy, accountability, collaboration, and lifelong learning.","A title is not a philosophy; leadership does not require a position."],"src":"PNC Modules 8–9 — Giddens Professional Identity concept (four domains; integrity, courage, humility, advocacy exemplars) · Final Exam Study Guide, Module 9 (licensure, BON/NPA, NCLEX/NLC, certification, ANA Code, Benner, lifelong learning)"},{"id":"M1-27","m":1,"lo":"1.4","t":"Tertiary prevention & self-management","cj":"Evaluate Outcomes","d":3,"type":"mc","s":"A nurse led a 6-week self-management program for adults with established type 2 diabetes. Which finding best demonstrates that the tertiary-prevention goal of the program was met?","r":"Tertiary prevention reduces complications of established disease. A clinically meaningful A1C drop plus avoided ED visits are outcome measures of reduced disease burden. Satisfaction, attendance, and quiz recall are process measures or knowledge measures, not health outcomes.","o":["Mean A1C fell from 9.1% to 7.6% with no diabetes ED visits","Participants correctly identified the definition of diabetes on a quiz","Participants rated the class 4.8 out of 5 and said they felt more confident managing their diabetes","100% of participants attended at least five sessions"],"a":[0],"w":["Correct — clinical outcomes showing fewer complications.","Recall does not show improved disease control.","Satisfaction is not a clinical outcome.","Attendance is a process measure."],"src":"Module 1 Study Guide §VI (Primary = Prevent, Secondary = Screen, Tertiary = Treat) and §X (Health Belief Model constructs; SDOH → perceived barriers) · Final Exam Study Guide, Module 1 (SDOH, equity, prevention, HBM, care coordination, emergency response)"},{"id":"G-22","m":2,"lo":"2.2","t":"Transformational leadership","cj":"Analyze Cues","d":1,"type":"mc","s":"A nurse manager leads a unit through a new EHR transition by describing a shared vision of safer care, inviting nurses to share workflow ideas, and mentoring unit champions. Which leadership style is the manager demonstrating?","r":"Transformational leaders inspire a shared vision, empower staff, encourage innovation, and mentor others—the style most associated with Magnet hospitals and major change. Transactional leaders keep daily operations on track with rewards and corrective action. Autocratic leaders decide alone; laissez-faire leaders give little direction.","sg":"PCAP Study Guide — practice Q2","o":["Democratic","Transformational","Transactional","Servant"],"a":[1],"w":["Inviting input is participative, but the vision and mentoring define a broader style.","Correct — inspires a shared vision, fosters innovation, and develops people.","Transactional leaders manage through rewards, corrections, and compliance.","Servant leaders put followers’ needs first; the key features here are vision and change."],"src":"PCAP Study Guide — practice Q2 · PCAP Module 2 — Box 17.1 (transformational vs. transactional) and Management Styles table (autocratic, democratic, laissez-faire); Giddens Leadership concept (leadership styles) · Final Exam Study Guide, Module 2 (leader vs. manager, leadership theories, prioritization, 5 rights, EAT)"},{"id":"M5-01","m":5,"lo":"5.1","t":"Event classification","cj":"Recognize Cues","d":1,"type":"mc","s":"A nurse scans a patient’s wristband and the barcode system alerts that the IV bag of vancomycin is labeled for the patient in the next room. The nurse does not hang the bag. How should this event be classified?","r":"A near miss is an unplanned event that had the potential to cause harm but did not reach the patient. Near misses should still be reported because they reveal system vulnerabilities (for example, labeling or storage) before harm occurs.","o":["Never event","Adverse event","Sentinel event","Near miss"],"a":[3],"w":["Never events are serious, preventable events that occurred, such as wrong-site surgery.","No injury from medical management occurred.","No death or severe harm occurred.","Correct — the error was intercepted before reaching the patient."],"src":"Module 5 Quality & Safety slides — “Terms to Know” (near miss, adverse, sentinel, never event); Healthcare Quality & Safety Review Worksheet and Answer Key · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"M3-20","m":6,"lo":"6.6","t":"Questions before accepting employment","cj":"Recognize Cues","d":2,"type":"mc","s":"A new graduate has two job offers. Which interview answer is the strongest red flag for an unsafe staffing environment?","r":"ANA questions to ask before accepting employment include whether the organization mandates overtime and whether nurses can refuse without repercussions. Punitive mandatory overtime is linked to fatigue and errors. The other answers reflect protective practices.","o":["“We use a float pool of cross-trained nurses whose competencies are documented for each unit.”","“Refusing mandated overtime affects evaluations.”","“Our orientation is 12 weeks with a dedicated preceptor.”","“Our unit-based staffing committee reviews acuity data monthly.”"],"a":[1],"w":["Competency-validated floating is protective.","Correct — punitive mandatory overtime.","Strong orientation is a positive indicator.","Staff input into staffing is protective."],"src":"PCAP Module 3 — Workforce Advocacy: Safe Staffing, Box 13.3 (questions before employment), Box 13.5 (questions before accepting an assignment), Floating and Mandatory Overtime; PNC Module 7 — Floating and Cross-Training (Winkelman; Francis); PCAP Module 3 — Workplace Safety (violence, fatigue) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"K-14","m":3,"lo":"3.6","t":"Testifying to legislators","cj":"Take Action","d":3,"type":"mc","s":"A med-surg RN who chairs her unit practice council is invited to give 3 minutes of testimony to the state Senate Health Committee on a bill requiring nurse-driven staffing committees. Which testimony plan is most effective?","r":"Effective advocacy uses a credible identity (informed constituent and nurse), concise de-identified stories, data, and a specific request. Naming patients violates HIPAA; personal attacks damage credibility; reading long reviews loses the audience.","o":["Read a 15-page literature review word for word","Criticize her hospital’s CEO by name to show how serious the problem is","Identify as a constituent RN, share a brief de-identified story with data, and make a clear request","Share a patient’s first name and age only, to keep it personal but private"],"a":[2],"w":["Exceeds the time and loses impact.","Unprofessional and risks retaliation and reputation harm.","Correct — concise, credible, story plus data plus a clear request.","Even partial identifiers can identify a patient; de-identify fully."],"src":"PCAP Module 3 — Grassroots Political Strategies (visit policymakers; join professional organizations; how to address legislators) · Final Exam Study Guide, Module 3 (health policy, micro vs. macro advocacy, evidence-informed recommendations)"},{"id":"M2-02","m":2,"lo":"2.2","t":"Leadership styles","cj":"Analyze Cues","d":1,"type":"mc","s":"A patient on a telemetry unit becomes pulseless. The charge nurse enters the room, assigns compressions, airway, medications, and recorder by name, and directs each intervention without discussion. Later, the same charge nurse invites staff to design the holiday schedule together. Which statement best evaluates the charge nurse’s leadership?","r":"The textbook notes that autocratic management may be appropriate in emergencies such as cardiac arrest, whereas participative styles work better for planning tasks such as schedules. Effective leaders adapt style to the situation—a contingency/situational approach.","o":["She used laissez-faire leadership in both situations","She should have held a quick team vote before assigning code roles so that every team member felt included","She is inconsistent; effective leaders should use a single style","She matched her style to each situation appropriately"],"a":[3],"w":["She gave clear direction in the code—the opposite of laissez-faire.","Voting delays lifesaving care.","Flexing style to the situation is a strength.","Correct — style matched to the situation."],"src":"PCAP Module 2 — Box 17.1 (transformational vs. transactional) and Management Styles table (autocratic, democratic, laissez-faire); Giddens Leadership concept (leadership styles) · Final Exam Study Guide, Module 2 (leader vs. manager, leadership theories, prioritization, 5 rights, EAT)"},{"id":"G-20","m":9,"lo":"9.3","t":"Lifelong learning","cj":"Take Action","d":1,"type":"mc","s":"A new graduate nurse wants to demonstrate professional identity and lifelong learning. Which action is most appropriate?","r":"Professional identity develops through reflection, feedback, mentorship, evidence-based practice, residency programs, and continuing education. Licensure is the legal authority to practice; certification is a voluntary specialty credential that never replaces the license. Benner’s model reminds new nurses that expertise grows with experience and support.","sg":"Final Study Guide & Practice — practice Q20","o":["Seek mentoring, reflect, use current evidence, and pursue CE","Pursue specialty certification right away to prove competence","Rely on her NCLEX pass as proof of ongoing competence","Save feedback requests for her annual evaluation to build independence"],"a":[0],"w":["Correct — the core behaviors of professional development.","Certification usually requires specialty experience and does not replace ongoing growth or licensure.","The NCLEX measures entry-level competence only.","Infrequent feedback slows growth and can hide unsafe gaps."],"src":"Final Study Guide & Practice — practice Q20 · PNC Modules 8–9 — Giddens Professional Identity concept (formation through experience, reflection, mentorship) · Final Exam Study Guide, Module 9 (licensure, BON/NPA, NCLEX/NLC, certification, ANA Code, Benner, lifelong learning)"},{"id":"M5-29","m":5,"lo":"5.2","t":"Systems approach to staffing","cj":"Generate Solutions","d":3,"type":"mc","s":"On a unit with recurrent late medication administration, an analysis shows that pharmacy deliveries arrive in a single batch at 0900, nurses have 6 patients each, and the automated cabinet is on the far end of the unit. Which plan reflects a total systems approach to safety?","r":"The professor’s total-systems approach shifts away from reactive, piecemeal fixes toward addressing system design. Each latent condition (delivery timing, equipment layout, staffing) is targeted. Counseling individuals ignores the causes.","o":["Fix delivery timing, cabinet location, and staffing","Change all scheduled medication times to 1200 so nurses have more time to complete the morning pass","Add a second medication pass at 1000 to catch missed doses","Counsel nurses individually about time management"],"a":[0],"w":["Correct — addresses multiple latent conditions.","May cause clinical harm by delaying therapy.","Adds workload without fixing the causes.","Blames individuals for system design."],"src":"Module 5 slides — Systems Thinking and the Swiss Cheese Model (active vs. latent failures; wrong-site surgery example); Econ/Quality Worksheet §4 (KCl scenario) · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"M7-27","m":7,"lo":"7.8","t":"ANA Code — duties to self & environment","cj":"Analyze Cues","d":2,"type":"sata","s":"Which situations are correctly matched to the 2025 ANA Code of Ethics provision they most directly reflect? Select all that apply.","r":"Provision 1 = compassion and dignity; Provision 2 = primary commitment to recipients of care; Provision 5 = duties to self; Provision 6 = ethical work environment; Provision 7 = advancing the profession through knowledge and standards; Provision 9 = social justice and eliminating inequities through policy. Research belongs to Provision 7, and lobbying for equity belongs to Provision 9.","o":["Nurses collectively redesign a unit’s staffing policy to improve the ethical work environment — Provision 6","A nurse respects a patient’s dignity regardless of the patient’s criminal history — Provision 1","A nurse lobbies for legislation to eliminate health inequities — Provision 2","A nurse declines a fourth consecutive 12-hour shift to protect her own health and integrity — Provision 5","A nurse publishes research that changes national practice standards — Provision 9"],"a":[0,1,3],"w":["Correct — the ethical work environment.","Correct — dignity and worth.","Mismatched — social justice legislation is Provision 9.","Correct — duties to self.","Mismatched — research and standards are Provision 7."],"src":"ANA Code of Ethics (2025) — 10 Provisions handout · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"Z4-03","m":4,"lo":"4.3","t":"Value-based purchasing & HACs","cj":"Analyze Cues","d":3,"type":"cloze","s":"Case: A hospital’s CAUTI rate and stage 3 pressure injuries have increased, and patient-experience scores have dropped.","r":"Value-based purchasing links payment to quality, safety, and patient experience. Hospital-acquired conditions (stage 3–4 pressure ulcers, falls with trauma, CAUTI, CLABSI) do not generate additional payment. Nurses influence both through prevention bundles, accurate documentation, and patient-centered care.","tpl":"Under {0}, the hospital’s incentive payments may fall because of these quality measures. CMS will also deny additional reimbursement for preventable {1}. The most direct nursing response is {2}.","bl":[{"o":["value-based purchasing","per diem contracts","fee-for-service","capitation"],"a":0,"w":"VBP rewards hospitals for quality rather than quantity of services."},{"o":["emergency transfers","outpatient visits","preventive screenings","hospital-acquired conditions"],"a":3,"w":"CMS denies additional payment for HACs such as CAUTI and stage 3–4 pressure injuries."},{"o":["implementing CAUTI and pressure-injury prevention bundles","documenting new injuries as present on admission","ordering extra daily labs to detect infections earlier","shortening discharge teaching to free nursing time"],"a":0,"w":"Prevention protects patients and reimbursement; mislabeling injuries is fraud."}],"src":"Module 4 slides — DRG reimbursement, per diem rates, value-based purchasing, HACs and readmission penalties; PCAP Module 4 — Paying for Health Care (DRGs, managed care, capitation) · Final Exam Study Guide, Module 4 (Medicare A–D, Medicaid, HMO/PPO/EPO, stewardship, value-based care)"},{"id":"K-01","m":6,"lo":"6.4","t":"Advocacy & assertion / CUS","cj":"Take Action","d":3,"type":"mc","s":"A 78-year-old admitted with pneumonia becomes newly restless at 2240 and pulls at her oxygen. SpO2 has fallen from 94% to 86%, RR is 28, HR 112, and temperature 38.4°C (101.1°F). After increasing oxygen per protocol, the nurse calls the covering hospitalist using SBAR. The hospitalist says, “She’s elderly and sundowning. Give lorazepam 1 mg IV and call me in the morning.” SpO2 is now 89% on 4 L. What is the nurse’s best response?","r":"CUS (Concerned, Uncomfortable, Safety issue) with objective data and a clear request is the correct assertive escalation. Sedating a hypoxemic, delirious patient can precipitate respiratory failure. Activating the rapid response team is within nursing authority when criteria are met.","o":["Give the lorazepam as ordered and monitor overnight","Hang up and document in the chart that the provider refused to come in and evaluate the patient","“I’m concerned and uncomfortable giving a sedative—this is a safety issue. Her SpO2 fell to 86% with fever. Please come now; I’m calling the RRT.”","Give half the lorazepam dose and recheck SpO2 in 15 minutes"],"a":[2],"w":["A sedative may worsen hypoxemia and mask decline.","Documentation without escalation leaves the patient at risk.","Correct — CUS with data, a clear request, and RRT activation.","Any sedation risks respiratory depression in a hypoxemic patient; escalate instead."],"src":"Module 6 slides — Mutual Support (task assistance, formative feedback, advocacy and assertion, two-challenge rule, CUS, DESC) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"G-34","m":5,"lo":"5.4","t":"Just Culture classification","cj":"Analyze Cues","d":2,"type":"mc","s":"In the same insulin event, the RN bypassed BCMA because the scanner and charger were broken, believing the risk was justified. How should a manager applying Just Culture classify and respond?","r":"Just Culture: human error (slip or lapse) → console and fix the system; at-risk behavior (a shortcut where the risk isn’t recognized or seems justified) → coach and remove the incentives for the shortcut; reckless behavior (conscious disregard of substantial risk) → discipline. Here the manager coaches and repairs the equipment so the workaround is no longer needed.","sg":"PCAP Study Guide — worksheet Activity B (2)","o":["Human error—console the nurse and take no further action","No individual accountability, because the equipment caused the error","Reckless behavior—begin disciplinary action","At-risk behavior—coach the nurse and fix the equipment"],"a":[3],"w":["Bypassing BCMA was a choice, not an inadvertent slip.","Just Culture keeps individual accountability for choices.","Reckless behavior is conscious disregard of a substantial, known risk.","Correct — a shortcut taken under a false sense of justified risk."],"src":"PCAP Study Guide — worksheet Activity B (2) · Module 5 slides — “Just Culture” (shared accountability, psychological safety); Boot Camp §10 (human error vs. at-risk vs. reckless behavior) · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"M7-02","m":7,"lo":"7.2","t":"Elements of negligence","cj":"Analyze Cues","d":2,"type":"mc","s":"A nurse fails to raise the bed alarm for a patient with a documented high fall risk, contrary to the care plan. The patient gets up, falls, and fractures a hip. Which element of malpractice is established by showing that the fracture resulted from the unalarmed bed?","r":"The course teaches five elements of malpractice, all of which must be proven: duty, breach of duty, foreseeability, causation, and damages. Showing that the fracture resulted from the unalarmed bed establishes causation. Failing to follow the care plan is the breach, a fall being a predictable result of no alarm is foreseeability, and the fracture is the damages.","o":["Damages (actual injury)","Causation (proximate cause)","Breach of the standard of care","Foreseeability"],"a":[1],"w":["Damages are the injury itself (the fracture).","Correct — connects the breach to the injury.","Breach is failing to activate the alarm.","Foreseeability asks whether harm could reasonably be anticipated from the breach; it does not prove the breach caused this injury."],"src":"PNC Module 7 legal chapter — elements of negligence/malpractice, res ipsa loquitur, gross and criminal negligence, Good Samaritan immunity, vicarious liability (respondeat superior); Health Care Law Worksheet · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"Z8-01","m":8,"lo":"8.6","t":"AI sepsis alert and escalation","cj":"Take Action","d":3,"type":"cloze","s":"Case: An EHR sepsis-prediction model flags a post-op patient as high risk (HR 108, RR 22, temperature 38.1°C). The nurse finds new mild confusion and urine output of 20 mL/hr. The resident says, “Ignore the computer; it’s post-op inflammation. I’ll see them on rounds.”","r":"AI predictions support, but never replace, clinical judgment. When assessment confirms deterioration, the nurse advocates using CUS (“I am Concerned… I am Uncomfortable… This is a Safety issue”) and requests specific actions such as evaluation, lactate, cultures, and fluids.","tpl":"The AI alert should be treated as {0}. Because the nurse’s assessment {1}, the nurse should next {2}.","bl":[{"o":["a definitive diagnosis of sepsis","a standing order to start antibiotics","a nuisance alert that can be overridden","decision support that prompts assessment"],"a":3,"w":"Predictive models are early-warning decision support, not diagnostic authorities."},{"o":["contradicts the alert’s prediction of sepsis","confirms it with new confusion and oliguria","is unrelated to the alert’s data points","shows the patient is hemodynamically stable"],"a":1,"w":"New confusion and urine output below 30 mL/hr support impending sepsis."},{"o":["wait for morning rounds as the resident directed","silence the alert and recheck vitals in 4 hours","document that the resident declined and take no further action","use CUS to request evaluation now and escalate if needed"],"a":3,"w":"Unresolved safety concerns require assertive escalation."}],"src":"PNC Modules 8–9 — Health IT concept and IT in the Clinical Setting (clinical decision support, technology and judgment) · Final Exam Study Guide, Module 8 (HIT, AI applications, benefits/risks, ethical and legal concerns)"},{"id":"G-07","m":4,"lo":"4.1","t":"EPO rules","cj":"Analyze Cues","d":2,"type":"mc","s":"A patient with an EPO plan asks whether they can routinely see an out-of-network specialist. Which response is most accurate?","r":"Compare the three: HMO = PCP gatekeeper and referrals, in-network only, lowest premiums. PPO = no PCP/referrals, in- and out-of-network (out-of-network costs more), higher premiums. EPO = no referrals, but strictly in-network except emergencies. When a patient needs out-of-network flexibility, a PPO fits best—at higher cost.","sg":"Final Study Guide & Practice — practice Q7","o":["“Yes, if the specialist accepts Medicare patients.”","“You can, as long as your primary care provider writes a referral.”","“EPOs usually cover in-network care only, except emergencies.”","“EPOs cover out-of-network specialists at a higher coinsurance, like a PPO.”"],"a":[2],"w":["Medicare participation is unrelated to a private EPO network.","EPOs usually do not require referrals, and a referral does not create out-of-network coverage.","Correct — EPOs are network-only except emergencies; verify plan details.","That describes a PPO; EPOs do not cover routine out-of-network care."],"src":"Final Study Guide & Practice — practice Q7 · Module 4 Healthcare Economics slides — Health Insurance Plan Comparison table (HMO/PPO/EPO/POS), HDHP/HSA and catastrophic plans, Case Studies 3, 4 & 6; Comprehensive Guide to Healthcare Quality, Safety & Economics — Types of Plans · Final Exam Study Guide, Module 4 (Medicare A–D, Medicaid, HMO/PPO/EPO, stewardship, value-based care)"},{"id":"M8-16","m":8,"lo":"8.5","t":"Smart pumps","cj":"Take Action","d":2,"type":"mc","s":"A nurse is programming a heparin infusion. The smart pump displays a soft-limit alert that the rate exceeds the usual dose range. What should the nurse do?","r":"Smart pump drug libraries are a defense against programming errors. A soft-limit alert requires the nurse to stop and verify; bypassing the library (basic mode) removes the protection. High-alert drugs such as heparin often require an independent double-check.","o":["Bypass the drug library and program the pump in basic mode so the alert does not interrupt the infusion","Program the dose as ordered and document that the alert was overridden","Override the alert because soft limits are only suggestions","Stop and verify the order, concentration, and programming before starting"],"a":[3],"w":["Basic mode removes all protective limits.","Documentation does not replace verifying the order and concentration first.","Alerts require verification before override.","Correct — verify before infusing."],"src":"PNC Modules 8–9 — Point-of-Care Technology, Wearables, Telehealth (synchronous vs. asynchronous), Consumer Health IT; Module 5 slides — Technology and Patient Safety · Final Exam Study Guide, Module 8 (HIT, AI applications, benefits/risks, ethical and legal concerns)"},{"id":"M6-13","m":6,"lo":"6.4","t":"CUS words","cj":"Take Action","d":2,"type":"mc","s":"A nurse in a rural clinic is uneasy about a provider’s plan to discharge a patient with chest pain and a borderline troponin. Which statement correctly uses CUS?","r":"CUS escalates assertively in three steps: “I am Concerned,” “I am Uncomfortable,” “This is a Safety issue.” The key words signal that the team must stop and listen. Pairing CUS with a clear request is effective.","o":["“I’m Concerned about his troponin, I’m Uncomfortable sending him home, and this is a Safety issue.”","“Can you Check, Update, and Sign the discharge order?”","“I’m Concerned, I’m Unsure, and this is Serious.”","“Could you Clarify, Understand, and Summarize your plan?”"],"a":[0],"w":["Correct — Concerned, Uncomfortable, Safety issue.","Not CUS.","Close, but CUS is Concerned, Uncomfortable, Safety issue—standardized words that signal a stop.","Not CUS."],"src":"Module 6 slides — Mutual Support (task assistance, formative feedback, adv
