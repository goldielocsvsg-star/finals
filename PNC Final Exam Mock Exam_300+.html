am Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"M2-16","m":2,"lo":"2.2","t":"Laissez-faire risk","cj":"Evaluate Outcomes","d":2,"type":"mc","s":"Staff on a busy surgical unit report that their manager rarely makes decisions, communicates mainly by email, and gives no feedback. Fall rates have doubled, and two new hand-off workflows were never completed. Which conclusion is most accurate?","r":"Laissez-faire leadership gives little direction, makes few decisions, and offers no feedback. It can work with highly self-directed professionals, but here outcomes are deteriorating and initiatives stall, so more active leadership is needed.","o":["The laissez-faire style is effective because the staff are professionals","Passive leadership is contributing to poor outcomes","The manager is using a transformational style that empowers staff, and it simply needs more time to show results","An autocratic style is causing staff to disengage"],"a":[1],"w":["The outcomes data show it is not working.","Correct — passive leadership linked to poor outcomes.","No vision or empowerment is described.","Autocratic leaders control tightly; this manager is absent."],"src":"PCAP Module 2 — Box 17.1 (transformational vs. transactional) and Management Styles table (autocratic, democratic, laissez-faire); Giddens Leadership concept (leadership styles) · Final Exam Study Guide, Module 2 (leader vs. manager, leadership theories, prioritization, 5 rights, EAT)"},{"id":"M5-28","m":5,"lo":"5.1","t":"Adverse event classification","cj":"Analyze Cues","d":3,"type":"mc","s":"A patient receiving appropriately dosed and monitored IV vancomycin develops an unexpected rash requiring antihistamines; there is no allergy history. How is this best classified?","r":"An adverse event is an injury caused by medical management rather than the underlying condition; it may be preventable or unpreventable and does not meet the sentinel threshold. Negligence requires a breach of the standard of care, which did not occur here.","o":["Near miss","Medical negligence","Sentinel event","Adverse event"],"a":[3],"w":["The event reached the patient.","No breach of the standard of care occurred.","No death or severe harm occurred.","Correct — harm from care without negligence."],"src":"Module 5 Quality & Safety slides — “Terms to Know” (near miss, adverse, sentinel, never event); Healthcare Quality & Safety Review Worksheet and Answer Key · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"M1-03","m":1,"lo":"1.1","t":"Giger–Haddad cultural phenomena","cj":"Prioritize Hypotheses","d":2,"type":"mc","s":"A patient tells the nurse, “Whatever happens with my cancer is in God’s hands; there is no point in changing my diet.” Using the Giger–Haddad Transcultural Assessment Model, which cultural phenomenon is the nurse primarily assessing, and what is the best follow-up?","r":"Environmental control is a person’s perceived ability to control nature and their health (internal vs. external locus of control). A fatalistic, external locus affects use of health resources. The nurse explores these beliefs respectfully rather than arguing, then finds common ground (for example, framing nutrition as caring for the body).","o":["Environmental control; explore her beliefs about who controls health and how care can align","Biologic variations; review the patient’s genetic risk factors for cancer progression","Social organization; ask which family members are responsible for preparing meals and making health decisions","Time orientation; schedule teaching sessions at times that fit the patient’s routine"],"a":[0],"w":["Correct — external locus of control is an environmental-control cue.","Biologic variation refers to physical and genetic differences, not beliefs.","Social organization concerns family and group structure; the cue is about control over outcomes.","Time orientation concerns past/present/future focus, not who controls health outcomes."],"src":"PCAP Module 1 Book Chapters — Cultural Competence chapter (Giger & Haddad’s six cultural phenomena; skilled interpreter mandatory); Module 1 Study Guide §I (cultural humility; professional interpreters over family) · Final Exam Study Guide, Module 1 (SDOH, equity, prevention, HBM, care coordination, emergency response)"},{"id":"M5-17","m":5,"lo":"5.6","t":"Triple Aim","cj":"Evaluate Outcomes","d":1,"type":"mc","s":"A health system’s board is evaluating a nurse-led community heart failure program. Which set of results best demonstrates achievement of the Triple Aim?","r":"The Triple Aim is better care for individuals, better health for populations, and lower per-capita cost (the course answer key marks “patient safety, quality of life, and cost containment” as a false definition). Only the first option shows all three: patient experience (care), community admission rates (population health), and per-capita cost.","o":["Patients rate their care experience higher, the county’s HF admission rate falls, and per-capita cost of HF care drops","All program staff complete training, enrollment targets are met, and the program stays within budget","Readmissions fall, nurse satisfaction rises, and the program wins a regional quality award","Safety events decline, average length of stay shortens, and hospital charges generate more revenue"],"a":[0],"w":["Correct — care, population health, and per-capita cost.","Process and budget measures, not the three aims.","Mixes outcomes with workforce satisfaction and recognition; omits per-capita cost.","More revenue is not lower per-capita cost."],"src":"Econ/Quality Answer Key (STEEEP; Triple Aim; Donabedian; QSEN safety); PCAP Module 3 — NDNQI, QSEN, High Reliability Organizations · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"G-30","m":9,"lo":"9.2","t":"Legal scope of practice","cj":"Recognize Cues","d":1,"type":"mc","s":"A newly licensed RN who passed the NCLEX-RN is preparing to begin practice. Which entity primarily defines and regulates the legal scope of nursing practice?","r":"Each state’s Nurse Practice Act defines nursing practice, and the state Board of Nursing enforces it—issuing licenses, investigating complaints, and disciplining unsafe practice to protect the public. NCSBN writes the NCLEX and administers the Nurse Licensure Compact; the ANA Code guides ethics; TJC accredits organizations.","sg":"PCAP Study Guide — practice Q10","o":["The National Council of State Boards of Nursing (NCSBN)","The state Board of Nursing, through the state’s Nurse Practice Act","The American Nurses Association Code of Ethics","The Joint Commission, through its National Patient Safety Goals for hospitals"],"a":[1],"w":["NCSBN develops the NCLEX; it does not license or set scope.","Correct — each state’s NPA, enforced by its BON, defines scope.","The Code is the ethical standard; it is not law.","TJC accredits organizations, not individual nurses."],"src":"PCAP Study Guide — practice Q10 · PNC Modules 8–9 — Giddens Professional Identity concept; PNC Module 7 — Sources of Law and State Nurse Practice Act; Georgia Rule 410-12 · Final Exam Study Guide, Module 9 (licensure, BON/NPA, NCLEX/NLC, certification, ANA Code, Benner, lifelong learning)"},{"id":"M6-20","m":6,"lo":"6.3","t":"Debrief","cj":"Evaluate Outcomes","d":2,"type":"sata","s":"After a successful but chaotic rapid response, the charge nurse leads a debrief. Which questions are appropriate for the debrief? Select all that apply.","r":"A debrief is a structured yet informal exchange to improve team performance through lessons learned and reinforcement of positive behaviors. It belongs after every significant event—including successful ones—and focuses on communication, roles, and systems, not on blame.","o":["“Was communication clear, and were roles understood?”","“Since the patient survived, do we need to review anything?”","“Who made the mistake that slowed us down?”","“What went well that we should repeat?”","“Which nurse should we write up for the delay in starting compressions?”"],"a":[0,3],"w":["Correct — communication and roles.","Debriefs are valuable after successful events too.","Blame undermines psychological safety.","Correct — reinforces positive behaviors.","Blame undermines psychological safety and honest discussion."],"src":"Module 6 slides — Brief/Huddle/Debrief; Situation Monitoring (STEP, I’M SAFE, cross-monitoring) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"N9-01","m":9,"lo":"9.2","t":"Licensure vs. certification","cj":"Analyze Cues","d":2,"type":"mc","s":"An ICU nurse holds active CCRN certification. She forgot to renew her RN license, and it expired 10 days ago. She tells the charge nurse, “My CCRN is current, so I’m still covered to work tonight.” What is the charge nurse’s best response?","r":"Licensure is the legal authorization to practice nursing in a jurisdiction, granted by the state Board of Nursing. Specialty certification (such as CCRN) is a voluntary credential recognizing expertise beyond entry level—it does not authorize practice. Practicing on an expired license is practicing without a license, a reportable ground in Georgia Rule 410-12.","o":["“Your certification shows advanced competence, so you can work while the renewal processes.”","“You can work tonight if you notify the Board of Nursing before your shift starts.”","“Not until your license is renewed—certification doesn’t authorize practice.”","“You can work if you stay in a precepted role until the license is renewed.”"],"a":[2],"w":["Certification never substitutes for an active license.","Notifying the Board does not authorize practice on an expired license.","Correct — licensure is the legal authority to practice; certification is voluntary recognition.","A precepted role is still RN practice and requires an active license."],"src":"PNC Modules 8–9 — Giddens Professional Identity concept; PNC Module 7 — Sources of Law and State Nurse Practice Act; Georgia Rule 410-12 · Final Exam Study Guide, Module 9 (licensure, BON/NPA, NCLEX/NLC, certification, ANA Code, Benner, lifelong learning)"},{"id":"M1-22","m":1,"lo":"1.2","t":"Health literacy","cj":"Take Action","d":2,"type":"mc","s":"A patient with newly diagnosed heart failure nods throughout discharge teaching and says, “I’ll read it at home,” while holding the instructions upside down. Which action is best?","r":"Holding the paper upside down and deferring reading are cues of limited health literacy. Effective strategies limit content to key actions, use plain language and visuals, and confirm comprehension with teach-back. “Any questions?” and nodding do not verify understanding.","o":["Document that teaching was completed and that the patient verbalized understanding of the discharge instructions","Ask the patient whether they have any questions before leaving","Give the patient additional pamphlets to read at home","Use plain language and pictures, focus on key actions, and confirm with teach-back"],"a":[3],"w":["Inaccurate documentation; understanding was not verified.","Closed questions rarely reveal a misunderstanding.","More written material does not help a patient who cannot read it.","Correct — literacy-sensitive teaching with teach-back."],"src":"Module 1 Study Guide §II–III (equality vs. equity; disparities = the problem, equity = the goal; SDOH); PCAP Module 1 — Giddens Health Disparities concept (unavoidable/avoidable × acceptable/unacceptable) · Final Exam Study Guide, Module 1 (SDOH, equity, prevention, HBM, care coordination, emergency response)"},{"id":"M6-09","m":6,"lo":"6.3","t":"I’M SAFE checklist","cj":"Recognize Cues","d":2,"type":"mc","s":"Before a night shift, a nurse realizes she took a sedating antihistamine 2 hours ago, slept 4 hours, and is upset after an argument at home. Using the I’M SAFE checklist, what is the most appropriate action?","r":"I’M SAFE (Illness, Medication, Stress, Alcohol/drugs, Fatigue, Eating/elimination) helps team members judge their own ability to perform safely. Several items are positive here, so she should speak up before accepting a patient assignment.","o":["Self-assess with I’M SAFE and tell the charge nurse","Work the shift but take only stable patients, without mentioning the antihistamine to anyone","Accept the assignment and ask a coworker to double-check her medications","Work the shift and drink extra coffee"],"a":[0],"w":["Correct — self-monitoring with transparent communication.","Hides a safety risk from the team.","Partial mitigation, but she should disclose impairment so the charge nurse can decide fitness for duty.","Does not address impairment."],"src":"Module 6 slides — Brief/Huddle/Debrief; Situation Monitoring (STEP, I’M SAFE, cross-monitoring) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"G-02","m":1,"lo":"1.4","t":"Health Belief Model — barrier","cj":"Analyze Cues","d":1,"type":"mc","s":"A patient says, “I know exercise could help my blood pressure, but I do not have a safe place to walk.” Which Health Belief Model construct is most directly reflected?","r":"Perceived barriers are the tangible or psychological costs that stand between a person and the recommended behavior—here, no safe place to walk. Compare: self-efficacy is “I don’t think I can do it,” susceptibility is “I’m not at risk,” severity is “it isn’t serious,” and benefits is “it won’t help.” The matching intervention reduces the barrier (indoor walking programs, community center hours, walking groups).","sg":"Final Study Guide & Practice — practice Q2","o":["Self-efficacy","Perceived barrier","Cue to action","Perceived severity"],"a":[1],"w":["Self-efficacy is confidence in her own ability; she names an outside obstacle, not low confidence.","Correct — an unsafe environment is an obstacle that makes the behavior costly or hard.","A cue is a trigger that prompts action, such as a reminder or symptom.","Severity is how serious she believes high blood pressure is; she does not question that."],"src":"Final Study Guide & Practice — practice Q2 · Module 1 Study Guide §VI (Primary = Prevent, Secondary = Screen, Tertiary = Treat) and §X (Health Belief Model constructs; SDOH → perceived barriers) · Final Exam Study Guide, Module 1 (SDOH, equity, prevention, HBM, care coordination, emergency response)"},{"id":"M7-25","m":7,"lo":"7.7","t":"Ethical decision-making model","cj":"Generate Solutions","d":3,"type":"mc","s":"A nurse faces a dilemma: an adolescent’s parents refuse a blood transfusion for religious reasons. Using the Situation Assessment Procedure (Wright), what should the nurse do first?","r":"Wright’s model: (1) identify the ethical issues and problems—facts plus human dimensions (feelings, values, opinions)—and state the dilemma; (2) identify and analyze alternatives; (3) select one; (4) justify the selection. Starting elsewhere skips essential understanding.","o":["Choose the action that minimizes the hospital’s legal risk and document the rationale","Select the option most consistent with hospital policy","Identify and analyze alternatives for action","Identify the ethical issues and facts"],"a":[3],"w":["Legal risk is a consideration, but the model begins with identifying the issues.","Selection comes after identifying issues and analyzing alternatives.","This is the second step; first identify the issues and facts.","Correct — the first step."],"src":"PNC Module 7 ethics chapter — Ethical Theory (utilitarianism, deontology), Ethical Principles (autonomy, beneficence/nonmaleficence, veracity), Box 9.3 Situation Assessment Procedure · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"M4-27","m":4,"lo":"4.3","t":"Hospital-acquired conditions","cj":"Generate Solutions","d":3,"type":"sata","s":"Medicare no longer pays hospitals for certain hospital-acquired conditions. Which nursing interventions directly protect both patients and hospital finances under this policy? Select all that apply.","r":"Falls with injury, CAUTI, and stage 3–4 pressure injuries are among non-reimbursed HACs, so preventing them protects patients and revenue. Accurate present-on-admission documentation is required; mislabeling hospital-acquired injuries as present on admission or delaying documentation is falsification.","o":["Delaying documentation of new injuries until discharge","Consistent fall-risk screening and individualized fall-prevention interventions","Scheduled repositioning and skin assessment for immobile patients","Documenting new pressure injuries as present on admission to avoid penalties","Daily review of indwelling urinary catheter necessity with prompt removal"],"a":[1,2,4],"w":["Inaccurate documentation is unethical and illegal.","Correct — prevents falls with injury.","Correct — prevents pressure injuries.","Falsely labeling hospital-acquired injuries as present on admission is fraud.","Correct — prevents CAUTI."],"src":"Module 4 slides — DRG reimbursement, per diem rates, value-based purchasing, HACs and readmission penalties; PCAP Module 4 — Paying for Health Care (DRGs, managed care, capitation) · Final Exam Study Guide, Module 4 (Medicare A–D, Medicaid, HMO/PPO/EPO, stewardship, value-based care)"},{"id":"M6-17","m":6,"lo":"6.5","t":"Language & communication failure","cj":"Prioritize Hypotheses","d":2,"type":"mc","s":"A bilingual daughter interprets intermittently for her Spanish-speaking father because the interpreter service is “too slow.” She later tells the nurse that her father does not understand his new medications. Which communication-failure category does this primarily represent?","r":"In the Module 6 opening case, failures were categorized as communication process, culture/language/health literacy/inclusion, role clarity/hierarchy, handoff/transition coordination, and escalation/safety culture. Relying on a family member instead of a qualified interpreter, with resulting misunderstanding, is a language/literacy failure.","o":["Role clarity or hierarchy","Handoff/transition coordination","Culture, language, health literacy, or inclusion","Escalation or safety culture"],"a":[2],"w":["Not about roles or hierarchy.","Handoff gaps exist in this case, but this failure is about language access and literacy.","Correct — language access and health literacy.","Not primarily about escalation."],"src":"Module 6 slides — opening case (Mr. Ramirez transfer; categorize communication failures) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"M7-09","m":7,"lo":"7.3","t":"False imprisonment","cj":"Take Action","d":3,"type":"mc","s":"A competent adult patient with pneumonia demands to leave. The nurse is worried and considers ways to keep him. Which action would expose the nurse to a claim of false imprisonment?","r":"False imprisonment is the unlawful restraint or detention of a person against their will; actual force is not necessary. Withholding clothing or a phone, posting security to guard the room, applying restraints, or sedating against the patient’s will can all support the claim.","o":["Withholding his clothes and phone","Documenting the conversation and the patient’s stated reasons","Asking the patient to sign an against-medical-advice form before he leaves the unit","Explaining the risks of leaving and notifying the provider"],"a":[0],"w":["Correct — detention by withholding property.","Appropriate documentation.","Appropriate — an AMA form documents informed refusal.","Appropriate — informs and escalates."],"src":"PNC Module 7 — Intentional Torts in Nursing Practice (assault, battery, false imprisonment, defamation); Health Care Law Worksheet Activity 4 and Answer Sheet · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"G-15","m":7,"lo":"7.3","t":"Assault","cj":"Analyze Cues","d":1,"type":"mc","s":"A nurse tells a competent patient, “If you don’t take this medication, I’ll have security hold you down and give it.” Which tort is most directly implicated by the threat?","r":"Assault = the threat (reasonable apprehension of unwanted contact). Battery = the touch (unauthorized contact). False imprisonment = unjustified confinement or restraint. Defamation = a false statement harming reputation (slander spoken, libel written). If the nurse then gave the injection, battery would be added.","sg":"Final Study Guide & Practice — practice Q15","o":["Battery","Assault","False imprisonment","Defamation"],"a":[1],"w":["Battery requires actual unauthorized contact, which has not occurred.","Correct — a threat creating reasonable fear of unwanted contact.","No one has confined or restrained the patient yet.","Defamation is a false statement that harms reputation."],"src":"Final Study Guide & Practice — practice Q15 · PNC Module 7 — Intentional Torts in Nursing Practice (assault, battery, false imprisonment, defamation); Health Care Law Worksheet Activity 4 and Answer Sheet · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"G-38","m":5,"lo":"5.7","t":"TJC National Patient Safety Goals","cj":"Take Action","d":2,"type":"sata","s":"A nurse is orienting new staff to The Joint Commission’s National Patient Safety Goals. Which practices reflect NPSGs? Select all that apply.","r":"The Joint Commission is an independent, nonprofit organization that accredits health care organizations and publishes National Patient Safety Goals, such as two patient identifiers, medication reconciliation, alarm safety, infection prevention, suicide-risk screening, and the Universal Protocol (site marking and time-out). Accreditation does not replace nurses’ duty to follow law, policy, and evidence.","o":["Silence nuisance alarms permanently to reduce alarm fatigue","Use the room number as one identifier when the patient is confused","Use two patient identifiers before medications, blood, and specimen collection","Perform a time-out immediately before an invasive procedure","Reconcile medications at admission, transfer, and discharge"],"a":[2,3,4],"w":["Alarm safety means managing alarms, not disabling them.","Room numbers are never an identifier.","Correct — patient identification goal.","Correct — Universal Protocol to prevent wrong-site surgery.","Correct — medication safety goal."],"src":"Module 5 slides — Most Common Medication Errors; Common Preventable In-Patient Safety Risks (HAIs, falls, failure to rescue); Patient Engagement; Comprehensive Guide to Healthcare Quality & Patient Safety · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"Z1-02","m":1,"lo":"1.4","t":"Health Belief Model & prevention level","cj":"Generate Solutions","d":2,"type":"cloze","s":"Case: A 52-year-old woman says, “I know colon cancer runs in my family and could kill me, and I know a colonoscopy catches it early—but I can’t take two days off work for the prep and the procedure.”","r":"Health Belief Model interventions work when they target the construct actually blocking behavior. Repeating risk or benefit information targets constructs she already holds. Primary prevention prevents disease, secondary prevention screens to detect it early, and tertiary prevention limits complications.","tpl":"The construct limiting her action is {0}. The best nursing intervention is {1}. Colonoscopy screening is an example of {2} prevention.","bl":[{"o":["perceived benefits","perceived barriers","perceived severity","perceived susceptibility"],"a":1,"w":"She already perceives susceptibility (family history), severity (“could kill me”), and benefits (early detection); lost work time is the barrier."},{"o":["reviewing her family history again so she sees how high her risk is","exploring a home stool test or weekend scheduling with her provider","sharing survival statistics for late-stage colon cancer","sending reminder texts before each upcoming clinic visit and screening date"],"a":1,"w":"Matching the intervention to the barrier means offering an option that avoids lost work time."},{"o":["quaternary","primary","secondary","tertiary"],"a":2,"w":"Screening for early detection is secondary prevention."}],"src":"Module 1 Study Guide §VI (Primary = Prevent, Secondary = Screen, Tertiary = Treat) and §X (Health Belief Model constructs; SDOH → perceived barriers) · Final Exam Study Guide, Module 1 (SDOH, equity, prevention, HBM, care coordination, emergency response)"},{"id":"M7-28","m":7,"lo":"7.7","t":"Moral distress","cj":"Generate Solutions","d":3,"type":"mc","s":"An ICU nurse repeatedly provides aggressive interventions to a patient she believes is suffering without benefit, as directed by the surrogate. She feels constrained from acting on her moral judgment and is losing sleep. What is the most appropriate action?","r":"Moral distress occurs when a nurse knows the ethically right action but feels constrained. Appropriate responses include ethics consultation, interdisciplinary communication with the surrogate, and support resources—consistent with the Code’s provisions on the ethical environment (6) and duties to self (5). Abandoning care or judging the family is inappropriate.","o":["Tell the family privately that she disagrees with their decision","Ask for a permanent transfer without discussing her concerns","Request an ethics consultation and family meeting, and use moral-distress support resources","Continue providing care silently, since the surrogate’s decision is legally binding"],"a":[2],"w":["Personal opinions can damage trust; use structured interdisciplinary communication.","Avoids the issue without resolving it.","Correct — uses ethical structures and self-care.","Ignores moral distress; ethics resources exist for exactly this."],"src":"PNC Module 7 ethics chapter — Ethical Theory (utilitarianism, deontology), Ethical Principles (autonomy, beneficence/nonmaleficence, veracity), Box 9.3 Situation Assessment Procedure · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"M4-18","m":4,"lo":"4.5","t":"Variance analysis","cj":"Evaluate Outcomes","d":3,"type":"mc","s":"A medical unit’s monthly report shows labor costs 14% over budget. Census was 8% above budget, and the average patient acuity score rose from 2.1 to 2.6. What is the most accurate interpretation?","r":"A variance is unfavorable when results are worse than expected (costs over budget). Variance analysis includes qualitative explanation—higher census and acuity justify increased labor. Accurate explanation helps ensure appropriate resources for safe care rather than reflexive cuts.","o":["The nurses are inefficient, so overtime should be prohibited","The variance is favorable because labor costs rose in proportion to census","The variance is favorable because more patients generate more revenue","The unfavorable variance is likely explained by higher volume and acuity, supporting more staffing"],"a":[3],"w":["Ignores the volume and acuity explanation.","Costs above budget are an unfavorable variance, and labor rose more (14%) than census (8%), consistent with higher acuity.","Higher costs than planned are an unfavorable expense variance.","Correct — quantitative plus qualitative variance analysis."],"src":"PCAP Module 4 — Budgeting chapter (Box 18.1 operating, labor, and capital budgets; FTE = 2,080 hours; favorable vs. unfavorable variance; productivity) · Final Exam Study Guide, Module 4 (Medicare A–D, Medicaid, HMO/PPO/EPO, stewardship, value-based care)"},{"id":"M2-11","m":2,"lo":"2.5","t":"Delegation to LPN","cj":"Prioritize Hypotheses","d":3,"type":"mc","s":"A team consisting of an RN and an LPN is assigned four patients. Which patient is most appropriate to assign to the LPN?","r":"LPNs care for stable patients with predictable outcomes and can give oral medications and perform dressing changes within their state scope. Initial assessment of a new, unstable admission, the start of a blood transfusion (high risk of reaction), and discharge teaching require RN judgment.","o":["A patient admitted 30 minutes ago with an acute GI bleed who needs an initial assessment","A patient receiving a first unit of packed red blood cells","A patient with stable chronic heart failure who needs scheduled oral medications and a dressing change","A patient being discharged today who needs teaching on new anticoagulation"],"a":[2],"w":["New admission with acute bleeding requires an RN initial assessment.","The first transfusion requires close RN monitoring for reactions.","Correct — stable, predictable, within LPN scope.","Discharge teaching is an RN responsibility."],"src":"Boot Camp §05 (five rights of delegation; RN keeps assessment, evaluation, teaching); PNC Module 7 legal chapter — Personal Liability in Delegation and Supervision · Final Exam Study Guide, Module 2 (leader vs. manager, leadership theories, prioritization, 5 rights, EAT)"},{"id":"M1-02","m":1,"lo":"1.1","t":"Cultural humility vs. stereotyping","cj":"Analyze Cues","d":2,"type":"mc","s":"During admission, a nurse reads in a cultural reference guide that members of the patient’s ethnic group “usually prefer family-centered decision-making.” The patient is a 40-year-old engineer who has not mentioned family involvement. Which nursing approach best reflects cultural humility?","r":"Cultural humility means ongoing self-reflection and partnership: the patient is the expert on their own values. Reference guides describe group tendencies, not individuals—applying them without asking is stereotyping and can violate autonomy.","o":["Ask the patient how they prefer health decisions to be made and who, if anyone, they want involved","Invite the patient’s extended family to all care conferences to honor their cultural norms","Document the cultural preference in the care plan for all staff to follow","Use the guide to plan a family meeting, then confirm the plan with the patient afterward"],"a":[0],"w":["Correct — partners with the patient rather than assuming.","Assumes a group norm applies to this individual.","Documents an unverified assumption as fact.","Still plans around an assumption; ask the patient first, not after."],"src":"PCAP Module 1 Book Chapters — Cultural Competence chapter (Giger & Haddad’s six cultural phenomena; skilled interpreter mandatory); Module 1 Study Guide §I (cultural humility; professional interpreters over family) · Final Exam Study Guide, Module 1 (SDOH, equity, prevention, HBM, care coordination, emergency response)"},{"id":"M4-02","m":4,"lo":"4.1","t":"Plan comparison table","cj":"Analyze Cues","d":3,"type":"sata","s":"Based on the course plan-comparison table, which statements about health plan types are accurate? Select all that apply.","r":"PPO: broad network, no referrals, out-of-network covered at higher cost, usually the highest premiums, discounted fee-for-service. EPO: exclusive network, no referral or PCP, out-of-network only in emergencies. POS: HMO/PPO hybrid requiring a PCP and referrals with some out-of-network coverage. HMO: lowest premiums, restricted network, typically capitation.","o":["An EPO covers out-of-network care at a higher cost, similar to a PPO","An EPO does not require choosing a PCP and covers out-of-network care only in emergencies","A PPO allows members to see specialists without a referral and covers out-of-network care at a higher cost","PPOs commonly reimburse providers through capitation","HMOs usually have the highest premiums because of their broad networks","A POS plan requires a PCP and referrals but allows some out-of-network care at higher cost"],"a":[1,2,5],"w":["Incorrect — EPOs do not cover out-of-network care except emergencies.","Correct — EPO features.","Correct — PPO flexibility.","PPOs typically use discounted fee-for-service; capitation is typical of HMOs.","Incorrect — HMOs are generally the most affordable.","Correct — the POS hybrid."],"src":"Module 4 Healthcare Economics slides — Health Insurance Plan Comparison table (HMO/PPO/EPO/POS), HDHP/HSA and catastrophic plans, Case Studies 3, 4 & 6; Comprehensive Guide to Healthcare Quality, Safety & Economics — Types of Plans · Final Exam Study Guide, Module 4 (Medicare A–D, Medicaid, HMO/PPO/EPO, stewardship, value-based care)"},{"id":"Z5-03","m":5,"lo":"5.6","t":"PDSA cycle design","cj":"Generate Solutions","d":2,"type":"cloze","s":"Case: A unit wants to reduce falls among patients receiving opioids.","r":"PDSA (Plan–Do–Study–Act) is a continuous, data-driven QI method: plan a specific change with a prediction, test it on a small scale, study measurable results, then act to adopt, adapt, or abandon the change.","tpl":"In the Plan step, the team predicts that {0} will reduce falls. In the Do step, they {1}. In the Study step, they {2}.","bl":[{"o":["giving all opioid doses at bedtime to reduce walking","scheduled toileting within 1 hour after opioid doses","telling all patients to be more careful at night","using bed alarms only for confused patients"],"a":1,"w":"A specific, testable change targets the identified risk."},{"o":["survey staff opinions only","test it on one unit for 2 weeks","implement it on all hospital units immediately","write a policy without testing"],"a":1,"w":"PDSA tests changes on a small scale first."},{"o":["compare falls per 1,000 patient-days with baseline","stop collecting data once the test period ends","identify which nurses were assigned during prior falls","count how many staff attended the kickoff training"],"a":0,"w":"Study compares measured outcomes with predictions."}],"src":"Econ/Quality Answer Key (STEEEP; Triple Aim; Donabedian; QSEN safety); PCAP Module 3 — NDNQI, QSEN, High Reliability Organizations · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"G-50","m":4,"lo":"4.4","t":"Stewardship without withholding care","cj":"Evaluate Outcomes","d":2,"type":"mc","s":"A unit is trying to cut supply costs. Which nursing action reflects fiscal stewardship?","r":"Fiscal stewardship means using supplies, staff time, and tests wisely while keeping care safe and effective. Good examples: avoid duplicate tests, use supplies appropriately, prevent falls and infections, reconcile medications, and coordinate transitions to prevent readmissions. Never withhold clinically indicated care just to save money.","o":["Use the least expensive dressing for all wounds regardless of type","Skip ordered sequential compression devices for ambulatory surgical patients","Open full supply kits in advance so they are ready for every patient","Coordinate so outside lab results aren’t repeated"],"a":[3],"w":["Cost cannot override clinical effectiveness.","Withholding indicated care is never acceptable stewardship.","Pre-opening kits creates waste.","Correct — avoids duplicate testing without reducing needed care."],"src":"Module 4 slides — How Cost vs. Charge Differences Arise; Cost Matrix Worksheet (direct medical, direct non-medical, indirect, intangible; preventing/reducing/managing cost); nurses as economic stewards · Final Exam Study Guide, Module 4 (Medicare A–D, Medicaid, HMO/PPO/EPO, stewardship, value-based care)"},{"id":"M6-08","m":6,"lo":"6.3","t":"STEP situation monitoring","cj":"Recognize Cues","d":3,"type":"sata","s":"A charge nurse uses the STEP tool during rounds. Which observations belong to the “Team members” or “Environment” components? Select all that apply.","r":"STEP = Status of the patient, Team members (fatigue, workload, skill, stress), Environment (facility, equipment, human resources, triage acuity), and Progress toward goal. A patient’s oxygen need is patient status; being behind on med passes is progress toward goal.","o":["The team is behind on 1400 medication passes","A nurse on her fourth consecutive 12-hour shift appears exhausted","Two travel nurses are unfamiliar with the unit’s code cart","The unit’s only bariatric lift is broken","The patient in room 6 has a new oxygen requirement"],"a":[1,2,3],"w":["Progress toward goal.","Correct — team member fatigue.","Correct — team member skill/familiarity.","Correct — environment/equipment.","Status of the patient."],"src":"Module 6 slides — Brief/Huddle/Debrief; Situation Monitoring (STEP, I’M SAFE, cross-monitoring) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"M1-11","m":1,"lo":"1.4","t":"Health Belief Model","cj":"Generate Solutions","d":2,"type":"mc","s":"A 34-year-old says, “I know HPV vaccination prevents cancer, and I’m worried about my risk, but I panic with needles and don’t think I can sit through three shots.” Which Health Belief Model construct is limiting action, and which intervention best addresses it?","r":"She already perceives susceptibility, severity, and benefit. What blocks her is low confidence in her ability to complete the behavior—self-efficacy. Education, practice, and support build self-efficacy. Repeating information about risk or benefit targets constructs that are not the problem.","o":["Perceived benefits; share data on vaccine effectiveness","Self-efficacy; teach coping techniques and support her through the first dose","Perceived susceptibility; review her personal cancer risk factors so she sees how vulnerable she is","Cues to action; enroll her in text reminders so each dose in the series is scheduled on time"],"a":[1],"w":["She already believes the vaccine works.","Correct — intervention matched to the limiting construct.","She already perceives her risk.","Reminders help with forgetting, not with low confidence."],"src":"Module 1 Study Guide §VI (Primary = Prevent, Secondary = Screen, Tertiary = Treat) and §X (Health Belief Model constructs; SDOH → perceived barriers) · Final Exam Study Guide, Module 1 (SDOH, equity, prevention, HBM, care coordination, emergency response)"},{"id":"M3-01","m":6,"lo":"6.6","t":"Accepting an assignment in good faith","cj":"Take Action","d":3,"type":"mc","s":"An adult med-surg nurse who has not cared for children since nursing school is told by the house supervisor to take charge of the pediatric unit tonight because the pediatric charge nurse called out. There is no disaster or declared emergency. Based on ANA guidance, what should the nurse do?","r":"The ANA says accepting charge of a pediatric unit without pediatric experience, outside an emergency, would be accepting in bad faith. The nurse must articulate limitations and seek a modified assignment; if no accommodation is made, she has an obligation to refuse the part for which she lacks competence. Abandonment occurs after accepting responsibility for patients and then leaving without handoff, not when declining an unsafe assignment beforehand.","o":["Accept the charge role and file an assignment-despite-objection form documenting her concerns","Accept the assignment but avoid documenting any concerns to protect the hospital","Accept the assignment because refusing could be considered patient abandonment","State her limitations and request a modified role, such as support nurse under an experienced pediatric RN"],"a":[3],"w":["Documentation is appropriate when overruled, but she must first seek a modification; taking charge of a population she lacks competence for, outside an emergency, is bad faith.","Concealing concerns is unethical and offers no protection.","Abandonment applies after accepting responsibility for patients; declining before accepting is not abandonment.","Correct — articulate limits and negotiate a safe modification."],"src":"PCAP Module 3 — Box 13.5, Question 8 (“Can I take the assignment in good faith?” — pediatric charge example) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"M6-14","m":6,"lo":"6.4","t":"DESC script","cj":"Generate Solutions","d":3,"type":"mc","s":"A nurse wants to address a colleague who repeatedly leaves IV pumps unprogrammed at shift change. Using DESC, which sequence is correct?","r":"DESC is a constructive approach to conflict: Describe the specific situation or behavior with data, Express concerns, Suggest alternatives, and state the Consequences (ideally reaching consensus). It is best held privately and focused on behavior, not personality.","o":["Describe, Escalate, Supervise, Correct","Demand change, Escalate to the manager, Suspend pump privileges, and Conclude the discussion","Describe, Express, Suggest, Consequences","Discuss, Evaluate, Solve, Commit"],"a":[2],"w":["Mixes terms; DESC is Describe, Express, Suggest, Consequences.","Punitive and not DESC.","Correct — Describe, Express, Suggest, Consequences.","Sounds plausible but is not the DESC script."],"src":"Module 6 slides — Mutual Support (task assistance, formative feedback, advocacy and assertion, two-challenge rule, CUS, DESC) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"M5-03","m":5,"lo":"5.2","t":"Active vs. latent failures","cj":"Analyze Cues","d":3,"type":"sata","s":"A nurse administered undiluted IV potassium chloride, causing cardiac dysrhythmias. Investigation found concentrated KCl stocked in the unit’s automated cabinet, no EHR alert for undiluted potassium, and no policy requiring premixed bags. Which factors are latent conditions? Select all that apply.","r":"Latent conditions are system weaknesses that lie dormant until combined with an active failure (the unsafe act at the sharp end). Stocking, missing alerts, and absent policy are latent; administering undiluted KCl and skipping the reference check are active failures.","o":["The nurse’s failure to check the drug reference","The nurse pushing the medication without diluting it","No policy requiring premixed potassium infusions","Concentrated KCl vials stocked on the patient-care unit","Absence of an EHR alert for undiluted IV potassium"],"a":[2,3,4],"w":["Active failure.","Active failure — the unsafe act.","Correct — a policy gap.","Correct — a dangerous stocking practice.","Correct — a technology gap."],"src":"Econ/Quality Review Worksheet §4 and Answer Key (undiluted IV KCl: latent conditions vs. active error) · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"M7-18","m":7,"lo":"7.5","t":"Language access (CLAS)","cj":"Take Action","d":2,"type":"mc","s":"A hospital that receives federal funds admits a patient with limited English proficiency at 0200. No in-person interpreter is available. Under CLAS standards, which action is required?","r":"CLAS standards require free and timely language assistance at all points of contact, at all hours, with verified competence of interpreters and bilingual staff. Family and friends should interpret only at the patient’s request.","o":["Use a bilingual housekeeper whose competence is not verified","Provide free, timely language assistance through a qualified phone or video interpreter","Use the patient’s adult son by phone, since he is available now","Wait until morning to communicate with the patient"],"a":[1],"w":["Competence must be ensured.","Correct — free, timely, qualified assistance.","Family should interpret only at the patient’s request; qualified services are required.","Delaying communication is not timely and risks harm."],"src":"PNC Module 7 — HIPAA and social media, EMTALA, ADA, CLAS language-access standards; Health Care Law Worksheet and Answer Sheet · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"M1-25","m":1,"lo":"1.6","t":"Personal & family preparedness","cj":"Generate Solutions","d":2,"type":"mc","s":"During a hospital preparedness drill, several nurses admit they have no plan for their own children or pets if they are called in for an extended disaster shift. Why does the emergency management team prioritize staff family-preparedness planning?","r":"Preparedness includes personal and family plans. Staff absenteeism during disasters is strongly linked to concern for dependents; when families are prepared, staff can report and perform, which protects hospital surge capacity.","o":["Staff who know their families are safe are more likely to report to work and perform well","It is required only for nurses assigned to the emergency department and critical care units during a disaster","It is mainly required for accreditation rather than for surge staffing","It reduces the hospital’s need to activate an incident command structure because staff self-organize"],"a":[0],"w":["Correct — supports workforce availability during response.","All staff may be called in, not only ED nurses.","Accreditation matters, but the operational reason is workforce availability during response.","Incident command is still required."],"src":"PCAP Module 1 — Emergency Preparedness chapter (mitigation, preparedness, response, recovery; crisis standards of care; MCI triage; incident command; biologic agents); Module 1 Study Guide §IX · Final Exam Study Guide, Module 1 (SDOH, equity, prevention, HBM, care coordination, emergency response)"},{"id":"G-52","m":2,"lo":"2.6","t":"Prioritization — new chest pain","cj":"Prioritize Hypotheses","d":1,"type":"mc","s":"A nurse has four patients: one with new chest pain, one awaiting a routine discharge, one with stable chronic pain requesting a scheduled medication, and one who needs help ordering lunch. Whom should the nurse see first?","r":"New, acute, or unexpected findings come before chronic, stable, or routine needs. New chest pain may indicate a cardiac event (circulation), so it is assessed first. Use the ABCs, then acute vs. chronic, then Maslow, and delegate non-urgent tasks when appropriate.","sg":"PCAP Study Guide — worksheet Module 2 (7)","o":["The patient with new chest pain","The patient with stable chronic pain","The patient who needs help ordering lunch","The patient awaiting a routine discharge"],"a":[0],"w":["Correct — a new symptom that may signal an acute, life-threatening problem.","Expected and stable; can be addressed next.","A non-urgent need that can be delegated.","Important for flow, but not urgent."],"src":"PCAP Study Guide — worksheet Module 2 (7) · Module 1 Study Guide — NGN Clinical Judgment Framework (six CJMM steps); PCAP Module 2 learning outcome 5 (clinical judgment model) · Final Exam Study Guide, Module 2 (leader vs. manager, leadership theories, prioritization, 5 rights, EAT)"},{"id":"Z2-01","m":2,"lo":"2.6","t":"Prioritization frameworks","cj":"Prioritize Hypotheses","d":3,"type":"cloze","s":"Case: A med-surg nurse receives report on four patients: (A) chronic kidney disease, potassium 5.1 mEq/L, dialysis in 1 hour; (B) post-op day 1 hip replacement with pain 6/10; (C) pneumonia with new restlessness and SpO2 88% on 2 L; (D) type 1 diabetes with pre-lunch glucose 184 mg/dL.","r":"Prioritize immediate threats to airway, breathing, and circulation and new, unstable changes over chronic or expected findings. A potassium of 5.1 with dialysis scheduled, expected post-op pain, and mild hyperglycemia are lower priority than new hypoxemia with mental-status change.","tpl":"The nurse should see patient {0} first, using the {1} framework, because new restlessness is an early sign of {2}.","bl":[{"o":["C","A","B","D"],"a":0,"w":"Patient C has an acute airway/breathing threat; the others are expected or stable findings with a plan."},{"o":["ABCs and acute-vs.-chronic","Maslow self-actualization","Benner novice-to-expert","first-come, first-served"],"a":0,"w":"ABCs plus acute/unexpected over chronic/expected changes guide this priority."},{"o":["hyperkalemia","anxiety about hospitalization","opioid withdrawal","hypoxia"],"a":3,"w":"Restlessness with falling SpO2 suggests cerebral hypoxia."}],"src":"Module 1 Study Guide — NGN Clinical Judgment Framework (six CJMM steps); PCAP Module 2 learning outcome 5 (clinical judgment model) · Final Exam Study Guide, Module 2 (leader vs. manager, leadership theories, prioritization, 5 rights, EAT)"},{"id":"M5-13","m":5,"lo":"5.5","t":"Countermeasures vs. solutions","cj":"Generate Solutions","d":3,"type":"mc","s":"After a look-alike/sound-alike error between hydroxyzine and hydralazine, which action is best described as a countermeasure rather than a simple solution?","r":"Countermeasures are proactive, system-level actions that address root causes and prevent recurrence; they are more robust than solutions that treat the symptom. Reminders and memos rely on vigilance, the weakest defense.","o":["Reminding the involved nurse to read labels carefully and complete a medication-safety module","Tall-man labels, separate bins, scan hard stops","Adding both drugs to a high-alert list posted in the medication room","Replacing the dispensed dose and monitoring the patient"],"a":[1],"w":["Relies on individual vigilance.","Correct — multiple system-level barriers.","A posted list relies on vigilance—a weak intervention.","Necessary immediate care, but it does not prevent recurrence."],"src":"Module 5 slides — Root Cause Analysis (common mistakes; “human error is rarely the root cause”), 5 Whys fall example, Fishbone categories, Countermeasures vs. Solutions · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"M7-04","m":7,"lo":"7.2","t":"Respondeat superior","cj":"Analyze Cues","d":1,"type":"mc","s":"A staff nurse employed by a hospital negligently administers a medication, injuring a patient. The patient sues both the nurse and the hospital. Under which doctrine can the hospital be held liable?","r":"Respondeat superior (“let the master answer”) is the basis of vicarious liability: an employer can be held responsible for employees’ negligent acts within the scope of employment. The nurse is never relieved of personal liability.","o":["Good Samaritan immunity","Comparative negligence","Res ipsa loquitur (“the thing speaks for itself”)","Respondeat superior (vicarious liability)"],"a":[3],"w":["Applies to emergency aid outside employment.","Apportions damages based on the plaintiff’s own fault.","Res ipsa addresses how negligence is proven.","Correct — employer liability for employees’ acts."],"src":"PNC Module 7 legal chapter — elements of negligence/malpractice, res ipsa loquitur, gross and criminal negligence, Good Samaritan immunity, vicarious liability (respondeat superior); Health Care Law Worksheet · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"G-04","m":2,"lo":"2.2","t":"Leadership style in an emergency","cj":"Take Action","d":1,"type":"mc","s":"A nurse manager must respond immediately to a rapidly deteriorating patient while coordinating a resuscitation. Which leadership approach is most appropriate in the moment?","r":"No style is “best” everywhere—match the style to the situation. Autocratic (directive) leadership is appropriate in emergencies because decisions must be fast and roles clear. Democratic leadership improves engagement when time allows; laissez-faire works only with highly experienced, self-directed teams under stable conditions. Team input returns in the debrief.","sg":"Final Study Guide & Practice — practice Q4","o":["Servant—focus first on what each team member needs","Democratic—quickly poll the experienced code team on next steps","Autocratic/directive—assign roles and give clear orders","Laissez-faire—let the experienced team self-organize"],"a":[2],"w":["Supporting staff matters, but the code needs direction now.","Consensus-building slows lifesaving decisions.","Correct — rapid, decisive direction fits an emergency.","Hands-off leadership causes role confusion during a code."],"src":"Final Study Guide & Practice — practice Q4 · PCAP Module 2 — Box 17.1 (transformational vs. transactional) and Management Styles table (autocratic, democratic, laissez-faire); Giddens Leadership concept (leadership styles) · Final Exam Study Guide, Module 2 (leader vs. manager, leadership theories, prioritization, 5 rights, EAT)"},{"id":"M4-05","m":4,"lo":"4.2","t":"Medicare parts","cj":"Analyze Cues","d":3,"type":"sata","s":"A 72-year-old with Original Medicare Parts A and B plus a Medigap policy is admitted for 4 days with pneumonia, then follows up with her PCP and fills a new inhaler prescription. Which statements about her coverage are accurate? Select all that apply.","r":"Part A covers inpatient hospital and skilled nursing facility care (not long-term custodial care). Part B covers physician and outpatient services. Medigap is private supplemental insurance that reduces A/B out-of-pocket costs but does not include prescription coverage; drugs require Part D.","o":["Part A covers long-term custodial nursing-home care if she later needs it","Part B covers the follow-up PCP visit, usually with 20% coinsurance after the Part B deductible","Medigap can help cover Part A and B deductibles and coinsurance","Part A covers the inpatient room, meals, nursing care, and inpatient labs, subject to a benefit-period deductible","Medigap will cover her new inhaler prescription"],"a":[1,2,3],"w":["Part A does not cover custodial long-term care.","Correct — Part B physician services.","Correct — the purpose of Medigap.","Correct — the Part A inpatient benefit.","Medigap does not cover prescriptions; Part D does."],"src":"Module 4 slides — Case Study 1: The Medicare Patient (Part A, Part B, Medigap) · Final Exam Study Guide, Module 4 (Medicare A–D, Medicaid, HMO/PPO/EPO, stewardship, value-based care)"},{"id":"M1-24","m":1,"lo":"1.1","t":"Cultural assessment — communication & space","cj":"Take Action","d":1,"type":"mc","s":"A nurse notices that a patient steps back and avoids eye contact each time the nurse stands close at the bedside to explain procedures. What is the most appropriate response?","r":"Personal space and eye contact vary across cultures (Giger–Haddad: space and communication). The nurse adapts behavior and asks the patient about their preferences rather than labeling or pathologizing the patient.","o":["Keep the usual distance but avoid eye contact, since that is likely the cultural norm","Give more space and ask about the patient’s preferences","Document that the patient is noncompliant with teaching and notify the provider of the behavior","Ask a family member to explain the procedures so the patient feels more comfortable"],"a":[1],"w":["Assumes a cultural norm instead of asking the patient.","Correct — adapts space and asks the patient.","Labels a cultural difference as noncompliance.","Avoids rather than assesses the patient’s preference and may compromise accurate teaching."],"src":"PCAP Module 1 Book Chapters — Cultural Competence chapter (Giger & Haddad’s six cultural phenomena; skilled interpreter mandatory); Module 1 Study Guide §I (cultural humility; professional interpreters over family) · Final Exam Study Guide, Module 1 (SDOH, equity, prevention, HBM, care coordination, emergency response)"},{"id":"N9-05","m":9,"lo":"9.3","t":"Quality improvement vs. research","cj":"Analyze Cues","d":3,"type":"mc","s":"A staff nurse wants to (1) test a new hourly rounding script on her unit for 4 weeks and track local fall rates, and later (2) randomize several hospitals to two rounding scripts to publish generalizable findings. What is the most accurate guidance?","r":"Quality improvement uses local data to test and refine a change (PDSA: Plan-Do-Study-Act) within a setting. Research is designed to produce generalizable knowledge and must follow institutional review (IRB) requirements. The course guide asks nurses to distinguish local QI from research and follow review requirements.","o":["Both projects are research and need full IRB approval before any change is made","Both projects are quality improvement and can begin without any review","Project 1 is QI using a PDSA cycle; Project 2 is research and requires institutional review","Project 1 is research because data are collected; Project 2 is QI because it compares units"],"a":[2],"w":["Local PDSA testing is QI, not research requiring IRB approval.","The multi-site randomized study is designed for generalizable knowledge—research.","Correct — local QI vs. generalizable research.","Collecting data does not make a project research; intent to generalize does."],"src":"PNC Modules 8–9 — Giddens Professional Identity concept (formation through experience, reflection, mentorship) · Final Exam Study Guide, Module 9 (licensure, BON/NPA, NCLEX/NLC, certification, ANA Code, Benner, lifelong learning)"},{"id":"M1-08","m":1,"lo":"1.3","t":"Care coordination models","cj":"Generate Solutions","d":2,"type":"mc","s":"A 71-year-old dual-eligible (Medicare and Medicaid) widower qualifies for nursing-home level of care after a stroke but strongly prefers to remain in his apartment. He needs medical follow-up, day services, transportation, and meals. Which care-coordination model best fits his situation?","r":"PACE is an integrated model for people 55 and older who qualify for nursing-home care but wish to live in the community. Under Medicare/Medicaid contracts, an interdisciplinary team integrates acute care, long-term care, and social services—exactly the combination this patient needs.","o":["Program of All-Inclusive Care for the Elderly (PACE)","A Medicare Advantage plan that includes a telephonic care-management benefit","A patient-centered medical home through his PCP, with referrals to community services as needed","Naylor’s Transitional Care Model with APRN home visits after his next hospital discharge"],"a":[0],"w":["Correct — integrates medical, social, and long-term services for nursing-home-eligible adults living at home.","An insurance product, not an integrated model that delivers day services, meals, and long-term care.","A PCMH coordinates primary care, but PACE specifically integrates long-term care, day services, and transportation for nursing-home–eligible adults.","TCM is time-limited post-discharge support, not ongoing long-term services."],"src":"Module 1 Study Guide §IV–V (discharge planning begins at admission; high-risk readmission indicators; care coordination); PCAP Module 1 — Giddens Care Coordination (Transitional Care Model, PCMH, PACE, ACOs) · Final Exam Study Guide, Module 1 (SDOH, equity, prevention, HBM, care coordination, emergency response)"},{"id":"M8-15","m":8,"lo":"8.5","t":"BCMA workarounds","cj":"Recognize Cues","d":3,"type":"mc","s":"Nurses on a unit routinely tape copies of patient wristband barcodes to the medication cart to save time because the scanners do not reach the rooms. What is the best analysis?","r":"BCMA only protects patients if the scan verifies the actual patient at the bedside. Workarounds create at-risk behavior driven by a latent condition (equipment that does not reach). Just Culture calls for coaching and fixing the system—wireless scanners—rather than discipline alone.","o":["A minor issue because nurses still check the MAR","Acceptable if each nurse states the patient’s name aloud before scanning the copy","An individual behavior problem best solved by discipline alone","A workaround that defeats patient verification; fix scanner reach and stop the practice"],"a":[3],"w":["Removes a key defense layer.","A verbal check does not restore the scan’s verification of the actual wristband.","Ignores the system driver of the workaround.","Correct — workaround plus latent cause."],"src":"PNC Modules 8–9 — Point-of-Care Technology, Wearables, Telehealth (synchronous vs. asynchronous), Consumer Health IT; Module 5 slides — Technology and Patient Safety · Final Exam Study Guide, Module 8 (HIT, AI applications, benefits/risks, ethical and legal concerns)"},{"id":"M7-12","m":7,"lo":"7.4","t":"Patient Self-Determination Act","cj":"Take Action","d":2,"type":"sata","s":"Under the Patient Self-Determination Act, which actions are required of a federally funded hospital at admission? Select all that apply.","r":"The PSDA requires federally funded facilities to give written notice of patients’ decision-making rights and advance-directive policies, to ask about and document existing directives, and to educate staff. Completing a directive is voluntary, and code status is a separate provider–patient decision—care cannot be conditioned on either.","o":["Provide written information about patients’ rights to make health care decisions and about advance directives","Encourage every patient to complete an advance directive before surgery","Ask whether the patient has an advance directive and note it in the medical record","Educate staff about advance directives","Obtain a code-status order on every patient at admission"],"a":[0,2,3],"w":["Correct — written notice of rights.","Facilities must inform and ask, but completing a directive is the patient’s choice.","Correct — inquire and document.","Correct — staff education.","Code status is a provider–patient decision; the PSDA requires notice, inquiry, and documentation."],"src":"PNC Module 7 — The Law and Patient Rights (informed consent, leaving AMA, physical restraints); Patient Self-Determination Act; Health Care Law Worksheet · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"M1-06","m":1,"lo":"1.2","t":"SDOH screening","cj":"Recognize Cues","d":2,"type":"sata","s":"A home health nurse visits a 67-year-old with heart failure who was readmitted twice in 60 days. Which findings represent social determinants of health that the nurse should address in the plan of care? Select all that apply.","r":"SDOH are the non-medical conditions in which people live—income, transportation, education, food security, and housing. Rationing medication because of cost and lacking transportation to the pharmacy are SDOH that become perceived barriers and drive readmission. Ejection fraction, edema, sodium level, and weight gain are clinical findings the nurse also addresses, but they are not social determinants.","o":["Serum sodium is 131 mEq/L on today’s labs","Ejection fraction is 30% on the last echocardiogram","The patient skips doses near the end of each month to make medications last until the next check","Bilateral 2+ pitting edema is present in the ankles","The patient reports a 3-lb weight gain since yesterday","The nearest pharmacy is 14 miles away, and the patient no longer drives"],"a":[2,5],"w":["A clinical laboratory finding, not a social determinant.","Clinical finding, not a social determinant.","Correct — income/cost barrier.","Clinical assessment finding.","A clinical sign of fluid retention, not a social determinant.","Correct — transportation and access barrier."],"src":"Module 1 Study Guide §II–III (equality vs. equity; disparities = the problem, equity = the goal; SDOH); PCAP Module 1 — Giddens Health Disparities concept (unavoidable/avoidable × acceptable/unacceptable) · Final Exam Study Guide, Module 1 (SDOH, equity, prevention, HBM, care coordination, emergency response)"},{"id":"M1-14","m":1,"lo":"1.5","t":"Population vs. individual focus","cj":"Prioritize Hypotheses","d":2,"type":"mc","s":"A public health nurse has one grant-funded position to reduce hypertension-related strokes in a county where 38% of adults have uncontrolled blood pressure. Which use of the position will most likely produce the greatest population health impact?","r":"Population health targets groups, prevention, access, and community partnerships. A county-wide screening and referral network reaches thousands and addresses access barriers; the other options help a few individuals or act only after stroke has occurred (tertiary).","o":["Build a coalition with barbershops, churches, and a mobile clinic for county-wide BP screening and follow-up","Provide one-on-one medication counseling to the 20 clinic patients with the highest readings","Run a weekly hypertension class at the county hospital for patients referred by cardiologists","Develop an inpatient education binder for patients admitted with stroke"],"a":[0],"w":["Correct — community-based, preventive, broad reach.","Valuable but reaches very few people.","Reaches only people already in specialty care; misses unscreened, access-limited residents.","Tertiary care for patients who already had a stroke."],"src":"Module 1 Study Guide §VII–VIII (population vs. individual focus; public health campaigns and indicators of success) · Final Exam Study Guide, Module 1 (SDOH, equity, prevention, HBM, care coordination, emergency response)"},{"id":"G-25","m":3,"lo":"3.6","t":"Direct political advocacy","cj":"Take Action","d":1,"type":"mc","s":"A senior nursing student asks how nurses can influence state policy on nurse-to-patient staffing. Which action represents the most direct political advocacy?","r":"Macro (legislative) advocacy acts on the policy process itself: testimony, contacting legislators, public comment, coalitions, professional organizations, and PACs. Micro (bedside) advocacy acts for one patient. Internal tools such as incident reports document problems inside the organization but do not change state law.","sg":"PCAP Study Guide — practice Q5","o":["File an incident report each time the unit is short-staffed","Testify at a state legislative hearing on a staffing bill","Raise staffing frustrations with coworkers during shift huddles","Volunteer to check blood pressures at a community health fair"],"a":[1],"w":["Incident reports are internal safety tools, not policy advocacy.","Correct — engages lawmakers directly while the bill is being decided.","Builds awareness on the unit but does not reach policymakers.","Community health promotion, not political advocacy."],"src":"PCAP Study Guide — practice Q5 · PCAP Module 3 — Grassroots Political Strategies (visit policymakers; join professional organizations; how to address legislators) · Final Exam Study Guide, Module 3 (health policy, micro vs. macro advocacy, evidence-informed recommendations)"},{"id":"M5-18","m":5,"lo":"5.7","t":"Medication safety","cj":"Take Action","d":2,"type":"sata","s":"A nurse is preparing medications for a patient who was transferred from the ICU. Which actions reduce the risk of the common medication errors listed in the course slides? Select all that apply.","r":"The course lists common medication errors: wrong patient, failure to account for history or allergies, expired medication, wrong form, and drug interactions. Two identifiers with scanning, allergy and MAR checks, and expiration/form checks prevent these. Unverified home medications should not be given unless pharmacy identifies them per policy, and crushing extended-release forms is a wrong-form error.","o":["Check the expiration date and the correct form (e.g., extended-release vs. immediate-release)","Check allergy history and the current MAR before administration","Give a home medication the patient brought in, after checking it against the MAR","Verify the patient with two identifiers and scan the wristband and medication","Crush extended-release tablets when the patient has trouble swallowing"],"a":[0,1,3],"w":["Correct — prevents expired or wrong-form errors.","Correct — prevents allergy and history errors.","Unverified home medications must not be given unless pharmacy identifies them per policy.","Correct — prevents wrong-patient errors.","Crushing extended-release forms can cause a dangerous rapid release (a wrong-form error)."],"src":"Module 5 slides — Most Common Medication Errors; Common Preventable In-Patient Safety Risks (HAIs, falls, failure to rescue); Patient Engagement; Comprehensive Guide to Healthcare Quality & Patient Safety · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"G-33","m":5,"lo":"5.2","t":"Latent vs. active failures","cj":"Analyze Cues","d":3,"type":"sata","s":"On a busy night shift, an RN bypasses BCMA because the scanner battery is dead and the spare charger is broken, and gives 10 units of regular insulin IV instead of the ordered 10 units of subcutaneous insulin glargine. Which are latent system factors in this event? Select all that apply.","r":"Latent conditions are hidden weaknesses in the system—equipment without backups, broken chargers, workload. Active failures are the unsafe acts of the person at the point of care (bypassing BCMA, wrong drug and route). In the Swiss cheese model, harm happened because latent and active holes lined up; fixes target the latent conditions so the next nurse is not set up to fail.","sg":"PCAP Study Guide — worksheet Activity B (1)","o":["High workload during a busy, short-staffed night shift","The scanner battery had no working backup","The RN bypassed BCMA scanning","The patient has type 2 diabetes","The RN gave the wrong insulin by the wrong route","The spare charger was broken and not replaced"],"a":[0,1,5],"w":["Correct — staffing and workload pressure.","Correct — equipment/maintenance weakness.","This is the active failure at the sharp end.","The patient’s diagnosis is not a system weakness.","Also an active failure—the unsafe act itself.","Correct — equipment failure that drove the workaround."],"src":"PCAP Study Guide — worksheet Activity B (1) · Module 5 slides — Systems Thinking and the Swiss Cheese Model (active vs. latent failures; wrong-site surgery example); Econ/Quality Worksheet §4 (KCl scenario) · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"M4-04","m":4,"lo":"4.1","t":"Cost-sharing terms","cj":"Analyze Cues","d":1,"type":"mc","s":"A PPO member has met his $1,500 deductible. His plan has 20% coinsurance. He receives an in-network outpatient procedure with an allowed amount of $3,000. What will he pay for this procedure?","r":"Once the deductible is met, coinsurance applies: 20% × $3,000 = $600, and the plan pays the remaining 80% ($2,400), until the out-of-pocket maximum is reached.","o":["$3,000","$1,500","$300","$600"],"a":[3],"w":["He has already met his deductible.","The deductible has already been satisfied.","Miscalculates the coinsurance.","Correct — 20% coinsurance of the allowed amount."],"src":"Module 4 Healthcare Economics slides — Health Insurance Plan Comparison table (HMO/PPO/EPO/POS), HDHP/HSA and catastrophic plans, Case Studies 3, 4 & 6; Comprehensive Guide to Healthcare Quality, Safety & Economics — Types of Plans · Final Exam Study Guide, Module 4 (Medicare A–D, Medicaid, HMO/PPO/EPO, stewardship, value-based care)"},{"id":"K-03","m":6,"lo":"6.6","t":"Assigning a float nurse","cj":"Prioritize Hypotheses","d":3,"type":"mc","s":"A night charge nurse on a 30-bed med-surg unit is assigning Priya, a labor-and-delivery RN floated for the shift who has not worked med-surg in 6 years. Two ED admissions are pending. Which patient group is most appropriate to assign to Priya?","r":"Floating nurses should receive patients whose care matches their competencies—stable, predictable patients similar to their usual population (post-op care is familiar to L&D nurses, for example after cesarean birth)—with a resource or buddy nurse. New admissions, complex devices, and unstable conditions require unit-specific competence.","o":["A patient with alcohol withdrawal on a CIWA protocol and two patients on continuous telemetry","The two pending ED admissions, because Priya’s L&D assessment skills are strong","Three stable postoperative patients (day 2 laparoscopic surgeries), with a buddy nurse identified for questions","A patient with a new tracheostomy, a patient on an insulin drip, and a post-op patient with a chest tube to suction"],"a":[2],"w":["Requires med-surg and telemetry competence.","Admissions require unit-specific assessment and workflow knowledge.","Correct — stable, familiar care with a resource nurse.","Requires specialized med-surg competencies."],"src":"PCAP Module 3 — Workforce Advocacy: Safe Staffing, Box 13.3 (questions before employment), Box 13.5 (questions before accepting an assignment), Floating and Mandatory Overtime; PNC Module 7 — Floating and Cross-Training (Winkelman; Francis); PCAP Module 3 — Workplace Safety (violence, fatigue) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"G-26","m":4,"lo":"4.2","t":"Medicare Part A","cj":"Analyze Cues","d":1,"type":"mc","s":"A 67-year-old retired teacher with limited income is hospitalized for a heart failure exacerbation and asks how the inpatient stay will be covered. Which response is accurate?","r":"Part A = inpatient hospital, skilled nursing facility, and hospice (with a benefit-period deductible). Part B = outpatient and provider services. Part D = outpatient prescriptions. Low-income Medicare beneficiaries may also qualify for Medicaid (“dual-eligible”), which helps with costs—but it does not replace Medicare.","sg":"PCAP Study Guide — practice Q6","o":["“Medicare Part A covers inpatient stays, though you may owe a deductible.”","“With a chronic illness, Medicaid replaces Medicare while you’re hospitalized.”","“Medicare Part B covers your inpatient room and nursing care.”","“Medicare Part D covers your inpatient medications and outpatient rehab.”"],"a":[0],"w":["Correct — Part A covers inpatient hospital, SNF, and hospice care.","Medicaid never replaces Medicare; low-income seniors may be dual-eligible.","Part B covers outpatient and provider services.","Part D covers outpatient prescriptions only."],"src":"PCAP Study Guide — practice Q6 · Module 4 slides — Medicare Parts A–D and Medigap, Medicaid/CHIP, ACA provisions, Case Studies 1, 2 & 5; Health Care Law Worksheet — EMTALA and ACA · Final Exam Study Guide, Module 4 (Medicare A–D, Medicaid, HMO/PPO/EPO, stewardship, value-based care)"},{"id":"N7-01","m":7,"lo":"7.7","t":"Fidelity","cj":"Analyze Cues","d":2,"type":"mc","s":"A nurse tells an anxious patient she will be present when the surgeon explains the biopsy results at 1400. At 1350 she is asked to help with a non-urgent supply count. She arranges coverage for the count and goes to the patient’s room. Which ethical principle is she most directly upholding?","r":"Fidelity is keeping promises and remaining faithful to commitments, which builds trust. Veracity is truth-telling; justice is fairness in distributing resources and treatment; beneficence is acting for the patient’s good (present here too, but the key action is keeping her promise).","o":["Justice","Veracity","Fidelity","Beneficence"],"a":[2],"w":["Concerns fair distribution of care and resources.","Truth-telling is not the central issue.","Correct — keeping a commitment to the patient.","Related, but the defining action is keeping her promise."],"src":"PNC Module 7 ethics chapter — Ethical Theory (utilitarianism, deontology), Ethical Principles (autonomy, beneficence/nonmaleficence, veracity), Box 9.3 Situation Assessment Procedure · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"Z9-03","m":9,"lo":"9.1","t":"ANA Code of Ethics in practice","cj":"Analyze Cues","d":3,"type":"cloze","s":"Case: A nurse reports a colleague’s impaired practice to protect patients. Another nurse declines a fourth consecutive 12-hour shift to protect her own health. A third joins an international coalition on climate-related health risks.","r":"The ANA Code of Ethics (2025, 10 provisions) is the profession’s non-negotiable ethical standard: compassion and dignity, primary commitment to patients, advocacy and protection from impaired practice, accountability, duties to self, ethical environments, advancing the profession, collaboration, social justice, and global and environmental health.","tpl":"Reporting impaired practice reflects the Code’s {0}. Declining the extra shift reflects {1}. The coalition work reflects {2}.","bl":[{"o":["advocacy for patient rights, health, and safety (Provision 3)","global and environmental health (Provision 10)","duties to self (Provision 5)","advancing the profession through research (Provision 7)"],"a":0,"w":"Provision 3 directs nurses to protect the rights, health, and safety of patients, including acting on impaired practice."},{"o":["Provision 3, trusting relationships","Provision 9, social justice","Provision 1, respect for dignity","Provision 5, duties to self"],"a":3,"w":"Provision 5 addresses the nurse’s moral duties to self, including safety and integrity."},{"o":["Provision 4, authority and accountability for practice","Provision 10, global nursing and environmental health","Provision 6, ethical work environment","Provision 8, collaborative relationships and networks"],"a":1,"w":"New in 2025, Provision 10 addresses global and environmental health."}],"src":"PNC Modules 8–9 — Giddens Professional Identity concept (four domains; integrity, courage, humility, advocacy exemplars) · Final Exam Study Guide, Module 9 (licensure, BON/NPA, NCLEX/NLC, certification, ANA Code, Benner, lifelong learning)"},{"id":"M1-10","m":1,"lo":"1.4","t":"Levels of prevention","cj":"Analyze Cues","d":1,"type":"mc","s":"A school nurse coordinates three activities: a hand-hygiene campaign before flu season, annual vision screening for second graders, and an individualized asthma action plan for a student who was hospitalized last month. Which option correctly classifies these activities, in order?","r":"Primary = prevent before disease occurs (hand hygiene). Secondary = screen and detect early (vision screening). Tertiary = treat or manage established disease to reduce complications (asthma action plan after hospitalization).","o":["Primary, tertiary, secondary","Secondary, primary, tertiary","Tertiary, secondary, primary","Primary, secondary, tertiary"],"a":[3],"w":["Vision screening is early detection (secondary).","Hand hygiene prevents disease—it is primary, not secondary.","Reverses the classification.","Correct — Prevent, Screen, Treat."],"src":"Module 1 Study Guide §VI (Primary = Prevent, Secondary = Screen, Tertiary = Treat) and §X (Health Belief Model constructs; SDOH → perceived barriers) · Final Exam Study Guide, Module 1 (SDOH, equity, prevention, HBM, care coordination, emergency response)"},{"id":"M3-15","m":3,"lo":"3.5","t":"Branches of government","cj":"Analyze Cues","d":3,"type":"mc","s":"After a state passes a law allowing APRNs full practice authority, the Board of Nursing publishes proposed rules on documentation requirements and opens a 30-day public comment period. Which statement is accurate?","r":"Legislatures enact statutes; executive-branch agencies, including licensing boards, implement statutes by promulgating regulations, which—once adopted—carry the force of law. Agencies must consider and respond to public comments, which is a key point for nurse advocacy.","o":["The state’s judicial branch must approve the proposed rules before the comment period opens","Once adopted, the Board’s rules carry the force of law and implement the statute","Rules published for comment cannot be changed in response to comments","The Board is acting as the legislative branch by creating a new statute"],"a":[1],"w":["Courts
