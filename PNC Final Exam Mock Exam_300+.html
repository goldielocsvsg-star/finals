e of respect; leaders model the behavior they expect and address disrespect promptly. One-time reminders, moving staff who report, public correction, and suppressing concerns all worsen incivility.","o":["Hold one unit meeting reminding staff to “be nice to each other”","Implement and consistently enforce a zero-tolerance policy for bullying and incivility","Model respectful communication and address disrespect promptly when observed","Limit staff meetings to operational updates so discussions stay positive","Let senior nurses correct new staff informally in front of peers","Move staff who report concerns to other units to reduce conflict"],"a":[1,2],"w":["A one-time reminder without training or accountability does not change culture.","Correct — employer responsibility.","Correct — leader modeling and prompt response.","Suppressing concerns drives incivility underground.","Public correction is a form of incivility.","Punishes reporters and erodes trust."],"src":"PCAP Module 2 — Addressing and Preventing Bullying and Incivility (individual steps; employer responsibilities) · Final Exam Study Guide, Module 2 (leader vs. manager, leadership theories, prioritization, 5 rights, EAT)"},{"id":"M8-07","m":8,"lo":"8.2","t":"Clinical decision support & alert fatigue","cj":"Prioritize Hypotheses","d":3,"type":"mc","s":"An audit shows nurses override 94% of sepsis alerts on a unit, and two true sepsis cases were missed last month. Nurses say most alerts fire for post-operative patients with expected tachycardia. What is the best interpretation and response?","r":"Alert fatigue and clinician burnout are expected outcomes of poorly designed CDS. The remedy is better-specified alerts developed with nurses at the table, not blame or more noise. CDS supports but never replaces clinical judgment.","o":["Alert fatigue from a poorly specified rule; refine alert criteria with nurses and informatics","Require a second nurse to co-sign every alert override","Add more alerts so true cases are not missed","Turn off the sepsis alert for post-operative patients"],"a":[0],"w":["Correct — a system design problem fixed collaboratively.","Adds burden without fixing the poorly specified rule.","More alerts worsen fatigue.","Removes protection for a high-risk group; refine criteria instead."],"src":"PNC Modules 8–9 — Information Technology in the Clinical Setting: Clinical Decision Support (alert fatigue), CPOE, EHR data management · Final Exam Study Guide, Module 8 (HIT, AI applications, benefits/risks, ethical and legal concerns)"},{"id":"G-49","m":7,"lo":"7.5","t":"HIPAA in public spaces","cj":"Take Action","d":1,"type":"mc","s":"In a crowded hospital elevator, two nurses discuss a patient’s new cancer diagnosis without using the patient’s name. What should a third nurse do?","r":"HIPAA allows PHI to be shared only on a need-to-know basis for treatment, payment, or operations. Public spaces (elevators, cafeterias, hallways) are never appropriate, even without a name—context can identify a patient. Address it respectfully in the moment and follow organizational policy if it continues.","o":["Report both nurses to the Board of Nursing","Nothing, because no name was used","Wait and bring it up at the next staff meeting as a general reminder","Quietly remind them not to discuss patients in public"],"a":[3],"w":["Premature; address it directly and follow policy.","Details such as room or diagnosis can still identify a patient.","Delays the correction while the disclosure continues.","Correct — protects privacy in the moment."],"src":"PNC Module 7 — HIPAA and social media, EMTALA, ADA, CLAS language-access standards; Health Care Law Worksheet and Answer Sheet · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"K-11","m":7,"lo":"7.4","t":"Police request for blood draw","cj":"Take Action","d":3,"type":"mc","s":"At 0130, police bring an alert, oriented 34-year-old with a scalp laceration to the ED after a single-car crash. He is not under arrest, has not consented to a blood draw, and the officer has no warrant. Hospital policy requires consent, a warrant, or arrest for forensic blood draws. The officer insists the nurse draw blood for an alcohol level now. What should the nurse do?","r":"Drawing blood without consent or legal authority could constitute battery, and releasing a clinical sample violates privacy protections. The textbook vignette describes a nurse who respectfully refused such a request. The nurse follows policy, remains calm and respectful, and escalates to leadership and risk management.","o":["Draw the blood if the officer signs a hospital release form","Respectfully decline without consent or legal authority, and escalate per policy","Give the officer a tube from the clinical blood sample already drawn for the trauma panel, so no new stick is needed","Draw the blood because police authority overrides hospital policy"],"a":[1],"w":["A release form is not consent or legal authority.","Correct — protects patient rights and follows policy with escalation.","Releasing a clinical sample without authority violates privacy law.","Police requests do not override consent and policy."],"src":"PNC Module 7 — Professional/Legal Issue vignette (police request for a blood sample without consent); The Law and Patient Rights · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"K-13","m":8,"lo":"8.5","t":"Downtime medication safety","cj":"Take Action","d":3,"type":"mc","s":"At 0700, a hospital’s EHR, barcode medication administration, and CPOE go offline after a suspected cyberattack; restoration may take 12–36 hours. Scheduled 0900 medications are due, and the unit has the last printed downtime MAR from 0600. What is the safest approach to medication administration?","r":"When BCMA is unavailable, a key defense layer is lost, so the nurse adds manual redundancy: verified paper records, two identifiers, label checks, and independent double-checks for high-alert drugs. Holding all medications risks harm, and memory or patient recall is unreliable.","o":["Hold all medications until the system is restored","Ask each patient which medications they usually receive in the morning and give those after checking the wristband","Use the downtime MAR, verify against paper orders and labels with two identifiers, and double-check high-alert drugs","Give medications from memory of yesterday’s orders"],"a":[2],"w":["Omitting essential medications causes harm.","Patient recall cannot verify current orders.","Correct — manual verification replaces the missing technology layer.","Memory is unreliable, and orders may have changed."],"src":"PNC Modules 8–9 — Point-of-Care Technology, Wearables, Telehealth (synchronous vs. asynchronous), Consumer Health IT; Module 5 slides — Technology and Patient Safety · Final Exam Study Guide, Module 8 (HIT, AI applications, benefits/risks, ethical and legal concerns)"},{"id":"M6-23","m":6,"lo":"6.2","t":"Verbal orders","cj":"Take Action","d":1,"type":"mc","s":"A provider gives a verbal order for a new medication during a non-emergent bedside discussion. Which response best reflects safe practice?","r":"Verbal orders should be limited to urgent situations. When they are taken, the nurse writes them down and reads them back for confirmation. In non-emergent situations, CPOE entry by the prescriber reduces transcription errors.","o":["Wait for the order to appear in the EHR without confirming it, since the provider stated it verbally","Write the order on the whiteboard and have the provider sign it later","Accept the order and enter it later from memory","Ask the provider to enter the order in CPOE, since it is not urgent"],"a":[3],"w":["Leaves the order unresolved without communication.","Unapproved transcription; error-prone.","Memory-based transcription is error-prone.","Correct — CPOE preference with read-back."],"src":"Module 6 slides — SBAR, Call-Out, Check-Back, Teach-Back, Handoff; Boot Camp §11 (read-back for critical messages) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"N9-03","m":9,"lo":"9.2","t":"Board of Nursing authority","cj":"Take Action","d":2,"type":"mc","s":"A family files a complaint alleging that an RN repeatedly charted medications she never gave. The hospital terminated the RN, and the family asks who can take action against her license. Which entity has that authority?","r":"Each state Board of Nursing protects the public by enforcing the state Nurse Practice Act—issuing licenses, investigating complaints, and disciplining unsafe practitioners. The ANA Code guides ethical conduct but is not law; NCSBN develops the NCLEX; The Joint Commission accredits organizations, not individual nurses.","o":["The state Board of Nursing, which enforces the Nurse Practice Act","The NCSBN, which develops and administers the NCLEX-RN","The Joint Commission, through its accreditation survey of the hospital","The American Nurses Association, through enforcement of its Code of Ethics"],"a":[0],"w":["Correct — the BON licenses and disciplines nurses.","NCSBN develops the exam; licensure and discipline are state functions.","TJC accredits organizations, not individual licenses.","The Code is the ethical standard but carries no licensing authority."],"src":"PNC Modules 8–9 — Giddens Professional Identity concept; PNC Module 7 — Sources of Law and State Nurse Practice Act; Georgia Rule 410-12 · Final Exam Study Guide, Module 9 (licensure, BON/NPA, NCLEX/NLC, certification, ANA Code, Benner, lifelong learning)"},{"id":"M7-13","m":7,"lo":"7.4","t":"Advance directives & DPOA","cj":"Prioritize Hypotheses","d":3,"type":"mc","s":"A patient with advanced dementia, who is now decisionally incapacitated, has a durable power of attorney for health care naming her niece. Her two sons, who arrive from out of state, demand full aggressive treatment, while the niece reports the patient told her she would never want a feeding tube. Whose decision should guide care?","r":"A durable power of attorney for health care designates a proxy to make decisions when the patient is decisionally incapacitated. The agent’s authority supersedes default family hierarchy, and the agent applies substituted judgment based on the patient’s known wishes. Ethics consultation can help resolve conflict but does not replace the agent.","o":["The niece, as the named agent applying the patient’s known wishes","The sons and niece together, by majority agreement","The sons, because adult children rank above a niece in the default surrogate hierarchy","The ethics committee must decide before any treatment"],"a":[0],"w":["Correct — the named agent applies the patient’s wishes.","The legally named agent decides; family consensus is not required.","Default kinship does not override a legally named agent.","An ethics committee can support, not override, the agent’s authority."],"src":"PNC Module 7 — The Law and Patient Rights (informed consent, leaving AMA, physical restraints); Patient Self-Determination Act; Health Care Law Worksheet · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"M4-07","m":4,"lo":"4.2","t":"EMTALA & the uninsured","cj":"Take Action","d":3,"type":"mc","s":"An uninsured 55-year-old arrives at the ED with chest pain. The registration clerk asks the triage nurse whether they should first collect a deposit or send him to the county hospital 10 miles away. What is the correct response?","r":"EMTALA requires hospitals with EDs to provide a medical screening exam and stabilizing treatment for emergency conditions regardless of ability to pay. Inquiring about payment cannot delay screening. Transfer for financial reasons before stabilization is “patient dumping.”","o":["Transfer him to the county hospital, which is designated to serve uninsured patients and has a cardiac unit","Provide a screening exam and stabilizing treatment regardless of ability to pay","Triage him, then transfer him to the county hospital once his pain is relieved","Begin screening, but have registration verify insurance before ordering a cardiac catheterization"],"a":[1],"w":["Transferring an unstable patient for financial reasons is dumping.","Correct — screen and stabilize first; address finances afterward.","Pain relief is not stabilization; transfer for financial reasons violates EMTALA.","Stabilizing treatment cannot be conditioned on coverage verification."],"src":"Module 4 slides — Medicare Parts A–D and Medigap, Medicaid/CHIP, ACA provisions, Case Studies 1, 2 & 5; Health Care Law Worksheet — EMTALA and ACA · Final Exam Study Guide, Module 4 (Medicare A–D, Medicaid, HMO/PPO/EPO, stewardship, value-based care)"},{"id":"M7-06","m":7,"lo":"7.2","t":"Good Samaritan law","cj":"Analyze Cues","d":2,"type":"mc","s":"An off-duty nurse stops at a highway crash and provides CPR and bleeding control until EMS arrives. She does not accept any payment. The victim later sues, alleging improper care. Which statement best describes her legal protection?","r":"Good Samaritan laws may limit liability for care rendered in good faith outside the employment setting, without compensation, provided the care is not grossly negligent and is within the nurse’s training. Laws vary by state, and some states have duty-to-rescue statutes.","o":["She is protected regardless of how she performed, because she was a volunteer","She is protected only if she works for the receiving hospital","She is protected only if her state has a duty-to-rescue law requiring her to stop","Good Samaritan laws generally protect good-faith care within her training, absent gross negligence"],"a":[3],"w":["Gross negligence is not protected.","Protection does not depend on employment.","Protection does not depend on a duty-to-rescue statute.","Correct — good faith, no compensation, not grossly negligent."],"src":"PNC Module 7 legal chapter — elements of negligence/malpractice, res ipsa loquitur, gross and criminal negligence, Good Samaritan immunity, vicarious liability (respondeat superior); Health Care Law Worksheet · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"M4-01","m":4,"lo":"4.1","t":"HMO gatekeeper & referrals","cj":"Recognize Cues","d":2,"type":"mc","s":"A patient with an HMO tells the clinic nurse she made her own appointment with an in-network dermatologist for a changing mole because “it’s faster than seeing my PCP.” What is the nurse’s best response?","r":"HMOs use the PCP as a gatekeeper; specialist visits generally require a referral even in network. Without one, the patient may be responsible for the entire bill. The nurse balances access to timely evaluation with plan rules by coordinating a prompt referral.","o":["“Since the dermatologist is in network, the visit will be covered.”","“Go ahead—if it’s urgent, the HMO will treat it as an emergency and cover it.”","“Your HMO likely requires a PCP referral; let’s contact your PCP today so the visit is covered.”","“HMOs cover specialists only in emergencies, so you’ll pay out of pocket.”"],"a":[2],"w":["Being in network is not enough; a referral is still required.","A changing mole is not an emergency; HMOs require a PCP referral for specialist care.","Correct — explains the gatekeeper rule and coordinates timely care.","Specialist care is covered with a referral, not only in emergencies."],"src":"Module 4 Healthcare Economics slides — Health Insurance Plan Comparison table (HMO/PPO/EPO/POS), HDHP/HSA and catastrophic plans, Case Studies 3, 4 & 6; Comprehensive Guide to Healthcare Quality, Safety & Economics — Types of Plans · Final Exam Study Guide, Module 4 (Medicare A–D, Medicaid, HMO/PPO/EPO, stewardship, value-based care)"},{"id":"M2-01","m":2,"lo":"2.1","t":"Leadership vs. management","cj":"Analyze Cues","d":1,"type":"mc","s":"A staff nurse with no supervisory title notices that her colleagues regularly seek her advice on wound care. When she proposes a new pressure-injury prevention bundle, most of the unit adopts it within a month. Which concept best explains her influence?","r":"Leadership is influence toward a shared goal and does not require a title. Her expertise (expert power) and relationships give her informal leadership. Formal authority and legitimate power come from position; management is coordination of resources.","o":["Legitimate power derived from her position on the organizational chart","Management of time, people, and supplies","Formal authority granted through her job description","Informal leadership based on expert power and peer credibility"],"a":[3],"w":["Legitimate power is position-based.","She is influencing practice, not coordinating resources.","She has no formal authority.","Correct — informal leadership through expertise."],"src":"PCAP Module 2 — Nursing Leadership and Management: Leadership vs. Management; Power and Authority; Formal and Informal Leadership · Final Exam Study Guide, Module 2 (leader vs. manager, leadership theories, prioritization, 5 rights, EAT)"},{"id":"M7-16","m":7,"lo":"7.5","t":"HIPAA & social media","cj":"Recognize Cues","d":3,"type":"sata","s":"Which social media posts by nurses represent potential HIPAA or professional-conduct violations? Select all that apply.","r":"Posting images of patients, even “unidentifiable” body parts, is expressly forbidden. Identifiable details (role, location, event) can identify a patient even without a name, and private groups are not secure. A visible census board can expose PHI. General, non-identifying reflections and approved messages are acceptable.","o":["A video of coworkers dancing in the break room with a patient census board visible in the background","A post saying, “Rough night in the ED—so grateful for my team,” with no patient details","A photo of a patient’s unusual tattoo with the face cropped out, captioned “Guess what we saw tonight!”","A private-group message describing a “famous local coach admitted to our ICU after a crash”","Sharing a hospital-approved public health message about flu shots"],"a":[0,2,3],"w":["Violation — PHI is visible in the background.","Acceptable — no patient information.","Violation — body-part images can identify patients and are forbidden.","Violation — indirect identifiers, even in a private group.","Acceptable — approved public health content."],"src":"PNC Module 7 — HIPAA and social media, EMTALA, ADA, CLAS language-access standards; Health Care Law Worksheet and Answer Sheet · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"Z4-02","m":4,"lo":"4.1","t":"HMO, PPO, and EPO","cj":"Analyze Cues","d":2,"type":"cloze","s":"Case: Three coworkers compare plans. Ana wants the lowest premium and doesn’t mind seeing her PCP for referrals. Ben wants to see an out-of-network specialist he has used for years. Cara wants no referrals but is fine staying in network.","r":"HMO: PCP gatekeeper, referrals, no out-of-network coverage except emergencies, lowest premiums. PPO: no PCP or referrals, in- and out-of-network coverage, higher premiums. EPO: no referrals, strictly in-network except emergencies. Always verify specific plan rules.","tpl":"Ana fits best with a(n) {0}, Ben with a(n) {1}, and Cara with a(n) {2}.","bl":[{"o":["PPO","EPO","catastrophic plan","HMO"],"a":3,"w":"HMOs require a PCP and referrals and generally have the lowest premiums."},{"o":["EPO","HMO","PPO","Medicaid"],"a":2,"w":"PPOs cover out-of-network care at higher cost, with higher premiums."},{"o":["PPO","EPO","HMO","POS"],"a":1,"w":"EPOs need no referrals but cover in-network care only (except emergencies)."}],"src":"Module 4 Healthcare Economics slides — Health Insurance Plan Comparison table (HMO/PPO/EPO/POS), HDHP/HSA and catastrophic plans, Case Studies 3, 4 & 6; Comprehensive Guide to Healthcare Quality, Safety & Economics — Types of Plans · Final Exam Study Guide, Module 4 (Medicare A–D, Medicaid, HMO/PPO/EPO, stewardship, value-based care)"},{"id":"N3-01","m":3,"lo":"3.7","t":"Micro vs. macro advocacy","cj":"Analyze Cues","d":2,"type":"mc","s":"A nurse notices that several uninsured patients on her unit are discharged without access to prescribed inhalers. Which action represents macro-level (systems/legislative) advocacy rather than micro-level (bedside) advocacy?","r":"Micro (bedside) advocacy acts for an individual patient—securing resources, clarifying plans, or escalating a concern. Macro (systems/legislative) advocacy changes policy for populations—joining professional organizations, coalitions, testimony, and contacting legislators.","o":["Joining a nurses association coalition backing a prescription-assistance bill","Calling the case manager to obtain a free inhaler for today’s discharge","Asking the provider to switch a patient to a lower-cost generic inhaler","Teaching a patient how to use a pharmacy discount card"],"a":[0],"w":["Correct — collective, legislative action that affects many patients.","Valuable bedside advocacy for one patient.","Individual-level advocacy for one patient.","Individual-level education."],"src":"PCAP Module 3 — Health Policy and Politics; Grassroots Political Strategies · Final Exam Study Guide, Module 3 (health policy, micro vs. macro advocacy, evidence-informed recommendations)"},{"id":"M7-23","m":7,"lo":"7.7","t":"Ethical principles","cj":"Prioritize Hypotheses","d":3,"type":"mc","s":"A family asks the nurse not to tell their mother that her biopsy shows metastatic cancer because “it will destroy her.” The patient is competent and repeatedly asks the nurse what the biopsy showed. Which principle is primarily at stake?","r":"Veracity—truth-telling—is central to trust. The text notes that the duty to tell the truth has taken precedence over the fear of harm from disclosure; truth often reduces anxiety and supports decision-making. Autonomy is also at stake, because a competent patient has the right to information. The nurse collaborates with the provider on compassionate disclosure.","o":["Nonmaleficence only","Justice","Veracity","Fidelity to the family"],"a":[2],"w":["Nonmaleficence is relevant, but withholding the truth undermines trust and autonomy.","Justice concerns fair distribution of resources.","Correct — truth-telling to a competent patient who is asking.","The primary duty is to the patient, not the family."],"src":"PNC Module 7 ethics chapter — Ethical Theory (utilitarianism, deontology), Ethical Principles (autonomy, beneficence/nonmaleficence, veracity), Box 9.3 Situation Assessment Procedure · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"M5-21","m":5,"lo":"5.7","t":"Surgical safety","cj":"Take Action","d":3,"type":"mc","s":"During the time-out before a left knee arthroscopy, the circulating nurse notices that the consent form says “right knee” and the site mark is on the left. The surgeon says, “The consent is a typo; let’s start.” What should the nurse do?","r":"The Universal Protocol requires all discrepancies to be resolved before incision. Any team member can stop the line. The nurse cannot alter a consent form, and documenting after the fact does not prevent wrong-site surgery.","o":["Document the discrepancy after the case is completed","Stop the procedure and resolve the consent and site discrepancy before incision","Proceed with the left knee, since the mark and surgeon agree, and correct the consent afterward","Correct the consent form to read “left knee,” initial the change, and have the surgeon co-sign it"],"a":[1],"w":["Too late to prevent harm.","Correct — stop the line until verified.","All discrepancies must be resolved before incision.","The nurse cannot alter the consent document."],"src":"Module 5 slides — Most Common Medication Errors; Common Preventable In-Patient Safety Risks (HAIs, falls, failure to rescue); Patient Engagement; Comprehensive Guide to Healthcare Quality & Patient Safety · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"M6-04","m":6,"lo":"6.2","t":"Closed-loop communication","cj":"Recognize Cues","d":2,"type":"sata","s":"During a cardiac arrest, which exchanges are examples of closed-loop check-back communication? Select all that apply.","r":"Check-back is a closed loop: the sender states the message, the receiver repeats it, and the sender verifies it. A call-out informs the whole team at once; an undirected request (“someone…”) lacks a named receiver; teach-back confirms patient or family understanding; and an unacknowledged message is an open loop.","o":["Physician: “Someone get the defibrillator.”","Pharmacist: “Calcium chloride 1 gram is ready.” No one responds.","Recorder: “Amiodarone 300 mg given at 0412?” Nurse: “Yes, 300 mg at 0412.”","Nurse to the whole room: “Pulse check—no pulse!”","Nurse to family after the code: “Can you tell me in your own words what the doctor explained?”","Physician: “Give 1 mg epinephrine IV push.” Nurse: “1 mg epinephrine IV push.” Physician: “Correct.”"],"a":[2,5],"w":["Not directed to a named person and not confirmed.","An open loop—no acknowledgment.","Correct — the recorder’s message is repeated and confirmed.","A call-out, not a check-back.","Teach-back, used with patients and families.","Correct — send, repeat, verify."],"src":"Module 6 slides — SBAR, Call-Out, Check-Back, Teach-Back, Handoff; Boot Camp §11 (read-back for critical messages) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"M7-17","m":7,"lo":"7.5","t":"EMTALA","cj":"Recognize Cues","d":3,"type":"sata","s":"Which actions would violate EMTALA? Select all that apply.","r":"EMTALA (the antidumping law) requires a medical screening exam for anyone who requests care, stabilization of emergency conditions, and transfer only when appropriate. Financial transfers, payment-related delays, and discharging unstable patients violate it. Transfer of a stabilized patient for higher-level care with acceptance is appropriate.","o":["Discharging a patient with an unstable, untreated emergency condition","Providing a medical screening exam to a patient who walks into an urgent care clinic on the hospital campus","Delaying a medical screening exam until insurance information is verified","Transferring a stabilized patient to a burn center for specialized care with the receiving facility’s acceptance","Transferring an actively laboring woman to another hospital solely because she is uninsured"],"a":[0,2,4],"w":["Violation — failure to stabilize.","Appropriate — the obligation can extend to on-campus settings.","Violation — screening cannot be delayed for payment.","Appropriate transfer.","Violation — patient dumping."],"src":"PNC Module 7 — HIPAA and social media, EMTALA, ADA, CLAS language-access standards; Health Care Law Worksheet and Answer Sheet · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"M3-09","m":3,"lo":"3.3","t":"Whistle-blowing","cj":"Take Action","d":3,"type":"sata","s":"A nurse has evidence that her home health agency routinely bills Medicare for visits that never occurred. Internal reports to her manager have been ignored. Which actions align with ANA guidance on whistle-blowing? Select all that apply.","r":"The ANA advises collecting objective documentation, seeking counsel, reporting in writing to a state or national regulator, and staying calm. Private accreditors such as TJC do not confer whistle-blower protection, and public posting or confrontation is not protected and may breach confidentiality.","o":["Confront the agency owner publicly at a staff meeting with the evidence","Keep objective, dated documentation of the evidence and all related interactions","Report only to The Joint Commission, which provides whistle-blower protection","Report the concern in writing to the appropriate state or federal regulatory agency","Post the evidence on social media to pressure the agency publicly","Consult the state nurses association or an attorney before taking action"],"a":[1,3,5],"w":["Public confrontation is not protected and can escalate retaliation.","Correct — objective documentation.","Private accreditors do not confer protection.","Correct — protection comes from reporting to a regulator.","Not protected and may breach privacy laws.","Correct — seek counsel first."],"src":"PCAP Module 3 — Whistle-Blower Protection (“Things to Know About Whistle-Blowing”); Magnet Recognition Program; Shared Governance (Box 13.7); Conflict Resolution · Final Exam Study Guide, Module 3 (health policy, micro vs. macro advocacy, evidence-informed recommendations)"},{"id":"M8-12","m":8,"lo":"8.3","t":"Interoperability & HIE","cj":"Generate Solutions","d":2,"type":"mc","s":"An unconscious patient arrives at an ED in a neighboring county. Which technology would most quickly give the team access to his allergies, medications, and recent imaging from his home health system?","r":"HIEs allow secure sharing of health information across organizations with interoperable EHRs, supporting continuity, safety, and reduced duplicate testing—especially when patients cannot provide their history.","o":["The patient portal, which can be opened on his phone","A fax request to his PCP’s office","A health information exchange connecting interoperable EHRs","The hospital’s own EHR search of prior encounters"],"a":[2],"w":["He is unconscious and cannot access it.","Slow and dependent on office hours.","Correct — cross-organization data exchange.","He has never been seen here; external records require an HIE."],"src":"PNC Modules 8–9 — EHRs: “Meaningful Use” and Promoting Interoperability (Stages 1–3); 21st Century Cures Act and information blocking; HIE · Final Exam Study Guide, Module 8 (HIT, AI applications, benefits/risks, ethical and legal concerns)"},{"id":"G-06","m":4,"lo":"4.2","t":"Medicare Part B","cj":"Analyze Cues","d":1,"type":"mc","s":"A nurse is caring for a patient who has Medicare Part B. Which service is most closely associated with Part B?","r":"Memory aid: A = Admitted (inpatient, SNF, hospice); B = Bodies in the office (outpatient, provider visits, preventive care); C = Choice (Medicare Advantage private plans that combine A and B, often D); D = Drugs. Long-term custodial care is generally not a Medicare benefit—Medicaid may cover it for those who qualify.","sg":"Final Study Guide & Practice — practice Q6","o":["Long-term custodial care in a nursing home","Outpatient prescription drugs filled at a retail pharmacy","Skilled nursing facility care after a qualifying hospital stay","Outpatient provider visits and many preventive services"],"a":[3],"w":["Medicare does not cover long-term custodial care.","Part D covers outpatient prescriptions.","Part A covers SNF care, inpatient stays, and hospice.","Correct — Part B is outpatient/medical coverage."],"src":"Final Study Guide & Practice — practice Q6 · Module 4 slides — Medicare Parts A–D and Medigap, Medicaid/CHIP, ACA provisions, Case Studies 1, 2 & 5; Health Care Law Worksheet — EMTALA and ACA · Final Exam Study Guide, Module 4 (Medicare A–D, Medicaid, HMO/PPO/EPO, stewardship, value-based care)"},{"id":"M8-22","m":8,"lo":"8.4","t":"EHR audit trails","cj":"Analyze Cues","d":2,"type":"sata","s":"A hospital privacy officer is investigating suspected unauthorized access to a celebrity patient’s record. Which statements about EHR audit trails are accurate? Select all that apply.","r":"Audit trails record every user’s access—who opened which record and when—so organizations can detect and act on inappropriate access, even by staff with valid credentials. They are a core HIPAA technical safeguard alongside access control and encryption.","o":["Audit trails cannot detect access by staff with valid credentials","Audit trails record who accessed a patient’s record and when","Audit trails record only access by staff from other departments","Audit trails support accountability for inappropriate access","Audit trails are part of HIPAA technical safeguards"],"a":[1,3,4],"w":["Incorrect — valid credentials are logged by user.","Correct — logs access.","They log every user’s access.","Correct — supports accountability.","Correct — a HIPAA safeguard."],"src":"PNC Modules 8–9 — EHR Security (access control, encryption, audit trails, breach notification >500); EHRs and HIPAA · Final Exam Study Guide, Module 8 (HIT, AI applications, benefits/risks, ethical and legal concerns)"},{"id":"Z6-02","m":6,"lo":"6.7","t":"Conflict resolution modes","cj":"Analyze Cues","d":2,"type":"cloze","s":"Case: Two nurses disagree. In the first situation, a patient is coding and one nurse insists on starting compressions immediately. In the second, the nurses argue loudly at the station and both are too upset to talk productively. In the third, they each give up part of their preferred break schedule as a temporary fix during a busy week.","r":"Conflict modes: collaborating (win–win, complex long-term issues), compromising (partial win, temporary fixes), accommodating (lose–win, preserves harmony), competing (win–lose, emergencies), avoiding (withdrawal, useful for cooling down).","tpl":"The first situation calls for {0}, the second for {1}, and the third reflects {2}.","bl":[{"o":["avoiding","collaborating","accommodating","competing"],"a":3,"w":"Competing (win–lose) is appropriate in emergencies."},{"o":["competing (insist on one solution)","compromising (split the difference)","collaborating (joint problem-solving)","avoiding (a temporary cool-down)"],"a":3,"w":"Avoiding is appropriate when emotions are too high and a cool-down is needed."},{"o":["competing","collaborating","accommodating","compromising"],"a":3,"w":"Compromising is a partial win for temporary fixes under time pressure."}],"src":"Module 6 Communication & Collaboration slides — conflict and mutual support · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"G-31","m":6,"lo":"6.6","t":"Charge-nurse assignment matrix","cj":"Generate Solutions","d":3,"type":"cloze","s":"Case: A charge nurse on a 24-bed med-surg/telemetry unit has an experienced RN (6 years), a new graduate RN (3 weeks off orientation), a float RN from Mother-Baby, and an experienced LPN. Patient A was admitted 1 hour ago with acute decompensated heart failure on IV furosemide and titratable nitroglycerin drips. Patient B is post-op day 2 after laparoscopic cholecystectomy, stable, and needs discharge teaching this afternoon. Patient C has chronic COPD and a stage 2 sacral pressure injury needing a daily dressing change and oral medications, stable for 48 hours. Patient D has cellulitis, stable, ambulating, with IV antibiotics every 8 hours.","r":"Match competence to acuity. Experienced RN: unstable, new, complex, titrating drips. New graduate RN: stable patients with standard care (and RN-only tasks such as discharge teaching). Float RN: general skills similar to the home unit—avoid unfamiliar specialty equipment. LPN: stable, predictable patients; oral/IM/subcut meds, sterile dressings, catheters, reinforcing teaching; generally no IV push or blood. The RN keeps assessment, care planning, and evaluation.","sg":"PCAP Study Guide — worksheet Activity A (1–4)","tpl":"Patient A goes to the {0}; Patient B to the {1}; Patient C to the {2}; and Patient D to the {3}.","bl":[{"o":["experienced RN","new graduate RN","LPN","float RN"],"a":0,"w":"A new, unstable admission on titratable infusions needs the most experienced RN’s judgment."},{"o":["LPN","float RN","experienced RN","new graduate RN"],"a":3,"w":"A stable, predictable patient whose discharge teaching must be done by an RN fits the new graduate."},{"o":["float RN","experienced RN","LPN","new graduate RN"],"a":2,"w":"Stable, predictable care with oral meds and a routine dressing is within LPN scope; the RN keeps the assessment and care plan."},{"o":["experienced RN","float RN","LPN","new graduate RN"],"a":1,"w":"Stable care with routine IV antibiotics uses general skills a Mother-Baby RN already has—no telemetry or unit-specific equipment."}],"src":"PCAP Study Guide — worksheet Activity A (1–4) · PCAP Module 3 — Workforce Advocacy: Safe Staffing, Box 13.3 (questions before employment), Box 13.5 (questions before accepting an assignment), Floating and Mandatory Overtime; PNC Module 7 — Floating and Cross-Training (Winkelman; Francis); PCAP Module 3 — Workplace Safety (violence, fatigue) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"M5-27","m":5,"lo":"5.5","t":"Continuous quality improvement","cj":"Evaluate Outcomes","d":3,"type":"sata","s":"Three months after implementing countermeasures for falls (hourly rounding, bed alarms, and a UAP huddle), the team evaluates the results. Which data would best show whether the countermeasures worked? Select all that apply.","r":"Implement-and-monitor is the final RCA step. Evaluation should combine outcome measures (fall and injury rates), process measures (rounding completion), and feedback on feasibility and unintended effects. Training completion shows activity, not whether the countermeasures worked.","o":["Audit of hourly rounding completion","The number of staff who completed the countermeasure training","Falls with injury rate","Patient and staff feedback on the new process","Falls per 1,000 patient days before and after implementation"],"a":[0,2,3,4],"w":["Correct — process measure (fidelity).","Training completion is an activity measure, not evidence the countermeasures worked.","Correct — outcome severity.","Correct — feedback on feasibility and unintended effects.","Correct — outcome measure."],"src":"Module 5 slides — Root Cause Analysis (common mistakes; “human error is rarely the root cause”), 5 Whys fall example, Fishbone categories, Countermeasures vs. Solutions · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"Z2-03","m":2,"lo":"2.2","t":"Leadership styles in context","cj":"Analyze Cues","d":1,"type":"cloze","s":"Case: During a cardiac arrest, the charge nurse assigns compressions, medications, and recording by name. Later that month, she leads the unit’s shift to a new EHR by sharing a vision of safer care and mentoring unit champions. Her colleague manages the overtime budget by rewarding staff who meet documentation targets.","r":"Effective leaders adapt style to the situation: autocratic in emergencies, transformational for change and growth (the Magnet gold standard), transactional for day-to-day compliance and exchanges. Laissez-faire works only with highly experienced, self-directed teams.","tpl":"During the code, the charge nurse used {0} leadership; during the EHR transition, she used {1} leadership; her colleague’s approach is {2}.","bl":[{"o":["autocratic/directive","democratic/participative","laissez-faire","servant"],"a":0,"w":"Emergencies require rapid, top-down decisions."},{"o":["transformational","autocratic","laissez-faire","transactional"],"a":0,"w":"Inspiring a shared vision and mentoring are transformational behaviors."},{"o":["laissez-faire","servant","transactional","transformational"],"a":2,"w":"Rewards tied to performance targets are transactional exchanges."}],"src":"PCAP Module 2 — Box 17.1 (transformational vs. transactional) and Management Styles table (autocratic, democratic, laissez-faire); Giddens Leadership concept (leadership styles) · Final Exam Study Guide, Module 2 (leader vs. manager, leadership theories, prioritization, 5 rights, EAT)"},{"id":"K-09","m":7,"lo":"7.6","t":"Recognizing diversion and impairment","cj":"Recognize Cues","d":2,"type":"sata","s":"Over three weeks, a Georgia surgical nurse notices several things about a colleague. Which findings are recognized indicators of possible drug diversion or chemical impairment? Select all that apply.","r":"Course materials list signs of impairment and diversion: excessive waste, patients with unrelieved pain, frequent bathroom breaks, volunteering for patients with opioid orders, documentation errors, and physical signs such as drowsiness and pinpoint pupils. A shift-preference request is not an indicator by itself.","o":["Hydromorphone waste 4 times the unit average","Volunteering for patients with opioid orders","Frequent bathroom breaks","Drowsiness and pinpoint pupils during the shift","Asking to switch to night shift","Patients reporting unrelieved pain despite documented doses"],"a":[0,1,2,3,5],"w":["Correct — excessive waste.","Correct — seeking access.","Correct — a classic sign.","Correct — opioid effects.","Not an indicator by itself.","Correct — possible substitution or nonadministration."],"src":"Georgia Rule 410-12-.01 (Mandatory Reporting) and 410-12-.02 (Reporting of Minor Incidents); Health Care Law Worksheet — Chemically Impaired Nurse and Drug Diversion · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"G-05","m":3,"lo":"3.6","t":"Political advocacy","cj":"Take Action","d":1,"type":"mc","s":"A nurse wants to influence a proposed state bill that would expand community-based maternal health services. Which action is the best example of political advocacy?","r":"Effective political advocacy brings credible evidence and a specific request to the people who decide, while the decision is still open. A strong message identifies the nurse as a constituent, uses local data plus a brief de-identified story, separates evidence from opinion, and asks for a specific action (for example, “vote yes on SB 123”).","sg":"Final Study Guide & Practice — practice Q5","o":["Send legislators a concise, evidence-based brief with a specific recommendation","Share a news article about the bill on her personal social media page","Wait until the bill becomes law and then help implement it","Discuss the bill with coworkers on the unit to build support before the vote"],"a":[0],"w":["Correct — evidence plus a clear request to decision-makers during the policy process.","Raises awareness but does not engage decision-makers with evidence or a request.","Misses the window when nurses can shape the bill.","Builds interest but does not reach the people voting on the bill."],"src":"Final Study Guide & Practice — practice Q5 · PCAP Module 3 — Grassroots Political Strategies (visit policymakers; join professional organizations; how to address legislators) · Final Exam Study Guide, Module 3 (health policy, micro vs. macro advocacy, evidence-informed recommendations)"},{"id":"M4-24","m":4,"lo":"4.4","t":"Cost-conscious clinical decisions","cj":"Take Action","d":3,"type":"mc","s":"A patient on an HDHP with an unmet deductible tells the nurse she will not fill her new $380 brand-name antihypertensive and will “just watch my salt.” Her BP is 168/98. What is the best nursing action?","r":"Cost is the barrier blocking adherence. The nurse supports access and informed decision-making by advocating for an effective, affordable alternative and assistance resources—without promising coverage or recommending unsafe dose changes. Uncontrolled BP at this level risks stroke.","o":["Teach a low-sodium diet as an equivalent alternative to the medication","Explore her cost concern and ask the prescriber about a lower-cost generic and assistance programs","Accept her decision and document refusal","Explain that she must take the medication regardless of cost"],"a":[1],"w":["Lifestyle change helps but does not replace drug therapy at a BP of 168/98.","Correct — addresses cost while protecting safety.","Gives up on advocacy before exploring options.","Ignores the real barrier and is unlikely to change behavior."],"src":"Module 4 slides — How Cost vs. Charge Differences Arise; Cost Matrix Worksheet (direct medical, direct non-medical, indirect, intangible; preventing/reducing/managing cost); nurses as economic stewards · Final Exam Study Guide, Module 4 (Medicare A–D, Medicaid, HMO/PPO/EPO, stewardship, value-based care)"},{"id":"N6-01","m":6,"lo":"6.7","t":"Conflict resolution modes","cj":"Generate Solutions","d":2,"type":"mc","s":"Day-shift and night-shift nurses disagree about when bed baths should happen; the conflict has lasted months and affects morale and patient sleep. The manager has time to address it. Which conflict resolution approach is most appropriate?","r":"Collaborating (win–win; high assertiveness and high cooperation) is best for complex, recurring issues needing long-term commitment when time allows. Compromising is a partial win for quick or temporary fixes; accommodating sacrifices one side’s goals; avoiding fits only when emotions are too high and a cool-down is needed; competing fits emergencies.","o":["Collaborating—have both shifts design a solution together","Compromising—split the baths evenly between shifts as a quick fix","Accommodating—let day shift decide to restore harmony","Avoiding—allow emotions to cool for several more weeks"],"a":[0],"w":["Correct — a win–win solution for a complex, recurring issue.","Useful under time pressure, but this long-standing issue needs a durable solution.","One side sacrifices its goals; resentment may persist.","The conflict has already persisted; avoidance prolongs it."],"src":"Module 6 Communication & Collaboration slides — conflict and mutual support · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"M5-20","m":5,"lo":"5.7","t":"Fall prevention","cj":"Generate Solutions","d":2,"type":"mc","s":"A patient with a high fall-risk score and a history of nighttime toileting falls asks to use the bathroom frequently overnight. Which intervention is most likely to prevent a fall?","r":"Proactive scheduled toileting addresses the patient’s specific risk (nighttime urgency). Combining it with environmental measures is evidence-based. Restraints and four raised side rails are restraints that increase injury risk, and withholding toileting is unsafe and undignified.","o":["Place a bedside commode and instruct her to use it independently","Scheduled toileting plus a low bed and alarm","Keep all four side rails up so the patient cannot get out of bed without calling for help","Request a sitter for the night shift only if the patient becomes confused"],"a":[1],"w":["Reduces distance but still invites unassisted transfers for a high-risk patient.","Correct — targets the patient’s specific risk.","Four rails act as a restraint and increase climbing falls.","Reactive; scheduled toileting targets her known risk now."],"src":"Module 5 slides — Most Common Medication Errors; Common Preventable In-Patient Safety Risks (HAIs, falls, failure to rescue); Patient Engagement; Comprehensive Guide to Healthcare Quality & Patient Safety · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"G-43","m":8,"lo":"8.4","t":"Cybersecurity","cj":"Take Action","d":1,"type":"mc","s":"A nurse receives an email that looks like it is from IT: “Your EHR password expires today—click here and enter your login to keep access.” What is the best action?","r":"Phishing is a common route into hospital systems and can lead to ransomware and EHR downtime. Never click links or enter credentials from unexpected messages; report them to IT security. Unique logins, locked workstations, encryption, and audit trails are core HIPAA security safeguards.","o":["Click the link but use a new password so the old one isn’t exposed","Reply to ask whether the message is real","Forward it to coworkers to warn them","Don’t click; report it to IT security"],"a":[3],"w":["Entering any credentials on a phishing site exposes the account.","Replying confirms an active account to attackers.","Forwarding spreads the phishing link.","Correct — likely phishing; report it without engaging."],"src":"PNC Modules 8–9 — EHR Security (access control, encryption, audit trails, breach notification >500); EHRs and HIPAA · Final Exam Study Guide, Module 8 (HIT, AI applications, benefits/risks, ethical and legal concerns)"},{"id":"M5-16","m":5,"lo":"5.6","t":"High-reliability organizations","cj":"Recognize Cues","d":2,"type":"mc","s":"Which unit behavior best reflects a principle of high-reliability organizations?","r":"HROs operate in high-risk environments with few harmful events because of a preoccupation with failure, sensitivity to operations, reluctance to simplify, commitment to resilience, and deference to expertise. Daily huddles that examine near misses reflect a preoccupation with failure.","o":["Leaders review safety data quarterly and share results at staff meetings","Managers attribute errors mainly to individual carelessness","Staff discuss near misses in daily safety huddles to anticipate where the next error could occur","Policies are simplified by removing redundant double-checks to save time"],"a":[2],"w":["Useful, but HROs act on near-miss signals in real time (preoccupation with failure).","Blame contradicts systems thinking.","Correct — preoccupation with failure.","HROs are reluctant to oversimplify and value redundancy."],"src":"Econ/Quality Answer Key (STEEEP; Triple Aim; Donabedian; QSEN safety); PCAP Module 3 — NDNQI, QSEN, High Reliability Organizations · Final Exam Study Guide, Module 5 (Swiss cheese, Just Culture, event types, RCA, incident reporting, NDNQI, PDSA, VBP/HACs, TJC)"},{"id":"Z7-01","m":7,"lo":"7.3","t":"Intentional torts","cj":"Analyze Cues","d":1,"type":"cloze","s":"Case: A competent patient refuses an IM injection. Nurse A says, “If you don’t take it, I’ll hold you down and inject it.” Nurse B then gives the injection anyway. Nurse C tells security to keep the patient in his room when he tries to leave AMA.","r":"Intentional torts: assault (threat creating apprehension of unwanted contact), battery (unauthorized contact), false imprisonment (unjustified restraint or confinement), and defamation (slander spoken, libel written). A competent adult may refuse treatment and leave AMA.","tpl":"Nurse A committed {0}, Nurse B committed {1}, and Nurse C committed {2}.","bl":[{"o":["battery","defamation","assault","negligence"],"a":2,"w":"A threat causing fear of imminent unwanted contact is assault."},{"o":["false imprisonment","slander","battery","assault"],"a":2,"w":"Non-consensual physical contact is battery."},{"o":["defamation (libel)","false imprisonment","battery","malpractice"],"a":1,"w":"Unlawfully confining a competent patient is false imprisonment."}],"src":"PNC Module 7 — Intentional Torts in Nursing Practice (assault, battery, false imprisonment, defamation); Health Care Law Worksheet Activity 4 and Answer Sheet · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"M1-21","m":1,"lo":"1.3","t":"Medication reconciliation in transitions","cj":"Recognize Cues","d":2,"type":"mc","s":"A nurse admits a 74-year-old from a skilled nursing facility. The transfer form lists metoprolol 25 mg twice daily; the patient’s pharmacy record shows metoprolol succinate 100 mg daily; the patient says, “I take a little white heart pill twice a day.” What should the nurse do first?","r":"Medication reconciliation resolves discrepancies between sources before the next dose. Contacting the sending facility verifies what was actually administered, and the provider must clarify the order. Holding all cardiac drugs or waiting until the provider rounds risks rebound tachycardia or harm.","o":["Give the pharmacy-record dose, because pharmacy fill data are the most reliable source","Give the dose on the transfer form because it is the most recent document","Compare the sources, verify with the SNF what was actually given, and notify the provider before the next dose","Hold all cardiac medications until the provider rounds tomorrow"],"a":[2],"w":["A fill record shows what was dispensed, not what the SNF actually gave; verify first.","Acting on an unverified source perpetuates possible error.","Correct — verify, reconcile, and escalate.","Holding a beta-blocker without an order can cause rebound effects."],"src":"Module 1 Study Guide §IV–V (discharge planning begins at admission; high-risk readmission indicators; care coordination); PCAP Module 1 — Giddens Care Coordination (Transitional Care Model, PCMH, PACE, ACOs) · Final Exam Study Guide, Module 1 (SDOH, equity, prevention, HBM, care coordination, emergency response)"},{"id":"M7-11","m":7,"lo":"7.4","t":"Consent scope in surgery","cj":"Take Action","d":3,"type":"mc","s":"During a wound debridement under general anesthesia, the surgeon decides the leg needs a below-knee amputation and asks for the amputation tray. The consent lists only “wound debridement.” What should the circulating nurse do?","r":"The textbook uses this exact dilemma: the consent does not authorize amputation, and the patient cannot consent under anesthesia. The nurse must question the plan, keep amputation instruments off the sterile table, alert the team, and escalate through the chain of command.","o":["Proceed, because implied consent covers conditions discovered during surgery","Call the patient’s family to obtain verbal consent for the amputation by phone, then open the tray","Open the amputation tray because the surgeon has authority in the OR","Question, withhold instruments, alert, and escalate"],"a":[3],"w":["No immediate life-threatening emergency exists; the signed consent does not cover amputation.","No emergency exists; the patient will regain capacity after anesthesia, so a phone consent from family cannot authorize this added procedure.","Proceeding without consent is battery.","Correct — question, withhold, alert, escalate."],"src":"PNC Module 7 — Informed Consent (wound debridement → amputation example: question, withhold instruments, alert team, escalate) · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"M4-20","m":4,"lo":"4.2","t":"Catastrophic plans","cj":"Analyze Cues","d":2,"type":"mc","s":"A healthy 26-year-old freelance worker wants the lowest possible premium and mainly wants protection against a major accident. Which plan type fits his stated goal, and what should the nurse make sure he understands?","r":"ACA catastrophic plans are available to people under 30 (or with hardship exemptions), have very low premiums and very high deductibles, cover preventive care free, and pay for essential benefits after the deductible. The nurse ensures he understands the trade-off in out-of-pocket exposure.","o":["An HDHP with an HSA; it is the only plan type designed for catastrophic events","A catastrophic plan; he should understand he pays most costs until a very high deductible is met","A bronze Marketplace plan; it has no deductible but higher copays","A PPO plan; it typically has the lowest premiums and the broadest network for young, healthy enrollees"],"a":[1],"w":["HDHPs have low premiums, but the ACA catastrophic plan (available under 30) is designed specifically for his goal.","Correct — matches the goal and explains the trade-off.","Bronze plans have high deductibles; the catastrophic plan best fits his age and goal.","PPOs generally have the highest premiums."],"src":"Module 4 slides — Medicare Parts A–D and Medigap, Medicaid/CHIP, ACA provisions, Case Studies 1, 2 & 5; Health Care Law Worksheet — EMTALA and ACA · Final Exam Study Guide, Module 4 (Medicare A–D, Medicaid, HMO/PPO/EPO, stewardship, value-based care)"},{"id":"M7-22","m":7,"lo":"7.6","t":"Child abuse reporting","cj":"Take Action","d":2,"type":"mc","s":"A nurse suspects child abuse in a toddler with patterned burns whose parents give inconsistent explanations. The nurse is afraid the family will sue if the suspicion is wrong. Which statement is most accurate?","r":"All states require reporting of suspected child abuse; nurses are typically named mandated reporters, with penalties for failure to report. Good-faith reports are protected by immunity provisions (for example, Heinrich v. Conemaugh Valley Memorial Hospital).","o":["Report it; good-faith reports are generally immune from civil liability","The nurse should first talk with the parents to clarify the explanation before making any report","Report only after the physician confirms abuse on imaging","The nurse should wait for proof before reporting to avoid liability"],"a":[0],"w":["Correct — mandated reporting with good-faith immunity.","Confrontation may endanger the child and is not the nurse’s role.","Reasonable suspicion triggers the duty; confirmation is not required.","Reasonable suspicion, not proof, triggers the duty."],"src":"Georgia Rule 410-12-.01 (Mandatory Reporting) and 410-12-.02 (Reporting of Minor Incidents); Health Care Law Worksheet — Chemically Impaired Nurse and Drug Diversion · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"M7-20","m":7,"lo":"7.6","t":"Georgia Rule 410-12 — reportable conduct","cj":"Analyze Cues","d":3,"type":"sata","s":"Under Georgia Rule 410-12-.01, which situations require a report to the Georgia Board of Nursing when a nurse has reasonable cause to believe they occurred? Select all that apply.","r":"Reportable grounds include practicing without a valid license or while suspended, impairment from alcohol or drugs, an error contributing to death or serious harm, felony and certain criminal convictions, fraud, and violations of the Unprofessional Conduct Rule. Tardiness is not a listed ground.","o":["A nurse was 10 minutes late to work twice this month","A coworker displays an inability to practice with reasonable skill and safety due to alcohol use","A nurse was convicted of a felony while holding a license","A nurse violated the Board’s Unprofessional Conduct Rule","A colleague is practicing as an RN while her license is suspended","A nurse’s medication error contributed to a patient’s death"],"a":[1,2,3,4,5],"w":["Not a reportable ground.","Correct — impairment.","Correct — felony conviction.","Correct — violating the Unprofessional Conduct Rule is a listed ground.","Correct — practicing during suspension.","Correct — an error contributing to death or serious harm."],"src":"Georgia Rule 410-12-.01 (Mandatory Reporting) and 410-12-.02 (Reporting of Minor Incidents); Health Care Law Worksheet — Chemically Impaired Nurse and Drug Diversion · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"M8-02","m":9,"lo":"9.1","t":"Professional comportment","cj":"Evaluate Outcomes","d":2,"type":"sata","s":"Which behaviors demonstrate the professional comportment and nurse-as-leader domains of professional identity? Select all that apply.","r":"The four domains are values and ethics, knowledge, nurse as leader, and professional comportment. Introducing oneself, preparation and punctuality, and contributing evidence in team discussions are comportment and leadership behaviors. Discussing patients in public spaces and correcting colleagues in front of patients violate professional comportment.","o":["Arriving on time, prepared, and in appropriate attire","Correcting a colleague’s documentation error in front of the patient","Venting about a difficult patient in the hospital cafeteria","Speaking up in an interdisciplinary meeting to share an evidence-based recommendation","Introducing oneself by name and role to every patient and family"],"a":[0,3,4],"w":["Correct — comportment.","Public correction is uncivil and undermines trust; address errors privately.","Violates privacy and comportment.","Correct — nurse as leader.","Correct — comportment."],"src":"PNC Modules 8–9 — Giddens Professional Identity concept (four domains; integrity, courage, humility, advocacy exemplars) · Final Exam Study Guide, Module 9 (licensure, BON/NPA, NCLEX/NLC, certification, ANA Code, Benner, lifelong learning)"},{"id":"M7-24","m":7,"lo":"7.7","t":"Ethical theories","cj":"Analyze Cues","d":1,"type":"mc","s":"A state Medicaid program redirects funding from costly experimental treatments with low survival rates to prenatal care that benefits many more people. Which ethical theory best explains this decision?","r":"Utilitarianism holds that an action is right if it produces the greatest balance of good consequences for the most people. Deontology judges actions by duty and the intrinsic morality of the act regardless of consequences.","o":["The ethics of care","Utilitarianism","Virtue ethics","Deontology"],"a":[1],"w":["Ethics of care centers relationships and responsiveness.","Correct — the greatest good for the greatest number.","Virtue ethics centers moral character.","Deontology focuses on duty regardless of outcome."],"src":"PNC Module 7 ethics chapter — Ethical Theory (utilitarianism, deontology), Ethical Principles (autonomy, beneficence/nonmaleficence, veracity), Box 9.3 Situation Assessment Procedure · Final Exam Study Guide, Module 7 (ethical principles, HIPAA, torts, five elements of malpractice, informed consent, EMTALA)"},{"id":"M2-17","m":2,"lo":"2.5","t":"Supervision & accountability","cj":"Evaluate Outcomes","d":3,"type":"mc","s":"An RN delegated a 2-hour post-transfusion vital-sign check to a competent UAP and gave clear reporting parameters. The UAP documents a temperature of 101.4°F (38.6°C) but does not report it. Which statement about accountability is correct?","r":"Delegation transfers the performance of a task, not the RN’s accountability. Delegatees are responsible for their own actions (including reporting as directed), while the RN remains accountable for appropriate delegation, supervision, and evaluation, such as checking results after a high-risk procedure.","o":["Only the UAP is accountable because the RN gave clear directions","The charge nurse is solely accountable for the outcome","Only the RN is accountable because UAPs cannot be held responsible","The UAP is responsible for failing to report; the RN remains accountable for supervision and follow-up"],"a":[3],"w":["The RN retains supervisory accountability.","Accountability is not solely the charge nurse’s.","UAPs are responsible for performing tasks as directed.","Correct — shared responsibility; RN accountability for supervision."],"src":"Boot Camp §05 (five rights of delegation; RN keeps assessment, evaluation, teaching); PNC Module 7 legal chapter — Personal Liability in Delegation and Supervision · Final Exam Study Guide, Module 2 (leader vs. manager, leadership theories, prioritization, 5 rights, EAT)"},{"id":"M6-10","m":6,"lo":"6.3","t":"Cross-monitoring","cj":"Take Action","d":2,"type":"mc","s":"A nurse notices that a colleague is about to hang a heparin bag on the wrong pump channel while a pharmacy tech interrupts her. What is the best application of cross-monitoring?","r":"Cross-monitoring is an error-reduction strategy: monitoring teammates’ actions and stress, providing a safety net, and catching mistakes quickly—“watching each other’s back.” Immediate, respectful intervention prevents harm.","o":["Speak up now: “Hold on—let’s double-check the channel together.”","Let the colleague finish programming and rely on the pump’s drug library to catch any channel error","Report the colleague to the manager after the shift","Quietly reprogram the pump herself after the colleague walks away"],"a":[0],"w":["Correct — real-time safety net.","Relies on a single defense layer.","Too late to prevent harm and punitive.","Bypasses the colleague; cross-monitoring means speaking up in real time."],"src":"Module 6 slides — Brief/Huddle/Debrief; Situation Monitoring (STEP, I’M SAFE, cross-monitoring) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"G-21","m":1,"lo":"1.2","t":"Equity vs. equality","cj":"Analyze Cues","d":2,"type":"mc","s":"A public health nurse is planning interventions for a rural county with high rates of uncontrolled hypertension. Which intervention best reflects health equity rather than health equality?","r":"Equality gives everyone the same thing; equity gives people what they need to reach a fair outcome. Equity interventions identify the groups with worse outcomes and remove their specific barriers (language, transportation, cost). Look for answers that are targeted, barrier-specific, and brought to the community.","sg":"PCAP Study Guide — practice Q1","o":["Offer free BP screenings at the courthouse every Monday from 9 to 11 a.m.","Post DASH-diet videos on the health department’s social media page","Bring bilingual mobile clinics and free BP cuffs to low-income areas without transit","Distribute the same low-sodium diet pamphlet to every household in the county by mail"],"a":[2],"w":["One fixed site and time ignores transportation and work barriers.","Same offer for all; misses people without internet access or English fluency.","Correct — resources matched to the barriers of those most affected.","Identical resources for everyone is equality."],"src":"PCAP Study Guide — practice Q1 · Module 1 Study Guide §II–III (equality vs. equity; disparities = the problem, equity = the goal; SDOH); PCAP Module 1 — Giddens Health Disparities concept (unavoidable/avoidable × acceptable/unacceptable) · Final Exam Study Guide, Module 1 (SDOH, equity, prevention, HBM, care coordination, emergency response)"},{"id":"M3-10","m":3,"lo":"3.3","t":"Shared governance","cj":"Analyze Cues","d":1,"type":"mc","s":"A nurse is interviewing at two hospitals. Which finding best indicates a shared-governance practice environment?","r":"Shared governance gives direct-care nurses an active role and shared accountability in decisions about practice and the work environment. Questions to ask include whether nurses are encouraged to participate and whether adequate work time is allowed for council work.","o":["Staff are surveyed once a year but results are not shared","Nurses can submit suggestions to a manager-led practice committee","Staff nurses make practice decisions on paid council time","The CNO personally reviews and approves every new nursing policy after a final check by the managers"],"a":[2],"w":["Surveying without action is not shared decision-making.","Input to a manager-led group is participation, not shared decision-making authority.","Correct — authority and time for staff-nurse decision-making.","Top-down control is not shared governance."],"src":"PCAP Module 3 — Whistle-Blower Protection (“Things to Know About Whistle-Blowing”); Magnet Recognition Program; Shared Governance (Box 13.7); Conflict Resolution · Final Exam Study Guide, Module 3 (health policy, micro vs. macro advocacy, evidence-informed recommendations)"},{"id":"M8-06","m":8,"lo":"8.1","t":"Standardized terminology","cj":"Analyze Cues","d":2,"type":"mc","s":"Two hospitals in the same health information exchange document the same nursing problem using different free-text phrases, making it impossible to compare pressure-injury outcomes. What is the best solution?","r":"Standardized, codified terminologies eliminate ambiguity and make data interoperable and comparable across settings—essential for quality measurement, research, and care coordination.","o":["Adopt a standardized, ANA-recognized nursing terminology in both EHRs","Have a reviewer manually re-code notes each quarter","Require both hospitals to use the same EHR vendor","Allow each nurse to choose her own wording, because individualized language supports patient-centered care"],"a":[0],"w":["Correct — standard terminology enables comparison.","Labor-intensive and error-prone; standard terminology at the source is the fix.","Same vendor does not guarantee standardized terms; terminology standards do.","Free text prevents aggregation and comparison."],"src":"PNC Modules 8–9 — Giddens Health IT/Informatics concept (health IT vs. informatics; standardized terminology; data → wisdom) · Final Exam Study Guide, Module 8 (HIT, AI applications, benefits/risks, ethical and legal concerns)"},{"id":"G-24","m":2,"lo":"2.5","t":"Delegation to UAP","cj":"Take Action","d":2,"type":"sata","s":"A nurse is preparing to delegate tasks to unlicensed assistive personnel (UAP). Which tasks are appropriate to delegate? Select all that apply.","r":"UAP may perform routine, predictable tasks for stable clients: ADLs, ambulation, routine vital signs, fingerstick glucose, I&O, and non-sterile specimen collection. The RN keeps EAT—Evaluation, Assessment, Teaching—and care of unstable clients. Per your course, reinforcing teaching is an LPN task, not a UAP task.","sg":"PCAP Study Guide — practice Q4","o":["Evaluate a client’s tolerance of a new clear-liquid diet after bowel surgery","Measure and record strict intake and output for a client receiving IV fluids","Ambulate a client 2 days post-stroke in the hallway using a gait belt","Reinforce discharge teaching about wound-infection signs with the client’s family","Obtain a routine fingerstick glucose for a client with stable type 2 diabetes"],"a":[1,2,4],"w":["Evaluation is an RN function.","Correct — measurement only; the RN interprets the totals.","Correct — routine ADL/mobility for a stable client.","Teaching and reinforcing teaching are not UAP tasks.","Correct — routine, predictable data collection on a stable client."],"src":"PCAP Study Guide — practice Q4 · Boot Camp §05 (five rights of delegation; RN keeps assessment, evaluation, teaching); PNC Module 7 legal chapter — Personal Liability in Delegation and Supervision · Final Exam Study Guide, Module 2 (leader vs. manager, leadership theories, prioritization, 5 rights, EAT)"},{"id":"M8-13","m":8,"lo":"8.4","t":"Security safeguards","cj":"Take Action","d":2,"type":"sata","s":"Which practices align with HIPAA security safeguards for electronic health information? Select all that apply.","r":"Safeguards include access control (unique credentials, locking workstations), encryption on organization-approved devices, and audit trails. Shared logins defeat accountability, a password-protected personal USB drive is not approved encrypted storage, and texting PHI to personal phones is an unsecured channel.","o":["Storing patient lists on a personal USB drive protected by a password","Using unique passwords and PINs for each user","Logging off or locking the workstation when stepping away","Texting patient photos to a colleague’s personal phone for a wound consult","Sharing a login with a float nurse who has not received credentials yet"],"a":[1,2],"w":["A personal USB drive is not an approved, encrypted storage device; a password is not encryption.","Correct — unique access credentials.","Correct — prevents unauthorized access.","Unsecured channel for PHI.","Shared credentials defeat access control and audits."],"src":"PNC Modules 8–9 — EHR Security (access control, encryption, audit trails, breach notification >500); EHRs and HIPAA · Final Exam Study Guide, Module 8 (HIT, AI applications, benefits/risks, ethical and legal concerns)"},{"id":"M8-19","m":8,"lo":"8.5","t":"Consumer health information","cj":"Generate Solutions","d":2,"type":"sata","s":"A patient brings printouts from social media claiming a supplement cures diabetes. Which nursing actions help the patient become a better consumer of health information? Select all that apply.","r":"Nurses help patients become better consumers of health information by teaching credibility criteria (source, author credentials, date), pointing to reputable organizations, and discussing claims respectfully with attention to safety and interactions. Blanket instructions to stop all supplements or to rely on a single website do not build the patient’s evaluation skills.","o":["Recommend a single trusted health website and discourage other searching","Teach the patient to check the source, author credentials, and date of the information","Advise the patient to stop all supplements until the next visit","Discuss the claims respectfully and review potential interactions with current medications","Explain how to look for evidence from reputable organizations (for example, .gov or professional associations)"],"a":[1,3,4],"w":["Does not build the patient’s own evaluation skills.","Correct — evaluation criteria.","A blanket instruction does not build evaluation skills and may be unnecessary.","Correct — respectful, safety-focused discussion.","Correct — reliable sources."],"src":"PNC Modules 8–9 — Point-of-Care Technology, Wearables, Telehealth (synchronous vs. asynchronous), Consumer Health IT; Module 5 slides — Technology and Patient Safety · Final Exam Study Guide, Module 8 (HIT, AI applications, benefits/risks, ethical and legal concerns)"},{"id":"M6-03","m":6,"lo":"6.2","t":"SBAR","cj":"Take Action","d":2,"type":"mc","s":"A nurse is calling a provider about a patient whose urine output has been 15 mL/hr for 3 hours after abdominal surgery. Which statement is the best “Recommendation” component of SBAR?","r":"In SBAR, the Recommendation states what the nurse needs—specific orders and a time frame. The other statements are Assessment (concern without a request), Background, or Situation and data.","o":["“He is a 67-year-old post-op day 1 after bowel resection.”","“Would you order a bolus and BMP and come see him?”","“I think something is wrong with his kidneys, and I’m worried his output will keep dropping.”","“His BP is 98/60, HR 112, and he received 2 liters in surgery.”"],"a":[1],"w":["Background.","Correct — specific request and time frame.","A vague assessment with no request.","Assessment data, not a recommendation."],"src":"Module 6 slides — SBAR, Call-Out, Check-Back, Teach-Back, Handoff; Boot Camp §11 (read-back for critical messages) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"G-12","m":6,"lo":"6.4","t":"CUS language","cj":"Take Action","d":2,"type":"mc","s":"A nurse is concerned that a colleague is too fatigued to safely give high-alert medications. Which response best uses TeamSTEPPS CUS language?","r":"CUS escalates in three deliberate steps—“I am Concerned,” “I am Uncomfortable,” “This is a Safety issue.” The words are standardized so the whole team recognizes them as a signal to stop and listen. If the concern is still not resolved, the nurse uses the chain of command.","sg":"Final Study Guide & Practice — practice Q12","o":["“You look exhausted—grab a coffee before you hang that heparin.”","“I’m concerned you’re tired—let me know if you need anything.”","“I’ll mention your fatigue to the manager at the end of the shift.”","“I’m concerned about your fatigue, I’m uncomfortable with this assignment, and this is a safety issue.”"],"a":[3],"w":["Notices fatigue but does not escalate or name a safety issue.","States concern but stops short of the safety call that stops the line.","Delays action while the risk is present now.","Correct — Concerned, Uncomfortable, Safety issue."],"src":"Final Study Guide & Practice — practice Q12 · Module 6 slides — Mutual Support (task assistance, formative feedback, advocacy and assertion, two-challenge rule, CUS, DESC) · Final Exam Study Guide, Module 6 (SBAR, CUS, huddle/debrief, delegation by scope, staffing, conflict resolution, workplace violence)"},{"id":"G-19","m":8,"lo":"8.6","t":"Public chatbot and PHI","cj":"Take Action","d":2,"type":"mc","s":"A nurse is using an unapproved public chatbot to help draft a patient case summary and considers entering the patient’s name and diagnosis. What is the best action?","r":"Never enter identifiable patient information or PHI into an unapproved public AI tool—it may be stored, used for training, or exposed. Removing a name is not enough, and patient consent does not convert an unapproved tool into an approved one. Use organization-approved systems and de-identified workflows that policy allows.","sg":"Final Study Guide & Practice — practice Q19","o":["Remove the name but keep the diagnosis and age, then use the chatbot","Use initials instead of the full name and continue","Keep patient data out of the tool and use approved systems","Ask the patient’s permission before entering the details"],"a":[2],"w":["De-identification alone does not make an unapproved tool acceptable.","Initials plus clinical details can still identify the patient.","Correct — protects confidentiality and follows policy.","Patient permission does not make an unapproved tool compliant with policy."],"src":"Final Study Guide & Practice — practice Q19 · PNC Modules 8–9 — Health IT concept and IT in the Clinical Setting (clinical decision support, technology and judgment) · Final Exam Study Guide, Module 8 (HIT, AI applications, benefits/risks, ethical and legal concerns)"},{"id":"G-53","m":1,"lo":"1.4","t":"Health Belief Model — fear of results","cj":"Analyze Cues","d":3,"type":"sata","s":"A patient says, “I know screening matters, but I’m afraid of what the test might find.” Which Health Belief Model constructs may be influencing the decision? Select all that apply.","r":"Barriers include psychological costs such as fear. High perceived severity can motivate action, but when it feeds fear it can also cause avoidance. Fear may also lower self-efficacy. Supportive, accurate information, a plan for what happens after the result, and help scheduling the test address these constructs.","sg":"PCAP Study Guide — worksheet Module 1 (4)","o":["Perceived benefits","Perceived severity","Self-efficacy","Cues to action","Perceived barriers"],"a":[1,2,4],"w":["She already agrees screening matters.","Correct — fear suggests she sees the possible disease as very serious.","Correct — fear may reduce confidence that she can go through with the test.","No trigger or reminder is described.","Correct — fear of the result is a psychological cost of acting."],"src":"PCAP Study Guide — worksheet Module 1 (4) · Module 1 Study Guide §VI (Primary = Prevent, Secondary = Screen, Tertiary = Treat) and §X (Health Belief Model constructs; SDOH → perceived barriers) · Final Exam Study Guide, Module 1 (SDOH, equity, prevention, HBM, care coordination, emergency response)"},{"id":"M5-15","m":5,"lo":"5.6","t":"Donabedian model","cj":"Analyze Cues","d":3,"type":"sata","s":"A unit is evaluating its sepsis program using Donabedian’s model. Which measures are correctly classified? Select all that apply.","r":"Structure = resources and setting (trained staff, RRT availability). Process = care actions performed (screening rates, time to antibiotics). Outcome = results (mortality). Time to antibiotic is a process measure.","o":["Percentage of patients screened for sepsis on admission — process","Time from positive screen to first antibiotic dose — outcome","Number of nurses who completed sepsis-screening training — structure","Availability of a 24/7 rapid response team — structure","Sepsis mortality rate — outcome"],"a":[0,2,3,4],"w":["Correct — process.","Misclassified — time to treatment is a process measure.","Correct — structure (trained human resources).","Correct — structure.","Correct — outcome."],"src":"Econ/Quality Answer Key (STEEEP; Triple Aim; Donabedian; QSEN safety); PCAP Module 3 — NDNQI, QSEN, High Reliability Organizations · Final Ex
