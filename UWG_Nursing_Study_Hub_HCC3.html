const M=[
["GI Inflammation & Perioperative Care","GERD: head UP 2-3 h after meals. UC = Ulcers Continuous from rectum; Crohn = skip lesions, Chunks anywhere (mouth to anus).",[
"GERD|Weak lower esophageal sphincter lets acid reflux; heartburn, regurgitation. Small meals, avoid triggers, upright 2-3 h after meals, elevate HOB. Dysphagia or bleeding needs evaluation.",
"Gastritis / PUD|Mucosal inflammation/ulcer; H. pylori and NSAIDs are major risks. Epigastric pain, nausea, melena. PPI + eradication regimen; avoid NSAIDs. Sudden rigid abdomen = perforation (urgent).",
"IBS|Functional disorder: abdominal pain with altered stool pattern, no destructive inflammation. Individualized fiber, hydration, stress management. Bleeding/weight loss not typical.",
"Crohn disease|Transmural, skip lesions anywhere in GI tract; fistulas, strictures, malabsorption. In flare assess hydration, nutrition, pain, obstruction; anti-inflammatory therapy.",
"Ulcerative colitis|Continuous mucosal inflammation starting in rectum; bloody diarrhea, urgency. Monitor anemia, dehydration, toxic megacolon; colectomy can eliminate colonic disease.",
"Diverticular disease|Diverticulosis = pouches, often silent; fiber when appropriate. Diverticulitis = inflamed pouches, LLQ pain, fever; temporary liquids then advance; watch abscess/perforation.",
"Appendicitis|Periumbilical pain migrating to RLQ, nausea, fever. NPO, IV fluids, surgical evaluation; NO laxatives, enemas, or heat. Sudden relief then diffuse pain may mean rupture.",
"Colonoscopy / EGD|Verify consent, bowel prep (colonoscopy), NPO, sedation plan. After EGD verify swallowing before intake; after sedation monitor airway, VS, alertness. Severe pain, fever, significant bleeding abnormal.",
"NG / enteral feeding|Verify initial placement by x-ray; follow policy for ongoing checks. HOB 30-45 degrees during feeding; monitor aspiration, tolerance, hydration, patency.",
"TPN / lipids|Central access for hyperosmolar TPN; asepsis, pump, monitor glucose/electrolytes; do not stop abruptly without a plan. Watch infection and refeeding syndrome.",
"Perioperative care|Pre-op: identity, consent, allergies, NPO, baseline. Intra-op: time-out, positioning. Post-op: ABCs, bleeding, pain, mobility, pulmonary hygiene, VTE prevention.",
"Dehiscence / evisceration|Dehiscence = wound separation; evisceration = organs protrude. Stay with patient, call help, low Fowler with knees bent, sterile saline-moistened dressing, NPO; NEVER push organs back."],
[["","Crohn disease","Ulcerative colitis"],["Depth","Transmural","Mucosal"],["Pattern","Skip lesions, anywhere GI","Continuous from rectum"],["Hallmarks","Fistulas, strictures, malabsorption","Bloody diarrhea, urgency"],["Surgery","Not a cure","Colectomy removes colonic disease"]]],
["Liver, Pancreas & Biliary","Hepatitis: A/E = fecal-oral (Eat); B/C/D = blood (D needs B). Lactulose pulls ammonia out: titrate to 2-3 soft stools (verify goal).",[
"Hepatitis|A/E usually fecal-oral; B blood, sexual, perinatal; C mainly blood; D requires B. Vaccines for A and B; standard precautions, safe sharps.",
"Cirrhosis|Fibrosis + portal HTN cause ascites, varices, splenomegaly; low albumin, high INR. Monitor bleeding, daily weights, sodium, renal function.",
"Encephalopathy|Confusion, asterixis, altered consciousness. Assess airway and triggers (infection, GI bleed, constipation). Lactulose lowers ammonia; titrate to stool goal, monitor electrolytes.",
"Variceal bleeding|Hematemesis, melena, shock: ABCs, escalate, IV access, blood as ordered, urgent endoscopy. Propranolol prevents bleeding in selected stable patients, not rescue.",
"Ascites / hepatorenal syndrome|Sodium restriction, diuretics, daily weight and girth. Rising creatinine or oliguria in advanced liver disease needs urgent evaluation.",
"Cholelithiasis / cholecystitis|RUQ pain after fatty food, radiates to right shoulder; fever + Murphy sign = inflammation. Jaundice = obstruction; fever + jaundice + RUQ pain = cholangitis.",
"Pancreatitis|Severe epigastric pain radiating to back, high lipase. IV fluids, analgesia, early oral/enteral nutrition as tolerated; watch shock, hypocalcemia, respiratory failure. Chronic: enzymes with meals.",
"Liver/pancreas labs|AST/ALT = hepatocellular injury; ALP/bilirubin = cholestasis; INR and albumin = synthesis; lipase = pancreatitis. Trend CBC, glucose, calcium, creatinine.",
"Paracentesis|Baseline VS, weight/girth, void first, upright as tolerated; monitor hypotension, leakage, bleeding. Albumin may be ordered after large-volume drainage.",
"Liver biopsy|Check coagulation and consent; monitor bleeding, pain, VS; position per policy (often right side after percutaneous biopsy).",
"T-tube|Maintain drainage position, assess output/color, avoid kinks; do not clamp or irrigate without order. Report sudden cessation with pain, fever, jaundice.",
"Liver/biliary nutrition|Avoid alcohol; adequate calories and protein in cirrhosis; individualized sodium restriction for ascites. Low-fat meals for biliary symptoms; enzymes with meals/snacks."]],
["Cancer & Cellular Regulation","Chemo toxicities: Anthracycline = Anguish of the heart; Vinca = Vinca-pathy (neuropathy). Tumor lysis: High K, Phos, uric acid; LOW Ca. Neutropenic fever = antibiotics NOW.",[
"Cancer basics|Uncontrolled growth, invasion, metastasis. Risks: tobacco, UV, family history, infections, exposures. Unexplained weight loss, bleeding, mass, bowel change need evaluation.",
"Lung cancer|Cough, hemoptysis, dyspnea; monitor airway/oxygenation. Low-dose CT screening for eligible high-risk adults. Post-op chest tube and pulmonary hygiene.",
"Breast cancer|Mass, skin dimpling, nipple changes; mammography per guideline. After mastectomy: JP drain, pain, prescribed arm exercises, lymphedema teaching.",
"Colorectal cancer|Blood in stool, bowel change, anemia; average-risk screening generally starts at 45 (verify). Stoma moist pink/red; dusky or black is urgent. Protect peristomal skin.",
"BPH / prostate cancer|BPH: hesitancy, weak stream, retention. Cancer may be silent or cause bone pain. PSA individualized. After TURP monitor bleeding, clots, CBI patency.",
"ALL|Immature lymphoblasts crowd out marrow: infection, anemia, bleeding. CBC, marrow testing; chemo, possible transplant; monitor tumor lysis and infection.",
"Chemotherapy|Alkylating agents, antimetabolites, anthracyclines (cardiotoxic), vincas (neuropathy), taxanes. Marrow suppression, mucositis, nausea, alopecia. Vesicant extravasation: stop infusion, leave access, notify.",
"Radiation|External beam does NOT make patient radioactive. Sealed internal source: time, distance, shielding. Unsealed: body-fluid precautions. Protect skin; no friction or unapproved products.",
"Neutropenia / thrombocytopenia|Neutropenic fever is urgent: cultures and prompt antibiotics. Hand hygiene, avoid sick contacts. Low platelets: bleeding precautions, avoid IM/rectal procedures.",
"Oncologic emergencies|Tumor lysis: high K/phos/uric acid, low Ca; ECG, renal. Cord compression: new back pain, weakness, bladder change. SVC syndrome: facial swelling, dyspnea. Sepsis/DIC: escalate.",
"Chest tube / JP / CBI|Chest drainage below chest, no routine clamping; continuous water-seal bubbling = possible leak. JP compressed for suction. CBI true urine = total drainage minus irrigant; low output = check obstruction."]],
["Sensory Perception","Acute angle-closure = painful red eye with halos (EMERGENCY). Retinal detachment = flashes, floaters, curtain. Meniere = vertigo, tinnitus, hearing loss, fullness.",[
"Cataract|Painless cloudy lens, glare, gradual blur. After surgery avoid rubbing and heavy lifting/straining; report severe pain or sudden vision loss.",
"Open-angle glaucoma|Gradual peripheral vision loss; optic nerve damage, often high IOP. Adhere to drops, lifelong follow-up.",
"Acute angle closure|Sudden severe eye pain, halos, red eye, nausea: emergency. Avoid precipitating medications; urgent ophthalmology.",
"Retinal detachment|Painless flashes, floaters, curtain over vision: urgent. After repair keep prescribed position; no air travel with intraocular gas until cleared.",
"Eye drops|Hand hygiene, lower conjunctival sac, never touch tip; gentle punctal occlusion; separate drops by about 5 minutes.",
"Hearing loss|Conductive = transmission problem; sensorineural = inner ear/nerve. Face patient, reduce noise, speak clearly, verify understanding; protect from loud noise.",
"Otitis media|Ear pain, fever, bulging TM; analgesia and antibiotics if indicated. Insert nothing in ear. After ear surgery follow dry-ear and pressure precautions.",
"Meniere disease|Episodic vertigo, tinnitus, fluctuating hearing loss, fullness. Fall precautions, quiet room in attack, low sodium if prescribed; no driving during vertigo.",
"Ear irrigation|Avoid if perforation suspected or tubes present. Body-temperature solution; adult pinna up/back, young child down/back; stop for pain or dizziness.",
"Hearing aids|Check battery, fit, clean, store dry; remove before water unless designed for it.",
"Visual impairment safety|Orient to room, keep pathways clear, announce your presence, provide accessible call light."],
[["","Open-angle","Acute angle closure"],["Onset","Gradual","Sudden"],["Signs","Peripheral vision loss","Severe pain, halos, red eye, nausea"],["Urgency","Lifelong drops/follow-up","Emergency"]]],
["Genetics & Clotting","Hemophilia A = factor 8 (A=8, B=9); X-linked; aPTT prolonged. Transfusion reaction: STOP, new tubing + NS, assess, notify. Sickle: Hypoxia, Dehydration, Infection trigger crisis.",[
"Sickle cell disease|Autosomal recessive HbS; sickling with hypoxia, dehydration, infection causes vaso-occlusion and hemolysis. Crisis: rapid analgesia, hydration, O2 if hypoxemic, treat trigger.",
"Acute chest syndrome|New infiltrate with fever, chest pain or respiratory symptoms; urgent oxygenation check, antibiotics, transfusion as indicated.",
"Other sickle complications|Stroke signs, splenic sequestration, infection, priapism are urgent. Hydroxyurea raises fetal Hb; monitor CBC; reproductive counseling.",
"Hemophilia|A = factor VIII, B = IX; X-linked recessive. Hemarthrosis, prolonged bleeding; prolonged aPTT, often normal PT/platelets. Replace factor; protect joints; avoid aspirin/NSAIDs.",
"Excess clotting / VTE|Immobility, cancer, surgery, pregnancy raise risk. Unilateral swelling = DVT; sudden dyspnea/chest pain = PE. Do NOT massage a suspected clot.",
"Transfusion|Verify order, consent, patient/product IDs, compatibility; baseline VS, approved tubing, normal saline. RN assesses/monitors; UAP may take routine VS only, not assess reactions.",
"Transfusion reaction|Stop transfusion immediately; keep IV with NEW tubing and normal saline; ABCs; notify provider/blood bank; follow specimen and product return policy. Fever, chills, dyspnea, back pain, hypotension.",
"DIC|Widespread clotting consumes platelets/factors, causing bleeding. Low platelets/fibrinogen, high D-dimer, prolonged PT/aPTT; treat cause, support perfusion, replace products."]],
["Sexuality, STIs & Contraception","ACHES: Abdominal pain, Chest pain, Headache, Eye/vision problems, Severe leg pain. Estrogen + migraine with aura / VTE risk = avoid. Chlamydia: doxy; Gonorrhea: ceftriaxone.",[
"Sexual history|Private, nonjudgmental, inclusive: partners, practices, protection, past STIs, pregnancy intentions. Respect autonomy, culture, confidentiality.",
"Chlamydia / gonorrhea|Often silent; discharge, dysuria, PID risk. NAAT; doxycycline for chlamydia (nonpregnant), ceftriaxone for gonorrhea; pregnancy regimens differ. Treat partners, retest.",
"Syphilis|Painless chancre, later rash incl. palms/soles; serology. Penicillin G by stage; penicillin required in pregnancy.",
"HSV / HPV|HSV: painful vesicles; antivirals suppress, not cure. HPV: warts/cancer; vaccine and cervical screening. Condoms reduce but do not eliminate risk.",
"Trichomoniasis|Frothy discharge, irritation; metronidazole + partner management. BV is not classified as an STI.",
"STI prevention levels|Primary: condoms, vaccines, education. Secondary: screening. Tertiary: treatment and complication prevention. Abstain until patient and partners are treated.",
"Combined hormonal contraception|Estrogen + progestin. Avoid with major VTE risk, migraine with aura, uncontrolled HTN, smoking 35+, certain postpartum periods. Teach ACHES.",
"Progestin-only / DMPA|For when estrogen is unsuitable; irregular bleeding. DMPA about every 3 months; weight change, bone density loss, delayed fertility return.",
"IUD / implant|Highly effective, reversible. Copper IUD nonhormonal; LNG IUD often reduces bleeding. Neither protects against STIs.",
"Emergency contraception|Copper IUD or oral ulipristal/levonorgestrel, up to 5 days; sooner is better for pills. Not an abortion pill. Follow restart instructions.",
"Contraceptive interactions|Enzyme inducers (phenytoin, St. John's wort) can reduce hormonal contraception; most routine antibiotics do not. Course contraception chart not supplied."]],
["High-Risk Pregnancy","Previa = Painless, bright red, no digital exam. Abruption = Agony, rigid uterus. HELLP: Hemolysis, Elevated Liver enzymes, Low Platelets. Mg toxicity: reflexes gone, RR down, urine down - give calcium gluconate.",[
"Pregnancy basics|Presumptive: nausea, amenorrhea, perceived movement. Probable: positive hCG, cervical changes. Positive: fetal heart activity/ultrasound. GTPAL; Naegele: LMP +7 days -3 months +1 year.",
"Hyperemesis|Persistent vomiting, dehydration, weight loss, electrolyte imbalance; IV fluids, antiemetics, nutrition; thiamine before dextrose if prolonged vomiting.",
"Gestational HTN / preeclampsia|New HTN after 20 weeks; preeclampsia adds proteinuria or organ dysfunction. Severe: BP ≥160/110, headache, vision change, RUQ pain, pulmonary edema = urgent treatment.",
"Eclampsia / HELLP|Eclampsia = seizures: protect airway, side position, call help, magnesium sulfate. HELLP: hemolysis, elevated liver enzymes, low platelets; watch bleeding, prepare for delivery.",
"Diabetes in pregnancy|Pregestational predates pregnancy; GDM develops during it. Glucose monitoring, nutrition, insulin; macrosomia, neonatal hypoglycemia; postpartum follow-up.",
"Miscarriage / ectopic|Bleeding/cramps may be loss; ectopic: unilateral pain, bleeding, shoulder pain, shock if ruptured. Assess stability, urgent evaluation; Rh prophylaxis if indicated.",
"Cervical insufficiency / molar pregnancy|Painless second-trimester dilation; cerclage in selected cases. Mole: abnormal trophoblast, high hCG, bleeding; evacuation and serial hCG.",
"Previa / abruption|Previa: painless bright bleeding; no digital exam until excluded. Abruption: painful bleeding, tender rigid uterus, fetal distress; may be concealed. Both urgent.",
"Kick counts / ultrasound|Teach individualized movement-count protocol; reduced movement = call promptly. Ultrasound: anatomy, growth, placenta, fluid.",
"NST / CST|NST: FHR accelerations without contractions; lateral/semi-Fowler; extend if fetal sleep. CST: FHR response to contractions; stop/escalate if abnormal.",
"BPP|NST plus ultrasound breathing, movement, tone, fluid; each usually 0 or 2; interpret by total, fluid, gestation.",
"Amniocentesis / CVS|Amnio: fluid, usually after 15 weeks. CVS: placental tissue, 10-13 weeks. Monitor bleeding, leakage, fever, contractions; Rh immune globulin if indicated.",
"Magnesium safety|Monitor RR, reflexes, urine output, mental status; stop and escalate for toxicity; antidote calcium gluconate. Prevents seizures; not a primary BP treatment."],
[["","Placenta previa","Abruption"],["Pain","Painless","Painful"],["Blood","Bright red","May be concealed"],["Uterus","Soft","Tender, rigid"],["Key action","No digital exam","Fetal distress, urgent"]]],
["Labor & Birth","Five Ps: Passenger, Passageway, Powers, Position, Psyche. VEAL CHOP: Variable=Cord, Early=Head, Late=Placenta. Late decels: reposition, stop oxytocin, escalate. Shoulder dystocia: McRoberts + suprapubic, NO fundal pressure.",[
"Five Ps|Passenger (fetus), passageway (pelvis), powers (contractions/pushing), position (maternal), psyche (coping). Reposition, support, assess progress.",
"True labor / stages|True labor = progressive cervical change. Stage 1 onset to 10 cm (active ~6 cm); stage 2 full dilation to birth; stage 3 birth to placenta; stage 4 recovery.",
"Mechanism of labor|Engagement, descent, flexion, internal rotation, extension, restitution/external rotation, expulsion. Assess station and presentation.",
"Labor pain|Visceral: contractions/cervical dilation; somatic: perineal stretch. Breathing, movement, massage, water if safe; opioids near birth may depress newborn respiration; epidural: watch hypotension/FHR.",
"FHR basics|Baseline 110-160; moderate variability (6-25 bpm) reassuring. Early = head compression; variable = cord compression; late = uteroplacental insufficiency. Trends matter.",
"Abnormal FHR|Reposition laterally, stop oxytocin, assess BP/contractions, fluids, escalate; O2 for maternal hypoxemia, not routine. Persistent bradycardia or absent variability with recurrent decels = urgent.",
"Induction / augmentation|Induction starts labor; augmentation strengthens it. Dinoprostone ripens cervix; oxytocin by pump with monitoring. Tachysystole >5 contractions/10 min over 30 min: reduce/stop oxytocin.",
"Preterm labor / PROM|Preterm labor <37 weeks with cervical change. PROM = rupture before labor; PPROM <37 weeks. Assess FHR, fluid, infection; avoid digital exams. Steroids, antibiotics, tocolysis or delivery by status.",
"Chorioamnionitis|Maternal fever, uterine tenderness, fetal tachycardia, purulent fluid; notify, antibiotics, delivery planning.",
"Postterm / dystocia|Postterm ≥42 weeks; monitor fetus and fluid. Dysfunctional labor: assess powers, passenger, passage; no unsafe augmentation if obstruction suspected.",
"Labor procedures|ECV with fetal monitoring and emergency readiness; forceps/vacuum need criteria and skilled provider. C-section: perioperative care. TOLAC/VBAC: assess eligibility, watch for rupture.",
"Labor emergencies|Cord prolapse: call help, lift presenting part off cord, knee-chest/Trendelenburg, urgent birth. Shoulder dystocia: McRoberts + suprapubic; no fundal pressure. Uterine rupture: sudden FHR change, pain/bleeding, surgery. EMTALA: screen/stabilize regardless of payment."],
[["Decel","Cause","Think"],["Early","Head compression","Benign, mirrors contraction"],["Variable","Cord compression","Reposition; cord prolapse check"],["Late","Uteroplacental insufficiency","Reposition, stop oxytocin, escalate"]]],
["Postpartum","BUBBLE-HE (supplemental; check faculty 12-point rubric). 4 Ts of PPH: Tone, Trauma, Tissue, Thrombin. Boggy fundus = massage + empty bladder. REEDA for wounds.",[
"Normal recovery|Fundus firm/midline, drops ~1 cm/day; lochia rubra, serosa, then alba. Diuresis, afterpains, breast changes, transient leukocytosis. Subinvolution = delayed return.",
"12-point assessment|Suggested: breasts, uterus, bladder, bowel, lochia, perineum, incision, extremities, vitals, pain, emotional status, bonding. Exact course checklist not provided.",
"Perineum / incision|REEDA: redness, edema, ecchymosis, discharge, approximation. Ice early, sitz bath later; wipe front to back. C-section: incision, mobility, bowel function, VTE risk.",
"Postpartum hemorrhage|Cumulative loss ≥1000 mL or bleeding with hypovolemia within 24 h; >500 mL vaginal warrants evaluation. 4 Ts. Boggy fundus: massage, assess bladder, call help, oxytocin as ordered.",
"Hemorrhagic shock|Tachycardia, pallor, altered mentation, oliguria; hypotension is late. Activate hemorrhage response, quantify loss, IV access, fluids/blood, monitor perfusion.",
"Postpartum VTE|Unilateral leg pain/swelling; PE: sudden dyspnea, chest pain, hypoxia. Urgent escalation; no massage. Early mobility, prescribed prophylaxis.",
"Postpartum infection|Endometritis: fever, uterine tenderness, foul lochia. Mastitis: focal breast pain/redness, fever; treat, keep milk removal. Wound infection: redness, drainage.",
"Mood / bonding|Baby blues resolve within 2 weeks; persistent depression needs evaluation. Psychosis, hallucinations, or thoughts of harming self/infant = emergency; never leave alone with infant.",
"Postpartum discharge|Stable VS, bleeding, voiding, pain, mobility, feeding plan, follow-up. Stay 1-2 days vaginal, 2-4 cesarean. Teach: heavy bleeding, severe headache, chest pain, dyspnea, fever, suicidal thoughts.",
"Postpartum delegation|UAP: hygiene, ambulation, routine VS for stable patients. RN keeps assessment, fundal/lochia evaluation, teaching, judgment."]],
["Newborn & Development","APGAR: Appearance, Pulse, Grimace, Activity, Respirations (1 & 5 min). Do NOT wait for APGAR to resuscitate. Cold + grunting: breathing and warmth BEFORE feeding.",[
"Transition / APGAR|Dry, warm, stimulate, assess breathing/HR. APGAR at 1 and 5 min; repeat q5 min to 20 if 5-min score &lt;7. Apnea/gasping or HR &lt;100 after initial steps = ventilate per NRP; don't wait for score.",
"Normal vs abnormal newborn|Term HR 100-160, RR 30-60, axillary temp 36.5-37.5 C. Acrocyanosis can be normal early; central cyanosis, grunting, retractions, persistent tachypnea = urgent.",
"Cold stress / hypoglycemia|Cold raises O2 and glucose use. Warm, assess breathing, check glucose if symptomatic/at risk, feed if stable or give glucose per protocol. Respiratory distress outranks feeding.",
"First 2 hours|Skin-to-skin if stable, ID/security, measurements, feeding, vitamin K, eye prophylaxis, Hep B vaccine per guidance/consent. Monitor temperature, breathing, glucose risk.",
"Cord / circumcision|Keep cord clean/dry; report spreading redness, pus, fever. Circumcision: monitor bleeding and voiding; petroleum if appropriate; report persistent bleeding.",
"Feeding / newborn safety|Breastfeed 8-12 times/day; assess latch and output; formula exactly as directed. Supine sleep, firm flat surface, no loose bedding. Cleft palate: upright, specialty feeder, frequent burping.",
"High-risk newborn|Preterm &lt;37 weeks; postterm ≥42. IDM: hypoglycemia; hemolysis: jaundice; sepsis: temperature instability, poor feeding, lethargy, distress. Monitor withdrawal, congenital infection; support grieving families.",
"Growth / autism|Growth = quantitative; development = functional progression. Watch milestones and regression; autism: social communication differences, repetitive behaviors. Predictable routines, sensory accommodations.",
"Congenital heart disease|Cyanosis, feeding fatigue, tachypnea, poor growth; pulse ox screen and echo. Left-to-right shunts: pulmonary overcirculation; cyanotic defects reduce systemic O2. Ductus/foramen ovale normally close after birth.",
"Hydrocephalus|Excess CSF: rising head circumference, bulging fontanel, sunset eyes, vomiting. Shunt infection/malfunction: fever, lethargy, vomiting, neuro change = urgent.",
"Cerebral palsy|Nonprogressive brain injury causing motor/postural impairment; support mobility, feeding/swallowing, communication, therapy; monitor aspiration and seizures.",
"Neural tube defects|Spina bifida, anencephaly. Folic acid before conception lowers risk. Open myelomeningocele: prone, sterile moist nonadherent dressing, protect sac, infection precautions, assess bladder/bowel/hydrocephalus."]]
];
const MEDS=[
"Ondansetron|5-HT3 antiemetic for nausea/CINV. AE: QT prolongation, constipation. Monitor ECG risk.",
"Magnesium hydroxide|Antacid/osmotic laxative. AE: diarrhea; hypermagnesemia in renal impairment (avoid/caution).",

$('#rs').onclick=()=>{if(confirm('Reset all progress?')){S={done:{},known:{},scores:[]};save();prog();V.Progress()}}}
};
function mod(i){const m=M[i],a=$('#app'),c=COL[i];
a.innerHTML=`<button class="btn alt" onclick="go('Modules')">All modules</button><div class=card style="background:${c};margin-top:10px"><h2>Module ${i+1}: ${m[0]}</h2><label><input type=checkbox id=dn ${S.done[i]?'checked':''}> Mark module complete</label></div><div class=mt><b>Memory trick:</b> ${m[1]}</div>${m[3]?`<div class="card tw"><h3>Comparison chart</h3><table>${m[3].map((r,j)=>'<tr>'+r.map(x=>j?`<td>${x}</td>`:`<th>${x}</th>`).join('')+'</tr>').join('')}</table></div>`:''}<button class="btn alt" id=ea>Expand all</button> <button class=btn id=mq>Quiz this module</button><div id=rw>${IT.filter(z=>z.m==i).map(z=>`<details style="--c:${c}"><summary>${z.t}</summary><p>${z.x}</p></details>`).join('')}</div><div id=qa></div>`;
$('#dn').onchange=e=>{S.done[i]=e.target.checked;save();prog()};let o=0;$('#ea').onclick=()=>{o=!o;a.querySelectorAll('#rw details').forEach(d=>d.open=o)};
$('#mq').onclick=()=>{$('#rw').style.display='none';run(sh(qM(i)).slice(0,10),$('#qa'),'Module '+(i+1)+' quiz')};scrollTo(0,0)}
function prog(){const d=Object.values(S.done).filter(Boolean).length;$('#bar i').style.width=d*10+'%';$('#bt').textContent=d+' of 10 modules complete'}
function go(t){cur=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.textContent==t));V[t]();scrollTo(0,0)}
$('#nav').innerHTML=Object.keys(V).map(t=>`<button>${t}</button>`).join('');document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.textContent));
$('#q').oninput=e=>{const v=e.target.value.trim().toLowerCase();if(!v){go(cur);return}
const r=[...IT.map(z=>({...z,k:'Module '+(z.m+1),c:COL[z.m]})),...MD.map(z=>({...z,k:'Medication',c:'#ffd6e0'}))].filter(z=>(z.t+' '+z.x).toLowerCase().includes(v)).slice(0,40);
$('#app').innerHTML=`<h2>${r.length} result(s) for "${v}"</h2>`+r.map(z=>`<details open style="--c:${z.c}"><summary>${z.t} <span class=pill>${z.k}</span></summary><p>${z.x}</p></details>`).join('')};
prog();go('Modules');
</script></body></html>
