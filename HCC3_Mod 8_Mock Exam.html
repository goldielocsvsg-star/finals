n and continue monitoring"], "ans": 0, "topic": "fhr", "cj": "ta", "cats": ["prio", "emerg"], "why": "A sudden prolonged deceleration right after ROM suggests cord prolapse. The nurse's hand is already in place, so feeling for the cord, and lifting the presenting part off it if found, comes first while calling for help.", "wrong": "Removing the hand loses the chance to relieve compression. Waiting 10 minutes is unsafe. Prolonged decelerations need immediate action and notification.", "cues": "Timing: right after ROM.", "safety": "A prolonged deceleration lasting 2 to under 10 minutes needs the provider immediately.", "take": "Sudden FHR drop after ROM: think cord until proven otherwise.", "src": "FA slides 20, 27; CX slides 36-38; textbook pp. 93, 264", "hy": true, "id": "s18"}, {"t": "sata", "stem": "A woman in spontaneous labor (no oxytocin) has recurrent late decelerations with minimal variability. Which actions are appropriate? Select all that apply.", "opts": ["Turn her to a side-lying position", "Give an IV fluid bolus as ordered", "Check her BP for hypotension", "Notify the provider", "Start fetal scalp stimulation during a deceleration", "Place her supine to improve the tracing", "Tell her to begin pushing"], "ans": [0, 1, 2, 3], "topic": "fhr", "cj": "gs", "cats": ["prio"], "why": "Late decelerations mean uteroplacental insufficiency. Side-lying, IV fluids and correcting hypotension improve blood flow to the placenta. A Category II pattern with minimal variability needs provider notification.", "wrong": "Stimulation is only done at baseline. Supine positioning compresses the vena cava. Pushing is not appropriate before full dilation.", "cues": "Lates + minimal variability.", "safety": "If the tracing does not respond, prepare for expedited birth.", "take": "Lates: improve placental blood flow: side, fluids, BP, notify.", "src": "FA slides 24, 28; textbook pp. 91-92, 96", "hy": true, "id": "s19"}, {"t": "mc", "stem": "After interventions for a Category II tracing, the nurse performs scalp stimulation while the FHR is at baseline. Which result best shows the fetus is not acidemic?", "opts": ["An acceleration of 15 bpm for 15 seconds", "No change in the FHR or its variability", "A brief deceleration to 110 that recovers", "Minimal variability that continues unchanged"], "ans": 0, "topic": "fhr", "cj": "eo", "cats": ["eval", "assess"], "why": "An acceleration in response to scalp stimulation is reassuring; it suggests the fetus is not acidemic.", "wrong": "No response or continued minimal variability does not rule out acidemia and needs further evaluation.", "cues": "Acceleration after stimulation.", "safety": "Never stimulate during a deceleration.", "take": "Scalp stim + accel = reassuring.", "src": "FA slides 20, 29; textbook p. 98", "hy": false, "id": "s20"}, {"t": "mc", "stem": "A woman with a BMI of 48 is in active labor at 5 cm with ruptured membranes. The external monitor cannot trace the FHR or contractions consistently. What should the nurse anticipate?", "opts": ["Placement of a spiral electrode and an IUPC", "Switching to intermittent auscultation every 4 hours", "Moving the tocotransducer over the fetal back", "Stopping monitoring until the second stage"], "ans": 0, "topic": "fhr", "cj": "gs", "cats": ["assess"], "why": "Internal monitoring is used when external monitoring is inadequate. It requires ruptured membranes and enough dilation, which she has. Obese women often need internal monitoring because external tracing can be difficult.", "wrong": "Every 4 hours is far too infrequent in active labor. The toco belongs over the fundus. Monitoring cannot be stopped.", "cues": "ROM + 5 cm + external monitoring not working.", "safety": "An untraceable FHR in labor is a safety gap that must be closed.", "take": "External not working? Internal monitoring needs ROM and dilation.", "src": "FA slides 11, 12; CX slide 17; textbook pp. 83, 229-230", "hy": false, "id": "s21"}, {"t": "cloze", "stem": "Complete the comparison.", "text": "Gradual decreases that begin after the contraction starts, with the lowest point after its peak, are {0} decelerations. They reflect {1}. Gradual decreases that mirror the contraction are caused by {2} and require {3}.", "drops": [{"opts": ["late", "early", "variable", "prolonged"], "ans": 0}, {"opts": ["uteroplacental insufficiency", "head compression", "cord compression", "fetal sleep"], "ans": 0}, {"opts": ["head compression", "cord compression", "maternal fever", "uteroplacental insufficiency"], "ans": 0}, {"opts": ["no intervention", "amnioinfusion", "immediate cesarean birth", "stopping all fluids"], "ans": 0}], "topic": "fhr", "cj": "ac", "cats": ["assess"], "why": "Lates are delayed relative to the contraction and mean the placenta is not delivering enough oxygen. Early decels mirror the contraction because of head compression and are benign.", "wrong": "Amnioinfusion is for variables (cord compression), not early decelerations.", "cues": "Timing relative to the contraction peak.", "safety": "Mistaking lates for earlies delays treatment.", "take": "Early = mirror = head. Late = after = placenta.", "src": "FA slides 20, 22-24; textbook pp. 90-92", "hy": true, "id": "s22"}, {"t": "mc", "stem": "The nurse reviews four tracings. Which one requires immediate action?", "opts": ["Baseline 145, minimal variability, recurrent late decelerations", "Baseline 140, moderate variability, occasional variable decelerations", "Baseline 130, moderate variability, early decelerations", "Baseline 155, moderate variability, accelerations"], "ans": 0, "topic": "fhr", "cj": "ph", "cats": ["prio", "assess"], "why": "Minimal variability with recurrent lates suggests the fetus is losing its oxygen reserve. This is the only pattern that combines a sign of placental insufficiency with reduced variability.", "wrong": "Occasional variables with moderate variability, early decelerations and accelerations are all reassuring or low risk.", "cues": "Variability plus the type of deceleration.", "safety": "Falling variability with recurrent lates can progress to Category III.", "take": "Recurrent lates + falling variability = act now.", "src": "FA slides 14, 24, 28; textbook pp. 77, 92", "hy": true, "id": "s23"}, {"t": "mc", "stem": "A woman at 37 weeks arrives at a hospital where she has no provider, reporting contractions. The registration clerk asks for her insurance card before the nurse sees her. What should the nurse do?", "opts": ["Start her assessment now, before registration", "Wait until registration is complete to begin the exam", "Send her to the hospital where her own provider delivers", "Ask her to sign a payment waiver before the assessment"], "ans": 0, "topic": "care", "cj": "ta", "cats": ["prio"], "why": "EMTALA requires a woman with contractions to be assessed and stabilized regardless of ability to pay. She is presumed to be in true labor until a qualified provider says otherwise.", "wrong": "Delaying for payment, transferring before she is assessed and stabilized, or requiring waivers all violate EMTALA.", "cues": "Contractions + delay for payment.", "safety": "Nurses must know their EMTALA responsibilities and the agency's policies.", "take": "EMTALA: assess and stabilize first; payment never comes first.", "src": "NC slide 4; textbook p. 106", "hy": false, "id": "s24"}, {"t": "mc", "stem": "Four women arrive in triage at the same time. Which woman should the nurse see first?", "opts": ["38 weeks, water broke 10 min ago, feels something in her vagina", "40 weeks, irregular contractions every 10 minutes since last night", "39 weeks, mild cramping and pink mucus on the tissue this morning", "37 weeks, wants to know if she is in labor, contractions every 7 minutes"], "ans": 0, "topic": "care", "cj": "ph", "cats": ["prio", "emerg"], "why": "Rupture of membranes with a sensation of something in the vagina suggests cord prolapse, an emergency that threatens fetal oxygen supply within minutes.", "wrong": "The other women describe early or possible labor with no danger signs.", "cues": "ROM + something felt in the vagina.", "safety": "Triage tools like the Maternal Fetal Triage Index help sort urgency.", "take": "Triage the threat to oxygenation first.", "src": "NC slide 5; CX slides 36, 37; textbook pp. 107, 264", "hy": false, "id": "s25"}, {"t": "sata", "stem": "A woman's membranes rupture spontaneously at 4 cm with the fetus at -1 station. Which nursing actions are appropriate? Select all that apply.", "opts": ["Assess the FHR right away", "Document the time and the color, amount and odor of the fluid", "Take her temperature every 2 hours", "Change wet pads and linens to keep her clean and dry", "Perform a vaginal exam every hour to watch progress", "Insert a tampon to control the leaking"], "ans": [0, 1, 2, 3], "topic": "care", "cj": "ta", "cats": ["prio", "assess"], "why": "The FHR is checked first because the cord can prolapse. Time, color, amount and odor are documented. Temperature is checked every 2 hours after ROM because infection risk rises. Keeping her clean and dry adds comfort and reduces infection risk.", "wrong": "Hourly vaginal exams and tampons raise infection risk.", "cues": "ROM with the presenting part at -1.", "safety": "Limit vaginal exams after ROM.", "take": "ROM: FHR first, then document fluid and watch temperature.", "src": "NC slide 11; CX slide 41; textbook pp. 130-131", "hy": false, "id": "s26"}, {"t": "hl", "stem": "The baby was born 5 minutes ago. Highlight the findings that show the placenta is separating.", "segs": [{"x": "A sudden gush of dark blood from the vagina.", "k": 1}, {"x": " "}, {"x": "The cord lengthens at the introitus.", "k": 1}, {"x": " "}, {"x": "The uterus changes from oval to globular and rises.", "k": 1}, {"x": " "}, {"x": "She says she feels full in her vagina.", "k": 1}, {"x": " "}, {"x": "She is shaking with chills.", "k": 0}, {"x": " "}, {"x": "The newborn is crying on her chest.", "k": 0}, {"x": " "}, {"x": "BP 118/72, HR 84.", "k": 0}], "topic": "stages", "cj": "rc", "cats": ["assess"], "why": "Signs of placental separation are a firmly contracting fundus that becomes globular, a gush of dark blood, lengthening of the cord and a feeling of vaginal fullness.", "wrong": "Shaking chills are common right after birth and are not a separation sign; stable vitals and a crying newborn are expected.", "cues": "Gush, globe, cord lengthening, fullness.", "safety": "Never pull on the cord before these signs appear.", "take": "Placenta ready: Gush, Globe, Grow (the cord).", "src": "NC slides 21, 23; textbook p. 176", "hy": false, "id": "s27"}, {"t": "mc", "stem": "A woman at 10 cm, +2 station, holds her breath for 15 seconds with each push. The FHR dips after each long push and recovers slowly. What should the nurse do?", "opts": ["Coach open-glottis pushes of about 6 to 8 seconds", "Encourage longer breath holds so the baby descends faster", "Stop all pushing until the provider arrives to assess", "Turn her flat on her back for better leverage"], "ans": 0, "topic": "care", "cj": "ta", "cats": ["teach", "prio"], "why": "Long breath-hold (Valsalva) pushing lowers venous return and fetal oxygenation. Shorter, open-glottis pushes are better for the fetus.", "wrong": "Longer holds worsen the problem. Stopping pushing is not necessary when the fix is technique. Supine positioning reduces placental flow.", "cues": "FHR dips linked to long breath holds.", "safety": "Watch for decels that do not recover.", "take": "Push with an open glottis, short and repeated.", "src": "NC slide 16; LBP slide 34; textbook pp. 25-26, 158", "hy": false, "id": "s28"}, {"t": "mc", "stem": "One hour after birth, which finding requires the nurse's immediate intervention?", "opts": ["Saturating a pad in 15 minutes", "Shaking chills with a normal temperature", "Fundus firm at the umbilicus", "BP 112/70, HR 84"], "ans": 0, "topic": "stages", "cj": "ph", "cats": ["prio", "assess"], "why": "Saturating a pad in 15 minutes is heavy bleeding and needs immediate assessment of the fundus, bladder and source.", "wrong": "Chills, a firm fundus at the umbilicus and normal vitals are expected.", "cues": "Amount of bleeding over time.", "safety": "Hemorrhage is the main fourth-stage danger.", "take": "Heavy lochia in the fourth stage: act first, then document.", "src": "NC slides 22, 25; textbook pp. 178, 183", "hy": false, "id": "s29"}, {"t": "mc", "stem": "During a vaginal exam, a woman with a history of sexual abuse begins to shake and says, \"Please stop.\" What should the nurse do first?", "opts": ["Stop the exam right away and acknowledge her request", "Finish the exam quickly since it is almost done", "Tell her to relax because it will not hurt", "Ask her partner to hold her hand while the exam continues"], "ans": 0, "topic": "care", "cj": "ta", "cats": ["prio", "teach"], "why": "She has withdrawn consent. Stopping immediately restores her control. Then the nurse can explain, offer choices and ask permission before trying again.", "wrong": "Continuing ignores her request and can retraumatize her. Phrases like 'relax, it won't hurt' are triggering for abuse survivors.", "cues": "Distress + an explicit request to stop.", "safety": "Trauma-informed care means asking permission and giving her control.", "take": "'Stop' means stop. Then explain and ask before continuing.", "src": "NC slides 6, 10; textbook pp. 116, 128", "hy": false, "id": "s30"}, {"t": "mc", "stem": "The nurse teaches a woman at 29 weeks what to do if she has signs of preterm labor at home. Which statement shows understanding?", "opts": ["\"I'll void, lie on my side, drink water, and call if it lasts an hour.\"", "\"I'll wait until the cramps are painful before I worry about it.\"", "\"I'll take a long walk to see if the tightening goes away on its own.\"", "\"I'll only call if my water breaks.\""], "ans": 0, "topic": "comp", "cj": "eo", "cats": ["teach", "eval"], "why": "Stopping activity, lying on her side, hydrating and calling if symptoms continue after an hour matches the home plan for preterm labor signs.", "wrong": "Preterm contractions are often painless. Walking does not test for true labor at home. Waiting for ROM misses many preterm labors.", "cues": "Action steps plus a clear call threshold.", "safety": "Preterm labor symptoms are subtle and easy to dismiss.", "take": "Preterm signs at home: stop, side, hydrate, wait an hour, call.", "src": "CX slide 5; textbook p. 200", "hy": false, "id": "s31"}, {"t": "mc", "stem": "A woman receiving magnesium sulfate has a respiratory rate of 10, absent patellar reflexes and is very drowsy. What is the nurse's first action?", "opts": ["Stop the magnesium infusion", "Give calcium gluconate", "Notify the provider", "Increase the primary IV rate"], "ans": 0, "topic": "comp", "cj": "ta", "cats": ["med", "prio", "emerg"], "why": "These are signs of magnesium toxicity. Stopping the infusion removes the source first. Then notify the provider and give calcium gluconate, the antidote, as ordered.", "wrong": "Calcium gluconate is important but the drug must be stopped first. Increasing the IV rate does not treat toxicity.", "cues": "Respiratory depression + absent reflexes.", "safety": "Keep calcium gluconate available whenever magnesium is running.", "take": "Magnesium toxicity: stop it first, then antidote.", "src": "CX slide 6; textbook p. 205", "hy": true, "id": "s32"}, {"t": "matrix", "stem": "For each finding, indicate whether it describes hypertonic or hypotonic uterine dysfunction.", "cols": ["Hypertonic", "Hypotonic"], "rows": [{"r": "Occurs in the latent phase", "a": 0}, {"r": "Contractions become weak and infrequent in the active phase", "a": 1}, {"r": "Painful, frequent, uncoordinated contractions", "a": 0}, {"r": "Treated with therapeutic rest", "a": 0}, {"r": "Treated with amniotomy or oxytocin after CPD is ruled out", "a": 1}, {"r": "Uterus is easily indented at the peak of contractions", "a": 1}], "topic": "comp", "cj": "ac", "cats": ["assess"], "why": "Hypertonic dysfunction happens early (latent phase) with painful, poorly coordinated contractions and is treated with rest. Hypotonic dysfunction happens in the active phase with weak contractions and is treated with amniotomy or oxytocin once disproportion is ruled out.", "wrong": "Giving oxytocin for hypertonic dysfunction makes it worse.", "cues": "Phase of labor and treatment response.", "safety": "Rule out CPD before augmenting a hypotonic labor.", "take": "Hyper = hurts early, rest. Hypo = weak later, augment.", "src": "CX slides 11, 12; textbook pp. 220-222", "hy": false, "id": "s33"}, {"t": "mc", "stem": "A woman in active labor has had ruptured membranes and adequate contractions on an IUPC, but her cervix has stayed at 6 cm for several hours. How should the nurse interpret this, and what should the nurse anticipate?", "opts": ["An arrest of dilation; anticipate evaluation for cesarean birth", "A protraction disorder from weak contractions; anticipate oxytocin", "Hypertonic dysfunction; anticipate therapeutic rest", "Normal active labor; continue routine care"], "ans": 0, "topic": "comp", "cj": "ph", "cats": ["assess"], "why": "No progress despite adequate contractions is an arrest disorder, not a protraction disorder. Because the powers are already adequate, more oxytocin is not the answer, and the provider will evaluate for causes such as CPD and for cesarean birth.", "wrong": "Protraction means slower than normal progress, often from weak contractions. Hypertonic dysfunction is a latent-phase problem.", "cues": "Adequate contractions + no change.", "safety": "Continue to watch the FHR during a long labor.", "take": "Slow progress = protraction. No progress with adequate contractions = arrest.", "src": "CX slides 11, 13, 14; textbook pp. 221, 223", "hy": false, "id": "s34"}, {"t": "sata", "stem": "A woman with a BMI of 47 is admitted in labor. Which nursing actions should the nurse anticipate? Select all that apply.", "opts": ["Use correctly sized equipment such as a large BP cuff and bed", "Prepare for internal monitoring if external tracing is unreliable", "Plan an early anesthesia consult", "Monitor closely for postpartum hemorrhage", "Apply sequential compression devices if a cesarean is needed", "Avoid regional anesthesia because it is contraindicated with obesity", "Expect a lower chance of cesarean birth"], "ans": [0, 1, 2, 3, 4], "topic": "comp", "cj": "gs", "cats": ["prio", "assess"], "why": "Obese women need properly sized equipment, often need internal monitoring, benefit from early anesthesia planning, have higher risk of cesarean and postpartum hemorrhage, and are at risk for VTE.", "wrong": "Regional anesthesia is not contraindicated; early placement is often preferred. Obesity increases the cesarean rate.", "cues": "Equipment, monitoring, anesthesia, bleeding and clot risks.", "safety": "Finding the fundus for massage can be difficult, so watch bleeding closely.", "take": "Obesity in labor: plan equipment, monitoring and anesthesia early; expect more complications.", "src": "CX slide 17; textbook pp. 229-231", "hy": false, "id": "s35"}, {"t": "mc", "stem": "A woman at 42 1/7 weeks reports decreased fetal movement. Testing shows low amniotic fluid, and the monitor shows intermittent variable decelerations. What does the nurse anticipate?", "opts": ["Prompt notification and plans for birth", "Discharge home with kick counts and recheck in 1 week", "Tocolytic therapy to keep the uterus quiet until she is seen", "Waiting for spontaneous labor because she is not in labor"], "ans": 0, "topic": "comp", "cj": "ph", "cats": ["prio", "assess"], "why": "Postterm pregnancy raises the risk of oligohydramnios, which leads to cord compression and variable decels, and of an aging placenta. Decreased movement and low fluid mean the fetus is at risk and birth is planned.", "wrong": "Going home or waiting delays care for a fetus showing signs of compromise. Tocolytics are not indicated.", "cues": "Postterm + low fluid + decreased movement + variables.", "safety": "Decreased movement in a postterm pregnancy needs prompt evaluation.", "take": "Postterm: big baby, low fluid, aging placenta. Move toward birth.", "src": "CX slide 10; FA slide 25; textbook pp. 218-219", "hy": false, "id": "s36"}, {"t": "mc", "stem": "A woman at 39 weeks has had ruptured membranes for 2 hours without contractions. She is GBS positive. Which plan does the nurse anticipate?", "opts": ["IV antibiotics for GBS and induction of labor", "Discharge home until contractions start", "Digital cervical exams every hour to check for change", "Tocolytic therapy until 40 weeks"], "ans": 0, "topic": "comp", "cj": "gs", "cats": ["prio"], "why": "At term, PROM is usually managed by inducing labor because infection is the greatest risk. A GBS-positive woman needs intrapartum antibiotics.", "wrong": "Going home delays care. Frequent digital exams increase infection risk. Tocolytics have no role at term.", "cues": "Term PROM + GBS positive.", "safety": "Limit vaginal exams after ROM.", "take": "Term PROM: induce. GBS positive: antibiotics.", "src": "CX slides 7, 8; NC slide 11; textbook pp. 129, 214-215", "hy": false, "id": "s37"}, {"t": "mc", "stem": "The provider performs an amniotomy at 3 cm with the fetus at -2 station. The fluid is clear. What is the nurse's priority?", "opts": ["Assess the FHR", "Change the underpads", "Document the color of the fluid", "Take her temperature"], "ans": 0, "topic": "proc", "cj": "ta", "cats": ["prio"], "why": "With a high presenting part, the cord can slip down when the membranes are ruptured. Assessing the FHR right away detects cord compression.", "wrong": "Pads, documentation and temperature all follow the FHR check.", "cues": "Station -2 = room for the cord to slip.", "safety": "Check the FHR before and right after amniotomy.", "take": "After any ROM: FHR first.", "src": "CX slide 41; textbook pp. 239-240", "hy": true, "id": "s38"}, {"t": "sata", "stem": "A woman at 37 weeks is scheduled for external cephalic version for a breech fetus. Which nursing actions are appropriate? Select all that apply.", "opts": ["Monitor the FHR before and after the procedure", "Confirm fetal position by ultrasound before starting", "Give a tocolytic as ordered to relax the uterus", "Give Rh immune globulin after the procedure if she is Rh-negative", "Watch for bleeding, ROM and contractions afterward", "Start oxytocin right after the version to keep the fetus vertex"], "ans": [0, 1, 2, 3, 4], "topic": "proc", "cj": "gs", "cats": ["prio", "assess"], "why": "ECV needs FHR monitoring before and after, ultrasound to confirm position, often a tocolytic, and RhIG for Rh-negative women because fetal blood can mix with maternal blood. Afterward, watch for bleeding, ROM and contractions.", "wrong": "Oxytocin is not used to hold the fetus in position.", "cues": "Breech at 37 weeks; procedure risks.", "safety": "Abruption and fetal compromise are possible complications.", "take": "ECV: confirm, relax, monitor, RhIG if needed.", "src": "CX slides 18, 19; textbook pp. 231-232", "hy": false, "id": "s39"}, {"t": "mc", "stem": "A woman has a dinoprostone vaginal insert for cervical ripening. Three hours later she has 7 contractions in 10 minutes and recurrent late decelerations. What should the nurse do first?", "opts": ["Remove the insert", "Start oxytocin", "Give a second dose", "Document and recheck in 1 hour"], "ans": 0, "topic": "oxy", "cj": "ta", "cats": ["med", "prio"], "why": "The dinoprostone insert is designed to be removed if tachysystole or an abnormal FHR occurs. Removing it stops more medication from being absorbed. Then position, fluids and notify.", "wrong": "Oxytocin or more prostaglandin would worsen tachysystole. Waiting is unsafe with lates.", "cues": "Tachysystole + lates after a prostaglandin.", "safety": "Gel forms cannot be removed, which is one reason the insert is used.", "take": "Prostaglandin + tachysystole: take out the insert first.", "src": "CX slide 20; textbook pp. 236-237", "hy": true, "id": "s40"}, {"t": "cloze", "stem": "Complete the nurse's analysis of two patients.", "text": "Woman A is at 41 weeks with no contractions; oxytocin for her is {0}. Woman B is in spontaneous labor that slowed because of weak contractions; oxytocin for her is {1}. Before starting it for Woman B, the provider must rule out {2}.", "drops": [{"opts": ["induction", "augmentation", "tocolysis", "cervical ripening"], "ans": 0}, {"opts": ["augmentation", "induction", "tocolysis", "version"], "ans": 0}, {"opts": ["cephalopelvic disproportion", "maternal fever", "a reactive NST", "GBS colonization"], "ans": 0}], "topic": "oxy", "cj": "ac", "cats": ["med"], "why": "Induction starts labor that has not begun; augmentation stimulates contractions after labor has started but is not progressing. Augmenting when the baby cannot fit through the pelvis risks rupture and fetal harm, so CPD is ruled out first.", "wrong": "Tocolysis stops contractions and cervical ripening softens the cervix before induction.", "cues": "Has labor started or not?", "safety": "Oxytocin is a high-alert medication in both uses.", "take": "Induction starts labor; augmentation boosts it.", "src": "CX slides 12, 21, 23; textbook pp. 222, 241", "hy": true, "id": "s41"}, {"t": "mc", "stem": "The provider requests a vacuum to assist the birth. The nurse notes: cervix 9 cm, station +2, membranes ruptured, bladder emptied 20 minutes ago. What should the nurse do?", "opts": ["Question it: the cervix is not fully dilated", "Prepare the vacuum since all requirements are met", "Apply fundal pressure with each pull to help the vacuum", "Catheterize her again before the vacuum is applied"], "ans": 0, "topic": "proc", "cj": "ph", "cats": ["prio", "assess"], "why": "Operative vaginal birth needs a fully dilated cervix, ruptured membranes, an engaged head, an empty bladder and no CPD. A cervix at 9 cm does not meet the criteria.", "wrong": "Not all requirements are met. Fundal pressure is not used. The bladder was already emptied.", "cues": "9 cm is not 10 cm.", "safety": "Advocate and use the chain of command if a requirement is not met.", "take": "Forceps or vacuum: fully dilated, ruptured, engaged, empty bladder, no CPD.", "src": "CX slide 23; textbook pp. 245-246", "hy": false, "id": "s42"}, {"t": "mc", "stem": "A newborn was born by vacuum-assisted birth 6 hours ago. Which finding should the nurse report right away?", "opts": ["Increasing lethargy, irritability and poor feeding", "Soft swelling of the scalp where the vacuum cup was placed", "Bluish hands and feet with pink lips and trunk", "Mild molding of the head that rounds out by day 3"], "ans": 0, "topic": "proc", "cj": "rc", "cats": ["assess", "emerg"], "why": "After a vacuum birth, the newborn is watched for signs of cerebral irritation such as lethargy, irritability, seizures or poor feeding, which can mean intracranial bleeding.", "wrong": "Swelling under the cup (caput), acrocyanosis and mild molding are expected.", "cues": "Neurologic change after an operative birth.", "safety": "Tell the newborn team the birth was vacuum assisted.", "take": "After a vacuum: swelling is expected; neuro changes are not.", "src": "CX slides 25, 26; textbook pp. 246-247", "hy": false, "id": "s43"}, {"t": "mc", "stem": "A woman is scheduled for a cesarean. Which order should the nurse question?", "opts": ["Position her supine on the OR table, no wedge", "Give an oral antacid shortly before surgery", "Insert an indwelling urinary catheter", "Give the prophylactic antibiotic before the skin incision"], "ans": 0, "topic": "proc", "cj": "ta", "cats": ["prio"], "why": "Lying flat compresses the vena cava and aorta, causing hypotension and decreased placental flow. A wedge under one hip is used.", "wrong": "An antacid reduces aspiration injury, a catheter keeps the bladder empty, and antibiotics before the incision prevent infection.", "cues": "Supine without displacement.", "safety": "Lateral uterine displacement protects maternal BP and fetal oxygenation.", "take": "Pre-cesarean: antacid, Foley, antibiotics, and always a hip wedge.", "src": "CX slide 30; NC slide 8; textbook pp. 252-253", "hy": false, "id": "s44"}, {"t": "order", "stem": "The fetal head delivers and then retracts against the perineum. Place the nurse's actions in the correct order.", "items": ["Call for help and note the time", "Help the woman into the McRoberts position", "Apply suprapubic pressure as directed", "Help her into a hands-and-knees position if the shoulder is still stuck"], "topic": "emerg", "cj": "ta", "cats": ["emerg", "prio"], "why": "The turtle sign means shoulder dystocia. Extra hands are needed first and the time is tracked. McRoberts flattens the sacrum, suprapubic pressure dislodges the anterior shoulder, and hands-and-knees is the next option if those fail.", "wrong": "Fundal pressure is never used because it wedges the shoulder further.", "cues": "Turtle sign.", "safety": "Watch the newborn for brachial plexus injury and the mother for hemorrhage.", "take": "Shoulder dystocia: help, McRoberts, suprapubic pressure, then all fours. Never fundal pressure.", "src": "CX slide 35; textbook pp. 262-263", "hy": true, "id": "s45"}, {"t": "bow", "stem": "At 5 cm, a woman's membranes rupture. The FHR falls to 80 and the nurse sees a loop of cord at the vaginal opening. Complete the bow-tie.", "cond": {"opts": ["Prolapsed umbilical cord", "Uterine rupture", "Placental abruption", "Early decelerations"], "ans": [0]}, "acts": {"opts": ["Lift the presenting part off the cord with gloved fingers", "Place her in knee-chest or Trendelenburg position", "Gently push the cord back into the vagina", "Raise the head of the bed to high Fowler position", "Coach her to push with the next contraction"], "ans": [0, 1]}, "mons": {"opts": ["Fetal heart rate", "Exposed cord kept warm and moist", "Deep tendon reflexes", "Fundal height", "Urine output"], "ans": [0, 1]}, "topic": "emerg", "cj": "ph", "cats": ["emerg", "prio"], "why": "A visible cord after ROM with fetal bradycardia is cord prolapse. Lifting the presenting part and using gravity (knee-chest or Trendelenburg) take pressure off the cord. The FHR shows if it is working, and an exposed cord is covered with warm saline to prevent spasm.", "wrong": "Pushing the cord back, high Fowler and pushing all worsen compression.", "cues": "Cord visible + FHR drop.", "safety": "Call for help, do not leave, and prepare for immediate birth.", "take": "Cord prolapse: Lift, Lower her head, Leave the cord in place.", "src": "CX slides 36-38; textbook pp. 264-265", "hy": true, "id": "s46"}, {"t": "mc", "stem": "During the second stage, a woman suddenly becomes short of breath with SpO2 82%, BP 70/40, and then becomes unresponsive with no pulse. What should the nurse do first?", "opts": ["Call a code; start CPR with left uterine displacement", "Give oxygen by nasal cannula and recheck in 5 minutes", "Turn her flat and start a wide-open fluid bolus first", "Notify the provider and prepare for a vacuum birth"], "ans": 0, "topic": "emerg", "cj": "ta", "cats": ["emerg", "prio"], "why": "Sudden respiratory distress, hypotension and collapse suggest amniotic fluid embolism. With no pulse, CPR starts right away, with the uterus pushed to the left so chest compressions can circulate blood.", "wrong": "Nasal cannula oxygen and waiting are inadequate. Fluids alone do not treat arrest. A vacuum birth is not the first step in cardiac arrest.", "cues": "Sudden hypoxia, hypotension, collapse.", "safety": "AFE also causes coagulopathy; prepare blood products.", "take": "AFE: everything fails at once. Start CPR with uterine displacement.", "src": "CX slide 40; textbook p. 267", "hy": true, "id": "s47"}, {"t": "mc", "stem": "Membranes rupture at 7 cm and the fluid is thick and green. The FHR is Category I. What should the nurse do?", "opts": ["Notify the provider; have the newborn resuscitation team at the birth", "Prepare for an immediate cesarean birth", "Start oxytocin to shorten labor and limit meconium exposure", "Document the finding and continue routine monitoring"], "ans": 0, "topic": "emerg", "cj": "gs", "cats": ["emerg", "prio"], "why": "Meconium-stained fluid puts the newborn at risk for meconium aspiration syndrome, so a team skilled in newborn resuscitation must be present at birth.", "wrong": "A cesarean is not indicated with a Category I tracing. Oxytocin does not address the risk. Documentation alone is not enough.", "cues": "Thick green fluid.", "safety": "Meconium can reflect hypoxia, so keep watching the FHR.", "take": "Meconium: notify and have the newborn team ready.", "src": "CX slide 34; textbook pp. 260-261", "hy": false, "id": "s48"}], "cases": [{"id": "c1", "title": "Labor progression with a changing FHR", "scenario": "Jasmine Carter is admitted in spontaneous labor. Follow her from admission through the fourth stage.", "banner": ["Jasmine Carter, 26", "G2 P1001", "39 3/7 weeks", "Allergies: NKDA", "O positive, rubella immune", "GBS negative"], "history": ["Uncomplicated prenatal course; previous spontaneous vaginal birth 3 years ago, 7 lb 2 oz.", "No chronic conditions. Prenatal vitamins only.", "Birth plan: wants to move freely; open to an epidural later."], "orders": ["Admit to L&D", "Continuous EFM", "IV lactated Ringer's 125 mL/h", "Clear liquids", "Labs: CBC, type and screen"], "labs": ["Hgb 11.9 g/dL", "Plt 214,000/mm3"], "flow": [["0800", "118/72", "82", "98.8", "16 / 99%", "135, moderate variability, accels", "q4 min, 60 s, moderate", "5 / 80% / -1"]], "notes": [["0800", "SROM at 0730 at home, clear fluid. Reports contractions in low back radiating to lower abdomen and thighs. Pink mucus on pad."]]}, {"id": "c2", "title": "Oxytocin induction and tachysystole", "scenario": "Priya Shah is admitted for induction of labor. Follow her through oxytocin titration and a change in uterine activity.", "banner": ["Priya Shah, 31", "G1 P0", "41 2/7 weeks", "Allergies: penicillin (rash)", "A positive", "GBS negative"], "history": ["Uncomplicated pregnancy. BMI 27.", "Cervical ripening with a balloon catheter last night; catheter fell out at 0500.", "Induction indication: late-term pregnancy."], "orders": ["Oxytocin per protocol: start 2 milliunits/min, increase 1-2 milliunits/min no more often than every 30 min", "Continuous EFM", "IV LR 125 mL/h primary line", "Notify provider for tachysystole or Category II/III tracing"], "labs": ["Hgb 12.4 g/dL"], "flow": [["0700", "116/74", "78", "98.4", "16 / 99%", "145, moderate var, accels", "irregular, mild", "3 / 60% / -2, Bishop 8"]], "notes": [["0700", "Balloon catheter expelled at 0500. Cervix 3 cm, 60%, -2, soft, midposition. Vertex confirmed by Leopold maneuvers."]]}, {"id": "c3", "title": "Preterm labor, pPROM and infection", "scenario": "Lena Nguyen comes to triage reporting pelvic pressure and wet underwear. Follow her through diagnosis, treatment and a change in condition.", "banner": ["Lena Nguyen, 22", "G3 P1102", "31 2/7 weeks", "Allergies: NKDA", "B positive", "GBS unknown"], "history": ["Spontaneous preterm birth at 33 weeks two years ago.", "Treated for a urinary tract infection at 28 weeks.", "Smokes half a pack per day.", "Prenatal vitamins."], "orders": ["Triage assessment", "Sterile speculum exam (provider)", "Continuous EFM and tocodynamometer", "IV LR 125 mL/h"], "labs": ["Urinalysis: negative for nitrites", "WBC 11,200/mm3"], "flow": [["1400", "112/68", "92", "98.6", "18 / 99%", "145, moderate var, accels", "q8-10 min, 30-40 s, mild", "deferred"]], "notes": [["1400", "Reports dull low backache and pelvic pressure since this morning, increased watery discharge, and tightening every 10 minutes that is not painful."]]}, {"id": "c4", "title": "Epidural analgesia and hypotension", "scenario": "Grace Kim is in active labor and requests an epidural. Follow her through placement, a complication and the second stage.", "banner": ["Grace Kim, 28", "G1 P0", "39 1/7 weeks", "Allergies: NKDA", "O negative (RhIG at 28 weeks)", "GBS negative"], "history": ["Uncomplicated pregnancy.", "Spontaneous labor began at 0200.", "Has been using breathing and the birthing ball."], "orders": ["Epidural per anesthesia", "IV LR bolus 500-1000 mL before epidural", "Continuous EFM", "Ephedrine or phenylephrine IV per anesthesia for hypotension"], "labs": ["Plt 198,000/mm3", "Hgb 12.1 g/dL"], "flow": [["0900", "122/76", "84", "98.6", "18 / 99%", "140, moderate var, accels", "q3 min, 60 s, strong", "5 / 90% / -1"]], "notes": [["0900", "Rates pain 8/10. Requests epidural. Anesthesia notified."]]}, {"id": "c5", "title": "Trial of labor after cesarean", "scenario": "Danielle Brooks is in spontaneous labor and planning a vaginal birth after cesarean. Follow her through the trial of labor and a sudden change.", "banner": ["Danielle Brooks, 34", "G2 P1001", "39 4/7 weeks", "Allergies: latex", "AB positive", "GBS negative"], "history": ["Cesarean 3 years ago for frank breech.", "Operative report requested from previous hospital.", "No other surgeries. BMI 29."], "orders": ["Continuous EFM", "IV LR 125 mL/h", "Type and screen", "Anesthesia aware of TOLAC", "Epidural on request"], "labs": ["Hgb 12.0 g/dL", "Type and screen complete"], "flow": [["1000", "120/76", "80", "98.4", "16 / 99%", "135, moderate var, accels", "q4 min, 60 s, moderate", "4 / 80% / -1"]], "notes": [["1000", "Arrived in spontaneous labor. Wants to attempt VBAC. Low transverse skin scar noted."]]}], "topics": {"process": "Labor process and Five P's", "stages": "Stages of labor", "adapt": "Maternal-fetal adaptations", "comfort": "Comfort measures and analgesia", "fhr": "FHR monitoring", "care": "Nursing care during labor", "comp": "Labor complications", "proc": "Obstetric procedures", "oxy": "Oxytocin and induction", "emerg": "Obstetric emergencies"}, "cj": {"rc": "Recognize Cues", "ac": "Analyze Cues", "ph": "Prioritize Hypotheses", "gs": "Generate Solutions", "ta": "Take Action", "eo": "Evaluate Outcomes"}, "cats": {"prio": "Priority nursing interventions", "assess": "Maternal-fetal assessment", "med": "Medication safety", "teach": "Patient teaching", "eval": "Evaluation of interventions", "emerg": "Emergency recognition"}};</script>
<script>(function () {

var TYPE = { mc: "Multiple choice", sata: "Select all that apply", cloze: "Drop-down (cloze)", hl: "Highlight", matrix: "Matrix", bow: "Bow-tie", order: "Ordered response" };

function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pct(e, m) { return m ? Math.round(100 * e / m) : 0; }
function fmtT(s) { s = Math.max(0, Math.round(s)); var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ":" + (m < 10 ? "0" : "") : "") + m + ":" + (x < 10 ? "0" : "") + x; }
function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

function caseItems(cid) { return ITEMS.filter(function (it) { return it.case === cid; }); }
function standalone() { return ITEMS.filter(function (it) { return !it.case; }); }

function makeOrders(ids) {

    case "hl": var tg = []; it.segs.forEach(function (s, i) { if (s.k === 1) tg.push(i); }); m = tg.length;

    nav += '<button class="btn" id="next">' + (ses.i + 1 < n ? "Next question &rarr;" : "See my results") + "</button>";
  }
  nav += '<button class="btn quiet" id="quit">Save and exit</button>';
  $("#qnav").innerHTML = nav;
  if (done && fb) $("#ratbox").innerHTML = rationale(it, score(it, ses.resp[it.id]));
  if (it.case && !fb) $("#qnav").insertAdjacentHTML("beforeend", '<div class="small">Case questions lock once you move past them, just like an unfolding NGN case.</div>');
  // wire
  $("#flag").addEventListener("click", function () { ses.flags[it.id] = !ses.flags[it.id]; save(); qScreen(); });
  $("#hlb").addEventListener("click", function () { setHL(!hlMode); });
  $("#hlc").addEventListener("click", function () { $$("mark.mine").forEach(function (m) { m.replaceWith.apply(m, Array.prototype.slice.call(m.childNodes)); }); });
  $("#quit").addEventListener("click", function () { save(); location.hash = "#home"; });
  var nx = $("#next"), pv = $("#prev"), sb = $("#sub"), rv = $("#rev");
  if (sb) sb.addEventListener("click", function () {
    if (!complete(it, ses.resp[it.id]) && !confirm("Some parts are not answered. Submit anyway?")) return;
    ses.done[it.id] = true; ses.locked[it.id] = true; record(it.id, score(it, ses.resp[it.id])); save(); qScreen();
    var rb = $("#ratbox"); if (rb && rb.scrollIntoView) rb.scrollIntoView({ behavior: "auto", block: "start" });
  });
  if (nx) nx.addEventListener("click", function () {
    if (!fb && !answered(it, ses.resp[it.id]) && !confirm("You have not answered this question. Move on anyway?")) return;
    if (it.case && !fb) ses.locked[it.id] = true;
    ses.i++; save(); if (ses.i >= n) { if (fb) finish(); else review(); } else { qScreen(); window.scrollTo(0, 0); }
  });
  if (pv) pv.addEventListener("click", function () { ses.i--; save(); qScreen(); window.scrollTo(0, 0); });
  if (rv) rv.addEventListener("click", review);
  runTimer();
}
function record(id, sc) { var h = S.hist[id] || []; h.push(pct(sc[0], sc[1])); if (h.length > 20) h.shift(); S.hist[id] = h; }

function review() {
  var ses = S.ses; if (!ses) return home();
  var h = '<section class="card"><h1>Final review</h1><p class="small">Select a question to return to it. Locked case questions cannot be changed. Flagged and unanswered questions are marked.</p><div class="grid">';
  var un = 0, fl = 0;
  ses.ids.forEach(function (id, k) {
    var it = BY[id], a = answered(it, ses.resp[id]); if (!a) un++; if (ses.flags[id]) fl++;
    h += '<button class="gq' + (a ? " a" : "") + (ses.flags[id] ? " f" : "") + (ses.locked[id] ? " l" : "") + '" data-k="' + k + '" title="' + (ses.locked[id] ? "Locked" : "") + '">' + (k + 1) + (ses.flags[id] ? "<i>&#9873;</i>" : "") + (ses.locked[id] ? "<i>&#128274;</i>" : "") + "</button>";
  });
  h += '</div><p><b>' + (ses.ids.length - un) + "</b> answered &middot; <b>" + un + "</b> unanswered &middot; <b>" + fl + '</b> flagged</p><div class="legend"><span class="gq a">1</span> answered <span class="gq">2</span> unanswered <span class="gq f">3<i>&#9873;</i></span> flagged <span class="gq l">4<i>&#128274;</i></span> locked</div><button class="btn big" id="fin">Submit exam for scoring</button> <button class="btn ghost" id="back">Back to question ' + Math.min(ses.i + 1, ses.ids.length) + "</button></section>";
  app.innerHTML = h;
  $$(".gq[data-k]").forEach(function (b) { b.addEventListener("click", function () { var k = +b.getAttribute("data-k"); if (ses.locked[ses.ids[k]]) { toast("That case question is locked"); return; } ses.i = k; save(); location.hash = "#q"; qScreen(); }); });
  $("#fin").addEventListener("click", function () { if (un && !confirm(un + " question(s) are unanswered and will score 0. Submit?")) return; finish(); });
  $("#back").addEventListener("click", function () { ses.i = Math.min(ses.i, ses.ids.length - 1); save(); location.hash = "#q"; qScreen(); });
}

// ---------------- results ----------------
function finish(timeUp) {
  var ses = S.ses; if (!ses) return;
  if (tick) { clearInterval(tick); tick = null; }
  var res = {};
  ses.ids.forEach(function (id) { var sc = score(BY[id], ses.resp[id]); res[id] = sc; if (!ses.fb) record(id, sc); });
  var att = { d: new Date().toISOString(), mode: ses.mode, label: ses.label, ids: ses.ids, res: res, resp: ses.resp, ord: ses.ord, time: Math.round(ses.el), timeUp: !!timeUp };
  S.attempts.push(att); if (S.attempts.length > 15) S.attempts.shift();
  S.ses = null; save(); location.hash = "#results"; results(S.attempts.length - 1);
}
function allResults() { var r = {}; for (var id in S.hist) { var h = S.hist[id]; if (h.length && BY[id]) r[id] = h[h.length - 1]; } return r; }
function stats(rp) {
  // rp: {id: pct} or {id:[e,m]}
  var acc = { topic: {}, cj: {}, cat: {}, type: {} };
  for (var id in rp) {
    var it = BY[id], v = rp[id], e, m; if (!it) continue;
    if (v instanceof Array) { e = v[0]; m = v[1]; } else { e = v / 100; m = 1; }
    var add = function (g, k) { var o = acc[g][k] = acc[g][k] || { key: k, e: 0, m: 0, n: 0 }; o.e += e; o.m += m; o.n++; };
    add("topic", it.topic); add("cj", it.cj); add("type", it.t); it.cats.forEach(function (c) { add("cat", c); });
  }
  var out = {};
  for (var g in acc) out[g] = Object.keys(acc[g]).map(function (k) { var o = acc[g][k]; o.p = o.m ? 100 * o.e / o.m : 0; return o; });
  return out;
}
function bars(list, names, order) {
  var h = '<div class="bars">';
  (order || Object.keys(names)).forEach(function (k) {
    var o = list.filter(function (x) { return x.key === k; })[0];
    if (!o) { h += '<div class="bar dim"><span class="bl">' + names[k] + '</span><span class="bt"></span><span class="bv">no items</span></div>'; return; }
    var p = Math.round(o.p);
    h += '<div class="bar"><span class="bl">' + names[k] + ' <small>(' + o.n + " item" + (o.n > 1 ? "s" : "") + ")</small></span><span class=\"bt\"><i class=\"" + (p >= 80 ? "g" : p >= 65 ? "y" : "r") + '" style="width:' + p + '%"></i></span><span class="bv">' + p + "%</span></div>";
  });
  return h + "</div>";
}
function results(ai) {
  var att = S.attempts[ai]; if (!att) return home();
  var ids = att.ids, E = 0, M = 0, full = 0, part = 0, zero = 0, ans = 0;
  ids.forEach(function (id) { var sc = att.res[id]; E += sc[0]; M += sc[1]; var p = pct(sc[0], sc[1]); if (p === 100) full++; else if (p > 0) part++; else zero++; if (answered(BY[id], att.resp[id])) ans++; });
  var st = stats(att.res);
  var TN = {}; Object.keys(TYPE).forEach(function (k) { TN[k] = TYPE[k]; });
  var h = '<section class="card"><div class="kick">' + esc(att.label) + " &middot; " + new Date(att.d).toLocaleString() + "</div><h1>Performance report</h1>";
  h += '<div class="kpis"><div><b>' + pct(E, M) + "%</b><span>Overall score</span></div><div><b>" + Math.round(E * 10) / 10 + " / " + M + "</b><span>Points earned / possible</span></div><div><b>" + ans + " / " + ids.length + "</b><span>Questions completed</span></div><div><b>" + full + "</b><span>Fully correct</span></div><div><b>" + part + "</b><span>Partial credit</span></div><div><b>" + zero + "</b><span>No credit</span></div><div><b>" + fmtT(att.time) + "</b><span>Time spent" + (att.timeUp ? " (time ran out)" : "") + "</span></div></div>";
  h += '<p class="small">Overall % = total points earned &divide; total points possible &times; 100. This is practice scoring modeled on NGN partial-credit rules, not the official NCLEX algorithm.</p></section>';
  h += '<section class="card"><h2>Clinical judgment (NCJMM) performance</h2>' + bars(st.cj, X.cj, ["rc", "ac", "ph", "gs", "ta", "eo"]) + "</section>";
  h += '<section class="card"><h2>Module 8 topic performance</h2>' + bars(st.topic, X.topics) + "</section>";
  h += '<section class="card"><h2>Additional categories</h2>' + bars(st.cat, X.cats) + '<h3>By question type</h3>' + bars(st.type, TN) + "</section>";
  // remediation
  var MIN = 3;
  var weakT = st.topic.filter(function (x) { return x.n >= MIN && x.p < 100; }).sort(function (a, b) { return a.p - b.p; }).slice(0, 3);
  var weakC = st.cj.filter(function (x) { return x.n >= MIN && x.p < 100; }).sort(function (a, b) { return a.p - b.p; }).slice(0, 3);
  var weakTy = st.type.filter(function (x) { return x.n >= 2 && x.p < 80; }).sort(function (a, b) { return a.p - b.p; }).slice(0, 3);
  var missed = ids.filter(function (id) { return pct(att.res[id][0], att.res[id][1]) < 100; });
  h += '<section class="card rem"><h2>&#129658; Personalized remediation report</h2>';
  h += "<p class=\"small\">A topic or skill is listed only if at least " + MIN + " items contributed to it. Item counts are shown in parentheses.</p>";
  h += "<h3>1. Weakest blueprint topics</h3>" + (weakT.length ? "<ul>" + weakT.map(function (x) { return "<li><b>" + X.topics[x.key] + "</b>: " + Math.round(x.p) + "% (" + x.n + ' items) <button class="btn sm ghost rt" data-topic="' + x.key + '">Retest this topic</button></li>'; }).join("") + "</ul>" : "<p>No weak topics with enough items. &#127881;</p>");
  h += "<h3>2. Weakest clinical judgment skills</h3>" + (weakC.length ? "<ul>" + weakC.map(function (x) { return "<li><b>" + X.cj[x.key] + "</b>: " + Math.round(x.p) + "% (" + x.n + ' items) <button class="btn sm ghost rt" data-cj="' + x.key + '">Retest this skill</button></li>'; }).join("") + "</ul>" : "<p>No weak skills with enough items.</p>");
  h += "<h3>3. Question types causing difficulty</h3>" + (weakTy.length ? "<ul>" + weakTy.map(function (x) { return "<li><b>" + TYPE[x.key] + "</b>: " + Math.round(x.p) + "% (" + x.n + " items)</li>"; }).join("") + "</ul>" : "<p>No question type below 80% with at least 2 items.</p>");
  h += "<h3>4. Clinical distinctions you missed</h3>" + (missed.length ? "<ul>" + missed.slice(0, 10).map(function (id) { return "<li>" + BY[id].take + "</li>"; }).join("") + "</ul>" : "<p>None this time.</p>");
  h += "<h3>5. High-priority concepts to review</h3>" + (weakT.length ? "<ul>" + weakT.map(function (x) { var s = missed.filter(function (id) { return BY[id].topic === x.key; }).map(function (id) { return BY[id].src; }); return "<li><b>" + X.topics[x.key] + ":</b> review " + (s.length ? s.filter(function (v, i) { return s.indexOf(v) === i; }).slice(0, 3).join("; ") : "the related slides") + "</li>"; }).join("") + "</ul>" : "<p>Keep reviewing mixed practice.</p>");
  var steps = [];
  if (missed.length) steps.push("Run <b>Weak Areas mode</b> to retest the " + missed.length + " question" + (missed.length > 1 ? "s" : "") + " you did not get full credit on.");
  if (weakT[0]) steps.push("Retest <b>" + X.topics[weakT[0].key] + "</b> in Learn style and read every rationale.");
  if (weakC[0]) steps.push("For <b>" + X.cj[weakC[0].key] + "</b> items, slow down: " + ({ rc: "list every abnormal finding before choosing", ac: "say what each finding means before acting", ph: "ask which problem kills first", gs: "match each action to the cause", ta: "pick the action that fixes the cause fastest and safest", eo: "compare the same findings before and after" })[weakC[0].key] + ".");
  if (weakTy[0]) steps.push("Practice more <b>" + TYPE[weakTy[0].key] + "</b> items; review how they are scored on the home screen.");
  steps.push("Take the Comprehensive Exam again in a few days and compare scores.");
  h += "<h3>6. Recommended next steps</h3><ol>" + steps.map(function (s) { return "<li>" + s + "</li>"; }).join("") + "</ol>";
  h += '<div class="btnrow"><button class="btn" id="rwk">Retest all missed questions</button> <a class="btn ghost" href="#home">Home</a></div></section>';
  // missed by weak topic
  if (missed.length) {
    h += '<section class="card"><h2>Missed questions with rationales</h2>';
    var groups = {}; missed.forEach(function (id) { (groups[BY[id].topic] = groups[BY[id].topic] || []).push(id); });
    Object.keys(groups).forEach(function (t) {
      h += "<h3>" + X.topics[t] + ' <button class="btn sm ghost rt" data-topic="' + t + '">Retest</button></h3>';
      groups[t].forEach(function (id) { h += itemReview(att, id); });
    });
    h += "</section>";
  }
  h += '<section class="card"><details><summary class="btn ghost">Show every question with rationale</summary>' + ids.map(function (id) { return itemReview(att, id); }).join("") + "</details></section>";
  app.innerHTML = h;
  $$(".rt").forEach(function (b) { b.addEventListener("click", function () {
    var t = b.getAttribute("data-topic"), c = b.getAttribute("data-cj");
    var list = ITEMS.filter(function (it) { return t ? it.topic === t : it.cj === c; }).map(function (it) { return it.id; });
    start("topic", orderCases(list), { label: "Retest: " + (t ? X.topics[t] : X.cj[c]) });
  }); });
  $("#rwk").addEventListener("click", function () { start("weak", orderCases(missed), { label: "Retest missed questions" }); });
  $$(".irv").forEach(function (d) { d.addEventListener("toggle", function () { if (d.open && !d.getAttribute("data-r")) { d.setAttribute("data-r", 1); var id = d.getAttribute("data-id"); renderItem($(".irq", d), BY[id], { resp: att.resp, ord: att.ord }, true); } }); });
}
function itemReview(att, id) {
  var it = BY[id], sc = att.res[id], p = pct(sc[0], sc[1]);
  return '<details class="irv" data-id="' + id + '"><summary><span class="pill ' + (p === 100 ? "ok" : p > 0 ? "part" : "no") + '">' + p + "%</span> " + (it.case ? "<small>Case: " + esc(CASEBY[it.case].title) + "</small> " : "") + strip(it.stem).slice(0, 140) + '</summary><div class="irq"></div>' + rationale(it, sc) + "</details>";
}
function strip(h) { var d = document.createElement("div"); d.innerHTML = h; return d.textContent; }

// ---------------- home ----------------
function home() {
  var ses = S.ses, last = S.attempts[S.attempts.length - 1];
  var h = '<section class="card hero"><div class="kick">HCC3 Module 8 - Birthing and Labor Process</div><h1>NGN Clinical Judgment Mock Exam</h1><p>' + ITEMS.length + " questions built from your Exam 3 learning map for Module 8 (Birthing and Labor Process), your five lecture decks and your Module 8 textbook pages. " + CASES.length + " unfolding EHR cases (" + ITEMS.filter(function (i) { return i.case; }).length + ' questions) and every NGN item type.</p>';
  if (ses) h += '<div class="resume"><b>In progress:</b> ' + esc(ses.label) + ", question " + (ses.i + 1) + " of " + ses.ids.length + ' <button class="btn" id="res">Resume</button> <button class="btn quiet" id="dis">Discard</button></div>';
  h += "</section>";
  h += '<section class="card"><h2>Choose a mode</h2><div class="modes">' +
    mode("full", "&#128221;", "Comprehensive Exam", "All " + ITEMS.length + " questions, one at a time. No answers until you submit. Flag and review before final submission.", '<label class="tog"><input type="checkbox" id="tm"> Timed (90 seconds per question)</label>') +
    mode("learn", "&#128218;", "Learn Mode", "Same exam, but answers, rationales, topic and NCJMM skill appear after each question.") +
    mode("case", "&#129658;", "NGN Case Study", "Pick one unfolding case and work through it with chart updates.", '<select id="cs">' + CASES.map(function (c, k) { return '<option value="' + c.id + '">Case ' + (k + 1) + ": " + esc(c.title) + "</option>"; }).join("") + '</select><label class="tog"><input type="checkbox" id="csfb" checked> Show rationale after each question</label>') +
    mode("hy", "&#9889;", "High-Yield", ITEMS.filter(function (i) { return i.hy; }).length + " questions on FHR, priority actions, medication safety, oxytocin and emergencies.") +
    mode("weak", "&#127919;", "Weak Areas", "Retests questions you missed plus items from your lowest topics and skills. Your history is kept.") + "</div></section>";
  if (last) {
    h += '<section class="card"><h2>Past attempts</h2><table class="hist"><thead><tr><th>Date</th><th>Mode</th><th>Score</th><th></th></tr></thead><tbody>';
    S.attempts.slice().reverse().forEach(function (a, k) {
      var E = 0, M = 0; a.ids.forEach(function (id) { E += a.res[id][0]; M += a.res[id][1]; });
      h += "<tr><td>" + new Date(a.d).toLocaleDateString() + "</td><td>" + esc(a.label) + "</td><td><b>" + pct(E, M) + '%</b></td><td><a href="#results/' + (S.attempts.length - 1 - k) + '">Report</a></td></tr>';
    });
    h += "</tbody></table></section>";
  }
  h += '<section class="card"><details><summary><b>How scoring works</b></summary><ul class="small">' +
    "<li><b>Multiple choice:</b> 1 point if correct, 0 if not.</li>" +
    "<li><b>Select all that apply:</b> +1 for each correct option chosen, &minus;1 for each incorrect option chosen, minimum 0. Maximum = number of correct options.</li>" +
    "<li><b>Drop-down (cloze):</b> 1 point for each correct drop-down.</li>" +
    "<li><b>Highlight:</b> +1 for each correct cue highlighted, &minus;1 for each incorrect cue highlighted, minimum 0. Your personal highlighter marks are never scored.</li>" +
    "<li><b>Matrix:</b> 1 point per row answered correctly; no points subtracted for a wrong row.</li>" +
    "<li><b>Bow-tie:</b> 5 points: 1 for the condition, 1 for each of the 2 correct actions and 1 for each of the 2 correct parameters.</li>" +
    "<li><b>Ordered response:</b> 1 point for each item in its correct position.</li>" +
    "<li><b>Overall:</b> total points earned &divide; total points possible &times; 100. This practice scoring is modeled on NGN partial-credit rules; it is not the official NCLEX algorithm.</li></ul></details></section>";
  h += '<section class="card"><details><summary><b>Sources and coverage notes</b></summary><div class="small"><p>Questions follow your Exam 3 learning map (Module 8: Labor and Birthing Process), then your five Module 8 lecture decks (LBP, COM, FA, NC, CX), your Boot Camp and Study Lab content, and your uploaded Module 8 textbook pages. Each rationale cites the slide and page.</p>' +
    "<p><b>Course vs. current practice:</b> your FA slide lists O2 at 10 L/min as a basic intervention for abnormal tracings. Your textbook's tachysystole protocol says to stop oxytocin, reposition and give fluids first, and to consider oxygen only if those do not resolve the tracing. These items follow that order. Your NC slide places active labor at 4 cm; the textbook notes newer guidance uses 6 cm.</p>" +
    "<p><b>Gaps:</b> no professor PAINT concept maps were uploaded for this exam, and the blueprint has no question-count weighting. Topic weighting follows your prompt's suggested distribution plus the blueprint's emphasis on oxytocin and emergencies. Protraction and arrest disorders use textbook definitions because the slides do not define them.</p></div></details></section>" +
    '<section class="card"><button class="btn danger" id="rst">Reset all progress</button></section>';
  app.innerHTML = h;
  $$(".mode .go").forEach(function (b) { b.addEventListener("click", function () {
    var m = b.getAttribute("data-m");
    if (m === "full" || m === "learn") start(m, buildFull(), { timer: m === "full" && $("#tm").checked });
    else if (m === "case") { var c = $("#cs").value; start("case", caseItems(c).map(function (i) { return i.id; }), { label: "Case: " + CASEBY[c].title, fb: $("#csfb").checked }); }
    else if (m === "hy") start("hy", orderCases(ITEMS.filter(function (i) { return i.hy; }).map(function (i) { return i.id; })));
    else if (m === "weak") { var w = weakIds(); if (!w.length) toast("Answer some questions first. Weak Areas uses your history."); else start("weak", w); }
  }); });
  if (ses) { $("#res").addEventListener("click", function () { location.hash = "#q"; }); $("#dis").addEventListener("click", function () { if (confirm("Discard the exam in progress?")) { S.ses = null; save(); home(); } }); }
  $("#rst").addEventListener("click", function () { if (confirm("Erase all attempts, history and the exam in progress?")) { S = { hist: {}, attempts: [] }; save(); home(); } });
}
function mode(k, ic, t, d, extra) { return '<div class="mode"><div class="mi">' + ic + "</div><div><b>" + t + "</b><p>" + d + "</p>" + (extra || "") + '<button class="btn go" data-m="' + k + '">Start</button></div></div>'; }

// ---------------- theme + router ----------------
function setTheme(t) { document.documentElement.setAttribute("data-theme", t); try { localStorage.setItem("hcc3-examA-theme", t); } catch (e) {} $("#thm").innerHTML = t === "dark" ? "&#9728;" : "&#9790;"; }
$("#thm").addEventListener("click", function () { setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"); });
setTheme(document.documentElement.getAttribute("data-theme") || "light");
function route() {
  var h = (location.hash || "#home").slice(1).split("/");
  if (h[0] !== "q" && hlMode) setHL(false);
  if (h[0] === "q") qScreen();
  else if (h[0] === "results") results(h[1] !== undefined ? +h[1] : S.attempts.length - 1);
  else home();
  try { app.focus({ preventScroll: true }); } catch (e) {}
}
load();
window.addEventListener("hashchange", function () { route(); window.scrollTo(0, 0); });
route();
window.__exam = { score: score, BY: BY, S: function () { return S; } };
})();
</script>
</body>
