<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HCC3 Module 8 - Birthing and Labor Process: NGN Mock Exam</title>
<script>try{var t=localStorage.getItem("hcc3-examA-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<style>:root{--bg:#f6f8fb;--card:#fff;--ink:#1d2433;--mut:#5b6476;--line:#dfe5ee;--blue:#2f6fd6;--blue2:#e8f0fc;--blue3:#c9dbf7;--ok:#16824f;--ok2:#e3f5eb;--no:#c23a4b;--no2:#fdebee;--part:#b27300;--part2:#fff4dc;--mark:#fff176;--r:12px}
[data-theme=dark]{--bg:#11151d;--card:#1a202b;--ink:#e5e9f1;--mut:#a2abbd;--line:#2c3443;--blue:#6ea2ff;--blue2:#1d2a40;--blue3:#2e4466;--ok:#4bd18c;--ok2:#163225;--no:#ff7385;--no2:#3a1d24;--part:#f0b44c;--part2:#33290f;--mark:#8a7a12;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--blue)}
h1{font-size:1.45rem;margin:.2em 0 .5em;line-height:1.25}
h2{font-size:1.15rem;margin:.1em 0 .6em}
h3{font-size:1rem;margin:1.1em 0 .4em}
.small{font-size:.9rem;color:var(--mut)}
.kick{font-size:.78rem;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.05em}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{font-weight:700;color:var(--ink);text-decoration:none;min-height:44px;display:flex;align-items:center;gap:8px}
.brand span{color:var(--blue);font-weight:600}
main{max-width:980px;margin:0 auto;padding:16px 14px 90px;outline:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:0 0 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:10px 18px;border-radius:10px;border:1px solid var(--blue);background:var(--blue);color:#fff;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;margin:4px 6px 4px 0}
[data-theme=dark] .btn{color:#0d1626}
.btn.ghost{background:var(--blue2);color:var(--blue);border-color:var(--blue3)}
.btn.quiet{background:transparent;color:var(--mut);border-color:var(--line)}
.btn.danger{background:var(--no);border-color:var(--no);color:#fff}
.btn.sm{min-height:36px;padding:4px 10px;font-size:.85rem;margin-left:6px}
.btn.big{min-height:52px;font-size:1.05rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.tbtn{min-height:40px;min-width:40px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.tbtn.on{background:var(--mark);border-color:#d6c400;color:#1d2433}
.chip{font-size:.85rem;color:var(--mut);padding:6px 10px;border:1px solid var(--line);border-radius:10px;min-height:40px;display:inline-flex;align-items:center}
.chip.low,#tmr.low{color:var(--no);border-color:var(--no)}
.hero p{color:var(--mut)}
.resume{margin-top:10px;padding:12px;border-radius:10px;background:var(--blue2)}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.mode{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px}
.mode p{margin:.3em 0 .5em;color:var(--mut);font-size:.92rem}
.mi{font-size:1.6rem}
.mode select{width:100%;min-height:44px;margin:4px 0;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:6px}
.tog{display:flex;align-items:center;gap:8px;font-size:.9rem;min-height:40px;cursor:pointer}
.tog input{width:18px;height:18px;accent-color:var(--blue)}
.hist{width:100%;border-collapse:collapse;font-size:.92rem}
.hist td,.hist th{padding:8px;border-bottom:1px solid var(--line);text-align:left}
/* question screen */
.qtop{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.qtools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:var(--blue)}
.scen{padding:10px 14px;border-left:4px solid var(--blue);background:var(--blue2);border-radius:8px;margin-bottom:10px}
.chart{background:var(--card);border:1px solid var(--blue3);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.cbar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 14px;background:var(--blue2);font-size:.92rem}
.banner{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
.banner span{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:.85rem}
.chart details{border-bottom:1px solid var(--line)}
.chart details:last-child{border-bottom:0}
.chart summary{padding:10px 14px;font-weight:700;cursor:pointer;min-height:44px}
.chart ul{margin:0;padding:0 14px 12px 34px;font-size:.92rem}
.tw{overflow-x:auto}
.flow{width:100%;border-collapse:collapse;font-size:.84rem}
.flow th,.flow td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.flow th{background:var(--bg);white-space:nowrap}
tr.new td,li.new{background:var(--part2)}
li.new::after,tr.new td:first-child::after{content:" NEW";font-size:.7rem;font-weight:800;color:var(--part)}
.notes{list-style:none;padding-left:14px!important}
.notes li{padding:6px 8px;border-radius:6px;margin:2px 0}
.lead{padding:12px 14px;border:1px solid var(--line);border-left:4px solid var(--part);border-radius:8px;background:var(--card);margin-bottom:12px}
.qtype{font-size:.8rem;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.04em}
.stem{font-size:1.04rem;font-weight:600;margin:6px 0 14px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;min-height:50px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--blue)}
.ol{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--blue3);display:inline-flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:700;color:var(--blue)}
.opt.sata .ol{border-radius:6px}
.opt.sel{border-color:var(--blue);background:var(--blue2)}
.opt.sel .ol{background:var(--blue);color:#fff;border-color:var(--blue)}
.right{border-color:var(--ok)!important;background:var(--ok2)!important}
.wrong{border-color:var(--no)!important;background:var(--no2)!important}
.missed{border:2px dashed var(--ok)!important}
.cloze{line-height:2.6;font-size:1.02rem}
.dd{min-height:42px;max-width:100%;padding:4px 8px;border-radius:8px;border:2px solid var(--blue3);background:var(--card);color:var(--ink);font:inherit;font-size:.95rem}
.fix{font-size:.85rem;color:var(--ok);font-weight:700;margin:0 6px}
.hlnote{padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);line-height:2}
.hlhelp{font-size:.82rem;color:var(--mut);line-height:1.4;margin-bottom:6px}
.cue{cursor:pointer;border-bottom:2px dotted var(--blue3);padding:2px 2px;border-radius:4px}
.cue:hover{background:var(--blue2)}
.cue.sel{background:var(--blue);color:#fff;border-bottom-color:var(--blue)}
[data-theme=dark] .cue.sel{color:#0d1626}
.cue.right,.cue.wrong,.cue.missed{color:var(--ink)}
.matrix{width:100%;border-collapse:collapse;font-size:.94rem}
.matrix th,.matrix td{border:1px solid var(--line);padding:8px;text-align:center}
.matrix td:first-child{text-align:left}
.matrix th{background:var(--blue2);font-size:.85rem}
.matrix label{display:flex;align-items:center;justify-content:center;min-height:40px;cursor:pointer}
.matrix input{width:20px;height:20px;accent-color:var(--blue)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.bowtie{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:start}
.bcol{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.bc{border-color:var(--blue);background:var(--blue2)}
.bh{font-weight:700;font-size:.9rem}
.bh small{font-weight:400;color:var(--mut)}
.bopt{min-height:46px;text-align:left;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.bopt.sel{border-color:var(--blue);background:var(--blue);color:#fff}
[data-theme=dark] .bopt.sel{color:#0d1626}
.bopt.right,.bopt.wrong,.bopt.missed{color:var(--ink)}
.ord{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.oi{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:grab}
.oi.drag{opacity:.5}
.on{flex:none;width:26px;height:26px;border-radius:50%;background:var(--blue2);color:var(--blue);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.ot{flex:1}
.oa{display:flex;gap:4px}
.oa button{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.ordhelp{font-size:.85rem;color:var(--mut);margin-bottom:8px}
.qnav{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:4px 0 12px}
mark.mine{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
body.hlmode .hlzone{cursor:text;outline:2px dashed #d6c400;outline-offset:2px}
.rat{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--card);margin-bottom:14px}
.verdict{font-weight:700;padding:8px 12px;border-radius:8px;margin-bottom:10px}
.verdict.ok{background:var(--ok2);color:var(--ok)}.verdict.no{background:var(--no2);color:var(--no)}.verdict.part{background:var(--part2);color:var(--part)}
.rgrid{display:grid;grid-template-columns:180px 1fr;gap:8px 14px;font-size:.94rem}
.rk{font-weight:700;color:var(--mut)}
.take{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--blue2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;margin:10px 0}
.gq{position:relative;min-height:46px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.gq.a{background:var(--blue2);border-color:var(--blue3)}
.gq.f{border-color:var(--part);border-width:2px}
.gq.l{opacity:.65}
.gq i{font-style:normal;font-size:.7rem;position:absolute;top:1px;right:3px}
.legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.85rem;color:var(--mut);margin-bottom:10px}
.legend .gq{min-height:30px;width:38px;display:inline-flex;align-items:center;justify-content:center;cursor:default}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:10px 0}
.kpis div{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.kpis b{display:block;font-size:1.3rem;color:var(--blue)}
.kpis span{font-size:.8rem;color:var(--mut)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(150px,260px) 1fr 52px;gap:10px;align-items:center;font-size:.92rem}
.bar small{color:var(--mut)}
.bt{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bt i{display:block;height:100%;border-radius:99px}
.bt i.g{background:var(--ok)}.bt i.y{background:var(--part)}.bt i.r{background:var(--no)}
.bv{font-weight:700;text-align:right}
.bar.dim{opacity:.55}
.rem ul,.rem ol{padding-left:1.2em}
.rem li{margin:6px 0}
.irv{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.irv summary{cursor:pointer;font-size:.94rem;min-height:30px}
.irq{margin:10px 0;pointer-events:none}
.pill{display:inline-block;min-width:46px;text-align:center;border-radius:99px;font-size:.8rem;font-weight:700;padding:1px 8px;margin-right:6px}
.pill.ok{background:var(--ok2);color:var(--ok)}.pill.part{background:var(--part2);color:var(--part)}.pill.no{background:var(--no2);color:var(--no)}
details>summary.btn{list-style:none}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1d2433;color:#fff;padding:12px 16px;border-radius:10px;z-index:60;max-width:92vw;font-size:.92rem}
@media (max-width:720px){
  .brand span{display:none}
  .bowtie{grid-template-columns:1fr}
  .bc{order:-1}
  .rgrid{grid-template-columns:1fr}
  .rk{margin-top:6px}
  .bar{grid-template-columns:1fr 90px 44px}
  .card{padding:14px}
  .matrix{font-size:.85rem}
}
</style>
</head>

, most likely caused by {1}. The nurse's first action is to {2}.", "drops": [{"opts": ["recurrent variable decelerations", "recurrent late decelerations", "early decelerations", "a sinusoidal pattern"], "ans": 0}, {"opts": ["umbilical cord compression", "uteroplacental insufficiency", "fetal head compression", "fetal anemia"], "ans": 0}, {"opts": ["change the patient's position", "begin fetal scalp stimulation", "prepare for an immediate cesarean", "slow the IV to keep-open rate"], "ans": 0}], "topic": "fhr", "cj": "ac", "cats": ["assess", "prio"], "why": "Abrupt onset (under 30 seconds to the lowest point), V shape and variable timing define variable decelerations, which come from cord compression. Ruptured membranes reduce the fluid cushion around the cord. Repositioning is the first step because it can move the cord off the pressure point.", "wrong": "Late decels are gradual and delayed after the contraction peak. Early decels are gradual and mirror the contraction. Scalp stimulation is never done during a deceleration and a cesarean is not the first step while variability is moderate.", "cues": "Abrupt drop, V shape, ruptured membranes, moderate variability between drops.", "safety": "Moderate variability means the fetus is still tolerating this, so conservative measures come first.", "take": "Abrupt and V-shaped = cord. First move the mother, then reassess.", "src": "FA slides 20, 25, 26, 28; textbook p. 92", "hy": true, "case": "c1", "lead": "At 1100 the cervix is 7 cm, 90%, 0 station. Over the last 20 minutes, the FHR drops abruptly from a baseline of 140 to about 90 with most contractions. Each drop reaches its lowest point within 20 seconds, is V-shaped, and returns to baseline in about 40 seconds. Variability between drops is moderate.", "flow": [["1100", "120/74", "86", "98.9", "16 / 99%", "140, moderate var, abrupt V-shaped decels to 90 with most UCs", "q3 min, 60-70 s, strong", "7 / 90% / 0"]], "notes": [], "orders": [], "labs": [], "id": "c1-2"}, {"t": "sata", "stem": "Which actions should the nurse anticipate or take now? Select all that apply.", "opts": ["Perform a vaginal exam to check for a prolapsed cord", "Notify the provider with an SBAR report", "Prepare for amnioinfusion through an IUPC as ordered", "Give an IV fluid bolus as ordered", "Start fetal scalp stimulation during the next deceleration", "Place the patient flat on her back to improve monitoring", "Start oxytocin to shorten the first stage"], "ans": [0, 1, 2, 3], "topic": "fhr", "cj": "gs", "cats": ["prio"], "why": "Recurrent, deeper and longer variables with falling variability mean the cord problem is getting worse. A vaginal exam rules out prolapse, the provider must know, amnioinfusion restores fluid around the cord, and IV fluid supports placental perfusion.", "wrong": "Scalp stimulation is only done when the FHR is at baseline. Supine positioning compresses the vena cava and worsens perfusion. Oxytocin would increase contraction stress on a fetus who is already compromised.", "cues": "Decels deeper and longer, variability falling from moderate to minimal.", "safety": "Worsening variability is the turning point from 'watch' to 'act and escalate.'", "take": "When position changes fail for recurrent variables: check for prolapse, notify, and prepare for amnioinfusion.", "src": "FA slides 25, 28, 30; textbook pp. 92-93, 99", "hy": true, "case": "c1", "lead": "The nurse turned Jasmine to her left side, then her right. Fifteen minutes later the decelerations continue with every contraction, now dropping to 70 and lasting 60 to 70 seconds. Variability has become minimal.", "flow": [["1120", "118/70", "90", "98.9", "16 / 99%", "140, minimal var, recurrent variables to 70, 60-70 s", "q3 min, 70 s, strong", ""]], "notes": [], "orders": [], "labs": [], "id": "c1-3"}, {"t": "mc", "stem": "Which finding requires the nurse's immediate follow-up?", "opts": ["IUPC resting tone of 45 mm Hg with very little fluid returning", "Variable decelerations now occasional and dropping to 120", "Maternal temperature of 99.1&deg;F", "Moderate variability with one acceleration"], "ans": 0, "topic": "proc", "cj": "ph", "cats": ["assess", "prio"], "why": "Uterine overdistention and increased tone are the main risks of amnioinfusion. Resting tone should not exceed 40 mm Hg, and fluid should be coming back out. High tone with little return means fluid is building up in the uterus; stop or slow the infusion per protocol and notify the provider.", "wrong": "Fewer and shallower variables plus moderate variability show the amnioinfusion is working. A temperature of 99.1&deg;F is within normal limits.", "cues": "Resting tone over 40 mm Hg, little vaginal return.", "safety": "An overdistended uterus can reduce placental blood flow and raise the risk of rupture.", "take": "During amnioinfusion, watch both the FHR and the uterus: tone under 40 mm Hg and fluid coming out.", "src": "FA slide 30; textbook p. 99", "hy": false, "case": "c1", "lead": "An IUPC was placed and amnioinfusion with room-temperature lactated Ringer's was started at 1135. At 1215 the nurse reviews the monitor and the pads under the patient.", "flow": [["1215", "116/72", "84", "99.1", "16 / 99%", "140, moderate var, occasional variables to 120", "q3 min, 60 s", ""]], "notes": [["1215", "Amnioinfusion infusing. Minimal fluid noted on underpads since 1135. IUPC resting tone 45 mm Hg."]], "orders": [], "labs": [], "id": "c1-4"}, {"t": "matrix", "stem": "Compare the 1330 findings with the 1120 findings. For each, indicate whether it has improved, is unchanged or has worsened.", "cols": ["Improved", "Unchanged", "Worsened"], "rows": [{"r": "FHR variability", "a": 0}, {"r": "Depth of variable decelerations", "a": 0}, {"r": "FHR baseline", "a": 1}, {"r": "IUPC resting tone (compared with 1215)", "a": 0}, {"r": "Maternal blood pressure", "a": 1}], "topic": "fhr", "cj": "eo", "cats": ["eval"], "why": "Variability went from minimal back to moderate and decels went from deep to rare and shallow: the interventions worked. Baseline (140) and BP (about 118/72) did not change. Resting tone came down from 45 to 12 mm Hg after the rate was reduced.", "wrong": "A baseline that stays at 140 is unchanged, not improved; it was normal before and is normal now.", "cues": "Return of moderate variability and accelerations; shallow, rare decels.", "safety": "Always evaluate whether your interventions changed the tracing; if not, escalate.", "take": "Evaluation means comparing the same findings over time and deciding: better, same or worse.", "src": "FA slides 14, 20, 28; textbook pp. 87, 99", "hy": false, "case": "c1", "lead": "The infusion rate was reduced per protocol and resting tone came down. At 1330 Jasmine is 10 cm, +1 station, with a strong urge to push.", "flow": [["1330", "118/72", "88", "99.0", "18 / 99%", "140, moderate var, rare shallow variables, accels present", "q2-3 min, 60-70 s", "10 / 100% / +1"]], "notes": [["1330", "IUPC resting tone 12 mm Hg. Fluid returning on pads, clear. Patient feels strong urge to bear down."]], "orders": [], "labs": [], "id": "c1-5"}, {"t": "order", "stem": "Jasmine had a spontaneous birth at 1412 and the placenta delivered at 1420. At 1500 the fundus is boggy, 2 cm above the umbilicus and shifted to the right; lochia is heavy. Put the nurse's actions in the order they should happen.", "items": ["Massage the fundus until it is firm", "Help her empty her bladder", "Reassess fundal height, tone and lochia", "Notify the provider if bleeding continues despite these measures"], "topic": "stages", "cj": "ta", "cats": ["prio", "eval"], "why": "Heavy bleeding with a boggy uterus is treated first by massage to firm the uterus. Displacement to the right and no voiding since 1100 point to a full bladder, which keeps the uterus from contracting, so emptying it comes next. Then reassess to evaluate, and escalate if bleeding continues.", "wrong": "Waiting to massage until after she voids lets bleeding continue. Notifying the provider before basic corrective steps delays the action that stops bleeding, but escalate early if bleeding is brisk.", "cues": "Boggy, high, deviated fundus; heavy lochia; no void in 4 hours.", "safety": "Hemorrhage is the main danger of the fourth stage. Rising pulse (96) is an early warning.", "take": "Boggy = massage. High and deviated = bladder. Then reassess.", "src": "NC slides 22, 25; textbook p. 183", "hy": false, "case": "c1", "lead": "Jasmine is in her fourth stage of labor. The nurse checks her fundus and lochia.", "flow": [["1500", "112/68", "96", "98.8", "18 / 99%", "", "", ""]], "notes": [["1500", "Fundus boggy, 2 cm above umbilicus, deviated right. Lochia rubra heavy. Has not voided since 1100."]], "orders": [], "labs": [], "id": "c1-6"}, {"t": "sata", "stem": "Before starting the oxytocin infusion, what must the nurse confirm or do? Select all that apply.", "opts": ["Obtain a baseline FHR tracing and contraction pattern", "Confirm fetal presentation", "Infuse oxytocin as a secondary line on an infusion pump", "Connect the oxytocin line at the port closest to the venipuncture site", "Hang oxytocin as the primary maintenance infusion", "Give the first dose as a slow IV push", "Start at the highest ordered rate to shorten labor"], "ans": [0, 1, 2, 3], "topic": "oxy", "cj": "gs", "cats": ["med", "prio"], "why": "Oxytocin is a high-alert drug. The nurse needs a baseline tracing to compare against, confirms the fetus is in a position safe for labor, and gives it as a diluted secondary infusion on a pump connected close to the IV site, so it can be stopped instantly while the primary line keeps running.", "wrong": "A primary line or an IV push gives no control and cannot be stopped quickly. Starting high increases tachysystole and abnormal FHR patterns; the textbook favors low-dose protocols.", "cues": "High-alert medication; need to stop it instantly; baseline for comparison.", "safety": "Being able to discontinue oxytocin immediately is the most important safety feature of the setup.", "take": "Oxytocin: secondary line, pump, closest port, baseline strip first.", "src": "CX slides 21, 22; textbook pp. 241-243", "hy": true, "case": "c2", "lead": "At 0730 the provider orders oxytocin per protocol.", "flow": [], "notes": [], "orders": [], "labs": [], "id": "c2-1"}, {"t": "cloze", "stem": "Complete the nurse's titration plan.", "text": "The nurse increases the oxytocin rate by {0} no more often than every {1}, basing each increase on {2}.", "drops": [{"opts": ["1 to 2 milliunits/min", "5 to 10 milliunits/min", "1 to 2 mL/h of the primary line", "double the current rate"], "ans": 0}, {"opts": ["30 to 60 minutes", "5 minutes", "10 minutes", "4 hours"], "ans": 0}, {"opts": ["the maternal-fetal response and labor progress", "the time since admission", "the patient's pain score", "the protocol, regardless of contractions"], "ans": 0}], "topic": "oxy", "cj": "gs", "cats": ["med"], "why": "It takes 30 to 60 minutes for oxytocin to reach a steady state, so increasing faster stacks doses before you see the effect of the last one. Each increase is based on how the uterus and fetus respond and how labor is progressing.", "wrong": "Large jumps or doubling the dose cause tachysystole. Pain score and time on the unit are not titration criteria.", "cues": "Steady state takes time; titrate to the lowest effective dose.", "safety": "Titrating too fast is a common route to tachysystole and fetal compromise.", "take": "Low and slow: 1 to 2 milliunits/min every 30 to 60 minutes, guided by mother, fetus and progress.", "src": "CX slide 22; textbook pp. 241-243", "hy": true, "case": "c2", "lead": "Oxytocin started at 0745 at 2 milliunits/min. Contractions are now every 5 minutes, mild to moderate.", "flow": [["0830", "118/72", "80", "98.5", "16 / 99%", "145, moderate var", "q5 min, 40-50 s, mild-mod", ""]], "notes": [], "orders": [], "labs": [], "id": "c2-2"}, {"t": "hl", "stem": "Highlight the findings that require immediate nursing intervention.", "segs": [{"x": "<b>1230 Nursing note.</b> Oxytocin at 12 milliunits/min. "}, {"x": "Contractions every 1.5 to 2 minutes, lasting 90 seconds.", "k": 1}, {"x": " "}, {"x": "Seven contractions in the last 10 minutes.", "k": 1}, {"x": " "}, {"x": "IUPC resting tone 30 mm Hg between contractions.", "k": 1}, {"x": " FHR: "}, {"x": "baseline 150 with minimal variability", "k": 1}, {"x": " and "}, {"x": "recurrent late decelerations.", "k": 1}, {"x": " "}, {"x": "Patient states, \"It feels like one long contraction.\"", "k": 1}, {"x": " "}, {"x": "BP 124/78, HR 88.", "k": 0}, {"x": " "}, {"x": "Temperature 98.9&deg;F.", "k": 0}, {"x": " "}, {"x": "Cervix 6 cm, 90%, 0 station.", "k": 0}, {"x": " "}, {"x": "Requests ice chips.", "k": 0}], "topic": "oxy", "cj": "rc", "cats": ["assess", "prio"], "why": "More than five contractions in 10 minutes, a resting tone above 25 mm Hg and the feeling of 'one long contraction' are the signs of tachysystole. Minimal variability with recurrent lates is a Category II tracing that shows the fetus is not getting enough oxygen between contractions.", "wrong": "Her vital signs, temperature and cervical progress are normal, and the ice chip request is not a safety issue.", "cues": "Frequency over 5 in 10 minutes; resting tone over 25 mm Hg; minimal variability; lates.", "safety": "Tachysystole with an abnormal tracing means oxytocin is causing harm and must be stopped now.", "take": "Tachysystole signs: more than 5 in 10 minutes, contractions 2 minutes or longer, or poor resting tone.", "src": "CX slide 22; FA slides 14, 24; textbook p. 243", "hy": true, "case": "c2", "lead": "At 1230 the nurse reviews Priya's tracing and the IUPC readings.", "flow": [["1230", "124/78", "88", "98.9", "16 / 99%", "150, minimal var, recurrent lates", "7 in 10 min, 90 s, resting tone 30", "6 / 90% / 0"]], "notes": [], "orders": [], "labs": [], "id": "c2-3"}, {"t": "order", "stem": "Place the nurse's actions for tachysystole with a Category II tracing in the correct order.", "items": ["Discontinue the oxytocin infusion", "Turn the patient to a side-lying position", "Give an IV bolus of at least 500 mL lactated Ringer's", "Consider oxygen by nonrebreather mask if the tracing does not resolve"], "topic": "oxy", "cj": "ta", "cats": ["prio", "med"], "why": "The textbook treatment for tachysystole with a Category II or III tracing starts with stopping the oxytocin immediately, then side-lying positioning and an LR bolus of at least 500 mL. Oxygen is considered only if those measures do not resolve the tracing. Your course slides list O2 at 10 L/min among the basic interventions; current evidence saves it for when the first steps fail, rather than using it routinely. Notify the provider of actions and responses throughout.", "wrong": "Starting with oxygen or fluids while oxytocin keeps running leaves the cause in place.", "cues": "Oxytocin is the cause, so removing it comes first.", "safety": "Notify the provider and be ready to give terbutaline if ordered when the pattern does not respond.", "take": "Tachysystole with an abnormal FHR: stop oxytocin, side, bolus, then consider O2.", "src": "CX slide 22; FA slide 28; textbook p. 243", "hy": true, "case": "c2", "lead": "The nurse recognizes tachysystole with a Category II tracing.", "flow": [], "notes": [], "orders": [], "labs": [], "id": "c2-4"}, {"t": "matrix", "stem": "Fifteen minutes after the nurse's interventions, evaluate each finding.", "cols": ["Improved", "Unchanged", "Worsened"], "rows": [{"r": "Contraction frequency", "a": 0}, {"r": "IUPC resting tone", "a": 0}, {"r": "FHR variability", "a": 0}, {"r": "Late decelerations", "a": 0}, {"r": "Maternal blood pressure", "a": 1}, {"r": "Cervical dilation", "a": 1}], "topic": "oxy", "cj": "eo", "cats": ["eval"], "why": "Contractions went from 7 in 10 minutes to every 3 minutes, resting tone from 30 to 12 mm Hg, variability from minimal to moderate, and lates resolved. BP and dilation stayed the same.", "wrong": "Cervical dilation is unchanged; it was not expected to change in 20 minutes, and stopping oxytocin was the right call.", "cues": "Every abnormal finding from 1230 has returned to normal.", "safety": "The tracing is now Category I, so the nurse can consider resuming oxytocin per protocol.", "take": "After tachysystole interventions, recheck the same findings you highlighted to prove they worked.", "src": "CX slide 22; FA slide 28; textbook p. 243", "hy": false, "case": "c2", "lead": "The nurse stopped the oxytocin, turned Priya to her left side, gave a 500 mL LR bolus and notified the provider. At 1250 the monitor shows the following.", "flow": [["1250", "122/76", "84", "98.9", "16 / 99%", "145, moderate var, no decels, 1 accel", "q3 min, 60 s, resting tone 12", "6 / 90% / 0"]], "notes": [], "orders": [], "labs": [], "id": "c2-5"}, {"t": "mc", "stem": "At 1300 the provider asks the nurse to resume oxytocin. The infusion was off for 25 minutes. Which plan is safest?", "opts": ["Resume at no more than half the rate that caused tachysystole", "Resume at 12 milliunits/min, since the tracing is Category I now", "Keep oxytocin off for the rest of labor because tachysystole occurred", "Resume at 12 milliunits/min and increase by 2 milliunits/min every 15 minutes"], "ans": 0, "topic": "oxy", "cj": "eo", "cats": ["med", "eval"], "why": "When oxytocin has been off for less than 20 to 30 minutes, it is resumed at no more than one-half the rate that caused tachysystole. If it has been off longer than 30 to 40 minutes, it restarts at the initial dose.", "wrong": "Going back to 12 milliunits/min repeats the dose that caused the problem. Stopping permanently is not required once uterine activity and the FHR are normal. Increasing every 15 minutes ignores the time oxytocin needs to reach a steady state.", "cues": "Off for 25 minutes; the 12 milliunits/min rate caused tachysystole.", "safety": "A restart plan is part of a standardized oxytocin safety protocol.", "take": "Restart oxytocin lower than the dose that caused trouble, and keep titrating slowly.", "src": "CX slide 22; textbook p. 244", "hy": true, "case": "c2", "lead": "Uterine activity and the FHR have been normal for 15 minutes.", "flow": [["1300", "120/74", "82", "98.8", "16 / 99%", "145, moderate var, accels", "q3 min, 60 s", ""]], "notes": [], "orders": [], "labs": [], "id": "c2-6"}, {"t": "sata", "stem": "Which findings support the nurse's concern for preterm labor? Select all that apply.", "opts": ["Dull low backache and pelvic pressure", "Regular painless uterine tightening", "Increased watery vaginal discharge", "History of spontaneous preterm birth", "Fundal height of 31 cm", "FHR 145 with moderate variability and accelerations"], "ans": [0, 1, 2, 3], "topic": "comp", "cj": "rc", "cats": ["assess"], "why": "Backache, pelvic pressure, regular tightening (often painless) and a change in discharge are the warning signs of preterm labor. A prior spontaneous preterm birth is the strongest risk factor.", "wrong": "A fundal height of 31 cm matches 31 weeks. An FHR of 145 with moderate variability and accels is reassuring and does not point to preterm labor.", "cues": "Subtle symptoms that women often dismiss; prior preterm birth.", "safety": "Preterm labor symptoms are vague, so nurses must ask directly and take them seriously.", "take": "Preterm labor can feel like 'just a backache.' Prior preterm birth is the top risk factor.", "src": "CX slides 4, 5; textbook pp. 193, 200", "hy": false, "case": "c3", "lead": "The triage nurse reviews Lena's history and complaints.", "flow": [], "notes": [], "orders": [], "labs": [], "id": "c3-1"}, {"t": "cloze", "stem": "Complete the nurse's analysis.", "text": "These findings indicate {0}. The greatest risk associated with this condition is {1}, so the nurse will avoid {2}.", "drops": [{"opts": ["preterm premature rupture of membranes", "term premature rupture of membranes", "intact membranes with stress incontinence", "bloody show"], "ans": 0}, {"opts": ["infection", "precipitous birth", "maternal hypertension", "macrosomia"], "ans": 0}, {"opts": ["digital cervical exams", "sterile speculum exams", "monitoring maternal temperature", "continuous fetal monitoring"], "ans": 0}], "topic": "comp", "cj": "ac", "cats": ["assess"], "why": "Pooling, a positive nitrazine and ferning confirm ruptured membranes. Rupture before 37 0/7 weeks is pPROM. Infection is the greatest risk, so digital exams are avoided because they carry bacteria up toward the uterus.", "wrong": "Term PROM is at 37 weeks or later. A speculum exam is the sterile way to assess. Temperature and FHR monitoring are how infection is caught early.", "cues": "Fern positive at 31 weeks.", "safety": "Every digital exam after pPROM raises infection risk.", "take": "pPROM = rupture before 37 weeks. Biggest risk = infection. No digital exams.", "src": "CX slides 7, 8; NC slide 11; textbook pp. 109, 214-216", "hy": false, "case": "c3", "lead": "The provider performs a sterile speculum exam.", "flow": [], "notes": [["1440", "Speculum exam: pooling of clear fluid in posterior fornix. Nitrazine deep blue. Fern test positive. Cervix appears 2 cm visually."]], "orders": [], "labs": [], "id": "c3-2"}, {"t": "bow", "stem": "Complete the bow-tie for Lena's situation.", "cond": {"opts": ["Preterm labor with pPROM", "Placental abruption", "Term labor", "Chorioamnionitis"], "ans": [0]}, "acts": {"opts": ["Give betamethasone as ordered", "Give magnesium sulfate for fetal neuroprotection as ordered", "Perform digital cervical exams every 2 hours", "Encourage walking to help labor progress", "Start oxytocin to augment labor"], "ans": [0, 1]}, "mons": {"opts": ["Maternal temperature and FHR baseline", "Respiratory rate and deep tendon reflexes", "Fundal height", "Daily weight", "Hemoglobin A1c"], "ans": [0, 1]}, "topic": "comp", "cj": "ph", "cats": ["prio", "med"], "why": "She is in preterm labor with pPROM at 31 weeks. Betamethasone speeds fetal lung maturity, and magnesium sulfate protects the fetal brain when birth is expected before 32 weeks. Monitor temperature and FHR baseline for infection, and respirations and reflexes for magnesium toxicity.", "wrong": "Abruption would show pain, bleeding and a tense uterus. Chorioamnionitis has not developed yet (no fever, normal FHR). Digital exams, walking to speed labor and oxytocin are all wrong for a 31-week pPROM.", "cues": "31 weeks; ruptured membranes; regular contractions; birth expected within a week.", "safety": "Magnesium toxicity shows as respiratory depression and loss of reflexes; calcium gluconate is the antidote.", "take": "Preterm with pPROM before 32 weeks: steroids for lungs, magnesium for the brain, and watch for infection.", "src": "CX slides 6, 8, 9; textbook pp. 205, 211-212", "hy": true, "case": "c3", "lead": "Lena is admitted. Contractions are now every 5 minutes. The provider expects she may give birth within the next 7 days.", "flow": [["1530", "114/70", "94", "98.8", "18 / 99%", "145, moderate var", "q5 min, 40 s, moderate", ""]], "notes": [], "orders": ["Betamethasone 12 mg IM, repeat in 24 h", "Magnesium sulfate for fetal neuroprotection per protocol", "Antibiotics per protocol for pPROM"], "labs": [], "id": "c3-3"}, {"t": "hl", "stem": "Highlight the findings that suggest Lena has developed an intraamniotic infection.", "segs": [{"x": "<b>Day 2, 0600 assessment.</b> "}, {"x": "Temperature 101.2&deg;F.", "k": 1}, {"x": " "}, {"x": "Maternal HR 114.", "k": 1}, {"x": " "}, {"x": "BP 110/68.", "k": 0}, {"x": " "}, {"x": "RR 18, deep tendon reflexes 2+.", "k": 0}, {"x": " "}, {"x": "FHR baseline 170 for the past 30 minutes.", "k": 1}, {"x": " "}, {"x": "Fundus tender to light touch.", "k": 1}, {"x": " "}, {"x": "Leaking fluid now cloudy with a foul odor.", "k": 1}, {"x": " "}, {"x": "Irregular contractions every 12 to 15 minutes.", "k": 0}, {"x": " "}, {"x": "Ate 75% of breakfast.", "k": 0}], "topic": "comp", "cj": "rc", "cats": ["assess", "emerg"], "why": "Maternal fever, maternal and fetal tachycardia, uterine tenderness and foul-smelling fluid are the clinical findings of chorioamnionitis.", "wrong": "Her BP, respirations and reflexes are normal, the contraction pattern is not a sign of infection, and eating well is not a concern.", "cues": "Fever plus fetal tachycardia is the classic pair.", "safety": "Infection can lead to neonatal sepsis; report immediately.", "take": "Chorio: fever, fast mom, fast baby, tender uterus, foul fluid.", "src": "CX slide 9; FA slide 17; textbook pp. 216-217", "hy": false, "case": "c3", "lead": "Betamethasone was given yesterday at 1600 and magnesium was completed overnight. At 0600 on day 2 the nurse assesses Lena.", "flow": [["0600", "110/68", "114", "101.2", "18 / 99%", "170, minimal-moderate var", "q12-15 min, irregular", ""]], "notes": [], "orders": [], "labs": [], "id": "c3-4"}, {"t": "sata", "stem": "Which actions should the nurse anticipate for Lena's chorioamnionitis? Select all that apply.", "opts": ["Notify the provider of the findings", "Give IV antibiotics as ordered", "Give an antipyretic and use cooling measures as ordered", "Continue continuous fetal monitoring", "Prepare for birth", "Start a tocolytic to delay birth for one more week", "Stop all IV fluids to prevent overload"], "ans": [0, 1, 2, 3, 4], "topic": "comp", "cj": "ta", "cats": ["prio", "med"], "why": "Chorioamnionitis is treated with IV antibiotics and birth. The nurse reports findings, treats fever (which also lowers the fetal heart rate), keeps monitoring the fetus and prepares for birth and the newborn team.", "wrong": "Delaying birth with a tocolytic keeps the fetus in an infected environment. IV fluids support hydration and perfusion during fever.", "cues": "Confirmed fever with fetal tachycardia and uterine tenderness.", "safety": "Note her penicillin status and allergies before the first antibiotic dose.", "take": "Intraamniotic infection: antibiotics, antipyretics, monitoring and birth. Do not try to delay birth.", "src": "CX slide 9; FA slide 17; textbook pp. 88, 216-217", "hy": false, "case": "c3", "lead": "The nurse confirms a temperature of 101.2&deg;F on recheck.", "flow": [], "notes": [], "orders": [], "labs": [], "id": "c3-5"}, {"t": "mc", "stem": "Four hours after treatment begins, which finding best shows the plan is working?", "opts": ["Temperature 99.1&deg;F; FHR baseline 145, moderate variability", "Temperature 100.6&deg;F; FHR baseline 168, moderate variability", "Contractions have stopped and the fluid still smells foul", "Maternal HR 120; she reports chills and feeling cold"], "ans": 0, "topic": "comp", "cj": "eo", "cats": ["eval"], "why": "A falling maternal temperature and a fetal baseline back in the normal range with moderate variability show the infection response and fetal status are improving.", "wrong": "Persistent fever with fetal tachycardia, or maternal tachycardia with chills, means the infection is not controlled. Contractions stopping does not show the infection is treated.", "cues": "Compare the same findings: temperature and FHR baseline.", "safety": "If fever and fetal tachycardia persist, escalate and prepare for expedited birth.", "take": "Evaluate infection treatment by the same cues that raised the alarm.", "src": "CX slide 9; FA slides 14, 17; textbook p. 88", "hy": false, "case": "c3", "lead": "IV antibiotics were started at 0630 and acetaminophen was given. Labor is progressing. At 1030 the nurse reassesses.", "flow": [], "notes": [], "orders": [], "labs": [], "id": "c3-6"}, {"t": "sata", "stem": "Which nursing actions are appropriate before the epidural is placed? Select all that apply.", "opts": ["Give the ordered IV bolus of lactated Ringer's", "Have her empty her bladder", "Obtain baseline maternal vital signs and FHR", "Help her into a sitting or side-lying position with her back curved outward", "Verify the anesthesia provider obtained informed consent", "Give a bolus of D5W for energy", "Obtain informed consent herself before anesthesia arrives"], "ans": [0, 1, 2, 3, 4], "topic": "comfort", "cj": "gs", "cats": ["prio", "med"], "why": "A non-dextrose fluid bolus helps offset the vasodilation that causes hypotension. Emptying the bladder matters because the block causes retention. Baseline vitals and FHR are needed for comparison. A curved back opens the space between the vertebrae. The provider performing the procedure obtains consent; the nurse verifies and clarifies.", "wrong": "Dextrose boluses can cause maternal and fetal hyperglycemia. The nurse does not obtain consent for a procedure someone else performs.", "cues": "Hypotension is the most common complication; prepare to prevent it.", "safety": "Baseline numbers make it possible to recognize the drop quickly.", "take": "Before an epidural: fluid bolus (no dextrose), void, baselines, positioning, consent verified.", "src": "COM slides 18, 22; textbook pp. 55, 62, 68", "hy": false, "case": "c4", "lead": "The anesthesia provider will arrive in 15 minutes.", "flow": [], "notes": [], "orders": [], "labs": [], "id": "c4-1"}, {"t": "cloze", "stem": "Complete the nurse's analysis.", "text": "The drop in blood pressure is most likely caused by {0}. The FHR change reflects {1}. The nurse's first action is to {2}.", "drops": [{"opts": ["sympathetic blockade causing vasodilation", "an allergic reaction to the anesthetic", "hemorrhage from the insertion site", "fluid overload"], "ans": 0}, {"opts": ["decreased uteroplacental perfusion", "umbilical cord compression", "fetal head compression", "fetal sleep"], "ans": 0}, {"opts": ["turn her to a lateral position", "stop the epidural infusion", "place her in Trendelenburg position", "give ephedrine without an order"], "ans": 0}], "topic": "comfort", "cj": "ac", "cats": ["assess", "prio"], "why": "The block relaxes blood vessels, so blood pools in the lower body and BP drops. Less maternal blood flow means less flow to the placenta, which shows up as late decels and lower variability. Turning her to her side moves the uterus off the vena cava and improves venous return right away.", "wrong": "An allergic reaction would cause other signs like hives or wheezing. Stopping the infusion does not reverse the block quickly. Trendelenburg is not first-line. Vasopressors need an order from anesthesia.", "cues": "BP 84/46 from 122/76; dizziness; new late decels 12 minutes after placement.", "safety": "Check BP every 5 minutes for the first 15 minutes after an epidural.", "take": "Epidural, then BP drop, then lates: perfusion problem. Fix the mother's BP to fix the fetus.", "src": "COM slides 22, 23; FA slide 24; textbook pp. 55-56", "hy": true, "case": "c4", "lead": "The epidural was placed at 0930. At 0942 Grace says she feels dizzy and nauseated.", "flow": [["0942", "84/46", "108", "98.6", "18 / 99%", "140, minimal var, late decels with last 2 UCs", "q3 min, 60 s", ""]], "notes": [], "orders": [], "labs": [], "id": "c4-2"}, {"t": "order", "stem": "Place the nurse's actions for epidural-related hypotension in the correct order.", "items": ["Turn her to a lateral position or wedge the hip", "Increase the rate of the IV infusion", "Notify the anesthesia provider", "Give the vasopressor as ordered"], "topic": "comfort", "cj": "ta", "cats": ["prio", "med"], "why": "Positioning is the fastest independent action and immediately improves venous return. Increasing IV fluid adds volume. Anesthesia is notified, and a vasopressor is given only after it is ordered.", "wrong": "Giving the vasopressor first skips both the order and the fastest independent measures.", "cues": "Independent actions first, then collaborative ones.", "safety": "Raising her legs and oxygen may also be used per your course slide if BP does not recover.", "take": "Hypotension after a block: side, fluids, notify, vasopressor.", "src": "COM slide 22; textbook p. 56", "hy": false, "case": "c4", "lead": "Grace remains hypotensive and the FHR shows late decelerations.", "flow": [], "notes": [], "orders": [], "labs": [], "id": "c4-3"}, {"t": "matrix", "stem": "Over the next several hours, the nurse documents these findings. Indicate whether each is an expected effect of the epidural or requires immediate follow-up.", "cols": ["Expected effect", "Requires immediate follow-up"], "rows": [{"r": "Mild itching on her face and chest", "a": 0}, {"r": "Legs feel heavy and numb", "a": 0}, {"r": "Bladder distended above the symphysis; has not voided in 3 hours", "a": 1}, {"r": "Respiratory rate 10, numb hands, says it is hard to breathe", "a": 1}, {"r": "Blood pressure 112/68", "a": 0}, {"r": "Temperature 100.8&deg;F after 13 hours of labor", "a": 1}], "topic": "comfort", "cj": "ph", "cats": ["assess", "med"], "why": "Itching, heavy legs and a stable BP are expected. A full bladder needs emptying because it slows descent and can be injured. Respiratory depression with numb hands suggests a high block. A fever of 100.4&deg;F or higher can come from the epidural, but infection cannot be assumed away, and it can cause fetal tachycardia.", "wrong": "Numbness and itching are expected and need comfort measures, not urgent escalation.", "cues": "Bladder, breathing and temperature are the three to escalate.", "safety": "A high or total spinal block is an airway emergency.", "take": "Epidural: itchy and numb legs are expected; full bladder, fever or trouble breathing are not ignored.", "src": "COM slide 22; textbook pp. 57, 60, 73", "hy": false, "case": "c4", "lead": "Grace's BP recovered after a lateral position change, an IV bolus and ephedrine. The FHR returned to Category I.", "flow": [["1000", "112/68", "88", "98.6", "18 / 99%", "140, moderate var, accels", "q3 min, 60 s", ""]], "notes": [], "orders": [], "labs": [], "id": "c4-4"}, {"t": "mc", "stem": "At 1520 Grace is 10 cm, 0 station, with no urge to push. Her FHR is Category I. What is the best plan?", "opts": ["Let her labor down with FHR monitoring, then coach open-glottis pushing", "Begin coached pushing now with a 10-second breath hold each push", "Turn off the epidural so she can feel the urge and push effectively", "Notify the provider to prepare for a vacuum-assisted birth now"], "ans": 0, "topic": "stages", "cj": "gs", "cats": ["prio", "teach"], "why": "The second stage starts with a latent phase of passive descent (laboring down). The uterus keeps moving the fetus down and rotating it while she rests. Pushing begins when the urge or descent comes, using open-glottis pushes to protect fetal oxygenation.", "wrong": "Long breath-hold (Valsalva) pushes lower venous return and fetal oxygen. Turning off the epidural is not the standard answer to a lack of urge. A vacuum is for arrest or fetal compromise, not for a normal latent phase.", "cues": "Fully dilated, high station, no urge, Category I.", "safety": "Keep watching the FHR during passive descent.", "take": "Ten centimeters does not always mean push now. Let her labor down when she and the baby are stable.", "src": "NC slides 15, 16; LBP slide 34; textbook p. 153", "hy": false, "case": "c4", "lead": "The epidural is working well. She is resting comfortably.", "flow": [["1520", "118/70", "84", "99.0", "18 / 99%", "140, moderate var, accels", "q2-3 min, 60 s", "10 / 100% / 0"]], "notes": [], "orders": [], "labs": [], "id": "c4-5"}, {"t": "mc", "stem": "Before Grace's discharge to the postpartum unit, the nurse reviews safety teaching. Which statement shows understanding?", "opts": ["\"I'll call for help the first time I get up.\"", "\"I can walk to the bathroom alone as soon as the catheter is out.\"", "\"If I can't feel my bladder filling, it means it is empty.\"", "\"The itching means I'm allergic and should never have an epidural again.\""], "ans": 0, "topic": "comfort", "cj": "eo", "cats": ["teach", "eval"], "why": "Motor and sensory effects can linger after an epidural, so the first time out of bed should be with help to prevent falls.", "wrong": "Walking alone too early risks a fall. Reduced bladder sensation can hide retention. Itching is a common side effect, not proof of allergy.", "cues": "Residual block; fall risk; bladder sensation.", "safety": "Falls after regional anesthesia are preventable.", "take": "After an epidural: get help the first time up and keep checking the bladder.", "src": "COM slide 22; textbook pp. 57, 73", "hy": false, "case": "c4", "lead": "Grace gave birth at 1648. The epidural catheter was removed at 1730.", "flow": [], "notes": [], "orders": [], "labs": [], "id": "c4-6"}, {"t": "mc", "stem": "Which information is most important for the nurse to confirm before supporting Danielle's trial of labor?", "opts": ["The uterine incision type in the operative report", "The low transverse skin scar on her abdomen", "The reason for her previous cesarean, which was breech", "An estimated fetal weight that is under 4000 g"], "ans": 0, "topic": "proc", "cj": "ac", "cats": ["assess", "prio"], "why": "The type of uterine incision decides whether a trial of labor is safe. A low transverse uterine scar allows TOLAC; a classical (vertical) uterine scar rules it out. The skin scar does not reveal the uterine incision.", "wrong": "A nonrecurring reason like breech and a normal fetal weight improve the odds of success, but neither is the key safety factor.", "cues": "Skin incision does not equal uterine incision.", "safety": "A classical uterine scar has a much higher risk of rupture in labor.", "take": "For TOLAC, the uterine scar matters, not the skin scar.", "src": "CX slides 28, 29, 32; textbook pp. 250, 258-259", "hy": false, "case": "c5", "lead": "The operative report arrives by fax at 1015.", "flow": [], "notes": [], "orders": [], "labs": [], "id": "c5-1"}, {"t": "sata", "stem": "Which elements belong in the nursing plan for Danielle's trial of labor? Select all that apply.", "opts": ["Continuous electronic fetal monitoring", "Maintain IV access with a type and screen available", "Confirm that a surgical and anesthesia team is immediately available", "Watch for sudden pain, loss of station or an abnormal FHR", "Use latex-free equipment", "Avoid epidural analgesia because it is contraindicated with TOLAC", "Use high-dose oxytocin to shorten labor"], "ans": [0, 1, 2, 3, 4], "topic": "proc", "cj": "gs", "cats": ["prio", "assess"], "why": "TOLAC requires continuous monitoring and a facility ready for immediate cesarean, because rupture is the main risk. Abnormal FHR, loss of station and sudden pain are the warning signs. Her latex allergy applies to every procedure.", "wrong": "Epidural analgesia is not contraindicated in TOLAC. Aggressive oxytocin increases the risk of uterine rupture.", "cues": "Previous uterine scar; rupture risk; latex allergy.", "safety": "Be ready for an emergency cesarean at any moment during TOLAC.", "take": "TOLAC: continuous EFM, IV and blood ready, team immediately available, and know the rupture signs.", "src": "CX slides 32, 39; textbook pp. 258-260, 265", "hy": false, "case": "c5", "lead": "The report confirms a low transverse uterine incision. Danielle continues in labor.", "flow": [["1200", "122/74", "82", "98.6", "16 / 99%", "135, moderate var, accels", "q3 min, 60 s", "6 / 90% / 0"]], "notes": [], "orders": [], "labs": [], "id": "c5-2"}, {"t": "hl", "stem": "Highlight the findings that require immediate action.", "segs": [{"x": "<b>1615 Nursing note.</b> "}, {"x": "Sudden sharp, tearing abdominal pain that the epidural does not relieve.", "k": 1}, {"x": " "}, {"x": "FHR dropped from 135 to 70 and has stayed there for 3 minutes.", "k": 1}, {"x": " "}, {"x": "Presenting part was 0 station at 1530; now cannot be reached at -3.", "k": 1}, {"x": " "}, {"x": "Contractions have stopped on the monitor.", "k": 1}, {"x": " "}, {"x": "Maternal HR 126, BP 90/50.", "k": 1}, {"x": " "}, {"x": "Moderate vaginal bleeding.", "k": 1}, {"x": " "}, {"x": "Epidural infusing as ordered.", "k": 0}, {"x": " "}, {"x": "Temperature 98.8&deg;F.", "k": 0}, {"x": " "}, {"x": "Cervix was 8 cm at 1530.", "k": 0}, {"x": " "}, {"x": "Asks for ice chips.", "k": 0}], "topic": "emerg", "cj": "rc", "cats": ["emerg", "assess"], "why": "Uterine rupture shows as an abnormal FHR (most common sign), loss of fetal station, sudden pain, a change in uterine activity, vaginal bleeding and signs of shock in the mother (tachycardia, hypotension).", "wrong": "The epidural, temperature, earlier exam and request for ice chips are not emergency findings.", "cues": "Station lost, FHR crash, maternal shock, pain breaking through an epidural.", "safety": "This is a surgical emergency for both mother and fetus.", "take": "Rupture: the baby goes back up, the heart rate goes down, and the mother goes into shock.", "src": "CX slide 39; textbook pp. 265-266", "hy": true, "case": "c5", "lead": "Danielle had an epidural placed at 1400 and was comfortable. At 1615 she calls out suddenly.", "flow": [["1615", "90/50", "126", "98.8", "22 / 97%", "70 for 3 min", "no contractions on monitor", "presenting part not reachable"]], "notes": [], "orders": [], "labs": [], "id": "c5-3"}, {"t": "bow", "stem": "Complete the bow-tie.", "cond": {"opts": ["Uterine rupture", "Amniotic fluid embolism", "Prolapsed umbilical cord", "Epidural-related hypotension"], "ans": [0]}, "acts": {"opts": ["Activate the emergency response and prepare for immediate cesarean", "Give IV fluids and prepare blood products as ordered", "Increase the oxytocin to restart contractions", "Place her in knee-chest position", "Perform a vaginal exam to lift the presenting part"], "ans": [0, 1]}, "mons": {"opts": ["Maternal heart rate and blood pressure", "Fetal heart rate", "Deep tendon reflexes", "Urine protein", "Blood glucose"], "ans": [0, 1]}, "topic": "emerg", "cj": "ph", "cats": ["emerg", "prio"], "why": "A scarred uterus, loss of station and an FHR crash with maternal shock point to rupture. The fetus must be delivered surgically at once, and the mother needs volume and blood. Maternal VS track shock and the FHR tracks fetal status until birth.", "wrong": "AFE presents with respiratory distress and collapse with coagulopathy, not loss of station. Cord prolapse does not cause loss of station or maternal shock. Knee-chest and lifting the presenting part are for cord prolapse. Oxytocin is contraindicated.", "cues": "Previous cesarean plus the classic rupture signs.", "safety": "Minutes matter: the team, OR and blood bank must be activated now.", "take": "Uterine rupture: call the team, prepare for cesarean, fluids and blood, watch maternal and fetal status.", "src": "CX slides 36, 39, 40; textbook pp. 264-267", "hy": true, "case": "c5", "lead": "The nurse calls for help.", "flow": [], "notes": [], "orders": [], "labs": [], "id": "c5-4"}, {"t": "cloze", "stem": "Complete the nurse's SBAR call to the provider.", "text": "<b>S:</b> Danielle Brooks in room 4 has a suspected {0}. <b>B:</b> She is in a trial of labor after a previous cesarean with a {1}. <b>A:</b> She has {2}. <b>R:</b> I need you here now; I recommend {3}.", "drops": [{"opts": ["uterine rupture", "placental abruption", "epidural complication", "precipitous birth"], "ans": 0}, {"opts": ["low transverse uterine incision", "classical uterine incision", "history of preterm birth", "postterm pregnancy"], "ans": 0}, {"opts": ["sudden pain, loss of station, an FHR of 70 for 3 minutes, HR 126 and BP 90/50", "pain 3/10, cervix 8 cm and a Category I tracing", "a temperature of 98.8&deg;F and a working epidural", "mild itching and requests for ice chips"], "ans": 0}, {"opts": ["an immediate cesarean birth", "increasing the oxytocin", "a repeat exam in 1 hour", "turning off the epidural"], "ans": 0}], "topic": "emerg", "cj": "ta", "cats": ["emerg", "prio"], "why": "A good SBAR states the problem first, gives only the relevant background (the scar), reports the specific abnormal findings with numbers, and makes a clear recommendation for immediate cesarean.", "wrong": "Normal findings do not belong in the assessment of an emergency call, and waiting or increasing oxytocin delays definitive care.", "cues": "Clear, specific and action-focused communication.", "safety": "Closed-loop communication speeds emergency care.", "take": "In an emergency SBAR, lead with the problem and end with exactly what you need.", "src": "CX slides 39, 41; textbook pp. 265-266", "hy": false, "case": "c5", "lead": "The nurse calls the provider using SBAR.", "flow": [], "notes": [], "orders": [], "labs": [], "id": "c5-5"}, {"t": "mc", "stem": "After an emergency cesarean and uterine repair, Danielle received 2 units of packed red blood cells. Which finding best shows that resuscitation is effective?", "opts": ["HR 92, BP 112/68 and urine output 45 mL/h", "HR 124, BP 88/52 and urine output 15 mL/h", "HR 118, BP 96/58 and restless, asking what happened", "HR 96, BP 108/64 and saturating a pad every 15 minutes"], "ans": 0, "topic": "emerg", "cj": "eo", "cats": ["eval"], "why": "A falling heart rate, a recovered BP and urine output over 30 mL/h show organs are being perfused again.", "wrong": "Persistent tachycardia with low BP and low urine output means ongoing shock. Restlessness can be an early sign of hypoxia. Saturating a pad every 15 minutes means active bleeding, even when the numbers look acceptable.", "cues": "Heart rate, BP and urine output together.", "safety": "Ongoing bleeding needs immediate escalation even if vitals look stable for the moment.", "take": "Judge resuscitation by perfusion: HR down, BP up, urine output adequate, no ongoing bleeding.", "src": "CX slide 39; NC slide 22; textbook p. 266", "hy": false, "case": "c5", "lead": "Her baby was born 14 minutes after the call and is in the NICU. Danielle is in recovery.", "flow": [["1800", "112/68", "92", "98.6", "16 / 99%", "", "", ""]], "notes": [], "orders": [], "labs": [], "id": "c5-6"}, {"t": "mc", "stem": "A multigravida has been at 6 cm for 3 hours. An IUPC shows strong contractions every 3 minutes. The fetus is right occiput posterior and she reports intense back pain. Which nursing action best addresses the factor most likely slowing her labor?", "opts": ["Hands-and-knees or side-lying positions to help rotation", "Request an order to strengthen contractions with oxytocin", "Coach her to begin bearing down with each strong contraction", "Limit position changes so the monitor tracing stays continuous"], "ans": 0, "topic": "process", "cj": "ph", "cats": ["prio"], "why": "The powers are adequate (strong contractions on the IUPC), so the problem is the passenger: an OP position. Hands-and-knees and side-lying positions use gravity to help the occiput rotate anterior and relieve back pain.", "wrong": "Oxytocin treats weak powers, which she does not have. Pushing before 10 cm causes cervical swelling. Limiting movement removes the best tool for rotating the baby.", "cues": "Adequate contractions + OP position + back pain = Passenger problem.", "safety": "Treat the P that is actually stuck; adding powers to a malpositioned fetus raises risk without fixing the cause.", "take": "Match the intervention to the P: OP position is a passenger problem solved with maternal position.", "src": "LBP slides 2, 7, 26; NC slide 26; textbook p. 142", "hy": false, "id": "s01"}, {"t": "mc", "stem": "A primigravida at 5 cm is screaming, says she is \"terrified something is wrong,\" and refuses to let anyone touch her. Over the last hour her contractions have become irregular and weaker. Which action is most likely to help labor progress?", "opts": ["Stay with her, explain, and coach slow breathing", "Request an order for oxytocin to restore the contractions", "Leave the room and dim the lights so she can calm down alone", "Tell her firmly that screaming will slow her labor"], "ans": 0, "topic": "process", "cj": "ac", "cats": ["prio"], "why": "Fear releases catecholamines, which weaken contractions. This is the psychologic response (Psyche) slowing labor. Continuous support, information and relaxation lower fear and can restore an effective pattern.", "wrong": "Oxytocin treats the symptom, not the cause. Leaving her or scolding her increases fear.", "cues": "Fear + contractions weakening.", "safety": "Continuous labor support is linked with fewer interventions.", "take": "Fear slows labor. Support is an intervention, not a nicety.", "src": "LBP slide 2; COM slide 7; CX slide 14; textbook pp. 32, 226", "hy": false, "id": "s02"}, {"t": "matrix", "stem": "For each finding, select the factor (P) most directly affecting the labor.", "cols": ["Passenger", "Passageway", "Powers", "Position", "Psyche"], "rows": [{"r": "Fetus in a brow presentation", "a": 0}, {"r": "Contracted, flat (platypelloid) pelvis", "a": 1}, {"r": "Contractions every 8 minutes, mild by palpation, in active labor", "a": 2}, {"r": "Lying flat on her back for 3 hours", "a": 3}, {"r": "Panic and hyperventilation with each contraction", "a": 4}], "topic": "process", "cj": "ac", "cats": ["assess"], "why": "Brow = fetal attitude (passenger). Pelvic shape = passageway. Weak, infrequent contractions = powers. Supine positioning = maternal position. Panic = psychologic response.", "wrong": "Each finding has one main P; for example, a flat pelvis is a bony passageway issue, not a passenger issue, even though both affect fit.", "cues": "Ask: is it the baby, the pelvis, the contractions, how she's lying, or her fear?", "safety": "Naming the P points you to the right fix.", "take": "Five P's: Passenger, Passageway, Powers, Position, Psyche.", "src": "LBP slides 2, 15, 21, 24, 26; textbook p. 1", "hy": false, "id": "s03"}, {"t": "mc", "stem": "A woman at 38 weeks calls the clinic. Which statement shows she understands the signs that labor is approaching?", "opts": ["\"I lost 2 pounds and suddenly had energy to clean the house.\"", "\"My baby moved up higher, so it's easier to breathe and I pee less often.\"", "\"I've gained 4 pounds this week from fluid, so labor must be close.\"", "\"Bright red bleeding that soaks a pad is the bloody show I should expect.\""], "ans": 0, "topic": "process", "cj": "eo", "cats": ["teach", "eval"], "why": "Weight loss of 1 to 3 lb and a surge of energy are signs that labor is approaching.", "wrong": "Lightening means the baby moves down, making breathing easier but urination more frequent. Weight gain is not a sign. Bloody show is pink and small; heavy bright red bleeding needs evaluation.", "cues": "Weight down, energy up, baby down.", "safety": "Heavy bleeding is never normal show.", "take": "Signs before labor: lightening, frequency, energy surge, slight weight loss, bloody show.", "src": "LBP slides 28, 35; textbook pp. 16-17", "hy": false, "id": "s04"}, {"t": "matrix", "stem": "A woman at 39 weeks is being evaluated in triage. Indicate whether each finding suggests true labor or false labor.", "cols": ["True labor", "False labor"], "rows": [{"r": "Contractions ease after she walks the halls", "a": 1}, {"r": "Cervix changes from 2 cm to 4 cm in 2 hours", "a": 0}, {"r": "Discomfort felt mainly above the umbilicus", "a": 1}, {"r": "Pain begins in the back and wraps to the abdomen", "a": 0}, {"r": "Contractions stay irregular and do not get closer together", "a": 1}, {"r": "Contractions get stronger and closer even with rest", "a": 0}], "topic": "stages", "cj": "ac", "cats": ["assess"], "why": "The deciding finding is cervical change. True labor contractions get stronger with walking and do not stop with rest; pain starts in the back and wraps forward. False labor is irregular, eases with activity or rest, and is often felt above the umbilicus.", "wrong": "Pain intensity alone does not separate them; false labor can be very uncomfortable.", "cues": "Cervical change; effect of walking and rest.", "safety": "EMTALA still requires an assessment before a woman is discharged as not in labor.", "take": "True labor changes the cervix. False labor does not.", "src": "NC slide 3; textbook p. 105", "hy": false, "id": "s05"}, {"t": "mc", "stem": "A woman gave birth at 1510 and the placenta delivered at 1525. At 1600 her BP is 108/70, pulse 88, fundus firm at the umbilicus, lochia moderate. What is the nurse's plan?", "opts": ["Keep checking VS, fundus and lochia every 15 min until 1725", "Move to routine every-4-hour checks because her findings are stable now", "Recheck at 1725 because the fourth stage ends 2 hours after the birth", "Stop fundal checks because the uterus is firm"], "ans": 0, "topic": "stages", "cj": "gs", "cats": ["assess"], "why": "The fourth stage starts when the placenta delivers (1525) and lasts about 2 hours, until about 1725. Hemorrhage is the main risk, so BP, pulse, fundus and lochia are checked every 15 minutes during this time.", "wrong": "Stable findings now do not end the fourth stage. The stage is timed from the placenta, not the birth. A firm fundus can become boggy later.", "cues": "Time from placental delivery.", "safety": "Most postpartum hemorrhages happen in the first hours.", "take": "Fourth stage = 2 hours from the placenta; vital signs and fundus every 15 minutes.", "src": "LBP slide 29; NC slide 22; textbook pp. 178, 183", "hy": false, "id": "s06"}, {"t": "order", "stem": "Place the cardinal movements of labor for a vertex presentation in order.", "items": ["Engagement", "Descent", "Flexion", "Internal rotation", "Extension", "Restitution and external rotation", "Expulsion"], "topic": "process", "cj": "ac", "cats": ["assess"], "why": "The head engages, descends, flexes to present its smallest diameter, rotates so the occiput is anterior, extends under the pubic arch, turns back to line up with the shoulders, and then the shoulders and body are expelled.", "wrong": "Extension cannot happen before internal rotation, because the occiput must be anterior to pass under the pubic arch.", "cues": "Each movement sets up the next.", "safety": "Knowing the sequence helps you spot when a step fails (for example, a persistent OP).", "take": "Engagement, Descent, Flexion, Internal rotation, Extension, External rotation, Expulsion.", "src": "LBP slides 30-32; textbook pp. 20-23", "hy": false, "id": "s07"}, {"t": "mc", "stem": "During a strong contraction, a laboring woman's BP is 148/90. Her prior readings were 118 to 122 over 72 to 76. What should the nurse do first?", "opts": ["Recheck the BP between contractions, side-lying", "Notify the provider now of possible new-onset preeclampsia", "Start magnesium sulfate per the hypertension protocol", "Document the reading as her new baseline"], "ans": 0, "topic": "adapt", "cj": "ac", "cats": ["assess"], "why": "BP rises during contractions as a normal adaptation, so readings are taken between contractions. A single reading during a contraction is not reliable enough to act on.", "wrong": "Calling the provider or starting magnesium based on a reading taken at the wrong time leads to unnecessary treatment. It should not be documented as baseline either.", "cues": "Timing of the measurement.", "safety": "If the BP stays elevated between contractions, then escalate.", "take": "Measure BP between contractions.", "src": "LBP slide 34; textbook p. 25", "hy": false, "id": "s08"}, {"t": "sata", "stem": "Which findings are expected physiologic adaptations during active labor? Select all that apply.", "opts": ["WBC of 20,000/mm3", "1+ proteinuria", "BP rising during contractions", "Slowed gastric emptying with nausea", "Temperature of 101.0&deg;F", "FHR baseline of 175 for 15 minutes"], "ans": [0, 1, 2, 3], "topic": "adapt", "cj": "rc", "cats": ["assess"], "why": "Labor raises the WBC count, can cause 1+ proteinuria from muscle breakdown, raises BP during contractions, and slows gastric emptying.", "wrong": "A temperature of 100.4&deg;F or higher and fetal tachycardia over 160 are not normal and suggest infection or another problem.", "cues": "Separate the labor-related changes from signs of infection.", "safety": "Do not explain away fever just because WBC can rise in labor.", "take": "Normal labor raises WBC and BP during contractions; it does not cause fever or fetal tachycardia.", "src": "LBP slides 33, 34; textbook pp. 24-26", "hy": false, "id": "s09"}, {"t": "cloze", "stem": "A woman at 9 cm describes sharp, burning pain in her perineum. Complete the nurse's analysis.", "text": "This pain is {0} pain. It is carried mainly by the {1}. Late in the second stage, the block that relieves this area is a {2}.", "drops": [{"opts": ["somatic", "visceral", "referred", "ischemic"], "ans": 0}, {"opts": ["pudendal nerve (S2 to S4)", "T10 to L1 nerve roots", "phrenic nerve", "femoral nerve"], "ans": 0}, {"opts": ["pudendal block", "intradermal water block", "spinal headache patch", "local infiltration of the cervix"], "ans": 0}], "topic": "comfort", "cj": "ac", "cats": ["assess"], "why": "Sharp, burning, localized perineal pain is somatic and comes from stretching of the perineum and pelvic floor, carried by the pudendal nerve. A pudendal block given late in the second stage numbs this area.", "wrong": "Visceral pain from the uterus is diffuse and travels through T10 to L1. Water blocks treat back pain.", "cues": "Localized, sharp, burning, perineal.", "safety": "A pudendal block does not change maternal VS or FHR but can lessen the urge to push.", "take": "Visceral = vague uterine cramping (T10-L1). Somatic = sharp perineal (pudendal).", "src": "COM slides 2, 3, 14, 16; textbook pp. 29, 54", "hy": false, "id": "s10"}, {"t": "mc", "stem": "A woman in active labor takes methadone daily and asks for pain medication. The order reads butorphanol 1 mg IV. What should the nurse do?", "opts": ["Hold the dose and contact the provider for a different option", "Give the dose slowly at the start of a contraction", "Give the dose with naloxone ready in case of respiratory depression", "Give half the dose to reduce the risk of sedation"], "ans": 0, "topic": "comfort", "cj": "ta", "cats": ["med", "prio"], "why": "Butorphanol is an opioid agonist-antagonist. In opioid-dependent women it can cause withdrawal in both mother and newborn, so the order needs to be clarified.", "wrong": "Giving any amount risks withdrawal. Naloxone would also cause withdrawal in an opioid-dependent woman.", "cues": "Daily methadone + agonist-antagonist order.", "safety": "Check every drug against the patient's history before giving it.", "take": "Agonist-antagonists (butorphanol, nalbuphine) cause withdrawal in opioid-dependent women.", "src": "COM slide 13; textbook pp. 50-51, 53", "hy": true, "id": "s11"}, {"t": "mc", "stem": "A woman received IV fentanyl 40 minutes ago. She is now 10 cm, +3 station, and birth is imminent. Which action is the priority?", "opts": ["Alert the newborn team to the opioid timing", "Give naloxone to the mother now to protect the newborn", "Delay pushing for 2 hours until the opioid wears off", "Give a second dose so she can push comfortably"], "ans": 0, "topic": "comfort", "cj": "ph", "cats": ["med", "prio"], "why": "Opioids cross the placenta and can depress newborn breathing when given close to birth. The team needs to know so they are ready to support the newborn's breathing.", "wrong": "Giving naloxone to the mother reverses her pain relief and is not indicated without maternal respiratory depression. Delaying birth is unsafe. Another dose increases newborn risk.", "cues": "Opioid given within the hour before birth.", "safety": "Respiratory depression is the most serious opioid side effect for both mother and newborn.", "take": "Opioid close to birth: alert the newborn team.", "src": "COM slide 13; textbook pp. 46, 51, 70", "hy": false, "id": "s12"}, {"t": "sata", "stem": "A woman at 6 cm with an OP fetus has severe back pain. She has no epidural, her temperature is 98.9&deg;F and membranes are intact. Which comfort measures are appropriate? Select all that apply.", "opts": ["Firm counterpressure to the sacrum", "Hands-and-knees position", "Warm water immersion in the tub with the nurse checking on her", "Intradermal sterile water injections in the low back as ordered", "Lying flat on her back with her legs elevated", "Leaving her alone in the tub so she can relax"], "ans": [0, 1, 2, 3], "topic": "comfort", "cj": "gs", "cats": ["prio"], "why": "Counterpressure, hands-and-knees, hydrotherapy and sterile water blocks all relieve back labor. She is afebrile, so the tub is acceptable.", "wrong": "Supine positioning worsens back pain and can cause hypotension. A woman in the tub is never left alone.", "cues": "OP + back pain + afebrile.", "safety": "Do not use the tub with a temperature of 100.4&deg;F or higher.", "take": "Back labor: push back on the sacrum, get off the back, try water.", "src": "COM slides 9, 10, 11; textbook pp. 39-42", "hy": false, "id": "s13"}, {"t": "mc", "stem": "The day after a cesarean with spinal anesthesia, a woman reports a severe headache that improves when she lies flat and gets worse when she sits up. What should the nurse do?", "opts": ["Keep her flat, encourage fluids, notify anesthesia", "Give the ordered opioid and encourage early walking", "Raise the head of the bed to 90 degrees to ease the pressure", "Reassure her that this is a normal postoperative headache"], "ans": 0, "topic": "comfort", "cj": "ta", "cats": ["assess", "prio"], "why": "A headache that worsens upright and improves lying down is a post-dural puncture headache from CSF leakage. Conservative care includes lying flat and fluids; anesthesia may perform an autologous blood patch if it does not resolve.", "wrong": "Sitting up and walking make it worse. It is a specific complication, not a routine headache.", "cues": "Positional headache after a spinal.", "safety": "Report positional headaches so anesthesia can treat them.", "take": "Spinal headache: worse upright; treat with lying flat, fluids and possibly a blood patch.", "src": "COM slides 17, 19; textbook p. 57", "hy": false, "id": "s14"}, {"t": "hl", "stem": "A woman in active labor says, \"I'm fine,\" when asked about pain. Her culture discourages showing pain. Highlight the findings that suggest she has unrelieved pain.", "segs": [{"x": "Lies very still with her fists clenched during contractions.", "k": 1}, {"x": " "}, {"x": "Maternal HR rose from 84 to 110 over the last hour.", "k": 1}, {"x": " "}, {"x": "Grimaces and holds her breath with each contraction.", "k": 1}, {"x": " "}, {"x": "Says, \"I'm fine,\" quietly.", "k": 0}, {"x": " "}, {"x": "Cervix 6 cm.", "k": 0}, {"x": " "}, {"x": "Husband at the bedside.", "k": 0}, {"x": " "}, {"x": "BP 122/76 between contractions.", "k": 0}], "topic": "comfort", "cj": "rc", "cats": ["assess"], "why": "Expression of pain varies by culture. Clenched fists, rising heart rate, grimacing and breath-holding are nonverbal signs of significant pain even when she denies it.", "wrong": "Her words, dilation, support person and BP do not show pain level.", "cues": "Nonverbal behavior and physiologic signs.", "safety": "Assess pain repeatedly and offer options; do not take a quiet patient as pain-free.", "take": "Pain threshold is similar for everyone; how it is expressed is not.", "src": "COM slides 5, 6; textbook pp. 30-31", "hy": false, "id": "s15"}, {"t": "matrix", "stem": "Classify each FHR tracing.", "cols": ["Category I", "Category II", "Category III"], "rows": [{"r": "Baseline 135, moderate variability, accelerations, early decelerations", "a": 0}, {"r": "Baseline 150, minimal variability, no decelerations", "a": 1}, {"r": "Absent variability with recurrent late decelerations", "a": 2}, {"r": "Baseline 170, moderate variability, no decelerations", "a": 1}, {"r": "Smooth sine-wave pattern for 25 minutes", "a": 2}, {"r": "Baseline 140, moderate variability, recurrent variables that recover quickly", "a": 1}], "topic": "fhr", "cj": "ac", "cats": ["assess"], "why": "Category I needs a normal baseline, moderate variability and no lates or variables. Category III is absent variability with recurrent lates, recurrent variables or bradycardia, or a sinusoidal pattern. Everything else, including tachycardia, minimal variability, and recurrent variables with moderate variability, is Category II.", "wrong": "Recurrent variables with moderate variability are Category II, not III; variability is what separates them.", "cues": "Variability and the type of recurrent decelerations.", "safety": "Category III needs prompt intervention and often expedited birth.", "take": "Category II is everything that is not clearly I or III.", "src": "FA slides 14, 16, 28; textbook pp. 77, 96", "hy": true, "id": "s16"}, {"t": "mc", "stem": "The FHR baseline has been 168 for 20 minutes with moderate variability and no decelerations. The mother's temperature is 101.3&deg;F and her membranes ruptured 20 hours ago. What is the nurse's priority?", "opts": ["Notify the provider; give an antipyretic as ordered", "Prepare for an immediate cesarean birth", "Start fetal scalp stimulation", "Increase the oxytocin to speed the birth"], "ans": 0, "topic": "fhr", "cj": "ph", "cats": ["prio", "assess"], "why": "Maternal fever is the most common cause of fetal tachycardia. Treating the cause (fever and possible infection) usually brings the baseline down. Moderate variability shows the fetus is still oxygenated.", "wrong": "A cesarean is not indicated for tachycardia with moderate variability. Scalp stimulation tests for acidemia, which is unlikely with moderate variability. Oxytocin does not treat infection.", "cues": "Fever + long ROM + tachycardia + moderate variability.", "safety": "Watch for decreasing variability or decels, which would mean worsening fetal status.", "take": "Fetal tachycardia: look at mom's temperature first.", "src": "FA slides 17, 18; CX slide 9; textbook p. 88", "hy": false, "id": "s17"}, {"t": "mc", "stem": "During a vaginal exam, the membranes rupture and the FHR suddenly drops from 140 to 85 and stays there for 2 minutes. What should the nurse do first?", "opts": ["Keep her hand in place and feel for the cord", "Remove the hand and turn her to her left side right away", "Start oxygen at 10 L/min and recheck in 10 minutes", "Document a prolapsed deceleratio
