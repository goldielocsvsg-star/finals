const SOLO_QS=[
/* ---- T1 Physiologic & behavioral adaptations (5) ---- */
{id:'s01',t:'mc',topic:'t1',cj:'ac',cats:['as'],hy:false,
 stem:`A 12-hour-old term newborn born after a prolonged second stage has a firm swelling over the right parietal bone that stops at the suture line. A second newborn has soft, edematous swelling that crosses the suture lines. Which plan is most appropriate?`,
 opts:[`Monitor the infant with swelling limited to the suture line for hyperbilirubinemia as the blood is reabsorbed`,`Notify the provider immediately about the swelling that crosses the suture lines`,`Aspirate the swelling that stops at the suture line to prevent infection`,`Apply warm compresses to both swellings to speed resolution`],ans:0,
 why:`<b>What:</b> The first infant has a <b>cephalhematoma</b> (bleeding beneath the periosteum, so it is bounded by the suture lines); the second has <b>caput succedaneum</b> (scalp edema that crosses sutures). <b>Why:</b> A cephalhematoma contains blood; as red cells break down over days to weeks, the extra bilirubin load raises the risk of jaundice.`,
 wrong:`Caput is expected after a long labor and resolves in a few days — it doesn't need urgent notification. A cephalhematoma is never aspirated (infection risk); warm compresses are not indicated for either.`,
 cues:`Swelling that does not cross sutures (cephalhematoma) vs edema that crosses sutures (caput).`,
 safety:`A diffuse, boggy swelling that crosses sutures and keeps enlarging, with pallor or tachycardia, suggests subgaleal hemorrhage — an emergency.`,
 ev:`Swelling decreasing; bilirubin trend within safe range.`,
 take:`Caput crosses sutures (edema). Cephalhematoma doesn't (blood) → watch bilirubin.`,
 src:`${L.pba}, slide 23 (skeletal system — caput succedaneum, cephalhematoma, subgaleal hemorrhage); ${L.tb}, pp. 515–516, 519–520.`},
{id:'s02',t:'matrix',topic:'t1',cj:'rc',cats:['as'],hy:false,
 stem:`During the newborn exam at 18 hours of age, classify each finding.`,cols:[`Expected variation`,`Report to the provider`],
 rows:[{x:`Blue-gray patches over the sacrum and buttocks`,ans:0},{x:`Blotchy red macules with pale centers on the trunk`,ans:0},{x:`Yellow skin color on the face and chest at 18 hours`,ans:1},{x:`Swelling of breast tissue in a male infant`,ans:0},{x:`Widespread petechiae on the trunk and extremities`,ans:1},{x:`Small white papules over the nose and chin`,ans:0}],
 why:`<b>What:</b> Normal newborn integumentary and reproductive variants vs findings that suggest disease. <b>Why:</b> Mongolian spots, erythema toxicum, milia and maternal-hormone breast swelling are benign. Jaundice before 24 h suggests a pathologic process (often hemolysis); widespread petechiae suggest low platelets or infection.`,
 wrong:`Mongolian spots should be documented (so they aren't mistaken for bruises) but are not abnormal. Breast swelling occurs in both sexes from maternal hormones.`,
 cues:`Timing of jaundice (<24 h), distribution of petechiae.`,
 safety:`Jaundice in the first 24 hours is always reported.`,
 ev:`Provider evaluation; bilirubin and CBC as ordered.`,
 take:`Jaundice <24 h and widespread petechiae are never "normal newborn skin."`,
 src:`${L.pba}, slides 17 (integumentary — Mongolian spots, nevi), 19 (reproductive — breast swelling), 15 (hepatic — bilirubin); ${L.tb}, pp. 515–517.`},
{id:'s03',t:'cloze',topic:'t1',cj:'ac',cats:['as'],hy:false,
 stem:`A nursing student asks how circulation changes at birth. Complete the nurse's explanation.`,
 text:`When the cord is clamped and the infant breathes, pulmonary vascular resistance {0} and systemic vascular resistance {1}. Pressure in the left atrium becomes higher than in the right, which closes the {2}. Rising blood oxygen levels cause the {3} to constrict.`,
 drops:[{opts:[`falls`,`rises`,`stays the same`],ans:0},{opts:[`rises`,`falls`,`stays the same`],ans:0},{opts:[`foramen ovale`,`ductus arteriosus`,`ductus venosus`,`mitral valve`],ans:0},{opts:[`ductus arteriosus`,`foramen ovale`,`umbilical vein`,`aorta`],ans:0}],
 why:`<b>What:</b> Fetal-to-newborn circulatory transition. <b>Why:</b> Lung expansion and oxygen dilate pulmonary vessels (↓ resistance); removing the low-resistance placenta ↑ systemic resistance. More pulmonary venous return raises left atrial pressure, pushing the foramen ovale flap closed. Higher oxygen tension and falling prostaglandins constrict the ductus arteriosus.`,
 wrong:`If pulmonary resistance stayed high, blood would continue to bypass the lungs (persistent fetal circulation). The ductus venosus closes because umbilical flow stops, not because of atrial pressure.`,
 cues:`First breath, cord clamping, oxygen.`,
 safety:`Defects that rely on these shunts can become symptomatic when they close.`,
 ev:`Student correctly links each shunt to the pressure or oxygen change that closes it.`,
 take:`↓ pulmonary resistance + ↑ systemic resistance → foramen ovale closes; ↑ O₂ → ductus arteriosus constricts.`,
 src:`${L.pba}, slide 8 (cardiovascular adjustments); ${L.chd}, slide 10 (fetal circulation); ${L.tb}, pp. 512–513.`},
{id:'s04',t:'mc',topic:'t1',cj:'rc',cats:['as','em'],hy:false,
 stem:`A 6-hour-old newborn weighing 4,300 g was born after a shoulder dystocia. Which reflex finding should the nurse report?`,
 opts:[`Moro reflex present on the left but absent on the right`,`Toes fan outward when the sole is stroked`,`Stepping movements when held upright with feet on a surface`,`Extends the arm on the side the head is turned toward`],ans:0,
 why:`<b>What:</b> An asymmetric Moro reflex suggests a brachial plexus injury or fractured clavicle on the absent side. <b>Why:</b> The Moro requires symmetric arm movement; nerve injury or a painful fracture prevents movement on the affected side. Shoulder dystocia in a large infant is the classic cause.`,
 wrong:`A positive Babinski (fanning toes), stepping and the tonic neck reflex are all normal newborn reflexes.`,
 cues:`Large infant, shoulder dystocia, asymmetry.`,
 safety:`Handle gently and avoid lifting under the arms until evaluated.`,
 ev:`Provider evaluation; x-ray if fracture is suspected.`,
 take:`Newborn reflexes should be symmetric — asymmetry is the red flag.`,
 src:`${L.pba}, slide 27 (neuromuscular reflexes); ${L.hr}, slides 3–4 (birth injuries — Erb palsy, skeletal injuries); ${L.tb}, pp. 531, 609–613.`},
{id:'s05',t:'sata',topic:'t1',cj:'rc',cats:['as'],hy:false,
 stem:`At 40 hours of age, which findings are expected gastrointestinal, renal and hepatic adaptations? <b>Select all that apply.</b>`,
 opts:[`Small regurgitation of milk after feedings`,`Pink-orange "brick dust" stains in the diaper`,`Transitional greenish-brown stools`,`Mild jaundice of the face appearing on day 2`,`Green (bilious) vomiting after every feeding`,`No stool since birth with a distended abdomen`],ans:[0,1,2,3],
 why:`<b>What:</b> Normal early GI, renal and hepatic function. <b>Why:</b> The cardiac sphincter is immature (small spit-ups); uric acid crystals cause brick-dust stains in the first days; stools change from meconium to transitional; physiologic jaundice appears after 24 hours as the immature liver conjugates a large bilirubin load.`,
 wrong:`Bilious vomiting suggests intestinal obstruction (an emergency); no meconium with distention suggests obstruction or another anomaly — both need prompt reporting.`,
 cues:`Age 40 h; color and pattern of output.`,
 safety:`Green vomiting is an emergency until proven otherwise.`,
 ev:`Continued normal stooling, voiding and feeding; bilirubin within safe range.`,
 take:`Normal: spit-ups, brick dust, meconium → transitional stools, jaundice after 24 h. Abnormal: bilious vomiting, no meconium with distention.`,
 src:`${L.pba}, slides 13 (renal), 14 (GI — meconium, stools), 15 (hepatic — bilirubin); ${L.tb}, pp. 515–517. Bilious vomiting as obstruction sign: ${L.sup}`},

/* ---- T2 Nursing care of the newborn & family (6) ---- */
{id:'s06',t:'mc',topic:'t2',cj:'rc',cats:['as','em'],hy:true,
 stem:`Two hours after a Gomco clamp circumcision, the nurse checks the infant. Which finding requires immediate action?`,
 opts:[`Bright red blood steadily saturating the petroleum gauze`,`A small spot of blood on the diaper`,`Fussiness during the diaper change`,`Infant has not voided since the procedure 2 hours ago`],ans:0,
 why:`<b>What:</b> Active postoperative bleeding. <b>Why:</b> Hemorrhage is the most serious early complication of circumcision; steady bleeding is not normal oozing and requires pressure and provider notification.`,
 wrong:`A small spot of blood is expected. Fussiness is expected — use comfort measures and analgesia as ordered. Voiding should be monitored (the first void is documented), but 2 hours without voiding is not yet urgent.`,
 cues:`Steady, saturating bright red bleeding.`,
 safety:`Apply gentle pressure with sterile gauze and notify the provider.`,
 ev:`Bleeding controlled; infant voids within the expected time.`,
 take:`After circumcision: watch bleeding (most urgent) and the first void; yellowish exudate on day 2–3 is normal healing.`,
 src:`${L.nc}, slide 15 (therapeutic procedures — circumcision), 16 (neonatal pain); ${L.tb}, pp. 564–568.`},
{id:'s07',t:'order',topic:'t2',cj:'ph',cats:['pi'],hy:false,
 stem:`A vigorous term newborn is placed on the mother's abdomen. Place the nurse's actions in the first two hours in order of priority.`,
 items:[`Assess airway and breathing; clear secretions if needed`,`Assess heart rate`,`Dry the infant and keep skin-to-skin with a warm blanket and hat`,`Apply matching identification bands before mother and infant are separated`,`Administer vitamin K and erythromycin eye prophylaxis`,`Weigh and measure the infant`],
 why:`<b>What:</b> Prioritizing care from birth through 2 hours. <b>Why:</b> The lecture priority is establishing effective respirations; circulation follows; heat loss begins within seconds; identification must precede any separation; prophylaxis is time-sensitive but not immediate; measurements require removing the infant from warmth.`,
 wrong:`Weighing first exposes the infant to cold; prophylaxis can be given after the first hour of skin-to-skin.`,
 cues:`Vigorous infant — routine sequence.`,
 safety:`Airway → circulation → warmth → identification → medications → measurements.`,
 ev:`Warm, identified, stable infant with prophylaxis given within policy timeframes.`,
 take:`ABCs, then warmth, then safety/ID, then everything else.`,
 src:`${L.nc}, slides 2–3, 8 (immediate interventions: airway, oxygen supply, temperature, eye prophylaxis, vitamin K, parent–infant interaction); ${L.tb}, pp. 553–556.`},
{id:'s08',t:'sata',topic:'t2',cj:'eo',cats:['ev','teach'],hy:false,
 stem:`Which findings indicate a 30-hour-old newborn is ready for discharge? <b>Select all that apply.</b>`,
 opts:[`Stable temperature in an open crib for more than 12 hours`,`At least two successful feedings`,`Has voided and passed at least one stool`,`Parents demonstrate correct rear-facing car seat use`,`Jaundice that first appeared at 18 hours of age`,`Respiratory rate of 72 with intermittent grunting`],ans:[0,1,2,3],
 why:`<b>What:</b> Discharge readiness. <b>Why:</b> Readiness requires physiologic stability (temperature, breathing, feeding, elimination) and caregiver competence (car seat, feeding, cord care, illness signs).`,
 wrong:`Jaundice before 24 hours needs evaluation; RR >60 with grunting is respiratory distress — neither infant should go home.`,
 cues:`Stable temperature, feeding, elimination, safe transport.`,
 safety:`Unstable findings delay discharge.`,
 ev:`All criteria met and teaching demonstrated before discharge.`,
 take:`Discharge readiness = stable vitals/temperature + feeding + voiding/stooling + competent caregivers + safe car seat.`,
 src:`${L.nc}, slides 17–18 (discharge planning and teaching); ${L.tb}, pp. 573–579.`},
{id:'s09',t:'cloze',topic:'t2',cj:'ac',cats:['as'],hy:false,
 stem:`Complete the nurse's documentation for a term newborn at 1 hour of age.`,
 text:`Head circumference 34 cm and chest circumference 32 cm are {0}. Axillary temperature 97.3°F is {1}. Apical HR 98 at rest, counted for 1 full minute, is {2}, so the nurse will {3}.`,
 drops:[{opts:[`within the expected range`,`a sign of microcephaly`,`a sign of hydrocephalus`],ans:0},{opts:[`below the expected range`,`within the expected range`,`above the expected range`],ans:0},{opts:[`below the expected range`,`within the expected range`,`expected during sleep`],ans:0},{opts:[`reassess and notify the provider`,`recheck at the next routine vital-sign time`,`document it as normal`],ans:0}],
 why:`<b>What:</b> Interpreting baseline measurements and vital signs. <b>Why:</b> Head circumference 32–36 cm with the chest about 2 cm smaller is expected. Axillary temperature should be 97.7–99.5°F and resting HR 120–160 per the textbook.`,
 wrong:`34 cm is normal (not micro- or hydrocephaly). 97.3°F is low. A resting HR of 98 is bradycardic for a newborn even during sleep and isn't deferred to the next routine check.`,
 cues:`HC 34, chest 32; T 97.3°F; HR 98 at rest.`,
 safety:`Abnormal cardiorespiratory values are reassessed promptly and escalated.`,
 ev:`Temperature ≥97.7°F after warming; HR evaluated by the provider.`,
 take:`Newborn norms (textbook): HR 120–160, RR 30–60, axillary 97.7–99.5°F, HC 32–36 cm, chest ~2 cm less.`,
 src:`${L.nc}, slides 3 (vital signs, baseline measurements), 5 (gestational age assessment); ${L.tb}, pp. 540, 552–553.`},
{id:'s10',t:'mc',topic:'t2',cj:'eo',cats:['ev','pi'],hy:false,
 stem:`During a heel stick, the nurse uses swaddling, skin-to-skin contact and nonnutritive sucking. Which finding best indicates these measures were effective?`,
 opts:[`The infant returns to a quiet alert state with relaxed face and HR back to baseline within minutes`,`The infant cries loudly throughout the procedure`,`The infant becomes limp and difficult to arouse afterward`,`The heel stick was completed on the first attempt`],ans:0,
 why:`<b>What:</b> Evaluating neonatal pain management. <b>Why:</b> Newborns show pain through behavior (cry, facial grimace, body movement) and physiology (HR, SpO₂); effective comfort measures shorten the response and return the infant to baseline.`,
 wrong:`Continuous crying shows unrelieved pain. Limpness and poor arousability are abnormal and need assessment. A successful stick is a procedural outcome, not a pain outcome.`,
 cues:`Facial expression, state, HR returning to baseline.`,
 safety:`Combine nonpharmacologic measures with ordered analgesia for more painful procedures.`,
 ev:`This is the evaluation.`,
 take:`Pain evaluation = return to baseline behavior and vital signs.`,
 src:`${L.nc}, slide 16 (neonatal pain — responses, assessment, management); ${L.tb}, pp. 565, 593 (nonnutritive sucking).`},
{id:'s11',t:'matrix',topic:'t2',cj:'ac',cats:['as','em'],hy:true,
 stem:`The nurse reviews critical congenital heart disease (CCHD) pulse-oximetry screens done at 26 hours (right hand / foot). Classify each result.`,cols:[`Pass`,`Repeat screen`,`Immediate evaluation`],
 rows:[{x:`98% / 97%`,ans:0},{x:`97% / 93%`,ans:1},{x:`95% / 95%`,ans:1},{x:`94% / 88%`,ans:2},{x:`99% / 98%`,ans:0}],
 why:`<b>What:</b> Interpreting the CCHD screening algorithm in the textbook. <b>Why:</b> A pass requires >95% in both the right hand and a foot with less than a 3% difference. Any reading below 90% requires immediate evaluation. Results in between (≤95% or ≥3% difference) are repeated.`,
 wrong:`95% is not >95%. A 4% difference is ≥3%. A foot reading of 88% is below 90% — immediate evaluation, not a repeat.`,
 cues:`Absolute values and hand–foot difference.`,
 safety:`A low foot saturation can reflect ductal-dependent systemic flow — the infant can deteriorate suddenly as the ductus closes.`,
 ev:`Correct follow-up for each infant.`,
 take:`CCHD screen: pass >95% both and <3% difference; <90% = immediate evaluation; otherwise repeat.`,
 src:`${L.nc}, slide 13 (universal newborn screening); ${L.tb}, pp. 560–562 (pulse oximetry screening).`},

/* ---- T3 Newborn nutrition & feeding (3) ---- */
{id:'s12',t:'mc',topic:'t3',cj:'ta',cats:['teach'],hy:false,
 stem:`A mother of a 30-week preterm infant in the NICU says, "I pump twice a day when I come to visit, and I only pump as much as the baby takes." What is the nurse's best response?`,
 opts:[`"Milk supply depends on frequent removal — pumping every 2 to 3 hours, including at night, will help you build and keep your supply."`,`"That's perfect; matching what the baby takes prevents waste."`,`"A glass of wine before pumping will help you relax and let down."`,`"Pump only when your breasts feel full."`],ans:0,
 why:`<b>What:</b> Establishing milk supply for a hospitalized preterm infant. <b>Why:</b> Lactation works by supply and demand — frequent, regular milk removal (every 2–3 h, including nights) signals continued production. A preterm infant's small intake will increase over time; supply must be built ahead of demand.`,
 wrong:`Matching current intake or pumping only when full undershoots supply. Alcohol passes into breast milk and does not improve let-down.`,
 cues:`Preterm, hospitalized, pumping only twice daily.`,
 safety:`Breast milk lowers the risk of NEC and infection in preterm infants — protecting supply matters.`,
 ev:`Mother pumps 8 or more times per 24 h and reports increasing volumes.`,
 take:`Pump every 2–3 h, day and night, for a hospitalized infant (lecture NCLEX item).`,
 src:`${L.nf}, slides 5 (lactation physiology — supply and demand), 12 (expressing milk), 18 (lecture question: pump every 2–3 h including at night); ${L.tb}, pp. 579–583, 598.`},
{id:'s13',t:'sata',topic:'t3',cj:'gs',cats:['pi','teach'],hy:false,
 stem:`On postpartum day 3 a breastfeeding mother has hard, painful, warm breasts bilaterally, and her infant has trouble latching. She is afebrile. Which interventions should the nurse recommend? <b>Select all that apply.</b>`,
 opts:[`Breastfeed frequently, at least every 2–3 hours`,`Hand express or pump briefly to soften the areola before latching`,`Apply cold compresses between feedings for comfort`,`Wear a supportive, well-fitting bra`,`Skip feedings until the breasts are less painful`,`Bind the breasts tightly`],ans:[0,1,2,3],
 why:`<b>What:</b> Engorgement. <b>Why:</b> Increased milk volume plus vascular congestion and edema distend the breast; frequent milk removal relieves it, softening the areola allows a deep latch, and cold reduces swelling.`,
 wrong:`Skipping feedings worsens engorgement and can lead to plugged ducts/mastitis and lower supply. Binding is used to suppress lactation, not for a breastfeeding mother.`,
 cues:`Bilateral, day 3, afebrile — engorgement rather than mastitis (usually unilateral with fever/flu-like symptoms).`,
 safety:`Fever, a red wedge-shaped area or flu-like symptoms → evaluate for mastitis; continue milk removal.`,
 ev:`Softer breasts, effective latch, audible swallowing, less pain.`,
 take:`Engorgement: frequent milk removal, soften areola before latch, cold between feeds, supportive bra.`,
 src:`${L.nf}, slide 14 (common concerns — engorgement, sore nipples, insufficient supply); ${L.tb}, pp. 602–604.`},
{id:'s14',t:'cloze',topic:'t3',cj:'gs',cats:['teach','med'],hy:false,
 stem:`Complete the nurse's formula-feeding teaching.`,
 text:`Prepare powdered formula {0}. Hold the infant semi-upright and {1}. Throw away formula left in the bottle {2}. Warm a bottle {3}.`,
 drops:[{opts:[`exactly as the label directs`,`with extra water to prevent constipation`,`with less water to add calories`,`with fruit juice for vitamins`],ans:0},{opts:[`never prop the bottle`,`prop the bottle at night`,`add infant cereal to the bottle`,`enlarge the nipple hole`],ans:0},{opts:[`after the feeding`,`after 24 hours in the refrigerator`,`only if it smells sour`,`at the next day's first feeding`],ans:0},{opts:[`in a container of warm water, then test a few drops on the wrist`,`in the microwave`,`on the stovetop until boiling`,`it doesn't need testing`],ans:0}],
 why:`<b>What:</b> Formula-feeding safety. <b>Why:</b> Over-dilution causes poor growth and water intoxication (hyponatremia); over-concentration causes excess renal solute load and dehydration. Leftover formula is contaminated by saliva. Microwaves create hot spots that burn. Propping increases aspiration and ear infections and removes interaction.`,
 wrong:`Each distractor is a common unsafe practice.`,
 cues:`Preparation, feeding technique, storage and warming.`,
 safety:`Do not change the concentration unless prescribed.`,
 ev:`Parent demonstrates correct preparation (return demonstration).`,
 take:`Formula: exact dilution, never prop, discard leftovers, no microwave.`,
 src:`${L.nf}, slides 16–17 (formula feeding — preparation, techniques); ${L.tb}, pp. 604–607.`},

/* ---- T4 High-risk newborn (6) ---- */
{id:'s15',t:'mc',topic:'t4',cj:'gs',cats:['pi'],hy:false,
 stem:`After a difficult birth, a newborn's right arm hangs limp, adducted and internally rotated with the elbow extended. The Moro reflex is absent on the right, but the grasp reflex is present. Which plan is most appropriate?`,
 opts:[`Handle the arm gently, support it in a neutral position, and plan range-of-motion exercises as ordered to prevent contractures`,`Teach parents to lift the infant under both arms to strengthen the shoulder`,`Keep the arm completely immobilized for 6 months`,`Reassure the parents that no follow-up is needed`],ans:0,
 why:`<b>What:</b> Erb (upper brachial plexus) palsy. <b>Why:</b> Stretching of C5–C6 roots during birth weakens the shoulder and upper arm; the hand grasp is preserved. Care prevents contractures and supports recovery.`,
 wrong:`Lifting under the arms stretches the injured plexus. Prolonged complete immobilization causes contractures. Follow-up is required — most improve, but some need therapy or surgery.`,
 cues:`Limp, adducted, internally rotated arm; absent Moro, present grasp.`,
 safety:`Avoid traction on the affected arm.`,
 ev:`Increasing spontaneous movement; full passive range of motion maintained.`,
 take:`Erb palsy: limp, adducted, internally rotated arm; Moro absent, grasp present → gentle positioning and ROM.`,
 src:`${L.hr}, slides 3–4 (birth injuries — peripheral nervous system: Erb palsy); ${L.tb}, pp. 609–613.`},
{id:'s16',t:'matrix',topic:'t4',cj:'rc',cats:['as'],hy:false,
 stem:`Classify each physical finding as more typical of a preterm or a postterm infant, and use it to anticipate risk.`,cols:[`Preterm (<37 wk)`,`Postterm (>42 wk)`],
 rows:[{x:`Translucent skin with visible veins and abundant lanugo`,ans:0},{x:`Dry, cracked, peeling skin with little vernix`,ans:1},{x:`Long fingernails stained with meconium`,ans:1},{x:`Large head relative to a small, scrawny body`,ans:0},{x:`Alert, wide-eyed, wasted appearance with loose skin`,ans:1},{x:`Few plantar creases and soft, flat ear cartilage`,ans:0}],
 why:`<b>What:</b> Physical maturity cues. <b>Why:</b> Preterm infants have immature skin, abundant lanugo, few creases and soft cartilage. Postterm infants show the effects of placental dysfunction: loss of vernix and subcutaneous fat, peeling skin, long nails and meconium staining.`,
 wrong:`Each row reflects a classic finding of only one group.`,
 cues:`Skin, vernix/lanugo, nails, creases, cartilage, body proportion.`,
 safety:`Preterm → RDS, thermoregulation, NEC, infection; postterm → meconium aspiration, hypoglycemia, polycythemia, birth injury.`,
 ev:`Risk-based monitoring plan in place.`,
 take:`Postterm = placental dysfunction (peeling skin, long nails, meconium); preterm = immaturity (translucent skin, lanugo, few creases).`,
 src:`${L.hr}, slides 15–18 (preterm, late preterm, postterm); ${L.tb}, pp. 553, 635.`},
{id:'s17',t:'sata',topic:'t4',cj:'gs',cats:['pi','teach'],hy:true,
 stem:`A 3-day-old with in-utero opioid exposure has a high-pitched cry, tremors, sneezing, frantic sucking and loose stools. Withdrawal scores are rising. Which nursing interventions are appropriate? <b>Select all that apply.</b>`,
 opts:[`Swaddle snugly with the arms and legs flexed`,`Dim the lights and reduce noise and handling`,`Offer small, frequent feedings and burp often`,`Provide nonnutritive sucking with a pacifier`,`Encourage the mother to participate in calming care without judgment`,`Place the infant prone to sleep on the open unit`,`Increase stimulation with lights and mobiles to distract him`],ans:[0,1,2,3,4],
 why:`<b>What:</b> Neonatal opioid withdrawal (neonatal abstinence). <b>Why:</b> Abrupt loss of opioid exposure at birth causes CNS hyperirritability and GI/autonomic dysfunction. Reducing stimulation, containment, sucking and small feeds organize the infant and support nutrition; nonjudgmental parent involvement improves bonding and outcomes.`,
 wrong:`The textbook notes prone positioning contradicts SIDS teaching. Extra stimulation worsens hyperirritability.`,
 cues:`High-pitched cry, tremors, sneezing, frantic sucking, loose stools.`,
 safety:`Score withdrawal objectively (e.g., Finnegan tool); protect skin; monitor weight.`,
 ev:`Lower scores, longer sleep after feeds, stable weight.`,
 take:`Withdrawal care: low stimulation, swaddle, nonnutritive sucking, small frequent feeds, skin care, nonjudgmental family care.`,
 src:`${L.hr}, slide 10 (drug-exposed infants — opioids); ${L.tb}, pp. 620–623.`},
{id:'s18',t:'matrix',topic:'t4',cj:'ac',cats:['as'],hy:false,
 stem:`Match each history finding with the neonatal complication the nurse should anticipate most.`,cols:[`Hemolytic disease`,`Congenital/perinatal (TORCH) infection`,`Neonatal withdrawal`,`Hypoglycemia`],
 rows:[{x:`Rh-negative mother who was sensitized in a previous pregnancy; infant is Rh-positive`,ans:0},{x:`Mother had a primary herpes simplex outbreak with lesions at delivery`,ans:1},{x:`Mother was maintained on methadone throughout pregnancy`,ans:2},{x:`Mother has poorly controlled type 1 diabetes; infant is 4,600 g`,ans:3},{x:`Mother had rubella in the first trimester`,ans:1}],
 why:`<b>What:</b> Linking maternal history to neonatal risk. <b>Why:</b> Only an Rh-positive offspring of an Rh-negative (sensitized) mother is at risk for isoimmune hemolysis. TORCH = Toxoplasmosis, Other (hepatitis B, HIV, parvovirus, etc.), Rubella, CMV, Herpes. Opioid exposure → withdrawal. Maternal hyperglycemia → fetal hyperinsulinemia → hypoglycemia.`,
 wrong:`Each history points to one primary risk.`,
 cues:`Blood types and sensitization; maternal infections; maternal substances; maternal diabetes and infant size.`,
 safety:`Use maternal history to start targeted monitoring before symptoms appear.`,
 ev:`Correct anticipatory assessments documented.`,
 take:`Maternal history predicts neonatal problems — read it before the first assessment.`,
 src:`${L.hr}, slides 9 (TORCH), 10 (drug-exposed infants), 11 (hemolytic disease — Rh), 12 (IDM); ${L.tb}, pp. 616, 620–623, 626–629.`},
{id:'s19',t:'mc',topic:'t4',cj:'ta',cats:['pi','teach'],hy:false,
 stem:`A 24-week infant is expected to die within hours after the family chooses comfort care. The father says, "I don't think we should see her — it will only make it worse." What is the nurse's best response?`,
 opts:[`"Many parents feel that way. You can see or hold her now, later, or not at all — I'll stay with you and help with whatever you decide."`,`"You'll regret it forever if you don't hold her."`,`"That's probably best — we'll take care of everything."`,`"Let's talk about something else until you feel better."`],ans:0,
 why:`<b>What:</b> Supporting grieving parents during an expected neonatal death. <b>Why:</b> The lecture role is to prepare parents for an inevitable death, provide end-of-life care and facilitate grieving — offering (never forcing) the chance to see, touch and hold the infant, with privacy and support.`,
 wrong:`Pressuring, removing choice, or avoiding the topic all interfere with grieving.`,
 cues:`Parent ambivalence about seeing the infant.`,
 safety:`Respect cultural and spiritual preferences; offer mementos (photos, footprints, hand prints, ID bands) as the family wishes.`,
 ev:`Parents express their feelings and make an informed choice.`,
 take:`Neonatal loss: offer choices, presence, privacy and mementos; use the infant's name; no clichés.`,
 src:`${L.hr}, slide 23 (neonatal loss — prepare parents, end-of-life care, facilitate grieving); ${L.tb}, pp. 652–653.`},
{id:'s20',t:'bow',topic:'t4',cj:'ph',cats:['pi','em','med'],hy:true,
 stem:`A 30-hour-old (blood type A-positive, mother O-positive, DAT positive) has jaundice to the abdomen. TSB rose from 9.2 mg/dL at 18 h to 14.6 mg/dL at 30 h. Intensive phototherapy is ordered. Complete the bow-tie.`,
 cond:{opts:[`Pathologic hyperbilirubinemia from ABO hemolytic disease`,`Physiologic jaundice`,`Breast-milk jaundice`,`Neonatal sepsis`],ans:0},
 acts:{opts:[`Cover the eyes with an opaque mask without occluding the nares and expose maximal skin`,`Feed frequently and monitor hydration (feeds, wet diapers, weight)`,`Apply lotion to protect the skin from the lights`,`Turn off the lights for 3-hour rest periods`,`Hold feedings to reduce bilirubin production`],ans:[0,1]},
 mons:{opts:[`TSB trend as ordered`,`Temperature and neurologic status (tone, cry, alertness)`,`Head circumference`,`Hearing screen today`,`Blood glucose hourly`],ans:[0,1]},
 why:`<b>What:</b> Hemolytic (ABO incompatibility) hyperbilirubinemia. <b>Why:</b> Maternal anti-A antibodies destroy infant RBCs; jaundice appears early and bilirubin rises fast. Phototherapy converts bilirubin in the skin to excretable forms; feeding promotes stool excretion and replaces insensible losses.`,
 wrong:`Physiologic and breast-milk jaundice don't cause a positive DAT or such a rapid rise. Lotions can burn under lights; long interruptions reduce effectiveness; withholding feeds slows excretion.`,
 cues:`O mother / A infant, positive DAT, TSB rising >0.4 mg/dL/h.`,
 safety:`Watch for neurologic signs (lethargy, high-pitched cry, hypotonia → hypertonia) — escalate for possible exchange transfusion.`,
 ev:`TSB plateaus then falls; normal tone and feeding; stable temperature.`,
 take:`Phototherapy: eyes covered (not nares), maximal skin exposure, temperature, hydration; neuro changes = emergency (kernicterus risk).`,
 src:`${L.hr}, slide 11 (hemolytic disease — blood incompatibility, exchange transfusion); ${L.tb}, pp. 557–559 (phototherapy, eye mask), 626.`},

/* ---- T5 Growth & development (4) ---- */
{id:'s21',t:'matrix',topic:'t5',cj:'ac',cats:['pi'],hy:false,
 stem:`Match each child's behavior with Erikson's stage the nurse should support.`,cols:[`Trust vs mistrust`,`Autonomy vs shame & doubt`,`Initiative vs guilt`,`Industry vs inferiority`,`Identity vs role confusion`],
 rows:[{x:`A 20-month-old insists on feeding herself with a spoon and says "No!" to help`,ans:1},{x:`A 7-month-old calms only when the same nurse provides care`,ans:0},{x:`A 9-year-old asks to help track his own insulin doses on a chart`,ans:3},{x:`A 15-year-old refuses to wear a back brace to school because of how it looks`,ans:4},{x:`A 4-year-old invents a pretend game and wants to "help" the nurse take vital signs`,ans:2}],
 why:`<b>What:</b> Applying psychosocial stages to nursing care. <b>Why:</b> Each stage has a central task: consistent care (trust), choices and self-help (autonomy), play and participation (initiative), mastery and productivity (industry), peer acceptance and self-image (identity).`,
 wrong:`Each behavior reflects only one stage's task.`,
 cues:`Age plus the motive behind the behavior.`,
 safety:`Supporting the stage improves cooperation and coping with illness.`,
 ev:`Care plan includes a stage-matched intervention for each child.`,
 take:`Erikson → nursing action: trust = consistency; autonomy = choices; initiative = play; industry = tasks; identity = privacy and peers.`,
 src:`${L.gd}, slide 10 (Erikson); ${L.ch}; ${L.tb}, pp. 696–697.`},
{id:'s22',t:'mc',topic:'t5',cj:'gs',cats:['teach'],hy:false,
 stem:`A father says his 8-year-old with new type 1 diabetes is "filling up the house with collections" of rocks and baseball cards. Which teaching approach best fits the child's cognitive stage?`,
 opts:[`Demonstrate glucose checks step by step and let him practice and sort his supplies himself`,`Explain the abstract long-term vascular complications of diabetes`,`Teach only through pretend play with a stuffed animal`,`Give written instructions to the parents only`],ans:0,
 why:`<b>What:</b> Concrete operational thinking (about 7–11 years). <b>Why:</b> Collecting and classifying objects shows concrete operations; children learn best with real objects, demonstration and return demonstration. Mastery also supports Erikson's industry.`,
 wrong:`Abstract future consequences require formal operations (adolescence). Pretend play alone suits preschoolers. Excluding the child misses his capacity to participate.`,
 cues:`Collections = classification → concrete operational.`,
 safety:`Return demonstration confirms safe self-care skills.`,
 ev:`Correct return demonstration of glucose checks.`,
 take:`Collections = concrete operational (lecture NCLEX item) → teach with hands-on demonstration.`,
 src:`${L.gd}, slides 11 (Piaget), 17 (lecture question: collections); ${L.ch}; ${L.tb}, pp. 698–699.`},
{id:'s23',t:'sata',topic:'t5',cj:'gs',cats:['pi','teach'],hy:false,
 stem:`A 4-year-old is scheduled for an IV start and says, "I'm getting a shot because I was bad." Which interventions are developmentally appropriate? <b>Select all that apply.</b>`,
 opts:[`Tell him clearly that the IV is not a punishment`,`Let him practice on a doll with the tourniquet and a bandage`,`Use simple, concrete words and avoid words like "stick" or "cut"`,`Prepare him just before the procedure`,`Offer a bandage over the site afterward`,`Explain the procedure in detail two days ahead`,`Tell him big boys don't cry`],ans:[0,1,2,3,4],
 why:`<b>What:</b> Preoperational (Piaget) and initiative-vs-guilt (Erikson) thinking. <b>Why:</b> Preschoolers use magical and egocentric thinking, believe their actions cause events, fear bodily intrusion and have a limited sense of time. Play, concrete words, brief advance notice and bandages address each.`,
 wrong:`Early detailed explanations increase anxiety for days; shaming increases fear and guilt.`,
 cues:`"Because I was bad" = magical thinking / guilt.`,
 safety:`Reducing fear supports cooperation and safe procedures.`,
 ev:`Child participates (e.g., chooses the bandage) with less distress.`,
 take:`Preschool: play, concrete words, "not your fault," brief notice, bandages.`,
 src:`${L.gd}, slides 10–11 (Erikson, Piaget); ${L.ch}; ${L.tb}, pp. 696–699.`},
{id:'s24',t:'cloze',topic:'t5',cj:'ac',cats:['as'],hy:false,
 stem:`Complete the developmental analysis.`,
 text:`A 2-year-old resisting toilet training is in Freud's {0} stage. A 6-year-old who follows hospital rules "so I get a sticker" reasons at Kohlberg's {1} level. A 16-year-old who debates whether it is fair to share organ-donor lists is using Piaget's {2} thinking. A 9-month-old who searches for a toy hidden under a blanket shows {3}.`,
 drops:[{opts:[`anal`,`oral`,`phallic`,`latency`],ans:0},{opts:[`preconventional`,`conventional`,`postconventional`],ans:0},{opts:[`formal operational`,`concrete operational`,`preoperational`,`sensorimotor`],ans:0},{opts:[`object permanence`,`conservation`,`egocentrism`,`abstract reasoning`],ans:0}],
 why:`<b>What:</b> Applying Freud, Kohlberg and Piaget. <b>Why:</b> Toilet training is the anal stage's focus; preconventional morality judges right and wrong by reward and punishment; abstract, hypothetical moral reasoning is formal operational; searching for a hidden object shows object permanence (sensorimotor).`,
 wrong:`Conventional morality seeks approval/law and order; concrete operations can't handle hypotheticals; conservation develops in school age.`,
 cues:`Toileting, sticker reward, hypothetical fairness debate, hidden toy.`,
 safety:`Matching explanations to cognitive level improves teaching.`,
 ev:`Correct stage-based care decisions.`,
 take:`Freud: oral → anal → phallic → latency → genital. Kohlberg: preconventional → conventional → postconventional. Piaget: sensorimotor → preoperational → concrete → formal.`,
 src:`${L.gd}, slides 9 (Freud), 11 (Piaget), 13 (Kohlberg); ${L.ch}; ${L.tb}, pp. 696–699. Exact age cut-offs differ between sources and are not tested (see coverage notes).`},

/* ---- T6 Autism (5) ---- */
{id:'s25',t:'sata',topic:'t6',cj:'rc',cats:['as'],hy:false,
 stem:`At an 18-month well visit, which findings reported by a parent warrant further developmental evaluation for autism spectrum disorder? <b>Select all that apply.</b>`,
 opts:[`Used several words at 12 months but now uses none`,`Does not point to show the parent an airplane`,`Rarely looks at faces and does not respond to his name`,`Lines up cars and screams if one is moved`,`Has tantrums when tired or hungry`,`Plays next to, but not with, other toddlers`],ans:[0,1,2,3],
 why:`<b>What:</b> Developmental red flags for autism. <b>Why:</b> Autism involves differences in social interaction, communication and behavior; loss of language, absent joint attention (pointing to share), limited eye contact and response to name, and rigid repetitive play are concerning.`,
 wrong:`Tantrums when tired and parallel play are typical toddler behavior.`,
 cues:`Regression, joint attention, response to name, restricted/repetitive play.`,
 safety:`Hearing should also be evaluated — hearing loss can mimic not responding to name.`,
 ev:`Referral for comprehensive evaluation completed.`,
 take:`Any loss of skills, no pointing, no response to name → evaluate; tantrums and parallel play are typical.`,
 src:`${L.au}, slide 4 (clinical manifestations — social interaction, communication, behavior; language delay); ${L.tb}, pp. 1015–1016. Specific red-flag ages: ${L.sup}`},
{id:'s26',t:'mc',topic:'t6',cj:'ta',cats:['pi','teach'],hy:false,
 stem:`A parent of a 26-month-old with limited words and repetitive behaviors says, "My mother says boys talk late. Should we just wait until he's 4?" What is the nurse's best response?`,
 opts:[`"The behaviors you describe are reasons for a full developmental evaluation now — early intervention works best when it starts early."`,`"Your mother is right; most boys catch up by kindergarten."`,`"He definitely has autism."`,`"Let's recheck at his 4-year visit."`],ans:0,
 why:`<b>What:</b> Early recognition and referral. <b>Why:</b> The lecture states prognosis can be improved by early recognition and intervention, and diagnosis is often delayed until 2–3 years — so delay costs time.`,
 wrong:`"Wait and see" delays services. Nurses do not diagnose; a comprehensive evaluation does.`,
 cues:`Limited words + repetitive behaviors at 26 months.`,
 safety:`Early intervention can begin while the evaluation is in progress.`,
 ev:`Family schedules the evaluation and early intervention intake.`,
 take:`Red flags → refer now; "wait and see" is the wrong answer.`,
 src:`${L.au}, slides 4 (diagnosis often delayed until 2–3 yr), 5 (prognosis can be improved with early recognition; care management); ${L.tb}, pp. 1016–1017.`},
{id:'s27',t:'order',topic:'t6',cj:'ta',cats:['pi'],hy:false,
 stem:`A 5-year-old with autism who uses a picture schedule needs a blood draw in the clinic. Place the nurse's actions in order.`,
 items:[`Ask the caregiver which words, pictures and calming strategies work for the child`,`Prepare a quiet room with supplies ready to minimize waiting`,`Show the "first blood draw — then tablet" picture card and the steps`,`Perform the draw efficiently with the caregiver present`,`Give the promised preferred activity right away`],
 why:`<b>What:</b> Individualized procedure preparation. <b>Why:</b> Predictability, the child's own communication system and minimal waiting reduce distress; caregivers are the experts on the child.`,
 wrong:`Starting before gathering individual information or preparing the environment increases the chance of sensory overload.`,
 cues:`Uses a picture schedule; new procedure.`,
 safety:`Plan for safety (sudden movement, elopement) with caregiver input.`,
 ev:`Procedure completed with minimal distress and no injury.`,
 take:`Ask the caregiver first; structure, visual supports and predictability reduce distress.`,
 src:`${L.au}, slides 2–3 (nursing care — provide a means of communication, care during hospitalization), 5 (structured routine); ${L.tb}, pp. 1016–1017.`},
{id:'s28',t:'bow',topic:'t6',cj:'ph',cats:['pi','em'],hy:false,
 stem:`A 6-year-old with autism is admitted through a crowded emergency department. With alarms sounding and several staff talking, he screams, hits his head with his hand and runs toward the exit. Complete the bow-tie.`,
 cond:{opts:[`Sensory overload in an unpredictable environment`,`Intentional misbehavior`,`Delirium`,`Acute pain from his admitting diagnosis only`],ans:0},
 acts:{opts:[`Move him to a quiet, dim room and limit the number of people speaking`,`Use his communication tools and comfort items as the caregiver directs`,`Apply restraints to prevent elopement`,`Have several staff explain the plan at once`,`Remove his comfort item to prevent infection`],ans:[0,1]},
 mons:{opts:[`Safety: self-injury and elopement attempts`,`Distress level and response to calming strategies`,`Head circumference`,`Hearing threshold`,`Bowel sounds`],ans:[0,1]},
 why:`<b>What:</b> Sensory overload, not "bad behavior." <b>Why:</b> Noise, crowding and loss of routine overwhelm sensory processing; head-hitting and running are distress and escape responses.`,
 wrong:`Restraint is not first-line and escalates distress. More voices add stimulation. Comfort items reduce distress.`,
 cues:`Alarms, crowding, unfamiliar setting, self-injury, elopement.`,
 safety:`Protect from self-injury and elopement while reducing triggers.`,
 ev:`Calmer within minutes, no self-injury, stays in the safe area.`,
 take:`Reduce stimuli, use the child's own communication tools, and monitor safety.`,
 src:`${L.au}, slides 2–5 (care during hospitalization, structured routine, communication); ${L.tb}, pp. 1016–1017.`},
{id:'s29',t:'matrix',topic:'t6',cj:'eo',cats:['ev','teach'],hy:false,
 stem:`After teaching the parents of a 3-year-old newly diagnosed with autism, evaluate each statement.`,cols:[`Indicates understanding`,`Needs more teaching`],
 rows:[{x:`"Keeping his routine the same each day will help him feel safe."`,ans:0},{x:`"We'll start early intervention services now instead of waiting."`,ans:0},{x:`"If we had been stricter, he wouldn't have autism."`,ans:1},{x:`"The Autism Society of America has parent resources we can use."`,ans:0},{x:`"With the right therapy he'll be completely cured by kindergarten."`,ans:1},{x:`"We'll tell his nurses which picture cards he uses."`,ans:0}],
 why:`<b>What:</b> Evaluating family education. <b>Why:</b> The lecture emphasizes structured routine, early intervention, communication supports, family counseling and resources; parents often feel guilt and shame; there is no cure, though outcomes improve.`,
 wrong:`Autism isn't caused by parenting; "cure" is inaccurate.`,
 cues:`Statements about cause, prognosis and routines.`,
 safety:`Address guilt nonjudgmentally and refer for family counseling.`,
 ev:`Parents restate accurate expectations at follow-up.`,
 take:`No cure, many therapies; early recognition improves prognosis; not caused by parenting.`,
 src:`${L.au}, slides 5 (prognosis; care management), 6 (family support — guilt and shame, counseling, Autism Society of America); ${L.tb}, pp. 1016–1017.`},

/* ---- T7 Congenital heart disease (3) ---- */
{id:'s30',t:'order',topic:'t7',cj:'ta',cats:['em','pi','med'],hy:true,
 stem:`A 9-month-old with unrepaired tetralogy of Fallot becomes deeply cyanotic, limp and tachypneic after prolonged crying during a lab draw. SpO₂ falls from 82% (baseline) to 60%. Place the nurse's actions in order.`,
 items:[`Place the infant in the knee-chest position`,`Calm and comfort the infant to stop the crying`,`Administer 100% oxygen by face mask`,`Give morphine as ordered`,`Notify cardiology and continue monitoring SpO₂ and HR`],
 why:`<b>What:</b> Hypercyanotic ("tet") spell. <b>Why:</b> Crying increases pulmonary outflow obstruction and lowers systemic vascular resistance, increasing right-to-left shunting. Knee-chest raises systemic resistance and reduces venous return of desaturated blood; calming and morphine reduce agitation and spasm; oxygen improves saturation.`,
 wrong:`Positioning first works within seconds and needs no equipment; medication follows.`,
 cues:`Unrepaired TOF, crying trigger, sudden severe desaturation.`,
 safety:`Prolonged spells can cause cerebral hypoxia — escalate.`,
 ev:`SpO₂ returns toward baseline; breathing slows; color improves.`,
 take:`Tet spell: knee-chest → calm → O₂ → morphine.`,
 src:`${L.chd}, slides 17 (decreased pulmonary blood flow — TOF), 20–21 (hypoxemia, management); ${L.tb}, pp. 1240–1241.`},
{id:'s31',t:'matrix',topic:'t7',cj:'ac',cats:['as'],hy:false,
 stem:`Classify each defect by hemodynamic category and the problem the nurse should anticipate.`,cols:[`↑ Pulmonary blood flow → heart failure`,`Obstruction to outflow`,`↓ Pulmonary blood flow → cyanosis`,`Mixed blood flow`],
 rows:[{x:`Atrial septal defect`,ans:0},{x:`Patent ductus arteriosus`,ans:0},{x:`Coarctation of the aorta`,ans:1},{x:`Aortic stenosis`,ans:1},{x:`Tricuspid atresia`,ans:2},{x:`Transposition of the great arteries`,ans:3},{x:`Truncus arteriosus`,ans:3}],
 why:`<b>What:</b> The lecture's hemodynamic classification. <b>Why:</b> Abnormal connections let blood shunt left → right (↑ pulmonary flow); stenoses obstruct outflow; obstruction to pulmonary flow plus a septal opening produce right → left shunting and cyanosis; complex anomalies mix saturated and desaturated blood.`,
 wrong:`Each defect belongs to one category.`,
 cues:`Where the blood goes and what pressure drives it.`,
 safety:`Category predicts the complication to monitor.`,
 ev:`Correct anticipatory assessment for each lesion.`,
 take:`↑ flow: ASD, VSD, PDA. Obstructive: CoA, AS, PS. ↓ flow: TOF, tricuspid atresia. Mixed: TGA, TAPVC, truncus, HLHS.`,
 src:`${L.chd}, slides 12–13 (classification), 15–18 (each category); ${L.tb}, pp. 1222–1232.`},
{id:'s32',t:'cloze',topic:'t7',cj:'ac',cats:['as','med','em'],hy:true,
 stem:`A 3-day-old has weak femoral pulses, cool feet, arm BP 92/58 and leg BP 64/40, and is feeding poorly. Complete the nurse's analysis.`,
 text:`These findings are most consistent with {0}, a defect that causes {1}. If the defect depends on the ductus arteriosus, the nurse anticipates an infusion of {2} to {3}.`,
 drops:[{opts:[`coarctation of the aorta`,`ventricular septal defect`,`tetralogy of Fallot`,`atrial septal defect`],ans:0},{opts:[`higher pressure before the narrowing and lower pressure beyond it`,`decreased pulmonary blood flow and cyanosis`,`mixing of saturated and desaturated blood`,`left-to-right shunting at the atrial level`],ans:0},{opts:[`prostaglandin E₁`,`indomethacin`,`digoxin`,`furosemide`],ans:0},{opts:[`keep the ductus arteriosus open`,`close the ductus arteriosus`,`strengthen myocardial contraction`,`remove excess fluid`],ans:0}],
 why:`<b>What:</b> Critical coarctation of the aorta. <b>Why:</b> Narrowing obstructs outflow, raising pressure proximal to it (arms) and lowering pressure distally (legs). Lower-body perfusion may depend on blood crossing the ductus arteriosus; prostaglandins keep it open until surgery.`,
 wrong:`VSD and ASD don't produce arm–leg pressure differences; TOF causes cyanosis. Indomethacin closes a PDA — the opposite of what is needed.`,
 cues:`Arm BP > leg BP, weak femorals, cool feet, poor feeding at day 3 (ductus closing).`,
 safety:`Watch for apnea, a known effect of prostaglandin infusion.`,
 ev:`Improved femoral pulses, warm feet, urine output and feeding.`,
 take:`Coarctation: arm BP > leg BP, weak femorals. Prostaglandin keeps the ductus OPEN.`,
 src:`${L.chd}, slides 6 (palpation — peripheral pulses), 16 (obstructive defects), 21 (hypoxemia management — prostaglandins); ${L.tb}, pp. 1228–1230.`},

/* ---- T9 Cerebral palsy (4) ---- */
{id:'s33',t:'sata',topic:'t9',cj:'rc',cats:['as'],hy:false,
 stem:`A 12-month-old (corrected 10 months) who was born at 27 weeks weighing 980 g with periventricular leukomalacia is seen for motor delay. Which findings are consistent with cerebral palsy? <b>Select all that apply.</b>`,
 opts:[`Legs cross in a scissoring pattern when held upright`,`Increased resistance to passive leg movement with brisk reflexes`,`Persistent asymmetric tonic neck reflex`,`Strong hand preference since 6 months`,`Not yet sitting independently`,`Loss of previously acquired motor skills over the last month`],ans:[0,1,2,3,4],
 why:`<b>What:</b> Spastic cerebral palsy pattern. <b>Why:</b> CP is a disorder of posture and movement from a static brain injury; periventricular white-matter injury in extremely low-birth-weight preterm infants damages motor pathways → spasticity, hyperreflexia, persistent primitive reflexes, abnormal posture, early hand preference and delayed gross motor development.`,
 wrong:`Loss of skills (regression) suggests a progressive disorder — CP is non-progressive.`,
 cues:`ELBW preterm + PVL; scissoring, spasticity, persistent reflexes, early hand preference.`,
 safety:`Use corrected age for preterm milestones until about age 2.`,
 ev:`Referral for diagnostic evaluation and early therapy.`,
 take:`CP is static: delayed motor milestones, abnormal tone, abnormal posture, persistent reflexes. Regression = think something else.`,
 src:`${L.cp}, slides 2 (definition — static brain injury, abnormal tone and coordination), 3 (risk — preterm ELBW/VLBW, PVL), 6 (clinical manifestations); ${L.tb}, pp. 1485–1486.`},
{id:'s34',t:'mc',topic:'t9',cj:'gs',cats:['teach','med'],hy:false,
 stem:`The parents of a 4-year-old with spastic CP ask why their child is receiving botulinum toxin A injections in the calf muscles. What is the nurse's best explanation?`,
 opts:[`"It relaxes the tight muscles where it is injected, which can reduce spasticity and make stretching and braces more effective."`,`"It repairs the brain injury that caused CP."`,`"It prevents seizures."`,`"It permanently paralyzes the legs so they stop moving."`],ans:0,
 why:`<b>What:</b> Pharmacologic management of spasticity. <b>Why:</b> Botulinum toxin A blocks acetylcholine release at targeted neuromuscular junctions → temporary local muscle relaxation; combined with therapy and bracing it improves range of motion and function, and helps spasm-related pain.`,
 wrong:`CP's brain injury is permanent. It is not an anticonvulsant. Effects are temporary and local, not permanent paralysis.`,
 cues:`Spastic CP, calf injections.`,
 safety:`Continue therapy and bracing — the effect wears off over months.`,
 ev:`Improved ankle range of motion and gait with therapy.`,
 take:`Botulinum toxin A = targeted, temporary relief of spasticity.`,
 src:`${L.cp}, slides 9–10 (therapeutic management — mobilizing devices, pharmacologic agents including botulinum toxin A); ${L.tb}, pp. 1489–1491.`},
{id:'s35',t:'order',topic:'t9',cj:'ta',cats:['em','pi'],hy:true,
 stem:`A 5-year-old with CP and epilepsy begins a generalized tonic-clonic seizure while eating lunch. Place the nurse's actions in order.`,
 items:[`Stay with the child, note the time, and call for help`,`Turn the child to the side and remove food and objects from reach`,`Protect the head and loosen clothing; put nothing in the mouth`,`Give oxygen and suction as needed per orders`,`After the seizure, assess airway, vital signs, neurologic status and injuries, and document`],
 why:`<b>What:</b> Seizure safety in a child with CP (epilepsy is a common associated condition). <b>Why:</b> Side-lying lets food and secretions drain (aspiration risk while eating); timing guides rescue medication; nothing in the mouth prevents injury.`,
 wrong:`Inserting objects or restraining causes injury; post-ictal assessment comes after the seizure stops.`,
 cues:`Eating at onset = high aspiration risk.`,
 safety:`Seizure precautions (suction, oxygen at bedside) for children with CP and epilepsy.`,
 ev:`Airway maintained, no injury, return to baseline neurologic status.`,
 take:`Seizure: time it, side-lying, protect head, nothing in the mouth, then assess.`,
 src:`${L.cp}, slides 2 (often associated with epilepsy), 5 (associated impairments), 11 (care management — safety precautions); ${L.tb}, pp. 1486–1488. Seizure first-aid sequence: ${L.sup}`},
{id:'s36',t:'hl',topic:'t9',cj:'rc',cats:['as','em'],hy:false,
 stem:`Highlight the findings in this nursing note for a 3-year-old with spastic quadriplegic CP that require follow-up.`,
 segs:[{x:`Meals take 60 minutes;`,k:1},{x:`coughs and has a wet, gurgly voice after thin liquids;`,k:1},{x:`temperature 100.9°F with crackles in the right lower lobe;`,k:1},{x:`weight dropped from the 10th to the 3rd percentile;`,k:1},{x:`wears ankle-foot braces as prescribed;`,k:0},{x:`uses a picture board to request toys;`,k:0},{x:`skin intact under the braces.`,k:0}],
 why:`<b>What:</b> Feeding dysfunction with probable aspiration and falling growth. <b>Why:</b> Oral-motor impairment in CP (poor lip closure, tongue thrust, uncoordinated swallow) makes thin liquids enter the airway (wet voice, cough) → aspiration pneumonia (fever, crackles); long, effortful meals reduce intake.`,
 wrong:`Brace use, a communication board and intact skin are signs the plan is working.`,
 cues:`Wet voice, cough with liquids, fever, crackles, falling weight percentile.`,
 safety:`Upright positioning, thickened liquids as ordered, swallow study referral, nutrition consult.`,
 ev:`No respiratory infection; weight percentile stabilizing.`,
 take:`In CP, cough/wet voice with liquids + fever + crackles = aspiration until proven otherwise.`,
 src:`${L.cp}, slides 5 (associated impairments), 11 (care management); ${L.tb}, pp. 1486–1488.`},

/* ---- T10 Neural tube defects (1) ---- */
{id:'s37',t:'cloze',topic:'t10',cj:'gs',cats:['teach'],hy:false,
 stem:`A woman whose first child was born with myelomeningocele plans another pregnancy. Complete the nurse's teaching.`,
 text:`Because of her history, the recommended folic acid dose is {0} daily, started {1}. For women without this history, the dose is {2}. During pregnancy, {3} measured at 16–18 weeks can help detect a neural tube defect.`,
 drops:[{opts:[`4 mg`,`0.4 mg`,`40 mg`,`0.04 mg`],ans:0},{opts:[`before conception`,`after the first ultrasound`,`in the second trimester`,`once fetal movement is felt`],ans:0},{opts:[`0.4 mg`,`4 mg`,`1 g`,`no supplement`],ans:0},{opts:[`alpha-fetoprotein`,`glucose challenge testing`,`group B strep culture`,`a nonstress test`],ans:0}],
 why:`<b>What:</b> NTD prevention and prenatal detection. <b>Why:</b> The neural tube closes about 3–4 weeks after conception — often before pregnancy is recognized — so folic acid must be in place before conception. The lecture states supplementation prevents 50–70% of NTDs; elevated AFP suggests an open defect.`,
 wrong:`Doses 10-fold too high or low are distractors; starting after the first trimester is too late.`,
 cues:`Previous NTD-affected pregnancy.`,
 safety:`Prevention starts preconception.`,
 ev:`She states the correct dose and timing (teach-back).`,
 take:`Folic acid 0.4 mg/day for all women of childbearing age; 4 mg/day after an NTD-affected pregnancy; start before conception.`,
 src:`${L.ntd}, slides 4 (pathophysiology — failure of closure early in development), 6 (prenatal detection — AFP 16–18 weeks), 8 (prevention — folic acid 0.4 mg, 4 mg with history, 50–70%); ${L.tb}, pp. 1494–1495.`}
];

const REPL={
s07:{id:'s07',t:'mc',topic:'t2',cj:'ac',cats:['med','teach'],hy:true,
 stem:`A father asks why his newborn needs "a shot in the leg" in the first hours after birth and whether it could wait until the 2-week visit. Which explanation by the nurse is most accurate?`,
 opts:[`"The bacteria that make vitamin K aren't in a newborn's intestines yet, so he can't make enough clotting factors. The injection now prevents serious bleeding."`,`"Most mothers' diets are low in vitamin K, so babies are born deficient."`,`"Vitamin K stops the liver from making prothrombin, so it has to be injected."`,`"Babies need extra vitamin K for 3 to 4 months, so it can be given at any visit."`],ans:0,
 why:`<b>What:</b> Vitamin K (phytonadione) prophylaxis — a medication on the professor's Exam 4 "major medications to know" list. <b>Why:</b> The newborn's intestine is sterile at birth, so the bacteria that synthesize vitamin K are absent; vitamin K is needed for the liver to make clotting factors (II, VII, IX, X). Without it, newborns are at risk for vitamin K deficiency bleeding, which can be intracranial. It is given IM (0.5–1 mg) in the vastus lateralis soon after birth.`,
 wrong:`The deficiency is not from maternal diet. Vitamin K is needed FOR prothrombin synthesis — it doesn't stop it. Delaying until a later visit leaves the infant unprotected during the highest-risk period. (These are the distractors from the lecture's own NCLEX item.)`,
 cues:`"Shot in the leg" = IM vitamin K in the vastus lateralis; question about delaying.`,
 safety:`Give within the first hours (after initial skin-to-skin is acceptable); use the vastus lateralis, not the deltoid.`,
 ev:`Father states why it's needed; no unexplained bleeding from the cord, circumcision or puncture sites.`,
 take:`Vitamin K: sterile newborn gut → no vitamin K–producing bacteria → give IM in the vastus lateralis to prevent bleeding.`,
 src:`${L.nc}, slides 8 (immediate interventions — vitamin K), 19 (lecture NCLEX question on vitamin K); Exam 4 Learning Map (vitamin K on the major-medications list); ${L.tb}, pp. 555–556.`},
s10:{id:'s10',t:'mc',topic:'t2',cj:'ta',cats:['em','pi'],hy:true,
 stem:`A 40-minute-old term newborn born by cesarean without labor has RR 76, expiratory grunting, nasal flaring, intercostal retractions and dusky lips. SpO₂ is 88% on room air. Which action should the nurse take first?`,
 opts:[`Position the head to open the airway and clear secretions, then begin oxygen per the newborn respiratory protocol and call the provider/neonatal team`,`Assign a 5-minute APGAR score to document the change`,`Bathe the infant to stimulate deeper breathing`,`Encourage the mother to breastfeed to calm the infant`],ans:0,
 why:`<b>What:</b> Respiratory distress in the first 2 hours — a specific item under "care through the first 2 hours" on the professor's blueprint. <b>Why:</b> Cesarean without labor means less thoracic squeeze and catecholamine surge to clear lung fluid. Grunting (keeping alveoli open), flaring, retractions, tachypnea and central cyanosis show the infant is working hard and failing to oxygenate.`,
 wrong:`APGAR is a 1- and 5-minute summary and never directs or delays care. Bathing causes evaporative heat loss, increasing oxygen demand. Feeding a tachypneic, hypoxemic infant risks aspiration.`,
 cues:`RR >60, grunting, flaring, retractions, dusky lips, SpO₂ 88%.`,
 safety:`Airway before oxygen; keep the infant warm (cold increases oxygen consumption); escalate early.`,
 ev:`SpO₂ rising to the protocol goal, RR falling toward 30–60, grunting and retractions resolving.`,
 take:`Newborn respiratory distress = tachypnea, grunting, flaring, retractions, cyanosis → position/clear airway, oxygen per protocol, notify, keep warm.`,
 src:`${L.pba}, slide 7 (respiratory system — signs of distress); ${L.nc}, slide 8 (immediate interventions: airway maintenance, adequate oxygen supply); Exam 4 Learning Map (care through first 2 hours: respiratory distress); ${L.tb}, pp. 512, 553–554.`},
s11:{id:'s11',t:'matrix',topic:'t2',cj:'eo',cats:['teach','ev'],hy:false,
 stem:`The nurse evaluates a mother's understanding of umbilical cord care before discharge. Classify each statement.`,cols:[`Correct — teaching effective`,`Incorrect — re-teach`],
 rows:[{x:`"I'll keep the cord clean and dry and fold the diaper down below it."`,ans:0},{x:`"I'll give sponge baths until the cord falls off."`,ans:0},{x:`"I'll call if the skin around the cord turns red, it drains pus, or it smells bad."`,ans:0},{x:`"If it starts to come loose, I'll gently pull it off so it heals faster."`,ans:1},{x:`"I'll keep it covered with the diaper so it stays clean."`,ans:1},{x:`"I'll put powder or ointment on it every diaper change."`,ans:1}],
 why:`<b>What:</b> Umbilical cord care — on the professor's blueprint under care through the first 2 hours. <b>Why:</b> The goal of cord care is to prevent hemorrhage and infection; the stump is an excellent medium for bacterial growth. Keeping it clean, dry and exposed to air promotes drying and separation; signs of omphalitis (spreading redness, purulent drainage, foul odor) must be reported.`,
 wrong:`Pulling the cord can cause bleeding. Covering it with the diaper traps urine and stool. Powders and ointments keep it moist and aren't part of current clean-and-dry care (older practice used alcohol — see coverage notes).`,
 cues:`Statements about keeping the cord dry and exposed, bathing, and infection signs.`,
 safety:`Infection signs at the cord need prompt evaluation in a newborn.`,
 ev:`Mother demonstrates folding the diaper below the cord and restates infection signs.`,
 take:`Cord care: clean, dry, diaper folded below, sponge bathe until it falls off, never pull it; report redness, drainage, odor.`,
 src:`${L.nc}, slides 14 (infection control factors), 17–18 (discharge teaching — bathing and cord care); Exam 4 Learning Map (cord care); ${L.tb}, pp. 575–578.`},
s14:{id:'s14',t:'cloze',topic:'t3',cj:'gs',cats:['teach'],hy:false,
 stem:`A first-time mother is deciding between breastfeeding and formula and asks what her newborn needs. Complete the nurse's teaching.`,
 text:`The AAP recommends {0}. Colostrum and breast milk protect the infant mainly because they {1}. A healthy breastfed or formula-fed newborn {2}. If she chooses formula, she should prepare it {3} and never prop the bottle.`,
 drops:[{opts:[`exclusive breastfeeding for about the first 6 months, continuing for at least 12 months`,`breastfeeding for 6 weeks, then switching to formula`,`starting cereal at 2 months`,`alternating breast milk and cow's milk from birth`],ans:0},{opts:[`contain antibodies and immune factors that reduce infections`,`contain more iron than any formula`,`are higher in protein than formula`,`make vitamin K unnecessary`],ans:0},{opts:[`gets all needed fluid from breast milk or formula and does not need extra water`,`needs 2 ounces of water after each feed`,`needs juice daily for vitamins`,`needs sugar water between feeds`],ans:0},{opts:[`exactly as the label directs`,`with extra water to prevent constipation`,`with less water to add calories`,`in the microwave`],ans:0}],
 why:`<b>What:</b> Nutrient needs, benefits of breastfeeding and formula basics — three bullets on the professor's blueprint. <b>Why:</b> The lecture lists newborn nutrient needs (fluids, energy, carbohydrate, fat, protein, vitamins, minerals) and the AAP recommendation. Breast milk and colostrum carry antibodies and immune factors; breast milk or properly prepared formula meets the infant's fluid requirement (textbook: 60–80 mL/kg/day in the first 2 days, rising after), so extra water isn't given. Incorrect dilution of formula is dangerous.`,
 wrong:`Six weeks, early cereal and cow's milk contradict AAP guidance. Breast milk's main advantage is immunologic, not higher iron or protein; vitamin K is still needed. Extra water, juice or sugar water can cause hyponatremia and displace nutrition.`,
 cues:`Infant-feeding decision; first-time mother.`,
 safety:`Never dilute or concentrate formula; never give plain water to a young infant.`,
 ev:`Mother makes an informed choice and describes safe feeding for the method chosen.`,
 take:`AAP: exclusive breastfeeding ~6 months, continue ≥12 months; breast milk/formula meets all fluid needs; formula exactly as directed.`,
 src:`${L.nf}, slides 2 (nutrient needs), 3 (AAP recommendation), 4 (benefits of breastfeeding, uniqueness of human milk), 16–17 (formula feeding); Exam 4 Learning Map (nutrient needs, benefits, formula feeding); ${L.tb}, pp. 579–583.`},
s15:{id:'s15',t:'sata',topic:'t4',cj:'rc',cats:['as','em'],hy:true,
 stem:`During the first feeding, a 3-hour-old newborn whose mother had polyhydramnios coughs, chokes and turns cyanotic. The nurse notes frothy saliva continuously drooling from the mouth, and a catheter cannot be passed into the stomach. Which actions are appropriate? <b>Select all that apply.</b>`,
 opts:[`Stop the feeding and keep the infant NPO`,`Suction the mouth and pharynx to clear secretions`,`Position with the head elevated to reduce aspiration`,`Notify the provider immediately`,`Retry the feeding with a slower-flow nipple`,`Give sterile water to see whether the infant can swallow`],ans:[0,1,2,3],
 why:`<b>What:</b> Probable esophageal atresia/tracheoesophageal fistula — one of the lecture's "most common major congenital anomalies" and a blueprint item. <b>Why:</b> The esophagus ends in a blind pouch (± a connection to the trachea), so saliva and milk pool and spill into the airway: excessive salivation/drooling, the "3 Cs" (coughing, choking, cyanosis) with feeding, and a catheter that won't pass. Maternal polyhydramnios occurs because the fetus can't swallow amniotic fluid.`,
 wrong:`Any further oral intake — even slow-flow or sterile water — will be aspirated.`,
 cues:`Polyhydramnios, excessive frothy saliva, coughing/choking/cyanosis with first feed, catheter won't pass.`,
 safety:`NPO + airway clearance + head elevated + immediate notification; prepare for surgical repair.`,
 ev:`Airway clear, SpO₂ stable, no further aspiration events while awaiting surgery.`,
 take:`EA/TEF: excessive salivation + coughing, choking, cyanosis with feeding → stop feeds, suction, elevate head, notify.`,
 src:`${L.hr}, slides 13–14 (congenital anomalies — esophageal atresia, tracheoesophageal fistula); Exam 4 Learning Map (common congenital anomalies); ${L.tb}, p. 540 (excessive salivation, choking or turning blue = EA/TEF), 629–630. Polyhydramnios link and catheter test: ${L.sup}`},
s16:{id:'s16',t:'cloze',topic:'t4',cj:'ac',cats:['as'],hy:false,
 stem:`The NICU nurse receives two admissions. Complete the classification and anticipated risks.`,
 text:`Infant A was born at 35 2/7 weeks weighing 1,900 g (below the 10th percentile). This infant is classified as {0} and {1}, so the nurse anticipates {2}. Infant B was born at 42 3/7 weeks with dry, peeling skin, long nails and meconium staining; this infant is {3} and at risk for {4}.`,
 drops:[{opts:[`late preterm`,`term`,`extremely preterm`,`postterm`],ans:0},{opts:[`small for gestational age (SGA)`,`appropriate for gestational age (AGA)`,`large for gestational age (LGA)`],ans:0},{opts:[`hypoglycemia and thermoregulation problems`,`macrosomia-related birth injury`,`postmaturity syndrome`,`no added risks because the weight is over 1,500 g`],ans:0},{opts:[`postterm`,`late preterm`,`term`],ans:0},{opts:[`meconium aspiration and hypoglycemia from placental insufficiency`,`respiratory distress syndrome from surfactant deficiency`,`necrotizing enterocolitis from bowel immaturity`,`physiologic jaundice only`],ans:0}],
 why:`<b>What:</b> Classification by gestational age and by weight-for-gestational-age — the first High-Risk Newborn item on the professor's blueprint ("How are they classified?"). <b>Why:</b> Late preterm = 34 0/7–36 6/7 weeks; SGA = below the 10th percentile. Late preterm infants are at higher risk for thermoregulation problems, hypoglycemia, hyperbilirubinemia, sepsis and respiratory problems; SGA adds low glycogen and fat stores. Postterm (>42 weeks) infants show placental dysfunction (peeling skin, long nails, meconium) with risk for meconium aspiration and hypoglycemia.`,
 wrong:`35 weeks is not term; 1,900 g below the 10th percentile is not AGA. Macrosomia relates to LGA. RDS and NEC are complications of prematurity, not postterm birth.`,
 cues:`GA plus weight percentile; postterm physical findings.`,
 safety:`Classification predicts what to monitor before symptoms appear.`,
 ev:`Glucose and temperature monitoring ordered for Infant A; respiratory and glucose monitoring for Infant B.`,
 take:`Classify by GA (preterm <37, late preterm 34–36 6/7, postterm >42) AND by weight percentile (SGA <10th, AGA, LGA >90th) — then anticipate the risks.`,
 src:`${L.hr}, slides 2 (classification by birth weight and gestational age), 15–18 (preterm, late preterm, postterm); Exam 4 Learning Map (how are they classified; preterm/postterm infants); ${L.tb}, pp. 553, 631–632, 635.`},
s32:{id:'s32',t:'cloze',topic:'t7',cj:'gs',cats:['as','em','med'],hy:true,
 stem:`A 30-hour-old fails the CCHD pulse-oximetry screen (right hand 97%, foot 87%). Femoral pulses are weak, arm BP is 90/56 and leg BP is 62/40. Complete the nurse's plan for diagnostic evaluation.`,
 text:`Because the foot saturation is below {0}, the nurse {1}. The definitive test the nurse anticipates to identify the defect is {2}. Findings suggest {3}, so the nurse prepares for a prostaglandin infusion to {4}.`,
 drops:[{opts:[`90%`,`80%`,`95% in the hand`,`75%`],ans:0},{opts:[`notifies the provider for immediate evaluation`,`repeats the screen in 1 hour`,`documents a pass`,`rechecks at the 2-week visit`],ans:0},{opts:[`an echocardiogram`,`a chest x-ray alone`,`a hearing screen`,`a urinalysis`],ans:0},{opts:[`coarctation of the aorta`,`a ventricular septal defect`,`tetralogy of Fallot`,`normal transition`],ans:0},{opts:[`keep the ductus arteriosus open`,`close the ductus arteriosus`,`increase heart contractility`,`remove excess fluid`],ans:0}],
 why:`<b>What:</b> CHD diagnostic evaluation — a blueprint item. <b>Why:</b> The CCHD screen flags infants for immediate evaluation when any reading is below 90% (textbook). The lecture's diagnostic evaluation slide lists ECG, <b>echocardiography</b>, cardiac MRI and catheterization; echocardiography defines the anatomy. Arm BP higher than leg BP with weak femorals indicates coarctation, where lower-body flow may depend on the ductus — prostaglandins keep it open.`,
 wrong:`<90% is not repeated; a chest x-ray can show heart size but doesn't define the defect. VSD doesn't create an arm–leg gradient; TOF causes cyanosis in all extremities. Closing the ductus would cut off lower-body perfusion.`,
 cues:`Foot SpO₂ 87%, weak femorals, arm BP > leg BP.`,
 safety:`Ductal-dependent lesions can cause sudden shock as the ductus closes — act immediately; monitor for apnea on prostaglandin.`,
 ev:`Echo completed; improved lower-extremity pulses, perfusion and urine output on prostaglandin.`,
 take:`CHD diagnostics: CCHD screen (<90% = immediate evaluation) → echocardiography (definitive); also ECG, MRI, catheterization; hyperoxia test separates cardiac from pulmonary cyanosis.`,
 src:`${L.chd}, slides 8 (diagnostic evaluation: ECG, echocardiography, cardiac MRI, catheterization), 16 (obstructive defects), 21 (hyperoxia test; prostaglandins); Exam 4 Learning Map (CHD diagnostic evaluation); ${L.tb}, pp. 560–562 (CCHD screening), 1222–1224, 1228–1230.`}
};

s04:{id:'s04',t:'sata',topic:'t1',cj:'gs',cats:['as','pi','teach'],hy:true,
 stem:`On the initial newborn exam, the nurse finds a complete separation of the right upper lip that extends into the nostril. The palate is intact on palpation. The infant has a strong cry, HR 146, RR 48. The parents look away and ask, "Did we do something wrong?" Which actions are appropriate? <b>Select all that apply.</b>`,
 opts:[`Feed with the infant upright or semi-upright`,`Use a wide-based or specialty nipple (or help the mother position the breast to fill the gap) to create a seal`,`Burp frequently and watch for coughing, choking or color change during feeds`,`Weigh daily and track intake to support nutrition until surgical repair`,`Hold the infant, point out his normal features, and explain that a cleft lip forms early in pregnancy and is surgically repaired`,`Feed lying flat so milk flows more easily`,`Withhold all oral feedings until the lip is repaired`,`Keep the infant in the nursery until the parents are "ready" to see him`],ans:[0,1,2,3,4],
 why:`<b>What:</b> Cleft lip — failure of lip fusion during fetal development (instructor handout). The textbook notes it occurs around 5 weeks of gestation, when cells that normally fill the clefts fail to merge. <b>Why:</b> The lip gap makes it hard to form a seal, so the infant swallows air, feeds less efficiently and has an <b>aspiration risk</b>. The handout's priorities are <b>special feeding techniques, surgical repair and nutrition support</b>. A visible facial difference also affects parent–infant attachment, so family support is part of care.`,
 wrong:`Lying flat increases nasal regurgitation and aspiration. An infant with a cleft lip can and should be fed with modified technique — withholding feeds causes dehydration and poor weight gain. Keeping the baby away delays attachment; parents need early, supported contact.`,
 cues:`Visible lip separation (cleft lip), intact palate, stable vital signs, parental guilt.`,
 safety:`Aspiration prevention during every feed; monitor weight. After cleft LIP repair (supplemental standard practice — follow surgeon's orders): protect the lip suture line, keep the infant off the abdomen, use elbow immobilizers, and keep objects away from the mouth.`,
 ev:`Feeds completed without coughing or color change, steady weight gain, and parents holding and feeding the infant.`,
 take:`Cleft lip = visible lip separation → feeding difficulty and aspiration risk → upright, special nipple, burp often, nutrition support, prepare for surgical repair, support the family.`,
 src:`${L.ho} (cleft lip: what it is, key findings, nursing priorities); ${L.hr}, slide 14 (major congenital anomalies — cleft lip and palate); ${L.nf}, slide 11 (special considerations); Exam 4 Learning Map (cleft palate care; common congenital anomalies); ${L.tb}, pp. 540 (cleft lip on newborn assessment), 629–630, 704 (cleft lip forms at ~5 weeks' gestation). Specialty nipple, breast positioning and post-op lip precautions: ${L.sup}`},
s29:{id:'s29',t:'matrix',topic:'t6',cj:'ac',cats:['as','pi'],hy:false,
 stem:`Using quick clinical recognition, match each assessment finding or nursing priority to the condition it best fits.`,cols:[`Spina bifida (myelomeningocele)`,`Cleft lip`,`Autism spectrum disorder`],
 rows:[{x:`Sac-like lesion on the lower back with leg weakness`,ans:0},{x:`No anal wink and urinary retention (bowel/bladder dysfunction)`,ans:0},{x:`Visible separation of the upper lip with milk leaking and coughing during feeds`,ans:1},{x:`Limited social interaction, repetitive behaviors and distress at loud noises (sensory differences)`,ans:2},{x:`Priority: protect the sac, prevent infection, monitor neuro status, support the family`,ans:0},{x:`Priority: special feeding techniques, nutrition support and preparation for surgical repair`,ans:1},{x:`Priority: early screening, structured routines and family-centered care`,ans:2}],
 why:`<b>What:</b> The instructor's quick-recognition comparison — recognize the condition, identify its priority findings, and choose safe interventions. <b>Why:</b> Spina bifida is a neural tube defect in which the spinal column fails to close; nerve involvement below the lesion causes leg weakness and bowel/bladder dysfunction, and the exposed sac is an infection and injury risk. Cleft lip is a failure of lip fusion during fetal development; the gap impairs the seal for feeding and raises aspiration risk. Autism is a neurodevelopmental disorder affecting communication and behavior, with limited social interaction, repetitive behaviors and sensory differences; early screening and predictable routines help most.`,
 wrong:`Each finding and priority belongs to one condition: motor and bowel/bladder findings point to the spinal lesion, feeding and aspiration findings to the cleft, social-communication and sensory findings to autism. Sensory distress is not a feeding or spinal problem, and structured routines are not a priority for an open spinal lesion.`,
 cues:`Location of the problem (spine vs lip vs behavior) and the type of risk (infection/neuro vs aspiration/nutrition vs social/sensory).`,
 safety:`Spina bifida: never a dry dressing or supine before repair. Cleft lip: upright feeding and aspiration watch. Autism: reduce sensory triggers and plan for elopement or self-injury.`,
 ev:`The nurse can name each condition's top priority from its key findings.`,
 take:`Competency focus: recognize the condition → identify the priority findings → select the safe intervention. Spina bifida = protect the sac and watch neuro and bowel/bladder; cleft lip = feeding and aspiration; autism = early screening, routines, family-centered care.`,
 src:`${L.ho} (spina bifida, cleft lip and autism spectrum disorder: what it is, key findings, nursing priorities; competency focus); ${L.ntd}, slides 5, 9; ${L.hr}, slide 14; ${L.au}, slides 4–6; Exam 4 Learning Map (NTD types and care management; autism clinical manifestations, safety and family support; cleft palate care).`}
});
