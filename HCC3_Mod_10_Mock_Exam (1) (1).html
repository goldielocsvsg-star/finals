 segs:[{x:`HR 172 while crying,`,k:0},{x:`apical HR 88 at rest counted for 1 full minute;`,k:1},{x:`RR 58 and irregular;`,k:0},{x:`fine crackles at the bases on first auscultation;`,k:0},{x:`hands and feet bluish with pink trunk and lips;`,k:0},{x:`one 22-second apnea with color change;`,k:1},{x:`axillary temperature 97.1°F;`,k:1},{x:`alert with spontaneous startles.`,k:0}],
 why:`<b>What:</b> Most of Baby Alvarez's findings are expected first-period-of-reactivity physiology, but three show failed or incomplete adaptation. <b>Why:</b> In the first 30 minutes sympathetic activity raises HR (160–180 briefly) and alertness; lung fluid is still being absorbed so crackles can be heard at first; acrocyanosis reflects immature peripheral circulation. A resting HR below 120, apnea of 20 seconds or longer with color change, and a temperature below 97.7°F are not part of normal transition.`,
 wrong:`HR 172 <i>while crying</i> and alert startles are expected in the first period of reactivity (up to 30 min). RR 30–60, shallow and irregular, is normal. Crackles immediately after birth reflect lung fluid still being cleared. Acrocyanosis with pink lips/trunk is expected in the first 24 h — central color is what matters.`,
 cues:`Resting bradycardia (counted a full minute), apnea ≥20 s with color change, temperature <97.7°F.`,
 safety:`Breathing and heart-rate problems come first: stimulate, support airway/breathing, and escalate if bradycardia or apnea recurs; begin rewarming because cold increases oxygen and glucose demand.`,
 ev:`HR 120–160 at rest, no further apnea, unlabored RR 30–60, axillary temperature 97.7–99.5°F.`,
 take:`Acrocyanosis, irregular RR and a crying HR up to 180 are normal early; resting HR <120, apnea ≥20 s and T <97.7°F are not.`,
 src:`${L.pba}, slides 4 (first period of reactivity), 7–8 (respiratory & cardiovascular signs), 11 (thermogenic); ${L.tb}, pp. 511, 512–513, 515–516.`},
{id:'c1q2',case:'c1',t:'cloze',topic:'t2',cj:'ac',cats:['as','pi'],hy:false,time:`1411 (1 minute) — documented retrospectively`,
 lead:`The delivery nurse's 1-minute findings, now entered in the chart: body pink with blue hands and feet; HR 110; grimace when the nares were suctioned; some flexion of the extremities; slow, irregular breathing with a weak cry. At 5 minutes: strong cry, HR 146, active motion, cried with suction, acrocyanosis.`,
 notes:[{t:`1411`,v:`1-min: pink body/blue extremities, HR 110, grimace to suction, some flexion, slow irregular respirations with weak cry.`},{t:`1415`,v:`5-min: acrocyanosis, HR 146, cry to suction, active motion, strong cry.`}],
 stem:`Complete the nurse's documentation.`,
 text:`The 1-minute APGAR score is {0}, which indicates {1}. The 5-minute score is {2}. The nurse recognizes that the APGAR score {3}.`,
 drops:[{opts:[`6`,`5`,`7`,`8`],ans:0},{opts:[`moderate difficulty adjusting to extrauterine life`,`severe distress requiring chest compressions`,`a normal, uncomplicated transition`,`probable long-term neurologic injury`],ans:0},{opts:[`9`,`10`,`8`,`7`],ans:0},{opts:[`does not replace ongoing assessment and never delays resuscitation`,`determines whether resuscitation should begin`,`must be assigned before any intervention`,`predicts later developmental outcome`],ans:0}],
 why:`<b>What:</b> 1-minute APGAR = Appearance 1 (pink body, blue extremities) + Pulse 2 (110 is ≥100) + Grimace 1 + Activity 1 (some flexion) + Respiration 1 (slow, irregular, weak cry) = <b>6</b>. At 5 minutes: 1 + 2 + 2 + 2 + 2 = <b>9</b>. <b>Why:</b> A score of 4–6 reflects moderate difficulty with transition; the improvement to 9 shows the response to drying, stimulation and positioning.`,
 wrong:`7 or 8 would require full points for HR plus more points elsewhere; 5 scores the HR of 110 as 1, the most common error (the cutoff is 100). "Severe distress" describes 0–3. 10 is uncommon because acrocyanosis keeps appearance at 1. The APGAR describes adaptation; it does not decide when to resuscitate or predict long-term outcome.`,
 cues:`HR 110 (≥100 = 2 points); acrocyanosis = 1; grimace only = 1; some flexion = 1; weak irregular respirations = 1.`,
 safety:`Never wait for the 1-minute score to act on poor breathing or tone — initial steps (warm, dry, stimulate, position airway, assess HR/breathing) begin immediately.`,
 ev:`Rising score between 1 and 5 minutes, strong cry, HR ≥100.`,
 take:`APGAR pulse cutoff is 100; acrocyanosis = 1 for appearance; 7–10 good, 4–6 moderate difficulty, 0–3 severe distress.`,
 src:`${L.nc}, slides 2–3 (initial assessment, APGAR); ${L.tb}, pp. 538–540 (Apgar score).`},
{id:'c1q3',case:'c1',t:'matrix',topic:'t1',cj:'rc',cats:['as'],hy:false,time:`1510 (60 min)`,
 lead:`Baby Alvarez was stimulated and rewarmed skin-to-skin; HR and breathing normalized. Now his mother says, "He won't wake up to eat — is something wrong?"`,
 flow:[{t:`1510`,hr:`128`,rr:`54 shallow`,spo2:`—`,temp:`97.5`,bg:`—`,skin:`Trunk pink; trunk cool and mottled when blanket removed`,resp:`No retractions`,feed:`Asleep, won't latch`,out:`—`,na:`Sleeping, rouses to touch then sleeps`,ab:['temp']}],
 stem:`For each finding at 60 minutes of life, indicate whether it is <b>expected</b> or <b>requires follow-up</b>.`,
 cols:[`Expected`,`Requires follow-up`],rowHead:`Finding`,
 rows:[{x:`Sleeps deeply and is difficult to wake for a feeding`,ans:0},{x:`RR 54, shallow, no retractions`,ans:0},{x:`HR 128 while asleep`,ans:0},{x:`Axillary temperature 97.5°F`,ans:1},{x:`Trunk cool and mottled when the blanket is removed`,ans:1},{x:`Hands and feet bluish`,ans:0}],
 why:`<b>What:</b> Baby Alvarez is in the <b>period of decreased responsiveness</b> (lasts 60–100 minutes): pink, sleeping, respirations rapid and shallow up to 60/min. That explains the sleepiness. <b>Why:</b> After the first reactive burst the infant enters sleep with decreased motor activity. His temperature and a cool, mottled trunk, however, show ongoing heat loss.`,
 wrong:`Sleepiness here is expected behavior, not lethargy — he rouses to touch with normal tone and vital signs. RR 54 and HR 128 asleep are within range. Acrocyanosis remains normal in the first 24 h. Temperature below 97.7°F and mottling of the trunk are not expected.`,
 cues:`Time since birth (~60 min), normal tone and rousability, temperature 97.5°F, mottled trunk.`,
 safety:`Keep him skin-to-skin with a warm blanket and hat; recheck the temperature; don't wake him with vigorous unwrapping (more heat loss).`,
 ev:`Temperature ≥97.7°F; he wakes in the second period of reactivity (2–8 h) with feeding cues.`,
 take:`Sleepy + pink + normal vitals at 1–2 h = decreased responsiveness. Sleepy + hypotonic, poor perfusion, temp instability = think hypoglycemia, cold stress or sepsis.`,
 src:`${L.pba}, slides 4–6 (periods of reactivity), 11 (thermogenic); ${L.tb}, pp. 511, 515–516.`},
{id:'c1q4',case:'c1',t:'bow',topic:'t2',cj:'ph',cats:['pi','em'],hy:true,time:`1540`,
 lead:`Visitors arrived. The infant was weighed on an uncovered scale and unwrapped for photos for 25 minutes near the window. He is now cool, mottled, jittery and has a weak suck.`,
 flow:[{t:`1540`,hr:`164`,rr:`66`,spo2:`95%`,temp:`96.9`,bg:`42 mg/dL`,skin:`Mottled, cool`,resp:`Mild subcostal retractions`,feed:`Weak suck`,out:`Void ×1`,na:`Tremors persist when limb is held`,ab:['rr','temp','bg','skin','resp']}],
 notes:[{t:`1540`,v:`Fine tremors that continue when the extremity is gently held. Weak suck. Grandparents present.`}],
 stem:`Complete the bow-tie for Baby Alvarez.`,
 cond:{opts:[`Cold stress with secondary hypoglycemia`,`Normal second period of reactivity`,`Early-onset neonatal sepsis`,`Hypoglycemia from maternal diabetes`],ans:0},
 acts:{opts:[`Rewarm gradually skin-to-skin (or radiant warmer with skin probe) with a hat and dry warm blanket`,`Begin the hypoglycemia protocol: feed now if able and recheck glucose after the feeding`,`Place a heating pad under the infant to rewarm quickly`,`Give the first bath to stimulate circulation`,`Offer sterile water by bottle`],ans:[0,1]},
 mons:{opts:[`Axillary temperature every 15–30 minutes until stable`,`Bedside glucose after the feeding per protocol`,`Head circumference`,`Hearing screen result`,`Stool frequency`],ans:[0,1]},
 why:`<b>What:</b> Cold stress after exposure, now causing tachypnea, retractions, jitteriness and a low glucose. <b>Why:</b> Newborns produce heat by metabolizing brown fat (nonshivering thermogenesis), which increases oxygen consumption and glucose use; prolonged cold leads to hypoxia, hypoglycemia and metabolic acidosis.`,
 wrong:`Second reactivity (2–8 h) brings tachycardia and mucus — not hypothermia, mottling or low glucose. Sepsis is possible if he fails to rewarm, but there are no risk factors and a clear exposure explains the picture. The mother has no diabetes. Heating pads burn and rewarm too fast; a bath adds evaporative loss; sterile water has no glucose and risks aspiration. Head circumference, hearing and stools don't track this problem.`,
 cues:`25 min uncovered near a window, temp 96.9°F, mottling, RR 66 with retractions, jitteriness not stopped by gentle restraint, glucose 42 mg/dL.`,
 safety:`Stop heat loss and supply fuel — both are reversible causes of deterioration. Rewarm gradually.`,
 ev:`Temperature ≥97.7°F, RR <60 without retractions, glucose ≥45 mg/dL, tremors resolved, stronger suck.`,
 take:`Cold stress → ↑ O₂ and glucose consumption → respiratory distress and hypoglycemia. Warm AND check/treat glucose.`,
 src:`${L.pba}, slide 11 (heat loss, thermogenesis, hypothermia); ${L.nc}, slide 8 (maintaining body temperature); ${L.tb}, pp. 515–516 (brown fat, cold stress), 554, 559–560 (hypoglycemia, 45 mg/dL threshold).`},
{id:'c1q5',case:'c1',t:'matrix',topic:'t1',cj:'eo',cats:['ev'],hy:false,time:`1640`,
 lead:`He was rewarmed skin-to-skin with a hat and blanket and breastfed with audible swallows. The nurse reassesses.`,
 flow:[{t:`1610`,hr:`150`,rr:`58`,spo2:`97%`,temp:`97.4`,bg:`—`,skin:`Pink, less mottled`,resp:`Retractions resolved`,feed:`BF 15 min`,out:`—`,na:`Warming`},{t:`1640`,hr:`142`,rr:`50`,spo2:`98%`,temp:`98.1`,bg:`54 mg/dL`,skin:`Pink trunk`,resp:`Unlabored`,feed:`Sucking well`,out:`Meconium ×1`,na:`Tremors resolved`}],
 stem:`Evaluate each 1640 finding.`,cols:[`Effective response`,`Needs further intervention`],
 rows:[{x:`Temperature trend 96.9 → 97.4 → 98.1°F`,ans:0},{x:`Glucose 54 mg/dL after feeding`,ans:0},{x:`RR 50 without retractions`,ans:0},{x:`Meconium stool passed`,ans:0},{x:`Mother asks to bathe him now "so he's clean for pictures"`,ans:1},{x:`Mother plans to put him back in the open bassinet beside the window`,ans:1}],
 why:`<b>What:</b> Thermoregulation and fuel are restored — temperature in range and rising, glucose above threshold, breathing unlabored. <b>Why:</b> Warmth lowers metabolic demand; feeding supplies glucose. The two family plans would recreate the original heat loss (evaporation from a bath; radiation to a cold window).`,
 wrong:`Passing meconium is a normal GI adaptation, not a concern. Rising temperature and normal glucose show effectiveness. The bath and window plans are not "effective outcomes" — they need teaching.`,
 cues:`Temperature trend, post-feed glucose, resolved retractions; family plans that reintroduce evaporation and radiation.`,
 safety:`Delay the bath until temperature is stable; keep the bassinet away from windows and outside walls.`,
 ev:`Stable temp 97.7–99.5°F through the next vital-sign checks; parents explain why the bath waits.`,
 take:`Evaluation compares the result with the goal — and catches family actions that would undo it.`,
 src:`${L.pba}, slides 11 (heat loss mechanisms), 14 (GI — meconium); ${L.nc}, slide 14 (protective environment); ${L.tb}, pp. 515–516, 554.`},
{id:'c1q6',case:'c1',t:'sata',topic:'t2',cj:'ta',cats:['teach','pi'],hy:false,time:`1700`,
 lead:`Baby Alvarez is ready to transfer to mother-baby care. The nurse verifies identification and completes early family teaching.`,
 orders:[{t:`1700`,v:`Transfer to mother-baby unit; infant security tag on`}],
 notes:[{t:`1700`,v:`ID bands ×4 applied in LDR; security tag active.`}],
 stem:`Which actions by the nurse are appropriate before and during transfer? <b>Select all that apply.</b>`,
 opts:[`Compare the infant's ID band number with the mother's band before handing the infant to her`,`Teach parents to release the infant only to staff wearing the unit-specific photo ID`,`Transport the infant in the bassinet rather than carrying him in the hallway`,`Teach the parents to suction the mouth before the nose with a bulb syringe`,`Leave the infant in the bassinet in the hallway while the room is prepared`,`Tell the mother it is safe to sleep with him in her bed if she is tired`,`Allow a person in scrubs to take him for testing if they know his name`],ans:[0,1,2,3],
 why:`<b>What:</b> Infant safety at transfer — identification and abduction prevention — plus the first airway teaching. <b>Why:</b> Matching ID bands prevent mix-ups; abductors often pose as staff in scrubs; bassinet transport keeps infants contained and visible; mouth-before-nose suction prevents aspiration of oral secretions when the nose is stimulated.`,
 wrong:`An unattended infant in a hallway is an abduction risk. Bed-sharing with a drowsy parent increases suffocation/SIDS risk — the infant sleeps on his back in his own bassinet. Knowing the baby's name is not identification; staff must wear the unit-specific photo badge.`,
 cues:`Transfer between units, security tag, new parents, first-day airway secretions.`,
 safety:`Verify ID at every hand-off; never leave the infant unattended; safe sleep from the first nap.`,
 ev:`Parents state who may take the baby, demonstrate bulb suction, and place him supine in the bassinet.`,
 take:`ID check at every separation/reunion; only staff with the unit photo ID; bulb syringe mouth then nose; back to sleep, own bassinet.`,
 src:`${L.nc}, slides 8 (immediate interventions), 14 (protective environment — abduction, injury prevention), 18 (discharge planning); ${L.tb}, pp. 562–563 (abduction), 571–575 (safe sleep).`},

/* ---------------- CASE 2 ---------------- */
{id:'c2q1',case:'c2',t:'sata',topic:'t4',cj:'rc',cats:['as'],hy:true,time:`0920`,
 lead:`The nurse reviews the history before the first glucose check. Axillary temperature is now 97.5°F after transfer.`,
 flow:[{t:`0920`,hr:`150`,rr:`56`,spo2:`97%`,temp:`97.5`,bg:`Due`,skin:`Ruddy`,resp:`Unlabored`,feed:`—`,out:`—`,na:`Transferred to nursery`,ab:['temp']}],
 stem:`Which factors place Baby Girl Thompson at increased risk for neonatal hypoglycemia? <b>Select all that apply.</b>`,
 opts:[`Maternal type 1 diabetes with HbA1c 8.4% in the third trimester`,`Birth weight 4,520 g (large for gestational age)`,`Axillary temperature 97.5°F after transfer`,`APGAR scores of 8 and 9`,`Female sex`,`Mother is GBS negative`,`Plan to breastfeed`],ans:[0,1,2],
 why:`<b>What:</b> Three risk factors stack up: an infant of a diabetic mother, LGA size, and cold stress. <b>Why:</b> Poorly controlled maternal diabetes → fetal hyperglycemia → fetal hyperinsulinemia that continues after birth; LGA (macrosomia) is the hallmark of that hyperinsulinemia; cold stress increases glucose use. The textbook lists LGA, infants of diabetic mothers and perinatal stress such as cold stress among infants who should be screened.`,
 wrong:`Good APGARs do not lower metabolic risk. Sex and GBS status are unrelated to glucose regulation. Breastfeeding is encouraged — early, frequent feeds help prevent hypoglycemia.`,
 cues:`Maternal HbA1c 8.4%, >90th percentile weight, temperature below 97.7°F.`,
 safety:`Screen at-risk infants on schedule even if they look well — hypoglycemia can be asymptomatic.`,
 ev:`Pre-feed glucose values at or above the protocol threshold.`,
 take:`At-risk for hypoglycemia: IDM, LGA, SGA, preterm/late preterm, and perinatal stress (asphyxia, cold stress, respiratory distress).`,
 src:`${L.hr}, slide 12 (infants of diabetic mothers); ${L.pba}, slide 15 (hepatic — glucose); ${L.tb}, pp. 559–560, 626–629.`},
{id:'c2q2',case:'c2',t:'hl',topic:'t2',cj:'rc',cats:['as','em'],hy:true,time:`1005`,
 lead:`At 1 h 15 min of life the nurse is called because the infant "is shaky." Assessment is documented below.`,
 flow:[{t:`1005`,hr:`158`,rr:`62`,spo2:`96%`,temp:`97.4`,bg:`Pending`,skin:`Plethoric face, acrocyanosis`,resp:`Mild tachypnea`,feed:`Weak, uncoordinated suck`,out:`—`,na:`See note`,ab:['rr','temp','feed']}],
 notes:[{t:`1005`,v:`Tremors of all extremities that continue when the limb is held; high-pitched cry; weak suck; Moro symmetric.`}],
 stem:`Highlight the findings that are consistent with hypoglycemia.`,
 segs:[{x:`Tremors that continue when the extremity is gently held;`,k:1},{x:`high-pitched cry;`,k:1},{x:`weak, uncoordinated suck;`,k:1},{x:`axillary temperature 97.4°F;`,k:1},{x:`round, plethoric face;`,k:0},{x:`hands and feet bluish;`,k:0},{x:`Moro reflex symmetric;`,k:0},{x:`anterior fontanel soft and flat.`,k:0}],
 why:`<b>What:</b> Clinical signs of neonatal hypoglycemia. <b>Why:</b> The brain depends on glucose; neuroglycopenia and the adrenergic response produce jitteriness/tremors, an abnormal (high-pitched) cry, poor feeding, and temperature instability (hypothermia).`,
 wrong:`A round, ruddy face is the characteristic IDM appearance (and can reflect polycythemia) — not a sign of low glucose. Acrocyanosis, a symmetric Moro and a soft flat fontanel are normal.`,
 cues:`Tremors not stopped by gentle restraint (normal tremors stop), weak suck, high-pitched cry, low temperature.`,
 safety:`Check the glucose now — don't wait for the scheduled time when symptoms appear.`,
 ev:`Tremors stop and suck strengthens as glucose normalizes.`,
 take:`Hypoglycemia signs: jitteriness/tremors, poor feeding, abnormal cry, hypothermia, hypotonia/lethargy, apnea, seizures — or no signs at all.`,
 src:`${L.hr}, slide 12 (IDM); ${L.nc}, slide 9 (common newborn problems); ${L.tb}, pp. 559–560.`},
{id:'c2q3',case:'c2',t:'mc',topic:'t4',cj:'ac',cats:['as','em'],hy:true,time:`1010`,
 lead:`Bedside glucose 34 mg/dL. Serum glucose sent to the lab.`,
 flow:[{t:`1010`,hr:`160`,rr:`62`,spo2:`96%`,temp:`97.4`,bg:`34 mg/dL`,skin:`Plethoric`,resp:`Mild tachypnea`,feed:`Unable to sustain suck`,out:`—`,na:`Symptomatic`,ab:['bg','rr','temp']}],
 labs:[{t:`1010`,v:`Bedside glucose 34 mg/dL — serum glucose pending`}],
 stem:`Which explanation of Baby Girl Thompson's glucose result is most accurate?`,
 opts:[`Fetal hyperinsulinemia from maternal hyperglycemia persists after the glucose supply stops at cord clamping, causing symptomatic hypoglycemia`,`Maternal insulin crossed the placenta and is lowering the infant's glucose`,`This is the expected physiologic nadir; recheck before the next routine feeding`,`Her mother's milk supply is not yet adequate, so the low glucose reflects underfeeding`],ans:0,
 why:`<b>What:</b> Symptomatic neonatal hypoglycemia in an infant of a diabetic mother. <b>Why:</b> Maternal glucose crosses the placenta; the fetal pancreas responds with excess insulin (which also drives macrosomia). After birth the maternal glucose supply ends abruptly, but the high insulin level continues — glucose falls within the first hours.`,
 wrong:`Maternal insulin does not cross the placenta. A healthy term infant can dip in the first 1–2 h, but this infant is at risk AND symptomatic — not "expected." Colostrum volume is normally small; underfeeding is not the mechanism in the first hour of an IDM.`,
 cues:`Maternal type 1 DM with high HbA1c, LGA, glucose 34 mg/dL with neurologic and feeding symptoms.`,
 safety:`Symptomatic hypoglycemia needs treatment now; the textbook says confirm low bedside values with serum glucose but do NOT delay treatment.`,
 ev:`Glucose at or above threshold on recheck, with symptoms resolved.`,
 take:`Glucose crosses the placenta; insulin does not. IDM hypoglycemia = persistent fetal hyperinsulinemia.`,
 src:`${L.hr}, slide 12 (IDM: macrosomia, hypoglycemia); ${L.tb}, pp. 559–560, 626–629.`},
{id:'c2q4',case:'c2',t:'order',topic:'t2',cj:'ta',cats:['med','pi'],hy:true,time:`1015`,
 lead:`The provider is notified. Because the infant is symptomatic and cannot feed effectively, the provider orders an IV dextrose 10% (D10W) bolus followed by a continuous infusion.`,
 orders:[{t:`1015`,v:`D10W 2 mL/kg IV over 5–10 min, then D10W continuous infusion at ordered rate; recheck glucose 30 min after bolus (supplemental standard practice)`}],
 mar:[{t:`1015`,v:`D10W bolus — DUE (weight 4.52 kg)`}],
 stem:`Place the nurse's actions in the correct order.`,
 items:[`Verify the order and calculate the bolus volume using the infant's weight (4.52 kg × 2 mL/kg ≈ 9 mL)`,`Confirm the IV site is patent and give the D10W bolus at the ordered rate`,`Start the continuous D10W infusion on an infusion pump at the ordered rate`,`Recheck the glucose 30 minutes after the bolus`,`Document the intervention and the infant's response and update the provider`],
 why:`<b>What:</b> Safe IV dextrose administration for symptomatic neonatal hypoglycemia. <b>Why:</b> A weight-based bolus corrects the acute deficit; the continuous infusion prevents a rebound drop because the infant's insulin level remains high.`,
 wrong:`Starting the infusion before verifying the dose risks a calculation error; rechecking before the bolus has had time to act gives misleading data; documentation comes after the response is known.`,
 cues:`Weight 4.52 kg; symptomatic; unable to feed effectively.`,
 safety:`Neonatal doses are weight-based — verify every calculation; use a pump; IV glucose avoids the rebound spike caused by large oral sugar loads.`,
 ev:`Glucose at or above threshold 30 minutes after the bolus; tremors resolve.`,
 take:`Infants who can't feed safely or remain symptomatic get IV dextrose; verify → give → maintain → recheck → document.`,
 src:`${L.hr}, slide 12 (IDM care — glucose levels); ${L.tb}, pp. 559–560 (IV fluids for infants who cannot be fed enterally). Bolus volume/rate: ${L.sup}`},
{id:'c2q5',case:'c2',t:'matrix',topic:'t4',cj:'eo',cats:['ev','as'],hy:true,time:`Day 1 — 1600 and 20 h`,
 lead:`The infusion is weaned as feeds improve. Later findings are added to the chart.`,
 flow:[{t:`1045`,hr:`146`,rr:`52`,spo2:`97%`,temp:`98.0`,bg:`52`,skin:`Plethoric`,resp:`Unlabored`,feed:`Sucking well`,out:`Void`,na:`Tremors resolved`},{t:`1600`,hr:`140`,rr:`48`,spo2:`98%`,temp:`98.4`,bg:`61`,skin:`Plethoric`,resp:`Unlabored`,feed:`BF 20 min`,out:`Meconium`,na:`Calm`},{t:`20 h`,hr:`144`,rr:`50`,spo2:`98%`,temp:`98.6`,bg:`64`,skin:`Yellow face and chest`,resp:`Unlabored`,feed:`BF 15 min`,out:`Void`,na:`Twitching of extremities, jittery again`,ab:['skin','na']}],
 labs:[{t:`1045`,v:`Hematocrit 68% (elevated)`}],
 stem:`Evaluate each finding.`,cols:[`Expected/effective — continue plan`,`Requires follow-up`],
 rows:[{x:`Glucose trend 34 → 52 → 61 → 64 mg/dL`,ans:0},{x:`Tremors resolved and strong suck after treatment`,ans:0},{x:`Yellow skin on the face and chest at 20 hours of age`,ans:1},{x:`Hematocrit 68% with a ruddy appearance`,ans:1},{x:`New twitching and jitteriness at 20 h with glucose 64 mg/dL`,ans:1}],
 why:`<b>What:</b> The hypoglycemia has resolved, but other IDM complications are emerging. <b>Why:</b> Chronic fetal hyperinsulinemia/hypoxia stimulates red-cell production (polycythemia) → more bilirubin to process; jaundice in the first 24 h is never routine. Jitteriness with a normal glucose points to a different metabolic cause, such as hypocalcemia, which the textbook lists among IDM problems.`,
 wrong:`A rising glucose and resolved symptoms show effective treatment. The other three are not "expected" — each needs assessment and provider notification.`,
 cues:`Jaundice <24 h, Hct 68%, jitteriness with normal glucose.`,
 safety:`Evaluating outcomes includes anticipating the next predictable complication.`,
 ev:`Stable glucose off IV; bilirubin and calcium evaluated and treated.`,
 take:`IDM checklist: hypoglycemia, macrosomia/birth injury, anomalies, RDS, polycythemia, hyperbilirubinemia, hypocalcemia.`,
 src:`${L.hr}, slide 12 (IDM); ${L.tb}, pp. 626–629 (polycythemia, hypocalcemia, hyperbilirubinemia in IDM), 557–559.`},
{id:'c2q6',case:'c2',t:'sata',topic:'t2',cj:'gs',cats:['teach'],hy:false,time:`Day 2 — discharge teaching`,
 lead:`Glucose values have been stable for 24 hours off IV fluids. The parents ask what to watch for at home.`,
 notes:[{t:`Day 2`,v:`Glucose stable ×24 h. Bilirubin below phototherapy threshold. Parents attentive.`}],
 stem:`Which teaching points should the nurse include? <b>Select all that apply.</b>`,
 opts:[`Feed at early hunger cues, at least 8–12 times in 24 hours`,`Call the provider if she becomes shaky, sweaty, very sleepy or feeds poorly`,`Watch for yellow skin spreading down the body and report it`,`Count wet diapers and stools each day`,`Give sugar water if she seems sleepy between feeds`,`Let her sleep through night feedings so she can rest`,`Shakiness is normal for big babies and can be ignored`],ans:[0,1,2,3],
 why:`<b>What:</b> Caregiver monitoring after neonatal hypoglycemia and with IDM-related bilirubin risk. <b>Why:</b> Frequent cue-based feeds maintain glucose and promote bilirubin excretion; parents must recognize symptoms of low glucose and jaundice; output reflects intake.`,
 wrong:`Sugar water provides no lasting calories and displaces breast milk. Skipping night feeds risks low glucose and dehydration. Jitteriness is a hypoglycemia cue — never normal to ignore.`,
 cues:`Recent symptomatic hypoglycemia, polycythemia/jaundice risk, breastfeeding.`,
 safety:`Parents should know exactly which signs mean "call now."`,
 ev:`Parents restate the warning signs and feeding plan (teach-back).`,
 take:`Teach: frequent feeds, hypoglycemia signs, jaundice, diaper counts, and when to call.`,
 src:`${L.nc}, slides 17–18 (discharge teaching); ${L.hr}, slide 12; ${L.tb}, pp. 559–560, 579.`},

/* ---------------- CASE 3 ---------------- */
{id:'c3q1',case:'c3',t:'sata',topic:'t4',cj:'rc',cats:['as'],hy:true,time:`1400 (14 h)`,
 lead:`The nurse reviews the maternal and birth history while planning the shift.`,
 stem:`Which factors increase Baby Boy Reyes's risk for neonatal infection? <b>Select all that apply.</b>`,
 opts:[`Rupture of membranes 24 hours before birth`,`Maternal intrapartum temperature 101.1°F`,`GBS-positive mother whose first antibiotic dose was given only 2 hours before birth`,`Male sex`,`Vaginal birth with an epidural`,`APGAR scores 8 and 9`,`Breastfeeding`],ans:[0,1,2,3],
 why:`<b>What:</b> Multiple perinatal risk factors for early-onset infection. <b>Why:</b> Prolonged ROM allows ascending infection; maternal fever suggests chorioamnionitis; GBS colonization with inadequate intrapartum prophylaxis leaves the infant unprotected; the textbook notes males are affected about twice as often.`,
 wrong:`An epidural and good APGARs are not infection risks. Breastfeeding is protective (antibodies in colostrum).`,
 cues:`ROM 24 h, maternal fever, GBS positive with <4 h of antibiotics, male.`,
 safety:`Risk factors lower your threshold for escalation when subtle signs appear.`,
 ev:`Close observation plan in place; early changes recognized.`,
 take:`Infection risk: prematurity, prolonged/prelabor ROM, maternal fever/chorioamnionitis, GBS without adequate prophylaxis, invasive procedures, male sex.`,
 src:`${L.pba}, slide 16 (immune system — risk factors); ${L.hr}, slide 8 (neonatal infection patterns); ${L.tb}, pp. 613–615.`},
{id:'c3q2',case:'c3',t:'hl',topic:'t4',cj:'ac',cats:['as','em'],hy:true,time:`2000 (20 h)`,
 lead:`Over the afternoon the infant has changed. His mother says, "He's just not acting like himself." Review the trend.`,
 flow:[{t:`1400`,hr:`150`,rr:`52`,spo2:`—`,temp:`97.8`,bg:`—`,skin:`Pink`,resp:`Unlabored`,feed:`BF 10 min`,out:`Void`,na:`Sleepier`},{t:`1700`,hr:`164`,rr:`58`,spo2:`—`,temp:`97.5`,bg:`—`,skin:`Pale`,resp:`Unlabored`,feed:`BF 4 min, weak`,out:`—`,na:`Hard to rouse`,ab:['temp']},{t:`2000`,hr:`180`,rr:`68`,spo2:`95%`,temp:`97.1 (under warmer)`,bg:`44 mg/dL`,skin:`Mottled`,resp:`Mild grunting`,feed:`Refused`,out:`Meconium`,na:`Cap refill 4 s; decreased tone`,ab:['hr','rr','temp','bg','skin','resp','feed','na']}],
 stem:`Highlight the findings from the 2000 assessment that indicate deterioration.`,
 segs:[{x:`Temperature 97.1°F despite the radiant warmer (down from 98.2°F);`,k:1},{x:`HR 180 at rest;`,k:1},{x:`refused the last feeding;`,k:1},{x:`skin mottled with capillary refill 4 seconds;`,k:1},{x:`decreased tone, difficult to rouse;`,k:1},{x:`passed a meconium stool;`,k:0},{x:`hands and feet bluish;`,k:0},{x:`anterior fontanel soft and flat.`,k:0}],
 why:`<b>What:</b> A pattern of subtle systemic illness that is worsening over 6 hours. <b>Why:</b> Newborns respond to infection with temperature instability (often LOW, because thermoregulation and immune responses are immature), lethargy, poor feeding, tachycardia and poor perfusion (early compensated shock).`,
 wrong:`Meconium at 20 h is a normal GI adaptation. Acrocyanosis is expected. A soft, flat fontanel is normal (bulging would suggest meningitis/ICP).`,
 cues:`Trend: temp 98.2 → 97.8 → 97.5 → 97.1°F under a warmer; HR 150 → 180; feeding 20 min → refused; new mottling and poor tone.`,
 safety:`Trends matter more than any single value; failure to maintain temperature under a warmer is a red flag.`,
 ev:`After treatment: stable temperature without escalating warmer support, HR back toward baseline, brisk refill, active feeding.`,
 take:`Earliest sepsis signs are nonspecific: "not doing well," lethargy, poor feeding, temperature instability.`,
 src:`${L.hr}, slide 8 (neonatal infection); ${L.tb}, pp. 613–615 (sepsis manifestations).`},
{id:'c3q3',case:'c3',t:'bow',topic:'t4',cj:'ph',cats:['pi','em'],hy:true,time:`2010`,
 lead:`The nurse moves the infant to a radiant warmer with continuous monitoring and prepares to call the provider.`,
 flow:[{t:`2010`,hr:`182`,rr:`70`,spo2:`94%`,temp:`97.0`,bg:`44`,skin:`Mottled`,resp:`Intermittent grunting`,feed:`NPO for now`,out:`—`,na:`Lethargic`,ab:['hr','rr','temp','bg','skin','resp']}],
 stem:`Complete the bow-tie.`,
 cond:{opts:[`Early-onset neonatal sepsis`,`Isolated cold stress`,`Physiologic second period of reactivity`,`Hypoglycemia from maternal diabetes`],ans:0},
 acts:{opts:[`Notify the provider immediately using SBAR`,`Obtain the ordered blood culture, then give the first antibiotic dose promptly`,`Rewarm and recheck the temperature in 4 hours before calling`,`Encourage breastfeeding to give him energy`,`Place him prone to ease his breathing`],ans:[0,1]},
 mons:{opts:[`Temperature trend`,`Perfusion: HR, capillary refill, color, BP`,`Head circumference`,`Hearing screen`,`Daily weight only`],ans:[0,1]},
 why:`<b>What:</b> Probable early-onset sepsis. <b>Why:</b> Perinatal risk factors plus a worsening pattern of temperature instability, tachycardia, tachypnea/grunting, poor perfusion, lethargy and a borderline glucose.`,
 wrong:`Cold stress responds to warming — his temperature is falling while UNDER a warmer. Second reactivity does not cause lethargy or mottling. There is no maternal diabetes. Waiting 4 hours delays time-sensitive antibiotics; a lethargic, tachypneic infant should not be fed orally (aspiration); prone positioning is not indicated and contradicts safe sleep.`,
 cues:`Falling temperature under a warmer, HR 182, grunting, cap refill 4 s, lethargy, risk factors.`,
 safety:`Sepsis is time-critical: escalate, culture, antibiotics without delay.`,
 ev:`Within 24–48 h of therapy: stable temp, HR toward baseline, cap refill <3 s, feeding again.`,
 take:`"Not acting right" + risk factors = sepsis evaluation and prompt antibiotics — never "wait and see."`,
 src:`${L.hr}, slides 8 (infection), 19–20 (care of the high-risk newborn: respiratory support, protection from infection); ${L.tb}, pp. 613–615.`},
{id:'c3q4',case:'c3',t:'sata',topic:'t4',cj:'gs',cats:['med','pi'],hy:true,time:`2025`,
 lead:`The provider evaluates the infant at the bedside and writes admission orders to the NICU.`,
 orders:[{t:`2025`,v:`Transfer to NICU; continuous cardiorespiratory monitoring and pulse oximetry`},{t:`2025`,v:`CBC with differential; blood culture; repeat glucose`},{t:`2025`,v:`IV access; ampicillin and gentamicin IV per weight after blood culture (supplemental standard practice)`},{t:`2025`,v:`IV D10W at maintenance rate; NPO`}],
 mar:[{t:`2030`,v:`Ampicillin IV — DUE after culture`},{t:`2030`,v:`Gentamicin IV — DUE after culture`}],
 stem:`Which nursing actions are appropriate now? <b>Select all that apply.</b>`,
 opts:[`Draw the blood culture before the first antibiotic dose without delaying therapy`,`Start continuous cardiorespiratory and SpO₂ monitoring`,`Recheck the glucose and maintain the IV dextrose as ordered`,`Give the first antibiotic doses as soon as the culture is obtained`,`Keep him in a neutral thermal environment (radiant warmer)`,`Hold the antibiotics until the culture result returns`,`Send him back to his mother's room to breastfeed`],ans:[0,1,2,3,4],
 why:`<b>What:</b> Initial sepsis management. <b>Why:</b> Cultures drawn before antibiotics identify the organism; antibiotics must still start promptly; sepsis can cause hypoglycemia and apnea, so glucose and continuous monitoring are needed; a neutral thermal environment reduces oxygen and glucose consumption.`,
 wrong:`Cultures take 24–48 h — waiting for results before treating is unsafe. He is lethargic and tachypneic, needs NICU monitoring and should be NPO for now.`,
 cues:`Orders for cultures and antibiotics; glucose 44 mg/dL; tachypnea/grunting.`,
 safety:`Culture first when it doesn't delay therapy; antibiotics on time; weight-based dosing double-checked.`,
 ev:`Antibiotics given within the ordered time; glucose ≥45 mg/dL; no apnea on the monitor.`,
 take:`Sepsis bundle for nurses: monitor, cultures → antibiotics promptly, glucose, warmth, fluids.`,
 src:`${L.hr}, slides 8, 19–20 (respiratory support, thermoregulation, protection from infection); ${L.tb}, pp. 613–615. Specific antibiotics: ${L.sup}`},
{id:'c3q5',case:'c3',t:'mc',topic:'t4',cj:'eo',cats:['ev'],hy:true,time:`Day 3 (48 h of antibiotics)`,
 lead:`Blood culture grew Group B Streptococcus. The infant has received 48 hours of IV antibiotics.`,
 flow:[{t:`Day 3`,hr:`140`,rr:`46`,spo2:`99%`,temp:`98.6 (open crib)`,bg:`68`,skin:`Pink`,resp:`Unlabored`,feed:`BF 20 min, strong suck`,out:`6 wet/24 h`,na:`Alert, good tone, cap refill 2 s`}],
 labs:[{t:`Day 2`,v:`Blood culture: Group B Streptococcus`}],
 stem:`Which finding best indicates the treatment is effective?`,
 opts:[`Temperature 98.6°F in an open crib, HR 140, capillary refill 2 seconds and vigorous breastfeeding`,`He slept for 6 hours without waking`,`All antibiotic doses were given on time`,`A CBC was drawn this morning`],ans:0,
 why:`<b>What:</b> Clinical response to sepsis treatment. <b>Why:</b> Controlling infection restores thermoregulation, perfusion and energy for feeding — the exact cues that were abnormal are now normal.`,
 wrong:`Prolonged sleep could mean lethargy. On-time doses describe the process, not the patient's outcome. A drawn lab is not a result.`,
 cues:`Thermoregulation without a warmer, normal HR and perfusion, active feeding, adequate output.`,
 safety:`Continue the full prescribed course even though he looks well.`,
 ev:`This is the evaluation: presenting cues reversed.`,
 take:`Evaluation = the original abnormal cues are now normal and measurable.`,
 src:`${L.hr}, slide 8; ${L.tb}, pp. 613–615.`},
{id:'c3q6',case:'c3',t:'matrix',topic:'t4',cj:'gs',cats:['teach','pi'],hy:false,time:`Day 10 — discharge`,
 lead:`The infant completes his antibiotic course. The nurse reviews infection prevention with the parents and the NICU team.`,
 stem:`Indicate whether each statement or action is appropriate.`,cols:[`Appropriate`,`Not appropriate`],
 rows:[{x:`Staff and family perform hand hygiene before every contact with the infant`,ans:0},{x:`Visitors with cold symptoms wait until they are well`,ans:0},{x:`Call the provider for a temperature of 100.4°F or higher, or a low temperature with poor feeding or lethargy`,ans:0},{x:`If he seems feverish at home, give acetaminophen and wait until morning to call`,ans:1},{x:`Wash hands after diaper changes and before feeding`,ans:0},{x:`He can share a pacifier with his toddler cousin`,ans:1}],
 why:`<b>What:</b> Infection prevention and caregiver recognition of illness. <b>Why:</b> Hand hygiene is the most important measure against late-onset (healthcare- and community-acquired) infection; infants show illness through fever OR low temperature, poor feeding and lethargy.`,
 wrong:`Treating fever at home and waiting delays care and can mask a serious infection in a newborn. Shared pacifiers transmit organisms.`,
 cues:`Recent sepsis, immature immune system, home environment.`,
 safety:`Parents need exact "call now" criteria.`,
 ev:`Parents demonstrate hand hygiene and state the call parameters.`,
 take:`Hand hygiene is #1. Newborn illness may present as LOW temperature, poor feeding or lethargy — not only fever.`,
 src:`${L.hr}, slides 8 (nosocomial/late-onset infection), 20 (protection from infection — standard precautions, hand hygiene); ${L.nc}, slide 17 (discharge: recognizing illness); ${L.tb}, pp. 613–615, 616. 554.512°F threshold: ${L.sup}`},

/* ---------------- CASE 4 ---------------- */
{id:'c4q1',case:'c4',t:'matrix',topic:'t3',cj:'ac',cats:['as'],hy:false,time:`Day 2 — 1000 (48 h)`,
 lead:`The nurse observes a full breastfeeding session and reviews the feeding record.`,
 flow:[{t:`1000`,hr:`144`,rr:`48`,spo2:`—`,temp:`98.3`,bg:`—`,skin:`Pink`,resp:`Unlabored`,feed:`BF 55 min, roots again after`,out:`Void ×1 / 24 h`,na:`Wt 3,090 g (−9.1%)`,ab:['out','na']}],
 notes:[{t:`1000`,v:`Rooting and hand-to-mouth before feeding. Clicking with sucks; milk leaking from the nares; few swallows. Mother reports uterine cramping during feeds.`}],
 stem:`For each finding, indicate whether it supports effective feeding or suggests ineffective feeding.`,cols:[`Supports effective feeding`,`Suggests ineffective feeding`],
 rows:[{x:`Rooting and hand-to-mouth movements before the feed`,ans:0},{x:`Mother reports uterine cramping during the feed`,ans:0},{x:`Clicking sounds with each suck`,ans:1},{x:`Milk leaking from the infant's nose during the feed`,ans:1},{x:`55-minute feeds and still rooting afterward`,ans:1},{x:`Weight 3,090 g at 48 hours (−9.1% from birth)`,ans:1}],
 why:`<b>What:</b> Signs of poor milk transfer despite good maternal let-down. <b>Why:</b> Rooting is an early feeding cue; uterine cramping reflects oxytocin release (let-down is happening). Clicking means loss of seal; nasal leakage suggests milk is escaping into the nasopharynx; very long feeds with continued hunger and a weight loss approaching 10% indicate inadequate intake.`,
 wrong:`Early cues and cramping are positive signs, not problems. The other four are not normal variants.`,
 cues:`Clicking, nasal leakage, few swallows, long unsatisfying feeds, −9.1% weight.`,
 safety:`Nasal regurgitation during feeding is a cue to examine the oral cavity — not just to correct latch.`,
 ev:`Audible swallowing, satisfied infant after feeds, rising output and weight.`,
 take:`Effective breastfeeding = audible swallowing, satisfied infant, adequate output; clicking/dimpling/nasal leakage = ineffective.`,
 src:`${L.nf}, slides 5 (lactation physiology — let-down), 9 (breastfeeding initiation, latch, indicators); ${L.tb}, pp. 589–593.`},
{id:'c4q2',case:'c4',t:'hl',topic:'t3',cj:'rc',cats:['as'],hy:true,time:`1020`,
 lead:`Because of the nasal leakage, the nurse performs a focused oral and feeding assessment.`,
 notes:[{t:`1020`,v:`Focused oral exam — see question.`}],
 stem:`Highlight the findings that require follow-up and provider notification.`,
 segs:[{x:`Lips intact and symmetric;`,k:0},{x:`gloved finger cannot palpate an intact soft palate — opening felt posteriorly;`,k:1},{x:`unable to create suction on the examiner's finger;`,k:1},{x:`coughs and briefly turns dusky when milk pools in the mouth;`,k:1},{x:`white, pinpoint cysts on the gums;`,k:0},{x:`tongue moves freely;`,k:0},{x:`one void in 24 hours at 48 h of age.`,k:1}],
 why:`<b>What:</b> An isolated cleft palate that was not seen on the initial exam, with aspiration episodes and low output. <b>Why:</b> Without an intact palate the infant cannot create the negative pressure needed to remove milk; milk enters the nasopharynx and airway (coughing, duskiness, aspiration risk). Poor intake shows in low output and weight loss.`,
 wrong:`Intact lips mean the cleft is palatal only. Small white gum cysts (Epstein pearls/Bohn nodules) are benign newborn findings. Free tongue movement is normal.`,
 cues:`Palpable palatal opening, no suction, coughing/duskiness with feeds, minimal urine output.`,
 safety:`Airway first: feeds must be modified immediately to prevent aspiration; notify the provider.`,
 ev:`After modified feeding: no coughing or color change; output and weight improve.`,
 take:`An isolated cleft palate can be missed if the palate isn't palpated — nasal regurgitation and inability to create suction are the clues.`,
 src:`${L.hr}, slide 14 (major congenital anomalies — cleft lip and palate); ${L.nf}, slide 11 (special considerations); ${L.tb}, p. 609 (feeding infants with cleft palate). Gum cysts: ${L.sup}`},
{id:'c4q3',case:'c4',t:'sata',topic:'t3',cj:'gs',cats:['pi','teach'],hy:false,time:`1200`,
 lead:`Cleft palate is confirmed. Plastic surgery and a feeding specialist are consulted. Orders: specialty cleft feeder with expressed breast milk; mother to pump every 2–3 hours.`,
 orders:[{t:`1200`,v:`Specialty cleft palate feeder with expressed breast milk; upright feeding; feeding therapy consult`},{t:`1200`,v:`Hospital-grade pump for mother q2–3h`}],
 stem:`Which feeding techniques should the nurse teach? <b>Select all that apply.</b>`,
 opts:[`Hold the infant upright or semi-upright during feeds`,`Use the ordered cleft feeder and pace the flow with her swallows`,`Burp frequently during the feed`,`Limit feeding time so she doesn't tire (about 20–30 minutes)`,`Continue to pump every 2–3 hours, including at night, to maintain supply`,`Feed her lying flat so milk pools at the back of the throat`,`Enlarge the nipple hole with scissors to increase flow`],ans:[0,1,2,3,4],
 why:`<b>What:</b> Modified feeding for cleft palate. <b>Why:</b> Gravity (upright) reduces nasal regurgitation and aspiration; a squeeze/valve feeder delivers milk without the suction she can't generate; swallowed air requires frequent burping; long feeds burn more calories than they deliver; regular milk removal maintains supply.`,
 wrong:`Lying flat increases nasal regurgitation and aspiration. An enlarged, uncontrolled nipple hole floods the airway.`,
 cues:`No suction, coughing with feeds, weight loss.`,
 safety:`Aspiration prevention comes before volume goals.`,
 ev:`Feeds ≤30 minutes without coughing/duskiness; daily weight gain.`,
 take:`Cleft feeding: upright, specialty feeder, pace flow, burp often, limit duration, watch for aspiration.`,
 src:`${L.nf}, slides 11–12 (special considerations; expressing breast milk), 18 (pumping every 2–3 h for a hospitalized infant); ${L.tb}, p. 609.`},
{id:'c4q4',case:'c4',t:'mc',topic:'t3',cj:'ta',cats:['pi','em'],hy:true,time:`Day 3 — 0300`,
 lead:`During a night feeding the mother calls: the infant is coughing, milk is coming from her nose and her lips look dusky.`,
 flow:[{t:`0300`,hr:`176`,rr:`70`,spo2:`86%`,temp:`98.4`,bg:`—`,skin:`Dusky lips`,resp:`Coughing, gurgling`,feed:`Mid-feed`,out:`—`,na:`Choking episode`,ab:['hr','rr','spo2','skin','resp']}],
 stem:`What should the nurse do first?`,
 opts:[`Stop the feeding, position her upright/on her side, clear the airway with gentle suction as needed and assess breathing and SpO₂`,`Increase the flow so the feeding finishes faster`,`Lay her flat and continue feeding more slowly`,`Document the episode and notify the provider in the morning`],ans:0,
 why:`<b>What:</b> Probable aspiration/choking during a feed. <b>Why:</b> Milk entering the airway through the palatal defect causes coughing, gurgling and desaturation.`,
 wrong:`Faster flow and supine positioning both increase aspiration. Waiting until morning ignores an active airway problem.`,
 cues:`Coughing, gurgling, dusky lips, SpO₂ 86%.`,
 safety:`Airway always outranks nutrition.`,
 ev:`Pink color, SpO₂ back to baseline, clear breath sounds; feeding plan reviewed with therapy.`,
 take:`Stop the feed and clear the airway first — then re-evaluate position, nipple and flow.`,
 src:`${L.nf}, slide 11; ${L.hr}, slide 19 (respiratory support); ${L.tb}, p. 609.`},
{id:'c4q5',case:'c4',t:'matrix',topic:'t3',cj:'eo',cats:['teach','ev','pi'],hy:false,time:`Age 11 months — post-op day 1`,
 lead:`The infant thrived on the modified plan and is now 11 months old, 1 day after cleft palate repair. Bilateral elbow immobilizers are in place. The nurse evaluates the parents' understanding.`,
 orders:[{t:`POD0`,v:`Elbow immobilizers; remove one at a time q2h for ROM/skin check with supervision`},{t:`POD0`,v:`Clear liquids by open cup when awake; nothing hard in the mouth`},{t:`POD0`,v:`Acetaminophen per weight q6h PRN pain`}],
 flow:[{t:`POD1`,hr:`124`,rr:`28`,spo2:`98%`,temp:`99.0`,bg:`—`,skin:`Pink`,resp:`Unlabored`,feed:`Cup 90 mL`,out:`4 wet`,na:`Suture line intact; FLACC 3`}],
 stem:`For each parent action, indicate whether it shows understanding or needs more teaching.`,cols:[`Shows understanding`,`Needs more teaching`],
 rows:[{x:`Removes one elbow immobilizer at a time while watching her, then reapplies it`,ans:0},{x:`Offers water through a straw so she won't spill`,ans:1},{x:`Gives her a pacifier to calm her crying`,ans:1},{x:`Offers fluid from an open cup as instructed`,ans:0},{x:`Uses a spoon to check whether the stitches are intact`,ans:1},{x:`Holds and comforts her and asks for pain medication when she is fussy`,ans:0}],
 why:`<b>What:</b> Protecting the palate repair. <b>Why:</b> Hard objects (straws, pacifiers, spoons) and the child's hands can disrupt sutures and cause dehiscence; comfort and analgesia reduce crying that strains the repair.`,
 wrong:`A straw, pacifier or spoon in the mouth all need re-teaching.`,
 cues:`Immobilizers, open cup, nothing in the mouth, pain control.`,
 safety:`Prevent injury to the suture line until healing is complete.`,
 ev:`Intact suture line, adequate intake by cup, controlled pain.`,
 take:`After cleft palate repair: nothing hard in the mouth (no straws, pacifiers, spoons, oral thermometers, tongue depressors); elbow immobilizers.`,
 src:`${L.hr}, slide 14 (cleft lip/palate). Post-op specifics (immobilizers, avoiding objects in mouth): ${L.sup} — follow surgeon's orders.`},

/* ---------------- CASE 5 ---------------- */
{id:'c5q1',case:'c5',t:'hl',topic:'t7',cj:'rc',cats:['as'],hy:true,time:`Admission — 1100`,
 lead:`The nurse completes the admission assessment.`,
 notes:[{t:`1100`,v:`Admission note — see question.`}],
 stem:`Highlight the findings that suggest cardiovascular dysfunction.`,
 segs:[{x:`Parents report he "sweats on his head" during every bottle;`,k:1},{x:`takes 35 minutes to finish 40 mL and falls asleep;`,k:1},{x:`weight gain of only 300 g in 6 weeks;`,k:1},{x:`RR 64 at rest with mild subcostal retractions;`,k:1},{x:`loud holosystolic murmur at the left lower sternal border;`,k:1},{x:`liver edge 3 cm below the right costal margin;`,k:1},{x:`smiles socially;`,k:0},{x:`anterior fontanel soft and flat;`,k:0},{x:`5 wet diapers in 24 hours.`,k:0}],
 why:`<b>What:</b> A pattern of heart failure in an infant. <b>Why:</b> The lecture history-and-exam cues — poor feeding, tachypnea/tachycardia, failure to thrive/poor weight gain, activity intolerance — plus a murmur and hepatomegaly. Sweating with feeds reflects sympathetic activation and high metabolic demand; the liver enlarges with venous congestion.`,
 wrong:`Social smiling is age-appropriate development. A soft flat fontanel and 5 wet diapers show he is not dehydrated.`,
 cues:`Diaphoresis and fatigue with feeds, FTT, tachypnea with retractions, murmur, hepatomegaly; positive family history.`,
 safety:`Recognize heart failure — don't label him a "lazy feeder."`,
 ev:`Improved feeding efficiency and weight gain; RR decreasing.`,
 take:`Sweating with feeds + tachypnea + poor weight gain = think cardiac.`,
 src:`${L.chd}, slides 4 (history — poor feeding, tachypnea, FTT, activity intolerance, family history), 5–7 (inspection, palpation, auscultation), 19 (CHF); ${L.tb}, pp. 1234–1239.`},
{id:'c5q2',case:'c5',t:'mc',topic:'t7',cj:'ac',cats:['as'],hy:true,time:`1130`,
 lead:`Monitoring and initial results are added.`,
 flow:[{t:`1130`,hr:`168`,rr:`66`,bp:`86/50 (arm) · 84/52 (leg)`,spo2:`96% RA`,temp:`98.6`,neuro:`Alert`,perf:`Cap refill 3 s; femoral pulses equal to brachial`,pain:`0`,feed:`—`,out:`Void`,growth:`—`,na:`Pink lips and tongue`,ab:['hr','rr']}],
 labs:[{t:`1130`,v:`Chest x-ray: cardiomegaly, increased pulmonary vascular markings`}],
 stem:`Which interpretation of Mateo's oxygenation and perfusion findings is most accurate?`,
 opts:[`Systemic oxygenation is adequate; his symptoms reflect excess pulmonary blood flow and volume overload rather than cyanosis`,`He has hypoxemia from a defect with decreased pulmonary blood flow`,`He has an obstruction to aortic outflow because arm and leg pressures differ`,`His findings are respiratory, not cardiac, because his SpO₂ is normal`],ans:0,
 why:`<b>What:</b> Pulmonary overcirculation without cyanosis. <b>Why:</b> In defects with increased pulmonary blood flow, oxygenated blood is pushed back to the lungs (left → right). SpO₂ stays normal, but lung congestion (tachypnea, increased vascular markings) and right-heart volume overload (cardiomegaly, hepatomegaly) produce heart failure.`,
 wrong:`SpO₂ 96% with pink lips rules out significant hypoxemia. Arm and leg pressures are essentially equal and femorals are strong — no coarctation. A normal SpO₂ does not exclude heart disease; the x-ray shows cardiomegaly.`,
 cues:`SpO₂ 96%, pink, equal pulses/BP, cardiomegaly with increased pulmonary markings.`,
 safety:`Normal oxygen saturation does not mean the infant is stable — heart failure can progress.`,
 ev:`Decreasing RR and work of breathing with treatment.`,
 take:`Left-to-right (↑ pulmonary flow) lesions → heart failure, usually NOT cyanosis.`,
 src:`${L.chd}, slides 8 (diagnostic evaluation), 13 (classification), 15 (defects with increased pulmonary blood flow), 19 (CHF); ${L.tb}, pp. 1222–1225.`},
{id:'c5q3',case:'c5',t:'cloze',topic:'t7',cj:'ac',cats:['as'],hy:false,time:`1400`,
 lead:`The echocardiogram is completed. Parents ask the nurse to explain "what the hole does."`,
 labs:[{t:`1400`,v:`Echocardiogram: large perimembranous ventricular septal defect with left-to-right shunt; normal valves`}],
 stem:`Complete the nurse's explanation.`,
 text:`"Blood moves from areas of {0} pressure. In a VSD, blood flows from the {1} ventricle to the {2} ventricle, which sends extra blood to the {3}. This is classified as a defect with {4}, which leads to heart failure."`,
 drops:[{opts:[`higher to lower`,`lower to higher`,`equal to equal`],ans:0},{opts:[`left`,`right`],ans:0},{opts:[`right`,`left`],ans:0},{opts:[`lungs`,`brain`,`liver`],ans:0},{opts:[`increased pulmonary blood flow`,`decreased pulmonary blood flow`,`obstruction to outflow`,`mixed blood flow`],ans:0}],
 why:`<b>What:</b> VSD physiology. <b>Why:</b> The lecture rule: blood flows from higher to lower pressure along the path of least resistance. Left-ventricular pressure exceeds right, so blood crosses left → right and is recirculated to the lungs (↑ pulmonary blood flow → heart failure).`,
 wrong:`Right-to-left flow occurs only when right-sided pressure exceeds left (e.g., tetralogy of Fallot). Obstructive defects are stenoses (coarctation, AS, PS); mixed defects include TGA, truncus, TAPVC, HLHS.`,
 cues:`Echo: large VSD, L→R shunt.`,
 safety:`Clear family teaching supports adherence to the care plan.`,
 ev:`Parents can explain why he breathes fast and tires with feeds.`,
 take:`ASD, VSD, PDA = increased pulmonary blood flow (left-to-right shunt).`,
 src:`${L.chd}, slides 10 (fetal circulation), 12–13 (classification), 15 (increased pulmonary blood flow); ${L.tb}, pp. 1222–1225.`},
{id:'c5q4',case:'c5',t:'bow',topic:'t7',cj:'ph',cats:['pi','med'],hy:true,time:`Day 2 — 0745`,
 lead:`Digoxin and furosemide were started yesterday. Before the 0800 digoxin dose, the apical pulse is 92 (counted for 1 full minute). Feeds still take more than 30 minutes.`,
 flow:[{t:`0745`,hr:`92 apical (1 min)`,rr:`62`,bp:`84/50`,spo2:`96%`,temp:`98.5`,neuro:`Alert`,perf:`Cap refill 3 s`,pain:`0`,feed:`45 mL / 40 min, sweating`,out:`7 wet`,growth:`Wt 3,640 g`,na:`Vomited once overnight`,ab:['hr','rr']}],
 mar:[{t:`0800`,v:`Digoxin PO — DUE. Hold and notify if apical HR <100.`},{t:`0800`,v:`Furosemide PO — DUE`}],
 labs:[{t:`0600`,v:`Potassium 3.2 mEq/L (low)`}],
 stem:`Complete the bow-tie.`,
 cond:{opts:[`Heart failure from a left-to-right shunt, with possible digoxin toxicity risk`,`Hypercyanotic spell`,`Bronchiolitis`,`Dehydration from overfeeding`],ans:0},
 acts:{opts:[`Hold the digoxin dose and notify the provider of the HR, vomiting and potassium`,`Provide small, frequent high-calorie feeds limited to about 30 minutes; gavage the remainder as ordered`,`Give the digoxin because 92 is normal for an infant`,`Increase fluid intake to replace losses from sweating`,`Let him cry to strengthen his lungs`],ans:[0,1]},
 mons:{opts:[`Apical heart rate and rhythm`,`Daily weight and intake/output`,`Head circumference`,`Blood glucose every hour`,`Hearing screen`],ans:[0,1]},
 why:`<b>What:</b> Heart failure on digoxin and a diuretic, with bradycardia below the hold parameter, vomiting and hypokalemia. <b>Why:</b> Digoxin slows conduction; low potassium (from furosemide) increases toxicity risk; vomiting and bradycardia are toxicity signs. High-calorie, time-limited feeds meet increased energy needs without exhausting him.`,
 wrong:`Giving digoxin below the ordered parameter is unsafe (textbook: infants generally held below 90–110). Extra fluid worsens volume overload; crying increases cardiac workload. He is pink (no hypercyanotic spell); this isn't bronchiolitis or overfeeding.`,
 cues:`Apical HR 92 (<100 order), vomiting, K⁺ 3.2, sweating and long feeds.`,
 safety:`Apical pulse for a full minute before every digoxin dose; follow the ordered hold parameter.`,
 ev:`Provider evaluation (digoxin level, potassium); HR back in range; feeds ≤30 min; weight gain.`,
 take:`Digoxin: apical pulse 1 full minute; hold per parameter; low K⁺ ↑ toxicity; vomiting/bradycardia = toxicity signs.`,
 src:`${L.chd}, slide 19 (CHF — management); ${L.tb}, pp. 1234–1235 (digoxin administration, hold parameters 90–110 in infants), 1237–1239 (nutrition, energy conservation).`},
{id:'c5q5',case:'c5',t:'matrix',topic:'t7',cj:'eo',cats:['ev','teach'],hy:false,time:`Day 6`,
 lead:`Doses were adjusted after the digoxin level and potassium were corrected. Surgical repair is planned in a few weeks.`,

 stem:`Evaluate each finding on Day 6.`,cols:[`Effective / met`,`Not met — revise or re-teach`],
 rows:[{x:`RR 50 (down from 66)`,ans:0},{x:`Weight up 120 g in 4 days`,ans:0},{x:`Takes 60 mL in 20 minutes with less sweating`,ans:0},{x:`Father counts the apical pulse for a full minute before the dose`,ans:0},{x:`Mother says she will give a second dose if he vomits after his digoxin`,ans:1},{x:`Parents plan to call for poor feeding, vomiting or a very slow heart rate`,ans:0}],

{id:'c6q1',case:'c6',t:'hl',topic:'t8',cj:'rc',cats:['as','em'],hy:true,time:`Admission — 0900`,
 lead:`The nurse completes the admission neurologic assessment with the infant calm and held upright.`,
 notes:[{t:`0900`,v:`Neuro assessment — see question.`}],
 flow:[{t:`0900`,hr:`146`,rr:`34`,bp:`88/54`,spo2:`99%`,temp:`98.8`,neuro:`Irritable, high-pitched cry`,perf:`Brisk`,pain:`FLACC 4`,feed:`Poor suck; vomited`,out:`4 wet`,growth:`OFC 43 cm`,na:`See note`,ab:['neuro','feed','growth']}],
 stem:`Highlight the findings that indicate increased intracranial pressure.`,
 segs:[{x:`Anterior fontanel tense and bulging while calm and upright;`,k:1},{x:`distended scalp veins;`,k:1},{x:`eyes deviate downward with sclera visible above the iris;`,k:1},{x:`shrill, high-pitched cry, cries when handled;`,k:1},{x:`vomited after the last two feeds;`,k:1},{x:`OFC 43 cm (40 cm one month ago);`,k:1},{x:`smiles at his mother;`,k:0},{x:`moves all extremities equally;`,k:0}],
 why:`<b>What:</b> Infant signs of increased ICP from CSF accumulation. <b>Why:</b> Hydrocephalus is an imbalance between CSF production and absorption; with open sutures the head enlarges, and pressure produces a bulging fontanel, distended scalp veins, setting-sun eyes, irritability, high-pitched cry and vomiting.`,
 wrong:`Social smiling and equal extremity movement are reassuring baseline findings.`,
 cues:`Bulging fontanel (calm, upright), OFC +3 cm in a month, setting-sun sign, high-pitched cry, vomiting.`,
 safety:`A fontanel only "counts" as bulging when the infant is calm and upright — crying normally raises it.`,
 ev:`After CSF diversion: soft fontanel, stable OFC, normal feeding and cry.`,
 take:`Infant ↑ICP: bulging fontanel, ↑OFC, distended scalp veins, setting-sun, high-pitched cry, irritability, vomiting, poor feeding.`,
 src:`${L.cm}, slides 2 (pathophysiology), 5 (causes; apparent in early infancy); ${L.tb}, pp. 1267 (increased ICP signs), 1409–1410.`},
{id:'c6q2',case:'c6',t:'mc',topic:'t8',cj:'ph',cats:['em','as'],hy:true,time:`1500`,
 lead:`MRI shows aqueductal stenosis with enlarged lateral and third ventricles (noncommunicating hydrocephalus). Surgery is scheduled for tomorrow. The nurse completes 1500 neuro checks.`,
 flow:[{t:`1300`,hr:`144`,rr:`32`,bp:`88/54`,spo2:`99%`,temp:`98.8`,neuro:`Irritable, consolable`,perf:`Brisk`,pain:`FLACC 3`,feed:`60 mL`,out:`Void`,growth:`—`,na:`Pupils equal, reactive`},{t:`1500`,hr:`92`,rr:`18, irregular`,bp:`104/48`,spo2:`96%`,temp:`98.9`,neuro:`Difficult to arouse; L pupil sluggish`,perf:`Brisk`,pain:`—`,feed:`Refused`,out:`—`,growth:`—`,na:`See question`,ab:['hr','rr','bp','neuro']}],
 labs:[{t:`1200`,v:`MRI: aqueductal stenosis; enlarged lateral and third ventricles; normal fourth ventricle`}],
 stem:`Which 1500 finding requires the nurse's most immediate action?`,
 opts:[`HR 92 with irregular respirations, widened pulse pressure and decreased arousability`,`Refused the 1500 feeding`,`Bulging anterior fontanel, unchanged from admission`,`Head circumference unchanged from this morning`],ans:0,
 why:`<b>What:</b> Late signs of increased ICP — impending herniation. <b>Why:</b> Pressure on the brainstem produces bradycardia, irregular respirations and widening pulse pressure, with declining consciousness and pupil changes; these are late signs.`,
 wrong:`Refusing a feed and a bulging fontanel are concerning but were already present and are not immediately life-threatening compared with brainstem compression. An unchanged OFC is reassuring in the short term.`,
 cues:`HR 144 → 92, RR 32 → 18 irregular, BP 104/48, difficult to arouse, sluggish pupil.`,
 safety:`Late ICP signs require immediate escalation (rapid response/neurosurgery) while supporting airway and breathing.`,
 ev:`After emergent intervention: HR and respirations back to baseline, improved LOC, equal pupils.`,
 take:`Bradycardia + irregular respirations + ↓LOC = late ICP — call now; don't wait for scheduled surgery.`,
 src:`${L.cm}, slides 2, 6 (therapeutic management); ${L.tb}, p. 1267 (late signs of increased ICP: bradycardia, Cheyne-Stokes respirations, decreased consciousness).`},
{id:'c6q3',case:'c6',t:'sata',topic:'t8',cj:'gs',cats:['pi'],hy:false,time:`Post-op day 0 — 1800`,
 lead:`Neurosurgery placed a right-sided ventriculoperitoneal (VP) shunt emergently. The infant has returned to the unit.`,
 orders:[{t:`POD0`,v:`Position on LEFT (unoperated) side; keep flat as ordered by neurosurgery`},{t:`POD0`,v:`Neuro checks q1h ×4 then q2h; daily OFC`},{t:`POD0`,v:`Monitor abdomen; advance feeds as tolerated`},{t:`POD0`,v:`IV antibiotics per protocol`}],
 flow:[{t:`1800`,hr:`134`,rr:`30`,bp:`86/52`,spo2:`98%`,temp:`99.0`,neuro:`Arouses easily; pupils equal`,perf:`Brisk`,pain:`FLACC 3`,feed:`NPO`,out:`Void`,growth:`OFC 42.8 cm`,na:`Fontanel soft; incisions dry`}],
 stem:`Which postoperative interventions are appropriate? <b>Select all that apply.</b>`,
 opts:[`Position on the unoperated (left) side to avoid pressure on the valve`,`Keep flat as ordered to avoid too-rapid CSF drainage`,`Perform neuro checks including pupils, fontanel and level of consciousness`,`Assess the abdomen for distention and bowel sounds`,`Inspect incisions; if clear drainage appears, test it for glucose and notify the surgeon`,`Position him on the shunt side so the valve stays stable`,`Pump the shunt reservoir every hour to check function`],ans:[0,1,2,3,4],
 why:`<b>What:</b> Early post-VP-shunt care. <b>Why:</b> Pressure on the valve, rapid decompression (which can cause the brain to pull from the dura), CSF leak, peritoneal complications from the distal catheter and infection are the main early risks.`,
 wrong:`Positioning on the shunt side puts pressure on the valve. Pumping the shunt is done only on a neurosurgeon's specific order.`,
 cues:`New shunt, soft fontanel, abdominal catheter, incisions.`,
 safety:`Report abdominal distention, CSF leakage, or returning ICP signs immediately.`,
 ev:`Soft fontanel, stable OFC, intact dry incisions, normal abdomen, improving LOC.`,
 take:`Post-VP shunt: unoperated side, flat as ordered, neuro checks, abdomen, test clear drainage for glucose.`,
 src:`${L.cm}, slide 6 (therapeutic management, postoperative care); ${L.tb}, pp. 1411–1413 (shunt care, positioning on the unoperated side, testing drainage for glucose).`},
{id:'c6q4',case:'c6',t:'matrix',topic:'t8',cj:'ac',cats:['as','em'],hy:true,time:`5 weeks later — ED`,
 lead:`Elijah went home on post-op day 4. Five weeks later his parents bring him to the ED: "He's not himself."`,
 flow:[{t:`ED`,hr:`178`,rr:`44`,bp:`90/54`,spo2:`98%`,temp:`101.8`,neuro:`Irritable when handled, then drowsy`,perf:`Cap refill 2 s`,pain:`FLACC 6`,feed:`Refused ×2; vomited ×3`,out:`3 wet/24 h`,growth:`OFC 43.9 cm (↑1.1 cm)`,na:`Redness/swelling along shunt tract behind R ear`,ab:['hr','temp','neuro','feed','growth','na']}],
 labs:[{t:`ED`,v:`WBC 19,600/mm³`}],
 stem:`For each cue, indicate whether it suggests shunt infection, shunt malfunction (obstruction), or both.`,cols:[`Infection`,`Malfunction`,`Both`],
 rows:[{x:`Temperature 101.8°F with WBC 19,600/mm³`,ans:0},{x:`Redness and swelling along the shunt tract`,ans:0},{x:`Bulging fontanel and increasing OFC`,ans:1},{x:`Vomiting, poor feeding and decreased responsiveness`,ans:2},{x:`Onset 5 weeks after shunt placement`,ans:0}],
 why:`<b>What:</b> Overlapping presentations — this infant likely has a shunt infection that may also be impairing drainage. <b>Why:</b> The lecture states shunt infection risk is greatest 1–2 months after placement; fever, local redness and leukocytosis point to infection. Returning ICP signs (fontanel, OFC) point to obstruction; vomiting, poor feeding and decreased responsiveness occur with either.`,
 wrong:`Fever and tract redness are not explained by simple obstruction; a bulging fontanel and rising OFC aren't specific to infection.`,
 cues:`Timing (5 weeks), fever, tract erythema, WBC, rising OFC.`,
 safety:`Both problems are emergencies — evaluation is urgent either way.`,
 ev:`Infection and drainage both addressed: afebrile, soft fontanel, stable OFC.`,
 take:`Shunt infection: greatest risk 1–2 months after placement; fever, poor feeding, vomiting, ↓responsiveness, redness along the tract. Malfunction: original ICP picture returns.`,
 src:`${L.cm}, slide 8 (shunt infection — period of greatest risk, septicemia, meningitis, wound infection); ${L.tb}, pp. 1411–1412, 1413.`},
{id:'c6q5',case:'c6',t:'order',topic:'t8',cj:'ta',cats:['em','pi','teach'],hy:true,time:`ED — 15 min later`,
 lead:`While awaiting neurosurgery, Elijah becomes harder to arouse.`,
 orders:[{t:`ED`,v:`Blood culture; CSF sample from shunt per neurosurgery; then high-dose IV antibiotics`},{t:`ED`,v:`Notify neurosurgery STAT`}],
 flow:[{t:`ED+15`,hr:`168`,rr:`38`,bp:`94/52`,spo2:`97%`,temp:`101.6`,neuro:`Arouses only to painful stimulus`,perf:`2 s`,pain:`—`,feed:`NPO`,out:`—`,growth:`—`,na:`Pupils equal, sluggish`,ab:['temp','neuro']}],
 stem:`Place the nurse's actions in order of priority.`,
 items:[`Assess airway, breathing, level of consciousness and pupils`,`Notify neurosurgery of the decline in LOC (SBAR)`,`Obtain the ordered blood culture`,`Administer the first dose of high-dose IV antibiotics as ordered`,`Explain to the parents what is happening, including that the shunt may need to be removed or replaced`],
 why:`<b>What:</b> Suspected shunt infection with neurologic decline. <b>Why:</b> Airway and neurologic status set urgency; neurosurgery must evaluate (shunt tap, externalization or removal); cultures before antibiotics identify the organism; the lecture lists treatment as massive-dose antibiotics or shunt removal.`,
 wrong:`Teaching and explanation are essential but come after stabilization and escalation. Antibiotics before cultures can obscure the organism unless it would delay treatment.`,
 cues:`Declining LOC, fever, tract redness.`,
 safety:`ABCs and escalation before anything else.`,
 ev:`Stable airway, improving LOC, defervescence within 48 h of therapy; parents can state infection/malfunction signs.`,
 take:`Shunt infection: escalate, culture, high-dose antibiotics; teach families that infection = fever + redness; malfunction = ICP signs return.`,
 src:`${L.cm}, slide 8 (infection treatment — massive-dose antibiotics or shunt removal); ${L.tb}, pp. 1411–1412, 1413.`},

/* ---------------- CASE 7 ---------------- */
{id:'c7q1',case:'c7',t:'hl',topic:'t10',cj:'rc',cats:['as'],hy:true,time:`0810`,
 lead:`The nurse completes the delivery-room assessment.`,
 notes:[{t:`0810`,v:`Delivery assessment — see question.`}],
 stem:`Highlight the findings that indicate neurologic involvement or immediate risk to the infant.`,
 segs:[{x:`Strong cry, HR 150, RR 48;`,k:0},{x:`5-cm membrane-covered sac at L3–S1 containing clear fluid and visible neural tissue;`,k:1},{x:`no anal wink;`,k:1},{x:`flexes hips but minimal knee and ankle movement;`,k:1},{x:`small area of the membrane is thin and moist;`,k:1},{x:`anterior fontanel soft and flat;`,k:0},{x:`pink with acrocyanosis.`,k:0}],
 why:`<b>What:</b> A myelomeningocele — a sac containing meninges, CSF and nerve tissue — with neurologic deficit below the level of the lesion. <b>Why:</b> Clinical manifestations vary with the level of the defect; motor and sensory loss below L3, absent anal wink (bowel/bladder involvement) and an exposed, fragile membrane at risk of rupture and CNS infection.`,
 wrong:`Normal vitals, a soft fontanel and acrocyanosis are baseline findings (the fontanel will be watched for hydrocephalus).`,
 cues:`Neural tissue in the sac, absent anal wink, distal leg weakness, thin membrane.`,
 safety:`Protect the sac immediately; a rupture exposes the CNS to infection.`,
 ev:`Sac intact until surgery; neurologic level documented for comparison.`,
 take:`Myelomeningocele = meninges + CSF + nerves → deficits below the level; meningocele = meninges + CSF, usually no deficit.`,
 src:`${L.ntd}, slides 3 (types), 4 (pathophysiology), 5 (clinical manifestations vary with level); ${L.tb}, pp. 1494–1496.`},
{id:'c7q2',case:'c7',t:'order',topic:'t10',cj:'ta',cats:['pi','em'],hy:true,time:`0815`,
 lead:`The infant is moved to the NICU warmer. Orders arrive.`,
 orders:[{t:`0815`,v:`Sterile saline-moistened nonadherent dressing over sac; change q2–4h & PRN`},{t:`0815`,v:`Prone positioning; no diaper or clothing over the lesion; incubator`},{t:`0815`,v:`Neuro level assessment; daily OFC; strict I&O`}],
 stem:`Place the nurse's immediate actions in order.`,
 items:[`Inspect the sac for intactness or leakage and cover it with a sterile, saline-moistened, nonadherent dressing`,`Position prone with hips slightly flexed and a roll between the legs`,`Place in an incubator without clothing or diaper over the lesion`,`Assess leg movement, anal reflex and head circumference`,`Prepare for surgical closure and support the family`],
 why:`<b>What:</b> Immediate protection of exposed neural structures. <b>Why:</b> The lecture priority is to prevent trauma to the membranous cyst; a moist sterile dressing prevents drying/adherence; prone positioning removes pressure; an incubator maintains temperature without covers touching the lesion.`,
 wrong:`Positioning or warming before covering the exposed sac leaves it at risk; neuro assessment and surgical preparation follow once the sac is protected.`,
 cues:`Open lesion with thin membrane; newborn heat loss.`,
 safety:`Never supine before repair; never a dry dressing.`,
 ev:`Sac intact and moist; temperature 97.7–99.5°F; baseline neuro level documented.`,
 take:`Myelomeningocele before surgery: sterile MOIST nonadherent dressing, prone, incubator, nothing touching the sac.`,
 src:`${L.ntd}, slide 9 (prevent trauma to membranous cyst; assess neuro level; monitor urinary output); ${L.tb}, pp. 1495–1496 (sterile moist nonadherent dressing, prone, incubator/warmer).`},
{id:'c7q3',case:'c7',t:'sata',topic:'t10',cj:'gs',cats:['pi','med'],hy:true,time:`1200`,
 lead:`Surgery is scheduled for tomorrow. The infant is under a radiant warmer for a procedure; the nurse notes the dressing edges are drying.`,
 flow:[{t:`1200`,hr:`148`,rr:`46`,spo2:`98%`,temp:`98.3`,bg:`62`,skin:`Pink`,resp:`Unlabored`,feed:`NPO, IV fluids`,out:`Bladder palpable; 1 void`,na:`Dressing edges drying; sac intact`,ab:['out','na']}],
 stem:`Which actions help prevent infection and prepare for surgery? <b>Select all that apply.</b>`,
 opts:[`Re-moisten and change the dressing more often while under the radiant warmer`,`Use latex-free gloves and equipment`,`Keep stool away from the sac and clean carefully if soiled`,`Monitor urine output and assess for bladder distention`,`Give IV antibiotics as ordered`,`Apply a dry gauze dressing so the sac stays clean`,`Place a diaper snugly over the lesion to protect it`],ans:[0,1,2,3,4],
 why:`<b>What:</b> Pre-operative protection, infection prevention and safety. <b>Why:</b> Radiant heat dries dressings, which can adhere and tear the sac; latex allergy precautions start at birth; stool contaminates the lesion; neurogenic bladder causes retention; antibiotics reduce CNS infection risk.`,
 wrong:`Dry gauze adheres and dries the sac. A diaper over the lesion irritates and contaminates it.`,
 cues:`Drying dressing under a warmer, palpable bladder with one void, open lesion.`,
 safety:`Moist, sterile, latex-free; monitor bladder.`,
 ev:`Intact, moist sac; adequate urine output; afebrile.`,
 take:`NTD pre-op: moist sterile dressing (more often under warmers), latex precautions, keep stool off the lesion, monitor urine output.`,
 src:`${L.ntd}, slides 7 (therapeutic management), 9 (nursing care — latex allergy, urinary output); ${L.tb}, pp. 1495–1496, 1499–1500 (bladder), 1503–1504 (latex).`},
{id:'c7q4',case:'c7',t:'bow',topic:'t10',cj:'ph',cats:['em','as'],hy:true,time:`Post-op day 4`,
 lead:`The defect was closed on day 1. Today the nurse notes new findings.`,
 flow:[{t:`POD1`,hr:`146`,rr:`44`,spo2:`98%`,temp:`98.6`,bg:`—`,skin:`Pink`,resp:`Unlabored`,feed:`Feeds started`,out:`CIC per order`,na:`OFC 34.6 cm`},{t:`POD4`,hr:`150`,rr:`40`,spo2:`98%`,temp:`98.8`,bg:`—`,skin:`Pink`,resp:`Unlabored`,feed:`Vomited ×2`,out:`CIC per order`,na:`OFC 36.8 cm; fontanel full and tense; sutures separating; intermittent setting-sun`,ab:['feed','na']}],
 stem:`Complete the bow-tie.`,
 cond:{opts:[`Hydrocephalus associated with myelomeningocele`,`Incisional wound infection`,`Expected postoperative swelling`,`Formula intolerance`],ans:0},
 acts:{opts:[`Notify neurosurgery of the rising OFC and increased ICP signs`,`Prepare the family and infant for CSF diversion (shunt) as ordered`,`Place supine with the head lowered to ease vomiting`,`Increase feeding volume to replace losses`,`Wrap the head snugly to limit growth`],ans:[0,1]},
 mons:{opts:[`Daily OFC at the marked point`,`Fontanel tension, LOC, feeding and vomiting`,`Hearing screen`,`Clubfoot correction`,`Stool color`],ans:[0,1]},
 why:`<b>What:</b> Hydrocephalus after myelomeningocele closure. <b>Why:</b> Most children with myelomeningocele develop hydrocephalus (often with the Chiari II malformation obstructing CSF flow); it may become apparent after the back is closed.`,
 wrong:`The incision isn't described as red or draining; post-op swelling doesn't cause OFC growth of 2 cm in 3 days or setting-sun eyes; vomiting here is from ICP, not formula. Head-down positioning raises ICP; wrapping the head is harmful.`,
 cues:`OFC 34.6 → 36.8 cm, tense fontanel, separating sutures, setting-sun, vomiting.`,
 safety:`Measure the head daily in every infant with a myelomeningocele.`,
 ev:`After shunt: soft fontanel, stable OFC, feeds tolerated.`,
 take:`Myelomeningocele → watch for hydrocephalus: daily OFC, fontanel, vomiting, setting-sun.`,
 src:`${L.ntd}, slide 5 (clinical manifestations); ${L.cm}, slide 5 (causes — associated with myelomeningocele); ${L.tb}, pp. 1409–1410, 1495–1496.`},
{id:'c7q5',case:'c7',t:'mc',topic:'t5',cj:'gs',cats:['pi','teach'],hy:false,time:`Age 10 months — clinic`,
 lead:`Gabriel, now 10 months old with a VP shunt, comes for a developmental visit. He sits with support, reaches and transfers toys, babbles and shows stranger anxiety. He has limited leg movement. His mother asks how to help his development.`,
 flow:[{t:`10 mo`,hr:`128`,rr:`28`,spo2:`99%`,temp:`98.4`,bg:`—`,skin:`Pink; sacral skin intact`,resp:`Unlabored`,feed:`Solids + formula`,out:`CIC q4h`,na:`OFC stable on curve; social, babbling`}],
 stem:`Which recommendation best supports Gabriel's psychosocial and cognitive development at this age?`,
 opts:[`Provide a consistent caregiver and daily floor play with toys he can reach, hide and find, using adaptive supports so he can explore`,`Limit handling and play to protect the shunt`,`Keep him in a crib with a mobile so he stays safe from injury`,`Start teaching him to share and take turns with older children`],ans:0,
 why:`<b>What:</b> Developmentally supportive care for an infant with a physical disability. <b>Why:</b> At 10 months he is in Erikson's trust vs mistrust (consistent, responsive caregiving builds trust) and Piaget's sensorimotor stage (learning through movement and the senses; object permanence — hiding and finding toys). Adaptive supports let him explore despite limited leg movement.`,
 wrong:`Restricting handling or confining him limits sensorimotor learning; the shunt doesn't require avoiding play. Sharing and turn-taking are later (preschool) skills.`,
 cues:`Age 10 months, stranger anxiety (expected), reaching/transferring, limited leg movement.`,
 safety:`Protect skin on insensate areas during floor play; watch for shunt malfunction signs.`,
 ev:`Continued milestone progress (sitting, pulling up with supports, first words); OFC stable.`,
 take:`Apply the stage: infants need consistent caregivers (trust) and sensorimotor exploration (object permanence) — adapted to the disability.`,
 src:`${L.gd}, slides 10 (Erikson), 11 (Piaget), 15 (developmental assessment); ${L.ch}; ${L.ntd}, slide 7 (multidisciplinary postnatal care); ${L.tb}, pp. 696–699.`}
];
