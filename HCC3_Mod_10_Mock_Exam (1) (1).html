const SOURCES_HTML=`<p><b>Built from, in priority order:</b> (1) the professor's <b>Exam 4 Learning Map</b> — Newborn Care &amp; Developmental Delay section; every question is tagged with the study-guide item it tests, and every item on the map is covered (see "Exam 4 study-guide coverage" on the home screen); (2) the ten Module 10 lecture decks — every rationale cites the deck and slide number; (3) the HCC3 Module 10 Newborn textbook pages — cited by the printed textbook page numbers embedded in the e-book pages you uploaded; (4) the Developmental Stages &amp; Theories Comparison Chart; (5) the instructor handout <b>"Infant/Child Development Disorders: Quick Clinical Recognition"</b> (spina bifida, cleft lip, autism), which is tested in a dedicated cleft-lip item and a quick-recognition matrix and is cited in those rationales.</p>
<p><b>Exam 4 major-medication list:</b> of the medications on the Learning Map, vitamin K is the newborn medication and is tested directly; insulin appears in the context of infants of diabetic mothers. The other listed medications (oxytocin, magnesium sulfate, Methergine, etc.) belong to the labor/postpartum sections and are excluded here, as you asked.</p>
<p><b>Blueprint coverage (75 questions):</b> Physiologic & Behavioral Adaptations 8 · Nursing Care of the Newborn & Family 12 · Newborn Nutrition & Feeding 8 · High-Risk Newborn 15 · Growth & Development 5 · Autism 5 · Congenital Heart Disease 8 · Cerebral Malformation 5 · Congenital Neuromuscular Disorders 4 · Neural Tube Defects 5. Seven unfolding cases supply 38 questions; 37 standalone items fill the rest.</p>
<p><b>Not received:</b> the Module 8 mock-exam HTML. The layout follows your written description rather than a copy of that file. Topic weighting follows the 75-question distribution you specified; the Learning Map notes that "number of questions per category is subject to change."</p>
<p><b>Source conflicts — handled, not tested on the disputed detail:</b></p>
<ul>
<li><b>Developmental theory ages:</b> the lecture and your comparison chart give different cut-offs (e.g., Erikson identity 12–18 vs 12–21; Freud latency ages differ between the chart's narrative and table; Piaget formal operations 11–15 vs 11+). Questions test stage <i>order</i> and clinical application, not exact age boundaries.</li>
<li><b>Hypoglycemia threshold:</b> the textbook cites a lower limit of about 40–45 mg/dL in the first 72 h and uses &lt;45 mg/dL as the trigger to confirm and treat. Items use clearly low values (34–44 mg/dL with symptoms) so the answer doesn't hinge on the exact cut-off; follow your unit/professor's protocol number.</li>
<li><b>Cord care:</b> older references taught alcohol to the cord; current textbook teaching is clean-and-dry care. Items test clean/dry care and infection signs only.</li>
<li><b>Autism wording:</b> the lecture uses older language ("peculiar and bizarre characteristics") and says clients "should be managed at home or in a long-term placement facility." Items test the lecture's care principles (early recognition, structured routine, communication, family support) using respectful current language.</li>
<li><b>Digoxin hold parameter:</b> the textbook gives a range (generally hold below 90–110 in infants). Items supply a specific provider order parameter so the answer follows the order.</li>
</ul>
<p><b>Supplemental standard nursing practice</b> (needed for realistic items but not stated in the uploaded materials — labeled in each rationale): IV dextrose bolus volume/rate, specific sepsis antibiotics, 100.4°F fever threshold for home teaching, red-flag ages for autism screening, cleft-palate post-operative precautions (elbow immobilizers, nothing in the mouth), benign gum cysts, bilious vomiting as an obstruction sign, and the seizure first-aid sequence.</p>
<p><b>Assumption:</b> your instructions ended mid-sentence in Section 7 ("Avoid explanations such…"). I assumed it meant avoiding vague one-line rationales, so every item includes what/why, distractor analysis, key cues, priority & safety, evaluation and an NCLEX takeaway.</p>`;

/* ---------- scoring (practice method — NOT the official NCLEX algorithm) ---------- */
function score(q,r){
 let pts=0,max=1;
 switch(q.t){
  case 'mc':max=1;pts=r===q.ans?1:0;break;
  case 'sata':{max=q.ans.length;let p=0;(r||[]).forEach(i=>p+=q.ans.includes(i)?1:-1);pts=Math.max(0,p);break;}
  case 'cloze':max=q.drops.length;q.drops.forEach((d,i)=>{if(r&&r[i]===d.ans)pts++;});break;
  case 'hl':{max=q.segs.filter(s=>s.k).length;let p=0;(r||[]).forEach(i=>p+=q.segs[i].k?1:-1);pts=Math.max(0,p);break;}
  case 'matrix':max=q.rows.length;q.rows.forEach((w,i)=>{if(r&&r[i]===w.ans)pts++;});break;
  case 'bow':max=5;if(r){if(r.c===q.cond.ans)pts++;(r.a||[]).forEach(i=>{if(q.acts.ans.includes(i))pts++;});(r.m||[]).forEach(i=>{if(q.mons.ans.includes(i))pts++;});}break;
  case 'order':max=q.items.length;if(r)r.forEach((v,i)=>{if(v===i)pts++;});break;
 }
 return {pts,max,st:pts===max?'full':pts>0?'part':'none'};
}
function complete(q,r){
 if(r==null)return false;
 switch(q.t){case 'mc':return r>=0;case 'sata':case 'hl':return r.length>0;case 'cloze':return r.length===q.drops.length&&r.every(v=>v!=null&&v>=0);
  case 'matrix':return r.length===q.rows.length&&r.every(v=>v!=null);case 'bow':return r.c!=null&&(r.a||[]).length===2&&(r.m||[]).length===2;case 'order':return true;}
}

/* ---------- session ---------- */
function blockOrder(ids){ // keep case questions contiguous and in sequence; shuffle blocks

 const comp=S.mode==='comp',done=comp?!!S.locked[id]:!!S.sub[id],reveal=!comp&&done&&learnish();
 const prev=S.idx>0?Q(S.qids[S.idx-1]):null,firstOfCase=c&&(!prev||prev.case!==q.case);
 const caseNo=c?Object.keys(CASES).indexOf(q.case)+1:0,cq=c?c.qs.indexOf(id)+1:0;
 const ans=S.ans[id];
 const qtext=S.marks[id]||`${firstOfCase?`<div class="newcase"><b class="lb">${c.qs[0]===id?'New case':'Case background'}</b><div><b>Case ${caseNo}: ${esc(c.title)}</b></div><div>${c.scenario}</div></div>`:''}
  ${c&&q.lead?`<div class="upd"><b class="lb">Case update · ${esc(q.time||'')}</b><div>${q.lead}</div></div>`:''}
  <div class="typ">${TYPES[q.t]}${c?` · Case ${caseNo}, question ${cq} of ${c.qs.length}`:''}</div><div class="stem">${q.stem}</div>`;
 paint(`<div class="qbar"><span class="chip">${esc(S.label)} · Question ${S.idx+1} of ${n}</span><span class="chip timer" id="tmr">⏱</span><span class="sp"></span>
 <button class="tog ${S.flags[id]?'on':''}" id="flg">⚑ ${S.flags[id]?'Flagged':'Flag question'}</button><button class="tog ${hlOn?'hon':''}" id="hlt">🖍 My highlighter${hlOn?' ON':''}</button><button class="tog" id="clr">Clear my marks</button></div>
 <div class="pbar"><i style="width:${Math.round((S.idx+1)/n*100)}%"></i></div>
 <div class="qgrid ${c?'':'solo'}"><div><div class="card"><div id="qtext" class="${hlOn?'hlmode':''}">${qtext}</div><div id="aw"></div><div id="rat"></div><div class="nav" id="nav"></div>
 ${comp&&done?'<div class="small muted" style="margin-top:8px">🔒 This case question was locked when you moved past it.</div>':''}</div></div>${c?`<div>${ehrHTML(c,q)}</div>`:''}</div>`);
 const aw=$('#aw');let cur=ans;
 const submit=el(`<button class="btn">Submit answer</button>`);
 aw.appendChild(widget(q,ans,{ro:done,reveal,onChange:v=>{cur=v;S.ans[id]=v;if(comp){DB.inprog=S;save();}else submit.disabled=!complete(q,v);}}));
 if(reveal)$('#rat').appendChild(ratCard(q,ans));
 const nav=$('#nav');
 const goto=i=>{S.idx=i;DB.inprog=S;save();showQ();};
 if(comp){
  const p=el(`<button class="btn sec">← Previous</button>`);p.disabled=S.idx===0;p.onclick=()=>goto(S.idx-1);
  const rv=el(`<button class="btn ghost">▦ Review screen</button>`);rv.onclick=()=>{if(q.case)lockIfAnswered(id);review();};
  const nx=el(`<button class="btn">${S.idx===n-1?'Review & submit →':'Next →'}</button>`);
  nx.onclick=()=>{if(q.case&&!S.locked[id]){const nq=S.qids[S.idx+1];if(!S.ans[id]||(q.t!=='order'&&!complete(q,S.ans[id]))){if(!confirm('This case question is unanswered. Case questions lock once you move past them. Continue?'))return;}S.locked[id]=true;}
   if(S.idx===n-1)review();else goto(S.idx+1);};
  nav.append(p,rv,nx);
 }else{
  const p=el(`<button class="btn sec">← Previous</button>`);p.disabled=S.idx===0;p.onclick=()=>goto(S.idx-1);nav.appendChild(p);
  if(!done){submit.disabled=q.t==='order'?false:!complete(q,ans);submit.onclick=()=>{if(q.t==='order'&&!S.ans[id])S.ans[id]=S.ord[id].slice();S.sub[id]=true;DB.inprog=S;save();showQ();if(learnish())setTimeout(()=>$('#rat').scrollIntoView({behavior:'smooth',block:'start'}),50);};nav.appendChild(submit);}
  if(done){const nx=el(`<button class="btn">${S.idx===n-1?'Finish & see results →':'Next question →'}</button>`);nx.onclick=()=>{if(S.idx===n-1)finish();else goto(S.idx+1);};nav.appendChild(nx);}
  const fin=el(`<button class="btn ghost">End session</button>`);fin.onclick=()=>{if(confirm('End now and score submitted questions only?'))finish();};nav.appendChild(fin);
 }
 $('#flg').onclick=()=>{S.flags[id]=!S.flags[id];DB.inprog=S;save();const b=$('#flg');b.classList.toggle('on',S.flags[id]);b.textContent='⚑ '+(S.flags[id]?'Flagged':'Flag question');};
 $('#hlt').onclick=()=>{hlOn=!hlOn;$('#qtext').classList.toggle('hlmode',hlOn);const b=$('#hlt');b.classList.toggle('hon',hlOn);b.textContent='🖍 My highlighter'+(hlOn?' ON':'');};
 $('#clr').onclick=()=>{delete S.marks[id];DB.inprog=S;save();showQ();};
 $('#qtext').addEventListener('mouseup',()=>{if(!hlOn)return;const sel=window.getSelection();if(!sel.rangeCount||sel.isCollapsed)return;const rg=sel.getRangeAt(0);const qt=$('#qtext');if(!qt.contains(rg.commonAncestorContainer))return;
  try{const m=document.createElement('mark');m.className='my';m.appendChild(rg.extractContents());rg.insertNode(m);sel.removeAllRanges();S.marks[id]=qt.innerHTML;DB.inprog=S;save();}catch(e){}});
 const t=$('#tmr');t.textContent=S.timed?'⏱ '+fmt(S.deadline-S.elapsed)+' left':'⏱ '+fmt(S.elapsed);
}
function lockIfAnswered(id){if(S.ans[id]&&complete(Q(id),S.ans[id]))S.locked[id]=true;}
function review(){
 const n=S.qids.length;const st=id=>{const q=Q(id),a=S.ans[id];const answered=q.t==='order'?(S.locked[id]||S.touched&&S.touched[id]||true):complete(q,a);return answered;};
 const answeredN=S.qids.filter(id=>Q(id).t==='order'||complete(Q(id),S.ans[id])).length;
 paint(`<div class="card"><div class="row"><h2 class="sp" style="margin:0">Review screen</h2><span class="chip timer" id="tmr">⏱</span></div>
 <div class="leg"><span>🟦 Answered (${answeredN})</span><span>⬜ Unanswered (${n-answeredN})</span><span>⚑ Flagged (${S.qids.filter(i=>S.flags[i]).length})</span><span>🔒 Locked (${S.qids.filter(i=>S.locked[i]).length})</span></div>
 <div class="rg">${S.qids.map((id,i)=>{const q=Q(id);const a=q.t==='order'||complete(q,S.ans[id]);return `<button data-i="${i}" class="${a?'ans':'una'} ${S.flags[id]?'fl':''} ${S.locked[id]?'lk':''}" title="${q.case?'Case '+(Object.keys(CASES).indexOf(q.case)+1):''}">${i+1}</button>`;}).join('')}</div>
 <p class="small muted">Ordered-response items always count as answered (their starting order is your response unless you change it). Locked case questions open read-only.</p>
 <div class="nav"><button class="btn sec" id="back">← Return to question ${S.idx+1}</button><button class="btn" id="sub">Submit exam</button></div></div>`);
 $$('.rg button').forEach(b=>b.onclick=()=>{S.idx=+b.dataset.i;DB.inprog=S;save();showQ();});
 $('#back').onclick=()=>showQ();
 $('#sub').onclick=()=>{const un=n-answeredN;if(confirm(un?`${un} question(s) are unanswered and will score 0. Submit the exam?`:'Submit the exam?'))finish();};
}

/* ---------- results ---------- */
function finish(){
 stopTick();const comp=S.mode==='comp';
 const ids=comp||!learnish()?S.qids:S.qids.filter(id=>S.sub[id]);
 const per=ids.map(id=>{const q=Q(id),a=S.ans[id],ok=comp?(q.t==='order'||complete(q,a)):!!S.sub[id];const sc=ok?score(q,a):{pts:0,max:score(q,null).max,st:'none'};return Object.assign({id,q,answered:ok},sc);});
 const pts=per.reduce((a,b)=>a+b.pts,0),max=per.reduce((a,b)=>a+b.max,0)||1,pct=Math.round(pts/max*100);
 DB.hist.push({d:new Date().toISOString(),mode:S.label,pct,pts,max,n:S.qids.length,answered:per.filter(p=>p.answered).length,secs:Math.round(S.elapsed)});
 per.forEach(p=>{DB.qstats[p.id]={r:p.pts/p.max,n:((DB.qstats[p.id]||{}).n||0)+1};});
 DB.inprog=null;save();LAST={per,pts,max,pct,secs:S.elapsed,label:S.label,sess:S};results();
}
function bars(rows){return `<div class="bars">${rows.map(([name,e,m])=>{const p=m?Math.round(e/m*100):0;return `<div class="r"><span>${name}</span><span class="b"><i style="width:${p}%;background:${p>=80?'var(--ok)':p>=60?'var(--part)':'var(--bad)'}"></i></span><span><b>${p}%</b> <span class="small muted">${e}/${m}</span></span></div>`;}).join('')}</div>`;}
function group(per,f){const m={};per.forEach(p=>[].concat(f(p.q)).forEach(k=>{m[k]=m[k]||{e:0,m:0,ids:[]};m[k].e+=p.pts;m[k].m+=p.max;m[k].ids.push(p.id);}));return m;}
function weakest(m,names,lim){return Object.keys(names).filter(k=>m[k]&&m[k].e/m[k].m<0.8).sort((a,b)=>m[a].e/m[a].m-m[b].e/m[b].m).slice(0,lim);}
function results(){
 const {per,pts,max,pct,secs}=LAST;S=LAST.sess;
 const full=per.filter(p=>p.st==='full').length,part=per.filter(p=>p.st==='part').length,none=per.filter(p=>p.st==='none').length;
 const byBp=group(per,q=>q.bp);const BPN={};BP_ORDER.forEach(k=>BPN[k]=BP[k][1]);const wB=weakest(byBp,BPN,5);
 const bySk=group(per,q=>q.cj),byTo=group(per,q=>q.topic),byCa=group(per,q=>q.cats),byTy=group(per,q=>q.t);
 const rows=(m,names)=>Object.keys(names).filter(k=>m[k]).map(k=>[names[k],m[k].e,m[k].m]);
 const missed=per.filter(p=>p.st!=='full');
 const wT=weakest(byTo,TOPICS,3),wS=weakest(bySk,CJ,2),wC=weakest(byCa,CATS,2),wY=weakest(byTy,TYPES,3);
 const hyMiss=missed.filter(p=>p.q.hy);
 const rb=(ids,label)=>`<button class="btn sm sec" data-rt='${JSON.stringify(ids)}' data-lb="${esc(label)}">🔁 Retest this ${label.startsWith('Skill')?'skill':'topic'}</button>`;
 paint(`<div class="card"><div class="row"><div class="sp"><div class="muted">${esc(LAST.label)} — results</div><div class="big">${pct}%</div><div>${pts} of ${max} points</div></div>
 <div class="stats" style="flex:2;min-width:280px"><div class="stat"><b>${per.filter(p=>p.answered).length}/${per.length}</b>Questions completed</div><div class="stat"><b style="color:var(--ok)">${full}</b>Fully correct</div><div class="stat"><b style="color:var(--part)">${part}</b>Partially correct</div><div class="stat"><b style="color:var(--bad)">${none}</b>Incorrect / unanswered</div><div class="stat"><b>${fmt(secs)}</b>Time taken</div></div></div>
 <p class="disc">Practice scoring only — not the official NCLEX scoring algorithm.</p></div>
 <div class="card"><h3>Performance by NCJMM skill</h3>${bars(rows(bySk,CJ))}</div>
 <div class="card"><h3>Performance by Module 10 topic</h3>${bars(rows(byTo,TOPICS))}</div>
 <div class="card"><h3>Performance by Exam 4 study-guide item</h3><p class="small muted">Items from the professor's Learning Map tested in this session.</p>${bars(BP_ORDER.filter(k=>byBp[k]).map(k=>[BP[k][1]+' <span class="small muted">· '+BP[k][0]+'</span>',byBp[k].e,byBp[k].m]))}</div>
 <div class="card"><h3>Performance by question category</h3>${bars(rows(byCa,CATS))}</div>
 <div class="card"><h3>Performance by question type</h3>${bars(rows(byTy,TYPES))}</div>
 <div class="card rem"><h3>Personalized remediation report</h3>
  <h4>1 · Blueprint topics to review first</h4>${wT.length?`<ol>${wT.map(k=>`<li><b>${TOPICS[k]}</b> — ${Math.round(byTo[k].e/byTo[k].m*100)}%. Re-read the matching lecture deck (see sources on each missed item). ${rb(byTo[k].ids,'Topic: '+TOPICS[k])}</li>`).join('')}</ol>`:'<p>✅ Every topic scored 80% or higher.</p>'}
  ${wB.length?`<p><b>Exam 4 study-guide items below 80%:</b></p><ol>${wB.map(k=>`<li>${BP[k][0]} → <b>${BP[k][1]}</b> — ${Math.round(byBp[k].e/byBp[k].m*100)}%. ${rb(byBp[k].ids,'Topic: '+BP[k][1])}</li>`).join('')}</ol>`:''}
  <h4>2 · Clinical judgment (NCJMM) skill gaps</h4>${wS.length?`<ol>${wS.map(k=>`<li><b>${CJ[k]}</b> — ${Math.round(byS(k))}%. ${SKILL_TIP[k]} ${rb(bySk[k].ids,'Skill: '+CJ[k])}</li>`).join('')}</ol>`:'<p>✅ No skill below 80%.</p>'}
  <h4>3 · Nursing question categories</h4>${wC.length?`<ol>${wC.map(k=>`<li><b>${CATS[k]}</b> — ${Math.round(byCa[k].e/byCa[k].m*100)}%. ${rb(byCa[k].ids,'Topic: '+CATS[k])}</li>`).join('')}</ol>`:'<p>✅ All categories 80% or higher.</p>'}
  <h4>4 · Question-type strategy</h4>${wY.length?`<ul>${wY.map(k=>`<li><b>${TYPES[k]}</b> (${Math.round(byTy[k].e/byTy[k].m*100)}%): ${TYPE_TIP[k]}</li>`).join('')}</ul>`:'<p>✅ No item type below 80%.</p>'}
  <h4>5 · Safety-critical (high-yield) misses</h4>${hyMiss.length?`<ul>${hyMiss.map(p=>`<li>${p.q.take}</li>`).join('')}</ul>${rb(hyMiss.map(p=>p.id),'Topic: high-yield misses')}`:'<p>✅ No high-yield items missed.</p>'}
  <h4>6 · Your study plan</h4><ol><li>Retest the weakest topic above in Learn-style retest until ≥80%.</li><li>Re-read the NCLEX takeaways below out loud — they are the rules the exam tests.</li><li>Redo the full unfolding case(s) you missed items in (NGN Case Study mode).</li><li>Finish with a timed Comprehensive Exam.</li></ol>
 </div>
 <div class="card"><h3>Missed questions by topic (${missed.length})</h3>${Object.keys(TOPICS).filter(k=>missed.some(p=>p.q.topic===k)).map(k=>`<h4 style="margin:10px 0 4px">${TOPICS[k]}</h4><ul>${missed.filter(p=>p.q.topic===k).map(p=>`<li><span class="small muted">${p.pts}/${p.max} · ${TYPES[p.q.t]}${p.answered?'':' · unanswered'}</span><br>${p.q.stem.replace(/<[^>]+>/g,'').slice(0,160)}…<br><span class="small"><b>Takeaway:</b> ${p.q.take}</span></li>`).join('')}</ul>`).join('')||'<p>🎉 None missed.</p>'}
 <div class="nav"><button class="btn" id="all">Show every question with rationale</button><button class="btn sec" id="rmiss" ${missed.length?'':'disabled'}>🔁 Retest all missed questions</button><button class="btn ghost" id="hm">🏠 Home</button></div></div>`);
 function byS(k){return bySk[k].e/bySk[k].m*100;}
 $$('[data-rt]').forEach(b=>b.onclick=()=>newSession('retest',JSON.parse(b.dataset.rt),{label:'Retest — '+b.dataset.lb.replace(/^(Topic|Skill): /,'')}));
 $('#rmiss').onclick=()=>newSession('retest',missed.map(p=>p.id),{label:'Retest — all missed'});
 $('#hm').onclick=()=>{S=null;home();};
 $('#all').onclick=showAll;
}
function showAll(){
 const {per}=LAST;S=LAST.sess;
 paint(`<div class="card row"><h2 class="sp" style="margin:0">Every question with rationale</h2><button class="btn sec" id="bk">← Back to results</button></div><div id="list"></div>`);
 const L=$('#list');let lastCase=null;
 per.forEach((p,i)=>{const q=p.q,c=q.case?CASES[q.case]:null;
  const card=el(`<div class="card"><div class="typ">Question ${i+1} · ${TYPES[q.t]}${c?' · '+esc(c.title):''}</div>${c&&lastCase!==q.case?`<div class="newcase"><b class="lb">Case</b><div>${c.scenario}</div></div>`:''}${c&&q.lead?`<div class="upd"><b class="lb">Case update · ${esc(q.time||'')}</b><div>${q.lead}</div></div>`:''}<div class="stem">${q.stem}</div></div>`);
  lastCase=q.case||null;card.appendChild(widget(q,p.answered?S.ans[q.id]:null,{ro:true,reveal:true}));card.appendChild(ratCard(q,p.answered?S.ans[q.id]:null));L.appendChild(card);});
 $('#bk').onclick=results;
}
const SKILL_TIP={rc:'Practice separating expected newborn/pediatric findings from abnormal ones before deciding what they mean.',ac:'Link each cue to its physiology — ask "what mechanism explains this finding?"',ph:'Rank problems by threat to airway, breathing, circulation and neurologic status; actual beats potential.',gs:'For each problem, list what would treat the cause, prevent harm and provide comfort — then remove anything unsafe.',ta:'Choose the action that addresses the most dangerous cue first; escalation is an action.',eo:'Evaluation answers restate the original abnormal cues as now-normal, measurable findings.'};

/* ---------- boot ---------- */
window.addEventListener('DOMContentLoaded',()=>{load();document.documentElement.dataset.theme=DB.theme;
 Object.entries(CASES).forEach(([k,c])=>{c.qs=QS.filter(q=>q.case===k).map(q=>q.id);});
 home();});
</script></body></html>
