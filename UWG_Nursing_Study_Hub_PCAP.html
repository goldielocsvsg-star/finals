["Escalating workplace violence",["Recognize warning signs","Keep distance and an exit route","Use de-escalation if safe","Summon help and report"]]];
const FL=["Near miss: one guide uses a broader definition; the faculty key separates intercepted errors (near miss) from errors reaching the patient without harm (no-harm event). Use the faculty distinction.",
"Malpractice: course guide lists FIVE elements (duty, breach, foreseeability, causation, damages); the other guide groups them into FOUR. Practice Q16 key uses four. Follow your course framework.",
"Lab 1 Activity B says no lasting harm means no malpractice claim, but the faculty note says lack of lasting harm does not necessarily mean no compensable damages (this patient reached glucose 38 mg/dL). Verify with faculty.",
"Delegation, LPN scope, consent, EMTALA, reimbursement and accreditation rules vary by state/facility and change; check current law and policy.",
"Sentinel event definitions vary by accrediting body; consult current definitions.",
"Exam weighting is not provided; the review is a content map, not a prediction.",
"Not included in the quizzes: the two select-all-that-apply items and open-response worksheet items, which need faculty grading. Key Terms, mnemonics and tables in Cheat Sheets are condensed from the guide."];
/* ===== DERIVED DATA ===== */
const IT=[];M.forEach((m,i)=>m[2].forEach(r=>{const[t,...x]=r.split('|');IT.push({m:i,t,x:x.join('|')})}));
const MD=MEDS.map(r=>{const[t,...x]=r.split('|');return{t,x:x.join('|')}});
const mk=(q,a,r,pool)=>{const d=sh([...new Set(pool)].filter(x=>x!==a)).slice(0,3);return{q,a,r,o:sh([a,...d])}};
const PA=P.map(p=>p[1]);
const qP=()=>P.map(p=>p[3]?{q:p[0],a:p[1],r:p[2],o:sh(p[3])}:mk(p[0],p[1],p[2],PA));
const qM=i=>IT.filter(z=>i<0||z.m===i).map(z=>mk('Which topic is described? '+z.x,z.t,'<b>'+z.t+'</b>: '+z.x,IT.filter(y=>y.m===z.m).map(y=>y.t)));
const qD=()=>MD.map(z=>mk('Which key term? '+z.x,z.t,'<b>'+z.t+'</b>: '+z.x,MD.map(y=>y.t)));
let cur='Modules';
/* ===== QUIZ ENGINE ===== */
function run(qs,el,title){let i=0,sc=0,w=[];
const show=()=>{if(i>=qs.length){const p=Math.round(sc/qs.length*100);S.scores.push({t:title,p,n:qs.length,d:new Date().toLocaleDateString()});save();prog();
el.innerHTML=`<div class=card><h2>${title}: ${sc}/${qs.length} (${p}%)</h2><p>${p>=80?'Strong result. Keep reviewing missed items.':'Review the missed items below, then try again.'}</p>${w.length?'<h3>Missed items</h3>'+w.map(x=>`<p><b>${x.q}</b><br>Answer: ${x.a}<br><span class=muted>${x.r}</span></p>`).join(''):''}<button class=btn onclick="go(cur)">Back</button></div>`;return}
const q=qs[i];el.innerHTML=`<div class=card><div class=muted>${title} &bull; Question ${i+1} of ${qs.length} &bull; Score ${sc}</div><h3>${q.q}</h3>${q.o.map((o,k)=>`<button class=opt data-k=${k}>${o}</button>`).join('')}<div id=fb></div></div>`;
let d=0;el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(d)return;d=1;const ok=q.o[+b.dataset.k]===q.a;
el.querySelectorAll('.opt').forEach(x=>{if(q.o[+x.dataset.k]===q.a)x.classList.add('ok')});if(ok)sc++;else{b.classList.add('no');w.push(q)}
$('#fb').innerHTML=`<p><b>${ok?'Correct.':'Not quite.'}</b> ${q.r}</p><button class=btn id=nx>${i+1<qs.length?'Next question':'See score'}</button>`;$('#nx').onclick=()=>{i++;show()}})};show()}
/* ===== VIEWS ===== */
const V={
Modules(){const a=$('#app');a.innerHTML='<h2>Study Modules</h2><p class=muted>Pick a module. Open each topic, read the memory trick, then take the module quiz.</p><div class=grid>'+M.map((m,i)=>`<div class=mod style="background:${COL[i]}" onclick="mod(${i})" tabindex=0><b>Module ${i+1}</b>${S.done[i]?' ✅':''}<br>${m[0]}<br><span class=muted>${m[2].length} topics</span></div>`).join('')+'</div>'},
Terms(){$('#app').innerHTML=`<h2>Key Terms Center</h2><p class=muted>${MD.length} key terms and acronyms from all 9 modules (this course has no medication blueprint).</p><input class=in id=mf placeholder="Filter terms..." style="width:100%"><div id=ml></div>`;
const f=()=>{const v=$('#mf').value.toLowerCase();$('#ml').innerHTML=MD.filter(z=>(z.t+z.x).toLowerCase().includes(v)).map(z=>`<details style="--c:${/ANTIDOTE|AVOID|CONTRA/.test(z.x)?'#ff9fb2':'#b9a8ff'}"><summary>${z.t}</summary><p>${z.x.replace(/(ANTIDOTE[^.]*\.?|AVOID[^.]*\.?|CONTRAINDICATED[^.]*\.?)/g,'<b style="color:#c0334f">$1</b>')}</p></details>`).join('')};$('#mf').oninput=f;f()},
Cards(){const a=$('#app');a.innerHTML=`<h2>Flashcards</h2><select id=dk>${M.map((m,i)=>`<option value=${i}>Module ${i+1}: ${m[0]}</option>`).join('')}<option value=med>Key Terms</option></select> <button class="btn alt" id=shf>Shuffle</button><div id=fcw></div>`;
let deck=[],k=0;const load=()=>{const v=$('#dk').value;deck=(v=='med'?MD.map((z,i)=>({...z,id:'med'+i})):IT.filter(z=>z.m==v).map((z,i)=>({...z,id:v+'_'+i})));k=0;draw()};
const draw=()=>{const c=deck[k],kn=deck.filter(d=>S.known[d.id]).length;$('#fcw').innerHTML=`<p class=muted>Card ${k+1} of ${deck.length} &bull; Mastered ${kn}</p><div class=fc id=fc><div class=fi><div class="fs fr">${c.t}</div><div class="fs bk">${c.x}</div></div></div><button class="btn alt" id=pv>Back</button> <button class=btn id=ok>${S.known[c.id]?'Mastered ✓ (undo)':'I know this'}</button> <button class="btn alt" id=nx>Next</button>`;
$('#fc').onclick=e=>e.currentTarget.classList.toggle('f');$('#pv').onclick=()=>{k=(k+deck.length-1)%deck.length;draw()};$('#nx').onclick=()=>{k=(k+1)%deck.length;draw()};$('#ok').onclick=()=>{S.known[c.id]=!S.known[c.id];save();prog();draw()}};
$('#dk').onchange=load;$('#shf').onclick=()=>{deck=sh(deck);k=0;draw()};load()},
Quiz(){$('#app').innerHTML=`<h2>Practice Quizzes</h2><p class=muted>NCLEX-style multiple choice with rationales and automatic scoring.</p><div class=card><select id=qs><option value=p>NCLEX-style practice questions</option><option value=d>Key term identification</option>${M.map((m,i)=>`<option value=${i}>Module ${i+1}: ${m[0]}</option>`).join('')}</select> <button class=btn id=go>Start 10-question quiz</button></div><div id=qa></div>`;
$('#go').onclick=()=>{const v=$('#qs').value,l=v=='p'?qP():v=='d'?qD():qM(+v);run(sh(l).slice(0,10),$('#qa'),'Quiz')}},
Exam(){$('#app').innerHTML=`<h2>Final Exam Simulator</h2><div class=card><p>50 cumulative questions drawn at random from all 9 modules (${P.length} practice items plus ${IT.length} concept items). No hints. Review missed items at the end.</p><button class=btn id=ex>Start 50-question exam</button></div><div id=qa></div>`;
$('#ex').onclick=()=>run(sh([...qP(),...qM(-1)]).slice(0,50),$('#qa'),'Final Exam')},
Games(){$('#app').innerHTML=`<h2>Learning Games</h2><button class=btn id=g1>Matching</button> <button class=btn id=g2>Term ID</button> <button class=btn id=g3>Prioritization</button> <button class=btn id=g4>Clinical scenarios</button><div id=gm style="margin-top:12px"></div>`;
const g=$('#gm');
$('#g1').onclick=()=>{const m=Math.floor(Math.random()*9),r=sh(IT.filter(z=>z.m==m)).slice(0,6);let sel=null,n=0,mv=0;
const d=()=>{g.innerHTML=`<div class=card><b>Match each topic to its description</b> (Module ${m+1}) &bull; Moves ${mv}</div><div class=mg><div>${sh(r).map(z=>`<button data-t=${r.indexOf(z)} class="L ${z.dn?'done':''}">${z.t}</button>`).join('')}</div><div>${sh(r).map(z=>`<button data-r=${r.indexOf(z)} class="R ${z.dn?'done':''}">${z.x.slice(0,110)}...</button>`).join('')}</div></div>${n==6?`<div class=card>All matched in ${mv} moves!</div>`:''}`;
g.querySelectorAll('.L').forEach(b=>b.onclick=()=>{sel=+b.dataset.t;g.querySelectorAll('.L').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')});
g.querySelectorAll('.R').forEach(b=>b.onclick=()=>{if(sel===null)return;mv++;if(sel===+b.dataset.r&&!r[sel].dn){r[sel].dn=1;n++}sel=null;d()})};d()};
$('#g2').onclick=()=>run(sh(qD()).slice(0,10),g,'Term ID');
$('#g4').onclick=()=>run(sh(qP()).slice(0,8),g,'Clinical scenarios');
$('#g3').onclick=()=>{const s=PRI[Math.floor(Math.random()*PRI.length)];let nx=0,bad=0;
const d=()=>{g.innerHTML=`<div class=card><b>Prioritize: ${s[0]}</b><p class=muted>Click the actions in the correct order. Mistakes: ${bad}</p></div>`+sh(s[1]).map(x=>`<button class=opt ${s[1].indexOf(x)<nx?'style="background:#d4f5dd"':''} data-i=${s[1].indexOf(x)}>${x}</button>`).join('')+(nx==4?`<div class=card>Done with ${bad} mistake(s). <button class=btn onclick="$('#g3').click()">Another scenario</button></div>`:'');
g.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(+b.dataset.i==nx)nx++;else bad++;d()})};d()}},
Cheats(){$('#app').innerHTML=`<h2>Cheat Sheets</h2>
<div class=card><h3>Rapid review hooks</h3><ul><li><b>Prevention:</b> prevent / detect / reduce complications</li><li><b>Equity</b> removes barriers; <b>equality</b> gives the same resources</li><li><b>HBM:</b> risk, seriousness, benefit, barrier, trigger, confidence</li><li><b>EAT</b> stays with the RN (Evaluation, Assessment, Teaching)</li><li><b>Evidence + specific ask</b> for advocacy</li><li><b>Medicare:</b> A admission, B visits, C Advantage, D drugs</li><li><b>Catch / reach / harm:</b> near miss, no-harm event, adverse event</li><li><b>SBAR</b> tells; <b>CUS</b> escalates</li><li><b>Threat vs touch:</b> assault vs battery</li><li><b>AI assists; RN decides</b></li><li><b>License permits; certification recognizes</b></li></ul></div>
<div class=card><h3>Delegation by role</h3><div class=tw><table><tr><th>Role</th><th>Typical assignment</th></tr><tr><td>UAP/CNA</td><td>ADLs, ambulation, routine VS on stable patients, I&amp;O, non-sterile specimens</td></tr><tr><td>LPN/LVN</td><td>Stable, predictable patients; oral/IM/SubQ meds, sterile dressings, catheterization (varies by state)</td></tr><tr><td>New grad RN</td><td>Stable patients on standard protocols</td></tr><tr><td>Float RN</td><td>General skills matching home unit</td></tr><tr><td>Experienced RN</td><td>Unstable, complex, new admissions, post-op</td></tr></table></div></div>
<div class=card><h3>Event classification</h3><div class=tw><table><tr><th>Event</th><th>Meaning</th></tr><tr><td>Near miss</td><td>Intercepted; never reached patient</td></tr><tr><td>No-harm event</td><td>Reached patient, no harm</td></tr><tr><td>Adverse event</td><td>Injury from care</td></tr><tr><td>Sentinel event</td><td>Death or serious injury</td></tr></table></div></div>
<div class=card><h3>Medicare quick table</h3><div class=tw><table><tr><th>Part</th><th>Covers</th></tr><tr><td>A</td><td>Inpatient hospital, SNF, hospice</td></tr><tr><td>B</td><td>Outpatient, provider visits, preventive</td></tr><tr><td>C</td><td>Medicare Advantage (private)</td></tr><tr><td>D</td><td>Prescription drugs</td></tr></table></div></div>
<div class=card><h3>⚠ Flagged for verification</h3>${FL.map(f=>`<div class=flag>${f}</div>`).join('')}</div>`},
Progress(){const kn=Object.values(S.known).filter(Boolean).length,tot=IT.length+MD.length,best=Math.max(0,...S.scores.filter(s=>s.t=='Final Exam').map(s=>s.p));
$('#app').innerHTML=`<h2>My Progress</h2><div class=card><p>Modules complete: <b>${Object.values(S.done).filter(Boolean).length}/9</b></p><p>Flashcards mastered: <b>${kn}/${tot}</b></p><p>Quizzes taken: <b>${S.scores.length}</b> &bull; Best final exam: <b>${S.scores.some(s=>s.t=='Final Exam')?best+'%':'none yet'}</b></p><p class=muted>Progress saves in this browser on this device only.</p></div><div class=card><h3>Recent scores</h3>${S.scores.slice(-15).reverse().map(s=>`<p>${s.d}: ${s.t} &mdash; <b>${s.p}%</b> (${s.n} q)</p>`).join('')||'<p class=muted>No quizzes yet. Take one from the Quiz tab.</p>'}</div><button class="btn alt" id=rs>Reset all progress</button>`;
$('#rs').onclick=()=>{if(confirm('Reset all progress?')){S={done:{},known:{},scores:[]};save();prog();V.Progress()}}}
};
function mod(i){const m=M[i],a=$('#app'),c=COL[i];
a.innerHTML=`<button class="btn alt" onclick="go('Modules')">All modules</button><div class=card style="background:${c};margin-top:10px"><h2>Module ${i+1}: ${m[0]}</h2><label><input type=checkbox id=dn ${S.done[i]?'checked':''}> Mark module complete</label></div><div class=mt><b>Memory trick:</b> ${m[1]}</div>${m[3]?`<div class="card tw"><h3>Comparison chart</h3><table>${m[3].map((r,j)=>'<tr>'+r.map(x=>j?`<td>${x}</td>`:`<th>${x}</th>`).join('')+'</tr>').join('')}</table></div>`:''}<button class="btn alt" id=ea>Expand all</button> <button class=btn id=mq>Quiz this module</button><div id=rw>${IT.filter(z=>z.m==i).map(z=>`<details style="--c:${c}"><summary>${z.t}</summary><p>${z.x}</p></details>`).join('')}</div><div id=qa></div>`;
$('#dn').onchange=e=>{S.done[i]=e.target.checked;save();prog()};let o=0;$('#ea').onclick=()=>{o=!o;a.querySelectorAll('#rw details').forEach(d=>d.open=o)};
$('#mq').onclick=()=>{$('#rw').style.display='none';run(sh(qM(i)).slice(0,10),$('#qa'),'Module '+(i+1)+' quiz')};scrollTo(0,0)}
function prog(){const d=Object.values(S.done).filter(Boolean).length;$('#bar i').style.width=d*100/9+'%';$('#bt').textContent=d+' of 9 modules complete'}
function go(t){cur=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.textContent==t));V[t]();scrollTo(0,0)}
$('#nav').innerHTML=Object.keys(V).map(t=>`<button>${t}</button>`).join('');document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.textContent));
$('#q').oninput=e=>{const v=e.target.value.trim().toLowerCase();if(!v){go(cur);return}
const r=[...IT.map(z=>({...z,k:'Module '+(z.m+1),c:COL[z.m]})),...MD.map(z=>({...z,k:'Medication',c:'#ffd6e0'}))].filter(z=>(z.t+' '+z.x).toLowerCase().includes(v)).slice(0,40);
$('#app').innerHTML=`<h2>${r.length} result(s) for "${v}"</h2>`+r.map(z=>`<details open style="--c:${z.c}"><summary>${z.t} <span class=pill>${z.k}</span></summary><p>${z.x}</p></details>`).join('')};
prog();go('Modules');
</script></body></html>
